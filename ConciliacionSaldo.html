<script>
  /**
   * ConciliacionSaldo.html
   *
   * Vista administrativa para vincular movimientos físicos de traspaso con
   * el folio registrado en el sistema administrativo.
   *
   * Responsabilidades:
   * - Consultar grupos de movimientos pendientes de conciliación.
   * - Mostrar productos, rutas, cantidades e inconsistencias administrativas.
   * - Filtrar grupos por búsqueda, estado y tipo de movimiento.
   * - Validar el folio y el responsable antes de enviar una conciliación.
   * - Registrar todas las filas pendientes que pertenecen a un mismo grupo.
   * - Actualizar el resumen local y retirar visualmente los grupos atendidos.
   * - Medir carga, respuesta del servidor, renderizado y registro.
   * - Administrar el ciclo de vida de la raíz React de la vista.
   *
   * Dependencias globales:
   * - React y ReactDOM.
   * - Lucide.
   * - google.script.run.
   * - window.notificar o window.lanzarNotificacion.
   *
   * Controladores consumidos:
   * - ConciliacionSaldoController_obtenerBootstrap().
   * - ConciliacionSaldoController_registrarConciliacion(payload).
   *
   * Contratos globales expuestos:
   * - window.cargar_ConciliacionSaldo().
   * - window.initVista.
   * - window.__CONCILIACION_SALDO_ROOT__.
   *
   * Invariantes operativos:
   * - El folio se normaliza a caracteres numéricos y un máximo de 80 dígitos.
   * - El responsable debe existir en el catálogo recibido por el bootstrap.
   * - Solo los grupos conciliables pueden enviarse al servidor.
   * - savingRef impide solicitudes concurrentes dentro de una misma tarjeta.
   * - Las respuestas obsoletas se descartan mediante secuencias incrementales.
   * - El servidor conserva la autoridad final sobre validación y persistencia.
   * - Este archivo no contiene scriptlets de plantilla de Apps Script.
   */
</script>

<div id="render-conciliacion-saldo"></div>

<script type="text/babel">
  window.cargar_ConciliacionSaldo = () => {
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    /**
     * Inicia una traza de rendimiento del cliente.
     * @param {string} operation Nombre estable de la operación.
     * @param {Object=} metadata Contexto inicial.
     * @return {Object} Traza mutable.
     */
    const csPerfStart_ = (operation, metadata = {}) => {
      const now = performance.now();
      return { operation: String(operation || "CONCILIACION_OPERATION"), startedAt: now, lastAt: now, metadata: metadata && typeof metadata === "object" ? metadata : {}, marks: [], ended: false };
    };

    /**
     * Agrega una marca temporal a una traza activa.
     * @param {Object} trace Traza iniciada previamente.
     * @param {string} stage Etapa registrada.
     * @param {Object=} metadata Contexto de la etapa.
     * @return {void}
     */
    const csPerfMark_ = (trace, stage, metadata = {}) => {
      if (!trace || trace.ended === true) return;
      const now = performance.now();
      trace.marks.push({ etapa: String(stage || "MARK"), segmento_ms: Number((now - trace.lastAt).toFixed(1)), acumulado_ms: Number((now - trace.startedAt).toFixed(1)), metadata: metadata && typeof metadata === "object" ? metadata : {} });
      trace.lastAt = now;
    };

    /**
     * Finaliza y publica una traza de rendimiento.
     * @param {Object} trace Traza activa.
     * @param {string=} status Estado final.
     * @param {Object=} metadata Contexto final.
     * @return {Object|null} Resultado consolidado o null.
     */
    const csPerfEnd_ = (trace, status = "ok", metadata = {}) => {
      if (!trace || trace.ended === true) return null;
      trace.ended = true;
      const result = { operation: trace.operation, status: String(status || "ok"), totalMs: Number((performance.now() - trace.startedAt).toFixed(1)), metadata: Object.assign({}, trace.metadata, metadata || {}), marks: trace.marks.slice() };
      console.log(`[APPALMACEN][PERF][${result.operation}] ${result.totalMs} ms | ${result.status}`);
      if (typeof console.table === "function") console.table(result.marks); else console.log(result.marks);
      console.log("Metadatos:", result.metadata);
      return result;
    };

    /** Ejecuta una acción después de dos ciclos de pintura. */
    const csAfterPaint_ = callback => {
      window.requestAnimationFrame(() => window.requestAnimationFrame(callback));
    };

    /**
     * Emite una notificación mediante la infraestructura global del shell.
     * @param {string} message Mensaje visible.
     * @param {string=} type Tipo de notificación.
     * @param {number=} timer Duración en milisegundos.
     * @param {Object=} options Opciones adicionales.
     * @return {void}
     */
    const notify_ = (message, type = "info", timer = 2600, options = {}) => {
      const fn = window.notificar || window.lanzarNotificacion;
      if (typeof fn === "function") fn(message, type, timer, options);
    };
    const str_ = value => String(value == null ? "" : value).trim();
    const upper_ = value => str_(value).toUpperCase();
    const numericFolio_ = value => String(value == null ? "" : value).replace(/\D/g, "").slice(0, 80);
    const num_ = value => Number.isFinite(Number(value)) ? Number(value) : 0;
    const formatNumber_ = value => num_(value).toLocaleString("es-MX", { maximumFractionDigits: 2 });

    /** Renderiza un icono Lucide aislado dentro de la vista. */
    function Icon({ name, size = 17, className = "" }) {
      const ref = useRef(null);
      useEffect(() => {
        if (!window.lucide || !ref.current) return;
        ref.current.innerHTML = "";
        const element = document.createElement("i");
        element.setAttribute("data-lucide", name || "circle");
        element.style.width = `${size}px`;
        element.style.height = `${size}px`;
        element.className = className;
        ref.current.appendChild(element);
        window.lucide.createIcons({ nodes: [element] });
      }, [name, size, className]);
      return <span ref={ref} className="inline-flex items-center justify-center" />;
    }

    /** Renderiza una métrica compacta del encabezado. */
    function Metric({ label, value, tone = "" }) {
      return <div className={`cs-metric ${tone}`}><div className="cs-metric-value">{formatNumber_(value)}</div><div className="cs-metric-label">{label}</div></div>;
    }

    /**
     * Renderiza un movimiento y sus validaciones administrativas.
     * @param {{movement:Object}} props Movimiento normalizado.
     * @return {React.ReactElement}
     */
    function MovementRow({ movement }) {
      const validation = movement.validacionadministrativa || {};
      const valid = validation.valido === true;
      const type = upper_(movement.tipomovimiento);
      const visibleErrors = (validation.errores || []).filter(error => upper_(error) !== "ALMACEN_SALIDA_IGUAL_A_ENTRADA");
      return (
        <div className={`cs-movement ${valid ? "" : "invalid"}`}>
          <span className={`cs-movement-type ${type === "ACOMODO" ? "acomodo" : "surtido"}`}>{type || "SIN TIPO"}</span>
          <div className="cs-movement-product"><div className="cs-sku">{movement.codigo || "SIN SKU"}</div><div className="cs-idunico">{movement.idunico || "SIN IDUNICO"}</div></div>
          <div className="cs-movement-description"><div className="cs-description">{movement.descripcion || "SIN DESCRIPCIÓN"}</div><div className="cs-description">Serie / ubicación: <strong>{movement.serie || "SIN SERIE"}</strong></div></div>
          <div className="cs-route-point cs-warehouse-out"><div className="cs-route-label"><Icon name="log-out" size={15} /><span>Almacén de salida</span></div><div className="cs-warehouse">{movement.almacensalidaadministrativo || "ALMACÉN DE SALIDA NO RECONOCIDO"}</div></div>
          <div className="cs-route-arrow" aria-hidden="true"><Icon name="arrow-right" size={22} /></div>
          <div className="cs-route-point cs-warehouse-in"><div className="cs-route-label"><Icon name="log-in" size={15} /><span>Almacén de entrada</span></div><div className="cs-warehouse">{movement.almacenentradaadministrativo || "ALMACÉN DE ENTRADA NO RECONOCIDO"}</div></div>
          <div className="cs-quantity-block"><span className="cs-quantity-label">Cantidad</span><strong className="cs-quantity">{formatNumber_(movement.cantidadadministrativa)}</strong><span className="cs-quantity-unit">Pzas</span></div>
          {visibleErrors.length > 0 && <div className="cs-error-list">{visibleErrors.join(" · ")}</div>}
        </div>
      );
    }

    /**
     * Tarjeta autónoma para validar y registrar la conciliación de un grupo.
     * @param {Object} props Propiedades del grupo y catálogo de responsables.
     * @return {React.ReactElement}
     */
    function ConciliationCard({ group, index, responsibles, onRegistered }) {
      const [folio, setFolio] = useState("");
      const [responsible, setResponsible] = useState("");
      const [saving, setSaving] = useState(false);
      const [exiting, setExiting] = useState(false);
      const [message, setMessage] = useState("");
      const savingRef = useRef(false);
      const mountedRef = useRef(true);

      useEffect(() => () => { mountedRef.current = false; }, []);
      const responsibleValid = useMemo(() => {
        const value = upper_(responsible);
        return responsibles.some(item => upper_(item && item.nombre) === value);
      }, [responsible, responsibles]);
      const folioValid = /^\d+$/.test(folio);
      const canRegister = group.conciliable === true && folioValid && responsibleValid && !saving && !exiting;
      const cardTone = group.conciliable ? "is-valid" : group.inconsistentes > 0 ? "is-invalid" : "is-warning";

      /** Valida la captura y registra la conciliación del grupo actual. */
      const register_ = () => {
        if (savingRef.current) {
          console.log("[APPALMACEN][PERF][CONCILIACION_REGISTRAR_SKIPPED]", { clavegrupo: group.clavegrupo, reason: "REQUEST_ALREADY_IN_FLIGHT" });
          return;
        }
        const trace = csPerfStart_("CONCILIACION_REGISTRAR", { clavegrupo: group.clavegrupo, serie: group.serie, filas: Array.isArray(group.filaspendientes) ? group.filaspendientes.length : 0, movimientos: Number(group.totalmovimientos || 0) });
        csPerfMark_(trace, "ACTION_ACCEPTED");
        if (!canRegister) {
          const validationMessage = group.conciliable !== true ? "El grupo contiene movimientos que requieren corrección." : !folio ? "Captura el folio administrativo." : !folioValid ? "El folio debe contener únicamente números y no puede ser negativo." : "Selecciona un responsable válido.";
          setMessage(validationMessage);
          csPerfMark_(trace, "CLIENT_VALIDATION_REJECTED", { conciliable: group.conciliable === true, folioValid, responsibleValid });
          csAfterPaint_(() => csPerfEnd_(trace, "validation_error", { message: validationMessage }));
          return;
        }
        savingRef.current = true;
        setSaving(true);
        setMessage("");
        const payload = { clavegrupo: group.clavegrupo, filas: Array.isArray(group.filaspendientes) ? group.filaspendientes.slice() : [], folio: numericFolio_(folio), responsable: upper_(responsible) };
        csPerfMark_(trace, "PAYLOAD_READY", { rows: payload.filas.length, payloadBytes: JSON.stringify(payload).length });
        csPerfMark_(trace, "SERVER_REQUEST_STARTING");
        google.script.run
          .withSuccessHandler(response => {
            savingRef.current = false;
            if (!mountedRef.current) { csPerfEnd_(trace, "ignored", { reason: "CARD_UNMOUNTED" }); return; }
            setSaving(false);
            csPerfMark_(trace, "SERVER_RESPONSE_RECEIVED", { ok: Boolean(response && response.ok === true), actualizados: Number(response && response.actualizados || 0), omitidos: Number(response && response.omitidos || 0) });
            if (!response || response.ok !== true) {
              const text = response && response.mensaje ? response.mensaje : "El servidor no confirmó la conciliación.";
              setMessage(text);
              notify_(text, "warning", 4200, { title: "Conciliación no registrada", sound: true });
              csAfterPaint_(() => { csPerfMark_(trace, "WARNING_UI_PAINT_COMPLETED"); csPerfEnd_(trace, "rejected", { message: text, actualizados: 0 }); });
              return;
            }
            notify_(`${response.actualizados || 0} movimiento(s) vinculados al folio ${response.folio}.`, "success", 2800, { title: "Conciliación registrada", sound: true });
            setExiting(true);
            csPerfMark_(trace, "EXIT_ANIMATION_REQUESTED");
            window.setTimeout(() => {
              if (!mountedRef.current) { csPerfEnd_(trace, "ok", { actualizados: Number(response.actualizados || 0), folio: response.folio || "", cardUnmounted: true }); return; }
              onRegistered(group.clavegrupo);
              csPerfMark_(trace, "GROUP_REMOVED_FROM_STATE");
              csAfterPaint_(() => { csPerfMark_(trace, "UI_PAINT_COMPLETED"); csPerfEnd_(trace, "ok", { actualizados: Number(response.actualizados || 0), folio: response.folio || "", animationMs: 340 }); });
            }, 340);
          })
          .withFailureHandler(error => {
            savingRef.current = false;
            const text = error && error.message ? error.message : "No se pudo registrar la conciliación.";
            if (!mountedRef.current) { csPerfEnd_(trace, "error", { reason: "CARD_UNMOUNTED", message: text }); return; }
            setSaving(false);
            setMessage(text);
            notify_(text, "error", 4800, { title: "Error de conciliación", sound: true });
            csPerfMark_(trace, "SERVER_REQUEST_FAILED", { message: text });
            csAfterPaint_(() => { csPerfMark_(trace, "ERROR_UI_PAINT_COMPLETED"); csPerfEnd_(trace, "error", { message: text }); });
          })
          .ConciliacionSaldoController_registrarConciliacion(payload);
      };

      return (
        <article className={`cs-card cs-card-enter ${cardTone} ${exiting ? "cs-card-exit" : ""}`} style={{ animationDelay: exiting ? "0ms" : `${Math.min(index * 55, 330)}ms` }}>
          <header className="cs-card-header">
            <div className="cs-card-identity"><div className="cs-card-primary-row"><div className="cs-series-block"><span className="cs-series-label">Serie</span><h3 className="cs-series">{group.serie || "SIN SERIE"}</h3></div><div className="cs-temporal-block"><div className="cs-temporal-datetime"><Icon name="calendar-days" size={14} /><span>{group.fecha || "SIN FECHA"}</span><span className="cs-temporal-separator">·</span><Icon name="clock-3" size={14} /><span>{group.hora || "SIN HORA"}</span></div><div className="cs-temporal-pending"><Icon name="hourglass" size={14} /><span>Pendiente: {group.tiempotranscurridotexto || "0 min"}</span></div></div></div></div>
            <div className="cs-card-stats"><span className="cs-chip slate">{group.totalmovimientos || 0} movimientos</span><span className="cs-chip green">{group.totalacomodos || 0} acomodos</span><span className="cs-chip red">{group.totalsurtidos || 0} surtidos</span><span className="cs-chip amber">{formatNumber_(group.cantidadabsoluta)} pzas</span></div>
          </header>
          <div className="cs-card-body">
            <section className="cs-movements"><div className="cs-movement-list">{(group.movimientos || []).map(movement => <MovementRow key={`${movement.fila}-${movement.idunico}`} movement={movement} />)}</div></section>
            <aside className="cs-capture">
              <label><span className="cs-field-label">Folio administrativo</span><input type="text" inputMode="numeric" pattern="[0-9]*" className="cs-input" value={folio} onChange={event => { setFolio(numericFolio_(event.target.value)); if (message) setMessage(""); }} onKeyDown={event => { if (["-","+",".",",","e","E"].includes(event.key)) event.preventDefault(); }} disabled={saving || exiting || group.conciliable !== true} maxLength={80} autoComplete="off" placeholder="Captura el folio" aria-label="Folio administrativo" /></label>
              <label><span className="cs-field-label">Responsable</span><input list={`cs-responsables-${index}`} type="text" className="cs-input" value={responsible} onChange={event => { setResponsible(event.target.value.toUpperCase()); if (message) setMessage(""); }} disabled={saving || exiting || group.conciliable !== true} autoComplete="off" placeholder="Selecciona responsable" /><datalist id={`cs-responsables-${index}`}>{responsibles.filter(item => item && item.nombre).map(item => <option key={item.nombre} value={item.nombre} />)}</datalist></label>
              {message && <div className="cs-card-message error">{message}</div>}
              <button type="button" className="cs-button primary" onClick={register_} disabled={!canRegister}><Icon name={saving ? "loader-2" : "save"} size={16} className={saving ? "animate-spin" : ""} />{saving ? "Registrando..." : "Registrar conciliación"}</button>
            </aside>
          </div>
        </article>
      );
    }

    /** Componente principal de conciliación de saldo. */
    function View() {
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [groups, setGroups] = useState([]);
      const [responsibles, setResponsibles] = useState([]);
      const [summary, setSummary] = useState({});
      const [generatedAt, setGeneratedAt] = useState({});
      const [query, setQuery] = useState("");
      const [stateFilter, setStateFilter] = useState("TRABAJO");
      const [typeFilter, setTypeFilter] = useState("TODOS");
      const mountedRef = useRef(true);
      const requestBusyRef = useRef(false);
      const loadRequestSequenceRef = useRef(0);
      const lastAppliedSequenceRef = useRef(0);

      useEffect(() => { mountedRef.current = true; return () => { mountedRef.current = false; }; }, []);

      /** Aplica al estado React un bootstrap normalizado. */
      const applyResponse_ = useCallback(response => {
        if (!mountedRef.current) return;
        const safe = response || {};
        setGroups(Array.isArray(safe.grupos) ? safe.grupos : []);
        if (Array.isArray(safe.responsables)) setResponsibles(safe.responsables);
        setSummary(safe.resumen || {});
        setGeneratedAt(safe.generadoEn || {});
      }, []);

      /**
       * Carga el bootstrap y descarta respuestas anteriores a la última aplicada.
       * @param {boolean=} silent Indica una actualización no bloqueante.
       * @param {string=} source Origen de la solicitud.
       * @return {void}
       */
      const load_ = useCallback((silent = false, source = "unknown") => {
        if (requestBusyRef.current) {
          console.log("[APPALMACEN][PERF][CONCILIACION_CARGAR_SKIPPED]", { source, reason: "REQUEST_ALREADY_IN_FLIGHT" });
          return;
        }
        const requestSequence = ++loadRequestSequenceRef.current;
        const trace = csPerfStart_("CONCILIACION_CARGAR", { silent: silent === true, source, requestSequence });
        requestBusyRef.current = true;
        csPerfMark_(trace, "ACTION_ACCEPTED");
        if (silent) setRefreshing(true); else setLoading(true);
        csPerfMark_(trace, "LOADING_STATE_REQUESTED");
        csPerfMark_(trace, "SERVER_REQUEST_STARTING");
        google.script.run
          .withSuccessHandler(response => {
            const responseReceivedAt = performance.now();
            requestBusyRef.current = false;
            let responseBytes = -1;
            try { responseBytes = JSON.stringify(response || {}).length; } catch (error) { responseBytes = -1; }
            csPerfMark_(trace, "SERVER_RESPONSE_RECEIVED", { responseBytes });
            if (!mountedRef.current) { csPerfEnd_(trace, "ignored", { reason: "VIEW_UNMOUNTED" }); return; }
            if (requestSequence < lastAppliedSequenceRef.current) { csPerfEnd_(trace, "ignored", { reason: "STALE_RESPONSE", lastAppliedSequence: lastAppliedSequenceRef.current }); return; }
            lastAppliedSequenceRef.current = requestSequence;
            const safe = response || {};
            const groupsReceived = Array.isArray(safe.grupos) ? safe.grupos.length : 0;
            const movementsReceived = Array.isArray(safe.grupos) ? safe.grupos.reduce((total, group) => total + (Array.isArray(group && group.movimientos) ? group.movimientos.length : 0), 0) : 0;
            const responsiblesReceived = Array.isArray(safe.responsables) ? safe.responsables.length : 0;
            csPerfMark_(trace, "RESPONSE_VALIDATED", { groups: groupsReceived, movements: movementsReceived, responsibles: responsiblesReceived });
            setLoading(false);
            setRefreshing(false);
            applyResponse_(safe);
            csPerfMark_(trace, "REACT_STATE_REQUESTED", { groups: groupsReceived, movements: movementsReceived });
            csAfterPaint_(() => {
              csPerfMark_(trace, "UI_PAINT_COMPLETED", { groups: groupsReceived, movements: movementsReceived, responseHandlerMs: Number((performance.now() - responseReceivedAt).toFixed(1)) });
              csPerfEnd_(trace, "ok", { groups: groupsReceived, movements: movementsReceived, responsibles: responsiblesReceived });
            });
          })
          .withFailureHandler(error => {
            requestBusyRef.current = false;
            const text = error && error.message ? error.message : "No se pudo cargar Conciliación de saldo.";
            csPerfMark_(trace, "SERVER_REQUEST_FAILED", { message: text });
            if (!mountedRef.current) { csPerfEnd_(trace, "error", { reason: "VIEW_UNMOUNTED", message: text }); return; }
            setLoading(false);
            setRefreshing(false);
            notify_(text, "error", 4800, { title: "Error de carga", sound: true });
            csAfterPaint_(() => { csPerfMark_(trace, "ERROR_UI_PAINT_COMPLETED"); csPerfEnd_(trace, "error", { message: text }); });
          })
          .ConciliacionSaldoController_obtenerBootstrap();
      }, [applyResponse_]);

      useEffect(() => { load_(false, "initial"); }, [load_]);

      useEffect(() => {
        const onFocus = () => load_(true, "focus");
        const onVisibilityChange = () => {
          if (document.visibilityState === "visible") load_(true, "visibilitychange"); };
        window.addEventListener("focus", onFocus);
        document.addEventListener("visibilitychange", onVisibilityChange);
        return () => { window.removeEventListener("focus", onFocus); document.removeEventListener("visibilitychange", onVisibilityChange); };
      }, [load_]);

      /** Colección derivada tras aplicar búsqueda y filtros operativos. */
      const visibleGroups = useMemo(() => {
        const startedAt = performance.now();
        const q = upper_(query);
        const result = groups.filter(group => {
          if (stateFilter !== "TODOS" && stateFilter !== "TRABAJO" && upper_(group.estadogrupo) !== stateFilter) return false;
          if (typeFilter !== "TODOS" && !(group.tiposmovimiento || []).includes(typeFilter)) return false;
          if (!q) return true;
          return upper_([group.clavegrupo, group.serie, ...(group.codigos || []), ...(group.idunicos || []), ...(group.solicitantes || []), ...(group.almacenessalidaadministrativos || []), ...(group.almacenesentradaadministrativos || [])].join(" ")).includes(q);
        });
        const elapsedMs = performance.now() - startedAt;
        if (elapsedMs >= 10) console.log("[APPALMACEN][PERF][CONCILIACION_FILTER]", { elapsedMs: Number(elapsedMs.toFixed(1)), sourceGroups: groups.length, visibleGroups: result.length, queryLength: query.length, stateFilter, typeFilter });
        return result;
      }, [groups, query, stateFilter, typeFilter]);

      /** Retira un grupo conciliado y ajusta las métricas locales. */
      const onRegistered_ = useCallback(groupKey => {
        setGroups(previous => {
          const removed = previous.find(group => group.clavegrupo === groupKey);
          if (!removed) return previous;
          setSummary(current => {
            const next = { ...current, movimientospendientes: Math.max(0, num_(current.movimientospendientes) - num_(removed.pendientes)) };
            if (removed.estadogrupo === "PENDIENTE") next.grupospendientes = Math.max(0, num_(current.grupospendientes) - 1);
            if (removed.estadogrupo === "PARCIAL") next.gruposparciales = Math.max(0, num_(current.gruposparciales) - 1);
            if (removed.estadogrupo === "INCONSISTENTE") next.gruposinconsistentes = Math.max(0, num_(current.gruposinconsistentes) - 1);
            if (removed.conciliable !== true && num_(removed.pendientes) > 0) next.gruposnoconciliables = Math.max(0, num_(current.gruposnoconciliables) - 1);
            return next;
          });
          return previous.filter(group => group.clavegrupo !== groupKey);
        });
      }, []);

      if (loading) return <div className="cs-state"><div className="cs-spinner" /><div className="cs-state-title">Cargando conciliaciones</div><div className="cs-state-text">Consultando movimientos pendientes y responsables autorizados.</div></div>;

      return (
        <div className="cs-page"><section className="cs-workspace">
          <header className="cs-header">
            <div className="cs-identity"><div className="cs-header-icon"><Icon name="scale" size={23} /></div><div><p className="cs-eyebrow">Control administrativo de traspasos</p><h2 className="cs-title">Conciliación de saldo</h2><p className="cs-subtitle">Vincula movimientos físicos con el folio aplicado en el sistema administrativo</p></div></div>
            <div className="cs-metrics"><Metric label="Grupos pendientes" value={summary.grupospendientes} tone="amber" /><Metric label="Movimientos" value={summary.movimientospendientes} /><Metric label="Sin conciliar" value={summary.gruposnoconciliables} tone="red" /><Metric label="Inconsistencias" value={summary.gruposinconsistentes} tone="red" /></div>
            <div className="cs-header-actions"><button type="button" className="cs-button header" onClick={() => load_(true, "manual")} disabled={refreshing}><Icon name="refresh-cw" size={16} className={refreshing ? "animate-spin" : ""} />{refreshing ? "Actualizando" : "Actualizar"}</button></div>
          </header>
          <div className="cs-toolbar">
            <div className="cs-toolbar-main"><div className="cs-toolbar-icon"><Icon name="clipboard-list" size={17} /></div><div><div className="cs-toolbar-title">Control operativo</div><div className="cs-toolbar-subtitle">Traspasos pendientes de afectar</div></div></div>
            <div className="cs-toolbar-filters"><input type="search" className="cs-input" value={query} onChange={event => setQuery(event.target.value)} placeholder="Buscar serie, SKU o IdUnico" aria-label="Buscar conciliaciones" /><select className="cs-select" value={stateFilter} onChange={event => setStateFilter(event.target.value)} aria-label="Filtrar por estado"><option value="TRABAJO">Trabajo pendiente</option><option value="PENDIENTE">Pendientes</option><option value="PARCIAL">Parciales</option><option value="INCONSISTENTE">Inconsistentes</option><option value="TODOS">Todos</option></select><select className="cs-select" value={typeFilter} onChange={event => setTypeFilter(event.target.value)} aria-label="Filtrar por tipo"><option value="TODOS">Todos los tipos</option><option value="ACOMODO">Acomodo</option><option value="SURTIDO">Surtido</option></select></div>
            <div className="cs-toolbar-context"><span className="cs-result-count">{visibleGroups.length} grupo(s)</span><span className="cs-live"><span className="cs-live-dot" />Actualizado</span><span className="cs-chip slate">{generatedAt.fecha || "--"} {generatedAt.hora || "--"}</span></div>
          </div>
          <main className="cs-content">{visibleGroups.length ? <div className="cs-card-list">{visibleGroups.map((group,index) => <ConciliationCard key={group.clavegrupo} group={group} index={index} responsibles={responsibles} onRegistered={onRegistered_} />)}</div> : <div className="cs-state"><Icon name="badge-check" size={38} /><div className="cs-state-title">Sin conciliaciones visibles</div><div className="cs-state-text">No existen grupos que coincidan con los filtros actuales o todos los movimientos ya fueron atendidos.</div></div>}</main>
        </section></div>
      );
    }

    const mountTrace = csPerfStart_("CONCILIACION_VIEW_MOUNT");
    csPerfMark_(mountTrace, "INIT_FUNCTION_STARTED");
    const target = document.getElementById("render-conciliacion-saldo");
    if (!target) {
      csPerfMark_(mountTrace, "TARGET_NOT_FOUND");
      csPerfEnd_(mountTrace, "error", { reason: "RENDER_TARGET_NOT_FOUND" });
      notify_("No se encontró el contenedor de Conciliación de saldo.", "error", 4200, { title: "Error de interfaz", sound: true });
      return;
    }
    csPerfMark_(mountTrace, "TARGET_FOUND");
    const hadPreviousRoot = Boolean(window.__CONCILIACION_SALDO_ROOT__);
    if (hadPreviousRoot) {
      try { window.__CONCILIACION_SALDO_ROOT__.unmount(); }
      catch (error) { console.warn("[ConciliacionSaldo] No se pudo desmontar el root previo.", error); }
      window.__CONCILIACION_SALDO_ROOT__ = null;
    }
    csPerfMark_(mountTrace, "PREVIOUS_ROOT_CLEANED", { hadPreviousRoot });
    window.__CONCILIACION_SALDO_ROOT__ = ReactDOM.createRoot(target);
    csPerfMark_(mountTrace, "REACT_ROOT_CREATED");
    window.__CONCILIACION_SALDO_ROOT__.render(<View />);
    csPerfMark_(mountTrace, "REACT_RENDER_REQUESTED");
    csAfterPaint_(() => {
      csPerfMark_(mountTrace, "INITIAL_PAINT_COMPLETED");
      csPerfEnd_(mountTrace, "ok", { hadPreviousRoot });
    });
  };

  window.initVista = window.cargar_ConciliacionSaldo;
</script>
