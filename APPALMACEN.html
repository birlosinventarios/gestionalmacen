    :root {
      --primary: #d93025;
      --primary-dark: #a50e0e;
      --bg-color: #f8f9fa;
      --text-main: #1c1d1f;
      --text-secondary: #5f6368;
      --border-color: #dadce0;
    }

    html,
    body,
    #root {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg-color);
    }

    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      overflow: hidden;
    }

    /* ======================================================
       Estructura general de la aplicación
       ====================================================== */
    .app-main {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--bg-color);
      transition:
        margin-left 260ms ease,
        width 260ms ease,
        border-radius 260ms ease;
    }

    .app-main.sidebar1 {
      width: calc(100vw - var(--fito-sidebar-mini-width, 80px));
      margin-left: var(--fito-sidebar-mini-width, 80px);
      border-radius: 0 1rem 1rem 0;
    }

    .app-main.sidebar2 {
      width: calc(
        100vw
        - var(--fito-sidebar2-gap, 16px)
        - var(--fito-sidebar2-mini-width, 80px)
        - var(--fito-sidebar2-gap, 16px)
      );
      margin-left: calc(
        var(--fito-sidebar2-gap, 16px)
        + var(--fito-sidebar2-mini-width, 80px)
        + var(--fito-sidebar2-gap, 16px)
      );
      border-radius: 1rem;
    }

    .app-main > header {
      flex: 0 0 auto;
    }

    .app-main.sidebar1 > header {
      border-radius: 0;
    }

    .app-main.sidebar2 > header {
      border-bottom-left-radius: 1rem;
    }

    /* ======================================================
       Encabezado del shell
       ====================================================== */
    .app-shell-header {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 88px;
      padding: 12px 24px;
      overflow: visible;
      background: #fff;
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.05);
    }

    .app-shell-header-identity {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .app-shell-header-icon {
      display: inline-flex;
      flex: 0 0 44px;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      color: #fff;
      background: #1c1d1f;
      border: 1px solid #1c1d1f;
      border-radius: 14px;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.14);
    }

    .app-shell-header-copy {
      min-width: 0;
    }

    .app-shell-header-title {
      margin: 0;
      overflow: hidden;
      color: var(--text-main);
      font-size: 20px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.025em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .app-shell-header-description {
      margin: 4px 0 0;
      overflow: hidden;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-overflow: ellipsis;
      white-space: nowrap;

       Controles de impresión

    .app-shell-print-group {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: #f8f9fa;
      border: 1px solid var(--border-color);
      border-radius: 16px;

      flex-direction: column;
      justify-content: center;
      min-width: 84px;
      padding: 0 8px 0 4px;

      color: var(--text-main);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.12em;

      font-size: 9px;
      font-weight: 800;

      padding: 0 11px;
      color: var(--text-secondary);
      background: #fff;

      background: rgba(217, 48, 37, 0.06);
      border-color: rgba(217, 48, 37, 0.2);
    }

    .app-shell-print-mode:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 13px rgba(15, 23, 42, 0.08);

    .app-shell-print-mode:disabled,
    .app-shell-print-test:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
      transform: none;
      box-shadow: none;
    }

    /* ======================================================
       Contenedor de vistas dinámicas

    .app-view-card {
      display: flex;
      flex: 1 1 auto;
      height: 0;
      min-height: 0;
      margin: 1rem 1rem 1rem 0;

    /* ======================================================

    @keyframes toastInProto {
      from { opacity: 0; transform: translateX(100%); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes toastOutProto {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(100%); }
    }

    .animate-toast-in {
      animation: toastInProto 0.35s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }

    .animate-toast-out {
      animation: toastOutProto 0.25s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }

    .swal2-popup.swal2-toast {
      color: #fff !important;
      background: #1c1d1f !important;
      border-left: 4px solid #d93025 !important;
      border-radius: 14px !important;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22) !important;
      backdrop-filter: blur(8px);
    }

    .swal2-timer-progress-bar {
      background: #d93025 !important;
    }

    body.app-booting #root {
      opacity: 0;
      filter: blur(18px) saturate(0.85);
      transform: scale(0.985) translateY(8px);
      transition:

        filter 720ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 720ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.app-handoff #root,
    body.app-ready #root {
      opacity: 1;
      filter: blur(0) saturate(1);
      transform: scale(1) translateY(0);
    }

    body.app-handoff #fito-preloader {
      opacity: 0;

    }

    @media (max-width: 1100px) {
      .app-shell-header { min-height: 82px; padding: 10px 12px; }
      .app-shell-print-caption,
      .app-shell-print-test-label { display: none; }
      .app-shell-print-test { width: 42px; min-width: 42px; padding: 0; }

    @media (max-width: 900px) {

      }

      .app-main.sidebar2 {
        width: calc(

        margin-left: calc(

      .app-shell-header-description { display: none; }
      .app-shell-header-title { max-width: 34vw; font-size: 15px; }

<body>
  <?!= LOADER_HTML ?>
  <div id="root"></div>

  <script>
    "use strict";

    const APPALMACEN_SCRIPT_STARTED_AT = performance.now();
    const { useState, useEffect, useRef } = React;
    const e = React.createElement;

    document.body.classList.add("app-booting");

    /* ======================================================
       Estado global compatible con las vistas existentes
       ====================================================== */
    window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || null;
    window.usuariosGlobal = window.usuariosGlobal || [];
    window.bodegasGlobal = window.bodegasGlobal || [];
    window.mapaUbicacionesGlobal = window.mapaUbicacionesGlobal || [];
    window.catalogoGlobal = window.catalogoGlobal || [];

    const APPALMACEN_DEBUG = Object.freeze({
      enabled: window.APPALMACEN_TESTING?.DEBUG === true,
      warnings: window.APPALMACEN_TESTING?.DEBUG_WARNINGS === true
    });

    /** Normaliza errores para logs y respuestas visuales. */
    function normalizarError_(error) {
      if (!error) return { name: "", message: "", stack: "" };
      if (typeof error === "string") {
        return { name: "Error", message: error, stack: "" };
      }

      return {
        name: String(error.name || "Error"),
        message: String(error.message || error.details || error),
        stack: String(error.stack || "")
      };
    }

    function registrarError_(layer, event, error, metadata) {
      console.error(`[APPALMACEN][${layer}][${event}]`, {
        error: normalizarError_(error),
        metadata: metadata || null
      });
    }

    function registrarAdvertencia_(layer, event, error, metadata) {
      if (!APPALMACEN_DEBUG.warnings) return;
      console.warn(`[APPALMACEN][${layer}][${event}]`, {
        error: normalizarError_(error),
        metadata: metadata || null
      });
    }

    function registrarDebug_(layer, event, metadata) {
      if (!APPALMACEN_DEBUG.enabled) return;
      console.debug(`[APPALMACEN][${layer}][${event}]`, metadata || null);
    }

    /* ======================================================
       Trackers de rendimiento del cliente
       ====================================================== */
    const APPALMACEN_PERF_CONFIG = Object.freeze({
      enabled: window.APPALMACEN_TESTING?.PERFORMANCE_TRACKING !== false,
      keepLast: Number(
        window.APPALMACEN_TESTING?.PERFORMANCE_HISTORY_SIZE || 100
      )
    });

    window.__APPALMACEN_PERF_STATE__ = window.__APPALMACEN_PERF_STATE__ || {
      sequence: 0,
      active: new Map(),
      history: []
    };

    function perfNow_() {
      return performance.now();
    }

    function perfRound_(value) {
      return Math.round(Number(value || 0) * 100) / 100;
    }

    function perfSafeSize_(value) {
      try {
        const text = typeof value === "string" ? value : JSON.stringify(value);
        return new Blob([text]).size;
      } catch (_) {
        return 0;
      }
    }

    function perfStart_(operation, metadata = {}, startedAt = null) {
      if (!APPALMACEN_PERF_CONFIG.enabled) return null;

      const state = window.__APPALMACEN_PERF_STATE__;
      state.sequence += 1;

      const id = [String(operation || "OP"), Date.now(), state.sequence].join("-");
      const explicitStart = Number(startedAt);
      const start = startedAt !== null && Number.isFinite(explicitStart)
        ? explicitStart
        : perfNow_();

      state.active.set(id, {
        id,
        operation: String(operation || "OP"),
        startedAt: start,
        lastAt: start,
        metadata: metadata && typeof metadata === "object" ? metadata : {},
        marks: []
      });

      return id;
    }

    function perfMark_(id, stage, metadata = {}) {
      if (!id || !APPALMACEN_PERF_CONFIG.enabled) return;

      const trace = window.__APPALMACEN_PERF_STATE__.active.get(id);
      if (!trace) return;

      const now = perfNow_();
      trace.marks.push({
        stage: String(stage || "MARK"),
        segmentMs: perfRound_(now - trace.lastAt),
        totalMs: perfRound_(now - trace.startedAt),
        metadata: metadata || {}
      });
      trace.lastAt = now;
    }

    function perfEnd_(id, status = "ok", metadata = {}) {
      if (!id || !APPALMACEN_PERF_CONFIG.enabled) return null;

      const state = window.__APPALMACEN_PERF_STATE__;
      const trace = state.active.get(id);
      if (!trace) return null;

      const result = {
        id: trace.id,
        operation: trace.operation,
        status: String(status || "ok"),
        totalMs: perfRound_(perfNow_() - trace.startedAt),
        metadata: { ...trace.metadata, ...(metadata || {}) },
        marks: trace.marks.slice()
      };

      state.active.delete(id);
      state.history.push(result);

      const keepLast = Math.max(10, APPALMACEN_PERF_CONFIG.keepLast || 100);
      if (state.history.length > keepLast) {
        state.history.splice(0, state.history.length - keepLast);
      }

      console.groupCollapsed(
        `%c[APPALMACEN][PERF][${result.operation}] ${result.totalMs} ms | ${result.status}`,
        result.status === "ok"
          ? "color:#188038;font-weight:800"
          : "color:#d93025;font-weight:800"
      );
      console.table(
        result.marks.map(mark => ({
          etapa: mark.stage,
          segmento_ms: mark.segmentMs,
          acumulado_ms: mark.totalMs
        }))
      );
      console.info("Metadatos:", result.metadata);
      console.groupEnd();

      return result;
    }

    function perfCancel_(id, metadata = {}) {
      return perfEnd_(id, "cancelled", metadata);
    }

    window.APPALMACEN_PERF = Object.freeze({
      start: perfStart_,
      mark: perfMark_,
      end: perfEnd_,
      cancel: perfCancel_,
      history: () => window.__APPALMACEN_PERF_STATE__.history.slice(),
      active: () => Array.from(window.__APPALMACEN_PERF_STATE__.active.values()),
      clear: () => {
        window.__APPALMACEN_PERF_STATE__.active.clear();
        window.__APPALMACEN_PERF_STATE__.history.length = 0;
      },
      summary: () => console.table(
        window.__APPALMACEN_PERF_STATE__.history.map(item => ({
          operacion: item.operation,
          estado: item.status,
          total_ms: item.totalMs,
          vista: item.metadata?.viewId || "",
          origen: item.metadata?.source || ""
        }))
      )
    });

    /* ======================================================
       Envoltorio común para operaciones google.script.run
       ====================================================== */
    window.APPALMACEN_ACTIONS = window.APPALMACEN_ACTIONS || Object.freeze({
      run(config = {}) {
        const operation = String(config.operation || "UNNAMED_ACTION").trim();
        const viewId = String(config.viewId || "UNKNOWN_VIEW").trim();
        const controller = String(config.controller || "UNKNOWN_CONTROLLER").trim();
        const invoke = config.invoke;
        const onSuccess = typeof config.onSuccess === "function" ? config.onSuccess : null;
        const onFailure = typeof config.onFailure === "function" ? config.onFailure : null;
        const getResultMetadata = typeof config.getResultMetadata === "function"
          ? config.getResultMetadata
          : null;
        const waitForPaint = config.waitForPaint !== false;
        const rethrowHandlerErrors = config.rethrowHandlerErrors !== false;
        const timeoutValue = Number(config.timeoutMs || 120000);
        const timeoutMs = Number.isFinite(timeoutValue)
          ? Math.min(Math.max(timeoutValue, 1000), 360000)
          : 120000;
        const extraMetadata = config.metadata && typeof config.metadata === "object"
          ? config.metadata
          : {};

        if (!operation) {
          return Promise.reject(new Error("APPALMACEN_ACTIONS.run requiere operation."));
        }
        if (typeof invoke !== "function") {
          return Promise.reject(
            new Error(`La operación ${operation} requiere una función invoke.`)
          );
        }

        const traceId = window.APPALMACEN_PERF?.start(operation, {
          viewId,
          controller,
          source: "view_action",
          payloadBytes: perfSafeSize_(config.payload),
          timeoutMs,
          ...extraMetadata
        }) || null;
        const operationStartedAt = perfNow_();

        perfMark_(traceId, "ACTION_ACCEPTED", { viewId, controller });

        const waitForTwoPaints = () => new Promise(resolve => {
          if (!waitForPaint || typeof requestAnimationFrame !== "function") {
            resolve();
            return;
          }
          requestAnimationFrame(() => requestAnimationFrame(resolve));
        });

        return new Promise((resolve, reject) => {
          let settled = false;
          let timeoutHandle = null;

          const clearTimeout_ = () => {
            if (timeoutHandle !== null) {
              clearTimeout(timeoutHandle);
              timeoutHandle = null;
            }
          };

          const finishOnce = (status, metadata = {}) => {
            if (settled) return false;
            settled = true;
            clearTimeout_();
            perfEnd_(traceId, status, {
              clientTotalMs: perfRound_(perfNow_() - operationStartedAt),
              ...metadata
            });
            return true;
          };

          const rejectNormalized = error => {
            reject(
              error instanceof Error
                ? error
                : new Error(
                    normalizarError_(error).message || `Fallo ${operation}.`
                  )
            );
          };

          const success = async response => {
            if (settled) {
              registrarAdvertencia_("ACTION", "DUPLICATE_SUCCESS", null, {
                operation,
                viewId,
                controller
              });
              return;
            }

            perfMark_(traceId, "SERVER_RESPONSE_RECEIVED", {
              responseBytes: perfSafeSize_(response),
              responseOk: response?.ok === true
            });

            try {
              const handlerStartedAt = perfNow_();
              const processedResult = onSuccess
                ? await Promise.resolve(onSuccess(response, {
                    traceId,
                    operation,
                    viewId,
                    controller
                  }))
                : response;

              perfMark_(traceId, "SUCCESS_HANDLER_COMPLETED", {
                handlerMs: perfRound_(perfNow_() - handlerStartedAt)
              });

              let resultMetadata = {};
              if (getResultMetadata) {
                try {
                  resultMetadata = getResultMetadata(response, processedResult) || {};
                } catch (metadataError) {
                  registrarAdvertencia_(
                    "ACTION",
                    "RESULT_METADATA_FAILED",
                    metadataError,
                    { operation, viewId, controller }
                  );
                }
              }

              await waitForTwoPaints();
              if (settled) return;

              perfMark_(
                traceId,
                waitForPaint ? "UI_PAINT_COMPLETED" : "UI_PAINT_SKIPPED"
              );

              if (finishOnce("ok", {
                responseBytes: perfSafeSize_(response),
                ...resultMetadata
              })) {
                resolve(processedResult);
              }
            } catch (handlerError) {
              if (settled) return;

              perfMark_(traceId, "SUCCESS_HANDLER_FAILED", {
                message: normalizarError_(handlerError).message
              });
              finishOnce("error", { stage: "success_handler" });
              registrarError_(
                "ACTION",
                "SUCCESS_HANDLER_FAILED",
                handlerError,
                { operation, viewId, controller }
              );

              if (rethrowHandlerErrors) rejectNormalized(handlerError);
              else resolve(response);
            }
          };

          const failure = async error => {
            if (settled) {
              registrarAdvertencia_("ACTION", "DUPLICATE_FAILURE", error, {
                operation,
                viewId,
                controller
              });
              return;
            }

            perfMark_(traceId, "SERVER_REQUEST_FAILED", {
              message: normalizarError_(error).message
            });

            let finalError = error;
            try {
              if (onFailure) {
                await Promise.resolve(onFailure(error, {
                  traceId,
                  operation,
                  viewId,
                  controller
                }));
              }
              perfMark_(traceId, "FAILURE_HANDLER_COMPLETED");
            } catch (handlerError) {
              finalError = handlerError;
              perfMark_(traceId, "FAILURE_HANDLER_FAILED", {
                message: normalizarError_(handlerError).message
              });
              registrarError_(
                "ACTION",
                "FAILURE_HANDLER_FAILED",
                handlerError,
                {
                  operation,
                  viewId,
                  controller,
                  originalError: normalizarError_(error)
                }
              );
            }

            finishOnce("error", {
              stage: "server_request",
              error: normalizarError_(finalError)
            });
            rejectNormalized(finalError);
          };

          timeoutHandle = setTimeout(() => {
            if (settled) return;

            const timeoutError = new Error(

    async function ejecutarScriptsDeVista(container, traceId) {
      const scripts = Array.from(container.querySelectorAll("script"));
      const stats = {
        totalScripts: scripts.length,
        executedScripts: 0,
        babelScripts: 0,
        skippedScripts: 0,
        externalScripts: 0,
        babelMs: 0,
        executionMs: 0
      };

      perfMark_(traceId, "SCRIPTS_DISCOVERED", {
        totalScripts: scripts.length
      });

      for (const oldScript of scripts) {
        const type = (oldScript.getAttribute("type") || "").toLowerCase().trim();
        const code = oldScript.textContent || "";

        if ([
          "text/template",
          "text/x-template",
          "application/json",
          "application/ld+json"
        ].includes(type)) {
          stats.skippedScripts += 1;
          continue;
        }

        if (oldScript.src) {
          stats.externalScripts += 1;
          stats.skippedScripts += 1;
          continue;
        }

        if (type === "module") {
          stats.skippedScripts += 1;
          continue;
        }

        let finalCode = code;

        if (type === "text/babel" || type === "text/jsx") {
          if (!window.Babel) {
            throw new Error("Babel no está disponible para transpilar la vista.");
          }

          const babelStartedAt = perfNow_();
          finalCode = Babel.transform(code, {
            presets: [["react", { runtime: "classic" }]],
            sourceType: "script"
          }).code;
          stats.babelMs += perfNow_() - babelStartedAt;
          stats.babelScripts += 1;
        } else if (
          type &&
          type !== "text/javascript" &&
          type !== "application/javascript"
        ) {
          stats.skippedScripts += 1;
          continue;
        }

        const executionStartedAt = perfNow_();
        const script = document.createElement("script");
        script.type = "text/javascript";
        script.text = finalCode;
        document.body.appendChild(script);
        script.remove();
        stats.executionMs += perfNow_() - executionStartedAt;
        stats.executedScripts += 1;
      }

      stats.babelMs = perfRound_(stats.babelMs);
      stats.executionMs = perfRound_(stats.executionMs);
      perfMark_(traceId, "SCRIPTS_EXECUTED", stats);

      return stats;
    }

            bootstrapTraceRef.current = null;

            seleccionarVista(

      useEffect(() => {

      /* Ejecuta los scripts embebidos de la vista ya insertada en el DOM. */

        let cancelled = false;

            const initStartedAt = perfNow_();
            let initReturnedCleanup = false;

            });
            if (viewTraceRef.current === traceId) viewTraceRef.current = null;

            registrarError_("VIEW", "INITIALIZATION_FAILED", error, {
              viewId: initializedViewId
            });
            window.notificar("Error al inicializar la vista", "error");
          }
        })();

        return () => {
          cancelled = true;
        };
      }, [appVisualReady, viewContent, activeTool]);

      useEffect(() => {
        const handler = event => setPrintMode(event?.detail?.mode || "LOCAL");
        window.addEventListener("app-print-mode-change", handler);
        return () => window.removeEventListener("app-print-mode-change", handler);
      }, []);

      const cambiarModo = () => {
        if (!window.ImpresionModoUtilidades?.toggleMode) {
          window.notificar("Modo de impresión no disponible", "error");
          return;
        }
        setPrintMode(window.ImpresionModoUtilidades.toggleMode());
      };

      const probarLocal = () => {
        if (printTestState.local) return;
        setPrintTestState(state => ({ ...state, local: true }));

        try {
          const opened = window.ImpresionModoUtilidades?.abrirHtmlLocal?.(
            construirHtmlPruebaImpresion_("LOCAL"),
            "Prueba LOCAL"
          );
          if (opened === false) {
            throw new Error("No se pudo abrir la prueba LOCAL.");
          }
        } catch (error) {
          registrarError_("PRINT", "LOCAL_TEST_FAILED", error, null);
          window.notificar(error?.message || "Error LOCAL", "error");
        } finally {
          setPrintTestState(state => ({ ...state, local: false }));
        }
      };

      const probarOnline = () => {
        if (printTestState.online) return;
        setPrintTestState(state => ({ ...state, online: true }));

        const html = construirHtmlPruebaImpresion_("ONLINE");
        google.script.run
          .withSuccessHandler(() => {
            setPrintTestState(state => ({ ...state, online: false }));
          })
          .withFailureHandler(error => {
            registrarError_("PRINT", "ONLINE_TEST_FAILED", error, null);
            setPrintTestState(state => ({ ...state, online: false }));
            window.notificar(error?.message || "Error ONLINE", "error");
          })
          .ImpresionPuenteController_imprimir({
            tipo: "HTML_TEST",
            origen: "APPALMACEN_HEADER",
            formato: "HTML",
            html,
            content: html
          });
      };

      const renderIdentity = () => (
        showIdentity
          ? e(
              "div",
              { className: "app-shell-header-identity" },
              e(
                "div",
                {
                  className: "app-shell-header-icon",
                  "aria-hidden": "true"
                },
                e(Icon, { name: meta.icon, size: 21 })
              ),
              e(
                "div",
                { className: "app-shell-header-copy" },
                e("h1", { className: "app-shell-header-title" }, meta.name),
                e(
                  "p",
                  { className: "app-shell-header-description" },
                  meta.description
                )
              )
            )
          : null
      );

      const renderPrint = () => {
        if (!showPrint) return null;

        const items = [
          e(
            "div",
            {
              key: "caption",
              className: "app-shell-print-caption",
              "aria-hidden": "true"
            },
            e("span", { className: "app-shell-print-caption-title" }, "Impresión"),
            e(
              "span",
              { className: "app-shell-print-caption-subtitle" },
              "Pruebas y modo"
            )
          )
        ];

        if (printConfig.allowModeChange) {
          items.push(
            e(
              "button",
              {
                key: "mode",
                type: "button",
                onClick: cambiarModo,
                className: `app-shell-print-mode ${printMode === "ONLINE" ? "online" : ""}`
              },
              e(Icon, {
                name: printMode === "ONLINE" ? "cloud" : "monitor",
                size: 16
              }),
              e("span", { className: "app-shell-print-mode-text" }, printMode)
            )
          );
        }

        if (printConfig.allowLocalTest) {
          items.push(
            e(
              "button",
              {
                key: "local",
                type: "button",
                onClick: probarLocal,
                disabled: printTestState.local,
                className: "app-shell-print-test local"
              },
              e(Icon, {
                name: printTestState.local ? "loader-2" : "monitor",
                size: 16,
                className: printTestState.local ? "animate-spin" : ""
              }),
              e(
                "span",
                { className: "app-shell-print-test-label" },
                "Probar local"
              )
            )
          );
        }

        if (printConfig.allowOnlineTest) {
          items.push(
            e(
              "button",
              {
                key: "online",
                type: "button",
                onClick: probarOnline,
                disabled: printTestState.online,
                className: "app-shell-print-test online"
              },
              e(Icon, {
                name: printTestState.online ? "loader-2" : "cloud",
                size: 16,
                className: printTestState.online ? "animate-spin" : ""
              }),
              e(
                "span",
                { className: "app-shell-print-test-label" },
                "Probar online"
              )
            )
          );
        }

        return e(
          "div",
          {
            className: "app-shell-print-group",
            role: "group",
            "aria-label": "Controles de impresión"
          },
          ...items
        );
      };

      const sidebarActive = window.APPALMACEN_COMPONENTS?.SIDEBAR?.ACTIVE || "sidebar1";
      const componentName =
        window.APPALMACEN_COMPONENTS?.SIDEBAR?.CLIENT_COMPONENTS?.[sidebarActive] ||
        "Sidebar1";
      const Sidebar =
        window.FitoComponents?.[componentName] ||
        window.FitoComponents?.Sidebar1;

      if (!Sidebar) {
        return e(
          "div",
          { className: "p-6 text-red-700 font-bold" },
          "No se encontró el componente de sidebar."
        );
      }

      const brand = window.APPALMACEN_BRAND || {};
      const theme = window.APPALMACEN_THEME || {};

      return e(
        "div",
        { className: "h-screen w-full overflow-hidden bg-[#f8f9fa]" },
        e(Sidebar, {
          tools: TOOLS,
          activeTool: sidebarActiveToolId,
          isOpen: isSidebarOpen,
          onOpen: () => setIsSidebarOpen(true),
          onClose: () => setIsSidebarOpen(false),
          onSelect: tool => {
            setIsSidebarOpen(false);
            seleccionarVista(tool.id, tool.fileName || tool.id, {
              source: "sidebar"
            });
          },
          logoUrl: brand.LOGO_URL,
          logoFallback: brand.LOGO_FALLBACK,
          appName: brand.APP_NAME || "APPALMACEN",
          appSubtitle: brand.APP_SUBTITLE || "Control operativo",
          title: brand.APP_NAME || "APPALMACEN",
          subtitle: brand.APP_SUBTITLE || "Control operativo",
          theme,
          themeKey: theme.key || "white"
        }),
        e(
          "main",
          {
            className: [
              "app-main",
              sidebarActive,
              showShellHeader ? "has-shell-header" : "without-shell-header",
              "flex flex-col relative bg-[#f8f9fa]"
            ].join(" ")
          },
          showShellHeader
            ? e(
                "header",
                { className: "app-shell-header" },
                renderIdentity(),
                renderPrint()
              )
            : null,
          e(
            "div",
            { className: "app-view-card" },
            loading
              ? e(
                  "div",
                  { className: "flex items-center justify-center h-full w-full" },
                  e(Icon, {
                    name: "loader-2",
                    className: "animate-spin text-[#d93025]",
                    size: 40
                  })
                )
              : e("div", {
                  ref: containerRef,
                  className: "app-view-container",
                  dangerouslySetInnerHTML: { __html: viewContent }
                })
          )
        )
      );
    };

    /* ======================================================
       Montaje y transición final del shell
       ====================================================== */
    let APPALMACEN_ROOT_INSTANCE = null;
    let APPALMACEN_STARTED = false;
    let APPALMACEN_LOADER_HIDDEN = false;

    function ocultarLoaderAppalmacen_() {
      if (APPALMACEN_LOADER_HIDDEN) return;
      APPALMACEN_LOADER_HIDDEN = true;

      const preloader = document.getElementById("fito-preloader");
      document.body.classList.remove("app-booting");
      document.body.classList.add("app-handoff");

      setTimeout(() => {
        if (preloader) preloader.style.display = "none";
        document.body.classList.remove("app-handoff");
        document.body.classList.add("app-ready");
        perfMark_(APPALMACEN_APP_START_TRACE, "LOADER_HIDDEN");
        perfEnd_(APPALMACEN_APP_START_TRACE, "ok");
      }, 820);
    }

    function iniciarAPPALMACEN() {
      if (APPALMACEN_STARTED) return;
      APPALMACEN_STARTED = true;

      const rootElement = document.getElementById("root");
      if (!rootElement) {
        registrarError_(
          "BOOT",
          "ROOT_NOT_FOUND",
          new Error("No existe el contenedor root."),
          { rootId: "root" }
        );
        return;
      }

      perfMark_(APPALMACEN_APP_START_TRACE, "REACT_ROOT_CREATE");
      APPALMACEN_ROOT_INSTANCE = ReactDOM.createRoot(rootElement);
      APPALMACEN_ROOT_INSTANCE.render(e(App));
      perfMark_(APPALMACEN_APP_START_TRACE, "REACT_RENDER_REQUESTED");
    }

    iniciarAPPALMACEN();
  </script>
</body>
</html>
