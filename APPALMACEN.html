  <script>
    const { useState, useEffect, useRef } = React;
    const e = React.createElement;

    // =========================================================
    // CACHE GLOBAL
    // =========================================================
    window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || null;

    // =========================================================
    // HELPERS GENERALES
    // =========================================================
    function escapeHtml_(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // =========================================================
    // ICONO LUCIDE
    // =========================================================
    const Icon = ({ name, size = 20, className = "" }) => {
      const iconRef = useRef(null);

      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name);
          i.style.width = `${size}px`;
          i.style.height = `${size}px`;
          if (className) i.className = className;
          iconRef.current.appendChild(i);
          window.lucide.createIcons();
        }
      }, [name, size, className]);

      return e("span", { ref: iconRef, className: "inline-flex items-center" });
    };

    // =========================================================
    // MENÚ DE HERRAMIENTAS
    // =========================================================
    const TOOLS = [
      { id: 'FormularioTraspasos', name: 'Registrar Traspasos', icon: 'arrow-right-left', category: 'Procesos' },
      { id: 'MonitorTraspasos', name: 'Traspasos Pendientes', icon: 'clipboard-list', category: 'Procesos' },
      { id: 'FormularioEtiquetasIdentificadoras', name: 'Etiquetas Identificadoras', icon: 'tag', category: 'Etiquetado' },
      { id: 'FormularioEtiquetasExcedentes', name: 'Etiquetas Excedentes', icon: 'tag', category: 'Etiquetado' },
      { id: 'FormularioEtiquetasExcedentesReimpresion', name: 'Reimpresión Excedentes', icon: 'printer', category: 'Etiquetado' },
      { id: 'HistorialTraspasos', name: 'Historial Traspasos', icon: 'history', category: 'Consultas' },
      { id: 'GestorExcedentes', name: 'Control de excedentes', icon: 'settings', category: 'Consultas' },
      { id: 'NegativosBirlos', name: 'Negativos en Almacén', icon: 'alert-triangle', category: 'Consultas' },
      { id: 'MonitorReabastecimiento', name: 'Monitor de Reabastecimiento', icon: 'package-plus', category: 'Consultas' },
      { id: 'AuditoriaExcedentes', name: 'Auditoria de excedentes', icon: 'package-plus', category: 'Auditorias' },
      { id: 'PrototipoTraspasos', name: 'Prueba Traspasos', icon: 'cloud-alert', category: 'Pruebas' }
    ];

    // =========================================================
    // SISTEMA GLOBAL DE NOTIFICACIONES + SONIDO
    // =========================================================
    const NOTIFY_META = {
      success: {
        accent: '#d93025',
        title: 'Operación exitosa',
        icon: 'success'
      },
      warning: {
        accent: '#696160',
        title: 'Revisión necesaria',
        icon: 'warning'
      },
      error: {
        accent: '#a50e0e',
        title: 'Error del sistema',
        icon: 'error'
      },
      info: {
        accent: '#454040',
        title: 'Notificación',
        icon: 'info'
      }
    };

    window.NOTIFY_STATE = window.NOTIFY_STATE || {
      soundEnabled: true,
      audioUnlocked: false,
      audioContext: null,
      audioUnlockBound: false
    };

    function inicializarAudioNotificaciones_() {
      if (window.NOTIFY_STATE.audioUnlockBound) return;
      window.NOTIFY_STATE.audioUnlockBound = true;

      const unlock = async () => {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;

          if (!window.NOTIFY_STATE.audioContext) {
            window.NOTIFY_STATE.audioContext = new AC();
          }

          if (window.NOTIFY_STATE.audioContext.state === 'suspended') {
            await window.NOTIFY_STATE.audioContext.resume();
          }

          window.NOTIFY_STATE.audioUnlocked = true;
        } catch (err) {
          console.warn("⚠️ [Notify] No se pudo desbloquear el audio:", err);
        } finally {
          document.removeEventListener('pointerdown', unlock, true);
          document.removeEventListener('keydown', unlock, true);
          document.removeEventListener('touchstart', unlock, true);
        }
      };

      document.addEventListener('pointerdown', unlock, true);
      document.addEventListener('keydown', unlock, true);
      document.addEventListener('touchstart', unlock, true);
    }

    function tocarSonidoNotificacion_(tipo = 'info') {
      try {
        const state = window.NOTIFY_STATE;
        if (!state.soundEnabled || !state.audioUnlocked) return;
        const ctx = state.audioContext;
        if (!ctx) return;

        if (ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }

        const now = ctx.currentTime;
        const master = ctx.createGain();
        master.gain.setValueAtTime(0.0001, now);
        master.connect(ctx.destination);

        const configs = {
          success: {
            notes: [880, 1174],
            durations: [0.08, 0.12],
            spacing: 0.09,
            type: 'sine',
            volume: 0.05
          },
          warning: {
            notes: [622, 740],
            durations: [0.10, 0.10],
            spacing: 0.10,
            type: 'triangle',
            volume: 0.045
          },
          error: {
            notes: [392, 311],
            durations: [0.11, 0.14],
            spacing: 0.10,
            type: 'sawtooth',
            volume: 0.04
          },
          info: {
            notes: [784],
            durations: [0.08],
            spacing: 0,
            type: 'sine',
            volume: 0.035
          }
        };

        const cfg = configs[tipo] || configs.info;

        cfg.notes.forEach((freq, index) => {
          const start = now + (index * cfg.spacing);
          const end = start + cfg.durations[index];

          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = cfg.type;
          osc.frequency.setValueAtTime(freq, start);

          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(cfg.volume, start + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, end);

          osc.connect(gain);
          gain.connect(master);

          osc.start(start);
          osc.stop(end + 0.02);
        });
      } catch (err) {
        console.warn("⚠️ [Notify] No se pudo reproducir el sonido:", err);
      }
    }

    window.configurarSonidoNotificaciones = (enabled = true) => {
      window.NOTIFY_STATE.soundEnabled = !!enabled;
    };

    // =========================================================
    // TOAST GLOBAL HOMOLOGADO CON PROTOTIPOTRASPASOS
    // =========================================================
    const Toast = Swal.mixin({
      toast: true,
      position: 'top-end',
      showConfirmButton: false,
      timer: 3000,
      timerProgressBar: true,
      background: '#1c1d1f',
      color: '#ffffff',
      iconColor: '#d93025',
      showClass: {
        popup: 'animate-toast-in'
      },
      hideClass: {
        popup: 'animate-toast-out'
      },
      didOpen: (toast) => {
        toast.addEventListener('mouseenter', Swal.stopTimer);
        toast.addEventListener('mouseleave', Swal.resumeTimer);
        const progress = toast.querySelector('.swal2-timer-progress-bar');
        if (progress) progress.style.backgroundColor = '#d93025';
      }
    });

    window.notificar = (mensaje, tipo = 'info', customTimer = 3000, options = {}) => {
      const meta = NOTIFY_META[tipo] || NOTIFY_META.info;

      const title = options.title || mensaje;
      const text = options.title ? mensaje : (options.text || '');

      Toast.fire({
        icon: tipo,
        title,
        text,
        timer: customTimer,
        background: options.background || '#1c1d1f',
        color: options.color || '#ffffff',
        iconColor: options.iconColor || '#d93025'
      });

      const shouldSound = options.sound !== false && (options.sound === true || tipo !== 'info');
      if (shouldSound) {
        tocarSonidoNotificacion_(tipo);
      }
    };

    window.lanzarNotificacion = window.notificar;

    // =========================================================
    // MODAL DEL SISTEMA
    // =========================================================
    window.modalSistema = ({
      tipo = 'info',
      title = null,
      text = '',
      confirmText = 'Aceptar',
      cancelText = 'Cancelar',
      showCancelButton = false,
      reverseButtons = true
    } = {}) => {
      return Swal.fire({
        icon: tipo,
        title: title || 'Mensaje del sistema',
        html: escapeHtml_(text),
        showCancelButton,
        reverseButtons,
        confirmButtonText: confirmText,
        cancelButtonText: cancelText,
        background: '#1c1d1f',
        color: '#ffffff',
        confirmButtonColor: '#d93025',
        cancelButtonColor: '#454040',
        didOpen: () => {
          tocarSonidoNotificacion_(tipo === 'info' ? 'warning' : tipo);
        }
      });
    };

    window.confirmarSistema = (config = {}) => {
      return window.modalSistema({
        tipo: config.tipo || 'warning',
        title: config.title || 'Confirmar acción',
        text: config.text || '¿Deseas continuar?',
        confirmText: config.confirmText || 'Continuar',
        cancelText: config.cancelText || 'Cancelar',
        showCancelButton: true,
        reverseButtons: true
      });
    };

    inicializarAudioNotificaciones_();


    // =========================================================
    // HELPERS DE SHELL
    // =========================================================

    function getSwalPopup_() {
      try {
        return typeof Swal !== 'undefined' && typeof Swal.getPopup === 'function'
          ? Swal.getPopup()
          : document.querySelector('.swal2-popup');
      } catch (e) {
        return document.querySelector('.swal2-popup');
      }
    }

    function esToastVisible_() {
      const popup = getSwalPopup_();
      return !!(popup && popup.classList.contains('swal2-toast'));
    }

    function limpiarRecursosDeVistaAnterior({ cerrarToast = false } = {}) {
      window.initVista = null;

      if (window.temporizadorActualizacion) {
        clearInterval(window.temporizadorActualizacion);
        window.temporizadorActualizacion = null;
      }

      if (window.intervaloReimpresion) {
        clearInterval(window.intervaloReimpresion);
        window.intervaloReimpresion = null;
      }

      if (typeof Swal !== 'undefined' && Swal.isVisible()) {
        const popup = getSwalPopup_();
        const esToast = !!(popup && popup.classList.contains('swal2-toast'));

        // Solo cerramos si NO es toast o si explícitamente queremos cerrarlo
        if (!esToast || cerrarToast) {
          Swal.close();
        }
      }

      window.escribiendo = false;
      window.lanzarNotificacion = window.notificar;
    } 

    async function cargarScriptExternoSeguro(oldScript) {
      const src = oldScript.getAttribute("src");
      if (!src) return;

      const yaExiste = document.querySelector(`script[data-shell-src="${src}"]`);
      if (yaExiste) {
        console.log("♻️ [Shell] Script externo ya cargado, se reutiliza:", src);
        return;
      }

      await new Promise((resolve, reject) => {
        const externalScript = document.createElement("script");
        externalScript.src = src;
        externalScript.async = false;
        externalScript.dataset.shellSrc = src;

        Array.from(oldScript.attributes).forEach(attr => {
          if (attr.name !== "src" && attr.name !== "type") {
            externalScript.setAttribute(attr.name, attr.value);
          }
        });

        externalScript.onload = () => {
          console.log("✅ [Shell] Script externo cargado:", src);
          resolve();
        };

        externalScript.onerror = (err) => {
          console.error("❌ [Shell] Error cargando script externo:", src, err);
          reject(new Error(`No se pudo cargar el script externo: ${src}`));
        };

        document.body.appendChild(externalScript);
      });
    }

    function ejecutarScriptInline(scriptContent, scriptType = "text/javascript") {
      const runtimeScript = document.createElement("script");
      runtimeScript.type = scriptType;
      runtimeScript.text = scriptContent;
      document.body.appendChild(runtimeScript);
      document.body.removeChild(runtimeScript);
    }

    async function ejecutarScriptsDeVista(container) {
      const scripts = Array.from(container.querySelectorAll("script"));

      for (const oldScript of scripts) {
        const originalType = (oldScript.getAttribute("type") || "").toLowerCase().trim();
        const scriptContent = oldScript.textContent || "";

        console.log("🔍 [Shell] Analizando script:", {
          type: originalType || "(vacío)",
          src: oldScript.src || "(inline)",
          preview: (scriptContent || "").substring(0, 120)
        });

        if (originalType === "text/template" || originalType === "text/x-template" || originalType === "application/json" || originalType === "application/ld+json") {
          console.log("⏭️ [Shell] Script omitido por ser plantilla/datos:", originalType);
          continue;
        }

        if (originalType === "module") {
          console.warn("⚠️ [Shell] Script type='module' omitido por incompatibilidad con HtmlService.");
          continue;
        }

        if (oldScript.src) {
          await cargarScriptExternoSeguro(oldScript);
          continue;
        }

        if (originalType === "text/babel" || originalType === "text/jsx") {
          try {
            const transpiled = Babel.transform(scriptContent, {
              presets: [["react", { runtime: "classic" }]],
              sourceType: "script"
            }).code;

            ejecutarScriptInline(transpiled, "text/javascript");
            console.log("✅ [Shell] Script Babel transpildado y ejecutado");
          } catch (err) {
            console.error("❌ [Shell] Error transpiling Babel script:", err);
            throw err;
          }
          continue;
        }

        if (originalType === "" || originalType === "text/javascript" || originalType === "application/javascript") {
          try {
            ejecutarScriptInline(scriptContent, "text/javascript");
            console.log("✅ [Shell] Script JS ejecutado");
          } catch (err) {
            console.error("❌ [Shell] Error ejecutando script JS:", err);
            throw err;
          }
          continue;
        }

        console.warn("⚠️ [Shell] Tipo de script no manejado, se omite:", originalType);
      }
    }

    // =========================================================
    // APP PRINCIPAL
    // =========================================================
    const App = () => {
      const [activeTool, setActiveTool] = useState('FormularioTraspasos');
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      const [viewContent, setViewContent] = useState("");
      const [loading, setLoading] = useState(false);
      const containerRef = useRef(null);

    window.inicializarMegaData = () => {
      if (window.DATA_ALMACEN_CACHE) {
        console.log("⚡ [MegaData] Datos leídos desde memoria local. No se consulta al servidor.");
        return Promise.resolve(window.DATA_ALMACEN_CACHE);
      }

      return new Promise((resolve, reject) => {
        const t0 = performance.now();
        console.log(`[BOOT][CLIENTE] Inicio inicializarMegaData: ${t0.toFixed(2)} ms`);

        // Paso A: avisar al usuario
        window.notificar("Sincronizando base de datos...", "info", 4200, {
          title: "Sincronización",
          sound: false
        });

        console.log(
          `[BOOT][CLIENTE] Toast solicitado en: ${(performance.now() - t0).toFixed(2)} ms`
        );

        // Paso B: darle tiempo al navegador para pintar el toast
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            const tDispatch = performance.now();

            console.log(
              `[BOOT][CLIENTE] Despachando APPALMACENController_getBootstrap en: ${(tDispatch - t0).toFixed(2)} ms`
            );

            google.script.run
              .withSuccessHandler((megaData) => {
                const tSuccess = performance.now();

                console.log(
                  `[BOOT][CLIENTE] Respuesta bootstrap recibida en: ${(tSuccess - t0).toFixed(2)} ms`
                );

                window.DATA_ALMACEN_CACHE = megaData;
                window.usuariosGlobal = megaData.usuarios || [];
                window.bodegasGlobal = megaData.bodegas || [];
                window.codigosGlobal = megaData.codigos || [];
                window.mapaCatalogoGlobal = megaData.mapaCatalogo || megaData.mapaProductos || {};
                window.mapaUbicacionesExcedentesGlobal =
                  megaData.mapaUbicacionesExcedentes || megaData.mapaUbicaciones || [];

                console.log("[BOOT][CLIENTE] Resumen bootstrap:", {
                  usuarios: window.usuariosGlobal.length,
                  bodegas: window.bodegasGlobal.length,
                  codigos: window.codigosGlobal.length,
                  ubicaciones: window.mapaUbicacionesExcedentesGlobal.length
                });

                window.notificar("Base de datos sincronizada exitosamente", "success", 3200, {
                  title: "Sistema listo",
                  sound: true
                });

                console.log("📦 [MegaData Cache] Datos sincronizados por primera vez:", megaData);
                console.log(
                  `[BOOT][CLIENTE] Finalizó inicializarMegaData en: ${(performance.now() - t0).toFixed(2)} ms`
                );

                resolve(megaData);
              })
              .withFailureHandler((error) => {
                const tFail = performance.now();

                console.error(
                  `[BOOT][CLIENTE] Error bootstrap recibido en: ${(tFail - t0).toFixed(2)} ms`,
                  error
                );

                window.notificar("Error al descargar el catálogo", "error", 4200, {
                  title: "Sincronización fallida",
                  sound: true
                });

                reject(error);
              })
              .APPALMACENController_getBootstrap();
          });
        });
      });
    };

      const seleccionarVista = (id, fileName) => {
        limpiarRecursosDeVistaAnterior({ cerrarToast: false });
        console.log("🧹 [Shell] Preparando carga de vista:", fileName);
        setViewContent("");
        setActiveTool(id);
        setLoading(true);

        google.script.run
          .withSuccessHandler((html) => {
            setViewContent(html);
            setLoading(false);
          })
          .withFailureHandler((err) => {
            console.error("❌ [Shell] Error al cargar la vista:", err);
            setLoading(false);
            window.notificar("Error al cargar la vista", "error", 4200, {
              title: "Carga fallida"
            });
          })
          .APPALMACENController_obtenerContenidoVista(fileName);
      };

      useEffect(() => {
        window.inicializarMegaData()
          .then(() => {
            console.log("✅ [Shell] MegaData lista. Cargando vista inicial...");
            seleccionarVista('FormularioTraspasos', 'FormularioTraspasos');
          })
          .catch((error) => {
            console.error("🚨 [Shell] No se pudo inicializar MegaData:", error);
            window.notificar("Error al sincronizar base de datos. Reintenta.", "error", 4500, {
              title: "Inicialización incompleta",
              badge: "Error"
            });
            setLoading(false);
          });
      }, []);

      useEffect(() => {
        if (!containerRef.current || !viewContent) return;

        let cancelado = false;

        (async () => {
          try {
            console.log("📄 [Shell] viewContent cargado para:", activeTool);
            console.log("🧪 [Shell] typeof window.initVista ANTES:", typeof window.initVista);

            await ejecutarScriptsDeVista(containerRef.current);

            if (cancelado) return;

            console.log("🧪 [Shell] typeof window.initVista DESPUÉS:", typeof window.initVista);

            if (typeof window.initVista === "function") {
              console.log("🚀 [Shell] Ejecutando initVista:", window.initVista.name || "(anónima)");
              window.initVista();
            } else {
              console.warn("⚠️ [Shell] No existe window.initVista para la vista actual");
            }
          } catch (err) {
            console.error("❌ [Shell] Error inicializando vista:", err);
            window.notificar("Error al inicializar la vista", "error", 4500, {
              title: "Inicialización fallida",
              badge: "Crítico"
            });
          }
        })();

        return () => { cancelado = true; };
      }, [viewContent, activeTool]);

      const toolsByCategory = TOOLS.reduce((acc, tool) => {
        if (!acc[tool.category]) acc[tool.category] = [];
        acc[tool.category].push(tool);
        return acc;
      }, {});

      return e("div", { className: "flex h-screen w-full overflow-hidden" },
        e("div", { className: "sidebar-trigger", onMouseEnter: () => setIsSidebarOpen(true) }),
        e("aside", {
          onMouseEnter: () => setIsSidebarOpen(true),
          onMouseLeave: () => setIsSidebarOpen(false),
          className: `bg-[#1c1d1f] flex flex-col z-40 sidebar-transition relative shadow-xl ${isSidebarOpen ? 'sidebar-visible' : 'sidebar-mini'}`
        },
          e("div", { className: "p-4 flex flex-col items-center" },
            e("div", { className: "logo-container flex items-center justify-center shadow-md" },
              e("img", { src: "https://lirp.cdn-website.com/32df9ef3/dms3rep/multi/opt/logo_408868407-1920w.png", alt: "Logo", className: "w-full h-full object-contain" })
            ),
            e("div", { className: `mt-4 text-center transition-all duration-300 ${isSidebarOpen ? 'opacity-100' : 'opacity-0 h-0 overflow-hidden'}` },
              e("span", { className: "block text-white font-black uppercase text-[15px] tracking-[0.05em]" }, "Gestión de Almacén"),
              e("span", { className: "text-[#d93025] font-bold text-[12px] uppercase tracking-[0.20em]" }, "Birlos y Tornillos")
            )
          ),
          e("div", { className: "flex justify-center my-2" },
            e("div", { className: `h-[3px] bg-gray-700/50 transition-all duration-500 ${isSidebarOpen ? 'w-4/5' : 'w-1/2'}` })
          ),
          e("nav", { className: "flex-1 px-3 space-y-6 mt-4 custom-scroll overflow-y-auto" },
            Object.keys(toolsByCategory).map(category =>
              e("div", { key: category, className: "space-y-2" },
                e("div", { className: `px-4 transition-all duration-300 ${isSidebarOpen ? 'opacity-100 h-auto mb-2' : 'opacity-0 h-0 overflow-hidden'}` },
                  e("p", { className: "text-[10px] font-black text-gray-500 uppercase tracking-[0.2em]" }, category)
                ),
                e("div", { className: "space-y-1" },
                  toolsByCategory[category].map(tool =>
                    e("button", {
                      key: tool.id,
                      onClick: () => seleccionarVista(tool.id, tool.id),
                      className: `w-full h-11 flex items-center rounded-xl transition-all group relative ${activeTool === tool.id ? 'bg-[#d93025] text-white shadow-lg shadow-red-900/20' : 'text-gray-400 hover:bg-white/5 hover:text-white'}`
                    },
                      e("div", { className: "min-w-[50px] flex items-center justify-center" },
                        e(Icon, { name: tool.icon, size: 18 })
                      ),
                      e("span", {
                        className: `font-bold uppercase text-[11px] tracking-tight transition-opacity duration-300 ${isSidebarOpen ? 'opacity-100' : 'opacity-0 w-0 overflow-hidden'}`
                      }, tool.name),
                      activeTool === tool.id && isSidebarOpen ? e("div", { className: "absolute right-4 w-1.5 h-1.5 bg-white rounded-full" }) : null
                    )
                  )
                ),
                e("div", { className: "flex justify-center pb-2" },
                  e("div", { className: `h-[3px] bg-gray-700/50 rounded-full transition-all duration-500 ${isSidebarOpen ? 'w-4/5 opacity-100' : 'w-0 opacity-0 overflow-hidden'}` })
                )
              )
            )
          )
        ),
        e("main", { className: "flex-1 flex flex-col relative bg-[#f8f9fa]" },
          isSidebarOpen ? e("div", { className: "overlay-fade", onClick: () => setIsSidebarOpen(false) }) : null,
          e("header", { className: "h-20 bg-white border-b border-[#dadce0] flex items-center justify-between px-10 shrink-0 z-10" },
            e("div", null,
              e("h1", { className: "text-xl font-black uppercase tracking-tighter" },
                TOOLS.find(t => t.id === activeTool)?.name
              )
            )
          ),
          e("div", { className: "flex-1 overflow-auto bg-white m-4 rounded-2xl shadow-sm border border-[#dadce0]" },
            loading
              ? e("div", { className: "flex items-center justify-center h-full" },
                  e(Icon, { name: "loader-2", className: "animate-spin text-[#d93025]", size: 40 })
                )
              : e("div", { ref: containerRef, dangerouslySetInnerHTML: { __html: viewContent } })
          )
        )
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));

    document.getElementById('boot-splash').style.display = 'none';
  </script>
</body>
</html>
