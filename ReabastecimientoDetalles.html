<script>
/**
 * ReabastecimientoDetalles.html
 *
 * Vista operativa de atención de solicitudes de reabastecimiento. Su composición
 * visual replica el patrón de AuditoriaExcedentesDetalle: workspace de altura
 * completa, encabezado oscuro con métricas, toolbar contextual, tabla compacta y
 * drawer lateral amplio para consultar y registrar cajas.

 * REGLAS DE NEGOCIO
 * - Mostrar ubicaciones consulta el estado vigente y marca la partida ATENDIDO.
 * - El surtido físico se acredita únicamente al registrar un IDUNICO.
 * - El navegador nunca es autoridad para código, saldo, bodega o ubicación.

 * ENDPOINTS
 * - ReabastecimientoController_getDetalleSolicitud(idSolicitud)
 * - ReabastecimientoController_getUbicacionesPartida(payload)
 * - ReabastecimientoController_validarIdUnico(payload)

 */
</script>

<script type="text/babel">
window.cargar_ReabastecimientoDetalles=()=>{
  const{useState,useEffect,useMemo,useCallback,useRef}=React;
  const str=v=>String(v==null?"":v).trim(),up=v=>str(v).toUpperCase(),num=v=>Number.isFinite(Number(v))?Number(v):0;
  const notify=(m,t="info",timer=2800,o={})=>{const f=window.notificar||window.lanzarNotificacion;if(typeof f==="function")f(m,t,timer,o)};
  const publicError=e=>str(e?.message||e).replace(/^\[[A-Z0-9_]+\]\s*/,"")||"No fue posible completar la operación.";
  function Icon({name,size=17}){const ref=useRef(null);useEffect(()=>{if(!window.lucide||!ref.current)return;ref.current.innerHTML="";const i=document.createElement("i");i.setAttribute("data-lucide",name);i.style.width=`${size}px`;i.style.height=`${size}px`;ref.current.appendChild(i);window.lucide.createIcons()},[name,size]);return <span ref={ref} className="inline-flex items-center justify-center"/>}
  const rpc=(method,...args)=>new Promise((resolve,reject)=>{if(!window.google?.script?.run)return reject(new Error("google.script.run no está disponible."));const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);if(typeof runner[method]!=="function")return reject(new Error(`Endpoint no disponible: ${method}`));runner[method](...args)});
  const parseEnvelope=(response,required=[])=>{let value=response;if(typeof value==="string")value=JSON.parse(value);if(value?.ok===false)throw new Error(value.message||value.error?.message||"Operación no exitosa.");const data=value?.ok===true?value.data:value;if(!data||typeof data!=="object")throw new Error("El servidor devolvió un contrato vacío.");required.forEach(key=>{if(!(key in data))throw new Error(`El contrato no contiene ${key}.`)});return data};
  function Metric({label,value,tone,progress}){return <div className={`rdd-metric ${tone||""}`}><div className="rdd-metric-value">{value}</div><div className="rdd-metric-label">{label}</div>{progress!=null&&<div className="rdd-track"><div className="rdd-bar" style={{width:`${Math.min(100,progress)}%`,background:progress===100?"var(--ok)":"var(--c)"}}/></div>}</div>}
  function DrawerMetric({label,value,tone}){return <div className={`rdd-drawer-metric ${tone||""}`}><strong>{value}</strong><span>{label}</span></div>}

  function LocationsDrawer({model,onClose,onRegistered}){
    const[query,setQuery]=useState(""),[filter,setFilter]=useState("TODAS"),[idUnico,setIdUnico]=useState(""),[user,setUser]=useState(str(window.DATA_ALMACEN_CACHE?.reabastecimientoUsuario)),[validation,setValidation]=useState(null),[busy,setBusy]=useState(false),[message,setMessage]=useState({text:"",type:""});
    useEffect(()=>{const old=document.body.style.overflow;document.body.style.overflow="hidden";const key=e=>e.key==="Escape"&&onClose();window.addEventListener("keydown",key);return()=>{document.body.style.overflow=old;window.removeEventListener("keydown",key)}},[onClose]);
    const boxes=Array.isArray(model?.cajasPorEscanear)?model.cajasPorEscanear:[],warehouses=useMemo(()=>[...new Set(boxes.map(x=>str(x.bodegaExcedente)||"SIN BODEGA"))],[boxes]);
    const filtered=useMemo(()=>{const q=up(query);return boxes.filter(x=>(filter==="TODAS"||up(x.bodegaExcedente)===filter)&&(!q||up([x.idUnico,x.bodegaExcedente,x.ubicacionExcedente,x.cantidad].join(" ")).includes(q)))},[boxes,query,filter]);
    const selectBox=box=>{setIdUnico(str(box.idUnico));setValidation(null);setMessage({text:"",type:""})};
    const validate=async()=>{if(!idUnico)return setMessage({text:"Captura o selecciona un IDUNICO.",type:"error"});setBusy(true);try{const response=await rpc("ReabastecimientoController_validarIdUnico",{idSolicitud:model.idSolicitud,idPartidaConsecutivo:model.partida.idPartidaConsecutivo,idUnico});const data=parseEnvelope(response,["valido"]);setValidation(data);setMessage({text:"IDUNICO válido y disponible.",type:"success"})}catch(e){setValidation(null);setMessage({text:publicError(e),type:"error"})}finally{setBusy(false)}};
    const register=async()=>{if(!validation||up(validation.idUnico)!==up(idUnico))return setMessage({text:"Valida nuevamente el IDUNICO.",type:"error"});if(!str(user))return setMessage({text:"Captura el usuario responsable.",type:"error"});setBusy(true);try{await rpc("ReabastecimientoController_registrarIdUnico",{idSolicitud:model.idSolicitud,idPartidaConsecutivo:model.partida.idPartidaConsecutivo,idUnico,usuario:user});window.DATA_ALMACEN_CACHE=window.DATA_ALMACEN_CACHE||{};window.DATA_ALMACEN_CACHE.reabastecimientoUsuario=user;setValidation(null);setIdUnico("");setMessage({text:"Caja registrada correctamente.",type:"success"});await onRegistered()}catch(e){setMessage({text:publicError(e),type:"error"})}finally{setBusy(false)}};
    return <div className="rdd-drawer-layer" role="dialog" aria-modal="true"><button className="rdd-drawer-backdrop" onClick={onClose}/><aside className="rdd-drawer">
      <header className="rdd-drawer-header"><div className="rdd-drawer-main"><div className="rdd-drawer-identity"><div className="rdd-drawer-icon"><Icon name="warehouse" size={23}/></div><div><p className="rdd-eyebrow">Ubicaciones de excedente</p><h2 className="rdd-drawer-title">{model.partida.codigo}</h2><p className="rdd-drawer-subtitle">{model.partida.descripcion} · Piso {model.partida.ubicacionSurtido} · {model.idSolicitud}</p></div></div><button className="rdd-drawer-close" onClick={onClose}><Icon name="x" size={19}/></button></div></header>
      <section className="rdd-drawer-metrics"><DrawerMetric label="Cajas vigentes" value={boxes.length+num(model.resumen.cajasEscaneadas)}/><DrawerMetric label="Por escanear" value={boxes.length} tone="amber"/><DrawerMetric label="Escaneadas" value={num(model.resumen.cajasEscaneadas)} tone="green"/><DrawerMetric label="Piezas disponibles" value={num(model.resumen.piezasPorEscanear).toLocaleString("es-MX")}/><DrawerMetric label="Bodegas" value={warehouses.length}/></section>
      <section className="rdd-drawer-control"><input className="rdd-search" placeholder="Buscar IDUNICO, ubicación o bodega..." value={query} onChange={e=>setQuery(e.target.value)}/><div className="rdd-filters"><button className={`rdd-filter ${filter==="TODAS"?"active":""}`} onClick={()=>setFilter("TODAS")}>Todas</button>{warehouses.map(w=><button key={w} className={`rdd-filter ${filter===up(w)?"active":""}`} onClick={()=>setFilter(up(w))}>{w}</button>)}</div></section>
      <section className="rdd-drawer-content">{filtered.length?<table className="rdd-table"><thead><tr><th>Bodega</th><th>Ubicación de excedente</th><th>IDUNICO</th><th>Piezas</th><th>Estado</th><th>Acción</th></tr></thead><tbody>{filtered.map((box,i)=><tr key={`${box.idUnico}-${i}`}><td><b>{box.bodegaExcedente||"SIN BODEGA"}</b></td><td><span className="rdd-mono">{box.ubicacionExcedente||"SIN UBICACIÓN"}</span></td><td><span className="rdd-mono">{box.idUnico}</span></td><td><b>{num(box.cantidad).toLocaleString("es-MX")}</b></td><td><span className="rdd-chip amber">Pendiente</span></td><td><button className="rdd-detail-btn" onClick={()=>selectBox(box)}><Icon name="scan-line" size={14}/>Seleccionar</button></td></tr>)}</tbody></table>:<div className="rdd-empty"><Icon name="package-open" size={32}/><b>Sin cajas pendientes</b></div>}</section>
      <footer className="rdd-drawer-footer"><div><div className="rdd-sub">{filtered.length} de {boxes.length} cajas visibles</div>{message.text&&<div className={`rdd-message ${message.type}`}>{message.text}</div>}{validation&&<div className="rdd-sub">Validado: {validation.codigo} · {num(validation.cantidad).toLocaleString("es-MX")} piezas · {validation.ubicacion}</div>}</div><div className="rdd-form"><div className="rdd-field"><label>IDUNICO</label><input className="rdd-input" value={idUnico} onChange={e=>{setIdUnico(e.target.value);setValidation(null)}} placeholder="Escanea o selecciona"/></div><div className="rdd-field"><label>Usuario responsable</label><input className="rdd-input" value={user} onChange={e=>setUser(e.target.value.toUpperCase())}/></div><button className="rdd-small-btn" disabled={busy} onClick={validate}>Validar</button><button className="rdd-small-btn primary" disabled={busy||!validation} onClick={register}>Registrar</button></div></footer>
    </aside></div>
  }

  function App(){
