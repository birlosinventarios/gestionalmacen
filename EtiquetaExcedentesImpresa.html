<script>/** EtiquetaExcedentesImpresa.html */</script>

<?
  var LOGO_QR_URL = 'https://lirp.cdn-website.com/32df9ef3/dms3rep/multi/opt/logo_408868407-1920w.png';

  var QR_CONFIG = {
    size: 800,                    // ← subido para alta resolución
    margin: 3,
    ecLevel: 'H',
    dark: '000000',
    light: 'FFFFFF',
    dotStyle: 'dot',
    finderStyle: 'rounded',
    finderDotStyle: 'rounded',
    finderColor: '000000',
    centerImageSizeRatio: 0.24
  };

  function construirQr_(texto) {
    var params = [
      'text=' + encodeURIComponent(String(texto || '')),
      'size=' + QR_CONFIG.size,
      'margin=' + QR_CONFIG.margin,
      'ecLevel=' + QR_CONFIG.ecLevel,
      'dark=' + QR_CONFIG.dark,
      'light=' + QR_CONFIG.light,
      'dotStyle=' + QR_CONFIG.dotStyle,
      'finderStyle=' + QR_CONFIG.finderStyle,
      'finderDotStyle=' + QR_CONFIG.finderDotStyle,
      'finderColor=' + QR_CONFIG.finderColor,
      'centerImageUrl=' + encodeURIComponent(LOGO_QR_URL),
      'centerImageSizeRatio=' + QR_CONFIG.centerImageSizeRatio
    ];

    return 'https://quickchart.io/qr?' + params.join('&');
  }

  function construirQrFallback_(texto) {
    return 'https://api.qrserver.com/v1/create-qr-code/?'
      + 'size=800x800'
      + '&data=' + encodeURIComponent(String(texto || ''))
      + '&ecc=H'
      + '&margin=3'
      + '&color=000000'
      + '&bgcolor=FFFFFF';
  }

  var TOTAL_IMAGENES_ESPERADAS = (lote && lote.length) ? lote.length * 2 : 0;
?>

<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <style>
    /* VARIABLES DE ESCALA PARA 12.5x8 (Compensado a 13x8.4) */
    :root {
      --ancho-papel: 9.5cm;
      --alto-papel: 15cm;
      --ancho-diseno: 15cm;
      --alto-diseno: 9.5cm;
    }

    * { box-sizing: border-box; }

    @page {
      size: letter;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Century Gothic", AppleGothic, sans-serif;

    }

    .contenedor-impresion {
      width: 100%;

      flex-direction: column;

    }

<? if (!lote || !lote.length) { ?>
  <div style="padding:20px; text-align:center;">
    <b>No hay registros para imprimir</b>
  </div>
<? } else { ?>

  <div class="contenedor-impresion">
    <? lote.forEach(function(item) { ?>
      <div class="etiqueta">

        <img
          src="<?= LOGO_QR_URL ?>"
          class="marca-agua"
          alt=""
          aria-hidden="true"
          onload="registrarCarga()"
          onerror="registrarCarga()"
        >

        <div class="header">
          <h1 class="codigo-titulo"><?= item.codigo ?></h1>
          <span class="fecha-badge"><?= fechaHora ?></span>
        </div>

        <div class="cuerpo">
          <div class="info">
            <div class="descripcion"><?= item.descripcion ?></div>
            <div class="pzas-container">
              <span class="pzas-valor"><?= item.cantidad ?></span>
              <span class="pzas-label">PZAS</span>
            </div>
          </div>

          <div class="qr-seccion">
            <div class="qr-container">
              <img
                src="<?= construirQr_(item.idUnico) ?>"
                onload="registrarCarga()"
                onerror="this.onerror=null; this.src='<?= construirQrFallback_(item.idUnico) ?>'; registrarCarga();"
                alt="QR <?= item.idUnico ?>"
              >
            </div>
            <div class="excedentes-label">EXCEDENTES</div>
          </div>
        </div>

        <div class="footer-datos">
          <span><?= item.idUnico ?></span>
        </div>

      </div>
    <? }); ?>
  </div>

<? } ?>

<script>
  let imagenesCargadas = 0;
  const totalImagenesEsperadas = <?= TOTAL_IMAGENES_ESPERADAS ?>;
  let impresionLanzada = false;

  function lanzarImpresion() {
    if (!impresionLanzada) {
      impresionLanzada = true;
      console.log("Lanzando impresión...");
      window.print();
    }
  }

  function registrarCarga() {
    imagenesCargadas++;
    if (imagenesCargadas >= totalImagenesEsperadas) {
      lanzarImpresion();
    }
  }

  window.onload = function () {
    if (totalImagenesEsperadas === 0) return;
    setTimeout(lanzarImpresion, 3500);
  };
</script>

</body>
</html>
