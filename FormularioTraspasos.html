      <script>
// --- 1. DECLARACIÓN DE VARIABLES EN ÁMBITO GLOBAL SEGURO ---
// Usamos "window." para asegurar que persistan en el ciclo de vida de la página
window.colaDeTraspasos = window.colaDeTraspasos || [];
window.cacheCatalogo = window.cacheCatalogo || {}; 
window.todosLosCodigosGlobal = window.todosLosCodigosGlobal || []; 
window.mapaUbicacionesGlobal = window.mapaUbicacionesGlobal || [];
window.usuariosGlobal = window.usuariosGlobal || []; 
window.bodegasGlobal = window.bodegasGlobal || [];

var DEFAULT_VALUE = "1 - Almacen Birlos";
var cargandoMegaData = false;

// --- 2. FUNCIÓN DE MONTAJE Y RE-INICIALIZACIÓN ---
window.inicializarVistaTraspasos = function() {
  console.log("🛠️ Montando y re-vinculando componentes de Formulario de Traspasos...");

  const cuerpoForm = document.getElementById('cuerpoFormulario');
  if (cuerpoForm) cuerpoForm.style.display = "none";
  
  // Re-vincular los Event Listeners a los nuevos elementos del DOM
  vincularEventosDOM();

  // ⚡ COMPARTIMIENTO INTELIGENTE DE CACHÉ:
  // Si la aplicación principal ya sincronizó la base de datos, usamos esa información al instante
  if (window.DATA_ALMACEN_CACHE) {
    console.log("⚡ [UX FITO] Cargando base de datos unificada desde APPALMACEN...");
    window.usuariosGlobal = window.DATA_ALMACEN_CACHE.usuarios || [];
    window.bodegasGlobal = window.DATA_ALMACEN_CACHE.bodegas || [];
    window.todosLosCodigosGlobal = window.DATA_ALMACEN_CACHE.codigos || window.DATA_ALMACEN_CACHE.catalogo || [];
    window.mapaUbicacionesGlobal = window.DATA_ALMACEN_CACHE.mapaUbicaciones || [];
    
    inicializarDatalistsLocales();
    actualizarVistaLista();
  } else if (window.usuariosGlobal && window.usuariosGlobal.length > 0) {
    console.log("⚡ [UX FITO] Reutilizando catálogo existente en memoria local del formulario.");
    inicializarDatalistsLocales();
    actualizarVistaLista(); 
  } else {
    // Si por alguna razón no se ha sincronizado nada, hacemos la llamada al servidor
    window.cargar_FormularioTraspasos();
  }
};

window.cargar_FormularioTraspasos = function() {
  if (cargandoMegaData) return;
  cargandoMegaData = true;
  
  lanzarNotificacion("Descargando catálogo...", "info");

  google.script.run
    .withSuccessHandler(function(datos) {
      cargandoMegaData = false;
      if (!datos) return;
      
      window.usuariosGlobal = datos.usuarios || [];
      window.bodegasGlobal = datos.bodegas || [];
      window.todosLosCodigosGlobal = datos.codigos || [];
      window.mapaUbicacionesGlobal = datos.mapaUbicaciones || [];

      inicializarDatalistsLocales();
      lanzarNotificacion("Catálogo sincronizado", "success");
    })
    .withFailureHandler(err => {
      cargandoMegaData = false;
      lanzarNotificacion("Error: " + err.message, "error");
    })
    .obtenerMegaDataInicial(); 
};

function inicializarDatalistsLocales() {
  const dlSolicitantes = document.getElementById('listaSolicitantes');
  if (dlSolicitantes) {
    dlSolicitantes.innerHTML = window.usuariosGlobal
      .map(u => `<option value="${u.nombre}">`)
      .join('');
  }
  
  const opcionesBodegas = window.bodegasGlobal.map(b => `<option value="${b}">`).join('');
  document.querySelectorAll('#listaBodega').forEach(el => {
    el.innerHTML = opcionesBodegas;
  });
  
  if (typeof actualizarDatalist === "function") {
    actualizarDatalist(window.todosLosCodigosGlobal);
  }
}

// Vinculación dinámica de eventos (evita que se pierdan al destruir el DOM)
function vincularEventosDOM() {
  const solicitanteInput = document.getElementById('solicitanteInput');
  const tipoMovimientoInput = document.getElementById('tipoMovimientoInput');
  const codigoInput = document.getElementById('codigoInput');
  const ubiSalidaInput = document.getElementById('ubiSalidaInput');
  const ubiEntradaInput = document.getElementById('ubiEntradaInput');
  const cantidadInput = document.getElementById('cantidadInput');
  const bodegaSalidaInput = document.getElementById('bodegaSalidaInput');
  const bodegaEntradaInput = document.getElementById('bodegaEntradaInput');

  if (solicitanteInput) {
    solicitanteInput.addEventListener('input', (e) => {
      const nombre = e.target.value.trim();
      document.getElementById('nombreSolicitanteDinamico').innerText = nombre || "Sin solicitante";
    });
    solicitanteInput.addEventListener('change', function() {
      validarValorEnLista('solicitanteInput', window.usuariosGlobal, "solicitante");
      if (this.value.trim() && bodegaSalidaInput) bodegaSalidaInput.focus();
    });
  }

  if (tipoMovimientoInput) {
    tipoMovimientoInput.addEventListener('change', gestionarVisibilidad);
  }

  if (codigoInput) {
    codigoInput.addEventListener('change', buscarPorCodigo);
  }

  if (ubiSalidaInput) {
    ubiSalidaInput.addEventListener('change', function() {
      const bodegaActual = bodegaSalidaInput.value.toUpperCase();
      const ubicacionesPermitidas = window.mapaUbicacionesGlobal
        .filter(item => item.bodega === bodegaActual)
        .map(item => item.ubi);
      
      validarValorEnLista('ubiSalidaInput', ubicacionesPermitidas, "ubicación");

      if (!this.value.trim()) return;
      if (tipoMovimientoInput.value === "Cambio de bodega" && bodegaEntradaInput) {
        bodegaEntradaInput.focus();
      } else {
        codigoInput.focus();
      }
    });
  }

  if (ubiEntradaInput) {
    ubiEntradaInput.addEventListener('change', function() {
      const bodegaActual = bodegaEntradaInput.value.toUpperCase();
      const ubicacionesPermitidas = window.mapaUbicacionesGlobal
        .filter(item => item.bodega === bodegaActual)
        .map(item => item.ubi);
      
      validarValorEnLista('ubiEntradaInput', ubicacionesPermitidas, "ubicación");
      if (this.value.trim()) codigoInput.focus();
    });
  }

  if (cantidadInput) {
    cantidadInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        agregarALista(); 
      }
    });
  }

  if (bodegaSalidaInput) {
    bodegaSalidaInput.addEventListener('change', function() {
      validarValorEnLista('bodegaSalidaInput', window.bodegasGlobal, "bodega");
    });
  }

  if (bodegaEntradaInput) {
    bodegaEntradaInput.addEventListener('change', function() {
      validarValorEnLista('bodegaEntradaInput', window.bodegasGlobal, "bodega");
    });
  }
}

// --- Resto de funciones auxiliares que ya tenías ---
function gestionarVisibilidad() {
  const tipo = document.getElementById('tipoMovimientoInput').value;
  const cuerpoForm = document.getElementById('cuerpoFormulario');
  const tiposValidos = ["Acomodo", "Surtido", "Cambio de bodega"];

  if (!tiposValidos.includes(tipo)) {
    cuerpoForm.style.display = "none";
    return;
  }

  cuerpoForm.style.display = "block";
  const seccionEntrada = document.getElementById('seccionEntrada');
  seccionEntrada.style.display = (tipo === "Cambio de bodega") ? "block" : "none";

  ["bodegaSalidaInput", "ubiSalidaInput", "bodegaEntradaInput", "ubiEntradaInput"].forEach(id => {
    document.getElementById(id).value = "";
  });

  document.getElementById('solicitanteInput').focus();
}

function actualizarDatalist(lista) {
  const dl = document.getElementById('listaCodigosDinamica');
  if (dl) dl.innerHTML = lista.map(c => `<option value="${c}">`).join('');
}

function buscarPorCodigo() {
  const inputCodigo = document.getElementById('codigoInput');
  const codigo = inputCodigo.value.trim().toUpperCase();
  if (!codigo) return;

  if (!window.todosLosCodigosGlobal.includes(codigo)) {
    lanzarNotificacion(`⚠️ El código "${codigo}" no existe en el catálogo.`, "error");
    inputCodigo.value = "";
    document.getElementById('descripcionInput').value = "";
    inputCodigo.focus();
    return;
  }

  if (window.cacheCatalogo[codigo]) {
    document.getElementById('descripcionInput').value = window.cacheCatalogo[codigo];
    document.getElementById('cantidadInput').focus();
    return;
  }

  document.getElementById('descripcionInput').placeholder = "Buscando...";
  google.script.run.withSuccessHandler(res => {
      if (res.encontrado) {
        document.getElementById('descripcionInput').value = res.descripcion;
        window.cacheCatalogo[codigo] = res.descripcion;
        document.getElementById('cantidadInput').focus(); 
      }
    })
    .buscarProductoPorCodigo(codigo);
}

function cargarUbicaciones(idInputBodega, idDatalist, idInputUbi) {
  const inputBodega = document.getElementById(idInputBodega);
  const bodegaSeleccionada = inputBodega.value.trim().toUpperCase();
  const dlUbicaciones = document.getElementById(idDatalist);
  const inputUbi = document.getElementById(idInputUbi);

  if (!bodegaSeleccionada) {
    dlUbicaciones.innerHTML = "";
    return;
  }

  const filtradas = window.mapaUbicacionesGlobal
    .filter(item => item.bodega === bodegaSeleccionada)
    .map(item => item.ubi);

  if (filtradas.length > 0) {
    const unicas = [...new Set(filtradas)].sort();
    dlUbicaciones.innerHTML = unicas.map(u => `<option value="${u}">`).join('');
    inputUbi.placeholder = "Seleccione ubicación";
    inputUbi.focus(); 
  } else {
    inputUbi.placeholder = "⚠️ Sin ubicaciones";
    dlUbicaciones.innerHTML = "";
  }
}

function agregarALista() {
  const getVal = (id) => document.getElementById(id).value.trim();
  const tipo = getVal('tipoMovimientoInput');

  const codValido = window.todosLosCodigosGlobal.includes(getVal('codigoInput').toUpperCase());
  const solValido = window.usuariosGlobal.some(u => u.nombre.toUpperCase() === getVal('solicitanteInput').toUpperCase());

  if (!codValido || !solValido) {
    lanzarNotificacion("❌ No se puede añadir: Hay valores no permitidos o campos vacíos", "error");
    return;
  }
  
  let vSalidaBod = getVal('bodegaSalidaInput');
  let vSalidaUbi = getVal('ubiSalidaInput');
  let vEntradaBod = getVal('bodegaEntradaInput');
  let vEntradaUbi = getVal('ubiEntradaInput');

  let bSalida, uSalida, bEntrada, uEntrada;

  if (tipo === "Surtido") {
    bSalida = vSalidaBod || DEFAULT_VALUE;
    uSalida = vSalidaUbi;
    bEntrada = DEFAULT_VALUE;
    uEntrada = DEFAULT_VALUE;
  } 
  else if (tipo === "Acomodo") {
    bSalida = DEFAULT_VALUE;
    uSalida = DEFAULT_VALUE;
    bEntrada = vSalidaBod || DEFAULT_VALUE;
    uEntrada = vSalidaUbi;
  } 
  else {
    bSalida = vSalidaBod || DEFAULT_VALUE;
    uSalida = vSalidaUbi;
    bEntrada = vEntradaBod || DEFAULT_VALUE;
    uEntrada = vEntradaUbi;
  }

  const item = {
    tipo: tipo,
    solicitante: getVal('solicitanteInput').toUpperCase(),
    codigo: getVal('codigoInput').toUpperCase(),
    descripcion: getVal('descripcionInput').toUpperCase(),
    cantidad: parseFloat(getVal('cantidadInput')),
    bodegaSalida: bSalida,
    ubiSalida: uSalida,
    bodegaEntrada: bEntrada,
    ubiEntrada: uEntrada,
    idUnico: `${Date.now()}-${getVal('codigoInput')}`.replace(/\s+/g, '')
  };

  if (!item.tipo || !item.solicitante || !item.codigo || isNaN(item.cantidad) || item.cantidad <= 0) {
    return lanzarNotificacion("❌ Datos incompletos", "error");
  }

  if ((tipo === "Surtido" || tipo === "Cambio de bodega") && !uSalida) {
    return lanzarNotificacion("⚠️ Indica la ubicación de Salida", "warning");
  }
  if ((tipo === "Acomodo" || tipo === "Cambio de bodega") && !uEntrada) {
    return lanzarNotificacion("⚠️ Indica la ubicación de Entrada", "warning");
  }

  window.colaDeTraspasos.push(item);
  actualizarVistaLista();
  
  document.getElementById('codigoInput').value = "";
  document.getElementById('descripcionInput').value = "";
  document.getElementById('cantidadInput').value = "";
  document.getElementById('codigoInput').focus();
  lanzarNotificacion("✅ Añadido");
}

function actualizarVistaLista() {
  const listaUL = document.getElementById('listaTraspasos');
  const plantillaEl = document.getElementById('plantillaTraspaso');
  if (!listaUL || !plantillaEl) return;
  
  const plantilla = plantillaEl.innerHTML;
  const btnRegistrar = document.getElementById('btnRegistrarTodo');
  const textoBtn = document.getElementById('textoBotonRegistrar');
  const contador = document.getElementById('contador');

  listaUL.innerHTML = window.colaDeTraspasos.map((item, i) => {
    const tipoCss = item.tipo.toLowerCase().replace(/\s+/g, '-');
    let ubiHtml = (item.tipo === "Cambio de bodega") 
      ? `<span class="ubi-badge">${item.ubiSalida}</span> ➔ <span class="ubi-badge">${item.ubiEntrada}</span>`
      : `<span class="ubi-badge">${item.tipo === "Acomodo" ? item.ubiEntrada : item.ubiSalida}</span>`;

    return plantilla
      .replace(/{{INDEX}}/g, i)
      .replace("{{TIPO_CSS}}", tipoCss)
      .replace("{{TIPO}}", item.tipo)
      .replace("{{CODIGO}}", item.codigo)
      .replace("{{DESCRIPCION}}", item.descripcion)
      .replace("{{UBI_HTML}}", ubiHtml)
      .replace("{{CANTIDAD}}", item.cantidad);
  }).join('');

  const cant = window.colaDeTraspasos.length;
  if (contador) contador.innerText = cant;

  if (btnRegistrar && textoBtn) {
    if (cant > 0) {
      btnRegistrar.style.display = "block";
      textoBtn.innerText = `Registrar traspasos`;
    } else {
      btnRegistrar.style.display = "none";
    }
  }
}

function quitarDeLista(index) {
  window.colaDeTraspasos.splice(index, 1);
  actualizarVistaLista();
}

function generar() {
  if (window.colaDeTraspasos.length === 0) return;

  const btn = document.getElementById('btnRegistrarTodo');
  const contenidoOriginal = btn.innerHTML;

  btn.disabled = true;
  btn.innerHTML = '<span class="material-icons rotating">sync</span> Procesando...';

  google.script.run
    .withSuccessHandler(msg => {
      lanzarNotificacion(msg, "success");
      window.colaDeTraspasos = [];
      actualizarVistaLista();
      btn.disabled = false;
      btn.innerHTML = contenidoOriginal;
    })
    .withFailureHandler(err => {
      lanzarNotificacion("❌ Error: " + err.message, "error");
      btn.disabled = false;
      btn.innerHTML = '<span class="material-icons">error</span> Reintentar';
    })
    .procesarTraspasos(window.colaDeTraspasos);
}

function lanzarNotificacion(mensaje, tipo = "info") {
  if (typeof window.notificar === 'function') {
    window.notificar(mensaje, tipo);
  } else {
    const ToastOscuroLocal = Swal.mixin({
      toast: true,
      position: 'top-end',
      showConfirmButton: false,
      timer: 3000,
      timerProgressBar: true,
      background: '#1c1d1f',
      color: '#ffffff',
      iconColor: tipo === 'success' ? '#10b981' : (tipo === 'info' ? '#ffffff' : '#d93025'),
      didOpen: (toast) => {
        toast.addEventListener('mouseenter', Swal.stopTimer);
        toast.addEventListener('mouseleave', Swal.resumeTimer);
        const progress = toast.querySelector('.swal2-timer-progress-bar');
        if (progress) progress.style.backgroundColor = '#d93025';
      }
    });

    ToastOscuroLocal.fire({
      icon: tipo,
      title: mensaje
    });
  }
}

function validarValorEnLista(idInput, listaPermitida, nombreCampo) {
  const input = document.getElementById(idInput);
  if (!input) return false;
  const valor = input.value.trim().toUpperCase();

  if (valor === "") return false;

  const existe = listaPermitida.some(item => 
    (typeof item === 'string' ? item.toUpperCase() : item.nombre.toUpperCase()) === valor
  );

  if (!existe) {
    lanzarNotificacion(`⚠️ El ${nombreCampo} "${valor}" no es válido. Seleccione uno de la lista.`, "error");
    input.value = "";
    input.focus();
    return false;
  }
  return true;
}

// Inicialización automática por retraso en caso de que se abra independiente
setTimeout(() => {
  if (typeof window.inicializarVistaTraspasos === 'function') {
    window.inicializarVistaTraspasos();
  }
}, 100);
</script>
