<script>
(function () {
  // =========================================================
  // ESTADO SEGURO DE LA VISTA
  // =========================================================
  window.FormularioTraspasosState = window.FormularioTraspasosState || {
    usuarios: [],
    bodegas: [],
    codigos: [],
    mapaCatalogo: {},
    mapaUbicacionesExcedentes: [],
    defaultValue: "1 - ALMACEN BIRLOS"
  };

  window.colaDeTraspasos = window.colaDeTraspasos || [];

  const state = window.FormularioTraspasosState;

  // =========================================================
  // HELPERS INTERNOS
  // =========================================================
  function normalizarTexto(valor) {
    return String(valor || "").trim().toUpperCase();
  }

  function getViewRoot_() {
    const cuerpo = document.getElementById('cuerpoFormulario');
    if (cuerpo) {
      const cont = cuerpo.closest('.container');
      if (cont) return cont;
    }
    return document.getElementById('tipoMovimientoInput')?.closest('.container') || null;
  }

  function limpiarCamposCapturaInterno() {
    const codigoInput = document.getElementById('codigoInput');
    const descripcionInput = document.getElementById('descripcionInput');
    const cantidadInput = document.getElementById('cantidadInput');

    if (codigoInput) codigoInput.value = "";
    if (descripcionInput) descripcionInput.value = "";
    if (cantidadInput) cantidadInput.value = "";
    if (codigoInput) codigoInput.focus();
  }

  /**
   * Wrapper local:
   * - Usa SIEMPRE el shell si existe
   * - Mantiene fallback si la vista vive sola fuera de APPALMACEN
   */
  function lanzarNotificacionLocal(mensaje, tipo = "info", options = {}) {
    const timer = options.timer || 3000;
    const title = options.title || null;

    if (typeof window.notificar === 'function') {
      window.notificar(mensaje, tipo, timer, {
        title,
        sound: options.sound
      });
      return;
    }

    // Fallback únicamente si la vista se abre aislada
    const ToastFallback = Swal.mixin({
      toast: true,
      position: 'top-end',
      showConfirmButton: false,
      timer,
      timerProgressBar: true,
      background: '#1c1d1f',
      color: '#ffffff',
      iconColor: '#d93025',
      showClass: {
        popup: 'animate-toast-in'
      },
      hideClass: {
        popup: 'animate-toast-out'
      },
      didOpen: (toast) => {
        toast.addEventListener('mouseenter', Swal.stopTimer);
        toast.addEventListener('mouseleave', Swal.resumeTimer);
        const progress = toast.querySelector('.swal2-timer-progress-bar');
        if (progress) progress.style.backgroundColor = '#d93025';
      }
    });

    ToastFallback.fire({
      icon: tipo,
      title: title || mensaje,
      text: title ? mensaje : ''
    });
  }

  function hidratarDesdeCache_(cache) {
    state.usuarios = cache.usuarios || [];
    state.bodegas = cache.bodegas || [];
    state.codigos = cache.codigos || [];

    // Compatibilidad temporal con contrato nuevo y legacy
    state.mapaCatalogo = cache.mapaCatalogo || cache.mapaProductos || {};
    state.mapaUbicacionesExcedentes =
      cache.mapaUbicacionesExcedentes ||
      cache.mapaUbicaciones ||
      [];

    // Compatibilidad opcional con globals viejas si otra parte todavía las usa
    window.usuariosGlobal = state.usuarios;
    window.bodegasGlobal = state.bodegas;
    window.codigosGlobal = state.codigos;
    window.mapaCatalogoGlobal = state.mapaCatalogo;
    window.mapaUbicacionesExcedentesGlobal = state.mapaUbicacionesExcedentes;
  }

  function guardarEnCacheGlobal_() {
    window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || {};
    window.DATA_ALMACEN_CACHE.usuarios = state.usuarios || [];
    window.DATA_ALMACEN_CACHE.bodegas = state.bodegas || [];
    window.DATA_ALMACEN_CACHE.codigos = state.codigos || [];
    window.DATA_ALMACEN_CACHE.mapaCatalogo = state.mapaCatalogo || {};
    window.DATA_ALMACEN_CACHE.mapaUbicacionesExcedentes = state.mapaUbicacionesExcedentes || [];
  }

  function bindOnce(el, key, eventName, handler) {
    if (!el) return;
    const flag = `bound_${key}`;
    if (el.dataset[flag]) return;

    el.addEventListener(eventName, handler);
    el.dataset[flag] = "1";
  }

  // =========================================================
  // MONTAJE / INIT DE LA VISTA
  // =========================================================
  window.inicializarVistaTraspasos = function () {
    const root = getViewRoot_();
    if (root && root.dataset.ftInit === "1") {
      console.log("⏭️ [Traspasos] Inicialización omitida: esta instancia ya fue montada.");
      return;
    }

    if (root) {
      root.dataset.ftInit = "1";
    }

    console.log("🛠️ Montando FormularioTraspasos...");

    const cuerpoForm = document.getElementById('cuerpoFormulario');
    if (cuerpoForm) cuerpoForm.style.display = "none";

    vincularEventosDOM();

    // 1) Si APPALMACEN ya tiene bootstrap, se reutiliza
    if (window.DATA_ALMACEN_CACHE) {
      console.log("⚡ [Traspasos] Cargando desde DATA_ALMACEN_CACHE...");
      console.log("📦 [Traspasos] Cache visible:", window.DATA_ALMACEN_CACHE);

      hidratarDesdeCache_(window.DATA_ALMACEN_CACHE);
      inicializarDatalistsLocales();
      actualizarVistaLista();
      return;
    }

    // 2) Si ya había datos en memoria local
    if (
      state.usuarios.length > 0 ||
      state.bodegas.length > 0 ||
      state.codigos.length > 0 ||
      Object.keys(state.mapaCatalogo).length > 0 ||
      state.mapaUbicacionesExcedentes.length > 0
    ) {
      console.log("⚡ [Traspasos] Reutilizando memoria local...");
      inicializarDatalistsLocales();
      actualizarVistaLista();
      return;
    }

    // 3) Fallback al controller solo si de verdad no vino preinyectado
    console.warn("⚠️ No se encontró DATA_ALMACEN_CACHE. Solicitando bootstrap de Traspasos...");

    google.script.run
      .withSuccessHandler(function (data) {
        console.log("✅ Bootstrap recibido desde FormularioTraspasosController:", data);

        hidratarDesdeCache_(data);
        guardarEnCacheGlobal_();

        inicializarDatalistsLocales();
        actualizarVistaLista();

        lanzarNotificacionLocal(
          "Datos de traspasos cargados correctamente.",
          "success",
          {
            title: "Sistema listo",
            timer: 2600,
            sound: true
          }
        );
      })
      .withFailureHandler(function (err) {
        console.error("❌ Error cargando bootstrap:", err);
        lanzarNotificacionLocal(
          "No se pudo cargar la información inicial de traspasos.",
          "error",
          {
            title: "Error de carga",
            timer: 4200,
            sound: true
          }
        );
      })
      .FormularioTraspasosController_getBootstrap();
  };

  // Alias esperado por el shell
  window.initVista = window.inicializarVistaTraspasos;
  console.log("🧩 [Traspasos] initVista definida:", typeof window.initVista);

  // =========================================================
  // DATALISTS
  // =========================================================
  function inicializarDatalistsLocales() {
    // Solicitantes
    const dlSolicitantes = document.getElementById('listaSolicitantes');
    if (dlSolicitantes) {
      dlSolicitantes.innerHTML = state.usuarios
        .map(u => `<option value="${u.nombre}">`)
        .join('');
    }

    // Bodegas
    const dlBodegas = document.getElementById('listaBodegas');
    if (dlBodegas) {
      dlBodegas.innerHTML = state.bodegas
        .map(b => `<option value="${b}">`)
        .join('');
    }

    // Códigos
    actualizarDatalist(state.codigos);
  }

  function actualizarDatalist(lista) {
    const dl = document.getElementById('listaCodigosDinamica');
    if (dl) {
      dl.innerHTML = (lista || []).map(c => `<option value="${c}">`).join('');
    }
  }

  // =========================================================
  // EVENTOS DOM
  // =========================================================
  function vincularEventosDOM() {
    const solicitanteInput = document.getElementById('solicitanteInput');
    const tipoMovimientoInput = document.getElementById('tipoMovimientoInput');
    const codigoInput = document.getElementById('codigoInput');
    const ubiSalidaInput = document.getElementById('ubiSalidaInput');
    const ubiEntradaInput = document.getElementById('ubiEntradaInput');
    const cantidadInput = document.getElementById('cantidadInput');
    const bodegaSalidaInput = document.getElementById('bodegaSalidaInput');
    const bodegaEntradaInput = document.getElementById('bodegaEntradaInput');

    bindOnce(solicitanteInput, 'inputSolicitante', 'input', (e) => {
      const nombre = e.target.value.trim();
      const destino = document.getElementById('nombreSolicitanteDinamico');
      if (destino) destino.innerText = nombre || "Sin solicitante";
    });

    bindOnce(solicitanteInput, 'changeSolicitante', 'change', function () {
      validarValorEnListaInterno('solicitanteInput', state.usuarios, "solicitante");
      if (this.value.trim() && bodegaSalidaInput) bodegaSalidaInput.focus();
    });

    bindOnce(tipoMovimientoInput, 'changeTipoMovimiento', 'change', gestionarVisibilidad);
    bindOnce(codigoInput, 'changeCodigo', 'change', buscarPorCodigo);

    bindOnce(ubiSalidaInput, 'changeUbiSalida', 'change', function () {
      const bodegaActual = normalizarTexto(bodegaSalidaInput ? bodegaSalidaInput.value : "");
      const ubicacionesPermitidas = state.mapaUbicacionesExcedentes
        .filter(item => item.bodega === bodegaActual)
        .map(item => item.ubi);

      validarValorEnListaInterno('ubiSalidaInput', ubicacionesPermitidas, "ubicación");

      if (!this.value.trim()) return;

      if (tipoMovimientoInput && tipoMovimientoInput.value === "Cambio de bodega" && bodegaEntradaInput) {
        bodegaEntradaInput.focus();
      } else if (codigoInput) {
        codigoInput.focus();
      }
    });

    bindOnce(ubiEntradaInput, 'changeUbiEntrada', 'change', function () {
      const bodegaActual = normalizarTexto(bodegaEntradaInput ? bodegaEntradaInput.value : "");
      const ubicacionesPermitidas = state.mapaUbicacionesExcedentes
        .filter(item => item.bodega === bodegaActual)
        .map(item => item.ubi);

      validarValorEnListaInterno('ubiEntradaInput', ubicacionesPermitidas, "ubicación");

      if (this.value.trim() && codigoInput) {
        codigoInput.focus();
      }
    });

    bindOnce(cantidadInput, 'keypressCantidad', 'keypress', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        agregarALista();
      }
    });

    bindOnce(cantidadInput, 'wheelCantidad', 'wheel', function () {
      this.blur();
    });

    bindOnce(bodegaSalidaInput, 'changeBodegaSalida', 'change', function () {
      validarValorEnListaInterno('bodegaSalidaInput', state.bodegas, "bodega");
    });

    bindOnce(bodegaEntradaInput, 'changeBodegaEntrada', 'change', function () {
      validarValorEnListaInterno('bodegaEntradaInput', state.bodegas, "bodega");
    });
  }

  // =========================================================
  // LÓGICA DE UI
  // =========================================================
  function gestionarVisibilidad() {
    const tipo = document.getElementById('tipoMovimientoInput')?.value || "";
    const cuerpoForm = document.getElementById('cuerpoFormulario');
    const tiposValidos = ["Acomodo", "Surtido", "Cambio de bodega"];

    if (!tiposValidos.includes(tipo)) {
      if (cuerpoForm) cuerpoForm.style.display = "none";
      return;
    }

    if (cuerpoForm) cuerpoForm.style.display = "block";

    const seccionEntrada = document.getElementById('seccionEntrada');
    if (seccionEntrada) {
      seccionEntrada.style.display = (tipo === "Cambio de bodega") ? "block" : "none";
    }

    ["bodegaSalidaInput", "ubiSalidaInput", "bodegaEntradaInput", "ubiEntradaInput"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = "";
    });

    const solicitanteInput = document.getElementById('solicitanteInput');
    if (solicitanteInput) solicitanteInput.focus();
  }

  function buscarPorCodigo() {
    const inputCodigo = document.getElementById('codigoInput');
    const descripcionInput = document.getElementById('descripcionInput');
    const cantidadInput = document.getElementById('cantidadInput');

    const codigo = normalizarTexto(inputCodigo ? inputCodigo.value : "");
    if (!codigo) return;

    // 1) Validar que el código exista
    if (!state.codigos.includes(codigo)) {
      lanzarNotificacionLocal(
        `El código "${codigo}" no existe en el catálogo.`,
        "error",
        {
          title: "Código inválido",
          timer: 3600,
          sound: true
        }
      );

      if (inputCodigo) inputCodigo.value = "";
      if (descripcionInput) descripcionInput.value = "";
      if (inputCodigo) inputCodigo.focus();
      return;
    }

    // 2) Buscar primero en memoria local
    const producto = state.mapaCatalogo[codigo];
    if (producto) {
      if (descripcionInput) descripcionInput.value = producto.descripcion || "";
      if (cantidadInput) cantidadInput.focus();
      return;
    }

    // 3) Fallback al backend
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.encontrado) {
          lanzarNotificacionLocal(
            `El código "${codigo}" no fue encontrado.`,
            "warning",
            {
              title: "Sin resultados",
              timer: 3200,
              sound: true
            }
          );
          if (descripcionInput) descripcionInput.value = "";
          return;
        }

        if (descripcionInput) descripcionInput.value = res.descripcion || "";
        if (cantidadInput) cantidadInput.focus();
      })
      .withFailureHandler(function (err) {
        lanzarNotificacionLocal(
          err.message || "No se pudo consultar el producto.",
          "error",
          {
            title: "Error consultando producto",
            timer: 4200,
            sound: true
          }
        );
      })
      .FormularioTraspasosController_buscarProductoPorCodigo(codigo);
  }

  window.cargarUbicaciones = function (idInputBodega, idDatalist, idInputUbi) {
    const inputBodega = document.getElementById(idInputBodega);
    const dlUbicaciones = document.getElementById(idDatalist);
    const inputUbi = document.getElementById(idInputUbi);

    const bodegaSeleccionada = normalizarTexto(inputBodega ? inputBodega.value : "");

    if (!bodegaSeleccionada) {
      if (dlUbicaciones) dlUbicaciones.innerHTML = "";
      return;
    }

    const filtradas = state.mapaUbicacionesExcedentes
      .filter(item => item.bodega === bodegaSeleccionada)
      .map(item => item.ubi);

    if (filtradas.length > 0) {
      const unicas = [...new Set(filtradas)].sort();
      if (dlUbicaciones) {
        dlUbicaciones.innerHTML = unicas.map(u => `<option value="${u}">`).join('');
      }
      if (inputUbi) {
        inputUbi.placeholder = "Seleccione ubicación";
        inputUbi.focus();
      }
    } else {
      if (inputUbi) inputUbi.placeholder = "⚠️ Sin ubicaciones";
      if (dlUbicaciones) dlUbicaciones.innerHTML = "";
    }
  };

  function agregarALista() {
    const getVal = (id) => {
      const el = document.getElementById(id);
      return el ? el.value.trim() : "";
    };

    const tipo = getVal('tipoMovimientoInput');
    const codigo = normalizarTexto(getVal('codigoInput'));
    const solicitante = normalizarTexto(getVal('solicitanteInput'));

    const codValido = state.codigos.includes(codigo);
    const solValido = state.usuarios.some(u => normalizarTexto(u.nombre) === solicitante);

    if (!codValido || !solValido) {
      lanzarNotificacionLocal(
        "Hay valores no permitidos o campos vacíos.",
        "error",
        {
          title: "No se puede añadir",
          timer: 3600,
          sound: true
        }
      );
      return;
    }

    let vSalidaBod = normalizarTexto(getVal('bodegaSalidaInput'));
    let vSalidaUbi = normalizarTexto(getVal('ubiSalidaInput'));
    let vEntradaBod = normalizarTexto(getVal('bodegaEntradaInput'));
    let vEntradaUbi = normalizarTexto(getVal('ubiEntradaInput'));

    let bSalida, uSalida, bEntrada, uEntrada;

    if (tipo === "Surtido") {
      bSalida = vSalidaBod || state.defaultValue;
      uSalida = vSalidaUbi;
      bEntrada = state.defaultValue;
      uEntrada = state.defaultValue;
    } else if (tipo === "Acomodo") {
      bSalida = state.defaultValue;
      uSalida = state.defaultValue;
      bEntrada = vSalidaBod || state.defaultValue;
      uEntrada = vSalidaUbi;
    } else {
      bSalida = vSalidaBod || state.defaultValue;
      uSalida = vSalidaUbi;
      bEntrada = vEntradaBod || state.defaultValue;
      uEntrada = vEntradaUbi;
    }

    const item = {
      tipo: tipo,
      solicitante: solicitante,
      codigo: codigo,
      descripcion: normalizarTexto(getVal('descripcionInput')),
      cantidad: parseFloat(getVal('cantidadInput')),
      bodegaSalida: bSalida,
      ubiSalida: uSalida,
      bodegaEntrada: bEntrada,
      ubiEntrada: uEntrada
    };

    if (!item.tipo || !item.solicitante || !item.codigo || isNaN(item.cantidad) || item.cantidad <= 0) {
      lanzarNotificacionLocal(
        "Completa todos los datos requeridos antes de continuar.",
        "error",
        {
          title: "Datos incompletos",
          timer: 3400,
          sound: true
        }
      );
      return;
    }

    if ((tipo === "Surtido" || tipo === "Cambio de bodega") && !uSalida) {
      lanzarNotificacionLocal(
        "Debes indicar la ubicación de salida.",
        "warning",
        {
          title: "Ubicación faltante",
          timer: 3200,
          sound: true
        }
      );
      return;
    }

    if ((tipo === "Acomodo" || tipo === "Cambio de bodega") && !uEntrada) {
      lanzarNotificacionLocal(
        "Debes indicar la ubicación de entrada.",
        "warning",
        {
          title: "Ubicación faltante",
          timer: 3200,
          sound: true
        }
      );
      return;
    }

    window.colaDeTraspasos.push(item);
    actualizarVistaLista();
    limpiarCamposCapturaInterno();

    lanzarNotificacionLocal(
      "El traspaso se añadió correctamente a la fila.",
      "success",
      {
        title: "Añadido a la fila",
        timer: 1600,
        sound: false
      }
    );
  }

  function actualizarVistaLista() {
    const listaUL = document.getElementById('listaTraspasos');
    const plantillaEl = document.getElementById('plantillaTraspaso');
    if (!listaUL || !plantillaEl) return;

    const plantilla = plantillaEl.innerHTML;
    const btnRegistrar = document.getElementById('btnRegistrarTodo');
    const textoBtn = document.getElementById('textoBotonRegistrar');
    const contador = document.getElementById('contador');

    listaUL.innerHTML = window.colaDeTraspasos.map((item, i) => {
      const tipoCss = item.tipo.toLowerCase().replace(/\s+/g, '-');
      const ubiHtml = (item.tipo === "Cambio de bodega")
        ? `<span class="ubi-badge">${item.ubiSalida}</span> ➔ <span class="ubi-badge">${item.ubiEntrada}</span>`
        : `<span class="ubi-badge">${item.tipo === "Acomodo" ? item.ubiEntrada : item.ubiSalida}</span>`;

      return plantilla
        .replace(/{{INDEX}}/g, i)
        .replace("{{TIPO_CSS}}", tipoCss)
        .replace("{{TIPO}}", item.tipo)
        .replace("{{CODIGO}}", item.codigo)
        .replace("{{DESCRIPCION}}", item.descripcion)
        .replace("{{UBI_HTML}}", ubiHtml)
        .replace("{{CANTIDAD}}", item.cantidad);
    }).join('');

    const cant = window.colaDeTraspasos.length;
    if (contador) contador.innerText = cant;

    if (btnRegistrar && textoBtn) {
      if (cant > 0) {
        btnRegistrar.style.display = "block";
        textoBtn.innerText = `Registrar traspasos`;
      } else {
        btnRegistrar.style.display = "none";
      }
    }
  }

  function quitarDeLista(index) {
    window.colaDeTraspasos.splice(index, 1);
    actualizarVistaLista();
  }

  function generar() {
    if (window.colaDeTraspasos.length === 0) return;

    const btn = document.getElementById('btnRegistrarTodo');
    const contenidoOriginal = btn.innerHTML;

    btn.disabled = true;
    btn.innerHTML = '<span class="material-icons rotating">sync</span> Procesando...';

    google.script.run
      .withSuccessHandler(res => {
        lanzarNotificacionLocal(
          res.mensaje || "Los traspasos se registraron correctamente.",
          "success",
          {
            title: "Registro completado",
            timer: 3200,
            sound: true
          }
        );

        window.colaDeTraspasos = [];
        actualizarVistaLista();
        btn.disabled = false;
        btn.innerHTML = contenidoOriginal;
      })
      .withFailureHandler(err => {
        lanzarNotificacionLocal(
          err.message || "No se pudo registrar el lote de traspasos.",
          "error",
          {
            title: "Error al registrar",
            timer: 4200,
            sound: true
          }
        );

        btn.disabled = false;
        btn.innerHTML = '<span class="material-icons">error</span> Reintentar';
      })
      .FormularioTraspasosController_registrarLote(window.colaDeTraspasos);
  }

  // =========================================================
  // VALIDACIONES
  // =========================================================
  function validarValorEnListaInterno(idInput, listaPermitida, nombreCampo) {
    const input = document.getElementById(idInput);
    if (!input) return false;

    const valor = normalizarTexto(input.value);
    if (valor === "") return false;

    const existe = (listaPermitida || []).some(item =>
      (typeof item === 'string'
        ? normalizarTexto(item)
        : normalizarTexto(item.nombre)) === valor
    );

    if (!existe) {
      lanzarNotificacionLocal(
        `El ${nombreCampo} "${valor}" no es válido. Selecciona un valor de la lista.`,
        "error",
        {
          title: "Valor no permitido",
          timer: 3600,
          sound: true
        }
      );
      input.value = "";
      input.focus();
      return false;
    }

    return true;
  }

  // =========================================================
  // FUNCIONES PÚBLICAS PARA HTML INLINE
  // =========================================================
  window.buscarPorCodigo = buscarPorCodigo;
  window.agregarALista = agregarALista;
  window.actualizarVistaLista = actualizarVistaLista;
  window.quitarDeLista = quitarDeLista;
  window.generar = generar;
  window.validarValorEnLista = validarValorEnListaInterno;
  window.lanzarNotificacion = window.notificar || lanzarNotificacionLocal;

  // No auto-init aquí.
  // El shell es quien llama window.initVista().
})();
</script>
