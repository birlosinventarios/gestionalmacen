<div class="container">

  <div id="listaPendientes">
    <p style="text-align:center; color: #666;">Cargando movimientos pendientes...</p>
  </div>
</div>

<div id="snackbar"></div>

<script>
  (function() {
        let escribiendo = false;
        let responsables = [];
        let procesando = false;
        let ultimoSnapshot = null;
        let intervaloActual = 3000; // comienza rápido
        let maxIntervalo = 20000;   // límite superior

        // ==========================================
        // 1. GESTOR UNIFICADO DE NOTIFICACIONES (UX FITO)
        // ==========================================
        
        window.cargar_MonitorTraspasos = function() {
          console.log("🔄 Inicializando: Monitor de Traspasos Pendientes");

            if (window.temporizadorActualizacion) {
              clearTimeout(window.temporizadorActualizacion);
              window.temporizadorActualizacion = null;
              console.log("🧹 Temporizador previo limpiado.");
            }

          const cacheDisponible = window.DATA_ALMACEN_CACHE || window.GLOBAL_DATA;

          if (cacheDisponible) {
            console.log("⚡ Cargando responsables desde caché global...");
            
            responsables = (cacheDisponible.usuarios || [])
              .filter(u => u.rol === "RESPONSABLE" || u.rol === "ADMIN")
              .map(u => u.nombre);

            cargarPendientes(true);
            ejecutarCiclo();

          } else {
            console.warn("⚠️ No hay cache disponible.");
            window.lanzarNotificacion("⚠️ Esta vista requiere datos iniciales del sistema principal", "warning");
          }
        };

        
        window.initVista = window.cargar_MonitorTraspasos;
        console.log("🧩 [Monitor] initVista definida:", typeof window.initVista);



        // ==========================================
        // 2. CONTROL DE INTERACCIÓN DE ESCRITURA
        // ==========================================
        const contenedorPendientes = document.getElementById('listaPendientes');
        if (contenedorPendientes) {
          contenedorPendientes.onmouseenter = () => { 
            escribiendo = true; 
          };

          contenedorPendientes.onmouseleave = () => { 
            // Buscamos si hay folios numéricos activos para no interrumpir la captura
            const inputs = document.querySelectorAll('input[type="number"]');
            const hayTexto = Array.from(inputs).some(i => i.value.trim() !== "");
            if (!hayTexto) {
              escribiendo = false;
            }
          };
        }

        // ==========================================
        // 3. CICLO DE ACTUALIZACIÓN AUTOMÁTICA
        // ==========================================
        
            
        function ejecutarCiclo() {
          if (!document.getElementById('listaPendientes')) return;

          window.temporizadorActualizacion = setTimeout(() => {
            cargarPendientes(false).then(huboCambios => {
              if (huboCambios) {
                intervaloActual = 3000;
              } else {
                intervaloActual = Math.min(intervaloActual + 3000, maxIntervalo);
              }

              console.log(`⏱️ Próxima consulta en ${intervaloActual / 1000}s`);
              ejecutarCiclo();
            });
          }, intervaloActual);
        }



        // ==========================================
        // 4. OBTENER Y CONFIGURAR PENDIENTES
        // ==========================================
        
        
            window.cargarPendientes = function(forzar = false) {
              return new Promise((resolve) => {

                if (!forzar && (procesando || escribiendo)) {
                  resolve(false);
                  return;
                }

                procesando = true;

                console.log("📡 [Monitor] Llamando obtenerTraspasosPendientes...");

                google.script.run
                    .withSuccessHandler(function(pendientes) {
                      procesando = false;

                      console.log("📥 [Monitor] pendientes:", pendientes);
                      console.log("🧪 Array?:", Array.isArray(pendientes));
                      console.log("📊 Total:", Array.isArray(pendientes) ? pendientes.length : "no-array");

                      if (Array.isArray(pendientes) && pendientes.length > 0) {
                        console.log("🔝 Primero:", pendientes[0]);
                        console.log("🔚 Último:", pendientes[pendientes.length - 1]);
                      }

                      if (!Array.isArray(pendientes) || pendientes.length === 0) {
                        renderizarCards([]);
                        resolve(false);
                        return;
                      }

                      const snapshotActual = JSON.stringify(pendientes);
                      let huboCambios = false;

                      if (ultimoSnapshot !== null && snapshotActual === ultimoSnapshot) {
                        console.log("😴 [Monitor] Sin cambios");
                        huboCambios = false;
                      } else {
                        console.log("🔄 [Monitor] Hubo cambios");
                        ultimoSnapshot = snapshotActual;
                        huboCambios = true;
                        renderizarCards(pendientes);
                      }

                      resolve(huboCambios);

                  })
                  .withFailureHandler(function(err) {
                    procesando = false;
                    console.error("❌ Error:", err);
                    resolve(false);
                  })
                  .obtenerTraspasosPendientes();

              });
            };



        // ==========================================
        // 5. RENDERIZADO DE TARJETAS (CARDS)
        // ==========================================
        window.renderizarCards = function(pendientes) {
          const contenedor = document.getElementById('listaPendientes');
          if (!contenedor) return;

          if (!pendientes || pendientes.length === 0) {
            contenedor.innerHTML = '<div style="text-align:center; margin-top:50px; color: #666;"><span class="material-icons" style="font-size:48px; color:#4CAF50;">done_all</span><p>✅ No hay movimientos pendientes.</p></div>';
            return;
          }

          let opcionesResponsablesHTML = '<option value="">Responsable...</option>';
          responsables.forEach(r => {
            opcionesResponsablesHTML += `<option value="${r}">${r}</option>`;
          });

          const mapaAdmin = {
            "BODEGA 1": "2 - Excedente Bodega",
            "BODEGA 2": "2 - Excedente Bodega",
            "BODEGA 3": "2 - Excedente Bodega",
            "BODEGA MOSTRADOR": "2 - Excedente Bodega",
            "CASA BLANCA 1": "3 - Excedente Casa Blanca",
            "CASA BLANCA 2": "3 - Excedente Casa Blanca"
          };

          pendientes.forEach(item => {
            let base = item.tipomovimiento === "ACOMODO" ? item.bodegaentrada : (item.bodegasalida || "");
            let clave = base.toString().toUpperCase().trim();
            item.bodegaVisual = mapaAdmin[clave] || base;
          }); 

          pendientes.sort((a, b) => a.bodegaVisual.localeCompare(b.bodegaVisual));

          contenedor.innerHTML = '';
          let ultimaBodegaSegmentada = "";

          pendientes.forEach(item => {
            let bodegaActual = item.bodegaVisual; 
            
            if (bodegaActual !== ultimaBodegaSegmentada) {
              ultimaBodegaSegmentada = bodegaActual;
              const separador = document.createElement('div');
              separador.className = 'separador-bodega';
              separador.innerHTML = `<span class="material-icons">store</span> ${bodegaActual}`;
              contenedor.appendChild(separador);
            }

            const card = document.createElement('div');
            card.className = 'card-pendiente';
            card.style.display = "flex";
            card.style.flexWrap = "wrap"; 
            card.style.alignItems = "center";
            card.style.gap = "15px";
            card.style.padding = "15px";
            card.style.marginBottom = "15px";

                // Construcción del contenido de la tarjeta
                card.innerHTML = `
                <div class="columnatiposerie">
                  <div class="titulotiposerietraspaso">Tipo
                  </div>

                  <div class="itemtipotraspaso">
                  ${item.tipomovimiento}
                  </div>

                  <div class="titulotiposerietraspaso">Serie
                  </div>

                  <div class="itemserietraspaso">
                    <span class="material-icons">label
                    </span>
                    ${item.serie || '---'}
                  </div>
                </div>

                <div class="columnacodigodescripcion">
                    <div class="itemcodigotraspaso">
                      ${item.codigo}
                    </div>
              
                    <div class="itemdescripciontraspaso">
                      ${item.descripcion}
                    </div>
                </div>


                <div class="cuadrodatostraspaso">
                    <div class="cuadrantecuadrodatostraspaso">
                    <div class="tituloscuadrodatostraspaso">Almacen Salida:</div>
                      <div class="itemcuadrodatostraspaso">
                      ${limpiarNombre(item.bodegasalida)}</div>
                    </div>

                    <div class="cuadrantecuadrodatostraspaso">
                    <div class="tituloscuadrodatostraspaso">Almacen Entrada:</div>
                      <div class="itemcuadrodatostraspaso">
                      ${limpiarNombre(item.bodegaentrada)}</div>
                    </div>

                    <div class="cuadrantecuadrodatostraspaso">
                      <div class="tituloscuadrodatostraspaso">Cantidad:</div>
                      <div class="itemcuadrocantidadtraspaso">
                        ${Math.abs(Number(item.cantidad || 0))}
                      </div>
                    </div>

                    <div class="cuadrantecuadrodatostraspaso">
                    <div class="tituloscuadrodatostraspaso">Solicita:</div>
                      <div class="itemcuadrodatostraspaso">
                      ${item.solicitante}</div>
                   </div>
                </div>


                <div style="display:flex; flex-direction:column; gap:8px;">
                  
                  <div class="input-con-icono" style="flex-grow:1;">
                      <span class="material-icons">person</span>
                      <select id="resp_${item.fila}" 
                              onfocus="escribiendo = true" >
                          ${opcionesResponsablesHTML}
                      </select>
                  </div>

                  <div style="display:flex; gap:5px;">
                    
                    <div class="input-con-icono">
                    <span class="material-icons">tag</span>
                    <input type="number" 
                            id="folio_${item.fila}" 
                            placeholder="Folio" 
                            onfocus="escribiendo = true" 
                            oninput="escribiendo = true"
                            style="height:38px !important; font-size:13px;">
                    </div>

                    <button onclick="procesarFila(${item.fila}, this)" class="btn-anadir-ajustado" style="min-width:45px; height:45px; background:#d93025;">
                      <span class="material-icons">save</span>
                    </button>

                  </div>

                </div>
              `;
                contenedor.appendChild(card);
              });
            };


        // ==========================================
        // 6. AUXILIARES
        // ==========================================
        window.limpiarNombre = function(nombre) {
          if (!nombre || nombre === "---" || nombre === "") return "1 - Almacen Birlos";

          const mapaAdmin = {
            "BODEGA 1": "2 - Excedente Bodega",
            "BODEGA 2": "2 - Excedente Bodega",
            "BODEGA 3": "2 - Excedente Bodega",
            "BODEGA MOSTRADOR": "2 - Excedente Bodega",
            "CASA BLANCA 1": "3 - Excedente Casa Blanca",
            "CASA BLANCA 2": "3 - Excedente Casa Blanca"
          };

          let clave = nombre.toString().toUpperCase().trim();
          return mapaAdmin[clave] || nombre.toString().trim();
        };

        // ==========================================
        // 7. PROCESAR ACCIÓN DE GUARDADO
        // ==========================================
        window.procesarFila = function(numFila, boton) {
          const folio = document.getElementById('folio_' + numFila).value.trim();
          const resp = document.getElementById('resp_' + numFila).value;

          if (!folio || !resp) {
            window.lanzarNotificacion("Indica Folio y Responsable", "warning");
            return;
          }

          boton.disabled = true;
          boton.style.opacity = "0.5";

          google.script.run
            .withSuccessHandler(function(res) {
              window.lanzarNotificacion("Traspaso procesado con éxito", "success");

              // Animación de salida instantánea UX FITO
              const card = boton.closest('.card-pendiente');
              if (card) {
                card.style.transition = "all 0.3s cubic-bezier(0.4, 0, 0.2, 1)";
                card.style.opacity = "0";
                card.style.transform = "translateX(100px)"; 
                setTimeout(() => {
                  card.style.display = "none";
                  escribiendo = false;
                  cargarPendientes(true); // Recarga silenciosa en background
                }, 3000);
              }
            })
            .withFailureHandler(function(err) {
              window.lanzarNotificacion("Error: " + err, "error");
              boton.disabled = false;
              boton.style.opacity = "1";
            })
            .registrarMovimientoSistema(numFila, folio, resp);
        };

        window.validarTexto = function(input) {
          escribiendo = input.value.trim() !== "";
        };

      })();
</script>
