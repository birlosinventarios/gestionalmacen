<script type="text/babel">
  window.cargar_FormularioEtiquetasExcedentesReimpresion = () => {
    const { useState, useEffect, useMemo, useRef } = React;

    const notify_ = (mensaje, tipo = "info", timer = 2500, options = {}) => {
      const fn = window.notificar || window.lanzarNotificacion;
      if (typeof fn === "function") {
        fn(mensaje, tipo, timer, options);
      }
    };

    const createNotifyOnce_ = (ref) => (key, mensaje, tipo = "info", timer = 2500, options = {}, cooldown = 8000) => {
      const now = Date.now();
      const last = ref.current[key] || 0;
      if (now - last < cooldown) return;
      ref.current[key] = now;
      notify_(mensaje, tipo, timer, options);
    };

    const shellNotifyStateRef = { current: {} };
    const notifyOnceShell_ = createNotifyOnce_(shellNotifyStateRef);

    const LocalIcon = ({ name, size = 18, className = "" }) => {
      const iconRef = useRef(null);

      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = "";
          const i = document.createElement("i");
          i.setAttribute("data-lucide", name.toLowerCase());
          i.style.width = `${size}px`;
          i.style.height = `${size}px`;
          if (className) i.className = className;
          iconRef.current.appendChild(i);
          window.lucide.createIcons();
        }
      }, [name, size, className]);

      return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
    };

    const VistaExcedentesReimpresion = () => {
      const [baseDatos, setBaseDatos] = useState([]);
      const [baseHash, setBaseHash] = useState("");
      const [cargando, setCargando] = useState(true);
      const [procesando, setProcesando] = useState(false);

      const [filtros, setFiltros] = useState({
        id: "",
        codigo: "",
        ubicacion: ""
      });

      const [seleccionado, setSeleccionado] = useState(null);
      const [cola, setCola] = useState([]);

      const [bootstrap, setBootstrap] = useState({
        ids: [],
        codigos: [],
        ubicaciones: []
      });

      const localNotifyRef = useRef({});
      const notifyOnce_ = createNotifyOnce_(localNotifyRef);
      const idInputRef = useRef(null);

      const normalizarTexto = (valor) => String(valor || "").trim().toUpperCase();

      const enfocarId = () => {
        setTimeout(() => {
          idInputRef.current?.focus();
          idInputRef.current?.select?.();
        }, 0);
      };

      const limpiarBusqueda = () => {
        setFiltros({
          id: "",
          codigo: "",
          ubicacion: ""
        });
        setSeleccionado(null);
        enfocarId();
      };

      const hidratarBootstrap = (data) => {
        const nuevoBootstrap = {
          ids: data?.ids || [],
          codigos: data?.codigos || [],
          ubicaciones: data?.ubicaciones || []
        };

        setBootstrap(nuevoBootstrap);

        window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || {};
        window.DATA_ALMACEN_CACHE.reimpresionExcedentesBootstrap = nuevoBootstrap;
      };

      const normalizarBaseItem = (item) => {
        const ubicacionActual = normalizarTexto(
          item?.ESTADOACTUALEXCEDENTES ||
          item?.UBICACION ||
          "DISPONIBLE"
        );

        const estatus = normalizarTexto(
          item?.ESTATUS ||
          "DISPONIBLE"
        );

        return {
          IDUNICO: String(item?.IDUNICO || ""),
          CODIGO: normalizarTexto(item?.CODIGO),
          DESCRIPCION: normalizarTexto(item?.DESCRIPCION),
          CANTIDAD: Number(item?.CANTIDAD || 0),
          UBICACION: ubicacionActual || "DISPONIBLE",
          ESTATUS: estatus,
          ESTADOACTUALEXCEDENTES: ubicacionActual,
          IDPRODUCTO: String(item?.IDPRODUCTO || "")
        };
      };



      const sincronizarBase = (contexto = "auto") => {
        if (contexto !== "auto") {
          notify_("Sincronizando base de reimpresión...", "info", 1400, {
            title: "Actualizando base",
            sound: false
          });
        }

        google.script.run
          .withSuccessHandler((datos) => {
            if (!Array.isArray(datos)) return;

            const baseNormalizada = datos.map(normalizarBaseItem);
            const nuevoHash = JSON.stringify(baseNormalizada);

            if (nuevoHash === baseHash) {
              if (contexto !== "auto") {
                notify_("Base de reimpresión sin cambios.", "info", 1400, {
                  title: "Base actualizada",
                  sound: false
                });
              }
              return;
            }

            setBaseHash(nuevoHash);
            setBaseDatos(baseNormalizada);

            if (contexto === "init") {
              notify_("Base de excedentes conectada correctamente.", "success", 1800, {
                title: "Base conectada",
                sound: false
              });
            } else if (contexto !== "auto") {
              notify_("Base de reimpresión actualizada.", "success", 1600, {
                title: "Actualización completada",
                sound: false
              });
            } else {
              notifyOnce_(
                "cambios-reimpresion-excedentes",
                "Se detectaron cambios en la base de reimpresión.",
                "info",
                1500,
                {
                  title: "Base actualizada",
                  sound: false
                },
                12000
              );
            }
          })
          .withFailureHandler((err) => {
            console.error("❌ Error al sincronizar base de excedentes:", err);

            if (contexto === "auto") {
              notifyOnce_(
                "error-sync-reimpresion-excedentes",
                "No se pudo sincronizar automáticamente la base de reimpresión.",
                "error",
                3200,
                {
                  title: "Error de sincronización",
                  sound: false
                },
                12000
              );
            } else {
              notify_(
                "No se pudo actualizar la base de reimpresión.",
                "error",
                4200,
                {
                  title: "Error de sincronización",
                  sound: true
                }
              );
            }
          })
          .FormularioEtiquetasExcedentesReimpresionController_obtenerBase();
      };

      useEffect(() => {
        const inicializar = () => {
          try {
            notify_("Inicializando reimpresión de excedentes...", "info", 1600, {
              title: "Cargando vista",
              sound: false
            });

            const cacheBootstrap = window.DATA_ALMACEN_CACHE?.reimpresionExcedentesBootstrap || null;

            if (cacheBootstrap) {
              hidratarBootstrap(cacheBootstrap);
              setCargando(false);

              notify_("Datos base cargados desde memoria local.", "success", 1600, {
                title: "Sistema listo",
                sound: false
              });

              sincronizarBase("init");
              return;
            }

            google.script.run
              .withSuccessHandler((data) => {
                hidratarBootstrap(data || {});
                setCargando(false);

                notify_("Configuración de reimpresión cargada correctamente.", "success", 2000, {
                  title: "Sistema listo",
                  sound: false
                });

                sincronizarBase("init");
              })
              .withFailureHandler((err) => {
                console.error("❌ Error al cargar bootstrap de reimpresión:", err);
                setCargando(false);

                notify_(
                  "No se pudo cargar la base de reimpresión.",
                  "error",
                  4200,
                  {
                    title: "Error de carga",
                    sound: true
                  }
                );
              })
              .FormularioEtiquetasExcedentesReimpresionController_getBootstrap();

          } catch (err) {
            console.error("❌ Error inesperado en reimpresión:", err);
            setCargando(false);

            notify_(
              "No se pudo inicializar la vista de reimpresión.",
              "error",
              4200,
              {
                title: "Error inesperado",
                sound: true
              }
            );
          }
        };

        inicializar();
      }, []);

      useEffect(() => {
        if (!cargando && !procesando) {
          enfocarId();
        }
      }, [cargando, procesando]);

      useEffect(() => {
        const root = document.getElementById("render-excedentes-reimpresion");
        if (!root) return;

        const parent = root.parentElement;
        if (!parent) return;

        const previousOverflow = parent.style.overflow;
        const previousMinHeight = parent.style.minHeight;
        const previousHeight = parent.style.height;

        parent.style.overflow = "hidden";
        parent.style.minHeight = "0";

        if (!parent.style.height) {
          parent.style.height = "100%";
        }

        return () => {
          parent.style.overflow = previousOverflow;
          parent.style.minHeight = previousMinHeight;
          parent.style.height = previousHeight;
        };
      }, []);

      const filtrosNormalizados = useMemo(() => {
        return {
          id: normalizarTexto(filtros.id),
          codigo: normalizarTexto(filtros.codigo),
          ubicacion: normalizarTexto(filtros.ubicacion)
        };
      }, [filtros]);

      const filtrados = useMemo(() => {
        const valID = filtrosNormalizados.id;
        const valCod = filtrosNormalizados.codigo;
        const valUbi = filtrosNormalizados.ubicacion;

        if (!valID && !valCod && !valUbi) {
          return baseDatos;
        }

        return baseDatos.filter(item => {
          const matchID = !valID || String(item.IDUNICO || "").toUpperCase().includes(valID);
          const matchCod = !valCod || String(item.CODIGO || "").toUpperCase().includes(valCod);
          const matchUbi = !valUbi || String(item.UBICACION || "").toUpperCase().includes(valUbi);
          return matchID && matchCod && matchUbi;
        });
      }, [baseDatos, filtrosNormalizados]);

      useEffect(() => {
        const valID = filtrosNormalizados.id;

        if (!filtrosNormalizados.id && !filtrosNormalizados.codigo && !filtrosNormalizados.ubicacion) {
          setSeleccionado(null);
          return;
        }

        const itemExacto = filtrados.find(item =>
          String(item.IDUNICO || "").trim().toUpperCase() === valID
        );

        if (itemExacto) {
          setSeleccionado(itemExacto);
          return;
        }

        if (filtrados.length === 1) {
          setSeleccionado(filtrados[0]);
          return;
        }

        setSeleccionado(null);
      }, [filtrados, filtrosNormalizados]);

      const idsDisponibles = useMemo(() => {
        const origen = filtrados.length ? filtrados : baseDatos;
        return [...new Set(origen.map(item => item.IDUNICO).filter(Boolean))].sort();
      }, [filtrados, baseDatos]);

      const codigosDisponibles = useMemo(() => {
        const origen = filtrados.length ? filtrados : baseDatos;
        return [...new Set(origen.map(item => item.CODIGO).filter(Boolean))].sort();
      }, [filtrados, baseDatos]);

      const ubicacionesDisponibles = useMemo(() => {
        const origen = filtrados.length ? filtrados : baseDatos;
        return [...new Set(origen.map(item => item.UBICACION).filter(Boolean))].sort();
      }, [filtrados, baseDatos]);

      const handleFiltroChange = (campo, valor) => {
        const valorNormalizado = normalizarTexto(valor);

        setFiltros(prev => {
          if (campo === "id") {
            return {
              ...prev,
              id: valorNormalizado
            };
          }

          if (campo === "codigo") {
            return {
              ...prev,
              codigo: valorNormalizado
            };
          }

          if (campo === "ubicacion") {
            return {
              ...prev,
              ubicacion: valorNormalizado
            };
          }

          return prev;
        });
      };

      useEffect(() => {
        const intervalId = setInterval(() => {
          sincronizarBase("auto");
        }, 3000);

        return () => {
          clearInterval(intervalId);
        };
      }, []);

      const agregarALista = () => {
        if (!seleccionado || !seleccionado.IDUNICO) {
          notify_(
            "Selecciona un ID válido de la lista antes de continuar.",
            "warning",
            3200,
            {
              title: "Selección inválida",
              sound: true
            }
          );
          return;
        }

        if (cola.some(item => item.idUnico === seleccionado.IDUNICO)) {
          notify_(
            "Este ID ya fue agregado a la lista de reimpresión.",
            "error",
            3200,
            {
              title: "Elemento duplicado",
              sound: true
            }
          );
          return;
        }

        const nuevoItem = {
          idUnico: seleccionado.IDUNICO,
          codigo: seleccionado.CODIGO,
          descripcion: seleccionado.DESCRIPCION,
          cantidad: seleccionado.CANTIDAD,
          ubicacion: seleccionado.ESTADOACTUALEXCEDENTES || seleccionado.UBICACION || "DISPONIBLE",
          estatus: seleccionado.ESTATUS || "DISPONIBLE",
          rowId: seleccionado.IDUNICO
        };



        setCola(prev => [nuevoItem, ...prev]);
        limpiarBusqueda();

        notify_("Item añadido correctamente a la lista de reimpresión.", "success", 1600, {
          title: "Añadido a lista",
          sound: false
        });
      };

      
      const generarReimpresion = () => {
        if (cola.length === 0) {
          notify_(
            "La lista de reimpresión está vacía.",
            "warning",
            3200,
            {
              title: "Lista vacía",
              sound: true
            }
          );
          return;
        }

        if (
          !window.ImpresionModoUtilidades ||
          typeof window.ImpresionModoUtilidades.getMode !== "function" ||
          typeof window.ImpresionModoUtilidades.imprimirResultado !== "function"
        ) {
          notify_(
            "No se encontró el módulo global de impresión.",
            "error",
            4200,
            {
              title: "Impresión no disponible",
              sound: true
            }
          );
          return;
        }

        setProcesando(true);

        const modoImpresion = window.ImpresionModoUtilidades.getMode();

        let ventanaLocal = null;

        if (modoImpresion === "LOCAL") {
          ventanaLocal = window.open("", "_blank", "width=900,height=700");

          if (!ventanaLocal) {
            setProcesando(false);

            notify_(
              "La ventana fue bloqueada. Permite los pop-ups para continuar.",
              "warning",
              4200,
              {
                title: "Pop-up bloqueado",
                sound: true
              }
            );

            return;
          }

          ventanaLocal.document.open();
          ventanaLocal.document.write(`
            <html>
              <head>
                <title>Generando reimpresión...</title>
                <style>
                  body {
                    font-family: Arial, sans-serif;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    height: 100vh;
                    margin: 0;
                    color: #5f6368;
                    background-color: #f8f9fa;
                  }

                  .spinner {
                    width: 50px;
                    height: 50px;
                    border: 5px solid #f3f3f3;
                    border-top: 5px solid #d93025;
                    border-radius: 50%;
                    animation: spin 1s linear infinite;
                    margin-bottom: 20px;
                  }

                  @keyframes spin {
                    0% { transform: rotate(0deg); }
                    100% { transform: rotate(360deg); }
                  }

                  .loader {
                    text-align: center;
                    max-width: 420px;
                    padding: 0 24px;
                  }

                  .loader h3 {
                    margin: 0 0 8px 0;
                    font-size: 22px;
                    font-weight: 700;
                    color: #1c1d1f;
                    letter-spacing: 0.04em;
                  }

                  .loader p {
                    margin: 0;
                    font-size: 14px;
                    color: #5f6368;
                    line-height: 1.5;
                  }
                </style>
              </head>
              <body>
                <div class="spinner"></div>
                <div class="loader">
                  <h3>Preparando reimpresión...</h3>
                  <p>Espera un momento mientras se genera la reimpresión de etiquetas de excedentes.</p>
                </div>
              </body>
            </html>
          `);
          ventanaLocal.document.close();
        }

        notify_(
          modoImpresion === "ONLINE"
            ? "Preparando reimpresión de excedentes para impresión ONLINE..."
            : "Preparando reimpresión de excedentes para impresión LOCAL...",
          "info",
          1600,
          {
            title: "Generando etiquetas",
            sound: false
          }
        );

        const lote = cola.map(item => ({
          idUnico: item.idUnico,
          codigo: item.codigo,
          descripcion: item.descripcion,
          cantidad: item.cantidad,
          ubicacion: item.ubicacion
        }));

        google.script.run
          .withSuccessHandler((resultado) => {
            const res = typeof resultado === "string"
              ? {
                  ok: true,
                  htmlImpresion: resultado,
                  printJob: null,
                  legacy: true
                }
              : resultado;

            if (!res || !res.htmlImpresion) {
              if (ventanaLocal && !ventanaLocal.closed) {
                ventanaLocal.close();
              }

              setProcesando(false);

              notify_(
                "No se recibió una impresión válida desde el servidor.",
                "error",
                4200,
                {
                  title: "Respuesta inválida",
                  sound: true
                }
              );

              return;
            }

            const modoActual = window.ImpresionModoUtilidades.getMode();

            if (modoActual === "ONLINE" && !res.printJob) {
              if (ventanaLocal && !ventanaLocal.closed) {
                ventanaLocal.close();
              }

              setProcesando(false);

              notify_(
                "La vista generó HTML, pero no generó paquete ONLINE.",
                "error",
                5200,
                {
                  title: "Impresión ONLINE no disponible",
                  sound: true
                }
              );

              return;
            }

            try {
              window.ImpresionModoUtilidades.imprimirResultado(res, {
                titulo: "Reimpresión de etiquetas de excedentes",
                fallbackLocal: false,
                ventanaLocal: ventanaLocal
              });

              setCola([]);
              limpiarBusqueda();
              setProcesando(false);

              notify_(
                modoActual === "ONLINE"
                  ? "Reimpresión de excedentes enviada por ONLINE."
                  : "Reimpresión de excedentes lista para impresión LOCAL.",
                "success",
                2800,
                {
                  title: modoActual === "ONLINE"
                    ? "Impresión ONLINE"
                    : "Impresión LOCAL",
                  sound: true
                }
              );

            } catch (errorImpresion) {
              console.error("❌ Error ejecutando reimpresión:", errorImpresion);

              if (ventanaLocal && !ventanaLocal.closed) {
                ventanaLocal.close();
              }

              setProcesando(false);

              notify_(
                errorImpresion && errorImpresion.message
                  ? errorImpresion.message
                  : "No se pudo ejecutar la reimpresión.",
                "error",
                5200,
                {
                  title: "Error de impresión",
                  sound: true
                }
              );
            }
          })
          .withFailureHandler((err) => {
            if (ventanaLocal && !ventanaLocal.closed) {
              ventanaLocal.close();
            }

            console.error("❌ Error al procesar reimpresión:", err);
            setProcesando(false);

            notify_(
              err && err.message
                ? err.message
                : "No se pudo generar la reimpresión de etiquetas.",
              "error",
              4200,
              {
                title: "Error de impresión",
                sound: true
              }
            );
          })
          .FormularioEtiquetasExcedentesReimpresionController_procesarReimpresion(lote);
      };

      return (
        <div className="er-app-shell flex flex-col h-full w-full relative">
          <div className="er-main-layout">

            <div className="er-left-panel border-r border-[#dadce0] bg-white px-6 pt-4 pb-6 shrink-0 z-10">
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  agregarALista();
                }}
                className="h-full flex flex-col"
              >
                <div className="er-form-grid">

                  <div className="er-grid-id er-field-block">
                    <label className="er-label ml-1">
                      ID
                    </label>

                    <input
                      ref={idInputRef}
                      list="lista-ids-reimpresion"
                      disabled={cargando || procesando}
                      className={`w-full border rounded-xl px-4 er-input er-form-input-unificado uppercase outline-none transition-all ${
                        cargando || procesando
                          ? "bg-gray-200 cursor-not-allowed text-gray-500"
                          : "bg-gray-50 border-[#dadce0] focus:border-[#d93025] focus:bg-white"
                      }`}
                      placeholder={cargando ? "Cargando base..." : "Escanea o selecciona un ID"}
                      value={filtros.id}
                      onChange={(e) => handleFiltroChange("id", e.target.value)}
                    />

                    <datalist id="lista-ids-reimpresion">
                      {idsDisponibles.map((id, index) => (
                        <option key={`${index}-${id}`} value={id} />
                      ))}
                    </datalist>
                  </div>

                  <div className="er-grid-codigo er-field-block">
                    <label className="er-label ml-1">
                      Código
                    </label>

                    <input
                      list="lista-codigos-reimpresion"
                      disabled={cargando || procesando}
                      className={`w-full border rounded-xl px-4 er-input er-form-input-unificado uppercase outline-none transition-all ${
                        cargando || procesando
                          ? "bg-gray-200 cursor-not-allowed text-gray-500"
                          : "bg-gray-50 border-[#dadce0] focus:border-[#d93025] focus:bg-white"
                      }`}
                      placeholder="Escribe o selecciona código"
                      value={filtros.codigo}
                      onChange={(e) => handleFiltroChange("codigo", e.target.value)}
                    />

                    <datalist id="lista-codigos-reimpresion">
                      {codigosDisponibles.map((codigo, index) => (
                        <option key={`${index}-${codigo}`} value={codigo} />
                      ))}
                    </datalist>
                  </div>

                  <div className="er-grid-ubicacion er-field-block">
                    <label className="er-label ml-1">
                      Ubicación actual
                    </label>

                    <input
                      list="lista-ubicaciones-reimpresion"
                      disabled={cargando || procesando}
                      className={`w-full border rounded-xl px-4 er-input er-form-input-unificado uppercase outline-none transition-all ${
                        cargando || procesando
                          ? "bg-gray-200 cursor-not-allowed text-gray-500"
                          : "bg-gray-50 border-[#dadce0] focus:border-[#d93025] focus:bg-white"
                      }`}
                      placeholder="Escribe o selecciona ubicación"
                      value={filtros.ubicacion}
                      onChange={(e) => handleFiltroChange("ubicacion", e.target.value)}
                    />

                    <datalist id="lista-ubicaciones-reimpresion">
                      {ubicacionesDisponibles.map((ubicacion, index) => (
                        <option key={`${index}-${ubicacion}`} value={ubicacion} />
                      ))}
                    </datalist>
                  </div>

                  <div className="er-grid-detalle">
                    {seleccionado ? (
                      <div className="er-id-card bg-[#1c1d1f] space-y-3 border border-gray-800 fade-in shadow-xl">
                        <div className="flex items-start gap-2.5">
                          <div className="p-1.5 bg-gray-800 rounded-lg">
                            <LocalIcon name="qr-code" size={15} className="text-red-500" />
                          </div>

                          <div className="flex flex-col min-w-0">
                            <span className="text-[12px] font-black text-gray-500 uppercase tracking-[0.18em]">
                              ID seleccionado
                            </span>
                            <span className="text-white er-mono text-[14px] font-black mt-1 break-all">
                              {seleccionado.IDUNICO}
                            </span>
                          </div>
                        </div>

                        <div className="flex items-start gap-2.5 border-t border-gray-800 pt-2.5">
                          <div className="p-1.5 bg-gray-800 rounded-lg">
                            <LocalIcon name="tag" size={15} className="text-red-500" />
                          </div>

                          <div className="flex flex-col min-w-0">
                            <span className="text-[12px] font-black text-gray-500 uppercase tracking-[0.18em]">
                              Código
                            </span>
                            <span className="text-white er-mono text-[17px] font-black mt-1 break-all">
                              {seleccionado.CODIGO}
                            </span>
                          </div>
                        </div>

                        <div className="flex items-start gap-2.5 border-t border-gray-800 pt-2.5">
                          <div className="p-1.5 bg-gray-800 rounded-lg">
                            <LocalIcon name="file-text" size={15} className="text-red-500" />
                          </div>

                          <div className="flex flex-col min-w-0">
                            <span className="text-[12px] font-black text-gray-500 uppercase tracking-[0.18em]">
                              Descripción
                            </span>
                            <span className="text-gray-300 text-[15px] font-bold leading-snug uppercase italic mt-1 break-words">
                              {seleccionado.DESCRIPCION || "Sin descripción"}
                            </span>
                          </div>
                        </div>

                        <div className="flex items-center justify-between gap-3 border-t border-gray-800 pt-3">
                          <div className="flex flex-col">
                            <span className="text-[11px] font-black text-gray-500 uppercase tracking-[0.16em]">
                              Cantidad
                            </span>
                            <span className="text-white er-mono text-[18px] font-black">
                              {seleccionado.CANTIDAD}
                            </span>
                          </div>

                          <div className="flex flex-col text-right">
                            <span className="text-[11px] font-black text-gray-500 uppercase tracking-[0.16em]">
                              Ubicación
                            </span>
                            <span className="text-gray-300 er-mono text-[13px] font-black">
                              {seleccionado.UBICACION || "S/U"}
                            </span>
                          </div>
                        </div>
                      </div>
                    ) : (
                      <div className="er-product-placeholder">
                        <div>
                          <div className="er-product-placeholder-title">
                            Esperando selección
                          </div>
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="er-grid-accion">
                    <button
                      type="submit"
                      disabled={cargando || procesando}
                      className="er-action-btn w-full bg-[#d93025] hover:bg-[#a50e0e] text-white py-4 rounded-xl font-black uppercase text-[16px] tracking-[0.18em] shadow-lg shadow-red-100 transition-all flex items-center justify-center gap-3 disabled:opacity-50 disabled:pointer-events-none"
                    >
                      <LocalIcon name="plus" size={25} />
                      Añadir a lista
                    </button>
                  </div>

                </div>
              </form>
            </div>

            <div className="er-right-panel min-w-0">

              <div className="er-results-toolbar bg-white border-b border-gray-200 px-4 py-4 flex items-center justify-start gap-4">
                <div className="flex items-center gap-3">
                  <div className="w-11 h-11 rounded-2xl bg-[#1c1d1f] text-white flex items-center justify-center shadow-md">
                    <LocalIcon name="list-checks" size={22} />
                  </div>

                  <div className="flex flex-col">
                    <span className="text-[11px] font-black uppercase tracking-[0.22em] text-gray-400">
                      Lista de reimpresión
                    </span>
                    <span className="text-[15px] font-black uppercase tracking-[0.08em] text-gray-900">
                      {cola.length} {cola.length === 1 ? "etiqueta añadida" : "etiquetas añadidas"}
                    </span>
                  </div>
                </div>
              </div>

              <div className="er-table-scroll">

                <table className="er-results-table">
                  <thead className="er-results-head">
                    <tr>
                      <th className="text-center">
                        Código / Descripción
                      </th>
                      <th className="text-center">
                        ID
                      </th>
                      <th className="text-center">
                        Ubicación
                      </th>
                      <th className="text-center">
                        Cantidad
                      </th>
                      <th className="text-center">
                        Acción
                      </th>
                    </tr>
                  </thead>

                  <tbody>
                    {cola.map(item => (
                      <tr key={item.rowId} className="er-results-row fade-in">
                        <td>
                          <div className="flex flex-col">
                            <span className="er-code-main">
                              {item.codigo}
                            </span>
                            <span className="er-desc">
                              {item.descripcion || "SIN DESCRIPCIÓN"}
                            </span>
                          </div>
                        </td>

                        <td className="text-center">
                          <span className="er-folio-pill" title={item.idUnico}>
                            {item.idUnico}
                          </span>
                        </td>

                        <td className="text-center">
                          <span
                            className={
                              normalizarTexto(item.ubicacion) === "DISPONIBLE"
                                ? "er-location-chip er-location-chip-disponible"
                                : "er-location-chip er-location-chip-ubicado"
                            }
                          >
                            {item.ubicacion || "S/U"}
                          </span>
                        </td>


                        <td className="text-center">
                          <span className="er-qty-pill">
                            {item.cantidad}
                          </span>
                        </td>

                        <td className="text-center">
                          <button
                            type="button"
                            onClick={() => {
                              setCola(prev => prev.filter(c => c.rowId !== item.rowId));
                              notify_("Elemento removido de la lista de reimpresión.", "warning", 1400, {
                                title: "Elemento removido",
                                sound: false
                              });
                              enfocarId();
                            }}
                            className="er-delete-btn"
                            title="Quitar de la lista"
                          >
                            <LocalIcon name="trash-2" size={16} />
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>

                {cola.length === 0 && (
                  <div className="er-empty-state">
                    <LocalIcon name="package" size={52} />
                    <p className="er-empty-title">
                      Esperando reimpresiones
                    </p>
                    <p className="er-empty-sub">
                      Las etiquetas añadidas aparecerán aquí
                    </p>
                  </div>
                )}

              </div>
            </div>
          </div>

          {cola.length > 0 && (
            <div className="absolute bottom-6 right-6 z-30">
              <button
                type="button"
                onClick={generarReimpresion}
                disabled={procesando}
                className="bg-[#1c1d1f] hover:bg-black text-white px-6 py-4 rounded-2xl shadow-xl font-black uppercase tracking-[0.15em] flex items-center gap-3 disabled:opacity-50 disabled:pointer-events-none"
              >
                <LocalIcon
                  name={procesando ? "loader-2" : "printer"}
                  size={20}
                  className={procesando ? "animate-spin" : ""}
                />
                {procesando
                  ? "Procesando..."
                  : `Imprimir ${cola.length} ${cola.length === 1 ? "etiqueta" : "etiquetas"}`
                }
              </button>
            </div>
          )}
        </div>
      );
    };

    const rootDiv = document.getElementById("render-excedentes-reimpresion");

    if (!rootDiv) {
      notify_(
        "No se encontró el contenedor principal de reimpresión de excedentes.",
        "error",
        4200,
        {
          title: "Error de interfaz",
          sound: true
        }
      );
      console.warn("⚠️ [Reimpresión Excedentes] No se encontró #render-excedentes-reimpresion");
      return;
    }

    const yaInicializado = rootDiv.dataset.erMounted === "1";

    if (window.__FORMULARIO_EXCEDENTES_REIMPRESION_ROOT__) {
      try {
        window.__FORMULARIO_EXCEDENTES_REIMPRESION_ROOT__.unmount();
      } catch (e) {
        console.warn("⚠️ [Reimpresión Excedentes] No se pudo desmontar root previo:", e);
        notifyOnceShell_(
          "reimpresion-root-previo",
          "Se liberó una instancia previa de reimpresión de excedentes.",
          "warning",
          1600,
          {
            title: "Reinicialización",
            sound: false
          },
          10000
        );
      }

      window.__FORMULARIO_EXCEDENTES_REIMPRESION_ROOT__ = null;
    }

    try {
      rootDiv.dataset.erMounted = "1";
      window.__FORMULARIO_EXCEDENTES_REIMPRESION_ROOT__ = ReactDOM.createRoot(rootDiv);
      window.__FORMULARIO_EXCEDENTES_REIMPRESION_ROOT__.render(<VistaExcedentesReimpresion />);

      if (!yaInicializado) {
        notifyOnceShell_(
          "reimpresion-vista-montada",
          "Vista de reimpresión de excedentes lista para operar.",
          "success",
          1500,
          {
            title: "Vista cargada",
            sound: false
          },
          12000
        );
      }
    } catch (e) {
      console.error("❌ [Reimpresión Excedentes] Error montando root React:", e);
      notify_(
        "Ocurrió un error al montar la vista de reimpresión de excedentes.",
        "error",
        4200,
        {
          title: "Error de montaje",
          sound: true
        }
      );
    }
  };

  window.initVista = window.cargar_FormularioEtiquetasExcedentesReimpresion;
  console.log("🧩 [FormularioEtiquetasExcedentesReimpresion] initVista definida:", typeof window.initVista);
</script>
