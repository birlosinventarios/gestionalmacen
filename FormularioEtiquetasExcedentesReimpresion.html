<script>/** FormularioEtiquetasExcedentesReimpresion.html */</script>

<div id="contenedorReimpresion" class="container mt-3">

  <div class="card-formulario">
    <div class="campo">
      <label>ID</label>
      <div class="input-con-icono">
        <span class="material-icons">qr_code_scanner</span>
        <input type="text" id="busquedaID" list="listaIDs" placeholder="Escanea o Selecciona un ID" oninput="aplicarFiltrosCruzados()">
        <datalist id="listaIDs"></datalist>
      </div>
    </div>

    <div class="campo">
      <label>Codigo</label>
      <div class="input-con-icono">
        <span class="material-icons">inventory_2</span>
        <input type="text" id="resCodigo" list="listaCodigos" placeholder="Escribe o selecciona un Codigo" oninput="aplicarFiltrosCruzados()">
        <datalist id="listaCodigos"></datalist>
      </div>
    </div>

    <div class="campo">
      <label>Descripcion</label>
      <div class="input-con-icono">
        <span class="material-icons">description</span>
        <input type="text" id="resDesc" readonly>
      </div>
    </div>

    <div class="row">
      <div class="col-6">
        <div class="campo">
          <label>Cantidad</label>
          <div class="input-con-icono">
            <span class="material-icons">tag</span>
            <input type="text" id="resCant" readonly>
          </div>
        </div>
      </div>
      <div class="col-6">
        <div class="campo">
          <label>Ubicación Actual</label>
          <div class="input-con-icono">
            <span class="material-icons">place</span>
            <input type="text" id="resUbi" list="listaUbicaciones" placeholder="Escribe o selecciona una Ubicacion" oninput="aplicarFiltrosCruzados()">
            <datalist id="listaUbicaciones"></datalist>
          </div>
        </div>
      </div>
    </div>

    <button class="btn-anadir-ajustado" onclick="agregarAListaReimpresion()" style="margin-top:15px;">
      <span class="material-icons">add_circle</span> Añadir a la lista
    </button>
  </div>

  <div class="contenedor-lista-traspasos">
    <ul id="listaReimpresion" class="fila-traspasos-lista"></ul>
  </div>

  <button id="btnImprimirTodo" class="btn-anadir-ajustado" onclick="generarReimpresion()">
    <span class="material-icons">print</span>
    <span id="textoBoton">Imprimir</span>
  </button>

  <div id="snackbar"></div>
</div>

<?!= HtmlService.createHtmlOutputFromFile('FilaExcedentesReimpresion').getContent(); ?>

<script>
(function () {
  // =========================================================
  // ESTADO SEGURO DE LA VISTA
  // =========================================================
  window.FormularioEtiquetasExcedentesReimpresionState =
    window.FormularioEtiquetasExcedentesReimpresionState || {
      baseDatosExcedentes: [],
      hashExcedentes: "",
      listaParaImprimir: [],
      snackbarTimeout: null,
      bloqueadoPorLlenado: false,
      bootstrap: {
        ids: [],
        codigos: [],
        ubicaciones: []
      },
      lastNotifyAt: {},
      primeraConexionNotificada: false
    };

  const state = window.FormularioEtiquetasExcedentesReimpresionState;

  // =========================================================
  // HELPERS DE NOTIFICACIÓN
  // =========================================================
  function notify_(mensaje, tipo = "info", timer = 2500, options = {}) {
    const fn = window.notificar || window.lanzarNotificacion;

    if (typeof fn === "function") {
      fn(mensaje, tipo, timer, options);
      return;
    }

    // Fallback local solo si la vista corre fuera del shell
    const x = document.getElementById("snackbar");
    if (!x) return;

    if (state.snackbarTimeout) {
      clearTimeout(state.snackbarTimeout);
    }

    x.innerText = mensaje;
    x.className = `show ${tipo || ""}`;

    state.snackbarTimeout = setTimeout(() => {
      x.className = x.className.replace("show", "");
    }, Math.min(timer, 1800));
  }

  function notifyOnce_(key, mensaje, tipo = "info", timer = 2500, options = {}, cooldown = 8000) {
    const now = Date.now();
    const last = state.lastNotifyAt[key] || 0;
    if (now - last < cooldown) return;
    state.lastNotifyAt[key] = now;
    notify_(mensaje, tipo, timer, options);
  }

  // =========================================================
  // HELPERS INTERNOS
  // =========================================================
  function normalizarTexto(valor) {
    return String(valor || "").trim().toUpperCase();
  }

  function getViewRoot_() {
    return document.getElementById("contenedorReimpresion");
  }

  function bindOnce(el, key, eventName, handler) {
    if (!el) return;
    const flag = `bound_${key}`;
    if (el.dataset[flag]) return;

    el.addEventListener(eventName, handler);
    el.dataset[flag] = "1";
  }

  function llenarDatalist(id, array) {
    const dl = document.getElementById(id);
    if (!dl) return;

    dl.innerHTML = "";
    (array || []).slice().sort().forEach(v => {
      if (v) {
        const opt = document.createElement("option");
        opt.value = v;
        dl.appendChild(opt);
      }
    });
  }

  function actualizarDataListsManual(datos) {
    const ids = [...new Set((datos || []).map(i => i.IDUNICO).filter(Boolean))];
    const codigos = [...new Set((datos || []).map(i => i.CODIGO).filter(Boolean))];
    const ubis = [...new Set((datos || []).map(i => i.UBICACION).filter(Boolean))];

    llenarDatalist("listaIDs", ids);
    llenarDatalist("listaCodigos", codigos);
    llenarDatalist("listaUbicaciones", ubis);
  }

  function llenarFormulario(d) {
    if (!d || Array.isArray(d)) return;

    const elID = document.getElementById('busquedaID');
    const elCod = document.getElementById('resCodigo');
    const elUbi = document.getElementById('resUbi');
    const elDesc = document.getElementById('resDesc');
    const elCant = document.getElementById('resCant');

    if (elID && elID.value !== String(d.IDUNICO || "")) elID.value = d.IDUNICO || "";
    if (elCod && elCod.value !== String(d.CODIGO || "")) elCod.value = d.CODIGO || "";
    if (elUbi && elUbi.value !== String(d.UBICACION || "")) elUbi.value = d.UBICACION || "";
    if (elDesc) elDesc.value = d.DESCRIPCION || "";
    if (elCant) elCant.value = d.CANTIDAD || "";

    if (elID) {
      elID.dataset.actualId = d.IDUNICO || "";
    }
  }

  function limpiarCamposDetalle() {
    const resDesc = document.getElementById('resDesc');
    const resCant = document.getElementById('resCant');
    const busquedaID = document.getElementById('busquedaID');

    if (resDesc) resDesc.value = "";
    if (resCant) resCant.value = "";
    if (busquedaID) busquedaID.dataset.actualId = "";
  }

  function limpiarFormularioBusqueda() {
    state.bloqueadoPorLlenado = true;

    const ids = ["busquedaID", "resCodigo", "resDesc", "resCant", "resUbi"];
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = "";
    });

    const elID = document.getElementById('busquedaID');
    if (elID) elID.dataset.actualId = "";

    actualizarDataListsManual(state.baseDatosExcedentes);

    state.bloqueadoPorLlenado = false;

    if (elID) elID.focus();
  }

  function actualizarVistaReimpresionInterna() {
    const listaUI = document.getElementById('listaReimpresion');
    const btnPrint = document.getElementById('btnImprimirTodo');
    const textoBoton = document.getElementById('textoBoton');
    const plantillaEl = document.getElementById('plantillaExcedenteReimpresion');

    if (!listaUI || !btnPrint || !textoBoton || !plantillaEl) return;

    const plantilla = plantillaEl.innerHTML;

    listaUI.innerHTML = "";
    state.listaParaImprimir.forEach((item, index) => {
      let html = plantilla
        .replace(/{{idUnico}}/g, item.idUnico)
        .replace(/{{codigo}}/g, item.codigo)
        .replace(/{{descripcion}}/g, item.descripcion)
        .replace(/{{cantidad}}/g, item.cantidad)
        .replace(/{{ubicacion}}/g, item.ubicacion)
        .replace(/{{index}}/g, index);

      listaUI.insertAdjacentHTML('beforeend', html);
    });

    btnPrint.style.display = state.listaParaImprimir.length > 0 ? "block" : "none";
    textoBoton.innerText = `Imprimir (${state.listaParaImprimir.length})`;
  }

  // =========================================================
  // BOOTSTRAP + SINCRONIZACIÓN
  // =========================================================
  function hidratarBootstrap_(bootstrap) {
    state.bootstrap.ids = bootstrap.ids || [];
    state.bootstrap.codigos = bootstrap.codigos || [];
    state.bootstrap.ubicaciones = bootstrap.ubicaciones || [];

    // Guardamos en cache global para reutilización
    window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || {};
    window.DATA_ALMACEN_CACHE.reimpresionExcedentesBootstrap = bootstrap;
  }

  function sincronizarBaseDeDatos(contexto = "auto") {
    const elID = document.getElementById("busquedaID");
    const elCod = document.getElementById("resCodigo");
    const elUbi = document.getElementById("resUbi");

    const valID = elID ? elID.value : "";
    const valCod = elCod ? elCod.value : "";
    const valUbi = elUbi ? elUbi.value : "";

    const estaFiltrando = valID || valCod || valUbi;

    if (contexto !== "auto") {
      notify_("Sincronizando base de reimpresión...", "info", 1400, {
        title: "Actualizando base",
        sound: false
      });
    }

    google.script.run
      .withSuccessHandler(function (datos) {
        if (!Array.isArray(datos)) return;

        const nuevoHash = JSON.stringify(datos);
        if (nuevoHash === state.hashExcedentes) return;

        const esPrimeraCarga = (state.baseDatosExcedentes.length === 0);

        state.baseDatosExcedentes = datos;
        state.hashExcedentes = nuevoHash;

        if (!estaFiltrando && !state.bloqueadoPorLlenado) {
          actualizarDataListsManual(state.baseDatosExcedentes);
        }

        if (esPrimeraCarga && !state.primeraConexionNotificada) {
          state.primeraConexionNotificada = true;
          notify_("Base de excedentes conectada correctamente.", "success", 2200, {
            title: "Base conectada",
            sound: false
          });
        } else if (contexto !== "auto") {
          notify_("Base de reimpresión actualizada.", "success", 1600, {
            title: "Actualización completada",
            sound: false
          });
        } else {
          notifyOnce_(
            "cambios-reimpresion",
            "Se detectaron cambios en la base de reimpresión.",
            "info",
            1500,
            {
              title: "Base actualizada",
              sound: false
            },
            12000
          );
        }
      })
      .withFailureHandler(function (err) {
        console.error("❌ Error al sincronizar base de excedentes:", err);

        if (contexto === "auto") {
          notifyOnce_(
            "error-sync-reimpresion",
            "No se pudo sincronizar automáticamente la base de reimpresión.",
            "error",
            3200,
            {
              title: "Error de sincronización",
              sound: false
            },
            12000
          );
        } else {
          notify_(
            "No se pudo actualizar la base de reimpresión.",
            "error",
            4200,
            {
              title: "Error de sincronización",
              sound: true
            }
          );
        }
      })
      .FormularioEtiquetasExcedentesReimpresionController_obtenerBase();
  }

  // =========================================================
  // INIT DE VISTA
  // =========================================================
  window.inicializarVistaEtiquetasExcedentesReimpresion = function () {
    const root = getViewRoot_();

    if (root && root.dataset.feerInit === "1") {
      console.log("⏭️ [Reimpresión Excedentes] Inicialización omitida: esta instancia ya fue montada.");
      return;
    }

    if (root) {
      root.dataset.feerInit = "1";
    }

    console.log("📦 [Reimpresión Excedentes] Inicializando vista...");

    notify_("Inicializando reimpresión de excedentes...", "info", 1600, {
      title: "Cargando vista",
      sound: false
    });

    // Si hay ciclo previo, se limpia
    if (window.intervaloReimpresion) {
      clearInterval(window.intervaloReimpresion);
      window.intervaloReimpresion = null;
      console.log("🧹 Intervalo de reimpresión previo limpiado.");
    }

    const cacheBootstrap = window.DATA_ALMACEN_CACHE?.reimpresionExcedentesBootstrap || null;

    // 1) Reutilizar bootstrap de cache si existe
    if (cacheBootstrap) {
      console.log("⚡ [Reimpresión Excedentes] Cargando bootstrap desde cache...");
      hidratarBootstrap_(cacheBootstrap);

      llenarDatalist("listaIDs", state.bootstrap.ids);
      llenarDatalist("listaCodigos", state.bootstrap.codigos);
      llenarDatalist("listaUbicaciones", state.bootstrap.ubicaciones);

      notify_("Datos base cargados desde memoria local.", "success", 1600, {
        title: "Sistema listo",
        sound: false
      });

      sincronizarBaseDeDatos("init");
      iniciarCicloReimpresion_();
      return;
    }

    // 2) Si ya existe bootstrap en memoria local
    if (
      state.bootstrap.ids.length > 0 ||
      state.bootstrap.codigos.length > 0 ||
      state.bootstrap.ubicaciones.length > 0
    ) {
      console.log("⚡ [Reimpresión Excedentes] Reutilizando bootstrap local...");

      llenarDatalist("listaIDs", state.bootstrap.ids);
      llenarDatalist("listaCodigos", state.bootstrap.codigos);
      llenarDatalist("listaUbicaciones", state.bootstrap.ubicaciones);

      notify_("Datos base reutilizados desde memoria local.", "success", 1600, {
        title: "Sistema listo",
        sound: false
      });

      sincronizarBaseDeDatos("init");
      iniciarCicloReimpresion_();
      return;
    }

    // 3) Fallback al controller nuevo
    console.warn("⚠️ [Reimpresión Excedentes] Solicitando bootstrap específico...");

    notify_("Solicitando configuración de reimpresión...", "info", 1800, {
      title: "Sincronización requerida",
      sound: false
    });

    google.script.run
      .withSuccessHandler(function (bootstrap) {
        console.log("✅ [Reimpresión Excedentes] Bootstrap recibido:", bootstrap);

        hidratarBootstrap_(bootstrap);

        llenarDatalist("listaIDs", state.bootstrap.ids);
        llenarDatalist("listaCodigos", state.bootstrap.codigos);
        llenarDatalist("listaUbicaciones", state.bootstrap.ubicaciones);

        notify_("Configuración de reimpresión cargada correctamente.", "success", 2000, {
          title: "Sistema listo",
          sound: false
        });

        sincronizarBaseDeDatos("init");
        iniciarCicloReimpresion_();
      })
      .withFailureHandler(function (err) {
        console.error("❌ Error al cargar bootstrap de reimpresión:", err);

        notify_(
          "No se pudo cargar la base de reimpresión.",
          "error",
          4200,
          {
            title: "Error de carga",
            sound: true
          }
        );
      })
      .FormularioEtiquetasExcedentesReimpresionController_getBootstrap();
  };

  window.initVista = window.inicializarVistaEtiquetasExcedentesReimpresion;
  console.log("🧩 [Reimpresión Excedentes] initVista definida:", typeof window.initVista);

  function iniciarCicloReimpresion_() {
    window.intervaloReimpresion = setInterval(function () {
      const vistaActiva = document.getElementById('contenedorReimpresion');

      if (!vistaActiva) {
        clearInterval(window.intervaloReimpresion);
        window.intervaloReimpresion = null;
        console.log("🛑 Ciclo de reimpresión detenido por cambio de vista.");
        return;
      }

      sincronizarBaseDeDatos("auto");
    }, 3000);
  }

  // =========================================================
  // FILTROS CRUZADOS
  // =========================================================
  window.aplicarFiltrosCruzados = function () {
    if (state.bloqueadoPorLlenado) return;

    const elID = document.getElementById("busquedaID");
    const elCod = document.getElementById("resCodigo");
    const elUbi = document.getElementById("resUbi");

    const valID = elID ? elID.value.trim() : "";
    const valCod = elCod ? elCod.value.trim() : "";
    const valUbi = elUbi ? elUbi.value.trim() : "";

    const searchID = valID.toUpperCase();
    const searchCod = valCod.toUpperCase();
    const searchUbi = valUbi.toUpperCase();

    if (!valID && !valCod && !valUbi) {
      limpiarCamposDetalle();
      actualizarDataListsManual(state.baseDatosExcedentes);
      return;
    }

    const filtrados = state.baseDatosExcedentes.filter(item => {
      const matchID = !valID || String(item.IDUNICO).toUpperCase().includes(searchID);
      const matchCod = !valCod || String(item.CODIGO).toUpperCase().includes(searchCod);
      const matchUbi = !valUbi || String(item.UBICACION).toUpperCase().includes(searchUbi);
      return matchID && matchCod && matchUbi;
    });

    actualizarDataListsManual(filtrados);

    if (filtrados.length === 1) {
      state.bloqueadoPorLlenado = true;
      llenarFormulario(filtrados[0]);
      setTimeout(() => { state.bloqueadoPorLlenado = false; }, 200);
    } else {
      const itemExacto = filtrados.find(i =>
        String(i.IDUNICO).trim().toUpperCase() === searchID
      );

      if (itemExacto) {
        state.bloqueadoPorLlenado = true;
        llenarFormulario(itemExacto);
        setTimeout(() => { state.bloqueadoPorLlenado = false; }, 200);
      } else {
        const resDesc = document.getElementById('resDesc');
        const resCant = document.getElementById('resCant');
        const busquedaID = document.getElementById('busquedaID');

        if (resDesc) resDesc.value = "";
        if (resCant) resCant.value = "";
        if (busquedaID) busquedaID.dataset.actualId = "";
      }
    }
  };

  // =========================================================
  // GESTIÓN DE LISTA
  // =========================================================
  window.agregarAListaReimpresion = function () {
    const inputID = document.getElementById('busquedaID');
    const valorId = inputID ? inputID.dataset.actualId : "";

    if (!valorId || (inputID && inputID.value !== valorId)) {
      notify_(
        "Selecciona un ID válido de la lista antes de continuar.",
        "warning",
        3200,
        {
          title: "Selección inválida",
          sound: true
        }
      );
      return;
    }

    if (state.listaParaImprimir.some(item => item.idUnico === valorId)) {
      notify_(
        "Este ID ya fue agregado a la lista de reimpresión.",
        "error",
        3200,
        {
          title: "Elemento duplicado",
          sound: true
        }
      );
      return;
    }

    state.listaParaImprimir.push({
      idUnico: valorId,
      codigo: document.getElementById('resCodigo')?.value || "",
      descripcion: document.getElementById('resDesc')?.value || "",
      cantidad: document.getElementById('resCant')?.value || "",
      ubicacion: document.getElementById('resUbi')?.value || ""
    });

    actualizarVistaReimpresionInterna();
    limpiarFormularioBusqueda();

    notify_("Item añadido correctamente a la lista de reimpresión.", "success", 1600, {
      title: "Añadido a la lista",
      sound: false
    });
  };

  window.quitarDeListaReimpresion = function (index) {
    state.listaParaImprimir.splice(index, 1);
    actualizarVistaReimpresionInterna();

    notify_("Elemento removido de la lista de reimpresión.", "warning", 1400, {
      title: "Elemento removido",
      sound: false
    });
  };

  // =========================================================
  // IMPRESIÓN FINAL
  // =========================================================
  window.generarReimpresion = function () {
    if (state.listaParaImprimir.length === 0) {
      notify_(
        "La lista de reimpresión está vacía.",
        "warning",
        3200,
        {
          title: "Lista vacía",
          sound: true
        }
      );
      return;
    }

    const btn = document.getElementById('btnImprimirTodo');
    const textoBoton = document.getElementById('textoBoton');

    if (!btn || !textoBoton) return;

    btn.disabled = true;
    textoBoton.innerText = "⏳ Generando...";

    notify_("Preparando lote de reimpresión...", "info", 1600, {
      title: "Generando etiquetas",
      sound: false
    });

    const win = window.open("", "_blank");
    if (!win) {
      notify_(
        "La ventana fue bloqueada. Permite los pop-ups para continuar.",
        "warning",
        4200,
        {
          title: "Pop-up bloqueado",
          sound: true
        }
      );
      btn.disabled = false;
      textoBoton.innerText = "Imprimir";
      return;
    }

    win.document.write(`
      <html>
        <head>
          <title>Generando etiquetas...</title>
          <style>
            body {
              font-family: Arial, sans-serif;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              height: 100vh;
              margin: 0;
              color: #5f6368;
              background-color: #f8f9fa;
            }

            .spinner {
              width: 50px;
              height: 50px;
              border: 5px solid #f3f3f3;
              border-top: 5px solid #d93025;
              border-radius: 50%;
              animation: spin 1s linear infinite;
              margin-bottom: 20px;
            }

            @keyframes spin {
              0% { transform: rotate(0deg); }
              100% { transform: rotate(360deg); }
            }

            .loader {
              text-align: center;
              max-width: 420px;
              padding: 0 24px;
            }

            .loader h3 {
              margin: 0 0 8px 0;
              font-size: 22px;
              font-weight: 700;
              color: #1c1d1f;
              letter-spacing: 0.04em;
            }

            .loader p {
              margin: 0;
              font-size: 14px;
              color: #5f6368;
              line-height: 1.5;
            }
          </style>
        </head>
        <body>
          <div class="spinner"></div>
          <div class="loader">
            <h3>Preparando etiquetas...</h3>
            <p>Espera un momento mientras se genera la impresión del excedente.</p>
          </div>
        </body>
      </html>
    `);
    win.document.close();

    google.script.run
      .withSuccessHandler(function (html) {
        win.document.open();
        win.document.write(html);
        win.document.close();

        state.listaParaImprimir = [];
        actualizarVistaReimpresionInterna();

        btn.disabled = false;
        textoBoton.innerText = "Imprimir";

        notify_("Reimpresión enviada correctamente.", "success", 2200, {
          title: "Impresión lista",
          sound: true
        });
      })
      .withFailureHandler(function (err) {
        console.error("❌ Error al procesar reimpresión:", err);
        win.close();

        btn.disabled = false;
        textoBoton.innerText = "Imprimir";

        notify_(
          "No se pudo generar la reimpresión de etiquetas.",
          "error",
          4200,
          {
            title: "Error de impresión",
            sound: true
          }
        );
      })
      .FormularioEtiquetasExcedentesReimpresionController_procesarReimpresion(state.listaParaImprimir);
  };

  // Compatibilidad si alguna parte vieja lo usa
  window.lanzarNotificacion = window.notificar || window.lanzarNotificacion || notify_;

  // No auto-init aquí.
  // El shell es quien llama window.initVista().
})();
</script>
