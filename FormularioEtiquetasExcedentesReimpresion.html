    <script>
  let baseDatosExcedentes = []; 
  let hashExcedentes = ""; 
  let listaParaImprimir = [];
  let snackbarTimeout; // Declaración necesaria para evitar errores
  let bloqueadoPorLlenado = false;

// --- CARGA INICIAL Y MONITOREO (ESTILO SPA) ---
(function() {
  console.log("Iniciando Módulo de Reimpresión de Excedentes...");

  // 1. LIMPIEZA DE SEGURIDAD
  // Si ya existía un intervalo de una visita anterior, lo detenemos
  if (window.intervaloReimpresion) {
    clearInterval(window.intervaloReimpresion);
    console.log("Intervalo de reimpresión previo limpiado.");
  }

  // 2. CARGA DE METADATA INICIAL
  google.script.run
    .withSuccessHandler(function() { 
      console.log("Metadata de reimpresión lista"); 
    })
    .withFailureHandler(function(err) {
      console.error("Error al cargar metadata:", err);
    })
    .obtenerMegaDataInicial();

  // 3. PRIMERA SINCRONIZACIÓN
  sincronizarBaseDeDatos(); 

  // 4. CONFIGURAR EL CICLO DE ACTUALIZACIÓN (Cada 3 segundos)
  window.intervaloReimpresion = setInterval(function() {
    // Verificamos si el contenedor de reimpresión aún existe en el DOM
    // Cambia 'contenedorReimpresion' por el ID real de tu div principal en este archivo
    const vistaActiva = document.getElementById('contenedorReimpresion'); 
    
    if (!vistaActiva) {
      clearInterval(window.intervaloReimpresion);
      console.log("Ciclo de reimpresión detenido por cambio de vista.");
      return;
    }

    sincronizarBaseDeDatos();
  }, 3000);

})();

  // 2. SINCRONIZACIÓN Y NOTIFICACIÓN
function sincronizarBaseDeDatos() {
  const activo = document.activeElement.id;
  // Capturamos valores actuales para saber si el usuario está filtrando
  const valID = document.getElementById("busquedaID").value;
  const valCod = document.getElementById("resCodigo").value;
  const valUbi = document.getElementById("resUbi").value;

  const estaFiltrando = valID || valCod || valUbi;

  google.script.run
    .withSuccessHandler(function(datos) {
      if (!datos) return;
      const nuevoHash = JSON.stringify(datos);
      if (nuevoHash === hashExcedentes) return; 
      
      const esPrimeraCarga = (baseDatosExcedentes.length === 0);
      baseDatosExcedentes = datos;
      hashExcedentes = nuevoHash;
      
      // Si el usuario NO está escribiendo y NO hay filtros aplicados, actualizamos listas
      if (!estaFiltrando && !bloqueadoPorLlenado) {
          actualizarDataListsManual(baseDatosExcedentes);
      }

      if (esPrimeraCarga) {
        lanzarNotificacion("✅ Base de Excedentes conectada", "success");
      }
    })
    .obtenerTodaLaBaseExcedentes();
}

  // 3. FUNCIÓN PARA NOTIFICACIONES (Estilo Toast)
function lanzarNotificacion(m, t) {
    const x = document.getElementById("snackbar");
    if (!x) return; // Seguridad por si no existe el div

    clearTimeout(snackbarTimeout);
    x.innerText = m;
    
    // Aplicamos la clase 'show' y el tipo (ej: success, error, warning)
    x.className = `show ${t || ''}`;
    
    snackbarTimeout = setTimeout(() => { 
      x.className = x.className.replace("show", ""); 
    }, 3000);
  }

// 4. FILTROS CRUZADOS DINÁMICOS
/**
 * Motor de filtrado N-Way (Cruzado). 
 * Filtra la base de datos basándose en los 3 criterios simultáneamente.
 */
function aplicarFiltrosCruzados() {
if (bloqueadoPorLlenado) return;

  // Capturamos el valor ORIGINAL (sin toUpperCase aquí)
  const valID = document.getElementById("busquedaID").value.trim();
  const valCod = document.getElementById("resCodigo").value.trim();
  const valUbi = document.getElementById("resUbi").value.trim();

  // Para la búsqueda interna, sí usamos una versión en mayúsculas
  const searchID = valID.toUpperCase();
  const searchCod = valCod.toUpperCase();
  const searchUbi = valUbi.toUpperCase();

  if (!valID && !valCod && !valUbi) {
    limpiarCamposDetalle();
    actualizarDataListsManual(baseDatosExcedentes);
    return;
  }

  const filtrados = baseDatosExcedentes.filter(item => {
    const matchID = !valID || String(item.IDUNICO).toUpperCase().includes(searchID);
    const matchCod = !valCod || String(item.CODIGO).toUpperCase().includes(searchCod);
    const matchUbi = !valUbi || String(item.UBICACION).toUpperCase().includes(searchUbi);
    return matchID && matchCod && matchUbi;
  });

  actualizarDataListsManual(filtrados);

  if (filtrados.length === 1) {
    bloqueadoPorLlenado = true;
    llenarFormulario(filtrados); // <--- Corregido filtrados
    setTimeout(() => { bloqueadoPorLlenado = false; }, 200);
  } else {
    // Comparación de coincidencia exacta (Case-Insensitive para mayor comodidad)
    const itemExacto = filtrados.find(i => String(i.IDUNICO).trim().toUpperCase() === searchID);
    if (itemExacto) {
      bloqueadoPorLlenado = true;
      llenarFormulario(itemExacto);
      setTimeout(() => { bloqueadoPorLlenado = false; }, 200);
    } else {
      document.getElementById('resDesc').value = "";
      document.getElementById('resCant').value = "";
      document.getElementById('busquedaID').dataset.actualId = "";
    }
  }
}

// 5. UTILIDADES
function actualizarDataListsManual(datos) {
// Sacamos valores únicos de los datos que ya pasaron el filtro
  const ids = [...new Set(datos.map(i => i.IDUNICO).filter(Boolean))];
  const codigos = [...new Set(datos.map(i => i.CODIGO).filter(Boolean))];
  const ubis = [...new Set(datos.map(i => i.UBICACION).filter(Boolean))];

  llenarDatalist("listaIDs", ids);
  llenarDatalist("listaCodigos", codigos);
  llenarDatalist("listaUbicaciones", ubis);
}

  function llenarDatalist(id, array) {
const dl = document.getElementById(id);
  if (!dl) return;
  dl.innerHTML = ''; // Limpiamos opciones anteriores
  
  // Ordenar y quitar duplicados/nulos ya viene del paso anterior
  array.sort().forEach(v => {
    if (v) {
      let opt = document.createElement('option');
      opt.value = v;
      dl.appendChild(opt);
    }
  });
}

function llenarFormulario(d) {
if (!d || Array.isArray(d)) return; 
  
  const elID = document.getElementById('busquedaID');
  const elCod = document.getElementById('resCodigo');
  const elUbi = document.getElementById('resUbi');

  // Comparamos los valores tal cual vienen, sin forzar mayúsculas
  if (elID.value !== String(d.IDUNICO)) elID.value = d.IDUNICO || "";
  if (elCod.value !== String(d.CODIGO)) elCod.value = d.CODIGO || "";
  if (elUbi.value !== String(d.UBICACION)) elUbi.value = d.UBICACION || "";

  document.getElementById('resDesc').value = d.DESCRIPCION || "";
  document.getElementById('resCant').value = d.CANTIDAD || "";
  
  elID.dataset.actualId = d.IDUNICO || "";
}

  function restablecerFiltros() {
limpiarCamposDetalle();
  actualizarDataListsManual(baseDatosExcedentes);
}

  function limpiarCamposDetalle() {
    document.getElementById('resDesc').value = "";
    document.getElementById('resCant').value = "";
    document.getElementById('busquedaID').dataset.actualId = "";
  }


// 6. GESTIÓN DE LISTA E IMPRESIÓN
function agregarAListaReimpresion() {
const inputID = document.getElementById('busquedaID');
  const valorId = inputID.dataset.actualId;
  
  // Validación extra: Que el valor del input coincida con el ID guardado
  if (!valorId || inputID.value !== valorId) { 
    lanzarNotificacion("⚠️ Por favor, selecciona un ID válido de la lista", "warning"); 
    return; 
  }

  if (listaParaImprimir.some(item => item.idUnico === valorId)) {
    lanzarNotificacion("❌ Este ID ya está en la lista", "error");
    return;
  }

  listaParaImprimir.push({
    idUnico: valorId,
    codigo: document.getElementById('resCodigo').value,
    descripcion: document.getElementById('resDesc').value,
    cantidad: document.getElementById('resCant').value,
    ubicacion: document.getElementById('resUbi').value
  });

  actualizarVistaReimpresion();
  limpiarFormularioBusqueda(); // Esta función ahora resetea todo
  lanzarNotificacion("➕ Añadido a la lista", "success");
}

function actualizarVistaReimpresion() {
    const listaUI = document.getElementById('listaReimpresion');
    const btnPrint = document.getElementById('btnImprimirTodo');
    const textoBoton = document.getElementById('textoBoton');
    const plantilla = document.getElementById('plantillaExcedenteReimpresion').innerHTML;
    
    listaUI.innerHTML = "";
    listaParaImprimir.forEach((item, index) => {
      let html = plantilla
        .replace(/{{idUnico}}/g, item.idUnico)
        .replace(/{{codigo}}/g, item.codigo)
        .replace(/{{descripcion}}/g, item.descripcion)
        .replace(/{{cantidad}}/g, item.cantidad)
        .replace(/{{ubicacion}}/g, item.ubicacion)
        .replace(/{{index}}/g, index);
      listaUI.insertAdjacentHTML('beforeend', html);
    });

    btnPrint.style.display = listaParaImprimir.length > 0 ? "block" : "none";
    textoBoton.innerText = `Imprimir (${listaParaImprimir.length})`;
  }

  function quitarDeListaReimpresion(index) {
    listaParaImprimir.splice(index, 1);
    actualizarVistaReimpresion();
  }

function limpiarFormularioBusqueda() {
bloqueadoPorLlenado = true; // Evita que oninput se dispare mientras limpiamos
  
  const ids = ["busquedaID", "resCodigo", "resDesc", "resCant", "resUbi"];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });
  
  document.getElementById('busquedaID').dataset.actualId = ""; 
  
  // RESTAURACIÓN TOTAL: Esto permite que al volver a escribir aparezcan todos los valores
  actualizarDataListsManual(baseDatosExcedentes); 
  
  bloqueadoPorLlenado = false;
  document.getElementById('busquedaID').focus();
}
