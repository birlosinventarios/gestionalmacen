<script>
/**
 * BLINDAJE DE VARIABLES GLOBALES
 * Usamos el objeto 'window' para verificar si la variable ya existe.
 * Si ya existe, la reutilizamos; si no, la inicializamos.
 */
window.baseDatosExcedentes = window.baseDatosExcedentes || [];
window.hashExcedentes = window.hashExcedentes || "";
window.listaParaImprimirReimpresion = window.listaParaImprimirReimpresion || []; // Nombre único para esta vista
window.snackbarTimeoutReimpresion = window.snackbarTimeoutReimpresion || null;
window.bloqueadoPorLlenado = false;

/**
 * FUNCIÓN DE ENTRADA OBLIGATORIA
 */
function cargar_FormularioEtiquetasExcedentesReimpresion() {
  console.log("🚀 Solicitando datos al servidor...");

  google.script.run
    .withSuccessHandler(function(datos) {
      // Si el servidor devuelve null o undefined, convertimos a array vacío
      const base = datos || [];
      
      if (base.length === 0) {
        console.warn("⚠️ El servidor no devolvió registros.");
        // Opcional: lanzar una notificación visual al usuario
        lanzarNotificacion("No se encontraron datos en BD-EXCEDENTES", "error");
        return;
      }
      
      window.baseDatosExcedentes = base;
      window.hashExcedentes = JSON.stringify(base);
      
      // Actualizamos los datalists
      actualizarDataListsManual(base);
      console.log("✅ Conexión exitosa. Registros cargados: " + base.length);
    })
    .withFailureHandler(function(err) {
      console.error("❌ Error de red/servidor:", err);
      lanzarNotificacion("Error al conectar con la base de datos", "error");
    })
    .obtenerTodaLaBaseExcedentes();
}

// --- SINCRONIZACIÓN ---
function sincronizarBaseDeDatos() {
  const inputBusqueda = document.getElementById("busquedaID");
  if (!inputBusqueda) return;

  const valID = inputBusqueda.value;
  const valCod = document.getElementById("resCodigo").value;
  const estaFiltrando = valID || valCod;

  google.script.run
    .withSuccessHandler(function(datos) {
      if (!datos) return;
      const nuevoHash = JSON.stringify(datos);
      if (nuevoHash === window.hashExcedentes) return; 
      
      window.baseDatosExcedentes = datos;
      window.hashExcedentes = nuevoHash;
      
      if (!estaFiltrando && !window.bloqueadoPorLlenado) {
          actualizarDataListsManual(window.baseDatosExcedentes);
      }
    })
    .obtenerTodaLaBaseExcedentes();
}

// --- FILTROS CRUZADOS ---
function aplicarFiltrosCruzados() {
  if (window.bloqueadoPorLlenado) return;

  const valID = document.getElementById("busquedaID").value.trim().toUpperCase();
  const valCod = document.getElementById("resCodigo").value.trim().toUpperCase();

  // Si está vacío, resetear
  if (!valID && !valCod) {
    limpiarCamposDetalle();
    actualizarDataListsManual(window.baseDatosExcedentes);
    return;
  }

  // Filtrado robusto
  const filtrados = window.baseDatosExcedentes.filter(item => {
    const idItem = String(item.idUnico || "").trim().toUpperCase();
    const codItem = String(item.ecodigo || "").trim().toUpperCase();
    
    const coincidenciaID = !valID || idItem.includes(valID);
    const coincidenciaCod = !valCod || codItem.includes(valCod);
    
    return coincidenciaID && coincidenciaCod;
  });

  actualizarDataListsManual(filtrados);

  // Intentar autocompletar si hay una coincidencia clara
  const coincidenciaExacta = filtrados.find(i => String(i.idUnico).trim().toUpperCase() === valID);

  if (coincidenciaExacta) {
    window.bloqueadoPorLlenado = true;
    llenarFormulario(coincidenciaExacta); // Pasar el OBJETO
    setTimeout(() => { window.bloqueadoPorLlenado = false; }, 200);
  } 
  else if (filtrados.length === 1 && (valID.length > 3 || valCod.length > 3)) { 
    window.bloqueadoPorLlenado = true;
    llenarFormulario(filtrados); // <--- CORRECCIÓN: Usar el índice 0
    setTimeout(() => { window.bloqueadoPorLlenado = false; }, 200);
  } 
  else {
    limpiarCamposDetalle();
  }
}

// --- UTILIDADES ---
function actualizarDataListsManual(datos) {
  if (!datos || !Array.isArray(datos)) return;

  // Extraemos solo el ID para el listado de sugerencias
  const ids = datos.map(i => i.idUnico).filter(Boolean);
  const codigos = datos.map(i => i.ecodigo).filter(Boolean);
  
  llenarDatalist("listaIDs", ids);
  llenarDatalist("listaCodigos", codigos);
}

function llenarFormulario(d) {
  if (!d || typeof d !== 'object') return; 

  // Usamos los nombres de propiedades que definimos en Consultas.gs
  document.getElementById('resCodigo').value = d.ecodigo || "";
  document.getElementById('resDesc').value = d.edescripcion || "";
  document.getElementById('resCant').value = d.ecantidad || "";
  
  const inputUbi = document.getElementById('resUbi');
  if (inputUbi) {
    inputUbi.value = d.estatus || ""; 
  }
  
  // Guardamos el ID real en el dataset para validar al "Añadir a la lista"
  document.getElementById('busquedaID').dataset.actualId = d.idUnico || "";
  
  // Si el valor del input es distinto al ID (porque vino de búsqueda de código), lo actualizamos
  if (document.getElementById('busquedaID').value !== d.idUnico) {
     document.getElementById('busquedaID').value = d.idUnico;
  }
}

function limpiarCamposDetalle() {
  document.getElementById('resDesc').value = "";
  document.getElementById('resCant').value = "";
  document.getElementById('busquedaID').dataset.actualId = "";
}

function agregarAListaReimpresion() {
  const inputID = document.getElementById('busquedaID');
  const valorId = inputID.dataset.actualId;
  
  if (!valorId || inputID.value !== valorId) { 
    lanzarNotificacion("⚠️ Selecciona un ID válido", "warning"); 
    return; 
  }

  if (window.listaParaImprimirReimpresion.some(item => item.idUnico === valorId)) {
    lanzarNotificacion("❌ Ya está en la lista", "error");
    return;
  }

  window.listaParaImprimirReimpresion.push({
    idUnico: valorId,
    codigo: document.getElementById('resCodigo').value,
    descripcion: document.getElementById('resDesc').value,
    cantidad: document.getElementById('resCant').value,
    ubicacion: "REIMPRESIÓN" 
  });

  actualizarVistaReimpresion();
  limpiarFormularioBusqueda();
  lanzarNotificacion("➕ Añadido", "success");
}

function actualizarVistaReimpresion() {
  const listaUI = document.getElementById('listaReimpresion');
  const btnPrint = document.getElementById('btnImprimirTodo');
  const textoBoton = document.getElementById('textoBoton');
  const plantilla = document.getElementById('plantillaExcedenteReimpresion').innerHTML;
  
  listaUI.innerHTML = "";
  window.listaParaImprimirReimpresion.forEach((item, index) => {
    let html = plantilla
      .replace(/{{idUnico}}/g, item.idUnico)
      .replace(/{{codigo}}/g, item.codigo)
      .replace(/{{descripcion}}/g, item.descripcion)
      .replace(/{{cantidad}}/g, item.cantidad)
      .replace(/{{ubicacion}}/g, item.ubicacion)
      .replace(/{{index}}/g, index);
    listaUI.insertAdjacentHTML('beforeend', html);
  });

  btnPrint.style.display = window.listaParaImprimirReimpresion.length > 0 ? "block" : "none";
  textoBoton.innerText = `Imprimir (${window.listaParaImprimirReimpresion.length})`;
}

function quitarDeListaReimpresion(index) {
  window.listaParaImprimirReimpresion.splice(index, 1);
  actualizarVistaReimpresion();
}

function llenarDatalist(id, array) {
  const dl = document.getElementById(id);
  if (!dl) return;
  
  dl.innerHTML = ''; 
  // Eliminamos duplicados
  const unicos = [...new Set(array)];
  
  unicos.forEach(v => {
    if (v) {
      let opt = document.createElement('option');
      opt.value = v; // Aquí solo debe ir el ID, no el objeto
      dl.appendChild(opt);
    }
  });
}

function limpiarFormularioBusqueda() {
  window.bloqueadoPorLlenado = true;
  ["busquedaID", "resCodigo", "resDesc", "resCant"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });
  document.getElementById('busquedaID').dataset.actualId = ""; 
  actualizarDataListsManual(window.baseDatosExcedentes); 
  window.bloqueadoPorLlenado = false;
}

function lanzarNotificacion(m, t) {
  const x = document.getElementById("snackbar");
  if (!x) return;
  clearTimeout(window.snackbarTimeoutReimpresion);
  x.innerText = m;
  x.className = `show ${t || ''}`;
  window.snackbarTimeoutReimpresion = setTimeout(() => { x.className = x.className.replace("show", ""); }, 3000);
}

function generarReimpresion() {
  if (window.listaParaImprimirReimpresion.length === 0) return;
  const btn = document.getElementById('btnImprimirTodo');
  btn.disabled = true;
  document.getElementById('textoBoton').innerText = "⏳ Generando...";

  const win = window.open("", "_blank");
  win.document.write("<html><body><h3>Generando etiquetas...</h3></body></html>");

  google.script.run
    .withSuccessHandler(function(html) {
      win.document.open();
      win.document.write(html);
      win.document.close();
      window.listaParaImprimirReimpresion = [];
      actualizarVistaReimpresion();
      btn.disabled = false;
      document.getElementById('textoBoton').innerText = "Imprimir";
    })
    .procesarReimpresionExcedentes(window.listaParaImprimirReimpresion); 
}
</script>
