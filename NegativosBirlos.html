<div id="render-negativos-birlos" class="h-full w-full flex flex-col bg-[#f8f9fa] overflow-y-auto p-4 md:p-8"></div>

<script type="text/babel">
  window.cargar_NegativosBirlos = () => {
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // =========================================================
    // HELPERS DE NOTIFICACIÓN
    // =========================================================
    const notify_ = (mensaje, tipo = "info", timer = 2500, options = {}) => {
      const fn = window.notificar || window.lanzarNotificacion;
      if (typeof fn === "function") {
        fn(mensaje, tipo, timer, options);
      }
    };

    const createNotifyOnce_ = (ref) => (key, mensaje, tipo = "info", timer = 2500, options = {}, cooldown = 8000) => {
      const now = Date.now();
      const last = ref.current[key] || 0;
      if (now - last < cooldown) return;
      ref.current[key] = now;
      notify_(mensaje, tipo, timer, options);
    };

    const shellNotifyStateRef = { current: {} };
    const notifyOnceShell_ = createNotifyOnce_(shellNotifyStateRef);

    const LocalIcon = ({ name, size = 18, className = "" }) => {
      const iconRef = useRef(null);

      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name.toLowerCase());
          i.style.width = `${size}px`;
          i.style.height = `${size}px`;
          if (className) i.className = className;
          iconRef.current.appendChild(i);
          window.lucide.createIcons();
        }
      }, [name, size, className]);

      return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
    };

    const KPIBlock = ({ title, value, unit, iconName, trend, indicatorColor }) => {
      const colorMap = {
        red: 'bg-red-50 text-red-600 border border-red-100',
        amber: 'bg-amber-50 text-amber-600 border border-amber-100',
        blue: 'bg-blue-50 text-blue-600 border border-blue-100',
        emerald: 'bg-emerald-50 text-emerald-600 border border-emerald-100',
        black: 'bg-slate-100 text-slate-900 border border-slate-300',
      };

      const topBarColor =
        indicatorColor === 'red'
          ? 'bg-red-500'
          : indicatorColor === 'amber'
          ? 'bg-amber-500'
          : indicatorColor === 'blue'
          ? 'bg-blue-500'
          : indicatorColor === 'black'
          ? 'bg-slate-900'
          : 'bg-emerald-500';

      const trendColor =
        trend?.type === 'negative'
          ? 'bg-red-50 text-red-600'
          : trend?.type === 'neutral'
          ? 'bg-amber-50 text-amber-700'
          : trend?.type === 'info'
          ? 'bg-blue-50 text-blue-700'
          : trend?.type === 'dark'
          ? 'bg-slate-100 text-slate-900 border border-slate-300'
          : 'bg-emerald-50 text-emerald-700';

      return (
        <div className="bg-white border border-[#dadce0] rounded-[1.25rem] p-4 shadow-sm hover:shadow-md transition-all duration-300 relative overflow-hidden group min-h-[112px]">
          <div className={`absolute top-0 left-0 right-0 h-1.5 ${topBarColor}`}></div>

          <div className="h-full flex flex-col pt-1">
            <div className="grid grid-cols-[1fr_auto] items-center gap-3 h-full">
              <div className="min-w-0">
                <p className="text-[12px] font-black uppercase tracking-[0.12em] text-[#5f6368] leading-tight mb-2">
                  {title}
                </p>

                <div className="flex items-end gap-2 flex-wrap">
                  <h3 className="m-0 p-0 bg-transparent border-none text-[34px] font-black tracking-tight text-[#1c1d1f] leading-none">
                    {value}
                  </h3>

                  {unit && (
                    <span className="text-[13px] font-black text-[#5f6368] uppercase leading-none pb-1">
                      {unit}
                    </span>
                  )}
                </div>

                {trend && (
                  <div className="mt-2 flex items-center gap-2 flex-wrap">
                    <span className={`px-2.5 py-1 rounded-full text-[10px] font-black uppercase ${trendColor}`}>
                      {trend.text}
                    </span>

                    {trend.sub && (
                      <span className="text-[11px] font-semibold text-[#5f6368]">
                        {trend.sub}
                      </span>
                    )}
                  </div>
                )}
              </div>

              <div className="justify-self-end">
                <div className={`w-11 h-11 rounded-xl flex items-center justify-center ${colorMap[indicatorColor]}`}>
                  <LocalIcon name={iconName} size={28} />
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const NegativosBirlosDashboard = () => {
      const [negativos, setNegativos] = useState([]);
      const [ubicacionesSurtido, setUbicacionesSurtido] = useState([]);
      const [loading, setLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState("");
      const [filterStatus, setFilterStatus] = useState("ALL");
      const [filterBodega, setFilterBodega] = useState("TODAS");
      const [activeRow, setActiveRow] = useState(null);
      const [sortBy, setSortBy] = useState("NONE");
      const [hoverMenu, setHoverMenu] = useState(null);
      const [modoBalance, setModoBalance] = useState("EXISTENCIAS");
      
      const [isSearchExpanded, setIsSearchExpanded] = useState(false);
      const [isFabMenuOpen, setIsFabMenuOpen] = useState(false);
      const [isFabMenuMounted, setIsFabMenuMounted] = useState(false);
      const [isFabClosing, setIsFabClosing] = useState(false);
      const [isSearchClosing, setIsSearchClosing] = useState(false);


      const closeMenuTimeout = useRef(null);
      const searchInputRef = useRef(null);
      const firstLoadDoneRef = useRef(false);
      const manualRefreshCountRef = useRef(0);
      const fabContainerRef = useRef(null);

      const abrirFabMenu_ = () => {
        setIsFabMenuMounted(true);
        setIsFabClosing(false);
        setIsFabMenuOpen(true);
      };

      const cerrarFabMenu_ = () => {
        setIsFabClosing(true);
        setIsSearchClosing(true);

        setTimeout(() => {
          setIsFabMenuOpen(false);
          setIsFabMenuMounted(false);
          setIsFabClosing(false);
          setIsSearchExpanded(false);
          setIsSearchClosing(false);
          setSearchQuery("");
        }, 190);
      };

      const toggleFabMenu_ = () => {
        if (isFabMenuOpen) {
          cerrarFabMenu_();
        } else {
          abrirFabMenu_();
        }
      };

      const abrirBuscador_ = () => {
        setIsSearchClosing(false);
        setIsSearchExpanded(true);
        setTimeout(() => searchInputRef.current?.focus(), 120);
      };

      const cerrarBuscador_ = () => {
        setIsSearchClosing(true);

        setTimeout(() => {
          setIsSearchExpanded(false);
          setIsSearchClosing(false);
          setSearchQuery("");
        }, 180);
      };

      const toggleBuscador_ = () => {
        if (isSearchExpanded) {
          cerrarBuscador_();
        } else {
          abrirBuscador_();
        }
      };

      useEffect(() => {
        if (!isFabMenuOpen) return;

        const handleKeyDown = (event) => {
          if (event.key === "Escape") {
            cerrarFabMenu_();
          }
        };

        document.addEventListener("keydown", handleKeyDown, true);

        return () => {
          document.removeEventListener("keydown", handleKeyDown, true);
        };
      }, [isFabMenuOpen]);

      const fetchDatabase = useCallback((contexto = "init") => {
        const USAR_MOCK = false;
        setLoading(true);

        if (contexto === "init") {
          notify_("Cargando análisis de negativos en almacén...", "info", 1600, {
            title: "Inicializando vista",
            sound: false
          });
        } else {
          notify_("Actualizando negativos de almacén...", "info", 1400, {
            title: "Sincronizando",
            sound: false
          });
        }

        if (!USAR_MOCK && typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((resultado) => {
              const negativosCargados = resultado?.negativos || [];
              const ubicacionesCargadas = resultado?.ubicacionesSurtido || [];

              setNegativos(negativosCargados);
              setUbicacionesSurtido(ubicacionesCargadas);
              setLoading(false);

              const total = Array.isArray(negativosCargados) ? negativosCargados.length : 0;

              if (total === 0) {
                if (contexto === "init") {
                  notify_("No se encontraron negativos activos en almacén.", "success", 2200, {
                    title: "Sin pendientes críticos",
                    sound: false
                  });
                } else {
                  notify_("La actualización terminó sin registros negativos activos.", "success", 1800, {
                    title: "Actualización completada",
                    sound: false
                  });
                }
                firstLoadDoneRef.current = true;
                return;
              }

              if (!firstLoadDoneRef.current) {
                firstLoadDoneRef.current = true;
                notify_(
                  `Se cargaron ${total} registros con negativos activos.`,
                  "success",
                  2200,
                  {
                    title: "Sincronización completada",
                    sound: false
                  }
                );
              } else {
                manualRefreshCountRef.current += 1;
                if (contexto !== "init") {
                  notify_(
                    `Negativos actualizados correctamente (${total} registros).`,
                    "success",
                    1800,
                    {
                      title: "Actualización completada",
                      sound: false
                    }
                  );
                } else {
                  notifyOnceShell_(
                    "negativos-refresh-interno",
                    "La vista de negativos se actualizó correctamente.",
                    "success",
                    1600,
                    {
                      title: "Vista lista",
                      sound: false
                    },
                    12000
                  );
                }
              }
            })
            .withFailureHandler((err) => {
              console.error("❌ [NegativosBirlos] Error consultando controller:", err);
              setNegativos([]);
              setUbicacionesSurtido([]);
              setLoading(false);

              notify_(
                (err && err.message) ? err.message : "No se pudo consultar NegativosBirlosController.",
                "error",
                4200,
                {
                  title: contexto === "init" ? "Error de carga" : "Error de sincronización",
                  sound: true
                }
              );
            })
            .NegativosBirlosController_getVista();

        } else {
          setTimeout(() => {
            const mockNegativos = [
              {
                idproducto: 158,
                codigo: "T5S-1/4X31/2",
                descripcion: "TORNILLO GRADO 5 CABEZA EXAGONAL 1/4 X 3 1/2",
                almacenbirlos: -45,

                excedentebodega: 150,
                excedentecasablanca: 0,
                excedenteTotalExistencias: 150,

                excedentebodegaIdUnico: 42,
                excedentecasablancaIdUnico: 0,
                excedenteTotalIdUnico: 42,

                idsUnicosExcedenteBodega: [],
                idsUnicosExcedenteCasaBlanca: [],
                modoBalanceDisponibleIdUnico: true
              }
            ];

            const mockUbicacionesSurtido = [
              { codigo: "T5S-1/4X31/2", ubicacion: "B1-P05-A2" }
            ];

            setNegativos(mockNegativos);
            setUbicacionesSurtido(mockUbicacionesSurtido);
            setLoading(false);

            notify_("Vista cargada con datos simulados.", "info", 1800, {
              title: "Modo mock activo",
              sound: false
            });
          }, 1000);
        }
      }, []);

      useEffect(() => {
        fetchDatabase("init");
      }, [fetchDatabase]);

      const getBodegaKey = (ubicacion) => {
        const raw = String(ubicacion || "").toUpperCase().trim();

        if (!raw || raw === "SIN ASIGNAR") return "SIN_UBICACION";
        if (raw.startsWith("B1")) return "B1";
        if (raw.startsWith("B2")) return "B2";
        if (raw.startsWith("B3")) return "B3";
        if (raw.startsWith("CU")) return "CU";
        if (raw.startsWith("MO")) return "MO";

        return "OTRO";
      };

      const getBodegaLabel = (key) => {
        const map = {
          TODAS: "Todas",
          B1: "Bodega 1",
          B2: "Bodega 2",
          B3: "Bodega 3",
          CU: "Cuarto Alto Riesgo",
          MO: "Mostrador",
          SIN_UBICACION: "Sin ubicación",
          OTRO: "Otro"
        };
        return map[key] || "Todas";
      };

      const openHoverMenu = (menuName) => {
        if (closeMenuTimeout.current) {
          clearTimeout(closeMenuTimeout.current);
          closeMenuTimeout.current = null;
        }
        setHoverMenu(menuName);
      };

      const closeHoverMenuWithDelay = () => {
        if (closeMenuTimeout.current) {
          clearTimeout(closeMenuTimeout.current);
        }

        closeMenuTimeout.current = setTimeout(() => {
          setHoverMenu(null);
        }, 180);
      };

      const cancelCloseHoverMenu = () => {
        if (closeMenuTimeout.current) {
          clearTimeout(closeMenuTimeout.current);
          closeMenuTimeout.current = null;
        }
      };

      const mapUbicacionesFloor = useMemo(() => {
        const mapa = ubicacionesSurtido.reduce((acc, item) => {
          const codigo = String(item.codigo || "").toUpperCase().trim();
          const ubicacion = String(item.ubicacion || "").toUpperCase().trim();

          if (codigo) {
            acc[codigo] = ubicacion;
          }

          return acc;
        }, {});

        return mapa;
      }, [ubicacionesSurtido]);

      const consolidadoNegativos = useMemo(() => {
        return negativos.map(item => {
          const sku = String(item.codigo).toUpperCase().trim();
          const ubicacionPiso = mapUbicacionesFloor[sku] || "SIN ASIGNAR";
          const bodegaKey = getBodegaKey(ubicacionPiso);
          const bodegaLabel = getBodegaLabel(bodegaKey);

          const usandoIdUnico = modoBalance === "IDUNICO";

          const excedenteBodegaActivo = usandoIdUnico
            ? Number(item.excedentebodegaIdUnico || 0)
            : Number(item.excedentebodega || 0);

          const excedenteCasaBlancaActivo = usandoIdUnico
            ? Number(item.excedentecasablancaIdUnico || 0)
            : Number(item.excedentecasablanca || 0);

          const sumaExcedente =
            excedenteBodegaActivo + excedenteCasaBlancaActivo;

          const deficit = Math.abs(Number(item.almacenbirlos || 0));
          const traspasoViable = sumaExcedente >= deficit && deficit > 0;

          let estatusTecnico = "";

          if (sumaExcedente === 0) {
            estatusTecnico = "Solicitar conteo";
          } else if (sumaExcedente < deficit) {
            estatusTecnico = "Cobertura parcial";
          } else {
            estatusTecnico = "Revisar Excedentes";
          }

          return {
            ...item,

            ubicacionPiso,
            bodegakey: bodegaKey,
            bodegalabel: bodegaLabel,

            modoBalanceActivo: modoBalance,

            excedenteBodegaActivo,
            excedenteCasaBlancaActivo,
            sumaExcedente,

            deficit,
            traspasoViable,
            estatusTecnico
          };
        });
      }, [negativos, mapUbicacionesFloor, modoBalance]);

      const metrics = useMemo(() => {
        const negativosActivos = consolidadoNegativos.length;

        const negativosSinExcedentes = consolidadoNegativos.filter(
          item => Number(item.sumaExcedente || 0) === 0
        ).length;

        const negativosCoberturaParcial = consolidadoNegativos.filter(
          item =>
            Number(item.sumaExcedente || 0) > 0 &&
            Number(item.sumaExcedente || 0) < Number(item.deficit || 0)
        ).length;

        const negativosCoberturaCompleta = consolidadoNegativos.filter(
          item => item.traspasoViable === true
        ).length;

        return {
          negativosActivos,
          negativosSinExcedentes,
          negativosCoberturaParcial,
          negativosCoberturaCompleta
        };
      }, [consolidadoNegativos]);

      const recordsFiltered = useMemo(() => {
        return consolidadoNegativos.filter(item => {
          const matchText =
            item.codigo.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.descripcion.toLowerCase().includes(searchQuery.toLowerCase());

          if (!matchText) return false;

          if (filterBodega !== "TODAS" && item.bodegakey !== filterBodega) {
            return false;
          }

          if (filterStatus === "READY") return item.traspasoViable;
          if (filterStatus === "NO_STOCK") return Number(item.sumaExcedente || 0) === 0;

          if (filterStatus === "PARTIAL") {
            return Number(item.sumaExcedente || 0) > 0 &&
                  Number(item.sumaExcedente || 0) < Number(item.deficit || 0);
          }

          return true;
        });
      }, [consolidadoNegativos, searchQuery, filterStatus, filterBodega]);

      const recordsFinal = useMemo(() => {
        const salida = [...recordsFiltered];

        if (sortBy === "CODIGO_ASC") {
          salida.sort((a, b) =>
            String(a.codigo || "").localeCompare(
              String(b.codigo || ""),
              "es",
              { sensitivity: "base", numeric: true }
            )
          );
        }

        if (sortBy === "CODIGO_DESC") {
          salida.sort((a, b) =>
            String(b.codigo || "").localeCompare(
              String(a.codigo || ""),
              "es",
              { sensitivity: "base", numeric: true }
            )
          );
        }

        if (sortBy === "UBICACION_ASC") {
          salida.sort((a, b) =>
            String(a.ubicacionPiso || "").localeCompare(
              String(b.ubicacionPiso || ""),
              "es",
              { sensitivity: "base", numeric: true }
            )
          );
        }

        if (sortBy === "UBICACION_DESC") {
          salida.sort((a, b) =>
            String(b.ubicacionPiso || "").localeCompare(
              String(a.ubicacionPiso || ""),
              "es",
              { sensitivity: "base", numeric: true }
            )
          );
        }

        return salida;
      }, [recordsFiltered, sortBy]);

      const exportarExcelCompleto = () => {
        if (!window.ExcelExportUtils || typeof window.ExcelExportUtils.exportarAXLSX !== "function") {
          notify_(
            "No se detectó el helper global de exportación XLSX.",
            "error",
            4200,
            {
              title: "Exportador no disponible",
              sound: true
            }
          );
          return;
        }

        if (!Array.isArray(consolidadoNegativos) || consolidadoNegativos.length === 0) {
          notify_(
            "No existen registros disponibles para exportación.",
            "warning",
            3200,
            {
              title: "Sin datos para exportar",
              sound: true
            }
          );
          return;
        }

        const fecha = new Date().toISOString().slice(0, 10);

        window.ExcelExportUtils.exportarAXLSX({
          fileName: `Negativos_Birlos_${fecha}.xlsx`,
          sheetName: "Negativos",
          rows: consolidadoNegativos,
            columns: [
              { key: "codigo", label: "Código" },
              { key: "descripcion", label: "Descripción" },
              { key: "ubicacionPiso", label: "Ubicación Surtido" },
              { key: "bodegalabel", label: "Bodega / Zona" },
              { key: "almacenbirlos", label: "Saldo Piso Venta" },
              { key: "deficit", label: "Déficit" },
              { key: "modoBalanceActivo", label: "Modo Balance" },
              { key: "excedenteBodegaActivo", label: "Excedente Bodega Activo" },
              { key: "excedenteCasaBlancaActivo", label: "Excedente Casa Blanca Activo" },
              { key: "sumaExcedente", label: "Excedente Total Activo" },
              { key: "excedentebodega", label: "Excedente Bodega Existencias" },
              { key: "excedentecasablanca", label: "Excedente Casa Blanca Existencias" },
              { key: "excedentebodegaIdUnico", label: "Excedente Bodega ID Único" },
              { key: "excedentecasablancaIdUnico", label: "Excedente Casa Blanca ID Único" },
              { key: "estatusTecnico", label: "Estatus Técnico" }
            ]
        });

        notify_(
          `Se inició la exportación de ${consolidadoNegativos.length} registros.`,
          "success",
          2200,
          {
            title: "Exportación iniciada",
            sound: true
          }
        );
      };

      const abrirPanelExportacion = () => {
        const panel = document.getElementById('panelExportarNegativos');

        if (!panel) {
          notify_(
            "No se encontró el panel lateral de exportación.",
            "error",
            4200,
            {
              title: "Panel no disponible",
              sound: true
            }
          );
          return;
        }

        if (typeof bootstrap === 'undefined' || !bootstrap.Offcanvas) {
          notify_(
            "No se detectó bootstrap.bundle.min.js para abrir el panel.",
            "error",
            4200,
            {
              title: "Bootstrap no disponible",
              sound: true
            }
          );
          return;
        }

        const instancia = bootstrap.Offcanvas.getOrCreateInstance(panel);
        instancia.show();

        notify_("Panel de exportación abierto.", "info", 1200, {
          title: "Exportación",
          sound: false
        });
      };

      const escapeHtml_ = (value) => {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      };

      const compareEsLocal_ = (a, b) => {
        return String(a || "").localeCompare(String(b || ""), "es", {
          sensitivity: "base",
          numeric: true
        });
      };

      const buildDetalleIdUnicoHtml_ = (item) => {
        const detalles = Array.isArray(item.detalleIdUnicoExcedentes)
          ? [...item.detalleIdUnicoExcedentes]
          : [];

        detalles.sort((a, b) => {
          const cmpBodega = compareEsLocal_(a.bodega, b.bodega);
          if (cmpBodega !== 0) return cmpBodega;

          const cmpUbicacion = compareEsLocal_(a.ubicacion, b.ubicacion);
          if (cmpUbicacion !== 0) return cmpUbicacion;

          return compareEsLocal_(a.sku, b.sku);
        });

        if (detalles.length === 0) {
          return `
            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 text-center">
              <div class="text-xs font-black uppercase tracking-wider text-slate-500">
                Sin ID únicos vigentes para este SKU
              </div>
            </div>
          `;
        }

        const grupos = detalles.reduce((acc, row) => {
          const bodega = String(row.bodega || "SIN BODEGA").toUpperCase();

          if (!acc[bodega]) acc[bodega] = [];
          acc[bodega].push(row);

          return acc;
        }, {});

        const bodegasOrdenadas = Object.keys(grupos).sort((a, b) => compareEsLocal_(a, b));

        return bodegasOrdenadas.map((bodega) => {
          const rows = grupos[bodega];

          const totalBodega = rows.reduce((acc, row) => {
            return acc + Number(row.cantidadIdUnico || 0);
          }, 0);

          const rowsHtml = rows.map((row) => `
            <tr>
              <td style="width:22%; padding:8px 10px; border-bottom:1px solid #e5e7eb; font-weight:800; color:#1c1d1f; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                ${escapeHtml_(row.bodega)}
              </td>

              <td style="width:20%; padding:8px 10px; border-bottom:1px solid #e5e7eb; font-family:'JetBrains Mono', monospace; font-weight:800; color:#d93025; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                ${escapeHtml_(row.ubicacion)}
              </td>

              <td style="width:24%; padding:8px 10px; border-bottom:1px solid #e5e7eb; font-family:'JetBrains Mono', monospace; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                ${escapeHtml_(row.sku)}
              </td>

              <td style="width:20%; padding:8px 10px; border-bottom:1px solid #e5e7eb; font-family:'JetBrains Mono', monospace; font-weight:900; color:#1c1d1f; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                ${escapeHtml_(row.idUnico || row.idunico || "")}
              </td>

              <td style="width:14%; padding:8px 10px; border-bottom:1px solid #e5e7eb; text-align:right; font-weight:900; white-space:nowrap;">
                ${Number(row.cantidadIdUnico || 0).toLocaleString()}
              </td>
            </tr>
          `).join("");

          return `
            <div style="margin-bottom:14px; border:1px solid #dadce0; border-radius:16px; overflow:hidden; background:#ffffff;">
              <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; background:#f8f9fa; border-bottom:1px solid #dadce0;">
                <div style="font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:0.12em; color:#1c1d1f;">
                  ${escapeHtml_(bodega)}
                </div>

                <div style="font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:0.10em; color:#5f6368;">
                  Total: ${totalBodega.toLocaleString()} pzas
                </div>
              </div>

              <div style="overflow:auto;">
                <table style="width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed;">
                  <colgroup>
                    <col style="width:22%;">
                    <col style="width:20%;">
                    <col style="width:24%;">
                    <col style="width:20%;">
                    <col style="width:14%;">
                  </colgroup>

                  <thead>
                    <tr style="background:#ffffff;">
                      <th style="width:22%; padding:8px 10px; text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:#5f6368; border-bottom:1px solid #dadce0; white-space:nowrap;">Bodega</th>
                      <th style="width:20%; padding:8px 10px; text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:#5f6368; border-bottom:1px solid #dadce0; white-space:nowrap;">Ubicación</th>
                      <th style="width:24%; padding:8px 10px; text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:#5f6368; border-bottom:1px solid #dadce0; white-space:nowrap;">SKU</th>
                      <th style="width:20%; padding:8px 10px; text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:#5f6368; border-bottom:1px solid #dadce0; white-space:nowrap;">ID único</th>
                      <th style="width:14%; padding:8px 10px; text-align:right; font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:#5f6368; border-bottom:1px solid #dadce0; white-space:nowrap;">Cantidad</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${rowsHtml}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        }).join("");
      };

      const getInfoExcedentes = (item) => {
        const esIdUnico = item.modoBalanceActivo === "IDUNICO";

        if (!esIdUnico) {
          Swal.fire({
            title: "Información de Excedentes",
            html: `
              <div class="text-left text-sm space-y-4 p-1 text-slate-700">
                <p>
                  Existencias de excedentes para el SKU <strong>${escapeHtml_(item.codigo)}</strong>.
                </p>

                <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200/80 space-y-2">
                  <div class="flex justify-between font-medium">
                    <span>Negativo en Almacén Birlos:</span>
                    <span class="text-red-600 font-extrabold font-mono-premium">-${Number(item.deficit || 0).toLocaleString()} PZAS</span>
                  </div>

                  <div class="flex justify-between text-xs text-slate-500">
                    <span>Excedente en Bodega:</span>
                    <span class="font-bold font-mono-premium text-slate-700">${Number(item.excedenteBodegaActivo || 0).toLocaleString()} PZAS</span>
                  </div>

                  <div class="flex justify-between text-xs text-slate-500">
                    <span>Excedente en Casa Blanca:</span>
                    <span class="font-bold font-mono-premium text-slate-700">${Number(item.excedenteCasaBlancaActivo || 0).toLocaleString()} PZAS</span>
                  </div>

                  <div class="flex justify-between text-xs text-slate-500">
                    <span>Excedente total:</span>
                    <span class="font-bold font-mono-premium text-slate-900">${Number(item.sumaExcedente || 0).toLocaleString()} PZAS</span>
                  </div>
                </div>
              </div>
            `,
            background: "#ffffff",
            showCancelButton: false,
            confirmButtonColor: "#d93025",
            confirmButtonText: "Cerrar",
            customClass: {
              popup: "rounded-[1.5rem]"
            }
          });

          return;
        }

        Swal.fire({
          title: "Información de excedentes",
          html: `
            <div class="text-left text-sm space-y-4 p-1 text-slate-700">
              <p>
                Excedentes con saldo disponible para el SKU <strong>${escapeHtml_(item.codigo)}</strong>.
              </p>

              <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200/80 space-y-2">
                <div class="flex justify-between font-medium">
                  <span>Negativo en Almacén Birlos:</span>
                  <span class="text-red-600 font-extrabold font-mono-premium">-${Number(item.deficit || 0).toLocaleString()} PZAS</span>
                </div>

                <div class="flex justify-between text-xs text-slate-500">
                  <span>Excedente total:</span>
                  <span class="font-bold font-mono-premium text-slate-900">${Number(item.sumaExcedente || 0).toLocaleString()} PZAS</span>
                </div>
              </div>

              ${buildDetalleIdUnicoHtml_(item)}
            </div>
          `,
          background: "#ffffff",
          width: 900,
          showCancelButton: false,
          confirmButtonColor: "#d93025",
          confirmButtonText: "Cerrar",
          customClass: {
            popup: "rounded-[1.5rem]"
          }
        });
      };

      return (
          <div className="h-full w-full min-h-0 relative flex flex-col gap-4">
        
          {isFabMenuMounted && (
            <div
              className={`fixed inset-0 bg-slate-950/35 backdrop-blur-[1px] z-[40] transition-opacity duration-200 ${
                isFabClosing ? "opacity-0" : "opacity-100"
              }`}
              onMouseDown={(e) => {
                e.stopPropagation();
                cerrarFabMenu_();
              }}
            ></div>
          )}

          {/* Bloques de Métricos */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 shrink-0">
            <KPIBlock
              title="Sin excedente"
              value={metrics.negativosSinExcedentes}
              unit="SKUs"
              iconName="alert-triangle"
              indicatorColor="red"
              trend={{ text: "Conteo requerido", type: "negative" }}
            />

            <KPIBlock
              title="Cobertura parcial"
              value={metrics.negativosCoberturaParcial}
              unit="SKUs"
              iconName="box"
              indicatorColor="amber"
              trend={{ text: "No cubre déficit", type: "neutral" }}
            />

            <KPIBlock
              title="Cobertura completa"
              value={metrics.negativosCoberturaCompleta}
              unit="SKUs"
              iconName="shuffle"
              indicatorColor="emerald"
              trend={{ text: "Viable para revisar", type: "dark" }}
            />
          </div>

          <div className="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-2 shrink-0">
            {/* Filtros operativos */}
            <div className="flex flex-wrap items-center gap-2">
              {[
                  { id: 'ALL', label: 'Negativos', count: consolidadoNegativos.length },
                  { id: 'READY', label: 'Cobertura completa', count: consolidadoNegativos.filter(x => x.traspasoViable).length },
                  { id: 'PARTIAL', label: 'Cobertura parcial', count: consolidadoNegativos.filter(x => Number(x.sumaExcedente || 0) > 0 && Number(x.sumaExcedente || 0) < Number(x.deficit || 0)).length },
                  { id: 'NO_STOCK', label: 'Sin excedente', count: consolidadoNegativos.filter(x => Number(x.sumaExcedente || 0) === 0).length }
                ]
                  .map(btn => (
                <button
                  key={btn.id}
                  onClick={() => setFilterStatus(btn.id)}
                  className={`px-3 py-2 rounded-xl text-xs font-black uppercase tracking-wider transition-all duration-200 ${
                    filterStatus === btn.id
                      ? 'bg-[#d93025] text-white shadow-sm'
                      : 'bg-slate-50 text-slate-500 border border-[#dadce0] hover:bg-slate-100'
                  }`}
                >
                  {btn.label} ({btn.count})
                </button>
              ))}
            </div>

            {/* Segmentación / ordenamientos */}
            <div className="flex flex-wrap items-center gap-2 xl:justify-end">

              {/* BODEGA */}
              <div
                className="relative"
                onMouseEnter={() => openHoverMenu("BODEGA")}
                onMouseLeave={closeHoverMenuWithDelay}
              >
                <button
                  className={`px-4 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider transition-all duration-200 ${
                    filterBodega !== "TODAS"
                      ? 'bg-slate-900 text-white shadow-sm'
                      : 'bg-white text-slate-600 border border-[#dadce0] hover:bg-slate-50'
                  }`}
                >
                  {`Bodega: ${getBodegaLabel(filterBodega)}`}
                </button>

                {hoverMenu === "BODEGA" && (
                  <div
                    className="absolute top-full left-0 pt-2 w-56 z-50"
                    onMouseEnter={cancelCloseHoverMenu}
                    onMouseLeave={closeHoverMenuWithDelay}
                  >
                    <div className="bg-white border border-[#dadce0] rounded-2xl shadow-lg overflow-hidden">
                      {[
                        { key: "TODAS", label: "Todas" },
                        { key: "B1", label: "Bodega 1" },
                        { key: "B2", label: "Bodega 2" },
                        { key: "B3", label: "Bodega 3" },
                        { key: "CU", label: "Cuarto Alto Riesgo" },
                        { key: "MO", label: "Mostrador" },
                        { key: "SIN_UBICACION", label: "Sin ubicación" }
                      ].map((opt, index) => (
                        <button
                          key={opt.key}
                          onClick={() => {
                            setFilterBodega(opt.key);
                            setHoverMenu(null);
                          }}
                          className={`w-full text-left px-4 py-3 text-xs font-black uppercase tracking-wider text-slate-700 hover:bg-slate-50 ${
                            index > 0 ? 'border-t border-[#dadce0]' : ''
                          }`}
                        >
                          {opt.label}
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </div>

              {/* CÓDIGO */}
              <div
                className="relative"
                onMouseEnter={() => openHoverMenu("CODIGO")}
                onMouseLeave={closeHoverMenuWithDelay}
              >
                <button
                  className={`px-4 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider transition-all duration-200 ${
                    sortBy === "CODIGO_ASC" || sortBy === "CODIGO_DESC"
                      ? 'bg-slate-900 text-white shadow-sm'
                      : 'bg-white text-slate-600 border border-[#dadce0] hover:bg-slate-50'
                  }`}
                >
                  Código
                </button>

                {hoverMenu === "CODIGO" && (
                  <div
                    className="absolute top-full left-0 pt-2 w-44 z-50"
                    onMouseEnter={cancelCloseHoverMenu}
                    onMouseLeave={closeHoverMenuWithDelay}
                  >
                    <div className="bg-white border border-[#dadce0] rounded-2xl shadow-lg overflow-hidden">
                      <button
                        onClick={() => {
                          setSortBy("CODIGO_ASC");
                          setHoverMenu(null);
                        }}
                        className="w-full text-left px-4 py-3 text-xs font-black uppercase tracking-wider text-slate-700 hover:bg-slate-50"
                      >
                        Código A-Z
                      </button>

                      <button
                        onClick={() => {
                          setSortBy("CODIGO_DESC");
                          setHoverMenu(null);
                        }}
                        className="w-full text-left px-4 py-3 text-xs font-black uppercase tracking-wider text-slate-700 hover:bg-slate-50 border-t border-[#dadce0]"
                      >
                        Código Z-A
                      </button>
                    </div>
                  </div>
                )}
              </div>

              {/* UBICACIÓN */}
              <div
                className="relative"
                onMouseEnter={() => openHoverMenu("UBICACION")}
                onMouseLeave={closeHoverMenuWithDelay}
              >
                <button
                  className={`px-4 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider transition-all duration-200 ${
                    sortBy === "UBICACION_ASC" || sortBy === "UBICACION_DESC"
                      ? 'bg-slate-900 text-white shadow-sm'
                      : 'bg-white text-slate-600 border border-[#dadce0] hover:bg-slate-50'
                  }`}
                >
                  Ubicación
                </button>

                {hoverMenu === "UBICACION" && (
                  <div
                    className="absolute top-full left-0 pt-2 w-44 z-50"
                    onMouseEnter={cancelCloseHoverMenu}
                    onMouseLeave={closeHoverMenuWithDelay}
                  >
                    <div className="bg-white border border-[#dadce0] rounded-2xl shadow-lg overflow-hidden">
                      <button
                        onClick={() => {
                          setSortBy("UBICACION_ASC");
                          setHoverMenu(null);
                        }}
                        className="w-full text-left px-4 py-3 text-xs font-black uppercase tracking-wider text-slate-700 hover:bg-slate-50"
                      >
                        Ubicación A-Z
                      </button>

                      <button
                        onClick={() => {
                          setSortBy("UBICACION_DESC");
                          setHoverMenu(null);
                        }}
                        className="w-full text-left px-4 py-3 text-xs font-black uppercase tracking-wider text-slate-700 hover:bg-slate-50 border-t border-[#dadce0]"
                      >
                        Ubicación Z-A
                      </button>
                    </div>
                  </div>
                )}
              </div>

              {/* SIN ORDEN */}
              <button
                onClick={() => setSortBy("NONE")}
                className={`px-4 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider transition-all duration-200 ${
                  sortBy === "NONE"
                    ? 'bg-slate-200 text-slate-900 shadow-sm'
                    : 'bg-white text-slate-500 border border-[#dadce0] hover:bg-slate-50'
                }`}
              >
                Sin orden
              </button>
            </div>
          </div>

          {/* Tabla */}
          <div className="flex-1 min-h-0 bg-white border border-[#dadce0] rounded-[1.5rem] overflow-hidden shadow-sm">
            <div className="h-full overflow-auto custom-scroll">
              <table className="w-full text-left border-collapse">
                <thead className="bg-[#f8f9fa] border-b border-[#dadce0] sticky top-0 z-10">
                  <tr>
                    <th
                      style={{ fontSize: '20px' }}
                      className="px-8 py-2 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[22%]"
                    >
                      Identificación SKU
                    </th>

                    <th
                      style={{ fontSize: '20px' }}
                      className="px-6 py-2 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[18%]"
                    >
                      Ubicación Surtido
                    </th>

                    <th
                      style={{ fontSize: '20px' }}
                      className="px-6 py-2 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[22%]"
                    >
                      Matriz de Excedentes
                    </th>

                    <th
                      style={{ fontSize: '20px' }}
                      className="px-6 py-2 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[14%]"
                    >
                      Saldo piso de venta
                    </th>

                    <th
                      style={{ fontSize: '20px' }}
                      className="px-8 py-2 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[24%]"

                      Estatus
                    </th>

                <tbody className="divide-y divide-[#dadce0]">
                  {recordsFinal.map((item, idx) => (

                      className={`group hover:bg-slate-50/50 transition-colors cursor-pointer ${

                    >

                                  width: `${
                                    item.sumaExcedente > 0
                                      ? Math.min((item.excedenteCasaBlancaActivo / item.sumaExcedente) * 100, 100)
                                      : 0
                                  }%`
                                }}
                                className="h-full bg-slate-900 transition-all duration-500"
                                title="Casa Blanca"
                              ></div>
                            </div>

                            <div className="text-center">
                              <span className="text-[16px] font-extrabold text-slate-900">
                                Total: {item.sumaExcedente}
                              </span>
                            </div>

                            <div className="mt-1">
                              <span className="text-[10px] font-black uppercase tracking-wider text-slate-400">
                                Balance: {item.modoBalanceActivo === "IDUNICO" ? "ID único" : "Existencias"}
                              </span>
                            </div>
                          </div>
                        </div>
                      </td>

                      {/* Saldo piso de venta */}
                      <td className="px-6 py-8 text-center align-middle">
                        <div className="flex items-center justify-center h-full">
                          <span className="inline-flex items-center justify-center min-w-[110px] bg-red-50 border border-red-200 text-red-600 px-4 py-2 rounded-2xl font-black text-[24px] leading-none font-mono-premium red-pulse-badge">
                            {item.almacenbirlos}
                          </span>
                        </div>
                      </td>

                      {/* Estatus */}
                      <td className="px-8 py-8 text-center align-middle">
                        <div className="flex items-center justify-center h-full">
                          {item.traspasoViable ? (
                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                getInfoExcedentes(item);
                              }}
                              className="inline-flex items-center gap-2 px-5 py-3 bg-[#d93025] hover:bg-[#a50e0e] text-white rounded-xl text-[13px] font-black uppercase tracking-[0.08em] transition-all duration-200 active:scale-95 shadow-sm shadow-red-200"
                            >
                              <LocalIcon name="shuffle" size={14} />
                              Revisar Excedentes
                            </button>
                            ) : Number(item.sumaExcedente || 0) > 0 ? (
                              <button
                                onClick={(e) => {
                                  e.stopPropagation();
                                  getInfoExcedentes(item);
                                }}
                                className="inline-flex items-center gap-2 text-[13px] font-black uppercase tracking-[0.08em] text-amber-700 bg-amber-50 px-4 py-3 rounded-xl border border-amber-200 hover:bg-amber-100 transition-all duration-200 active:scale-95"
                              >
                                <LocalIcon name="alert-circle" size={14} className="text-amber-600" />
                                Cobertura Parcial
                              </button>
                            ) : (
                            <div className="inline-flex items-center gap-2 text-[13px] font-black uppercase tracking-[0.08em] text-slate-600 bg-slate-100 px-4 py-3 rounded-xl border border-slate-200">
                              <LocalIcon name="info" size={14} className="text-slate-500" />
                              Solicitar Conteo
                            </div>
                          )}
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>

              {recordsFinal.length === 0 && !loading && (
                <div className="p-20 text-center space-y-4">
                  <div className="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center mx-auto text-slate-400">
                    <LocalIcon name="search-slash" size={28} />
                  </div>
                  <div className="space-y-1">
                    <p className="text-slate-700 font-extrabold text-sm uppercase tracking-wider">
                      Sin registros coincidentes
                    </p>
                    <p className="text-slate-400 text-xs">
                      No se detectaron discrepancias para los criterios de filtrado seleccionados.
                    </p>
                  </div>
                </div>
              )}

              {loading && (
                <div className="p-28 flex flex-col items-center justify-center gap-4">
                  <div className="w-10 h-10 border-4 border-slate-100 border-t-[#d93025] rounded-full animate-spin"></div>
                  <span className="text-[10px] font-black tracking-widest text-slate-400 uppercase">
                    Extrayendo registros de existencias...
                  </span>
                </div>
              )}
            </div>
          </div>

          
            {/* MENÚ FLOTANTE GLOBALIZADO */}
            <div
              ref={fabContainerRef}
              className="app-fab-container z-[60]"
            >


            {isFabMenuMounted && isSearchExpanded && (
              <div className={`app-fab-row ${isSearchClosing || isFabClosing ? "app-fab-slide-right" : "app-fab-slide-left"}`}>
                <input
                  ref={searchInputRef}
                  autoFocus
                  type="text"
                  placeholder="Escribe un código, SKU o descripción..."
                  className="app-fab-search"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                />
              </div>
            )}

            {isFabMenuMounted && (
              <div className={`app-fab-stack ${isFabClosing ? "app-fab-out" : "app-fab-in"}`}>

                <div className="nb-fab-mode-panel">
                  <div className="nb-fab-mode-title">
                    Balance activo
                  </div>

                  <div className="nb-fab-mode-toggle">
                    <button
                      type="button"
                      className={`nb-fab-mode-btn ${
                        modoBalance === "EXISTENCIAS" ? "active-red" : "idle"
                      }`}
                      onClick={() => setModoBalance("EXISTENCIAS")}
                      title="Usar balance desde hoja EXISTENCIAS"
                    >
                      Existencias
                    </button>

                    <button
                      type="button"
                      className={`nb-fab-mode-btn ${
                        modoBalance === "IDUNICO" ? "active-dark" : "idle"
                      }`}
                      onClick={() => setModoBalance("IDUNICO")}
                      title="Usar balance calculado por ID único"
                    >
                      ID único
                    </button>
                  </div>
                </div>

                <button
                  type="button"
                  className={`app-fab-action ${isSearchExpanded ? "dark" : ""}`}
                  title={isSearchExpanded ? "Cerrar buscador" : "Buscar material"}
                  onClick={toggleBuscador_}
                >
                  <LocalIcon name={isSearchExpanded ? "x" : "search"} size={24} />
                </button>

                <button
                  type="button"
                  className="app-fab-action"
                  title="Actualizar tabla"
                  onClick={() => fetchDatabase("manual")}
                  disabled={loading}
                >
                  <LocalIcon
                    name="refresh-cw"
                    size={24}
                    className={loading ? "text-[#d93025] animate-spin" : ""}
                  />
                </button>

                <button
                  type="button"
                  className="app-fab-action primary relative"
                  onClick={() => {
                    abrirPanelExportacion();
                    cerrarFabMenu_();
                  }}
                  aria-controls="panelExportarNegativos"
                  disabled={loading || consolidadoNegativos.length === 0}
                  title="Abrir panel de exportación"
                >
                  <LocalIcon name="file-spreadsheet" size={24} />

                  <span className="badge-exportar-flotante">
                    {consolidadoNegativos.length > 99 ? "99+" : consolidadoNegativos.length}
                  </span>
                </button>

              </div>
            )}

              <button
                type="button"
                className={`app-fab-main ${isFabMenuOpen ? "open" : ""} relative`}
                title={
                  isFabMenuOpen
                    ? "Cerrar acciones"
                    : `Abrir acciones • Balance: ${modoBalance === "IDUNICO" ? "ID único" : "Existencias"}`
                }
                onClick={(e) => {
                  e.stopPropagation();
                  toggleFabMenu_();
                }}
              >

              <LocalIcon name={isFabMenuOpen ? "x" : "ellipsis-vertical"} size={26} />

              {!isFabMenuOpen && (
                <span className="badge-exportar-flotante">
                  {modoBalance === "IDUNICO" ? "ID" : "EX"}
                </span>
              )}
            </button>

          </div>

          {/* OFFCANVAS EXPORTACIÓN */}
          <div
            className="offcanvas offcanvas-end"
            tabIndex="-1"
            id="panelExportarNegativos"
            aria-labelledby="panelExportarNegativosLabel"
          >
            <div className="offcanvas-header offcanvas-export-header">
              <div>
                <h5 id="panelExportarNegativosLabel" className="mb-1 fw-bold">
                  Exportación de Excel
                </h5>
                <p className="mb-0 text-muted" style={{ fontSize: "13px" }}>
                  Descarga el dataset completo de negativos consolidados.
                </p>
              </div>

              <button
                type="button"
                className="btn-close text-reset"
                data-bs-dismiss="offcanvas"
                aria-label="Cerrar"
              ></button>
            </div>

            <div className="offcanvas-body d-flex flex-column gap-3">
              <div className="kpi-export-panel">
                <div className="d-flex align-items-center justify-content-between">
                  <div>
                    <div
                      className="text-uppercase fw-bold text-muted"
                      style={{ fontSize: "11px", letterSpacing: "0.08em" }}
                    >
                      Registros disponibles
                    </div>
                    <div
                      style={{
                        fontSize: "32px",
                        fontWeight: 900,
                        color: "#1c1d1f",
                        lineHeight: 1
                      }}
                    >
                      {consolidadoNegativos.length.toLocaleString()}
                    </div>
                  </div>

                  <div
                    className="d-flex align-items-center justify-content-center rounded-4 border"
                    style={{
                      width: "56px",
                      height: "56px",
                      background: "#fff",
                      borderColor: "#dadce0"
                    }}
                  >
                    <LocalIcon name="database" size={26} className="text-slate-700" />
                  </div>
                </div>
              </div>

              <div className="kpi-export-panel">
                <div
                  className="text-uppercase fw-bold text-muted mb-2"
                  style={{ fontSize: "11px", letterSpacing: "0.08em" }}
                >
                  Se exportarán estas columnas
                </div>

                <ul
                  className="mb-0 ps-3"
                  style={{ fontSize: "13px", color: "#334155", lineHeight: 1.7 }}
                >
                  <li>Código</li>
                  <li>Descripción</li>
                  <li>Ubicación Surtido</li>
                  <li>Bodega / Zona</li>
                  <li>Saldo Piso Venta</li>
                  <li>Modo balance activo</li>
                  <li>Excedente Bodega activo</li>
                  <li>Excedente Casa Blanca activo</li>
                  <li>Excedente Total activo</li>
                  <li>Balance Existencias</li>
                  <li>Balance ID único</li>
                  <li>Estatus técnico</li>
                </ul>
              </div>

              <button
                type="button"
                className="btn-exportar-panel mt-auto"
                onClick={exportarExcelCompleto}
                disabled={loading || consolidadoNegativos.length === 0}
                data-bs-dismiss="offcanvas"
              >
                Exportar Excel
              </button>
            </div>
          </div>
        </div>
      );
    };

    // =========================================================
    // CONTRATO CON EL SHELL
    // =========================================================
    const targetElement = document.getElementById('render-negativos-birlos');

    if (!targetElement) {
      notify_(
        "No se encontró el contenedor principal de la vista de negativos.",
        "error",
        4200,
        {
          title: "Error de interfaz",
          sound: true
        }
      );
      console.warn("⚠️ [NegativosBirlos] No se encontró #render-negativos-birlos");
      return;
    }

    const yaInicializado = targetElement.dataset.nbMounted === "1";

    if (window.__NEGATIVOS_BIRLOS_ROOT__) {
      try {
        window.__NEGATIVOS_BIRLOS_ROOT__.unmount();
      } catch (e) {
        console.warn("⚠️ Instancia previa retenida en memoria, liberando recursos:", e);
        notifyOnceShell_(
          "negativos-root-previo",
          "Se liberó una instancia previa de la vista de negativos.",
          "warning",
          1600,
          {
            title: "Reinicialización",
            sound: false
          },
          10000
        );
      }
      window.__NEGATIVOS_BIRLOS_ROOT__ = null;
    }

    try {
      targetElement.dataset.nbMounted = "1";
      window.__NEGATIVOS_BIRLOS_ROOT__ = ReactDOM.createRoot(targetElement);
      window.__NEGATIVOS_BIRLOS_ROOT__.render(<NegativosBirlosDashboard />);

      if (!yaInicializado) {
        notifyOnceShell_(
          "negativos-vista-montada",
          "Vista de negativos lista para operar.",
          "success",
          1500,
          {
            title: "Vista cargada",
            sound: false
          },
          12000
        );
      }
    } catch (e) {
      console.error("❌ [NegativosBirlos] Error montando root React:", e);
      notify_(
        "Ocurrió un error al montar la vista de negativos.",
        "error",
        4200,
        {
          title: "Error de montaje",
          sound: true
        }
      );
    }
  };

  window.initVista = window.cargar_NegativosBirlos;
  console.log("🧩 [NegativosBirlos] Vista inyectable inicializada y registrada.");
</script>
