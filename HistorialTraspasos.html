<script>/** HistorialTraspasos.html */</script>

<button class="btn-filtros-flotante" type="button" data-bs-toggle="offcanvas" data-bs-target="#panelFiltros">
  <span class="material-icons">filter_list</span>
</button>

<?!= HtmlService.createHtmlOutputFromFile('FiltroLateral').getContent(); ?>

<div class="container">
  <div id="listaHistorial">
    <p style="text-align:center; color: #666;">Cargando información...</p>
  </div>
</div>

<div id="snackbar"></div>

<script>
(function () {
  // =========================================================
  // ESTADO SEGURO DE LA VISTA
  // =========================================================
  window.HistorialTraspasosState = window.HistorialTraspasosState || {
    snackbarTimer: null,
    datosOriginales: [],
    bootstrap: {
      usuarios: [],
      solicitantes: [],
      responsables: [],
      bodegas: [],
      ubicaciones: []
    },
    opciones: {
      solicitanteHTML: '<option value="">Seleccionar...</option>',
      responsableHTML: '<option value="">Seleccionar...</option>',
      bodegasHTML: '<option value="">Seleccionar...</option>',
      ubicacionesHTML: '<option value="">Seleccionar...</option>'
    }
  };

  const state = window.HistorialTraspasosState;

  // =========================================================
  // HELPERS INTERNOS
  // =========================================================
  function normalizarTexto(valor) {
    return String(valor || "").trim().toUpperCase();
  }

  function lanzarNotificacionLocal(mensaje, tipo = 'success') {
    if (typeof window.notificar === 'function') {
      window.notificar(mensaje, tipo);
      return;
    }

    const el = document.getElementById("snackbar");
    if (!el) return;

    clearTimeout(state.snackbarTimer);

    el.innerText = mensaje;
    el.className = `show ${tipo}`;

    const cerrar = () => {
      el.classList.remove("show");
      state.snackbarTimer = setTimeout(() => {
        el.className = "";
      }, 400);
    };

    state.snackbarTimer = setTimeout(cerrar, 3000);
    el.onclick = cerrar;
  }

  function inyectarSeleccion(html, valor) {
    if (!valor) return html;
    const buscar = `value="${valor}"`;
    return html.replace(buscar, `${buscar} selected`);
  }

  function cacheHistorialDisponible_(cache) {
    if (!cache) return false;

    const usuariosOk = Array.isArray(cache.usuarios) && cache.usuarios.length > 0;
    const bodegasOk = Array.isArray(cache.bodegas) && cache.bodegas.length > 0;
    const ubicacionesOk =
      (Array.isArray(cache.mapaUbicacionesExcedentes) && cache.mapaUbicacionesExcedentes.length > 0) ||
      (Array.isArray(cache.mapaUbicaciones) && cache.mapaUbicaciones.length > 0);

    return usuariosOk && bodegasOk && ubicacionesOk;
  }

  function construirBootstrapDesdeCache_(cache) {
    const usuarios = (cache.usuarios || []).map(u => ({
      idusuario: u.idusuario || "",
      nombre: normalizarTexto(u.nombre),
      rol: normalizarTexto(u.rol)
    }));

    const solicitantes = [...new Set(usuarios.map(u => u.nombre).filter(Boolean))].sort();

    const responsables = [...new Set(
      usuarios
        .filter(u => u.rol === "RESPONSABLE" || u.rol === "ADMIN")
        .map(u => u.nombre)
        .filter(Boolean)
    )].sort();

    const bodegasBase = (cache.bodegas || []).map(b => normalizarTexto(b)).filter(Boolean);
    const bodegas = [...new Set(["1 - ALMACEN BIRLOS", ...bodegasBase])].sort();

    const mapaUbis = cache.mapaUbicacionesExcedentes || cache.mapaUbicaciones || [];
    const ubicaciones = [...new Set(
      mapaUbis
        .map(m => normalizarTexto(m.ubi || m.ubicacion || m))
        .filter(Boolean)
    )].sort();

    return {
      usuarios,
      solicitantes,
      responsables,
      bodegas,
      ubicaciones
    };
  }

  function hidratarBootstrap_(bootstrap) {
    state.bootstrap = {
      usuarios: bootstrap.usuarios || [],
      solicitantes: bootstrap.solicitantes || [],
      responsables: bootstrap.responsables || [],
      bodegas: bootstrap.bodegas || [],
      ubicaciones: bootstrap.ubicaciones || []
    };

    state.opciones.solicitanteHTML =
      '<option value="">Seleccionar...</option>' +
      state.bootstrap.solicitantes
        .map(v => `<option value="${v}">${v}</option>`)
        .join('');

    state.opciones.responsableHTML =
      '<option value="">Seleccionar...</option>' +
      state.bootstrap.responsables
        .map(v => `<option value="${v}">${v}</option>`)
        .join('');

    state.opciones.bodegasHTML =
      '<option value="">Seleccionar...</option>' +
      state.bootstrap.bodegas
        .map(v => `<option value="${v}">${v}</option>`)
        .join('');

    state.opciones.ubicacionesHTML =
      '<option value="">Seleccionar...</option>' +
      state.bootstrap.ubicaciones
        .map(v => `<option value="${v}">${v}</option>`)
        .join('');
  }

  function guardarBootstrapEnCacheGlobal_() {
    window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || {};
    window.DATA_ALMACEN_CACHE.historialTraspasosBootstrap = state.bootstrap;
  }

  function actualizarDatalists(datos) {
    if (!datos || !datos.length) return;

    const mapeoFiltros = {
      'listaTipos': 'tipo',
      'listaCodigos': 'codigo',
      'listaSolicitantes': 'solicitante',
      'listaResponsables': 'responsable',
      'listaFolios': 'folio',
      'listaSeries': 'serie'
    };

    Object.entries(mapeoFiltros).forEach(([id, propiedad]) => {
      const valores = [...new Set(datos.map(item => item[propiedad]))];
      renderizarOpcionesDatalist(id, valores);
    });

    const almacenes = [...new Set([
      ...datos.map(item => item.origen),
      ...datos.map(item => item.destino),
      "1 - ALMACEN BIRLOS"
    ])];

    renderizarOpcionesDatalist('listaAlmacenes', almacenes);
  }

  function renderizarOpcionesDatalist(idElemento, valores) {
    const lista = document.getElementById(idElemento);
    if (!lista) return;

    const fragmento = document.createDocumentFragment();

    valores
      .filter(v => v && v !== '---' && v !== '')
      .sort((a, b) => String(a).localeCompare(String(b), 'es', { numeric: true, sensitivity: 'base' }))
      .forEach(val => {
        const opt = document.createElement('option');
        opt.value = val;
        fragmento.appendChild(opt);
      });

    lista.innerHTML = "";
    lista.appendChild(fragmento);
  }

  function cargarHistorial() {
    const contenedor = document.getElementById('listaHistorial');
    if (!contenedor) return;

    google.script.run
      .withSuccessHandler(function (datos) {
        console.log("📚 [Historial] Registros recibidos:", datos);

        if (!datos || datos.length === 0) {
          state.datosOriginales = [];
          contenedor.innerHTML = '<div class="alert alert-warning text-center">No hay registros disponibles.</div>';
          return;
        }

        state.datosOriginales = datos;
        renderizarHistorial(datos);
        actualizarDatalists(datos);
      })
      .withFailureHandler(err => {
        console.error("❌ [Historial] Error al cargar registros:", err);
        contenedor.innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
      })
      .HistorialTraspasosController_obtenerRegistros();
  }

  function renderizarHistorial(registros) {
    const contenedor = document.getElementById('listaHistorial');
    if (!contenedor) return;

    if (!registros || registros.length === 0) {
      contenedor.innerHTML = '<div class="alert alert-warning text-center">No hay registros que coincidan con los filtros.</div>';
      return;
    }

    const registrosOrdenados = [...registros].sort((a, b) => {
      const [dA, mA, yA] = (a.fecha || "01/01/2000").split('/');
      const [dB, mB, yB] = (b.fecha || "01/01/2000").split('/');
      const fechaA = new Date(yA, mA - 1, dA);
      const fechaB = new Date(yB, mB - 1, dB);

      if (fechaA > fechaB) return -1;
      if (fechaA < fechaB) return 1;

      const horaA = a.hora || "00:00";
      const horaB = b.hora || "00:00";
      return horaB.localeCompare(horaA);
    });

    const fragmento = document.createDocumentFragment();
    let ultimaBodegaHeader = "";

    registrosOrdenados.forEach(item => {
      const bodegaReferencia = item.tipo === "Acomodo"
        ? item.destino
        : (item.origen || "GENERAL");

      if (bodegaReferencia !== ultimaBodegaHeader) {
        ultimaBodegaHeader = bodegaReferencia;

        const sep = document.createElement('div');
        sep.className = 'separador-bodega-segmentada';
        sep.style = "background-color: #e9ecef;padding: 12px; margin: 25px 0 10px 0; border-left: 6px solid #d93025; font-weight: bold; display: flex; align-items: center; gap: 10px; border-radius: 4px; position: sticky; top: 0; z-index: 10; color: #333;";
        sep.innerHTML = `<span class="material-icons">warehouse</span> ${String(bodegaReferencia).toUpperCase()}`;
        fragmento.appendChild(sep);
      }

      const opcionesOrigen = inyectarSeleccion(state.opciones.bodegasHTML, item.origen);
      const opcionesDestino = inyectarSeleccion(state.opciones.bodegasHTML, item.destino);
      const opcionesResp = inyectarSeleccion(state.opciones.responsableHTML, item.responsable);
      const opcionesSerie = inyectarSeleccion(state.opciones.ubicacionesHTML, item.serie);
      const opcionesSol = inyectarSeleccion(state.opciones.solicitanteHTML, item.solicitante);

      const card = document.createElement('div');
      card.className = 'historial-card-pendiente';
      card.innerHTML = `
        <div class="columnatiposerie">
          <div class="titulotiposerietraspaso">Tipo</div>
          <div class="itemtipotraspaso">${item.tipo}</div>

          <div class="titulotiposerietraspaso">Serie</div>
          <div class="itemserietraspaso">
            <span id="serie_texto_${item.fila}"><span class="material-icons">label</span>${item.serie || '---'}</span>
            <select id="serie_input_${item.fila}" style="display:none; width:90%;" class="form-select form-select-sm">${opcionesSerie}</select>
          </div>
        </div>

        <div class="columnacodigodescripcion">
          <div class="itemcodigotraspaso">${item.codigo}</div>
          <div class="itemdescripciontraspaso">${item.descripcion}</div>
        </div>

        <div class="cuadrodatostraspaso">
          <div class="cuadrantecuadrodatostraspaso">
            <div class="tituloscuadrodatostraspaso">Salida:</div>
            <div class="itemcuadrodatostraspaso">
              <span id="origen_texto_${item.fila}">${item.origen}</span>
              <select id="origen_input_${item.fila}" style="display:none;" class="form-select form-select-sm">${opcionesOrigen}</select>
            </div>
          </div>

          <div class="cuadrantecuadrodatostraspaso">
            <div class="tituloscuadrodatostraspaso">Entrada:</div>
            <div class="itemcuadrodatostraspaso">
              <span id="destino_texto_${item.fila}">${item.destino}</span>
              <select id="destino_input_${item.fila}" style="display:none;" class="form-select form-select-sm">${opcionesDestino}</select>
            </div>
          </div>

          <div class="cuadrantecuadrodatostraspaso">
            <div class="tituloscuadrodatostraspaso">Cant:</div>
            <div class="itemcuadrocantidadtraspaso">
              <span id="cant_texto_${item.fila}">${Math.abs(Number(item.cantidad || 0))}</span>
              <input type="number" id="cant_input_${item.fila}" value="${Math.abs(Number(item.cantidad || 0))}" style="display:none; width:60px;" class="form-control form-control-sm">
            </div>
          </div>

          <div class="cuadrantecuadrodatostraspaso">
            <div class="tituloscuadrodatostraspaso">Solicita:</div>
            <div class="itemcuadrocantidadtraspaso">
              <span id="solicitante_texto_${item.fila}">${item.solicitante}</span>
              <select id="solicitante_input_${item.fila}" style="display:none; width:100%;" class="form-select form-select-sm">${opcionesSol}</select>
            </div>
          </div>
        </div>

        <div class="columnafecharesponsablefolio">
          <div class="titulofecharesponsablefolio">Procesado por:</div>
          <div class="itemfechahoraresponsablefolio">
            <span class="material-icons" style="font-size:14px;">person</span>
            <span id="resp_texto_${item.fila}">${item.responsable || 'Sin asignar'}</span>
            <select id="resp_input_${item.fila}" style="display:none; width:100%;" class="form-select form-select-sm">${opcionesResp}</select>
          </div>

          <div class="titulofecharesponsablefolio">Folio sistema:</div>
          <div class="itemfecharesponsablefolio">
            <span class="material-icons" style="font-size:14px;">tag</span>
            <span id="folio_texto_${item.fila}">${item.folio || ''}</span>
            <input type="text" id="folio_input_${item.fila}" value="${item.folio || ''}" style="display:none; width:80px;" class="input-edicion-historial">
          </div>

          <div class="titulofecharesponsablefolio">Fecha:</div>
          <div class="itemfecharesponsablefolio">
            <span class="material-icons" style="font-size:14px;">calendar_today</span>
            <span id="fecha_texto_${item.fila}">${item.fecha || '---'}</span>
          </div>

          <div class="titulofecharesponsablefolio">Hora:</div>
          <div class="itemfecharesponsablefolio">
            <span class="material-icons" style="font-size:14px;">schedule</span>
            <span id="hora_texto_${item.fila}">${item.hora || '---'}</span>
          </div>
        </div>

        <div class="columna-acciones-historial">
          <button type="button" onclick="activarEdicion(this, ${item.fila})" class="btn-icono-historial btn-editar">
            <span class="material-icons">edit</span>
          </button>
          <button type="button" id="btn_guardar_${item.fila}" onclick="guardarEdicion(this, ${item.fila})" class="btn-icono-historial btn-guardar" style="display:none;">
            <span class="material-icons">check_circle</span>
          </button>
        </div>
      `;

      fragmento.appendChild(card);
    });

    contenedor.innerHTML = '';
    contenedor.appendChild(fragmento);
  }

  function preservarSignoLocal_(fila, nuevaCantidadPositiva) {
    const idx = state.datosOriginales.findIndex(i => i.fila == fila);
    if (idx === -1) return nuevaCantidadPositiva;

    const original = Number(state.datosOriginales[idx].cantidad || 0);
    return original < 0 ? -Math.abs(Number(nuevaCantidadPositiva || 0)) : Math.abs(Number(nuevaCantidadPositiva || 0));
  }

  function actualizarInterfazTrasGuardar(numFila, datos, botonGuardar) {
    const idx = state.datosOriginales.findIndex(i => i.fila == numFila);

    const cantidadConSigno = preservarSignoLocal_(numFila, datos.cantidad);

    if (idx !== -1) {
      state.datosOriginales[idx] = {
        ...state.datosOriginales[idx],
        folio: datos.folio,
        responsable: datos.responsable,
        origen: datos.origen,
        destino: datos.destino,
        cantidad: cantidadConSigno,
        serie: datos.serie,
        solicitante: datos.solicitante
      };
    }

    document.getElementById(`folio_texto_${numFila}`).innerText = datos.folio;
    document.getElementById(`resp_texto_${numFila}`).innerText = datos.responsable;
    document.getElementById(`origen_texto_${numFila}`).innerText = datos.origen;
    document.getElementById(`destino_texto_${numFila}`).innerText = datos.destino;
    document.getElementById(`cant_texto_${numFila}`).innerText = Math.abs(Number(datos.cantidad || 0));
    document.getElementById(`serie_texto_${numFila}`).innerHTML = `<span class="material-icons">label</span>${datos.serie}`;
    document.getElementById(`solicitante_texto_${numFila}`).innerText = datos.solicitante;

    const campos = ['folio', 'resp', 'origen', 'destino', 'cant', 'serie', 'solicitante'];
    campos.forEach(c => {
      document.getElementById(`${c}_texto_${numFila}`).style.display = 'inline';
      document.getElementById(`${c}_input_${numFila}`).style.display = 'none';
    });

    botonGuardar.style.display = 'none';
    botonGuardar.disabled = false;
    botonGuardar.innerHTML = '<span class="material-icons">check_circle</span>';

    const btnEditar = botonGuardar.parentElement.querySelector('.btn-editar');
    if (btnEditar) btnEditar.style.display = 'block';
  }

  // =========================================================
  // EDICIÓN
  // =========================================================
  window.activarEdicion = function (boton, numFila) {
    const campos = ['folio', 'resp', 'origen', 'destino', 'cant', 'serie', 'solicitante'];

    campos.forEach(c => {
      const texto = document.getElementById(`${c}_texto_${numFila}`);
      const input = document.getElementById(`${c}_input_${numFila}`);

      if (texto) texto.style.display = 'none';
      if (input) input.style.display = 'block';
    });

    boton.style.display = 'none';

    const btnGuardar = document.getElementById(`btn_guardar_${numFila}`);
    if (btnGuardar) btnGuardar.style.display = 'block';

    lanzarNotificacionLocal("✏️ Modo edición activado", "info");
  };

  window.guardarEdicion = function (botonGuardar, numFila) {
    const datos = {
      folio: document.getElementById(`folio_input_${numFila}`)?.value || "",
      responsable: document.getElementById(`resp_input_${numFila}`)?.value || "",
      origen: document.getElementById(`origen_input_${numFila}`)?.value || "",
      destino: document.getElementById(`destino_input_${numFila}`)?.value || "",
      cantidad: document.getElementById(`cant_input_${numFila}`)?.value || "",
      serie: document.getElementById(`serie_input_${numFila}`)?.value || "",
      solicitante: document.getElementById(`solicitante_input_${numFila}`)?.value || ""
    };

    botonGuardar.disabled = true;
    botonGuardar.innerHTML = '<span class="material-icons">sync</span>';
    lanzarNotificacionLocal("⏳ Procesando cambios...", "info");

    google.script.run
      .withSuccessHandler(() => {
        lanzarNotificacionLocal("✅ Registro actualizado", "success");
        actualizarInterfazTrasGuardar(numFila, datos, botonGuardar);
      })
      .withFailureHandler((err) => {
        lanzarNotificacionLocal(`❌ Error: ${err.message}`, "error");
        botonGuardar.disabled = false;
        botonGuardar.innerHTML = '<span class="material-icons">check_circle</span>';
      })
      .HistorialTraspasosController_actualizarRegistro(numFila, datos);
  };

  // =========================================================
  // FILTROS
  // =========================================================
  window.aplicarFiltros = function () {
    const fFecha = document.getElementById('filterFecha')?.value || "";
    const fTipo = normalizarTexto(document.getElementById('filterTipo')?.value || "");
    const fCodigo = normalizarTexto(document.getElementById('filterCodigo')?.value || "");
    const fAlmacen = normalizarTexto(document.getElementById('filterAlmacen')?.value || "");
    const fSolicitante = normalizarTexto(document.getElementById('filterSolicitante')?.value || "");
    const fResponsable = normalizarTexto(document.getElementById('filterResponsable')?.value || "");
    const fFolio = normalizarTexto(document.getElementById('filterFolio')?.value || "");

    const resultados = state.datosOriginales.filter(item => {
      let fechaItemComp = "";
      if (item.fecha && item.fecha.includes('/')) {
        const partes = item.fecha.split('/');
        fechaItemComp = `${partes[2]}-${partes[1]}-${partes[0]}`;
      }

      return (
        (!fFecha || fechaItemComp === fFecha) &&
        (!fTipo || normalizarTexto(item.tipo).includes(fTipo)) &&
        (!fCodigo || normalizarTexto(item.codigo).includes(fCodigo)) &&
        (!fSolicitante || normalizarTexto(item.solicitante).includes(fSolicitante)) &&
        (!fResponsable || normalizarTexto(item.responsable).includes(fResponsable)) &&
        (!fFolio || normalizarTexto(item.folio).includes(fFolio)) &&
        (!fAlmacen || normalizarTexto(item.origen).includes(fAlmacen) || normalizarTexto(item.destino).includes(fAlmacen))
      );
    });

    renderizarHistorial(resultados);
  };

  window.limpiarFiltros = function () {
    const ids = ['filterFecha', 'filterTipo', 'filterCodigo', 'filterAlmacen', 'filterSolicitante', 'filterResponsable', 'filterFolio'];
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = "";
    });

    renderizarHistorial(state.datosOriginales);
    lanzarNotificacionLocal("🧹 Filtros limpiados", "info");
  };

  // =========================================================
  // INIT DE VISTA
  // =========================================================
  window.inicializarVistaHistorialTraspasos = function () {
    console.log("📚 [Historial] Inicializando vista...");

    const contenedor = document.getElementById('listaHistorial');
    if (!contenedor) return;

    const cacheBootstrap = window.DATA_ALMACEN_CACHE?.historialTraspasosBootstrap || null;

    // 1) Bootstrap desde cache dedicado
    if (cacheBootstrap) {
      console.log("⚡ [Historial] Cargando bootstrap desde cache dedicado...");
      hidratarBootstrap_(cacheBootstrap);
      cargarHistorial();
      return;
    }

    // 2) Bootstrap derivado desde cache global si existe suficiente data
    if (cacheHistorialDisponible_(window.DATA_ALMACEN_CACHE)) {
      console.log("⚡ [Historial] Construyendo bootstrap desde DATA_ALMACEN_CACHE...");
      const bootstrapDerivado = construirBootstrapDesdeCache_(window.DATA_ALMACEN_CACHE);
      hidratarBootstrap_(bootstrapDerivado);
      guardarBootstrapEnCacheGlobal_();
      cargarHistorial();
      return;
    }

    // 3) Fallback al controller nuevo
    console.warn("⚠️ [Historial] Solicitando bootstrap específico...");

    google.script.run
      .withSuccessHandler(function (bootstrap) {
        console.log("✅ [Historial] Bootstrap recibido:", bootstrap);
        hidratarBootstrap_(bootstrap);
        guardarBootstrapEnCacheGlobal_();
        cargarHistorial();
      })
      .withFailureHandler(function (error) {
        console.error("❌ [Historial] Error al inicializar:", error);
        contenedor.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
      })
      .HistorialTraspasosController_getBootstrap();
  };

  window.initVista = window.inicializarVistaHistorialTraspasos;
  console.log("🧩 [Historial] initVista definida:", typeof window.initVista);

})();
</script>
