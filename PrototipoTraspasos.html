                                <span className="text-[12px] font-black text-amber-950 uppercase tracking-[0.16em] leading-tight">
                                  Se actualizará la etiqueta vigente
                                </span>

                                <span className="text-[13px] font-semibold text-amber-900 mt-1 leading-snug tracking-[0.02em]">
                                  El excedente conservará el mismo Identificador con un saldo menor.
                                </span>

                                <div className="mt-2 flex items-end justify-between gap-3">
                                  <div className="flex flex-col min-w-0">
                                    <span className="text-[11px] font-black text-amber-800 uppercase tracking-[0.12em] whitespace-nowrap">
                                      Saldo posterior
                                    </span>
                                    <span className="text-[10px] text-amber-700 font-semibold uppercase tracking-[0.08em] mt-0.5 leading-tight">
                                      Se conservará el mismo identificador
                                    </span>
                                  </div>

                                  <div className="text-right shrink-0">
                                    <span className="text-[22px] font-black text-amber-950 font-mono tracking-[0.04em] leading-none">
                                      {Math.round( ( Number(form.idSeleccionado.balance || 0) - Number(form.cantidad || 0) + Number.EPSILON ) * 100 ) / 100}
                                    </span>
                                    <div className="text-[11px] text-amber-900 font-black uppercase tracking-[0.14em] mt-0.5">
                                      Pzas
                                    </div>
                                  </div>
                                </div>
                              </div>
                            </div>
                          </div>
                        )}

                      {/* Botón añadir */}
                      <button
                        type="submit"
                        disabled={cargando || procesando || !foliosListos}
                        className="w-full bg-[#d93025] hover:bg-[#a50e0e] text-white py-4 rounded-xl font-black uppercase text-[16px] tracking-[0.18em] shadow-lg shadow-red-100 transition-all flex items-center justify-center gap-3 disabled:opacity-50 disabled:pointer-events-none"
                      >
                        <LocalIcon name="plus" size={25} />

                        {!foliosListos
                          ? "Esperando folios..."
                          : "Añadir a fila"}
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>

            {/* TABLA DE RESULTADOS */}
            <div className="proto-right-panel min-w-0 proto-results-shell">

              <div className="proto-results-toolbar bg-white border-b border-gray-200 px-4 py-4 flex items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <div className="w-11 h-11 rounded-2xl bg-[#1c1d1f] text-white flex items-center justify-center shadow-md">
                    <LocalIcon name="list-checks" size={22} />
                  </div>

                  <div className="flex flex-col">
                    <span className="text-[11px] font-black uppercase tracking-[0.22em] text-gray-400">
                      Fila de movimientos
                    </span>
                    <span className="text-[15px] font-black uppercase tracking-[0.08em] text-gray-900">
                      {resumenCola.total} {resumenCola.total === 1 ? 'elemento añadido' : 'elementos añadidos'}
                    </span>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <div className="px-3 py-2 rounded-xl bg-emerald-50 border border-emerald-100 text-emerald-700">
                    <span className="block text-[10px] font-black uppercase tracking-[0.16em]">
                      Acomodo
                    </span>
                    <span className="block text-[18px] font-black font-mono leading-none">
                      {resumenCola.acomodos}
                    </span>
                  </div>

                  <div className="px-3 py-2 rounded-xl bg-red-50 border border-red-100 text-red-700">
                    <span className="block text-[10px] font-black uppercase tracking-[0.16em]">
                      Surtido
                    </span>
                    <span className="block text-[18px] font-black font-mono leading-none">
                      {resumenCola.surtidos}
                    </span>
                  </div>
                </div>
              </div>

              <div className="proto-table-scroll custom-scroll-container">
                <table className="proto-results-table">
                  <thead className="proto-results-head">
                    <tr>
                      <th className="text-center">
                        SKU / Folio
                      </th>
                      <th className="text-center">
                        Tipo
                      </th>
                      <th className="text-center">
                        Bodega / Ubicación
                      </th>
                      <th className="text-center">
                        Cantidad
                      </th>
                      <th className="text-center">
                        Acción
                      </th>
                    </tr>
                  </thead>

                  <tbody>
                    {cola.map(item => (
                      <tr key={item.id} className="proto-results-row fade-in">
                        <td className="text-left">
                          <div className="flex flex-col">
                            <span className="proto-folio-main">{item.codigo}</span>
                            <span className="proto-folio-sub">
                              SKU: {item.sku}
                            </span>
                            <span className="proto-folio-desc">
                              {item.descripcion || 'SIN DESCRIPCIÓN'}
                            </span>
                          </div>
                        </td>

                        <td className="text-center">
                          <span className={`proto-type-chip ${
                            item.tipo === 'Acomodo'
                              ? 'proto-type-chip-acomodo'
                              : 'proto-type-chip-surtido'
                          }`}>
                            {item.tipo}
                          </span>
                        </td>

                        <td className="text-center">
                          <div className="proto-location-block">
                            <span className="proto-location-main">
                              {item.bodega || 'SIN BODEGA'}
                            </span>
                            <span className="proto-location-sub">
                              {item.ubicacion || 'SIN UBICACIÓN'}
                            </span>
                          </div>
                        </td>

                        <td className="text-center">
                          <span className="proto-qty-pill">
                            {item.cantidad}
                          </span>
                        </td>

                        <td className="text-center">
                          <button
                            type="button"
                            onClick={() => {
                              setCola(prev => prev.filter(c => c.id !== item.id));
                              notify_("Movimiento removido de la fila.", "warning", 1400, {
                                title: "Elemento removido",
                                sound: false
                              });
                              enfocarQR();
                            }}
                            className="proto-delete-btn"
                            title="Quitar de la fila"
                          >
                            <LocalIcon name="trash-2" size={16} />
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>

                {cola.length === 0 && (
                  <div className="proto-empty-state">
                    <LocalIcon name="package" size={52} />
                    <p className="proto-empty-title">
                      Esperando traspasos
                    </p>
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* BOTÓN FINAL */}
          {cola.length > 0 && (
            <div className="absolute bottom-6 right-6 z-30">
              <button
                type="button"
                onClick={enviarASheets}
                disabled={procesando}
                className="bg-[#1c1d1f] hover:bg-black text-white px-6 py-4 rounded-2xl shadow-xl font-black uppercase tracking-[0.15em] flex items-center gap-3 disabled:opacity-50 disabled:pointer-events-none"
              >
                <LocalIcon
                  name={procesando ? "loader-2" : "save"}
                  size={20}
                  className={procesando ? "animate-spin" : ""}
                />
                {procesando ? "Procesando..." : "Aplicar movimientos"}
              </button>
            </div>
          )}
        </div>
      );
    };

    // =========================================================
    // RENDER EN CONTENEDOR
    // =========================================================
    const rootDiv = document.getElementById('render-prototipo-traspasos');

    if (!rootDiv) {
      notify_(
        "No se encontró el contenedor principal del prototipo de traspasos.",
        "error",
        4200,
        {
          title: "Error de interfaz",
          sound: true
        }
      );
      reportViewError_(
        "TRASPASOS_ROOT_CONTAINER_NOT_FOUND",
        new Error("No se encontro #render-prototipo-traspasos")
      );
      return;
    }

    const yaInicializado = rootDiv.dataset.ptMounted === "1";

    if (window.__PROTOTIPO_TRASPASOS_ROOT__) {
      try {
        window.__PROTOTIPO_TRASPASOS_ROOT__.unmount();
      } catch (error) {
        reportViewError_("TRASPASOS_PREVIOUS_ROOT_UNMOUNT_FAILED", error);
      }
      window.__PROTOTIPO_TRASPASOS_ROOT__ = null;
    }

    try {
      rootDiv.dataset.ptMounted = "1";
      window.__PROTOTIPO_TRASPASOS_ROOT__ = ReactDOM.createRoot(rootDiv);
      window.__PROTOTIPO_TRASPASOS_ROOT__.render(<VistaPrototipo />);

      if (!yaInicializado) {
        notifyOnceShell_(
          "prototipo-vista-montada",
          "Vista del prototipo de traspasos lista para operar.",
          "success",
          1500,
          {
            title: "Vista cargada",
            sound: false
          },
          12000
        );
      }
    } catch (e) {
      reportViewError_("TRASPASOS_REACT_ROOT_FAILED", e);
      notify_(
        "Ocurrió un error al montar la vista del prototipo.",
        "error",
        4200,
        {
          title: "Error de montaje",
          sound: true
        }
      );
    }
  };

  window.initVista = window.cargar_PrototipoTraspasos;

</script>
