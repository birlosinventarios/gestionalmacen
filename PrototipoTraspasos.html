<script type="text/babel">
  window.cargar_PrototipoTraspasos = () => {
    const { useState, useEffect, useMemo, useRef } = React;

    // =========================================================
    // HELPERS DE NOTIFICACIÓN
    // =========================================================
    const notify_ = (mensaje, tipo = "info", timer = 2500, options = {}) => {
      const fn = window.notificar || window.lanzarNotificacion;
      if (typeof fn === "function") {
        fn(mensaje, tipo, timer, options);
      }
    };

    const createNotifyOnce_ = (ref) => (key, mensaje, tipo = "info", timer = 2500, options = {}, cooldown = 8000) => {
      const now = Date.now();
      const last = ref.current[key] || 0;
      if (now - last < cooldown) return;
      ref.current[key] = now;
      notify_(mensaje, tipo, timer, options);
    };

    const shellNotifyStateRef = { current: {} };
    const notifyOnceShell_ = createNotifyOnce_(shellNotifyStateRef);

    // =========================================================
    // ICONO LOCAL
    // =========================================================
    const LocalIcon = ({ name, size = 18, className = "" }) => {
      const iconRef = useRef(null);

      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name.toLowerCase());
          i.style.width = `${size}px`;
          i.style.height = `${size}px`;
          if (className) i.className = className;
          iconRef.current.appendChild(i);
          window.lucide.createIcons();
        }
      }, [name, size, className]);

      return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
    };

    // =========================================================
    // COMPONENTE PRINCIPAL
    // =========================================================
    const VistaPrototipo = () => {
      const [cola, setCola] = useState([]);
      const [procesando, setProcesando] = useState(false);
      const [cargando, setCargando] = useState(true);

      const [usuarios, setUsuarios] = useState([]);
      const [bodegas, setBodegas] = useState([]);
      const [mapaUbicacionesExcedentes, setMapaUbicacionesExcedentes] = useState([]);
      const [foliosAcomodo, setFoliosAcomodo] = useState([]);
      const [foliosSurtido, setFoliosSurtido] = useState([]);

      const [form, setForm] = useState({
        tipo: 'Acomodo',
        solicitante: '',
        codigo: '',
        bodega: '',
        cantidad: '',
        ubicacion: '',
        caja: '01',
        idSeleccionado: null
      });

      const firstLoadDoneRef = useRef(false);
      const localNotifyRef = useRef({});
      const notifyOnce_ = createNotifyOnce_(localNotifyRef);
      const infoCardRef = useRef(null);

      // =========================================================
      // REFS PARA ESCANEO CONTINUO
      // =========================================================
      const qrInputRef = useRef(null);
      const bodegaInputRef = useRef(null);
      const ubicacionInputRef = useRef(null);
      const cantidadInputRef = useRef(null);

      const [usarDatalistQR, setUsarDatalistQR] = useState(true);
      const [origenCapturaQR, setOrigenCapturaQR] = useState("manual");
      // "manual" | "scanner"

      const scannerBufferRef = useRef({
        start: 0,
        last: 0,
        count: 0
      });

      // Paso pendiente después de escanear
      // POSIBLES VALORES:
      // - "AUTO_ADD_ACOMODO"
      // - "AUTO_ADD_SURTIDO"
      // - "BODEGA"
      const siguientePasoPostScanRef = useRef(null);

      const enfocarQR = () => {
        setTimeout(() => {
          qrInputRef.current?.focus();
          qrInputRef.current?.select?.();
        }, 0);
      };

      // ---------------------------------------------------------
      // HELPERS
      // ---------------------------------------------------------
      const normalizarTexto = (valor) => String(valor || "").trim().toUpperCase();

      const normalizarFolios = (lista = []) => {
        return lista.map(item => ({
          ...item,
          idUnico: String(item.idUnico || "").split(/[ ,]+/)[0].trim(),
          sku: String(item.sku || "").trim().toUpperCase(),
          descripcion: String(item.descripcion || "").trim().toUpperCase(),
          ubicacionActual: String(item.ubicacionActual || "").trim().toUpperCase(),
          balance: Number(item.balance || 0),
          bodegaActual: String(item.bodegaActual || "").trim().toUpperCase()
        }));
      };

      const normalizarMapaUbicaciones = (lista = []) => {
        return lista.map(item => ({
          bodega: String(item.bodega || "").trim().toUpperCase(),
          ubi: String(item.ubi || "").trim().toUpperCase()
        }));
      };

      const guardarBootstrapEnCache = (bootstrap) => {
        window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || {};
        window.DATA_ALMACEN_CACHE.prototipoTraspasosBootstrap = bootstrap;

        if (bootstrap.usuarios) {
          window.DATA_ALMACEN_CACHE.usuarios = bootstrap.usuarios;
        }
        if (bootstrap.bodegas) {
          window.DATA_ALMACEN_CACHE.bodegas = bootstrap.bodegas;
        }
        if (bootstrap.mapaUbicacionesExcedentes) {
          window.DATA_ALMACEN_CACHE.mapaUbicacionesExcedentes = bootstrap.mapaUbicacionesExcedentes;
        }
      };

      const leerBootstrapDesdeCache = () => {
        const cache = window.DATA_ALMACEN_CACHE || {};
        return cache.prototipoTraspasosBootstrap || null;
      };

      const bloquearTeclasCantidad = (e) => {
        const teclasBloqueadas = ['-', '+', 'e', 'E', '.', ','];
        if (teclasBloqueadas.includes(e.key)) {
          e.preventDefault();
        }
      };

      const bloquearPegadoCantidadInvalida = (e) => {
        const texto = (e.clipboardData || window.clipboardData).getData('text');
        if (/[-+eE.,]/.test(texto)) {
          e.preventDefault();
          notify_(
            "Solo se permiten números enteros positivos en cantidad.",
            "warning",
            1800,
            {
              title: "Pegado inválido",
              sound: false
            }
          );
        }
      };

      const resetScannerBuffer = () => {
        scannerBufferRef.current = {
          start: 0,
          last: 0,
          count: 0
        };
      };

      const registrarTeclaScanner = () => {
        const now = Date.now();
        const ref = scannerBufferRef.current;

        if (!ref.start) {
          ref.start = now;
          ref.last = now;
          ref.count = 1;
          return;
        }

        ref.last = now;
        ref.count += 1;
      };

      const esEntradaScanner = () => {
        const ref = scannerBufferRef.current;
        if (!ref.start || ref.count < 8) return false;
        const duracion = ref.last - ref.start;
        return duracion <= 250;
      };

      const cerrarDatalistNativoQR = () => {
        try {
          qrInputRef.current?.blur();
          setTimeout(() => {
            qrInputRef.current?.focus();
          }, 0);
        } catch (e) {
          console.warn("No se pudo cerrar datalist nativo del QR:", e);
        }
      };

      const refrescarEstadoFolios = (onDone, contexto = "refresh") => {
        if (contexto !== "silent") {
          notify_("Actualizando estado de folios...", "info", 1400, {
            title: "Sincronizando folios",
            sound: false
          });
        }

        google.script.run
          .withSuccessHandler((data) => {
            const acomodo = normalizarFolios(data?.acomodo || []);
            const surtido = normalizarFolios(data?.surtido || []);

            setFoliosAcomodo(acomodo);
            setFoliosSurtido(surtido);

            const cache = leerBootstrapDesdeCache();
            if (cache) {
              cache.estadoFoliosAcomodo = acomodo;
              cache.estadoFoliosSurtido = surtido;
              cache.estadoFolios = acomodo;
            }

            if (contexto !== "silent") {
              notify_("Estado de folios actualizado correctamente.", "success", 1600, {
                title: "Folios sincronizados",
                sound: false
              });
            }

            if (typeof onDone === 'function') {
              onDone({ acomodo, surtido });
            }
          })
          .withFailureHandler((err) => {
            console.error("❌ [Prototipo] Error refrescando estado de folios:", err);

            notify_(
              "No se pudo refrescar el estado de folios.",
              "error",
              4200,
              {
                title: "Error de sincronización",
                sound: true
              }
            );

            if (typeof onDone === 'function') {
              onDone(null, err);
            }
          })
          .PrototipoTraspasosController_obtenerEstadoFolios();
      };

      const baseActiva = useMemo(() => {
        return form.tipo === 'Acomodo' ? foliosAcomodo : foliosSurtido;
      }, [form.tipo, foliosAcomodo, foliosSurtido]);

      const idsUnicosEnCola = useMemo(() => {
        return new Set(
          cola.map(item =>
            normalizarTexto(item.idSeleccionado?.idUnico || item.codigo || "")
          ).filter(Boolean)
        );
      }, [cola]);

      const baseActivaDisponible = useMemo(() => {
        return baseActiva.filter(item => {
          const idNormalizado = normalizarTexto(item.idUnico);
          return !idsUnicosEnCola.has(idNormalizado);
        });
      }, [baseActiva, idsUnicosEnCola]);

      const ubicacionesDisponiblesPorBodega = useMemo(() => {
        const bodega = normalizarTexto(form.bodega);
        if (!bodega) return [];

        return [...new Set(
          mapaUbicacionesExcedentes
            .filter(x => x.bodega === bodega)
            .map(x => x.ubi)
            .filter(Boolean)
        )].sort((a, b) => a.localeCompare(b, 'es', { numeric: true, sensitivity: 'base' }));
      }, [form.bodega, mapaUbicacionesExcedentes]);

      const existeIdUnicoEnCola = (idUnico) => {
        const idNormalizado = normalizarTexto(idUnico);
        if (!idNormalizado) return false;

        return cola.some(item => {
          const idEnFila = normalizarTexto(item.codigo || item.idSeleccionado?.idUnico || "");
          return idEnFila === idNormalizado;
        });
      };

      const hayRemanenteManualSurtido = useMemo(() => {
        if (form.tipo !== 'Surtido') return false;
        if (!form.idSeleccionado) return false;

        const cant = parseInt(form.cantidad, 10);
        const saldo = Number(form.idSeleccionado.balance || 0);

        return !Number.isNaN(cant) && cant > 0 && cant < saldo;
      }, [form.tipo, form.idSeleccionado, form.cantidad]);

      const [posicionRemanente, setPosicionRemanente] = useState({
        top: 0,
        left: 0,
        visible: false
      });

      // ---------------------------------------------------------
      // CARGA INICIAL
      // ---------------------------------------------------------
      useEffect(() => {
        const cargarBootstrap = () => {
          try {
            notify_("Sincronizando catálogo del prototipo...", "info", 1800, {
              title: "Inicializando prototipo",
              sound: false
            });

            const cacheBootstrap = leerBootstrapDesdeCache();

            if (
              cacheBootstrap &&
              Array.isArray(cacheBootstrap.usuarios) &&
              Array.isArray(cacheBootstrap.bodegas) &&
              Array.isArray(cacheBootstrap.mapaUbicacionesExcedentes) &&
              Array.isArray(cacheBootstrap.estadoFoliosAcomodo) &&
              Array.isArray(cacheBootstrap.estadoFoliosSurtido)
            ) {
              console.log("⚡ [Prototipo] Bootstrap reutilizado desde cache.");
              setUsuarios(cacheBootstrap.usuarios);
              setBodegas((cacheBootstrap.bodegas || []).map(x => String(x || "").trim().toUpperCase()));
              setMapaUbicacionesExcedentes(normalizarMapaUbicaciones(cacheBootstrap.mapaUbicacionesExcedentes || []));
              setFoliosAcomodo(normalizarFolios(cacheBootstrap.estadoFoliosAcomodo));
              setFoliosSurtido(normalizarFolios(cacheBootstrap.estadoFoliosSurtido));
              setCargando(false);

              firstLoadDoneRef.current = true;
              notify_("Conexión establecida correctamente desde memoria local.", "success", 2000, {
                title: "Sistema listo",
                sound: false
              });
              return;
            }

            google.script.run
              .withSuccessHandler((bootstrap) => {
                console.log("✅ [Prototipo] Bootstrap recibido:", bootstrap);

                const usuariosRecibidos = bootstrap?.usuarios || [];
                const bodegasRecibidas = (bootstrap?.bodegas || []).map(x => String(x || "").trim().toUpperCase());
                const mapaUbicacionesRecibido = normalizarMapaUbicaciones(bootstrap?.mapaUbicacionesExcedentes || []);
                const acomodoRecibidos = normalizarFolios(bootstrap?.estadoFoliosAcomodo || []);
                const surtidoRecibidos = normalizarFolios(bootstrap?.estadoFoliosSurtido || []);

                setUsuarios(usuariosRecibidos);
                setBodegas(bodegasRecibidas);
                setMapaUbicacionesExcedentes(mapaUbicacionesRecibido);
                setFoliosAcomodo(acomodoRecibidos);
                setFoliosSurtido(surtidoRecibidos);

                guardarBootstrapEnCache({
                  usuarios: usuariosRecibidos,
                  bodegas: bodegasRecibidas,
                  mapaUbicacionesExcedentes: mapaUbicacionesRecibido,
                  estadoFoliosAcomodo: acomodoRecibidos,
                  estadoFoliosSurtido: surtidoRecibidos,
                  estadoFolios: acomodoRecibidos
                });

                setCargando(false);
                firstLoadDoneRef.current = true;

                notify_("Conexión establecida correctamente con el prototipo.", "success", 2200, {
                  title: "Sistema listo",
                  sound: false
                });
              })
              .withFailureHandler((err) => {
                console.error("❌ [Prototipo] Error cargando bootstrap:", err);

                notify_(
                  "No se pudieron recuperar los datos del prototipo.",
                  "error",
                  4200,
                  {
                    title: "Error al sincronizar",
                    sound: true
                  }
                );
                setCargando(false);
              })
              .PrototipoTraspasosController_getBootstrap();

          } catch (err) {
            console.error("❌ [Prototipo] Error inesperado:", err);

            notify_(
              "No se pudo inicializar la vista del prototipo.",
              "error",
              4200,
              {
                title: "Error inesperado",
                sound: true
              }
            );
            setCargando(false);
          }
        };

        cargarBootstrap();
      }, []);

      // Autoenfoque al QR cuando la vista esté lista
      useEffect(() => {
        if (!cargando && !procesando) {
          enfocarQR();
        }
      }, [cargando, procesando, form.tipo]);

      // Flujo post-escaneo
      useEffect(() => {
        if (!form.idSeleccionado) return;

        const paso = siguientePasoPostScanRef.current;
        if (!paso) return;

        if (paso === "BODEGA" && form.tipo === "Acomodo") {
          siguientePasoPostScanRef.current = null;
          setTimeout(() => {
            bodegaInputRef.current?.focus();
            bodegaInputRef.current?.select?.();
          }, 0);
          return;
        }

        if (paso === "AUTO_ADD_ACOMODO" && form.tipo === "Acomodo") {
          if (normalizarTexto(form.bodega) && normalizarTexto(form.ubicacion)) {
            siguientePasoPostScanRef.current = null;
            setTimeout(() => {
              handleAdd({ preventDefault: () => {} });
            }, 0);
          } else {
            siguientePasoPostScanRef.current = "BODEGA";
            setTimeout(() => {
              bodegaInputRef.current?.focus();
              bodegaInputRef.current?.select?.();
            }, 0);
          }
          return;
        }

        if (
          paso === "AUTO_ADD_SURTIDO" &&
          form.tipo === "Surtido" &&
          origenCapturaQR === "scanner"
        ) {
          const saldo = Number(form.idSeleccionado?.balance || 0);

          if (saldo <= 0) {
            siguientePasoPostScanRef.current = null;
            return;
          }

          siguientePasoPostScanRef.current = null;

          setForm(prev => ({
            ...prev,
            cantidad: String(saldo)
          }));

          setTimeout(() => {
            handleAdd({ preventDefault: () => {} });
          }, 0);
        }
      }, [form.idSeleccionado, form.tipo, form.bodega, form.ubicacion, origenCapturaQR]);

      useEffect(() => {
        if (!hayRemanenteManualSurtido || !infoCardRef.current) {
          setPosicionRemanente(prev => ({ ...prev, visible: false }));
          return;
        }

        const recalcular = () => {
          const rect = infoCardRef.current?.getBoundingClientRect();
          if (!rect) return;
          const leftSeguro = Math.min(rect.right + 18, window.innerWidth - 280);

          setPosicionRemanente({
            top: rect.top + 10,
            left: leftSeguro,
            visible: true
          });
        };

        recalcular();
        window.addEventListener('resize', recalcular);
        window.addEventListener('scroll', recalcular, true);

        return () => {
          window.removeEventListener('resize', recalcular);
          window.removeEventListener('scroll', recalcular, true);
        };
      }, [hayRemanenteManualSurtido, form.codigo, form.cantidad, form.idSeleccionado]);

      // ---------------------------------------------------------
      // CAMBIO DE CANTIDAD
      // ---------------------------------------------------------
      const handleCantidadChange = (valor) => {
        if (form.tipo === 'Acomodo' && form.idSeleccionado) {
          return;
        }

        if (valor === '') {
          setForm(prev => ({ ...prev, cantidad: '' }));
          return;
        }

        const limpio = String(valor).replace(/[^\d]/g, '');
        if (limpio === '') {
          setForm(prev => ({ ...prev, cantidad: '' }));
          return;
        }

        let numVal = parseInt(limpio, 10);
        if (Number.isNaN(numVal)) return;

        if (numVal < 0) numVal = 0;

        const saldoDisponible = Number(form.idSeleccionado?.balance || 0);

        if (form.tipo === 'Surtido' && saldoDisponible > 0 && numVal > saldoDisponible) {
          notify_(
            `Solo hay ${saldoDisponible} pzas en este excedente.`,
            "warning",
            3200,
            {
              title: "Cantidad excedida",
              sound: true
            }
          );
          numVal = saldoDisponible;
        }

        setForm(prev => ({ ...prev, cantidad: String(numVal) }));
      };

      // ---------------------------------------------------------
      // CAMBIO DE INPUT QR / FOLIO
      // ---------------------------------------------------------
      const handleInputChange = (e) => {
        const val = e.target.value.toUpperCase().trim();

        setOrigenCapturaQR("manual");

        setForm(prev => {
          const infoFolio = baseActiva.find(f => f.idUnico === val);

          if (infoFolio) {
            return {
              ...prev,
              codigo: val,
              bodega: prev.tipo === 'Surtido'
                ? (infoFolio.bodegaActual || prev.bodega)
                : prev.bodega,
              ubicacion: prev.tipo === 'Surtido'
                ? (infoFolio.ubicacionActual || prev.ubicacion)
                : prev.ubicacion,
              cantidad: String(infoFolio.balance || prev.cantidad || ''),
              idSeleccionado: infoFolio
            };
          }

          return {
            ...prev,
            codigo: val,
            idSeleccionado: null
          };
        });

        const match = baseActiva.find(f => f.idUnico === val);

        if (match) {
          notifyOnce_(
            `folio-verificado-${val}`,
            `${match.sku} | ${match.bodegaActual || 'SIN BODEGA'} | ${match.ubicacionActual || 'SIN UBICACIÓN'} | Saldo: ${match.balance}`,
            "info",
            1800,
            {
              title: "Folio verificado",
              sound: false
            },
            1500
          );

          if (idsUnicosEnCola.has(normalizarTexto(match.idUnico || val))) {
            notifyOnce_(
              `folio-oculto-en-cola-${val}`,
              `El excedente ${match.idUnico || val} ya está en la fila de movimientos por aplicar.`,
              "warning",
              2500,
              {
                title: "ID ya agregado",
                sound: true
              },
              2000
            );
          }

          if (existeIdUnicoEnCola(match.idUnico || val)) {
            notifyOnce_(
              `folio-duplicado-${val}`,
              `El excedente ${match.idUnico || val} ya está agregado en la fila actual.`,
              "warning",
              2600,
              {
                title: "ID duplicado detectado",
                sound: true
              },
              2000
            );
          }
        }
      };

      // ---------------------------------------------------------
      // AGREGAR A COLA
      // ---------------------------------------------------------
      const handleAdd = (e) => {
        if (e && typeof e.preventDefault === 'function') {
          e.preventDefault();
        }

        const solicitanteLimpio = normalizarTexto(form.solicitante);
        const codigoLimpio = normalizarTexto(form.codigo);
        const bodegaLimpia = normalizarTexto(form.bodega);
        const ubicacionLimpia = normalizarTexto(form.ubicacion);

        const usuarioValido = usuarios.some(
          u => normalizarTexto(u.nombre) === solicitanteLimpio
        );

        if (!usuarioValido) {
          notify_(
            'Selecciona un solicitante válido para continuar.',
            "error",
            3200,
            {
              title: "Traspaso sin solicitante",
              sound: true
            }
          );
          return;
        }

        if (!codigoLimpio) {
          notify_(
            'Escanea, captura o selecciona un folio válido para continuar.',
            "warning",
            3200,
            {
              title: "Traspaso sin ID",
              sound: true
            }
          );
          return;
        }

        if (!form.idSeleccionado) {
          notify_(
            'El folio ingresado no existe en la fuente activa.',
            "error",
            3200,
            {
              title: "Folio no reconocido",
              sound: true
            }
          );
          return;
        }

        const idUnicoActual = normalizarTexto(form.idSeleccionado?.idUnico || codigoLimpio);
        if (existeIdUnicoEnCola(idUnicoActual)) {
          notify_(
            `El excedente ${idUnicoActual} ya fue agregado a la fila. No se permiten duplicados.`,
            "warning",
            3200,
            {
              title: "ID duplicado",
              sound: true
            }
          );
          return;
        }

        const cant = parseInt(form.cantidad, 10);
        if (Number.isNaN(cant) || cant <= 0) {
          notify_(
            'Debes ingresar una cantidad válida.',
            "warning",
            3000,
            {
              title: "Cantidad inválida",
              sound: true
            }
          );
          return;
        }

        if (form.tipo === 'Acomodo' && !bodegaLimpia) {
          notify_(
            'Debes indicar una bodega destino para el acomodo.',
            "warning",
            3000,
            {
              title: "Bodega requerida",
              sound: true
            }
          );
          return;
        }

        if (form.tipo === 'Acomodo' && !ubicacionLimpia) {
          notify_(
            'Debes indicar una ubicación destino para el acomodo.',
            "warning",
            3000,
            {
              title: "Ubicación requerida",
              sound: true
            }
          );
          return;
        }

        if (
          form.tipo === 'Acomodo' &&
          form.idSeleccionado &&
          Number(cant) !== Number(form.idSeleccionado.balance)
        ) {
          notify_(
            `En acomodo debes usar la cantidad completa del folio: ${form.idSeleccionado.balance} pzas.`,
            "warning",
            3400,
            {
              title: "Cantidad bloqueada",
              sound: true
            }
          );
          return;
        }

        const nuevoItem = {
          ...form,
          tipo: form.tipo,
          solicitante: solicitanteLimpio,
          codigo: codigoLimpio,
          bodega: bodegaLimpia,
          cantidad: cant,
          ubicacion: ubicacionLimpia,
          id: `${Date.now()}&${codigoLimpio}&#${form.caja}`,
          timestamp: new Date().toLocaleTimeString(),
          sku: form.idSeleccionado.sku,
          descripcion: form.idSeleccionado.descripcion,
          idSeleccionado: form.idSeleccionado
        };

        if (
          form.tipo === 'Surtido' &&
          form.idSeleccionado &&
          parseInt(form.cantidad, 10) < form.idSeleccionado.balance
        ) {
          notify_(
            `Se generará un nuevo remanente de ${form.idSeleccionado.balance - parseInt(form.cantidad, 10)} pzas.`,
            "info",
            3500,
            {
              title: "Remanente detectado",
              sound: false
            }
          );
        }

        setCola(prev => [nuevoItem, ...prev]);

        siguientePasoPostScanRef.current = null;
        resetScannerBuffer();
        setOrigenCapturaQR("manual");
        setUsarDatalistQR(true);

        setForm(prev => ({
          ...prev,
          codigo: '',
          bodega: prev.tipo === 'Acomodo' ? prev.bodega : '',
          cantidad: '',
          ubicacion: prev.tipo === 'Acomodo' ? prev.ubicacion : '',
          idSeleccionado: null
        }));

        notify_("Movimiento añadido correctamente a la fila.", "success", 1500, {
          title: "Añadido a fila",
          sound: false
        });

        enfocarQR();
      };

      // ---------------------------------------------------------
      // ENVÍO AL BACKEND
      // ---------------------------------------------------------
      const enviarASheets = () => {
        if (cola.length === 0) return;

        setProcesando(true);

        const hayImpresionEsperada = cola.some(item =>
          item.tipo === 'Surtido' &&
          item.idSeleccionado &&
          Number(item.cantidad || 0) > 0 &&
          Number(item.cantidad || 0) < Number(item.idSeleccionado.balance || 0)
        );

        let ventanaImpresion = null;

        notify_("Procesando movimientos del prototipo...", "info", 1800, {
          title: "Aplicando movimientos",
          sound: false
        });

        if (hayImpresionEsperada) {
          ventanaImpresion = window.open('', '_blank', 'width=800,height=600');

          if (!ventanaImpresion) {
            setProcesando(false);
            notify_(
              "La ventana fue bloqueada. Permite los pop-ups para generar la etiqueta remanente.",
              "warning",
              4200,
              {
                title: "Pop-up bloqueado",
                sound: true
              }
            );
            return;
          }

          ventanaImpresion.document.write(`
            <html>
              <head>
                <title>Generando etiquetas...</title>
                <style>
                  body {
                    font-family: Arial, sans-serif;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    height: 100vh;
                    margin: 0;
                    color: #5f6368;
                    background-color: #f8f9fa;
                  }

                  .spinner {
                    width: 50px;
                    height: 50px;
                    border: 5px solid #f3f3f3;
                    border-top: 5px solid #d93025;
                    border-radius: 50%;
                    animation: spin 1s linear infinite;
                    margin-bottom: 20px;
                  }

                  @keyframes spin {
                    0% { transform: rotate(0deg); }
                    100% { transform: rotate(360deg); }
                  }

                  .loader {
                    text-align: center;
                    max-width: 420px;
                    padding: 0 24px;
                  }

                  .loader h3 {
                    margin: 0 0 8px 0;
                    font-size: 22px;
                    font-weight: 700;
                    color: #1c1d1f;
                    letter-spacing: 0.04em;
                  }

                  .loader p {
                    margin: 0;
                    font-size: 14px;
                    color: #5f6368;
                    line-height: 1.5;
                  }
                </style>
              </head>
              <body>
                <div class="spinner"></div>
                <div class="loader">
                  <h3>Preparando etiquetas...</h3>
                  <p>Espera un momento mientras se genera la impresión del excedente.</p>
                </div>
              </body>
            </html>
          `);
          ventanaImpresion.document.close();
        }

        google.script.run
          .withSuccessHandler((resultado) => {
            if (resultado && resultado.htmlImpresion) {
              if (ventanaImpresion && !ventanaImpresion.closed) {
                ventanaImpresion.document.open();
                ventanaImpresion.document.write(resultado.htmlImpresion);
                ventanaImpresion.document.close();
              }
            } else {
              if (ventanaImpresion && !ventanaImpresion.closed) {
                ventanaImpresion.close();
              }
            }

            setProcesando(false);
            setCola([]);

            setForm(prev => ({
              ...prev,
              codigo: '',
              bodega: '',
              cantidad: '',
              ubicacion: '',
              idSeleccionado: null
            }));

            siguientePasoPostScanRef.current = null;
            resetScannerBuffer();
            setOrigenCapturaQR("manual");
            setUsarDatalistQR(true);
            enfocarQR();

            notify_(
              'Inventario actualizado correctamente.',
              "success",
              2400,
              {
                title: "Operación exitosa",
                sound: true
              }
            );

            refrescarEstadoFolios((data, err) => {
              if (err) {
                notify_(
                  "La operación se guardó, pero no se pudo refrescar el estado de folios.",
                  "warning",
                  3200,
                  {
                    title: "Actualización parcial",
                    sound: false
                  }
                );
                return;
              }

              notify_(
                "Estado de folios actualizado correctamente.",
                "info",
                1400,
                {
                  title: "Folios sincronizados",
                  sound: false
                }
              );
            }, "silent");
          })
          .withFailureHandler((err) => {
            console.error("❌ [Prototipo] Error procesando movimientos:", err);

            setProcesando(false);

            if (ventanaImpresion && !ventanaImpresion.closed) {
              ventanaImpresion.close();
            }

            notify_(
              err && err.message ? err.message : 'No se pudo procesar la operación.',
              "error",
              4200,
              {
                title: "Error",
                sound: true
              }
            );

            siguientePasoPostScanRef.current = null;
            resetScannerBuffer();
            setOrigenCapturaQR("manual");
            setUsarDatalistQR(true);
            enfocarQR();
          })
          .PrototipoTraspasosController_procesarMovimientosFinal(cola);
      };

      // ---------------------------------------------------------
      // UI
      // ---------------------------------------------------------
      return (
        <div className="flex flex-col h-full w-full relative">
          <div className="flex-1 flex overflow-hidden">
            {/* PANEL LATERAL */}
            <div className="w-[720px] border-r border-[#dadce0] bg-white p-6 overflow-y-auto shrink-0 z-10">
              <form onSubmit={handleAdd} className="h-full flex flex-col gap-5">
                {/* CABECERA SUPERIOR */}
                <div className="space-y-4">
                  <div className="flex p-1 bg-gray-100 rounded-xl">
                    {['Acomodo', 'Surtido'].map(t => (
                      <button
                        key={t}
                        type="button"
                        onClick={() => {
                          siguientePasoPostScanRef.current = null;
                          resetScannerBuffer();
                          setOrigenCapturaQR("manual");
                          setUsarDatalistQR(true);

                          setForm(prev => ({
                            ...prev,
                            tipo: t,
                            codigo: '',
                            cantidad: '',
                            idSeleccionado: null,
                            bodega: t === 'Acomodo' ? prev.bodega : '',
                            ubicacion: t === 'Acomodo' ? prev.ubicacion : ''
                          }));
                        }}
                        className={`flex-1 py-2 text-[15px] font-black uppercase rounded-lg transition-all ${
                          form.tipo === t ? 'bg-white text-[#d93025] shadow-sm' : 'text-gray-400'
                        }`}
                      >
                        {t}
                      </button>
                    ))}
                  </div>
                </div>

                {/* CUERPO EN 2 COLUMNAS */}
                <div className="grid grid-cols-2 gap-6 items-start">
                  {/* ===================================================== */}
                  {/* COLUMNA IZQUIERDA: CONFIGURACIÓN DE MOVIMIENTO */}
                  {/* ===================================================== */}
                  <div className="space-y-4">
                    {/* Solicitante */}
                    <div className="space-y-2">
                      <label className="proto-label ml-1">
                        Solicitante
                      </label>
                      <div className="relative">
                        <input
                          list="lista-usuarios-prototipo"
                          disabled={cargando}
                          className={`w-full border rounded-xl px-4 proto-input proto-form-input-unificado uppercase outline-none transition-all ${
                            cargando
                              ? 'bg-gray-200 cursor-not-allowed'
                              : 'bg-gray-50 focus:bg-white focus:border-[#d93025]'
                          }`}
                          placeholder={cargando ? "Cargando catálogo..." : "Escribe o selecciona un solicitante"}
                          value={form.solicitante}
                          onChange={e => setForm({ ...form, solicitante: e.target.value.toUpperCase() })}
                        />
                        <datalist id="lista-usuarios-prototipo">
                          {usuarios.map((u, index) => (
                            <option key={index} value={u.nombre} />
                          ))}
                        </datalist>
                      </div>
                    </div>

                    {/* Bodega */}
                    <div className="space-y-2">
                      <label className="proto-label ml-1">
                        Bodega
                      </label>
                      <input
                        ref={bodegaInputRef}
                        list="lista-bodegas-prototipo"
                        className={`w-full border rounded-xl px-4 proto-input proto-form-input-unificado uppercase outline-none transition-all ${
                          (form.tipo === 'Surtido' && form.idSeleccionado)
                            ? 'bg-gray-200 text-gray-500 cursor-not-allowed'
                            : 'bg-gray-50 border-[#dadce0] focus:border-[#d93025]'
                        }`}
                        placeholder={form.tipo === 'Acomodo' ? 'Selecciona una bodega' : 'Bodega actual'}
                        readOnly={form.tipo === 'Surtido' && form.idSeleccionado}
                        value={form.bodega}
                        onChange={(e) => setForm({
                          ...form,
                          bodega: e.target.value.toUpperCase(),
                          ubicacion: form.tipo === 'Acomodo' ? '' : form.ubicacion
                        })}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter' && form.tipo === 'Acomodo') {
                            e.preventDefault();

                            if (!normalizarTexto(form.bodega)) {
                              notify_(
                                "Selecciona una bodega válida antes de continuar.",
                                "warning",
                                2200,
                                {
                                  title: "Bodega requerida",
                                  sound: true
                                }
                              );
                              return;
                            }

                            if (normalizarTexto(form.ubicacion)) {
                              handleAdd(e);
                              return;
                            }

                            ubicacionInputRef.current?.focus();
                            ubicacionInputRef.current?.select?.();
                          }
                        }}
                      />
                      <datalist id="lista-bodegas-prototipo">
                        {bodegas.map((bodega, index) => (
                          <option key={index} value={bodega} />
                        ))}
                      </datalist>
                    </div>

                    {/* Ubicación: solo aparece si ya hay bodega */}
                    {normalizarTexto(form.bodega) && (
                      <div className="space-y-2 fade-in">
                        <label className="proto-label ml-1">
                          Ubicación
                        </label>
                        <input
                          ref={ubicacionInputRef}
                          list="lista-ubicaciones-prototipo"
                          className={`w-full border rounded-xl px-4 proto-input proto-form-input-unificado uppercase outline-none transition-all ${
                            (form.tipo === 'Surtido' && form.idSeleccionado)
                              ? 'bg-gray-200 text-gray-500 cursor-not-allowed'
                              : 'bg-gray-50 border-[#dadce0] focus:border-[#d93025]'
                          }`}
                          placeholder={form.tipo === 'Acomodo' ? "Selecciona una ubicación" : "Ubicación actual"}
                          readOnly={form.tipo === 'Surtido' && form.idSeleccionado}
                          value={form.ubicacion}
                          onChange={e => setForm({ ...form, ubicacion: e.target.value.toUpperCase() })}
                          onKeyDown={(e) => {
                            if (e.key === 'Enter' && form.tipo === 'Acomodo') {
                              e.preventDefault();

                              if (!normalizarTexto(form.ubicacion)) {
                                notify_(
                                  "Selecciona una ubicación válida antes de continuar.",
                                  "warning",
                                  2200,
                                  {
                                    title: "Ubicación requerida",
                                    sound: true
                                  }
                                );
                                return;
                              }

                              handleAdd(e);
                            }
                          }}
                        />
                        <datalist id="lista-ubicaciones-prototipo">
                          {ubicacionesDisponiblesPorBodega.map((ubi, index) => (
                            <option key={index} value={ubi} />
                          ))}
                        </datalist>
                      </div>
                    )}

                    {/* AYUDA VISUAL ACOMODO */}
                    {form.tipo === 'Acomodo' && form.idSeleccionado && (
                      <div className="px-3 py-3 rounded-xl bg-slate-100 border border-slate-200">
                        <span className="text-[10px] font-black uppercase tracking-widest text-slate-600">
                          Cantidad bloqueada
                        </span>
                        <p className="text-[12px] font-semibold text-slate-700 mt-1 leading-snug">
                          Este folio ya fue identificado y etiquetado.
                          El acomodo debe respetar la cantidad completa de la etiqueta:
                          <span className="font-black text-[#1c1d1f] ml-1">{form.idSeleccionado.balance} pzas</span>
                        </p>
                      </div>
                    )}

                    {/* Botón añadir manual */}
                    <button
                      type="submit"
                      disabled={cargando || procesando}
                      className="w-full bg-[#d93025] hover:bg-[#a50e0e] text-white py-4 rounded-xl font-black uppercase text-[16px] tracking-[0.18em] shadow-lg shadow-red-100 transition-all flex items-center justify-center gap-3 disabled:opacity-50 disabled:pointer-events-none"
                    >
                      <LocalIcon name="plus" size={25} />
                      Añadir a fila
                    </button>
                  </div>

                  {/* ===================================================== */}
                  {/* COLUMNA DERECHA: ESCANEO / INFO / CANTIDAD */}
                  {/* ===================================================== */}
                  <div className="space-y-4 overflow-visible">
                    {/* QR / FOLIO */}
                    <div className="space-y-2">
                      <label className="proto-label ml-1">
                        Escaneo de QR
                      </label>
                      <div className="relative group">
                        <input
                          ref={qrInputRef}
                          list={usarDatalistQR ? "lista-ids-excedentes" : undefined}
                          className="w-full bg-gray-50 border border-[#dadce0] focus:border-[#d93025] focus:bg-white rounded-xl px-4 proto-input proto-form-input-unificado uppercase outline-none transition-all"
                          placeholder={
                            form.tipo === 'Acomodo'
                              ? 'Escanea un ID con status DISPONIBLE'
                              : 'Escanea un ID con saldo disponible para surtido'
                          }
                          value={form.codigo}
                          onChange={handleInputChange}
                          onKeyDown={(e) => {
                            if (e.key.length === 1) {
                              registrarTeclaScanner();
                              return;
                            }

                            if (e.key !== 'Enter') return;

                            e.preventDefault();

                            const valorEscaneado = normalizarTexto(e.currentTarget.value);
                            const match = baseActiva.find(f => normalizarTexto(f.idUnico) === valorEscaneado);
                            const scannerDetectado = esEntradaScanner();
                            resetScannerBuffer();

                            if (!valorEscaneado) {
                              notify_(
                                "Escanea o captura un ID válido antes de continuar.",
                                "warning",
                                2200,
                                {
                                  title: "ID vacío",
                                  sound: true
                                }
                              );
                              return;
                            }

                            if (!match) {
                              notify_(
                                "El ID escaneado no existe en la fuente activa.",
                                "error",
                                2600,
                                {
                                  title: "ID no reconocido",
                                  sound: true
                                }
                              );
                              return;
                            }

                            if (existeIdUnicoEnCola(match.idUnico || valorEscaneado)) {
                              notify_(
                                `El ID único ${match.idUnico || valorEscaneado} ya está agregado en la fila.`,
                                "warning",
                                2600,
                                {
                                  title: "ID duplicado",
                                  sound: true
                                }
                              );
                              return;
                            }

                            setForm(prev => ({
                              ...prev,
                              codigo: valorEscaneado,
                              bodega: prev.tipo === 'Surtido'
                                ? (match.bodegaActual || prev.bodega)
                                : prev.bodega,
                              ubicacion: prev.tipo === 'Surtido'
                                ? (match.ubicacionActual || prev.ubicacion)
                                : prev.ubicacion,
                              cantidad: String(match.balance || prev.cantidad || ''),
                              idSeleccionado: match
                            }));

                            if (scannerDetectado) {
                              setOrigenCapturaQR("scanner");
                              setUsarDatalistQR(false);
                              cerrarDatalistNativoQR();

                              if (form.tipo === "Surtido") {
                                siguientePasoPostScanRef.current = "AUTO_ADD_SURTIDO";
                              } else {
                                const hayBodega = normalizarTexto(form.bodega);
                                const hayUbicacion = normalizarTexto(form.ubicacion);

                                siguientePasoPostScanRef.current =
                                  hayBodega && hayUbicacion
                                    ? "AUTO_ADD_ACOMODO"
                                    : "BODEGA";
                              }

                              setTimeout(() => {
                                setUsarDatalistQR(true);
                              }, 180);

                              return;
                            }

                            setOrigenCapturaQR("manual");
                            setUsarDatalistQR(true);
                            siguientePasoPostScanRef.current = null;

                            if (form.tipo === "Surtido") {
                              setTimeout(() => {
                                cantidadInputRef.current?.focus();
                                cantidadInputRef.current?.select?.();
                              }, 0);
                              return;
                            }

                            setTimeout(() => {
                              if (!normalizarTexto(form.bodega)) {
                                bodegaInputRef.current?.focus();
                                bodegaInputRef.current?.select?.();
                                return;
                              }

                              if (!normalizarTexto(form.ubicacion)) {
                                ubicacionInputRef.current?.focus();
                                ubicacionInputRef.current?.select?.();
                              }
                            }, 0);
                          }}
                        />
                        <datalist id="lista-ids-excedentes">
                          {baseActivaDisponible.map((item, index) => (
                            <option key={`${form.tipo}-${index}-${item.idUnico}`} value={item.idUnico}>
                              {item.sku} | {item.bodegaActual || 'SIN BODEGA'} | {item.ubicacionActual || 'SIN UBICACION'} | Saldo: {item.balance}
                            </option>
                          ))}
                        </datalist>

                        {form.idSeleccionado && (
                          <div className="absolute right-3 top-3 text-green-500 animate-pulse">
                            <LocalIcon name="check-circle" size={16} />
                          </div>
                        )}
                      </div>
                    </div>

                    {/* INFORMACIÓN REFERENCIADA */}
                    {form.codigo && (
                      <div>
                        <div
                          ref={infoCardRef}
                          className="proto-id-card bg-[#1c1d1f] space-y-3 border border-gray-800 fade-in shadow-xl"
                        >
                          <div className="flex items-start gap-2.5">
                            <div className="p-1.5 bg-gray-800 rounded-lg">
                              <LocalIcon name="tag" size={15} className="text-red-500" />
                            </div>
                            <div className="flex flex-col min-w-0">
                              <span className="text-[12px] font-black text-gray-500 uppercase tracking-[0.18em]">
                                SKU Vinculado
                              </span>
                              <span className="text-white proto-mono text-[17px] font-black mt-1 break-all">
                                {form.idSeleccionado ? form.idSeleccionado.sku : "Sin Ubicar"}
                              </span>
                            </div>
                          </div>

                          <div className="flex items-start gap-2.5 border-t border-gray-800 pt-2.5">
                            <div className="p-1.5 bg-gray-800 rounded-lg">
                              <LocalIcon name="file-text" size={15} className="text-red-500" />
                            </div>
                            <div className="flex flex-col min-w-0">
                              <span className="text-[12px] font-black text-gray-500 uppercase tracking-[0.18em]">
                                Descripción
                              </span>
                              <span className="text-gray-300 text-[15px] font-bold leading-snug uppercase italic mt-1 break-words">
                                {form.idSeleccionado
                                  ? form.idSeleccionado.descripcion
                                  : "No se encontró registro en la base de datos"}
                              </span>
                            </div>
                          </div>

                          {form.idSeleccionado && (
                            <div className="grid grid-cols-2 gap-2.5 border-t border-gray-800 pt-2.5">
                              <div className="bg-gray-900 rounded-xl px-3 py-2.5">
                                <span className="block text-[11px] font-black uppercase tracking-[0.18em] text-gray-500">
                                  Bodega
                                </span>
                                <span className="block text-[14px] font-bold text-white mt-1 tracking-[0.05em] break-words">
                                  {form.tipo === 'Surtido'
                                    ? (form.idSeleccionado.bodegaActual || 'SIN BODEGA')
                                    : (form.bodega || 'SIN SELECCIÓN')}
                                </span>
                              </div>

                              <div className="bg-gray-900 rounded-xl px-3 py-2.5">
                                <span className="block text-[11px] font-black uppercase tracking-[0.18em] text-gray-500">
                                  Ubicación
                                </span>
                                <span className="block text-[14px] font-bold text-white mt-1 tracking-[0.05em] break-words">
                                  {form.ubicacion || 'SIN UBICACIÓN'}
                                </span>
                              </div>
                            </div>
                          )}
                        </div>
                      </div>
                    )}

                    {/* CANTIDAD */}
                    <div className="space-y-2">
                      <label className="proto-label ml-1">
                        Cant.
                      </label>
                      <input
                        ref={cantidadInputRef}
                        id="input-cantidad"
                        type="number"
                        min="0"
                        step="1"
                        inputMode="numeric"
                        readOnly={form.tipo === 'Acomodo' && !!form.idSeleccionado}
                        className={`w-full border rounded-xl px-4 proto-input proto-form-input-unificado uppercase outline-none transition-all ${
                          (form.tipo === 'Acomodo' && form.idSeleccionado)
                            ? 'bg-gray-200 text-gray-600 cursor-not-allowed border-gray-300'
                            : 'bg-gray-50 border-[#dadce0] focus:border-[#d93025]'
                        }`}
                        placeholder={form.tipo === 'Acomodo' ? 'Cantidad fijada por el folio' : '0'}
                        value={form.cantidad}
                        onChange={e => handleCantidadChange(e.target.value)}
                        onKeyDown={(e) => {
                          bloquearTeclasCantidad(e);

                          if (e.key === 'Enter' && form.tipo === 'Surtido') {
                            e.preventDefault();
                            handleAdd(e);
                          }
                        }}
                        onPaste={bloquearPegadoCantidadInvalida}
                        onWheel={(e) => e.currentTarget.blur()}
                      />
                    </div>

                    {/* SALDO DISPONIBLE SOLO EN SURTIDO */}
                    {form.tipo === 'Surtido' && form.idSeleccionado && (
                      <div className="proto-saldo-card p-4 fade-in mt-2">
                        <div className="flex items-center justify-between mb-3">
                          <span className="proto-saldo-badge">
                            Disponible para surtido
                          </span>
                          <div className="text-white opacity-90">
                            <LocalIcon name="shield-alert" size={18} />
                          </div>
                        </div>

                        <div className="flex items-end justify-between gap-4">
                          <div className="flex flex-col">
                            <span className="text-[13px] text-red-100 font-black uppercase tracking-[0.18em]">
                              Saldo actual
                            </span>
                            <span className="text-[12px] text-red-50/90 font-semibold uppercase tracking-[0.12em] mt-1">
                              Piezas listas para surtido inmediato
                            </span>
                          </div>

                          <div className="text-right">
                            <span className="proto-alert-number text-white font-mono">
                              {form.idSeleccionado.balance}
                            </span>
                            <div className="text-[12px] text-red-100 font-black uppercase tracking-[0.16em] mt-1">
                              Pzas
                            </div>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </form>
            </div>

            {/* TABLA DE RESULTADOS */}
            <div className="flex-1 min-w-0 proto-results-shell overflow-auto custom-scroll-container">
              <table className="proto-results-table">
                <thead className="proto-results-head">
                  <tr>
                    <th className="text-left">
                      SKU / Folio
                    </th>
                    <th className="text-left">
                      Tipo
                    </th>
                    <th className="text-left">
                      Bodega / Ubicación
                    </th>
                    <th className="text-right">
                      Cantidad
                    </th>
                    <th className="text-center">
                      Acción
                    </th>
                  </tr>
                </thead>

                <tbody>
                  {cola.map(item => (
                    <tr key={item.id} className="proto-results-row fade-in">
                      <td>
                        <div className="flex flex-col">
                          <span className="proto-folio-main">{item.codigo}</span>
                          <span className="proto-folio-sub">
                            SKU: {item.sku}
                          </span>
                          <span className="proto-folio-desc">
                            {item.descripcion || 'SIN DESCRIPCIÓN'}
                          </span>
                        </div>
                      </td>

                      <td>
                        <span className={`proto-type-chip ${
                          item.tipo === 'Acomodo'
                            ? 'proto-type-chip-acomodo'
                            : 'proto-type-chip-surtido'
                        }`}>
                          {item.tipo}
                        </span>
                      </td>

                      <td>
                        <div className="proto-location-block">
                          <span className="proto-location-main">
                            {item.bodega || 'SIN BODEGA'}
                          </span>
                          <span className="proto-location-sub">
                            {item.ubicacion || 'SIN UBICACIÓN'}
                          </span>
                        </div>
                      </td>

                      <td className="text-right">
                        <span className="proto-qty-pill">
                          {item.cantidad}
                        </span>
                      </td>

                      <td className="text-center">
                        <button
                          type="button"
                          onClick={() => {
                            setCola(prev => prev.filter(c => c.id !== item.id));
                            notify_("Movimiento removido de la fila.", "warning", 1400, {
                              title: "Elemento removido",
                              sound: false
                            });
                            enfocarQR();
                          }}
                          className="proto-delete-btn"
                          title="Quitar de la fila"
                        >
                          <LocalIcon name="trash-2" size={16} />
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>

              {cola.length === 0 && (
                <div className="proto-empty-state">
                  <LocalIcon name="package" size={52} />
                  <p className="proto-empty-title">
                    Esperando traspasos
                  </p>
                </div>
              )}
            </div>
          </div>

          {hayRemanenteManualSurtido && posicionRemanente.visible && (
            <div
              className="fixed z-[9999] fade-in pointer-events-none"
              style={{
                top: `${posicionRemanente.top}px`,
                left: `${posicionRemanente.left}px`,
                width: '260px'
              }}
            >
              <div className="relative">
                <div
                  className="absolute -left-[10px] top-[26px] w-5 h-5 rotate-45 bg-[#fde68a] border-l-2 border-b-2 border-[#f59e0b] rounded-bl-[4px]"
                ></div>

                <div className="proto-remanente-card p-3.5 pointer-events-auto">
                  <div className="flex items-center justify-between mb-2">
                    <span className="proto-remanente-badge">
                      Remanente detectado
                    </span>
                    <div className="text-amber-900">
                      <LocalIcon name="scissors" size={16} />
                    </div>
                  </div>

                  <div className="flex items-start gap-2.5">
                    <div className="shrink-0 text-amber-700 mt-0.5">
                      <LocalIcon name="alert-triangle" size={18} />
                    </div>

                    <div className="flex flex-col flex-1 min-w-0">
                      <span className="text-[12px] font-black text-amber-950 uppercase tracking-[0.16em] leading-tight">
                        Se generará una nueva etiqueta
                      </span>

                      <span className="text-[12px] font-semibold text-amber-900 mt-1 leading-snug tracking-[0.02em]">
                        Este surtido no consume el total del excedente original.
                      </span>

                      <div className="mt-2 flex items-end justify-between gap-3">
                        <div className="flex flex-col min-w-0">
                          <span className="text-[11px] font-black text-amber-800 uppercase tracking-[0.12em] whitespace-nowrap">
                            Cantidad remanente
                          </span>
                          <span className="text-[10px] text-amber-700 font-semibold uppercase tracking-[0.08em] mt-0.5 leading-tight">
                            Se registrará como nuevo excedente disponible
                          </span>
                        </div>

                        <div className="text-right shrink-0">
                          <span className="text-[20px] font-black text-amber-950 font-mono tracking-[0.04em] leading-none">
                            {Number(form.idSeleccionado?.balance || 0) - Number(parseInt(form.cantidad || 0, 10) || 0)}
                          </span>
                          <div className="text-[11px] text-amber-900 font-black uppercase tracking-[0.14em] mt-0.5">
                            Pzas
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* BOTÓN FINAL */}
          {cola.length > 0 && (
            <div className="absolute bottom-6 right-6 z-30">
              <button
                type="button"
                onClick={enviarASheets}
                disabled={procesando}
                className="bg-[#1c1d1f] hover:bg-black text-white px-6 py-4 rounded-2xl shadow-xl font-black uppercase tracking-[0.15em] flex items-center gap-3 disabled:opacity-50 disabled:pointer-events-none"
              >
                <LocalIcon name={procesando ? "loader-2" : "save"} size={20} className={procesando ? "animate-spin" : ""} />
                {procesando ? "Procesando..." : "Aplicar movimientos"}
              </button>
            </div>
          )}
        </div>
      );
    };

    // =========================================================
    // RENDER EN CONTENEDOR
    // =========================================================
    const rootDiv = document.getElementById('render-prototipo-traspasos');

    if (!rootDiv) {
      notify_(
        "No se encontró el contenedor principal del prototipo de traspasos.",
        "error",
        4200,
        {
          title: "Error de interfaz",
          sound: true
        }
      );
      console.warn("⚠️ [Prototipo] No se encontró #render-prototipo-traspasos");
      return;
    }

    const yaInicializado = rootDiv.dataset.ptMounted === "1";

    if (window.__PROTOTIPO_TRASPASOS_ROOT__) {
      try {
        window.__PROTOTIPO_TRASPASOS_ROOT__.unmount();
      } catch (e) {
        console.warn("⚠️ [Prototipo] No se pudo desmontar root previo:", e);
        notifyOnceShell_(
          "prototipo-root-previo",
          "Se liberó una instancia previa del prototipo de traspasos.",
          "warning",
          1600,
          {
            title: "Reinicialización",
            sound: false
          },
          10000
        );
      }
      window.__PROTOTIPO_TRASPASOS_ROOT__ = null;
    }

    try {
      rootDiv.dataset.ptMounted = "1";
      window.__PROTOTIPO_TRASPASOS_ROOT__ = ReactDOM.createRoot(rootDiv);
      window.__PROTOTIPO_TRASPASOS_ROOT__.render(<VistaPrototipo />);

      if (!yaInicializado) {
        notifyOnceShell_(
          "prototipo-vista-montada",
          "Vista del prototipo de traspasos lista para operar.",
          "success",
          1500,
          {
            title: "Vista cargada",
            sound: false
          },
          12000
        );
      }
    } catch (e) {
      console.error("❌ [Prototipo] Error montando root React:", e);
      notify_(
        "Ocurrió un error al montar la vista del prototipo.",
        "error",
        4200,
        {
          title: "Error de montaje",
          sound: true
        }
      );
    }
  };

  window.initVista = window.cargar_PrototipoTraspasos;
  console.log("🧩 [PrototipoTraspasos] initVista definida:", typeof window.initVista);
</script>
