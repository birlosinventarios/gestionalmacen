<script>
  /**
   * PrototipoTraspasos.html
   *
   * Vista operativa para ejecutar movimientos de acomodo y surtido de
   * excedentes dentro de APPALMACEN.
   *
   * Responsabilidades principales:
   * - Cargar usuarios, bodegas, ubicaciones y estados de folios.
   * - Mantener sincronizados los folios disponibles para acomodo y surtido.
   * - Validar capturas, cantidades, destinos y duplicados antes de agregarlos
   *   a la fila de movimientos.
   * - Enviar movimientos al backend mediante APPALMACEN_ACTIONS.
   * - Gestionar la impresión LOCAL u ONLINE de etiquetas de saldo parcial.
   * - Preservar cachés operativas y actualizar el estado visible de los folios.
   *
   * Dependencias globales:
   * - React y ReactDOM.
   * - google.script.run.
   * - window.APPALMACEN_ACTIONS.
   * - window.ImpresionModoUtilidades.
   * - window.DATA_ALMACEN_CACHE.
   * - window.APPALMACEN_PREFETCHES.
   * - window.notificar o window.lanzarNotificacion.
   * - window.registrarError_, cuando esté disponible.
   * - window.lucide, para renderizar iconos.
   *
   * Contratos públicos preservados:
   * - window.cargar_PrototipoTraspasos().
   * - window.initVista.
   * - PrototipoTraspasosController_getBootstrap().
   * - PrototipoTraspasosController_obtenerEstadoFolios().
   * - PrototipoTraspasosController_procesarMovimientosFinal().
   *
   * Nota de mantenimiento:
   * La documentación añadida no altera elementos renderizados, estilos
   * efectivos, estados, efectos, payloads, tiempos, validaciones ni endpoints.
   */
</script>

<script type="text/babel">
  window.cargar_PrototipoTraspasos = () => {
    const { useState, useEffect, useMemo, useRef } = React;

    // =====================================================================
    // NOTIFICACIONES Y TELEMETRÍA
    // =====================================================================

    /**
     * Publica una notificación usando la implementación disponible en el Shell.
     *
     * @param {string} mensaje Texto visible para el usuario.
     * @param {string} [tipo="info"] Nivel visual de la notificación.
     * @param {number} [timer=2500] Duración, en milisegundos.
     * @param {Object} [options={}] Configuración adicional del notificador.
     * @return {void}
     */
    const notify_ = (mensaje, tipo = "info", timer = 2500, options = {}) => {
      const fn = window.notificar || window.lanzarNotificacion;
      if (typeof fn === "function") {
        fn(mensaje, tipo, timer, options);
      }
    };

    /**
     * Crea un notificador con control de frecuencia por clave.
     *
     * @param {{current:Object<string,number>}} ref Registro mutable de tiempos.
     * @return {Function} Función de notificación con cooldown.
     */
    const createNotifyOnce_ = (ref) => (key, mensaje, tipo = "info", timer = 2500, options = {}, cooldown = 8000) => {
      const now = Date.now();
      const last = ref.current[key] || 0;
      if (now - last < cooldown) return;
      ref.current[key] = now;
      notify_(mensaje, tipo, timer, options);
    };

    const shellNotifyStateRef = { current: {} };
    const notifyOnceShell_ = createNotifyOnce_(shellNotifyStateRef);

    /**
     * Ejecuta una operación mediante el coordinador global de acciones.
     *
     * @param {Object} config Contrato de ejecución para APPALMACEN_ACTIONS.
     * @return {Promise<*>} Resultado de la operación coordinada.
     */
    const actionRun_ = (config) => {
      if (!window.APPALMACEN_ACTIONS || typeof window.APPALMACEN_ACTIONS.run !== "function") {
        return Promise.reject(
          new Error("APPALMACEN_ACTIONS.run no esta disponible en el Shell.")
        );
      }

      return window.APPALMACEN_ACTIONS.run(config);
    };

    /**
     * Registra un error de vista con formato uniforme y metadatos operativos.
     *
     * @param {string} event Identificador estable del evento.
     * @param {*} error Error original o valor convertible a Error.
     * @param {Object} [metadata={}] Contexto adicional no sensible.
     * @return {void}
     */
    const reportViewError_ = (event, error, metadata = {}) => {
      const normalizedError = error instanceof Error
        ? error
        : new Error(
            error?.message ||
            error?.details ||
            String(error || "Error desconocido")
          );

      if (typeof window.registrarError_ === "function") {
        window.registrarError_("VIEW", event, normalizedError, {
          viewId: "PrototipoTraspasos",
          ...metadata
        });
        return;
      }

      console.error(`[APPALMACEN][VIEW][${event}]`, {
        error: {
          name: normalizedError.name || "Error",
          message: normalizedError.message || "",
          stack: normalizedError.stack || ""
        },
        metadata: {
          viewId: "PrototipoTraspasos",
          ...metadata
        }
      });
    };

    // =====================================================================
    // COMPONENTES AUXILIARES
    // =====================================================================

    /**
     * Renderiza un icono Lucide dentro de un contenedor React aislado.
     *
     * @param {{name:string,size?:number,className?:string}} props Propiedades.
     * @return {React.ReactElement}
     */
    const LocalIcon = ({ name, size = 18, className = "" }) => {
      const iconRef = useRef(null);

      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name.toLowerCase());
          i.style.width = `${size}px`;
          i.style.height = `${size}px`;
          if (className) i.className = className;
          iconRef.current.appendChild(i);
          window.lucide.createIcons();
        }
      }, [name, size, className]);

      return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
    };

    // =====================================================================
    // COMPONENTE PRINCIPAL
    // =====================================================================

    /**
     * Administra el ciclo de vida completo de la vista de traspasos.
     *
     * @return {React.ReactElement}
     */
    const VistaPrototipo = () => {
      const [cola, setCola] = useState([]);
      const [procesando, setProcesando] = useState(false);
      const [cargando, setCargando] = useState(true);

      const [usuarios, setUsuarios] = useState([]);
      const [bodegas, setBodegas] = useState([]);
      const [mapaUbicacionesExcedentes, setMapaUbicacionesExcedentes] = useState([]);
      const [foliosAcomodo, setFoliosAcomodo] = useState([]);
      const [foliosSurtido, setFoliosSurtido] = useState([]);
      const [foliosListos, setFoliosListos] = useState(false);
      const [sincronizandoFolios, setSincronizandoFolios] = useState(false);
      const foliosListosRef = useRef(false);

      const [form, setForm] = useState({
        tipo: 'Acomodo',
        solicitante: '',
        codigo: '',
        bodega: '',
        cantidad: '',
        ubicacion: '',
        caja: '01',
        idSeleccionado: null
      });

      const firstLoadDoneRef = useRef(false);
      const localNotifyRef = useRef({});
      const notifyOnce_ = createNotifyOnce_(localNotifyRef);
      
      const syncFoliosInFlightRef = useRef(false);
      const syncFoliosHashRef = useRef("");
      const syncFoliosTimerRef = useRef(null);
      const envioEnCursoRef = useRef(false);

      // =============================
      // REFS PARA ESCANEO CONTINUO
      // =============================
      const qrInputRef = useRef(null);
      const bodegaInputRef = useRef(null);
      const ubicacionInputRef = useRef(null);
      const cantidadInputRef = useRef(null);

      // Paso pendiente después de escanear
      // POSIBLES VALORES:
      // - "CANTIDAD"
      // - "BODEGA"
      // - "AUTO_ADD_ACOMODO"
      const siguientePasoPostScanRef = useRef(null);

      const enfocarQR = () => {
        setTimeout(() => {
          qrInputRef.current?.focus();
          qrInputRef.current?.select?.();
        }, 0);
      };

      // ---------------------------------------------------------
      // HELPERS
      // ---------------------------------------------------------
      /**
       * Normaliza valores de captura para comparaciones consistentes.
       *
       * @param {*} valor Valor de entrada.
       * @return {string} Texto recortado y convertido a mayúsculas.
       */
      const normalizarTexto = (valor) => String(valor || "").trim().toUpperCase();

      /**
       * Genera el identificador idempotente de una operación de movimiento.
       *
       * @return {string}
       */
      const generarIdOperacion_ = () => {
        if (
          window.crypto &&
          typeof window.crypto.randomUUID === "function"
        ) {
          return window.crypto.randomUUID();
        }

        return [
          Date.now(),
          Math.random().toString(36).slice(2),
          normalizarTexto(form.codigo),
          form.caja
        ].join("-");
      };

      /**
       * Normaliza el contrato de folios recibido desde caché o backend.
       *
       * @param {Array<Object>} [lista=[]] Folios de origen.
       * @return {Array<Object>} Copia normalizada de los folios.
       */
      const normalizarFolios = (lista = []) => {
        return lista.map(item => ({
          ...item,
          idUnico: String(item.idUnico || "").split(/[ ,]+/)[0].trim(),
          sku: String(item.sku || "").trim().toUpperCase(),
          descripcion: String(item.descripcion || "").trim().toUpperCase(),
          ubicacionActual: String(item.ubicacionActual || "").trim().toUpperCase(),
          balance: Number(item.balance || 0),
          bodegaActual: String(item.bodegaActual || "").trim().toUpperCase()
        }));
      };

      /**
       * Normaliza bodegas y ubicaciones para búsquedas exactas.
       *
       * @param {Array<Object>} [lista=[]] Mapa recibido.
       * @return {Array<{bodega:string,ubi:string}>}
       */
      const normalizarMapaUbicaciones = (lista = []) => {
        return lista.map(item => ({
          bodega: String(item.bodega || "").trim().toUpperCase(),
          ubi: String(item.ubi || "").trim().toUpperCase()
        }));
      };

      /**
       * Persiste en memoria del Shell los datos reutilizables del bootstrap.
       *
       * @param {Object} bootstrap Datos iniciales de la vista.
       * @return {void}
       */
      const guardarBootstrapEnCache = (bootstrap) => {
        window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || {};
        window.DATA_ALMACEN_CACHE.prototipoTraspasosBootstrap = bootstrap;

        if (bootstrap.usuarios) {
          window.DATA_ALMACEN_CACHE.usuarios = bootstrap.usuarios;
        }
        if (bootstrap.bodegas) {
          window.DATA_ALMACEN_CACHE.bodegas = bootstrap.bodegas;
        }
        if (bootstrap.mapaUbicacionesExcedentes) {
          window.DATA_ALMACEN_CACHE.mapaUbicacionesExcedentes = bootstrap.mapaUbicacionesExcedentes;
        }
      };

      /**
       * Recupera el bootstrap más completo disponible en memoria local.
       *
       * @return {Object|null}
       */
      const leerBootstrapDesdeCache = () => {
        const cache = window.DATA_ALMACEN_CACHE || {};

        if (cache.prototipoTraspasosBootstrap) {
          return cache.prototipoTraspasosBootstrap;
        }

        if (
          Array.isArray(cache.usuarios) &&
          Array.isArray(cache.bodegas) &&
          Array.isArray(cache.mapaUbicacionesExcedentes)
        ) {
          return {
            usuarios: cache.usuarios || [],
            bodegas: cache.bodegas || [],
            mapaUbicacionesExcedentes: cache.mapaUbicacionesExcedentes || [],

            estadoFoliosAcomodo: cache.estadoFoliosAcomodo || [],
            estadoFoliosSurtido: cache.estadoFoliosSurtido || [],
            estadoFolios: cache.estadoFoliosAcomodo || [],

            parcial: true,
            origen: "APPALMACEN_BOOTSTRAP"
          };
        }

        return null;
      };

      /**
       * Aplica folios precargados y libera el bloqueo visual de sincronización.
       *
       * @return {boolean} true cuando existe información local utilizable.
       */
      const aplicarFoliosDesdeCacheLocal_ = () => {
        const cache = leerBootstrapDesdeCache();

        const acomodo = normalizarFolios(
          cache && Array.isArray(cache.estadoFoliosAcomodo)
            ? cache.estadoFoliosAcomodo
            : []
        );

        const surtido = normalizarFolios(
          cache && Array.isArray(cache.estadoFoliosSurtido)
            ? cache.estadoFoliosSurtido
            : []
        );

        if (acomodo.length > 0 || surtido.length > 0) {
          setFoliosAcomodo(acomodo);
          setFoliosSurtido(surtido);
          setFoliosListos(true);
          setSincronizandoFolios(false);

          return true;
        }

        return false;
      };

      /**
       * Sincroniza el estado operativo de folios de acomodo y surtido.
       *
       * Evita solicitudes concurrentes, actualiza las cachés compartidas y
       * diferencia notificaciones manuales, silenciosas y automáticas.
       *
       * @param {Function|null} onDone Callback opcional de finalización.
       * @param {string} [contexto="refresh"] Contexto de la sincronización.
       * @param {boolean} [forceRefresh=false] Solicita actualización forzada.
       * @param {Object} [options={}] Opciones de bloqueo visual.
       * @return {Promise<*>}
       */
      const refrescarEstadoFolios = (
        onDone,
        contexto = "refresh",
        forceRefresh = false,
        options = {}
      ) => {
        if (syncFoliosInFlightRef.current) {
          if (typeof onDone === "function") {
            onDone(null, new Error("Sincronizacion en curso."));
          }
          return Promise.resolve(null);
        }

        syncFoliosInFlightRef.current = true;

        const bloquearUI =
          options.bloquearUI === true &&
          !foliosListosRef.current;

        let failureHandlerExecuted = false;

        if (bloquearUI) {
          setSincronizandoFolios(true);
        }

        if (contexto !== "silent" && contexto !== "auto") {
          notify_("Actualizando estado de folios...", "info", 1400, {
            title: "Sincronizando folios",
            sound: false
          });
        }

        return actionRun_({
          operation: "TRASPASOS_REFRESCAR_FOLIOS",
          viewId: "PrototipoTraspasos",
          controller: "PrototipoTraspasosController_obtenerEstadoFolios",
          payload: {
            forceRefresh: forceRefresh === true
          },
          timeoutMs: 120000,
          waitForPaint: true,
          metadata: {
            contexto,
            bloquearUI,
            forceRefresh: forceRefresh === true
          },

          invoke({ success, failure }) {
            google.script.run
              .withSuccessHandler(success)
              .withFailureHandler(failure)
              .PrototipoTraspasosController_obtenerEstadoFolios(
                forceRefresh === true
              );
          },

          onSuccess(data) {
            syncFoliosInFlightRef.current = false;

            if (bloquearUI) {
              setSincronizandoFolios(false);
            }

            const acomodo = normalizarFolios(data?.acomodo || []);
            const surtido = normalizarFolios(data?.surtido || []);

            const nuevoHash = JSON.stringify({
              acomodo: acomodo.map(x => [
                x.idUnico,
                x.sku,
                x.balance,
                x.ubicacionActual,
                x.bodegaActual
              ]),
              surtido: surtido.map(x => [
                x.idUnico,
                x.sku,
                x.balance,
                x.ubicacionActual,
                x.bodegaActual
              ])
            });

            const huboCambios = nuevoHash !== syncFoliosHashRef.current;
            syncFoliosHashRef.current = nuevoHash;

            setFoliosAcomodo(acomodo);
            setFoliosSurtido(surtido);
            setFoliosListos(true);

            const syncTime = Date.now();
            window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || {};
            window.DATA_ALMACEN_CACHE.estadoFoliosAcomodo = acomodo;
            window.DATA_ALMACEN_CACHE.estadoFoliosSurtido = surtido;
            window.DATA_ALMACEN_CACHE.estadoFolios = acomodo;
            window.DATA_ALMACEN_CACHE.ultimaSyncFolios = syncTime;

            const bootstrapCache =
              window.DATA_ALMACEN_CACHE.prototipoTraspasosBootstrap;

            if (bootstrapCache) {
              bootstrapCache.estadoFoliosAcomodo = acomodo;
              bootstrapCache.estadoFoliosSurtido = surtido;
              bootstrapCache.estadoFolios = acomodo;
              bootstrapCache.ultimaSyncFolios = syncTime;
            }

            if (contexto === "auto") {
              if (huboCambios) {
                notifyOnce_(
                  "folios-auto-actualizados",
                  "Base de excedentes actualizada automaticamente.",
                  "info",
                  1500,
                  {
                    title: "Folios sincronizados",
                    sound: false
                  },
                  12000
                );
              }
            } else if (contexto !== "silent") {
              notify_(
                "Estado de folios actualizado correctamente.",
                "success",
                1600,
                {
                  title: "Folios sincronizados",
                  sound: false
                }
              );
            }

            const result = {
              acomodo,
              surtido,
              huboCambios
            };

            if (typeof onDone === "function") {
              onDone(result);
            }

            return result;
          },

          onFailure(error) {
            failureHandlerExecuted = true;
            syncFoliosInFlightRef.current = false;

            if (bloquearUI) {
              setSincronizandoFolios(false);
            }

            if (contexto === "auto") {
              notifyOnce_(
                "error-auto-sync-folios",
                "No se pudo sincronizar automaticamente la base de folios.",
                "warning",
                2600,
                {
                  title: "Sincronizacion pendiente",
                  sound: false
                },
                15000
              );
            } else {
              notify_(
                "No se pudo refrescar el estado de folios.",
                "error",
                4200,
                {
                  title: "Error de sincronizacion",
                  sound: true
                }
              );
            }

            if (typeof onDone === "function") {
              onDone(null, error);
            }
          },

          getResultMetadata(data, result) {
            return {
              acomodo: result?.acomodo?.length || 0,
              surtido: result?.surtido?.length || 0,
              huboCambios: result?.huboCambios === true
            };
          }
        }).catch(error => {
          syncFoliosInFlightRef.current = false;

          if (bloquearUI) {
            setSincronizandoFolios(false);
          }

          reportViewError_(
            "TRASPASOS_REFRESCAR_FOLIOS_FAILED",
            error,
            {
              contexto,
              forceRefresh: forceRefresh === true,
              failureHandlerExecuted
            }
          );

          if (!failureHandlerExecuted) {
            if (contexto === "auto") {
              notifyOnce_(
                "timeout-auto-sync-folios",
                "La sincronizacion automatica de folios excedio el tiempo permitido.",
                "warning",
                2600,
                {
                  title: "Sincronizacion pendiente",
                  sound: false
                },
                15000
              );
            } else {
              notify_(
                error?.message || "No se pudo completar la sincronizacion de folios.",
                "error",
                4200,
                {
                  title: "Sincronizacion incompleta",
                  sound: true
                }
              );
            }

            if (typeof onDone === "function") {
              onDone(null, error);
            }
          }

          return null;
        });
      };


      const baseActiva = useMemo(() => {
        return form.tipo === 'Acomodo' ? foliosAcomodo : foliosSurtido;
      }, [form.tipo, foliosAcomodo, foliosSurtido]);

      const idsUnicosEnCola = useMemo(() => {
        return new Set(
          cola.map(item =>
            normalizarTexto(item.idSeleccionado?.idUnico || item.codigo || "")
          ).filter(Boolean)
        );
      }, [cola]);

      
      const resumenCola = useMemo(() => {
        const total = cola.length;

        const acomodos = cola.filter(item => item.tipo === 'Acomodo').length;
        const surtidos = cola.filter(item => item.tipo === 'Surtido').length;

        return {
          total,
          acomodos,
          surtidos
        };
      }, [cola]);


      const baseActivaDisponible = useMemo(() => {
        return baseActiva.filter(item => {
          const idNormalizado = normalizarTexto(item.idUnico);
          return !idsUnicosEnCola.has(idNormalizado);
        });
      }, [baseActiva, idsUnicosEnCola]);

      const ubicacionesDisponiblesPorBodega = useMemo(() => {
        const bodega = normalizarTexto(form.bodega);
        if (!bodega) return [];

        return [...new Set(
          mapaUbicacionesExcedentes
            .filter(x => x.bodega === bodega)
            .map(x => x.ubi)
            .filter(Boolean)
        )].sort((a, b) => a.localeCompare(b, 'es', { numeric: true, sensitivity: 'base' }));
      }, [form.bodega, mapaUbicacionesExcedentes]);

      /**
       * Determina si un folio ya participa en la fila de movimientos actual.
       *
       * @param {*} idUnico Identificador por validar.
       * @return {boolean}
       */
      const existeIdUnicoEnCola = (idUnico) => {
        const idNormalizado = normalizarTexto(idUnico);
        if (!idNormalizado) return false;

        return cola.some(item => {
          const idEnFila = normalizarTexto(item.codigo || item.idSeleccionado?.idUnico || "");
          return idEnFila === idNormalizado;
        });
      };

      // ---------------------
      // CARGA INICIAL
      // ---------------------
      useEffect(() => {
        const cargarBootstrap = () => {
          try {
            notify_("Preparando vista de traspasos...", "info", 1400, {
              title: "Inicializando",
              sound: false
            });

            const cacheBootstrap = leerBootstrapDesdeCache();

            if (
              cacheBootstrap &&
              Array.isArray(cacheBootstrap.usuarios) &&
              Array.isArray(cacheBootstrap.bodegas) &&
              Array.isArray(cacheBootstrap.mapaUbicacionesExcedentes)
            ) {

              setUsuarios(cacheBootstrap.usuarios || []);

              setBodegas(
                (cacheBootstrap.bodegas || []).map(x =>
                  String(x || "").trim().toUpperCase()
                )
              );

              setMapaUbicacionesExcedentes(
                normalizarMapaUbicaciones(cacheBootstrap.mapaUbicacionesExcedentes || [])
              );

              const acomodoCache = normalizarFolios(cacheBootstrap.estadoFoliosAcomodo || []);
              const surtidoCache = normalizarFolios(cacheBootstrap.estadoFoliosSurtido || []);

              setFoliosAcomodo(acomodoCache);
              setFoliosSurtido(surtidoCache);

              setFoliosListos(acomodoCache.length > 0 || surtidoCache.length > 0);

              setCargando(false);
              firstLoadDoneRef.current = true;

              notify_("Vista lista. Sincronizando folios en segundo plano...", "info", 1600, {
                title: "Prototipo listo",
                sound: false
              });

              setTimeout(() => {
                if (aplicarFoliosDesdeCacheLocal_()) {
                  return;
                }

                const prefetch =
                  window.APPALMACEN_PREFETCHES &&
                  window.APPALMACEN_PREFETCHES.prototipoFolios
                    ? window.APPALMACEN_PREFETCHES.prototipoFolios
                    : null;

                if (prefetch && prefetch.inFlight) {

                  setSincronizandoFolios(true);

                  let intentos = 0;
                  const maxIntentos = 80;

                  const timerPrefetch = setInterval(() => {
                    intentos++;

                    if (aplicarFoliosDesdeCacheLocal_()) {
                      clearInterval(timerPrefetch);
                      return;
                    }

                    const prefetchActual =
                      window.APPALMACEN_PREFETCHES &&
                      window.APPALMACEN_PREFETCHES.prototipoFolios
                        ? window.APPALMACEN_PREFETCHES.prototipoFolios
                        : null;

                    if (prefetchActual && prefetchActual.ready === true) {
                      clearInterval(timerPrefetch);

                      if (!aplicarFoliosDesdeCacheLocal_()) {
                        refrescarEstadoFolios(null, "silent", false, {
                          bloquearUI: true
                        });
                      }

                      return;
                    }

                    if (prefetchActual && prefetchActual.inFlight === false && prefetchActual.ready !== true) {
                      clearInterval(timerPrefetch);



                      refrescarEstadoFolios(null, "silent", false, {
                        bloquearUI: true
                      });

                      return;
                    }

                    if (intentos >= maxIntentos) {
                      clearInterval(timerPrefetch);

          

                      refrescarEstadoFolios(null, "silent", false, {
                        bloquearUI: true
                      });
                    }
                  }, 300);

                  return;
                }

                refrescarEstadoFolios(null, "silent", false, {
                  bloquearUI: true
                });
              }, 250);

              return;
            }

            /**
            * Fallback:
            * Solo si APPALMACEN Bootstrap no tiene datos base.
            * Este escenario debería ser raro.
            */

            let bootstrapFailureHandlerExecuted = false;

            return actionRun_({
              operation: "TRASPASOS_BOOTSTRAP_FALLBACK",
              viewId: "PrototipoTraspasos",
              controller: "PrototipoTraspasosController_getBootstrap",
              payload: null,
              timeoutMs: 120000,
              waitForPaint: true,
              metadata: {
                reason: "global_bootstrap_missing"
              },

              invoke({ success, failure }) {
                google.script.run
                  .withSuccessHandler(success)
                  .withFailureHandler(failure)
                  .PrototipoTraspasosController_getBootstrap();
              },

              onSuccess(bootstrap) {
                const usuariosRecibidos = bootstrap?.usuarios || [];
                const bodegasRecibidas = (bootstrap?.bodegas || []).map(x =>
                  String(x || "").trim().toUpperCase()
                );
                const mapaUbicacionesRecibido = normalizarMapaUbicaciones(
                  bootstrap?.mapaUbicacionesExcedentes || []
                );
                const acomodoRecibidos = normalizarFolios(
                  bootstrap?.estadoFoliosAcomodo || []
                );
                const surtidoRecibidos = normalizarFolios(
                  bootstrap?.estadoFoliosSurtido || []
                );

                setUsuarios(usuariosRecibidos);
                setBodegas(bodegasRecibidas);
                setMapaUbicacionesExcedentes(mapaUbicacionesRecibido);
                setFoliosAcomodo(acomodoRecibidos);
                setFoliosSurtido(surtidoRecibidos);
                setFoliosListos(
                  acomodoRecibidos.length > 0 || surtidoRecibidos.length > 0
                );

                guardarBootstrapEnCache({
                  usuarios: usuariosRecibidos,
                  bodegas: bodegasRecibidas,
                  mapaUbicacionesExcedentes: mapaUbicacionesRecibido,
                  estadoFoliosAcomodo: acomodoRecibidos,
                  estadoFoliosSurtido: surtidoRecibidos,
                  estadoFolios: acomodoRecibidos,
                  ultimaSyncFolios: Date.now()
                });

                setCargando(false);
                firstLoadDoneRef.current = true;

                notify_("Vista sincronizada correctamente.", "success", 1800, {
                  title: "Sistema listo",
                  sound: false
                });

                return {
                  usuarios: usuariosRecibidos.length,
                  bodegas: bodegasRecibidas.length,
                  ubicaciones: mapaUbicacionesRecibido.length,
                  acomodo: acomodoRecibidos.length,
                  surtido: surtidoRecibidos.length
                };
              },

              onFailure(error) {
                bootstrapFailureHandlerExecuted = true;
                setCargando(false);

                notify_(
                  "No se pudieron recuperar los datos del prototipo.",
                  "error",
                  4200,
                  {
                    title: "Error al sincronizar",
                    sound: true
                  }
                );
              },

              getResultMetadata(bootstrap, counts) {
                return counts || {};
              }
            }).catch(error => {
              setCargando(false);

              reportViewError_(
                "TRASPASOS_BOOTSTRAP_FALLBACK_FAILED",
                error,
                {
                  failureHandlerExecuted: bootstrapFailureHandlerExecuted
                }
              );

              if (!bootstrapFailureHandlerExecuted) {
                notify_(
                  error?.message || "No se pudo completar la carga inicial del prototipo.",
                  "error",
                  4200,
                  {
                    title: "Carga inicial incompleta",
                    sound: true
                  }
                );
              }

              return null;
            });

          } catch (err) {
            reportViewError_("TRASPASOS_INITIALIZATION_FAILED", err);

            notify_(
              "No se pudo inicializar la vista del prototipo.",
              "error",
              4200,
              {
                title: "Error inesperado",
                sound: true
              }
            );

            setCargando(false);
          }
        };

        cargarBootstrap();
      }, []);

      useEffect(() => {
        foliosListosRef.current = foliosListos === true;
      }, [foliosListos]);

      // Autoenfoque al QR cuando esté lista la vista
      useEffect(() => {
        if (!cargando && !procesando) {
          enfocarQR();
        }
      }, [cargando, procesando, form.tipo]);

      useEffect(() => {
        if (cargando) return;

        const cache = leerBootstrapDesdeCache();
        const ultimaSync = Number(cache?.ultimaSyncFolios || 0);
        const edadMs = Date.now() - ultimaSync;

        const prefetch =
          window.APPALMACEN_PREFETCHES &&
          window.APPALMACEN_PREFETCHES.prototipoFolios
            ? window.APPALMACEN_PREFETCHES.prototipoFolios
            : null;

        if (!(prefetch && prefetch.inFlight)) {
          if (!ultimaSync || edadMs > 30000) {
            refrescarEstadoFolios(null, "auto", false, {
              bloquearUI: false
            });
          }
        }

        if (syncFoliosTimerRef.current) {
          clearInterval(syncFoliosTimerRef.current);
        }

        syncFoliosTimerRef.current = setInterval(() => {
          if (procesando) return;

          refrescarEstadoFolios(null, "auto", false, {
            bloquearUI: false
          });
        }, 30000);

        return () => {
          if (syncFoliosTimerRef.current) {
            clearInterval(syncFoliosTimerRef.current);
            syncFoliosTimerRef.current = null;
          }
        };
      }, [cargando, procesando]);

      useEffect(() => {
        const handleVisibilityChange = () => {
          if (document.visibilityState === "visible" && !cargando && !procesando) {
            refrescarEstadoFolios(null, "auto", false, {
              bloquearUI: false
            });
          }
        };

        window.addEventListener("focus", handleVisibilityChange);
        document.addEventListener("visibilitychange", handleVisibilityChange);

        return () => {
          window.removeEventListener("focus", handleVisibilityChange);
          document.removeEventListener("visibilitychange", handleVisibilityChange);
        };
      }, [cargando, procesando]);

      // Flujo post-escaneo:
      // espera a que React ya tenga form.idSeleccionado antes de mover foco
      useEffect(() => {
        if (!form.idSeleccionado) return;

        const paso = siguientePasoPostScanRef.current;
        if (!paso) return;

        if (paso === "BODEGA" && form.tipo === "Acomodo") {
          siguientePasoPostScanRef.current = null;
          setTimeout(() => {
            bodegaInputRef.current?.focus();
            bodegaInputRef.current?.select?.();
          }, 0);
          return;
        }

        if (paso === "CANTIDAD" && form.tipo === "Surtido") {
          siguientePasoPostScanRef.current = null;
          setTimeout(() => {
            cantidadInputRef.current?.focus();
            cantidadInputRef.current?.select?.();
          }, 0);
          return;
        }

        if (paso === "AUTO_ADD_ACOMODO" && form.tipo === "Acomodo") {
          if (normalizarTexto(form.bodega) && normalizarTexto(form.ubicacion)) {
            siguientePasoPostScanRef.current = null;
            setTimeout(() => {
              handleAdd({
                preventDefault: () => {}
              });
            }, 0);
          } else {
            siguientePasoPostScanRef.current = "BODEGA";
            setTimeout(() => {
              bodegaInputRef.current?.focus();
              bodegaInputRef.current?.select?.();
            }, 0);
          }
        }
      }, [form.idSeleccionado, form.tipo, form.bodega, form.ubicacion]);

      useEffect(() => {
        const root = document.getElementById("render-prototipo-traspasos");
        if (!root) return;

        const parent = root.parentElement;
        if (!parent) return;

        const previousOverflow = parent.style.overflow;
        const previousMinHeight = parent.style.minHeight;
        const previousHeight = parent.style.height;

        parent.style.overflow = "hidden";
        parent.style.minHeight = "0";

        if (!parent.style.height) {
          parent.style.height = "100%";
        }

        return () => {
          parent.style.overflow = previousOverflow;
          parent.style.minHeight = previousMinHeight;
          parent.style.height = previousHeight;
        };
      }, []);

      // ---------------------------------------------------------
      // CAMBIO DE CANTIDAD
      // ---------------------------------------------------------
      /**
       * Actualiza la cantidad respetando las reglas de acomodo y surtido.
       *
       * @param {*} valor Cantidad capturada.
       * @return {void}
       */
      const handleCantidadChange = (valor) => {
        if (form.tipo === 'Acomodo' && form.idSeleccionado) {
          return;
        }

        const numVal = parseFloat(valor);
        const saldoDisponible = form.idSeleccionado?.balance || 0;

        if (form.tipo === 'Surtido' && numVal > saldoDisponible) {
          notify_(
            `Solo hay ${saldoDisponible} pzas en este excedente.`,
            "warning",
            3200,
            {
              title: "Cantidad excedida",
              sound: true
            }
          );
          return;
        }

        setForm(prev => ({ ...prev, cantidad: valor }));
      };

      // ---------------------------------------------------------
      // CAMBIO DE INPUT QR / FOLIO
      // ---------------------------------------------------------
      /**
       * Procesa cambios en el campo de escaneo y vincula el folio encontrado.
       *
       * @param {Event} e Evento de entrada.
       * @return {void}
       */
      const handleInputChange = (e) => {
        const val = e.target.value.toUpperCase().trim();

        setForm(prev => {
          const infoFolio = baseActiva.find(f => f.idUnico === val);

          if (infoFolio) {
            return {
              ...prev,
              codigo: val,
              // En surtido tomamos origen real del folio
              // En acomodo preservamos destino actual si ya estaba capturado
              bodega: prev.tipo === 'Surtido'
                ? (infoFolio.bodegaActual || prev.bodega)
                : prev.bodega,
              ubicacion: prev.tipo === 'Surtido'
                ? (infoFolio.ubicacionActual || prev.ubicacion)
                : prev.ubicacion,
              cantidad: infoFolio.balance || prev.cantidad,
              idSeleccionado: infoFolio
            };
          }

          return {
            ...prev,
            codigo: val,
            cantidad: prev.tipo === "Surtido" ? "" : prev.cantidad,
            idSeleccionado: null
          };

        });

        const match = baseActiva.find(f => f.idUnico === val);

        if (match) {
          notifyOnce_(
            `folio-verificado-${val}`,
            `${match.sku} | ${match.bodegaActual || 'SIN BODEGA'} | ${match.ubicacionActual || 'SIN UBICACIÓN'} | Saldo: ${match.balance}`,
            "info",
            1800,
            {
              title: "Folio verificado",
              sound: false
            },
            1500
          );

          if (idsUnicosEnCola.has(normalizarTexto(match.idUnico || val))) {
            notifyOnce_(
              `folio-oculto-en-cola-${val}`,
              `El excedente ${match.idUnico || val} ya está en la fila de movimientos por aplicar.`,
              "warning",
              2500,
              {
                title: "ID ya agregado",
                sound: true
              },
              2000
            );
          }

          if (existeIdUnicoEnCola(match.idUnico || val)) {
            notifyOnce_(
              `folio-duplicado-${val}`,
              `El excedente ${match.idUnico || val} ya está agregado en la fila actual.`,
              "warning",
              2600,
              {
                title: "ID duplicado detectado",
                sound: true
              },
              2000
            );
          }
        }
      };

      // ---------------------------------------------------------
      // AGREGAR A COLA
      // ---------------------------------------------------------
      /**
       * Valida y agrega un movimiento a la fila local.
       *
       * @param {Event|Object} e Evento de formulario o contrato compatible.
       * @return {void}
       */
      const handleAdd = (e) => {
        if (e && typeof e.preventDefault === 'function') {
          e.preventDefault();
        }

        const solicitanteLimpio = normalizarTexto(form.solicitante);
        const codigoLimpio = normalizarTexto(form.codigo);
        const bodegaLimpia = normalizarTexto(form.bodega);
        const ubicacionLimpia = normalizarTexto(form.ubicacion);

        const usuarioValido = usuarios.some(
          u => normalizarTexto(u.nombre) === solicitanteLimpio
        );

        if (!usuarioValido) {
          notify_(
            'Selecciona un solicitante válido para continuar.',
            "error",
            3200,
            {
              title: "Traspaso sin solicitante",
              sound: true
            }
          );
          return;
        }

        if (!codigoLimpio) {
          notify_(
            'Escanea, captura o selecciona un folio válido para continuar.',
            "warning",
            3200,
            {
              title: "Traspaso sin ID",
              sound: true
            }
          );
          return;
        }

        if (!form.idSeleccionado) {
          notify_(
            'El folio ingresado no existe en la fuente activa.',
            "error",
            3200,
            {
              title: "Folio no reconocido",
              sound: true
            }
          );
          return;
        }

        const idUnicoActual = normalizarTexto(form.idSeleccionado?.idUnico || codigoLimpio);
        if (existeIdUnicoEnCola(idUnicoActual)) {
          notify_(
            `El excedente ${idUnicoActual} ya fue agregado a la fila. No se permiten duplicados.`,
            "warning",
            3200,
            {
              title: "ID duplicado",
              sound: true
            }
          );
          return;
        }

        const cant = parseFloat(form.cantidad);
        if (!cant || cant <= 0) {
          notify_(
            'Debes ingresar una cantidad válida.',
            "warning",
            3000,
            {
              title: "Cantidad inválida",
              sound: true
            }
          );
          return;
        }

        if (form.tipo === 'Acomodo' && !bodegaLimpia) {
          notify_(
            'Debes indicar una bodega destino para el acomodo.',
            "warning",
            3000,
            {
              title: "Bodega requerida",
              sound: true
            }
          );
          return;
        }

        if (form.tipo === 'Acomodo' && !ubicacionLimpia) {
          notify_(
            'Debes indicar una ubicación destino para el acomodo.',
            "warning",
            3000,
            {
              title: "Ubicación requerida",
              sound: true
            }
          );
          return;
        }

        if (
          form.tipo === 'Acomodo' &&
          form.idSeleccionado &&
          Number(cant) !== Number(form.idSeleccionado.balance)
        ) {
          notify_(
            `En acomodo debes usar la cantidad completa del folio: ${form.idSeleccionado.balance} pzas.`,
            "warning",
            3400,
            {
              title: "Cantidad bloqueada",
              sound: true
            }
          );
          return;
        }

        const nuevoItem = {
          ...form,
          tipo: form.tipo,
          solicitante: solicitanteLimpio,
          codigo: codigoLimpio,
          bodega: bodegaLimpia,
          cantidad: cant,
          ubicacion: ubicacionLimpia,
          id: generarIdOperacion_(),
          timestamp: new Date().toLocaleTimeString(),
          sku: form.idSeleccionado.sku,
          descripcion: form.idSeleccionado.descripcion,
          idSeleccionado: form.idSeleccionado
        };

        if (
          form.tipo === "Surtido" &&
          form.idSeleccionado &&
          Number(form.cantidad || 0) <
            Number(form.idSeleccionado.balance || 0)
        ) {
          const saldoPosterior =
            Math.round(
              (
                Number(form.idSeleccionado.balance || 0) -
                Number(form.cantidad || 0) +
                Number.EPSILON
              ) * 100
            ) / 100;

          notify_(
            `El folio conservara el mismo IdUnico ` +
            `con un saldo actualizado de ${saldoPosterior} pzas.`,
            "info",
            3500,
            {
              title: "Surtido parcial detectado",
              sound: false
            }
          );
        }

        setCola(prev => [nuevoItem, ...prev]);

        siguientePasoPostScanRef.current = null;

        setForm(prev => ({
          ...prev,
          codigo: '',
          // En acomodo conservamos destino para escaneo continuo
          bodega: prev.tipo === 'Acomodo' ? prev.bodega : '',
          cantidad: '',
          ubicacion: prev.tipo === 'Acomodo' ? prev.ubicacion : '',
          idSeleccionado: null
        }));

        notify_("Movimiento añadido correctamente a la fila.", "success", 1500, {
          title: "Añadido a fila",
          sound: false
        });

        enfocarQR();
      };

      // ---------------------------------------------------------
      // ENVÍO AL BACKEND
      // ---------------------------------------------------------
      
      /**
       * Envía la fila al backend y, cuando corresponde, imprime etiquetas de
       * remanente manteniendo protección contra envíos concurrentes.
       *
       * @return {void}
       */
      const enviarASheets = () => {
        if (envioEnCursoRef.current || cola.length === 0) return;

        envioEnCursoRef.current = true;

        const colaEnviada = cola.map(item => ({
          ...item,
          idSeleccionado: item.idSeleccionado ? { ...item.idSeleccionado } : null
        }));

        if (
          !window.ImpresionModoUtilidades ||
          typeof window.ImpresionModoUtilidades.getMode !== "function" ||
          typeof window.ImpresionModoUtilidades.imprimirResultado !== "function"
        ) {
          notify_("No se encontro el modulo global de impresion.", "error", 4200, {
            title: "Impresion no disponible",
            sound: true
          });
          envioEnCursoRef.current = false;
          return;
        }

        setProcesando(true);

        const modoImpresion = window.ImpresionModoUtilidades.getMode();
        const hayImpresionEsperada = colaEnviada.some(item =>
          item.tipo === "Surtido" &&
          item.idSeleccionado &&
          Number(item.cantidad || 0) > 0 &&
          Number(item.cantidad || 0) < Number(item.idSeleccionado.balance || 0)
        );

        let ventanaLocal = null;
        let processFailureHandlerExecuted = false;

        if (modoImpresion === "LOCAL" && hayImpresionEsperada) {
          ventanaLocal = window.open("", "_blank", "width=900,height=700");

          if (!ventanaLocal) {
            envioEnCursoRef.current = false;
            setProcesando(false);
            notify_(
              "La ventana fue bloqueada. Permite los pop-ups para imprimir la etiqueta de saldo.",
              "warning",
              4200,
              { title: "Pop-up bloqueado", sound: true }
            );
            return;
          }

          ventanaLocal.document.open();
          ventanaLocal.document.write(`
            <html>
              <head>
                <title>Generando etiqueta de remanente...</title>
                <style>
                  body { font-family: Arial,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; color:#5f6368; background:#f8f9fa; }
                  .spinner { width:50px; height:50px; border:5px solid #f3f3f3; border-top:5px solid #d93025; border-radius:50%; animation:spin 1s linear infinite; margin-bottom:20px; }
                  @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
                  .loader { text-align:center; max-width:440px; padding:0 24px; }
                  .loader h3 { margin:0 0 8px; font-size:22px; font-weight:700; color:#1c1d1f; }
                  .loader p { margin:0; font-size:14px; line-height:1.5; }
                </style>
              </head>
              <body>
                <div class="spinner"></div>
                <div class="loader">
                  <h3>Preparando etiqueta actualizada...</h3>
                  <p>Espera un momento mientras se aplica el movimiento y se genera la etiqueta con el saldo actual.</p>
                </div>
              </body>
            </html>
          `);
          ventanaLocal.document.close();
        }

        notify_(
          hayImpresionEsperada
            ? (modoImpresion === "ONLINE"
                ? "Aplicando movimientos y preparando etiquetas de saldo para impresion ONLINE..."
                : "Aplicando movimientos y preparando etiquetas de saldo para impresion LOCAL...")
            : "Aplicando movimientos del prototipo...",
          "info",
          1800,
          { title: "Aplicando movimientos", sound: false }
        );

        actionRun_({
          operation: "TRASPASOS_PROCESAR_MOVIMIENTOS",
          viewId: "PrototipoTraspasos",
          controller: "PrototipoTraspasosController_procesarMovimientosFinal",
          payload: colaEnviada,
          timeoutMs: 180000,
          waitForPaint: true,
          metadata: {
            movimientos: colaEnviada.length,
            acomodos: colaEnviada.filter(item => item.tipo === "Acomodo").length,
            surtidos: colaEnviada.filter(item => item.tipo === "Surtido").length,
            modoImpresion,
            hayImpresionEsperada
          },

          invoke({ success, failure }) {
            google.script.run
              .withSuccessHandler(success)
              .withFailureHandler(failure)
              .PrototipoTraspasosController_procesarMovimientosFinal(colaEnviada);
          },

          onSuccess(resultado) {
            const res = typeof resultado === "string"
              ? { ok: true, htmlImpresion: resultado, printJob: null, legacy: true }
              : (resultado || {});

            const totalYaAplicados = Number(res.totalYaAplicados || 0);
            const totalNuevos = Number(res.totalNuevos || 0);
            const remanentesGenerados = Number(res.remanentesGenerados || 0);
            const hayRemanentes = remanentesGenerados > 0 && Boolean(res.htmlImpresion);

            if (!hayRemanentes && ventanaLocal && !ventanaLocal.closed) {
              ventanaLocal.close();
            }

            if (hayRemanentes) {
              const modoActual = window.ImpresionModoUtilidades.getMode();

              if (modoActual === "ONLINE" && !res.printJob) {
                if (ventanaLocal && !ventanaLocal.closed) ventanaLocal.close();
                throw new Error(
                  "Se genero una etiqueta de saldo, pero no se recibio el paquete ONLINE."
                );
              }

              window.ImpresionModoUtilidades.imprimirResultado(res, {
                titulo: "Etiqueta de saldo parcial",
                fallbackLocal: false,
                ventanaLocal
              });

              notify_(
                modoActual === "ONLINE"
                  ? "Etiqueta de saldo enviada por ONLINE."
                  : "Etiqueta de saldo lista para impresion LOCAL.",
                "success",
                2800,
                {
                  title: modoActual === "ONLINE" ? "Impresion ONLINE" : "Impresion LOCAL",
                  sound: true
                }
              );
            }

            envioEnCursoRef.current = false;
            setProcesando(false);
            setCola([]);
            setForm(prev => ({
              ...prev,
              codigo: "",
              bodega: "",
              cantidad: "",
              ubicacion: "",
              idSeleccionado: null
            }));

            siguientePasoPostScanRef.current = null;
            enfocarQR();

            notify_(
              totalYaAplicados > 0 && totalNuevos === 0
                ? "La operacion ya habia sido aplicada. No se duplicaron movimientos."
                : hayRemanentes
                  ? "Inventario actualizado. Se genero la etiqueta con el saldo actual."
                  : "Inventario actualizado correctamente.",
              "success",
              2800,
              {
                title: totalYaAplicados > 0 && totalNuevos === 0
                  ? "Operacion ya aplicada"
                  : "Operacion exitosa",
                sound: true
              }
            );

            refrescarEstadoFolios((data, err) => {
              if (err) {
                notify_(
                  "La operacion se guardo, pero no se pudo refrescar el estado de folios.",
                  "warning",
                  3200,
                  { title: "Actualizacion parcial", sound: false }
                );
                return;
              }

              notify_("Estado de folios actualizado correctamente.", "info", 1400, {
                title: "Folios sincronizados",
                sound: false
              });
            }, "silent", true, { bloquearUI: false });

            return res;
          },

          onFailure(err) {
            processFailureHandlerExecuted = true;


            if (ventanaLocal && !ventanaLocal.closed) ventanaLocal.close();
            envioEnCursoRef.current = false;
            setProcesando(false);
            siguientePasoPostScanRef.current = null;
            enfocarQR();

            notify_(
              err?.message || "No se pudo procesar la operacion.",
              "error",
              4200,
              { title: "Error", sound: true }
            );
          },

          getResultMetadata(resultado, res) {
            return {
              responseOk: res?.ok === true,
              totalNuevos: Number(res?.totalNuevos || 0),
              totalYaAplicados: Number(res?.totalYaAplicados || 0),
              remanentesGenerados: Number(res?.remanentesGenerados || 0),
              legacyResponse: res?.legacy === true
            };
          }
        }).catch(error => {
          if (ventanaLocal && !ventanaLocal.closed) {
            ventanaLocal.close();
          }

          envioEnCursoRef.current = false;
          setProcesando(false);
          siguientePasoPostScanRef.current = null;
          enfocarQR();

          reportViewError_(
            "TRASPASOS_PROCESAR_MOVIMIENTOS_FAILED",
            error,
            {
              movimientos: colaEnviada.length,
              modoImpresion,
              failureHandlerExecuted: processFailureHandlerExecuted
            }
          );

          if (!processFailureHandlerExecuted) {
            notify_(
              error?.message || "No se pudo completar la operacion.",
              "error",
              4200,
              {
                title: "Operacion incompleta",
                sound: true
              }
            );
          }
        });
      };

      
      useEffect(() => {
        const root = document.getElementById("render-prototipo-traspasos");
        if (!root) return;

        const parent = root.parentElement;
        if (!parent) return;

        const previousOverflow = parent.style.overflow;
        const previousMinHeight = parent.style.minHeight;
        const previousHeight = parent.style.height;

        parent.style.overflow = "hidden";
        parent.style.minHeight = "0";

        if (!parent.style.height) {
          parent.style.height = "100%";
        }

        return () => {
          parent.style.overflow = previousOverflow;
          parent.style.minHeight = previousMinHeight;
          parent.style.height = previousHeight;
        };
      }, []);


      // ---------------------------------------------------------
      // UI
      // ---------------------------------------------------------
      return (
        <div className="proto-app-shell flex flex-col h-full w-full relative">
          <div className="proto-main-layout">

            {/* PANEL LATERAL */}
            <div className="proto-left-panel border-r border-[#dadce0] bg-white px-6 pt-4 pb-6 shrink-0 z-10">
              <div className="proto-left-panel-inner">
                <form onSubmit={handleAdd} className="min-h-full flex flex-col gap-2">

                  {/* CABECERA SUPERIOR */}
                  <div className="space-y-4">
                    <div className="flex p-1 bg-gray-100 rounded-xl">
                      {['Acomodo', 'Surtido'].map(t => (
                        <button
                          key={t}
                          type="button"
                          onClick={() => {
                            siguientePasoPostScanRef.current = null;

                            setForm({
                              ...form,
                              tipo: t,
                              codigo: '',
                              bodega: '',
                              cantidad: '',
                              ubicacion: '',
                              idSeleccionado: null
                            });
                          }}
                          className={`flex-1 py-2 text-[15px] font-black uppercase rounded-lg transition-all ${
                            form.tipo === t ? 'bg-white text-[#d93025] shadow-sm' : 'text-gray-400'
                          }`}
                        >
                          {t}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* CUERPO EN 2 COLUMNAS */}
                  <div className="grid grid-cols-2 gap-6 items-start">

                    {/* COLUMNA A: IDENTIFICACIÓN */}
                    <div className="space-y-4">

                      {/* Solicitante */}
                        <div className="space-y-2">
                          <label className="proto-label ml-1">
                            Solicitante
                          </label>

                          <div className="relative">
                            <input
                              list="lista-usuarios-prototipo"
                              disabled={cargando}
                              className={`w-full border rounded-xl px-4 proto-input proto-form-input-unificado uppercase outline-none transition-all ${
                                cargando
                                  ? 'bg-gray-200 text-gray-500 cursor-not-allowed border-gray-300'
                                  : 'bg-gray-50 border-[#dadce0] focus:border-[#d93025] focus:bg-white'
                              }`}
                              placeholder={
                                cargando
                                  ? "Cargando solicitantes..."
                                  : "Escribe o selecciona un solicitante"
                              }
                              value={form.solicitante}
                              onChange={(e) =>
                                setForm({
                                  ...form,
                                  solicitante: e.target.value.toUpperCase()
                                })
                              }
                            />

                            <datalist id="lista-usuarios-prototipo">
                              {usuarios.map((u, index) => (
                                <option key={index} value={u.nombre} />
                              ))}
                            </datalist>
                          </div>
                        </div>

                      {/* QR / FOLIO */}
                      <div className="space-y-2">
                        <label className="proto-label ml-1">
                          Escaneo de QR
                        </label>

                        <div className="relative group">
                          <input
                          ref={qrInputRef}
                          list="lista-ids-excedentes"
                          disabled={!foliosListos}
                          className={`w-full border rounded-xl px-4 proto-input proto-form-input-unificado uppercase outline-none transition-all ${
                            !foliosListos
                              ? 'bg-gray-200 text-gray-500 cursor-not-allowed border-gray-300'
                              : 'bg-gray-50 border-[#dadce0] focus:border-[#d93025] focus:bg-white'
                          }`}
                          placeholder={
                            !foliosListos
                              ? "Esperando folios disponibles..."
                              : form.tipo === 'Acomodo'
                                ? 'Escanea un excedente con status DISPONIBLE'
                                : 'Escanea un excedente con saldo disponible para surtido'
                          }
                          value={form.codigo}
                          onChange={handleInputChange}
                          onKeyDown={(e) => {
                            if (!foliosListos) {
                              e.preventDefault();
                              notify_(
                                "Los folios todavía se están sincronizando. Espera un momento.",
                                "info",
                                1800,
                                {
                                  title: "Sincronización en curso",
                                  sound: false
                                }
                              );
                              return;
                            }

                            if (e.key !== 'Enter') return;

                            e.preventDefault();

                            const valorEscaneado = normalizarTexto(e.currentTarget.value);
                            const match = baseActiva.find(f => normalizarTexto(f.idUnico) === valorEscaneado);

                            if (!valorEscaneado) {
                              notify_(
                                "Escanea o captura un excedente válido antes de continuar.",
                                "warning",
                                2200,
                                {
                                  title: "ID vacío",
                                  sound: true
                                }
                              );
                              return;
                            }

                            if (!match) {
                              notify_(
                                "El excedente escaneado no existe en la fuente activa.",
                                "error",
                                2600,
                                {
                                  title: "ID no reconocido",
                                  sound: true
                                }
                              );
                              return;
                            }

                            if (existeIdUnicoEnCola(match.idUnico || valorEscaneado)) {
                              notify_(
                                `El excedente ${match.idUnico || valorEscaneado} ya está agregado en la fila.`,
                                "warning",
                                2600,
                                {
                                  title: "ID duplicado",
                                  sound: true
                                }
                              );
                              return;
                            }

                            if (form.tipo === "Surtido") {
                              siguientePasoPostScanRef.current = "CANTIDAD";
                            } else {
                              const hayBodega = normalizarTexto(form.bodega);
                              const hayUbicacion = normalizarTexto(form.ubicacion);

                              siguientePasoPostScanRef.current =
                                hayBodega && hayUbicacion
                                  ? "AUTO_ADD_ACOMODO"
                                  : "BODEGA";
                            }

                            setForm(prev => ({
                              ...prev,
                              codigo: valorEscaneado,
                              bodega: prev.tipo === 'Surtido'
                                ? (match.bodegaActual || prev.bodega)
                                : prev.bodega,
                              ubicacion: prev.tipo === 'Surtido'
                                ? (match.ubicacionActual || prev.ubicacion)
                                : prev.ubicacion,
                              cantidad: match.balance || prev.cantidad,
                              idSeleccionado: match
                            }));
                          }}
                        />

                          <datalist id="lista-ids-excedentes">
                            {baseActivaDisponible.map((item, index) => (
                              <option key={`${form.tipo}-${index}-${item.idUnico}`} value={item.idUnico}>
                                {item.sku} | {item.bodegaActual || 'SIN BODEGA'} | {item.ubicacionActual || 'SIN UBICACION'} | Saldo: {item.balance}
                              </option>
                            ))}
                          </datalist>

                          {form.idSeleccionado && (
                            <div className="absolute right-3 top-3 text-green-500 animate-pulse">
                              <LocalIcon name="check-circle" size={16} />
                            </div>
                          )}
                        </div>
                      </div>

                      {/* INFORMACIÓN REFERENCIADA */}
                      {form.codigo && (
                        <div className="proto-id-card bg-[#1c1d1f] space-y-3 border border-gray-800 fade-in shadow-xl">
                          <div className="flex items-start gap-2.5">
                            <div className="p-1.5 bg-gray-800 rounded-lg">
                              <LocalIcon name="tag" size={15} className="text-red-500" />
                            </div>

                            <div className="flex flex-col min-w-0">
                              <span className="text-[12px] font-black text-gray-500 uppercase tracking-[0.18em]">
                                SKU Vinculado
                              </span>
                              <span className="text-white proto-mono text-[17px] font-black mt-1 break-all">
                                {form.idSeleccionado ? form.idSeleccionado.sku : "Sin Ubicar"}
                              </span>
                            </div>
                          </div>

                          <div className="flex items-start gap-2.5 border-t border-gray-800 pt-2.5">
                            <div className="p-1.5 bg-gray-800 rounded-lg">
                              <LocalIcon name="file-text" size={15} className="text-red-500" />
                            </div>

                            <div className="flex flex-col min-w-0">
                              <span className="text-[12px] font-black text-gray-500 uppercase tracking-[0.18em]">
                                Descripción
                              </span>
                              <span className="text-gray-300 text-[15px] font-bold leading-snug uppercase italic mt-1 break-words">
                                {form.idSeleccionado
                                  ? form.idSeleccionado.descripcion
                                  : "No se encontró registro en la base de datos"}
                              </span>
                            </div>
                          </div>

                          {form.idSeleccionado && (
                            <div className="grid grid-cols-2 gap-2.5 border-t border-gray-800 pt-2.5">
                              <div className="bg-gray-900 rounded-xl px-3 py-2.5">
                                <span className="block text-[11px] font-black uppercase tracking-[0.18em] text-gray-500">
                                  Bodega
                                </span>
                                <span className="block text-[14px] font-bold text-white mt-1 tracking-[0.05em] break-words">
                                  {form.tipo === 'Surtido'
                                    ? (form.idSeleccionado.bodegaActual || 'SIN BODEGA')
                                    : (form.bodega || 'SIN SELECCIÓN')}
                                </span>
                              </div>

                              <div className="bg-gray-900 rounded-xl px-3 py-2.5">
                                <span className="block text-[11px] font-black uppercase tracking-[0.18em] text-gray-500">
                                  Ubicación
                                </span>
                                <span className="block text-[14px] font-bold text-white mt-1 tracking-[0.05em] break-words">
                                  {form.ubicacion || 'SIN UBICACIÓN'}
                                </span>
                              </div>
                            </div>
                          )}
                        </div>
                      )}

                      {/* SALDO DISPONIBLE */}
                      {form.tipo === 'Surtido' && form.idSeleccionado && (
                        <div className="proto-saldo-card p-4 fade-in mt-2">
                          <div className="flex items-center justify-between mb-3">
                            <span className="proto-saldo-badge">
                              Disponible para surtido
                            </span>

                            <div className="text-white opacity-90">
                              <LocalIcon name="shield-alert" size={18} />
                            </div>
                          </div>

                          <div className="flex items-end justify-between gap-4">
                            <div className="flex flex-col">
                              <span className="text-[13px] text-red-100 font-black uppercase tracking-[0.18em]">
                                Saldo actual
                              </span>
                              <span className="text-[12px] text-red-50/90 font-semibold uppercase tracking-[0.12em] mt-1">
                                Piezas listas para surtido inmediato
                              </span>
                            </div>

                            <div className="text-right">
                              <span className="proto-alert-number text-white font-mono">
                                {form.idSeleccionado.balance}
                              </span>
                              <div className="text-[12px] text-red-100 font-black uppercase tracking-[0.16em] mt-1">
                                Pzas
                              </div>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>

                    {/* COLUMNA B: CONFIGURACIÓN */}
                    <div className="space-y-4">

                      {/* Bodega */}
                      <div className="space-y-2">
                        <label className="proto-label ml-1">
                          Bodega
                        </label>

                        <input
                          ref={bodegaInputRef}
                          list="lista-bodegas-prototipo"
                          className={`w-full border rounded-xl px-4 proto-input proto-form-input-unificado uppercase outline-none transition-all ${
                            (form.tipo === 'Surtido' && form.idSeleccionado)
                              ? 'bg-gray-200 text-gray-500 cursor-not-allowed'
                              : 'bg-gray-50 border-[#dadce0] focus:border-[#d93025]'
                          }`}
                          placeholder={form.tipo === 'Acomodo' ? 'Selecciona una bodega' : 'Bodega actual'}
                          readOnly={form.tipo === 'Surtido' && form.idSeleccionado}
                          value={form.bodega}
                          onChange={(e) => setForm({
                            ...form,
                            bodega: e.target.value.toUpperCase(),
                            ubicacion: form.ubicacion
                          })}
                          onKeyDown={(e) => {
                            if (e.key === 'Enter' && form.tipo === 'Acomodo') {
                              e.preventDefault();

                              if (!normalizarTexto(form.bodega)) {
                                notify_(
                                  "Selecciona una bodega válida antes de continuar.",
                                  "warning",
                                  2200,
                                  {
                                    title: "Bodega requerida",
                                    sound: true
                                  }
                                );
                                return;
                              }

                              if (normalizarTexto(form.ubicacion)) {
                                handleAdd(e);
                                return;
                              }

                              ubicacionInputRef.current?.focus();
                              ubicacionInputRef.current?.select?.();
                            }
                          }}
                        />

                        <datalist id="lista-bodegas-prototipo">
                          {bodegas.map((bodega, index) => (
                            <option key={index} value={bodega} />
                          ))}
                        </datalist>
                      </div>

                      {/* Ubicación */}
                      <div className="space-y-2">
                        <label className="proto-label ml-1">
                          Ubicación
                        </label>

                        <input
                          ref={ubicacionInputRef}
                          list="lista-ubicaciones-prototipo"
                          className={`w-full border rounded-xl px-4 proto-input proto-form-input-unificado uppercase outline-none transition-all ${
                            (form.tipo === 'Surtido' && form.idSeleccionado)
                              ? 'bg-gray-200 text-gray-500 cursor-not-allowed'
                              : 'bg-gray-50 border-[#dadce0] focus:border-[#d93025]'
                          }`}
                          placeholder={form.tipo === 'Acomodo' ? "Selecciona una ubicación" : "Ubicación actual"}
                          readOnly={form.tipo === 'Surtido' && form.idSeleccionado}
                          value={form.ubicacion}
                          onChange={e => setForm({ ...form, ubicacion: e.target.value.toUpperCase() })}
                          onKeyDown={(e) => {
                            if (e.key === 'Enter' && form.tipo === 'Acomodo') {
                              e.preventDefault();

                              if (!normalizarTexto(form.ubicacion)) {
                                notify_(
                                  "Selecciona una ubicación válida antes de continuar.",
                                  "warning",
                                  2200,
                                  {
                                    title: "Ubicación requerida",
                                    sound: true
                                  }
                                );
                                return;
                              }

                              handleAdd(e);
                            }
                          }}
                        />

                        <datalist id="lista-ubicaciones-prototipo">
                          {ubicacionesDisponiblesPorBodega.map((ubi, index) => (
                            <option key={index} value={ubi} />
                          ))}
                        </datalist>
                      </div>

                      {/* Cantidad */}
                      <div className="space-y-2">
                        <label className="proto-label ml-1">
                          Cant.
                        </label>

                        <input
                          ref={cantidadInputRef}
                          id="input-cantidad"
                          type="number"
                          readOnly={form.tipo === 'Acomodo' && !!form.idSeleccionado}
                          className={`w-full border rounded-xl px-4 proto-input proto-form-input-unificado uppercase outline-none transition-all ${
                            (form.tipo === 'Acomodo' && form.idSeleccionado)
                              ? 'bg-gray-200 text-gray-600 cursor-not-allowed border-gray-300'
                              : 'bg-gray-50 border-[#dadce0] focus:border-[#d93025]'
                          }`}
                          placeholder={form.tipo === 'Acomodo' ? 'Cantidad fijada por el folio' : '0'}
                          value={form.cantidad}
                          onChange={e => handleCantidadChange(e.target.value)}
                          onKeyDown={(e) => {
                            if (e.key === 'Enter' && form.tipo === 'Surtido') {
                              e.preventDefault();
                              handleAdd(e);
                            }
                          }}
                        />
                      </div>

                      {/* Ayuda visual para Acomodo */}
                      {form.tipo === 'Acomodo' && form.idSeleccionado && (
                        <div className="px-3 py-3 rounded-xl bg-slate-100 border border-slate-200">
                          <span className="text-[10px] font-black uppercase tracking-widest text-slate-600">
                            Cantidad bloqueada
                          </span>
                          <p className="text-[12px] font-semibold text-slate-700 mt-1 leading-snug">
                            Este folio ya fue identificado y etiquetado.
                            El acomodo debe respetar la cantidad completa de la etiqueta:
                            <span className="font-black text-[#1c1d1f] ml-1">
                              {form.idSeleccionado.balance} pzas
                            </span>
                          </p>
                        </div>
                      )}

                      {/* Aviso de remanente */}
                      {form.tipo === 'Surtido' &&
                        form.idSeleccionado &&
                        parseFloat(form.cantidad || 0) > 0 &&
                        parseFloat(form.cantidad || 0) < form.idSeleccionado.balance && (
                          <div className="fade-in proto-remanente-card p-3.5">
                            <div className="flex items-center justify-between mb-2">
                              <span className="proto-remanente-badge">
                                Surtido parcial
                              </span>
                              <div className="text-amber-900">
                                <LocalIcon name="scissors" size={16} />
                              </div>
                            </div>

                            <div className="flex items-start gap-2.5">
                              <div className="shrink-0 text-amber-700 mt-0.5">
                                <LocalIcon name="alert-triangle" size={20} />
                              </div>

                              <div className="flex flex-col flex-1 min-w-0">
