<style>
  #render-prototipo-traspasos {
    --local-primary: #d93025;
    --local-primary-dark: #a50e0e;
    --local-border: #dadce0;
  }

  #render-prototipo-traspasos .font-mono {
    font-family: 'JetBrains Mono', monospace;
  }

  #render-prototipo-traspasos .fade-in {
    animation: fadeInPrototipo 0.3s ease-out;
  }

  @keyframes fadeInPrototipo {
    from {
      opacity: 0;
      transform: translateY(10px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  #render-prototipo-traspasos .custom-scroll-container::-webkit-scrollbar {
    width: 6px;
  }

  #render-prototipo-traspasos .custom-scroll-container::-webkit-scrollbar-thumb {
    background: #dadce0;
    border-radius: 10px;
  }

  #render-prototipo-traspasos .overlay-fade-local {
    position: absolute;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(2px);
    z-index: 50;
    animation: fadeInOverlay 0.6s ease-out;
  }

  @keyframes fadeInOverlay {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  .animate-toast-in {
    animation: toastInProto 0.35s cubic-bezier(0.23, 1, 0.32, 1) forwards;
  }

  .animate-toast-out {
    animation: toastOutProto 0.25s cubic-bezier(0.23, 1, 0.32, 1) forwards;
  }

  @keyframes toastInProto {
    from {
      transform: translateX(100%);
      opacity: 0;
    }
    to {
      transform: translateX(0);
      opacity: 1;
    }
  }

  @keyframes toastOutProto {
    from {
      transform: translateX(0);
      opacity: 1;
    }
    to {
      transform: translateX(100%);
      opacity: 0;
    }
  }
</style>

<div id="render-prototipo-traspasos" class="h-full w-full flex flex-col bg-[#f8f9fa] overflow-hidden"></div>

<script type="text/babel">
  window.cargar_PrototipoTraspasos = () => {
    const { useState, useEffect, useMemo, useRef } = React;

    // =========================================================
    // ICONO LOCAL
    // =========================================================
    const LocalIcon = ({ name, size = 18, className = "" }) => {
      const iconRef = useRef(null);

      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name.toLowerCase());
          i.style.width = `${size}px`;
          i.style.height = `${size}px`;
          if (className) i.className = className;
          iconRef.current.appendChild(i);
          window.lucide.createIcons();
        }
      }, [name, size, className]);

      return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
    };

    // =========================================================
    // TOAST LOCAL
    // =========================================================
    const Toast = Swal.mixin({
      toast: true,
      position: 'top-end',
      showConfirmButton: false,
      timer: 3000,
      timerProgressBar: true,
      background: '#1c1d1f',
      color: '#ffffff',
      iconColor: '#d93025',
      showClass: {
        popup: 'animate-toast-in'
      },
      hideClass: {
        popup: 'animate-toast-out'
      },
      didOpen: (toast) => {
        toast.addEventListener('mouseenter', Swal.stopTimer);
        toast.addEventListener('mouseleave', Swal.resumeTimer);
        const progress = toast.querySelector('.swal2-timer-progress-bar');
        if (progress) progress.style.backgroundColor = '#d93025';
      }
    });

    // =========================================================
    // COMPONENTE PRINCIPAL
    // =========================================================
    const VistaPrototipo = () => {
      const [cola, setCola] = useState([]);
      const [procesando, setProcesando] = useState(false);
      const [cargando, setCargando] = useState(true);
      const [usuarios, setUsuarios] = useState([]);
      const [baseExcedentes, setBaseExcedentes] = useState([]);
      const [form, setForm] = useState({
        tipo: 'Acomodo',
        solicitante: '',
        codigo: '',
        cantidad: '',
        ubicacion: '',
        caja: '01',
        idSeleccionado: null
      });

      // ---------------------------------------------------------
      // HELPERS
      // ---------------------------------------------------------
      const normalizarTexto = (valor) => String(valor || "").trim().toUpperCase();

      const guardarBootstrapEnCache = (bootstrap) => {
        window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || {};
        window.DATA_ALMACEN_CACHE.prototipoTraspasosBootstrap = bootstrap;

        // compatibilidad con resto del shell
        if (bootstrap.usuarios) {
          window.DATA_ALMACEN_CACHE.usuarios = bootstrap.usuarios;
        }
      };

      const leerBootstrapDesdeCache = () => {
        const cache = window.DATA_ALMACEN_CACHE || {};
        return cache.prototipoTraspasosBootstrap || null;
      };

      const refrescarEstadoFolios = () => {
        google.script.run
          .withSuccessHandler((data) => {
            const dataLimpia = (data || []).map(item => ({
              ...item,
              idUnico: String(item.idUnico || "").split(/[ ,]+/)[0].trim(),
              sku: String(item.sku || "").trim().toUpperCase(),
              descripcion: String(item.descripcion || "").trim().toUpperCase(),
              ubicacionActual: String(item.ubicacionActual || "").trim().toUpperCase(),
              balance: Number(item.balance || 0)
            }));
            setBaseExcedentes(dataLimpia);
          })
          .withFailureHandler((err) => {
            console.error("❌ [Prototipo] Error refrescando estado de folios:", err);
            Toast.fire({
              icon: 'error',
              title: 'Error',
              text: 'No se pudo refrescar el estado de folios.'
            });
          })
          .PrototipoTraspasosController_obtenerEstadoFolios();
      };

      // ---------------------------------------------------------
      // CARGA INICIAL
      // ---------------------------------------------------------
      useEffect(() => {
        const cargarBootstrap = () => {
          try {
            Toast.fire({
              icon: 'info',
              title: 'Sincronizando catálogo...',
              timer: 15000
            });

            const cacheBootstrap = leerBootstrapDesdeCache();
            if (cacheBootstrap && Array.isArray(cacheBootstrap.usuarios) && Array.isArray(cacheBootstrap.estadoFolios)) {
              console.log("⚡ [Prototipo] Bootstrap reutilizado desde cache.");
              setUsuarios(cacheBootstrap.usuarios);
              setBaseExcedentes(cacheBootstrap.estadoFolios);
              setCargando(false);

              Toast.fire({
                icon: 'success',
                title: '¡Sistema Listo!',
                text: 'Conexión establecida correctamente',
                timer: 3000
              });
              return;
            }

            google.script.run
              .withSuccessHandler((bootstrap) => {
                console.log("✅ [Prototipo] Bootstrap recibido:", bootstrap);

                const usuariosRecibidos = bootstrap?.usuarios || [];
                const foliosRecibidos = (bootstrap?.estadoFolios || []).map(item => ({
                  ...item,
                  idUnico: String(item.idUnico || "").split(/[ ,]+/)[0].trim(),
                  sku: String(item.sku || "").trim().toUpperCase(),
                  descripcion: String(item.descripcion || "").trim().toUpperCase(),
                  ubicacionActual: String(item.ubicacionActual || "").trim().toUpperCase(),
                  balance: Number(item.balance || 0)
                }));

                setUsuarios(usuariosRecibidos);
                setBaseExcedentes(foliosRecibidos);
                guardarBootstrapEnCache({
                  usuarios: usuariosRecibidos,
                  estadoFolios: foliosRecibidos
                });
                setCargando(false);

                Toast.fire({
                  icon: 'success',
                  title: '¡Sistema Listo!',
                  text: 'Conexión establecida correctamente',
                  timer: 3000
                });
              })
              .withFailureHandler((err) => {
                console.error("❌ [Prototipo] Error cargando bootstrap:", err);
                Toast.fire({
                  icon: 'error',
                  title: 'Error al sincronizar',
                  text: 'No se pudieron recuperar los datos del prototipo.'
                });
                setCargando(false);
              })
              .PrototipoTraspasosController_getBootstrap();

          } catch (err) {
            console.error("❌ [Prototipo] Error inesperado:", err);
            Toast.fire({
              icon: 'error',
              title: 'Error inesperado',
              text: 'No se pudo inicializar la vista.'
            });
            setCargando(false);
          }
        };

        cargarBootstrap();
      }, []);

      // ---------------------------------------------------------
      // MEMO DE FOLIO DINÁMICO
      // ---------------------------------------------------------
      const folioDinamico = useMemo(() => {
        if (!form.codigo) return "Esperando SKU...";
        return `${Date.now()}&${form.codigo}&#${form.caja}`;
      }, [form.codigo, form.caja]);

      // ---------------------------------------------------------
      // CAMBIO DE CANTIDAD
      // ---------------------------------------------------------
      const handleCantidadChange = (valor) => {
        const numVal = parseFloat(valor);
        const saldoDisponible = form.idSeleccionado?.balance || 0;

        if (form.tipo === 'Surtido' && numVal > saldoDisponible) {
          Toast.fire({
            icon: 'warning',
            title: 'Cantidad excedida',
            text: `Solo hay ${saldoDisponible} pzas en este ID.`
          });
          return;
        }

        setForm(prev => ({ ...prev, cantidad: valor }));
      };

      // ---------------------------------------------------------
      // CAMBIO DE INPUT QR / FOLIO
      // ---------------------------------------------------------
      const handleInputChange = (e) => {
        const val = e.target.value.toUpperCase();

        setForm(prev => {
          const infoFolio = baseExcedentes.find(f => f.idUnico === val.trim());

          if (infoFolio) {
            return {
              ...prev,
              codigo: val,
              ubicacion: infoFolio.ubicacionActual || prev.ubicacion,
              cantidad: infoFolio.balance || prev.cantidad,
              idSeleccionado: infoFolio
            };
          }

          return {
            ...prev,
            codigo: val,
            idSeleccionado: null
          };
        });

        const match = baseExcedentes.find(f => f.idUnico === val.trim());
        if (match) {
          Toast.fire({
            icon: 'info',
            title: 'Folio verificado',
            text: `${match.sku} guardado en ${match.ubicacionActual}`,
            timer: 1500
          });
        }
      };

      // ---------------------------------------------------------
      // AGREGAR A COLA
      // ---------------------------------------------------------
      const handleAdd = (e) => {
        e.preventDefault();

        const solicitanteLimpio = normalizarTexto(form.solicitante);
        const codigoLimpio = normalizarTexto(form.codigo);

        const usuarioValido = usuarios.some(
          u => normalizarTexto(u.nombre) === solicitanteLimpio
        );

        if (!usuarioValido) {
          Toast.fire({
            icon: 'error',
            title: 'Traspaso sin solicitante',
            text: 'Selecciona un solicitante válido para continuar'
          });
          return;
        }

        if (!codigoLimpio) {
          Toast.fire({
            icon: 'warning',
            title: 'Traspaso sin ID',
            text: 'Escanea, captura o selecciona un folio válido para continuar'
          });
          return;
        }

        if (!form.idSeleccionado) {
          Toast.fire({
            icon: 'error',
            title: 'Folio no reconocido',
            text: 'El folio ingresado no existe',
            background: '#d93025',
            color: '#ffffff'
          });
          return;
        }

        const cant = parseFloat(form.cantidad);
        if (!cant || cant <= 0) {
          Toast.fire({
            icon: 'warning',
            title: 'Cantidad inválida',
            text: 'Debes ingresar un valor válido'
          });
          return;
        }

        const nuevoItem = {
          ...form,
          tipo: form.tipo,
          solicitante: solicitanteLimpio,
          codigo: codigoLimpio,        // <- ID/Folio escaneado
          cantidad: cant,
          ubicacion: normalizarTexto(form.ubicacion),
          id: `${Date.now()}&${codigoLimpio}&#${form.caja}`, // solo key local
          timestamp: new Date().toLocaleTimeString(),
          sku: form.idSeleccionado.sku,
          descripcion: form.idSeleccionado.descripcion,
          idSeleccionado: form.idSeleccionado
        };

        if (
          form.tipo === 'Surtido' &&
          form.idSeleccionado &&
          parseFloat(form.cantidad) < form.idSeleccionado.balance
        ) {
          Toast.fire({
            icon: 'info',
            title: 'Remanente detectado',
            text: 'Se ha programado la generación de una etiqueta secundaria.',
            background: '#1c1d1f',
            timer: 4000
          });
        }

        setCola(prev => [nuevoItem, ...prev]);
        setForm(prev => ({
          ...prev,
          codigo: '',
          cantidad: '',
          ubicacion: '',
          idSeleccionado: null
        }));

        Toast.fire({
          icon: 'success',
          title: 'Añadido a fila',
          timer: 1500
        });
      };

      // ---------------------------------------------------------
      // ENVÍO AL BACKEND
      // ---------------------------------------------------------
      const enviarASheets = () => {
        if (cola.length === 0) return;
        setProcesando(true);

        google.script.run
          .withSuccessHandler((resultado) => {
            setProcesando(false);
            setCola([]);

            if (resultado && resultado.htmlImpresion) {
              const nuevaVentana = window.open('', '_blank', 'width=800,height=600');
              if (nuevaVentana) {
                nuevaVentana.document.write(resultado.htmlImpresion);
                nuevaVentana.document.close();
              }
            }

            // refrescar estado real de folios
            refrescarEstadoFolios();

            // actualizar cache bootstrap también
            const cache = leerBootstrapDesdeCache();
            if (cache) {
              cache.estadoFolios = [];
            }

            Swal.fire({
              icon: 'success',
              title: 'Operación Exitosa',
              text: 'Inventario actualizado.'
            });
          })
          .withFailureHandler((err) => {
            console.error("❌ [Prototipo] Error procesando movimientos:", err);
            setProcesando(false);

            Swal.fire({
              icon: 'error',
              title: 'Error',
              text: err.message || 'No se pudo procesar la operación.'
            });
          })
          .PrototipoTraspasosController_procesarMovimientosFinal(cola);
      };

      // ---------------------------------------------------------
      // UI
      // ---------------------------------------------------------
      return (
        <div className="flex flex-col h-full w-full relative">

          <div className="flex-1 flex overflow-hidden">
            {/* PANEL LATERAL */}
            <div className="w-80 border-r border-[#dadce0] bg-white p-6 overflow-y-auto shrink-0 z-10">
              <form onSubmit={handleAdd} className="space-y-5">
                {/* Tipo */}
                <div className="flex p-1 bg-gray-100 rounded-xl">
                  {['Acomodo', 'Surtido'].map(t => (
                    <button
                      key={t}
                      type="button"
                      onClick={() => setForm({
                        ...form,
                        tipo: t,
                        codigo: '',
                        cantidad: '',
                        ubicacion: '',
                        idSeleccionado: null
                      })}
                      className={`flex-1 py-2 text-[15px] font-black uppercase rounded-lg transition-all ${
                        form.tipo === t ? 'bg-white text-[#d93025] shadow-sm' : 'text-gray-400'
                      }`}
                    >
                      {t}
                    </button>
                  ))}
                </div>

                {/* Solicitante */}
                <div className="space-y-2">
                  <label className="text-[12px] font-black text-gray-400 uppercase tracking-widest ml-1">
                    Solicitante
                  </label>
                  <div className="relative">
                    <input
                      list="lista-usuarios-prototipo"
                      disabled={cargando}
                      className={`w-full border rounded-xl px-3.5 py-3 text-[12px] font-black uppercase outline-none transition-all font-mono ${
                        cargando
                          ? 'bg-gray-200 cursor-not-allowed'
                          : 'bg-gray-50 focus:bg-white focus:border-[#d93025]'
                      }`}
                      placeholder={cargando ? "Cargando catálogo..." : "Escribe o selecciona un solicitante"}
                      value={form.solicitante}
                      onChange={e => setForm({ ...form, solicitante: e.target.value.toUpperCase() })}
                    />
                    <datalist id="lista-usuarios-prototipo">
                      {usuarios.map((u, index) => (
                        <option key={index} value={u.nombre} />
                      ))}
                    </datalist>
                  </div>
                </div>

                {/* QR / FOLIO */}
                <div className="space-y-2">
                  <label className="text-[12px] font-black text-gray-400 uppercase tracking-widest ml-1">
                    Escaneo de QR
                  </label>
                  <div className="relative group">
                    <input
                      list="lista-ids-excedentes"
                      className="w-full bg-gray-50 border border-[#dadce0] focus:border-[#d93025] focus:bg-white rounded-xl px-3.5 py-3 text-[12px] font-black uppercase outline-none transition-all font-mono"
                      placeholder="Escribe o escanea un QR"
                      value={form.codigo}
                      onChange={handleInputChange}
                      onKeyDown={(e) => e.key === 'Enter' && document.getElementById('input-cantidad')?.focus()}
                    />

                    <datalist id="lista-ids-excedentes">
                      {baseExcedentes.map((item, index) => (
                        <option key={index} value={item.idUnico}>
                          {item.sku} | {item.ubicacionActual} | Saldo: {item.balance}
                        </option>
                      ))}
                    </datalist>

                    {form.idSeleccionado && (
                      <div className="absolute right-3 top-3 text-green-500 animate-pulse">
                        <LocalIcon name="check-circle" size={16} />
                      </div>
                    )}
                  </div>
                </div>

                {/* INFORMACIÓN REFERENCIADA */}
                {form.codigo && (
                  <div className="p-4 bg-[#1c1d1f] rounded-xl space-y-3 border border-gray-800 fade-in shadow-xl">
                    <div className="flex items-start gap-3">
                      <div className="p-2 bg-gray-800 rounded-lg">
                        <LocalIcon name="tag" size={14} className="text-red-500" />
                      </div>
                      <div className="flex flex-col">
                        <span className="text-[12px] font-black text-gray-500 uppercase tracking-widest">
                          SKU Vinculado
                        </span>
                        <span className="text-white font-mono text-sm font-black">
                          {form.idSeleccionado ? form.idSeleccionado.sku : "Sin Ubicar"}
                        </span>
                      </div>
                    </div>

                    <div className="flex items-start gap-3 border-t border-gray-800 pt-3">
                      <div className="p-2 bg-gray-800 rounded-lg">
                        <LocalIcon name="file-text" size={14} className="text-red-500" />
                      </div>
                      <div className="flex flex-col">
                        <span className="text-[12px] font-black text-gray-500 uppercase tracking-widest">
                          Descripción
                        </span>
                        <span className="text-gray-300 text-[14px] font-bold leading-tight uppercase italic">
                          {form.idSeleccionado
                            ? form.idSeleccionado.descripcion
                            : "No se encontró registro en la base de datos"}
                        </span>
                      </div>
                    </div>

                    {form.tipo === 'Surtido' && form.idSeleccionado && (
                      <div className="mt-2 py-1 px-2 bg-red-900/30 rounded border border-red-800/50">
                        <span className="text-[8px] text-red-400 font-bold uppercase">
                          Saldo Disponible: {form.idSeleccionado.balance} pzas
                        </span>
                      </div>
                    )}
                  </div>
                )}

                {/* Ubicación y Cantidad */}
                <div className="grid grid-cols-2 gap-3 mt-4">
                  <div className="space-y-2">
                    <label className="text-[12px] font-black text-gray-400 uppercase tracking-widest ml-1">
                      Ubicación
                    </label>
                    <input
                      className={`w-full border rounded-xl px-4 py-2 text-[12px] font-bold uppercase outline-none transition-all ${
                        (form.tipo === 'Surtido' && form.idSeleccionado)
                          ? 'bg-gray-200 text-gray-500 cursor-not-allowed'
                          : 'bg-gray-50 border-[#dadce0] focus:border-[#d93025]'
                      }`}
                      placeholder="A-01"
                      readOnly={form.tipo === 'Surtido' && form.idSeleccionado}
                      value={form.ubicacion}
                      onChange={e => setForm({ ...form, ubicacion: e.target.value.toUpperCase() })}
                    />
                  </div>

                  <div className="space-y-2">
                    <label className="text-[12px] font-black text-gray-400 uppercase tracking-widest ml-1">
                      Cant.
                    </label>
                    <input
                      id="input-cantidad"
                      type="number"
                      className="w-full bg-gray-50 border border-[#dadce0] focus:border-[#d93025] rounded-xl px-4 py-2 text-[12px] font-bold outline-none"
                      placeholder="0"
                      value={form.cantidad}
                      onChange={e => handleCantidadChange(e.target.value)}
                    />
                  </div>
                </div>

                {/* Alerta remanente */}
                {form.tipo === 'Surtido' &&
                  form.idSeleccionado &&
                  parseFloat(form.cantidad || 0) > 0 &&
                  parseFloat(form.cantidad || 0) < form.idSeleccionado.balance && (
                    <div className="fade-in mt-4 flex items-center gap-3 p-3 bg-[#fffbeb] border-l-4 border-amber-400 rounded-r-xl shadow-sm">
                      <div className="shrink-0 text-amber-500 animate-pulse">
                        <LocalIcon name="alert-triangle" size={18} />
                      </div>
                      <div className="flex flex-col">
                        <span className="text-[9px] font-black text-amber-800 uppercase tracking-tighter">
                          Acción: Fraccionamiento de Lote
                        </span>
                        <span className="text-[10px] font-mono font-bold text-amber-700 leading-none">
                          Remanente: {form.idSeleccionado.balance - parseFloat(form.cantidad)} PZAS
                        </span>
                      </div>
                    </div>
                  )}

                <button
                  type="submit"
                  disabled={cargando || procesando}
                  className="w-full bg-[#d93025] hover:bg-[#a50e0e] text-white py-4 rounded-xl font-black uppercase text-[15px] tracking-[0.2em] shadow-lg shadow-red-100 transition-all flex items-center justify-center gap-3 disabled:opacity-50 disabled:pointer-events-none"
                >
                  <LocalIcon name="plus" size={25} />
                  Añadir a fila
                </button>
              </form>
            </div>

            {/* TABLA DE RESULTADOS */}
            <div className="flex-1 bg-white overflow-auto custom-scroll-container">
              <table className="w-full border-separate border-spacing-0">
                <thead className="bg-[#f8f9fa] sticky top-0 z-20">
                  <tr>
                    <th className="px-6 py-4 text-[9px] font-black uppercase text-gray-400 text-left border-b border-[#dadce0]">
                      SKU / Folio
                    </th>
                    <th className="px-6 py-4 text-[9px] font-black uppercase text-gray-400 text-left border-b border-[#dadce0]">
                      Tipo
                    </th>
                    <th className="px-6 py-4 text-[9px] font-black uppercase text-gray-400 text-right border-b border-[#dadce0]">
                      Cantidad
                    </th>
                    <th className="px-6 py-4 text-[9px] font-black uppercase text-gray-400 text-center border-b border-[#dadce0]">
                      Acción
                    </th>
                  </tr>
                </thead>

                <tbody className="divide-y divide-gray-50">
                  {cola.map(item => (
                    <tr key={item.id} className="fade-in hover:bg-gray-50 transition-colors group">
                      <td className="px-6 py-4">
                        <div className="flex flex-col">
                          <span className="text-sm font-black text-[#1c1d1f] font-mono">{item.codigo}</span>
                          <span className="text-[8px] font-bold text-gray-400 uppercase tracking-tighter">
                            Loc: {item.ubicacion}
                          </span>
                        </div>
                      </td>

                      <td className="px-6 py-4">
                        <span className={`text-[8px] font-black uppercase px-2 py-1 rounded-md ${
                          item.tipo === 'Acomodo'
                            ? 'bg-blue-50 text-blue-600 border border-blue-100'
                            : 'bg-amber-50 text-amber-600 border border-amber-100'
                        }`}>
                          {item.tipo}
                        </span>
                      </td>

                      <td className="px-6 py-4 text-right">
                        <span className="text-lg font-black text-[#1c1d1f]">{item.cantidad}</span>
                      </td>

                      <td className="px-6 py-4 text-center">
                        <button
                          onClick={() => setCola(cola.filter(c => c.id !== item.id))}
                          className="p-2 text-gray-300 hover:text-red-500 transition-colors"
                        >
                          <LocalIcon name="trash-2" size={16} />
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>

              {cola.length === 0 && (
                <div className="flex flex-col items-center justify-center h-full text-center p-10 opacity-20">
                  <LocalIcon name="package" size={48} />
                  <p className="text-[10px] font-black uppercase tracking-[0.4em] mt-4">
                    Esperando registros
                  </p>
                </div>
              )}
            </div>
          </div>

          {/* BOTÓN FINAL */}
          {cola.length > 0 && (
            <div className="absolute bottom-6 right-6 z-30">
              <button
                onClick={enviarASheets}
                disabled={procesando}
                className="bg-[#1c1d1f] hover:bg-black text-white px-6 py-4 rounded-2xl shadow-xl font-black uppercase tracking-[0.15em] flex items-center gap-3 disabled:opacity-50 disabled:pointer-events-none"
              >
                <LocalIcon name={procesando ? "loader-2" : "save"} size={20} className={procesando ? "animate-spin" : ""} />
                {procesando ? "Procesando..." : "Aplicar movimientos"}
              </button>
            </div>
          )}
        </div>
      );
    };

    // =========================================================
    // RENDER EN CONTENEDOR
    // =========================================================
    const rootDiv = document.getElementById('render-prototipo-traspasos');
    if (rootDiv) {
      if (window.__PROTOTIPO_TRASPASOS_ROOT__) {
        try {
          window.__PROTOTIPO_TRASPASOS_ROOT__.unmount();
        } catch (e) {
          console.warn("⚠️ [Prototipo] No se pudo desmontar root previo:", e);
        }
        window.__PROTOTIPO_TRASPASOS_ROOT__ = null;
      }

      window.__PROTOTIPO_TRASPASOS_ROOT__ = ReactDOM.createRoot(rootDiv);
      window.__PROTOTIPO_TRASPASOS_ROOT__.render(<VistaPrototipo />);
    }
  };

  window.initVista = window.cargar_PrototipoTraspasos;
  console.log("🧩 [PrototipoTraspasos] initVista definida:", typeof window.initVista);
</script>
