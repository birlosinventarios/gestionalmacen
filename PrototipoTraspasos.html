<style>
  #render-prototipo-traspasos {
    --local-primary: #d93025;
    --local-primary-dark: #a50e0e;
    --local-border: #dadce0;
  }

  #render-prototipo-traspasos .font-mono {
    font-family: 'JetBrains Mono', monospace;
  }

  #render-prototipo-traspasos .fade-in {
    animation: fadeInPrototipo 0.3s ease-out;
  }

  @keyframes fadeInPrototipo {
    from {
      opacity: 0;
      transform: translateY(10px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Contenedor de la cola con scroll suave */
  #render-prototipo-traspasos .custom-scroll-container::-webkit-scrollbar {
    width: 6px;
  }

  #render-prototipo-traspasos .custom-scroll-container::-webkit-scrollbar-thumb {
    background: #dadce0;
    border-radius: 10px;
  }

  #render-prototipo-traspasos .overlay-fade-local {
    position: absolute;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(2px);
    z-index: 50;
    animation: fadeInOverlay 0.6s ease-out;
  }

  @keyframes fadeInOverlay {
    from {
      opacity: 0;
    }

    to {
      opacity: 1;
    }
  }
</style>

<div id="render-prototipo-traspasos" class="h-full w-full flex flex-col bg-[#f8f9fa] overflow-hidden">
</div>

<script type="text/babel">
  /**
   * FUNCIÓN DE INICIALIZACIÓN (Llamada por APPALMACEN.HTML)
   */
  window.cargar_PrototipoTraspasos = () => {
    const { useState, useEffect, useMemo, useRef } = React;

    // Componente de Icono local optimizado para Lucide ya cargado en el Main
    const LocalIcon = ({ name, size = 18, className = "" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name.toLowerCase());
          i.style.width = `${size}px`;
          i.style.height = `${size}px`;
          if (className) i.className = className;
          iconRef.current.appendChild(i);
          window.lucide.createIcons();
        }
      }, [name, size, className]);
      return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
    };


    const VistaPrototipo = () => {
      const [cola, setCola] = useState([]);
      const [procesando, setProcesando] = useState(false);
      const [cargando, setCargando] = useState(true);
      const [usuarios, setUsuarios] = useState([]);
      const [form, setForm] = useState({
        tipo: 'Acomodo',
        solicitante: '',
        codigo: '',
        cantidad: '',
        ubicacion: '',
        caja: '01',
        idSeleccionado: null
      });


      // Cargar usuarios al iniciar la vista
        
      useEffect(() => {
        const cargarUsuarios = async () => {
          try {
            Toast.fire({
              icon: 'info',
              title: 'Sincronizando catálogo...',
              timer: 15000,
            });

            const megaData = window.DATA_ALMACEN_CACHE || await window.inicializarMegaData?.();

            if (megaData && megaData.usuarios) {
              setUsuarios(megaData.usuarios);
              setCargando(false);

              Toast.fire({
                icon: 'success',
                title: '¡Sistema Listo!',
                text: 'Conexión establecida correctamente',
                timer: 3000
              });
            } else {
              Toast.fire({
                icon: 'warning',
                title: 'Sin datos',
                text: 'No se encontraron usuarios en memoria.'
              });
              setCargando(false);
            }
          } catch (err) {
            console.error("❌ [Prototipo] Error cargando usuarios:", err);
            Toast.fire({
              icon: 'error',
              title: 'Error al sincronizar',
              text: 'No se pudieron recuperar los usuarios.'
            });
            setCargando(false);
          }
        };

        cargarUsuarios();
      }, []);


     
      // Dentro de tu componente VistaPrototipo
      const handleCantidadChange = (valor) => {
        const numVal = parseFloat(valor);
        const saldoDisponible = form.idSeleccionado?.balance || 0;

        if (form.tipo === 'Surtido' && numVal > saldoDisponible) {
          Toast.fire({
            icon: 'warning',
            title: 'Cantidad excedida',
            text: `Solo hay ${saldoDisponible} pzas en este ID.`
          });
          return;
        }
       
        setForm({...form, cantidad: valor});
      };

      // Configuración de estilo "Sidebar Contraste"
      const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true,
        background: '#1c1d1f',
        color: '#ffffff',
        iconColor: '#d93025',
        // --- EFECTOS ELEGANTES ---
        showClass: {
          popup: 'animate-toast-in'  // Clase de entrada
        },

        hideClass: {
          popup: 'animate-toast-out' // Clase de salida
        },
        // -------------------------
        didOpen: (toast) => {
          toast.addEventListener('mouseenter', Swal.stopTimer)
          toast.addEventListener('mouseleave', Swal.resumeTimer)
         
          const progress = toast.querySelector('.swal2-timer-progress-bar');
          if (progress) progress.style.backgroundColor = '#d93025';
        }
      });

      const folioDinamico = useMemo(() => {
        if (!form.codigo) return "Esperando SKU...";
        return `${Date.now()}&${form.codigo}&#${form.caja}`;
      }, [form.codigo, form.caja]);

      const handleAdd = (e) => {
        e.preventDefault();
        
        // 1. Limpieza y Normalización de Entradas
        const solicitanteLimpio = form.solicitante.trim().toUpperCase();
        const codigoLimpio = form.codigo.trim().toUpperCase();

        // 2. Validación de Identidad del Solicitante (Seguridad de Trazabilidad)
        const usuarioValido = usuarios.some(u => u.nombre.trim().toUpperCase() === solicitanteLimpio);
        
        if (!usuarioValido) {
          Toast.fire({
            icon: 'error',
            title: 'Traspaso sin solicitante',
            text: 'Selecciona un solicitante válido para continuar'
          });
          return;
        }

        // 3. EL GUARDIÁN DEL FOLIO: Validación de Existencia en BD
        // No basta con que el input tenga texto, debe existir en baseExcedentes
        if (!codigoLimpio) {
          Toast.fire({
            icon: 'warning',
            title: 'Traspasos sin ID',
            text: 'Escanea, captura o Selecciona un folio válido para continuar'
          });
          return;
        }

        if (!form.idSeleccionado) {
          Toast.fire({
            icon: 'error',
            title: 'Folio no Reconocido',
            text: 'El Folio ingresado no existe',
            background: '#d93025', // Rojo intenso para error crítico
            color: '#ffffff'
          });
          return;
        }

        // 4. Validación de Cantidades (Evitar registros en cero o negativos)
        const cant = parseFloat(form.cantidad);
        if (!cant || cant <= 0) {
          Toast.fire({
            icon: 'warning',
            title: 'Cantidad Inválida',
            text: 'Debes ingresar un valor igual o menor al registrado'
          });
          return;
        }

        // 5. Construcción del Objeto para la Fila (Data Sólida)
        const nuevoItem = {
          ...form,
          codigo: codigoLimpio,
          id: `${Date.now()}&${codigoLimpio}&#${form.caja}`, // Generación de ID único local
          timestamp: new Date().toLocaleTimeString(),
          // Aseguramos que los datos del objeto vengan de la BD vinculada, no del input
          sku: form.idSeleccionado.sku,
          descripcion: form.idSeleccionado.descripcion
        };

        // Validación de seguridad para remanentes
        if (form.tipo === 'Surtido' && form.idSeleccionado && parseFloat(form.cantidad) < form.idSeleccionado.balance) {
          Toast.fire({
            icon: 'info',
            title: 'Remanente Detectado',
            text: 'Se ha programado la generación de una etiqueta secundaria.',
            background: '#1c1d1f',
            timer: 4000 // Damos un poco más de tiempo por ser una advertencia técnica
          });
        }

        // 6. Acción Final: Actualizar estado y limpiar inputs específicos
        setCola([nuevoItem, ...cola]);
        setForm(prev => ({ 
          ...prev, 
          codigo: '', 
          cantidad: '', 
          ubicacion: '', 
          idSeleccionado: null 
        }));
        
        // Feedback visual de éxito
        Toast.fire({
          icon: 'success',
          title: 'Añadido a fila',
          timer: 1500
        });
      };



      const [baseExcedentes, setBaseExcedentes] = useState([]);

      useEffect(() => {
        if (typeof google !== 'undefined') {
          google.script.run
            .withSuccessHandler(data => {
              // Sanitización profunda de datos antes de entrar al estado de React
              const dataLimpia = data.map(item => ({
                ...item,
                // Aseguramos que el ID sea un string puro para la comparación del datalist
                idUnico: String(item.idUnico).split(/[ ,]+/)[0].trim() 
              }));
              setBaseExcedentes(dataLimpia);
            })
            .obtenerEstadoFolios(); // Función que ya definimos en el .gs
        }
      }, []);


    // Handler de cambio unificado y seguro
const handleInputChange = (e) => {
  const val = e.target.value.toUpperCase();
  
  // 1. Actualización inmediata del estado visual
  setForm(prev => {
    // 2. Búsqueda de coincidencia en la base de datos (O(n))
    // Usamos .trim() para evitar errores por espacios accidentales al final del escaneo
    const infoFolio = baseExcedentes.find(f => f.idUnico === val.trim());

    if (infoFolio) {
      // Si hay match, vinculamos los datos de la BD automáticamente
      // Esto es CRÍTICO para la seguridad: los datos vienen de la BD, no del usuario
      return {
        ...prev,
        codigo: val,
        ubicacion: infoFolio.ubicacionActual || prev.ubicacion,
        cantidad: infoFolio.balance || prev.cantidad,
        idSeleccionado: infoFolio
      };
    }

    // Si no hay match, reseteamos el objeto de vinculación
    return { ...prev, codigo: val, idSeleccionado: null };
  });

  // Notificación visual elegante solo cuando hay un match positivo
  const match = baseExcedentes.find(f => f.idUnico === val.trim());
  if (match) {
    Toast.fire({
      icon: 'info',
      title: 'Folio verificado',
      text: `${match.sku} guardado en ${match.ubicacionActual}`,
      timer: 1500 // Más rápido para no entorpecer el flujo
    });
  }
};


      const handleEscaneo = (idIngresado) => {
        const idLimpio = idIngresado.trim().toUpperCase();
        const infoFolio = baseExcedentes.find(f => f.idUnico === idLimpio);

        if (infoFolio) {
          setForm(prev => ({
            ...prev,
            codigo: idLimpio,
            ubicacion: infoFolio.ubicacionActual, // Auto-completado
            cantidad: infoFolio.balance,         // Sugerir el total
            idSeleccionado: infoFolio            // Guardamos todo el objeto
          }));
        } else {
          setForm(prev => ({ ...prev, codigo: idLimpio, idSeleccionado: null }));
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          document.getElementById('input-cantidad').focus();
        }
      };  

      const enviarASheets = () => {
        if (cola.length === 0) return;
        setProcesando(true);

        google.script.run
          .withSuccessHandler(resultado => {
            setProcesando(false);
            setCola([]);

            if (resultado.htmlImpresion) {
              // Esto abre automáticamente el diálogo de impresión para los remanentes
              const nuevaVentana = window.open('', '_blank', 'width=800,height=600');
              nuevaVentana.document.write(resultado.htmlImpresion);
              // El script dentro de tu HTML lanzará window.print()
            }

            Swal.fire({ icon: 'success', title: 'Operación Exitosa', text: 'Inventario actualizado.' });
          })
          .procesarMovimientosFinal(cola); // Esta función manejará los remanentes en el GS
      };


      return (
        <div className="flex flex-col h-full w-full relative">

          <div className="flex-1 flex overflow-hidden">
            {/* PANEL LATERAL DE REGISTRO */}
            <div className="w-80 border-r border-[#dadce0] bg-white p-6 overflow-y-auto shrink-0 z-10">
              <form onSubmit={handleAdd} className="space-y-5">
                {/* Selector de Tipo (Acomodo / Surtido) */}
                <div className="flex p-1 bg-gray-100 rounded-xl">
                  {['Acomodo', 'Surtido'].map(t => (
                    <button
                      key={t} type="button"
                      onClick={() => setForm({...form, tipo: t, codigo: '', cantidad: '', ubicacion: '', idSeleccionado: null})}
                      className={`flex-1 py-2 text-[15px] font-black uppercase rounded-lg transition-all ${form.tipo === t ? 'bg-white text-[#d93025] shadow-sm' : 'text-gray-400'}`}
                    >
                      {t}
                    </button>
                  ))}
                </div>


                {/* Input de Solicitante */}
                <div className="space-y-2">
                  <label className="text-[12px] font-black text-gray-400 uppercase tracking-widest ml-1">Solicitante</label>
                  <div className="relative">
                    <input
                      list="lista-usuarios-prototipo"
                      disabled={cargando}
                      className={`w-full border rounded-xl px-3.5 py-3 text-[12px] font-black uppercase outline-none transition-all font-mono
                        ${cargando ? 'bg-gray-200 cursor-not-allowed' : 'bg-gray-50 focus:bg-white focus:border-[#d93025]'}`}
                      placeholder={cargando ? "Cargando catálogo..." : "Escribe o selecciona un solicitante"}
                      value={form.solicitante}
                      onChange={e => setForm({...form, solicitante: e.target.value.toUpperCase()})}
                    />
                    <datalist id="lista-usuarios-prototipo">
                      {usuarios.map((u, index) => (
                        <option key={index} value={u.nombre} />
                      ))}
                    </datalist>
                  </div>
                </div>

                {/* Input de Escaneo de QR / Manual */}
<div className="space-y-2">
  <label className="text-[12px] font-black text-gray-400 uppercase tracking-widest ml-1">
    Escaneo de QR
  </label>
  <div className="relative group">
    <input
      list="lista-ids-excedentes" 
      className="w-full bg-gray-50 border border-[#dadce0] focus:border-[#d93025] focus:bg-white rounded-xl px-3.5 py-3 text-[12px] font-black uppercase outline-none transition-all font-mono"
      placeholder="Escribe o escanea un QR"
      value={form.codigo}
      onChange={handleInputChange}
      onKeyDown={(e) => e.key === 'Enter' && document.getElementById('input-cantidad').focus()}
    />
    
    {/* El motor de búsqueda nativo del navegador es el más eficiente aquí */}
    <datalist id="lista-ids-excedentes">
      {baseExcedentes.map((item, index) => (
        <option key={index} value={item.idUnico}>
          {item.sku} | {item.ubicacionActual} | Saldo: {item.balance}
        </option>
      ))}
    </datalist>
    
    {/* Indicador visual de "Match" */}
    {form.idSeleccionado && (
      <div className="absolute right-3 top-3 text-green-500 animate-pulse">
        <LocalIcon name="check-circle" size={16} />
      </div>
    )}
  </div>
</div>

                {/* DESPLIEGUE DE INFORMACIÓN REFERENCIADA A BD-EXCEDENTES */}
                  {form.codigo && (
                    <div className="p-4 bg-[#1c1d1f] rounded-xl space-y-3 border border-gray-800 fade-in shadow-xl">
                      <div className="flex items-start gap-3">
                        <div className="p-2 bg-gray-800 rounded-lg">
                          <LocalIcon name="tag" size={14} className="text-red-500" />
                        </div>
                        <div className="flex flex-col">
                          <span className="text-[12px] font-black text-gray-500 uppercase tracking-widest">SKU Vinculado</span>
                          <span className="text-white font-mono text-sm font-black">
                            {form.idSeleccionado ? form.idSeleccionado.sku : "Sin Ubicar"}
                          </span>
                        </div>
                      </div>

                      <div className="flex items-start gap-3 border-t border-gray-800 pt-3">
                        <div className="p-2 bg-gray-800 rounded-lg">
                          <LocalIcon name="file-text" size={14} className="text-red-500" />
                        </div>
                        <div className="flex flex-col">
                          <span className="text-[12px] font-black text-gray-500 uppercase tracking-widest">Descripción</span>
                          <span className="text-gray-300 text-[14px] font-bold leading-tight uppercase italic">
                            {form.idSeleccionado ? form.idSeleccionado.descripcion : "No se encontró registro en la base de datos"}
                          </span>
                        </div>
                      </div>

                      {/* Indicador de estado de saldo si es Surtido */}
                      {form.tipo === 'Surtido' && form.idSeleccionado && (
                        <div className="mt-2 py-1 px-2 bg-red-900/30 rounded border border-red-800/50">
                          <span className="text-[8px] text-red-400 font-bold uppercase">
                            Saldo Disponible: {form.idSeleccionado.balance} pzas
                          </span>
                        </div>
                      )}
                    </div>
                  )}

                {/* Grid de Ubicación y Cantidad */}
                <div className="grid grid-cols-2 gap-3 mt-4">
                  <div className="space-y-2">
                    <label className="text-[12px] font-black text-gray-400 uppercase tracking-widest ml-1">Ubicación</label>
                    <input
                      className={`w-full border rounded-xl px-4 py-2 text-[12px] font-bold uppercase outline-none transition-all
                        ${(form.tipo === 'Surtido' && form.idSeleccionado) ? 'bg-gray-200 text-gray-500 cursor-not-allowed' : 'bg-gray-50 border-[#dadce0] focus:border-[#d93025]'}`}
                      placeholder="A-01"
                      readOnly={form.tipo === 'Surtido' && form.idSeleccionado}
                      value={form.ubicacion}
                      onChange={e => setForm({...form, ubicacion: e.target.value.toUpperCase()})}
                    />
                  </div>
                  <div className="space-y-2">
                    <label className="text-[12px] font-black text-gray-400 uppercase tracking-widest ml-1">Cant.</label>
                    <input
                      id="input-cantidad"
                      type="number"
                      className="w-full bg-gray-50 border border-[#dadce0] focus:border-[#d93025] rounded-xl px-4 py-2 text-[12px] font-bold outline-none"
                      placeholder="0"
                      value={form.cantidad}
                      onChange={e => handleCantidadChange(e.target.value)}
                    />
                  </div>
                </div>

                {/* Alerta de Remanente: Estética de Toast Persistente */}
                {form.tipo === 'Surtido' && form.idSeleccionado && parseFloat(form.cantidad || 0) > 0 && parseFloat(form.cantidad || 0) < form.idSeleccionado.balance && (
                  <div className="fade-in mt-4 flex items-center gap-3 p-3 bg-[#fffbeb] border-l-4 border-amber-400 rounded-r-xl shadow-sm">
                    <div className="shrink-0 text-amber-500 animate-pulse">
                      <LocalIcon name="alert-triangle" size={18} />
                    </div>
                    <div className="flex flex-col">
                      <span className="text-[9px] font-black text-amber-800 uppercase tracking-tighter">
                        Acción: Fraccionamiento de Lote
                      </span>
                      <span className="text-[10px] font-mono font-bold text-amber-700 leading-none">
                        Remanente: {form.idSeleccionado.balance - parseFloat(form.cantidad)} PZAS
                      </span>
                    </div>
                  </div>
                )}

                <button type="submit" className="w-full bg-[#d93025] hover:bg-[#a50e0e] text-white py-4 rounded-xl font-black uppercase text-[15px] tracking-[0.2em] shadow-lg shadow-red-100 transition-all flex items-center justify-center gap-3">
                  <LocalIcon name="plus" size={25} /> Añadir a fila
                </button>
              </form>
            </div>


            {/* TABLA DE RESULTADOS */}
            <div className="flex-1 bg-white overflow-auto custom-scroll-container">
              <table className="w-full border-separate border-spacing-0">
                <thead className="bg-[#f8f9fa] sticky top-0 z-20">
                  <tr>
                    <th className="px-6 py-4 text-[9px] font-black uppercase text-gray-400 text-left border-b border-[#dadce0]">SKU / Folio</th>
                    <th className="px-6 py-4 text-[9px] font-black uppercase text-gray-400 text-left border-b border-[#dadce0]">Tipo</th>
                    <th className="px-6 py-4 text-[9px] font-black uppercase text-gray-400 text-right border-b border-[#dadce0]">Cantidad</th>
                    <th className="px-6 py-4 text-[9px] font-black uppercase text-gray-400 text-center border-b border-[#dadce0]">Acción</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-50">
                  {cola.map(item => (
                    <tr key={item.id} className="fade-in hover:bg-gray-50 transition-colors group">
                      <td className="px-6 py-4">
                        <div className="flex flex-col">
                          <span className="text-sm font-black text-[#1c1d1f] font-mono">{item.codigo}</span>
                          <span className="text-[8px] font-bold text-gray-400 uppercase tracking-tighter">Loc: {item.ubicacion}</span>
                        </div>
                      </td>
                      <td className="px-6 py-4">
                        <span className={`text-[8px] font-black uppercase px-2 py-1 rounded-md ${
                          item.tipo === 'Acomodo' ? 'bg-blue-50 text-blue-600 border border-blue-100' : 'bg-amber-50 text-amber-600 border border-amber-100'
                        }`}>
                          {item.tipo}
                        </span>
                      </td>
                      <td className="px-6 py-4 text-right">
                        <span className="text-lg font-black text-[#1c1d1f]">{item.cantidad}</span>
                      </td>
                      <td className="px-6 py-4 text-center">
                        <button
                          onClick={() => setCola(cola.filter(c => c.id !== item.id))}
                          className="p-2 text-gray-300 hover:text-red-500 transition-colors"
                        >
                          <LocalIcon name="trash-2" size={16} />
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>

              {cola.length === 0 && (
                <div className="flex flex-col items-center justify-center h-full text-center p-10 opacity-20">
                  <LocalIcon name="package" size={48} />
                  <p className="text-[10px] font-black uppercase tracking-[0.4em] mt-4">Esperando registros</p>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // Renderizado en el contenedor específico de la vista
      const rootDiv = document.getElementById('render-prototipo-traspasos');
      if (rootDiv) {
        if (window.__PROTOTIPO_TRASPASOS_ROOT__) {
          try {
            window.__PROTOTIPO_TRASPASOS_ROOT__.unmount();
          } catch (e) {
            console.warn("⚠️ [Prototipo] No se pudo desmontar root previo:", e);
          }
          window.__PROTOTIPO_TRASPASOS_ROOT__ = null;
        }

        window.__PROTOTIPO_TRASPASOS_ROOT__ = ReactDOM.createRoot(rootDiv);
        window.__PROTOTIPO_TRASPASOS_ROOT__.render(<VistaPrototipo />);
      }
  };


    
  window.initVista = window.cargar_PrototipoTraspasos;
  console.log("🧩 [PrototipoTraspasos] initVista definida:", typeof window.initVista);

</script>
