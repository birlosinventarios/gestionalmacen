<script>/** GestorExcedentes.html */</script>

<div id="vista-excedentes-root" class="ge-root"></div>

<script type="text/babel">
  console.log("🧩 GestorExcedentes BUILD: 2026-07-06-FAB-SIN-SWITCH-01");

  (function() {
    const { useState, useEffect, useMemo, useRef } = React;

    // =========================================================
    // HELPERS DE NOTIFICACIÓN
    // =========================================================
    const notify_ = (mensaje, tipo = "info", timer = 2500, options = {}) => {
      const fn = window.notificar || window.lanzarNotificacion;
      if (typeof fn === "function") {
        fn(mensaje, tipo, timer, options);
      }
    };

    const createNotifyOnce_ = (ref) => (key, mensaje, tipo = "info", timer = 2500, options = {}, cooldown = 8000) => {
      const now = Date.now();
      const last = ref.current[key] || 0;
      if (now - last < cooldown) return;
      ref.current[key] = now;
      notify_(mensaje, tipo, timer, options);
    };

    const notifyStateShellRef = { current: {} };
    const notifyOnceShell_ = createNotifyOnce_(notifyStateShellRef);

    // =========================================================
    // COMPONENTE: ICONOS DE LUCIDE
    // =========================================================
    const LocalIcon = ({ name, size = 20, className = "" }) => {
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [name, size, className]);

      return (
        <i
          data-lucide={name}
          style={{ width: size, height: size }}
          className={className}
        ></i>
      );
    };

    // =========================================================
    // COMPONENTE: TARJETA DE MÉTRICAS ESTILO PREMIUM
    // Basado en KPIBlock de NegativosBirlos
    // =========================================================
    const SummaryCard = ({
      label,
      value,
      iconName,
      unit = "reg",
      decimals = 0,
      indicatorColor = "emerald",
      trend = null
    }) => {
      const numero = Number(value || 0);

      const valorFormateado = numero.toLocaleString("es-MX", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });

      const colorMap = {
        red: "bg-red-50 text-red-600 border border-red-100",
        amber: "bg-amber-50 text-amber-600 border border-amber-100",
        blue: "bg-blue-50 text-blue-600 border border-blue-100",
        emerald: "bg-emerald-50 text-emerald-600 border border-emerald-100",
        black: "bg-slate-100 text-slate-900 border border-slate-300",
        slate: "bg-slate-50 text-slate-700 border border-slate-200"
      };

      const topBarColor =
        indicatorColor === "red"
          ? "bg-red-500"
          : indicatorColor === "amber"
          ? "bg-amber-500"
          : indicatorColor === "blue"
          ? "bg-blue-500"
          : indicatorColor === "black"
          ? "bg-slate-900"
          : indicatorColor === "slate"
          ? "bg-slate-400"
          : "bg-emerald-500";

      const trendColor =
        trend?.type === "negative"
          ? "bg-red-50 text-red-600"
          : trend?.type === "neutral"
          ? "bg-amber-50 text-amber-700"
          : trend?.type === "info"
          ? "bg-blue-50 text-blue-700"
          : trend?.type === "dark"
          ? "bg-slate-100 text-slate-900 border border-slate-300"
          : "bg-emerald-50 text-emerald-700";

      return (
        <div className="ge-kpi-card p-4 relative overflow-hidden group min-h-[112px]">
          <div className={`absolute top-0 left-0 right-0 h-1.5 ${topBarColor}`}></div>

          <div className="h-full flex flex-col pt-1">
            <div className="grid grid-cols-[1fr_auto] items-center gap-3 h-full">
              <div className="min-w-0">
                <p className="text-[12px] font-black uppercase tracking-[0.12em] text-[#5f6368] leading-tight mb-2">
                  {label}
                </p>

                <div className="flex items-end gap-2 flex-wrap">
                  <h3 className="m-0 p-0 bg-transparent border-none text-[34px] font-black tracking-tight text-[#1c1d1f] leading-none">
                    {valorFormateado}
                  </h3>

                  {unit && (
                    <span className="text-[13px] font-black text-[#5f6368] uppercase leading-none pb-1">
                      {unit}
                    </span>
                  )}
                </div>

                {trend && (
                  <div className="mt-2 flex items-center gap-2 flex-wrap">
                    <span className={`px-2.5 py-1 rounded-full text-[10px] font-black uppercase ${trendColor}`}>
                      {trend.text}
                    </span>

                    {trend.sub && (
                      <span className="text-[11px] font-semibold text-[#5f6368]">
                        {trend.sub}
                      </span>
                    )}
                  </div>
                )}
              </div>

              <div className="justify-self-end">
                <div className={`w-11 h-11 rounded-xl flex items-center justify-center ${colorMap[indicatorColor] || colorMap.slate}`}>
                  <LocalIcon name={iconName} size={28} />
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // =========================================================
    // LÓGICA DE BODEGA POR SERIE
    // =========================================================
    const obtenerNombreBodega = (item) => {
      const serie = String(item.eserie || "").toUpperCase();

      if (serie.startsWith("B1")) return "Bodega 1";
      if (serie.startsWith("B2")) return "Bodega 2";
      if (serie.startsWith("B3")) return "Bodega 3";
      if (serie.startsWith("BM")) return "Bodega Mostrador";
      if (serie.startsWith("CB1")) return "Casa Blanca 1";
      if (serie.startsWith("CB2")) return "Casa Blanca 2";

      return item.ebodegaActual || "Pendiente de ubicación";
    };

    // =========================================================
    // HELPERS DE ESTATUS VISUAL
    // =========================================================
    const obtenerBadgeEstatus = (item) => {
      if (item.conUbicacion) {
        return {
          texto: "Con ubicación",
          clase: "bg-emerald-50 text-emerald-700 border border-emerald-200"
        };
      }

      if (item.pendienteUbicacion) {
        return {
          texto: "Pendiente",
          clase: "bg-amber-50 text-amber-700 border border-amber-200"
        };
      }

      return {
        texto: "Sin definir",
        clase: "bg-slate-100 text-slate-700 border border-slate-200"
      };
    };

    // =========================================================
    // COMPONENTE PRINCIPAL
    // =========================================================
    const VistaGestorExcedentes = () => {
      const [data, setDatos] = useState([]);

      const [resumen, setResumen] = useState({
        totalIdsRegistrados: 0,
        idsUnicosVigentes: 0,
        idsUnicosPendientes: 0,
        idsUnicosConUbicacion: 0,
        stockTotalVigente: 0
      });

      const [loading, setLoading] = useState(true);
      const [filtro, setFiltro] = useState("");
      const [bodegaSeleccionada, setBodegaSeleccionada] = useState("Todos");

      const [isSearchExpanded, setIsSearchExpanded] = useState(false);
      const [isFabMenuOpen, setIsFabMenuOpen] = useState(false);
      const [isFabMenuMounted, setIsFabMenuMounted] = useState(false);
      const [isFabClosing, setIsFabClosing] = useState(false);
      const [isSearchClosing, setIsSearchClosing] = useState(false);

      const searchInputRef = useRef(null);
      const firstLoadDoneRef = useRef(false);
      const notifyStateRef = useRef({});
      const fabContainerRef = useRef(null);

      const notifyOnce_ = createNotifyOnce_(notifyStateRef);

      // =========================================================
      // FAB GLOBAL
      // =========================================================
      const abrirFabMenu_ = () => {
        setIsFabMenuMounted(true);
        setIsFabClosing(false);
        setIsFabMenuOpen(true);
      };

      const cerrarFabMenu_ = () => {
        setIsFabClosing(true);
        setIsSearchClosing(true);

        setTimeout(() => {
          setIsFabMenuOpen(false);
          setIsFabMenuMounted(false);
          setIsFabClosing(false);
          setIsSearchExpanded(false);
          setIsSearchClosing(false);

          // Importante:
          // No limpiar filtro al cerrar el fondo negro/FAB.
          // Así la búsqueda permanece aplicada.
        }, 190);
      };

      const toggleFabMenu_ = () => {
        if (isFabMenuOpen) {
          cerrarFabMenu_();
        } else {
          abrirFabMenu_();
        }
      };

      const abrirBuscador_ = () => {
        setIsSearchClosing(false);
        setIsSearchExpanded(true);
        setTimeout(() => searchInputRef.current?.focus(), 120);
      };

      const cerrarBuscador_ = () => {
        setIsSearchClosing(true);

        setTimeout(() => {
          setIsSearchExpanded(false);
          setIsSearchClosing(false);

          // No limpiar filtro al cerrar el buscador.
          // El usuario puede borrar manualmente el texto si quiere reiniciar la búsqueda.
        }, 180);
      };


      const toggleBuscador_ = () => {
        if (isSearchExpanded) {
          cerrarBuscador_();
        } else {
          abrirBuscador_();
        }
      };

      // ---------------------------------------------------------
      // CARGA INICIAL
      // ---------------------------------------------------------
      useEffect(() => {
        refrescarDatos("init");
      }, []);

      // ---------------------------------------------------------
      // CERRAR FAB CON ESCAPE
      // ---------------------------------------------------------
      useEffect(() => {
        if (!isFabMenuOpen) return;

        const handleKeyDown = (event) => {
          if (event.key === "Escape") {
            cerrarFabMenu_();
          }
        };

        document.addEventListener("keydown", handleKeyDown, true);

        return () => {
          document.removeEventListener("keydown", handleKeyDown, true);
        };
      }, [isFabMenuOpen]);

      // ---------------------------------------------------------
      // REFRESH CONTRA CONTROLLER
      // ---------------------------------------------------------
      const refrescarDatos = (contexto = "manual") => {
        setLoading(true);

        if (contexto === "init") {
          notify_("Cargando gestor de excedentes...", "info", 1600, {
            title: "Inicializando gestor",
            sound: false
          });
        } else {
          notify_("Actualizando gestor de excedentes...", "info", 1400, {
            title: "Sincronizando",
            sound: false
          });
        }

        google.script.run
          .withSuccessHandler((resultado) => {
            console.log("======================================================");
            console.log("📦 [GestorExcedentes] Vista recibida:");
            console.log(resultado);
            console.table((resultado && resultado.data) || []);
            console.log("📊 Resumen:", (resultado && resultado.resumen) || {});
            console.log("======================================================");

            const dataRecibida = Array.isArray(resultado?.data) ? resultado.data : [];
            const resumenRecibido = resultado?.resumen || {};

            setDatos(dataRecibida);

            setResumen({
              totalIdsRegistrados: Number(resumenRecibido.totalIdsRegistrados || 0),
              idsUnicosVigentes: Number(resumenRecibido.idsUnicosVigentes || 0),
              idsUnicosPendientes: Number(resumenRecibido.idsUnicosPendientes || 0),
              idsUnicosConUbicacion: Number(resumenRecibido.idsUnicosConUbicacion || 0),
              stockTotalVigente: Number(resumenRecibido.stockTotalVigente || 0)
            });

            setLoading(false);

            if (dataRecibida.length === 0) {
              if (contexto === "init") {
                notify_("No se encontraron registros de excedentes vigentes.", "warning", 2400, {
                  title: "Sin registros",
                  sound: false
                });
              } else {
                notify_("No hay registros para mostrar en este momento.", "warning", 2200, {
                  title: "Sin registros",
                  sound: false
                });
              }

              firstLoadDoneRef.current = true;
              return;
            }

            if (!firstLoadDoneRef.current) {
              firstLoadDoneRef.current = true;

              notify_(
                `Se cargaron ${dataRecibida.length} registros en el gestor de excedentes.`,
                "success",
                2200,
                {
                  title: "Gestor actualizado",
                  sound: false
                }
              );
            } else if (contexto !== "init") {
              notify_(
                `Datos actualizados correctamente (${dataRecibida.length} registros visibles).`,
                "success",
                1800,
                {
                  title: "Actualización completada",
                  sound: false
                }
              );
            }
          })
          .withFailureHandler((err) => {
            console.error("❌ Error cargando vista de excedentes:", err);

            notify_(
              (err && err.message) ? err.message : "No se pudo recuperar la vista consolidada de excedentes.",
              "error",
              4200,
              {
                title: contexto === "init" ? "Error de carga" : "Error de actualización",
                sound: true
              }
            );

            setDatos([]);

            setResumen({
              totalIdsRegistrados: 0,
              idsUnicosVigentes: 0,
              idsUnicosPendientes: 0,
              idsUnicosConUbicacion: 0,
              stockTotalVigente: 0
            });

            setLoading(false);
          })
          .GestorExcedentesController_obtenerVista();
      };

      const normalizarBusqueda_ = (valor) => {
        return String(valor || "")
          .toLowerCase()
          .trim()
          .replace(/\s+/g, "");
      };

      const coincideBusqueda_ = (item, filtroTexto) => {
        const f = normalizarBusqueda_(filtroTexto);

        if (!f) return true;

        const ubicacionActual = item.eserie || item.ubicacionActual || "";
        const bodegaActual = item.ebodegaActual || "";
        const nombreBodega = obtenerNombreBodega(item);

        const campos = [
          item.ecodigo,
          item.eidUnico,
          item.edescripcion,
          ubicacionActual,
          bodegaActual,
          nombreBodega,
          item.estatusRegistro,
          item.estatusLogico,
          item.estadoOperativo
        ];

        return campos.some(campo =>
          normalizarBusqueda_(campo).includes(f)
        );
      };

      // ---------------------------------------------------------
      // DETECCIÓN DE BODEGAS CON EXISTENCIA SEGÚN BÚSQUEDA
      // ---------------------------------------------------------
      const bodegasConExistenciaBuscada = useMemo(() => {
        const resultado = new Set();

        if (!filtro.trim()) return resultado;

        data.forEach(item => {
          const coincide = coincideBusqueda_(item, filtro);

          if (coincide && Number(item.esaldo) > 0) {
            resultado.add(obtenerNombreBodega(item));
          }
        });

        return resultado;
      }, [data, filtro]);

      // ---------------------------------------------------------
      // FILTROS EN FRONT
      // ---------------------------------------------------------
      const datosFiltrados = useMemo(() => {
        let filtrados = data;

        if (bodegaSeleccionada !== "Todos") {
          filtrados = filtrados.filter(item =>
            obtenerNombreBodega(item) === bodegaSeleccionada
          );
        }

        if (!filtro.trim()) return filtrados;

        return filtrados.filter(item =>
          coincideBusqueda_(item, filtro)
        );
      }, [data, filtro, bodegaSeleccionada]);
      
      const porcentajePendientesUbicar = useMemo(() => {
        const vigentes = Number(resumen.idsUnicosVigentes || 0);
        const pendientes = Number(resumen.idsUnicosPendientes || 0);

        if (vigentes <= 0) return 0;

        return (pendientes / vigentes) * 100;
      }, [resumen]);

      // Segmentación fija
      const opcionBodegas = [
        "Todos",
        "Bodega 1",
        "Bodega 2",
        "Bodega 3",
        "Bodega Mostrador",
        "Casa Blanca 1",
        "Casa Blanca 2",
        "Pendiente de ubicación"
      ];

      return (
        <div className="ge-view-shell">

          {isFabMenuMounted && ReactDOM.createPortal(
            <div
              className={`fixed inset-0 bg-slate-950/45 backdrop-blur-[2px] transition-opacity duration-200 ${
                isFabClosing ? "opacity-0" : "opacity-100"
              }`}
              style={{ zIndex: 9000 }}
              onMouseDown={(e) => {
                e.stopPropagation();
                cerrarFabMenu_();
              }}
            ></div>,
            document.body
          )}

          {/* MÉTRICAS */}
          <div className="px-6 md:px-8 pt-4 pb-3 grid grid-cols-1 md:grid-cols-3 gap-4 shrink-0 fade-in-up">
            <SummaryCard
              label="IDs con ubicación"
              value={resumen.idsUnicosConUbicacion}
              unit="IDs"
              iconName="map-pinned"
              indicatorColor="emerald"
              trend={{
                text: "Ubicados",
                type: "positive",
                sub: "Listos para auditoría"
              }}
            />

            <SummaryCard
              label="Pendientes por ubicar"
              value={resumen.idsUnicosPendientes}
              unit="IDs"
              iconName="clock-3"
              indicatorColor="amber"
              trend={{
                text: "Requieren acomodo",
                type: "neutral",
                sub: "Sin ubicación física"
              }}
            />

            <SummaryCard
              label="% pendiente de ubicación"
              value={porcentajePendientesUbicar}
              unit="%"
              iconName="percent"
              indicatorColor="red"
              decimals={2}
              trend={{
                text: "Indicador crítico",
                type: "negative",
                sub: "Pendientes / vigentes"
              }}
            />
          </div>

          {/* SEGMENTACIÓN POR BODEGA */}
          <div className="px-6 md:px-8 pb-3 flex flex-wrap gap-2 shrink-0">
            {opcionBodegas.map((bodega) => {
              const esActivo = bodegaSeleccionada === bodega;
              const tieneStockBuscado = bodegasConExistenciaBuscada.has(bodega);

              let clasesBordeYFondo = "";

              if (esActivo) {
                clasesBordeYFondo = "bg-[#1c1d1f] text-white border-[#1c1d1f] shadow-md";
              } else if (tieneStockBuscado) {
                clasesBordeYFondo = "bodega-pulso-rojo shadow-md";
              } else {
                clasesBordeYFondo = "bg-white text-[#5f6368] border-[#dadce0] hover:bg-gray-50 hover:text-[#1c1d1f]";
              }

              return (
                <button
                  key={bodega}
                  onClick={() => setBodegaSeleccionada(bodega)}
                  className={`px-4 py-2 rounded-xl text-[12px] font-black uppercase tracking-[0.06em] border transition-all duration-300 active:scale-95 ${clasesBordeYFondo}`}
                >
                  {bodega}
                </button>
              );
            })}
          </div>

          {/* TABLA */}
          <div className="ge-table-zone px-6 md:px-8 pb-4">
            <div className="ge-table-card">

              <div className="ge-table-scroll gestor-tabla-scroll">
                <table className="w-full text-left min-w-[1100px]">



                <thead className="ge-table-head">
                  <tr>
                    <th style={{ fontSize: '20px' }} className="ge-table-th px-6 py-2 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[18%]">
                      SKU / ID único
                    </th>

                    <th style={{ fontSize: '20px' }} className="ge-table-th px-6 py-2 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[34%]">
                      Descripción
                    </th>

                    <th style={{ fontSize: '20px' }} className="ge-table-th px-6 py-2 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[14%]">
                      Balance
                    </th>

                    <th style={{ fontSize: '20px' }} className="ge-table-th px-6 py-2 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[18%]">
                      Ubicación
                    </th>

                    <th style={{ fontSize: '20px' }} className="ge-table-th px-6 py-2 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[16%]">
                      Estado
                    </th>
                  </tr>
                </thead>

                <tbody className="divide-y divide-[#f1f3f4] bg-white">
                  {datosFiltrados.map((item, idx) => {
                    const badge = obtenerBadgeEstatus(item);

                    return (
                      <tr key={item.eidUnico || idx} className="group hover:bg-[#fcfcfc] transition-colors">

                        {/* SKU / ID */}
                        <td className="px-6 py-4 text-left">
                          <div className="flex flex-col items-start gap-1.5">
                            <span className="text-[18px] font-black text-[#1c1d1f] leading-none ml-0.5">
                              {item.ecodigo}
                            </span>

                            <span className="inline-block px-3 py-1 rounded-md bg-[#d93025]/15 border border-[#d93025]/30 text-[#d93025] font-mono text-[17px] font-bold tracking-wider shadow-sm backdrop-blur-sm break-all">
                              {item.eidUnico}
                            </span>
                          </div>
                        </td>

                        {/* DESCRIPCIÓN */}
                        <td className="px-6 py-4 text-center">
                          <span className="text-[20px] font-medium text-[#3c4043] leading-tight block uppercase">
                            {item.edescripcion}
                          </span>
                        </td>

                        {/* BALANCE */}
                        <td className="px-8 py-6 text-center">
                          <div className="inline-flex flex-col items-end">
                            <span className="text-[20px] font-black text-[#1c1d1f]">
                              {item.esaldo || 0}
                            </span>
                            <span className="text-[15px] font-bold uppercase text-[#9aa0a6] tracking-tighter">
                              Unidades Disp.
                            </span>
                          </div>
                        </td>

                        {/* UBICACIÓN */}
                        <td className="px-6 py-4 text-center">
                          <div className="flex flex-col items-center">
                            <span className="text-[20px] text-[#5f6368] font-medium bg-gray-100 px-3 py-0.5 rounded-lg mb-1">
                              {item.eserie || "Sin ubicación"}
                            </span>

                            <span className="text-[18px] font-bold text-[#1c1d1f]">
                              {obtenerNombreBodega(item)}
                            </span>
                          </div>
                        </td>

                        {/* ESTADO */}
                        <td className="px-6 py-4 text-center">
                          <div className="flex flex-col items-center gap-2">
                            <span className={`px-3 py-1.5 rounded-lg text-[12px] font-black uppercase tracking-wide ${badge.clase}`}>
                              {badge.texto}
                            </span>

                            <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wide">
                              {item.estatusRegistro || "Sin dato"}
                            </span>
                          </div>
                        </td>

                      </tr>
                    );
                  })}
                </tbody>
              </table>
              </div>

              {!loading && datosFiltrados.length === 0 && (
                <div className="p-20 flex flex-col items-center justify-center text-center">
                  <div className="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 mb-4">
                    <LocalIcon name="search-x" size={28} />
                  </div>

                  <span className="text-[13px] font-black uppercase tracking-widest text-[#5f6368]">
                    Sin resultados para los filtros actuales
                  </span>

                  <span className="text-[11px] mt-2 text-slate-400 font-semibold">
                    Ajusta la búsqueda o cambia la segmentación de bodega.
                  </span>
                </div>
              )}

              {loading && (
                <div className="p-20 flex flex-col items-center text-[#d93025]">
                  <LocalIcon name="loader-2" size={40} className="animate-spin mb-2" />
                  <span className="text-[10px] font-black uppercase tracking-widest text-[#5f6368]">
                    Sincronizando...
                  </span>
                </div>
              )}
            </div>
          </div>

          {/* MENÚ FLOTANTE GLOBALIZADO */}
          <div
            ref={fabContainerRef}
            className="app-fab-container"
            style={{ zIndex: 9010 }}
          >
            {isFabMenuMounted && isSearchExpanded && (
              <div className={`app-fab-row ${isSearchClosing || isFabClosing ? "app-fab-slide-right" : "app-fab-slide-left"}`}>
                <input
                  ref={searchInputRef}
                  autoFocus
                  type="text"
                  placeholder="Escribe un código, ID o descripción..."
                  className="app-fab-search"
                  value={filtro}
                  onChange={(e) => setFiltro(e.target.value)}
                />
              </div>
            )}

            {isFabMenuMounted && (
              <div className={`app-fab-stack ${isFabClosing ? "app-fab-out" : "app-fab-in"}`}>

                <button
                  type="button"
                  className={`app-fab-action ${isSearchExpanded ? "dark" : ""}`}
                  title={isSearchExpanded ? "Cerrar buscador" : "Buscar material"}
                  onClick={toggleBuscador_}
                >
                  <LocalIcon name={isSearchExpanded ? "x" : "search"} size={24} />
                </button>

                <button
                  type="button"
                  className="app-fab-action"
                  title="Actualizar tabla"
                  onClick={() => refrescarDatos("manual")}
                  disabled={loading}
                >
                  <LocalIcon
                    name="refresh-cw"
                    size={24}
                    className={loading ? "text-[#d93025] animate-spin" : ""}
                  />
                </button>

              </div>
            )}

            <button
              type="button"
              className={`app-fab-main ${isFabMenuOpen ? "open" : ""}`}
              title={isFabMenuOpen ? "Cerrar acciones" : "Abrir acciones"}
              onClick={(e) => {
                e.stopPropagation();
                toggleFabMenu_();
              }}
            >
              <LocalIcon name={isFabMenuOpen ? "x" : "ellipsis-vertical"} size={26} />
            </button>
          </div>
        </div>
      );
    };

    // =========================================================
    // CONTRATO CON EL SHELL
    // =========================================================
    window.cargar_GestorExcedentes = () => {
      const rootEl = document.getElementById("vista-excedentes-root");

      if (!rootEl) {
        console.warn("⚠️ [GestorExcedentes] No se encontró #vista-excedentes-root");
        notify_("No se encontró el contenedor principal del gestor de excedentes.", "error", 4200, {
          title: "Error de interfaz",
          sound: true
        });
        return;
      }

      if (window.__GESTOR_EXCEDENTES_ROOT__) {
        try {
          window.__GESTOR_EXCEDENTES_ROOT__.unmount();
        } catch (e) {
          console.warn("⚠️ [GestorExcedentes] No se pudo desmontar root previo:", e);
          notifyOnceShell_(
            "gestor-root-previo",
            "Se liberó una instancia previa del gestor.",
            "warning",
            1600,
            {
              title: "Reinicialización",
              sound: false
            },
            10000
          );
        }

        window.__GESTOR_EXCEDENTES_ROOT__ = null;
      }

      try {
        window.__GESTOR_EXCEDENTES_ROOT__ = ReactDOM.createRoot(rootEl);
        window.__GESTOR_EXCEDENTES_ROOT__.render(<VistaGestorExcedentes />);
      } catch (e) {
        console.error("❌ [GestorExcedentes] Error montando React root:", e);
        notify_(
          "Ocurrió un error al montar la vista del gestor de excedentes.",
          "error",
          4200,
          {
            title: "Error de montaje",
            sound: true
          }
        );
      }
    };

    window.initVista = window.cargar_GestorExcedentes;
    console.log("🧩 [GestorExcedentes] initVista definida:", typeof window.initVista);

  })();
</script>
