<div id="vista-excedentes-root" class="h-full w-full bg-[#f8f9fa] overflow-hidden relative"></div>

<script type="text/babel">
  (function() {
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // --- COMPONENTE: ICONOS DE LUCIDE ---
    const LocalIcon = ({ name, size = 20, className = "" }) => {
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [name]);
      return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
    };

    // --- COMPONENTE: TARJETA DE MÉTRICAS ---
const SummaryCard = ({ label, value, iconName, colorClass }) => (
  <div className={`bg-white p-6 rounded-[1.5rem] border ${colorClass.split(' ') || 'border-gray-100'} shadow-sm flex items-center gap-6 transition-all hover:shadow-lg hover:-translate-y-1`}>
    <div className={`w-16 h-16 rounded-2xl flex items-center justify-center ${colorClass.split(' ').slice(0,2).join(' ')} shadow-inner`}>
      <LocalIcon name={iconName} size={32} />
    </div>
    <div className="flex flex-col">
      <p className="text-[11px] font-black uppercase tracking-[0.1em] text-[#5f6368] mb-1">
        {label}
      </p>
      <h3 className="text-4xl font-black text-[#1c1d1f] tracking-tighter">
        {value.toLocaleString()} 
        <span className="text-sm font-bold text-gray-400 ml-2 italic">
          {label.includes("Stock") ? "uds" : "reg"}
        </span>
      </h3>
    </div>
  </div>
);

    const VistaGestorExcedentes = () => {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [filtro, setFiltro] = useState("");
      const [isSearchExpanded, setIsSearchExpanded] = useState(false);
      const inputRef = useRef(null);

      // --- CARGA DE DATOS ---
const refrescarDatos = useCallback(() => {
        setLoading(true);
        
        console.group("🔌 [CONEXIÓN] Sincronizando Bitácora - Depuración Cruda");
        
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((res) => {
              const movimientosRaw = Array.isArray(res) ? res : [];
              
              console.log("📦 [BACKEND] Registros brutos recibidos de obtenerMovimientosBitacora:", res);
              console.log(`📊 [CANTIDAD] Total de filas recibidas: ${movimientosRaw.length}`);
              
              if (movimientosRaw.length === 0) {
                window.notificar("La bitácora está vacía o no se pudo leer", "warning");
                setData([]);
                setLoading(false);
                console.groupEnd();
                return;
              }

              try {
                // --- ANALISIS Y SEGMENTACIÓN (Estilo obtenerMegaDataInicial) ---
                const segmentacion = {
                  totalFilas: movimientosRaw.length,
                  porSku: {},
                  porTipoMovimiento: { ACOMODO: [], SURTIDO: [], OTROS: [] },
                  porUbicacion: {}
                };

                const acumuladorLimpio = movimientosRaw.map((mov) => {
                  const item = {
                    idFila: mov.idFila,
                    idUnico: mov.idUnico ? String(mov.idUnico).trim() : `FILA_${mov.idFila}`,
                    fecha: mov.fecha || "",
                    hora: mov.hora || "",
                    tipo: String(mov.tipo || "").toUpperCase().trim(),
                    serie: String(mov.serie || "SIN SERIE").toUpperCase().trim(),
                    bodegaSalida: mov.bodegaSalida || "",
                    ubiSalida: mov.ubiSalida || "",
                    bodegaEntrada: mov.bodegaEntrada || "",
                    ubiEntrada: mov.ubiEntrada || "",
                    solicitante: mov.solicitante || "Sin Solicitante",
                    codigo: String(mov.codigo || "S/C").toUpperCase().trim(),
                    descripcion: String(mov.descripcion || "SIN DESCRIPCIÓN").toUpperCase().trim(),
                    saldo: Number(mov.cantidad || 0), // Respetamos la cantidad directa registrada
                    folio: mov.folio || "",
                    responsable: mov.responsable || "",
                    bodegaActual: mov.bodegaEntrada || mov.bodegaSalida || "General"
                  };

                  // A. Agrupación por SKU (Código de Material)
                  if (!segmentacion.porSku[item.codigo]) {
                    segmentacion.porSku[item.codigo] = [];
                  }
                  segmentacion.porSku[item.codigo].push(item);

                  // B. Agrupación por Tipo de Movimiento
                  if (item.tipo.includes("ACOMODO") || item.tipo.includes("ENTRADA")) {
                    segmentacion.porTipoMovimiento.ACOMODO.push(item);
                  } else if (item.tipo.includes("SURTIDO") || item.tipo.includes("SALIDA")) {
                    segmentacion.porTipoMovimiento.SURTIDO.push(item);
                  } else {
                    segmentacion.porTipoMovimiento.OTROS.push(item);
                  }

                  // C. Agrupación por Ubicación (Serie)
                  if (!segmentacion.porUbicacion[item.serie]) {
                    segmentacion.porUbicacion[item.serie] = [];
                  }
                  segmentacion.porUbicacion[item.serie].push(item);

                  return item;
                });

                // Imprimimos la estructura organizada en consola para tu análisis
                console.group("📊 [ANÁLISIS DE SEGMENTACIÓN EN CONSOLA]");
                console.log("🔍 Agrupados por SKU (Código):", segmentacion.porSku);
                console.log("🔄 Agrupados por Tipo de Movimiento:", segmentacion.porTipoMovimiento);
                console.log("📍 Agrupados por Ubicación (Serie):", segmentacion.porUbicacion);
                console.groupEnd();

                // Guardamos los datos mapeados en el estado
                setData(acumuladorLimpio);
                window.notificar("Datos de la bitácora sincronizados", "success");

              } catch (err) {
                console.error("❌ Error procesando los datos en Frontend:", err);
                window.notificar("Error de formato de datos", "error");
              }

              setLoading(false);
              console.groupEnd();
            })
            .withFailureHandler((err) => {
              console.error("❌ Error de comunicación con Google Apps Script:", err);
              window.notificar("Error de red al conectar al servidor", "error");
              setLoading(false);
              console.groupEnd();
            })
            .obtenerMovimientosBitacora();

        } else {
          // Modo simulación local por si abres el HTML fuera de Google Sheets
          console.warn("⚠️ Entorno local detectado. Cargando simulación de datos.");
          setTimeout(() => {
            const simulacion = [
              { idFila: 2, codigo: "B-200", descripcion: "BIRLO DE ACERO 5/8", cantidad: 600, tipo: "ACOMODO", serie: "B1-01", bodegaEntrada: "Bodega 1", idUnico: "ID-999" }
            ];
            setData(simulacion);
            setLoading(false);
            console.groupEnd();
          }, 800);
        }
      }, []);

      // Disparador de carga inicial
      useEffect(() => {
        refrescarDatos();
      }, [refrescarDatos]);


      // ==========================================
      // 2. FILTRADO SEGURO (Previene "filtered is not defined")
      // ==========================================
      const filteredData = useMemo(() => {
        if (!filtro) return data;
        const f = filtro.toLowerCase().trim();
        return data.filter(item => 
          item.codigo.toLowerCase().includes(f) ||
          item.descripcion.toLowerCase().includes(f) ||
          item.serie.toLowerCase().includes(f) ||
          item.idUnico.toLowerCase().includes(f)
        );
      }, [data, filtro]);

      return (
        <div className="h-full w-full flex flex-col relative bg-[#f8f9fa]">

          {/* Métricas */}
          <div className="px-8 py-6 grid grid-cols-1 md:grid-cols-3 gap-8">
            <SummaryCard 
              label="IDs en Sistema" 
              value={data.length} 
              iconName="database" 
              colorClass="bg-slate-50 text-slate-700 border-slate-100" 
            />
            
            <SummaryCard 
              label="Stock Total Excedente" 
              value={data.reduce((acc, item) => acc + (Number(item.saldo) || 0), 0)} 
              iconName="package-check" 
              colorClass="bg-emerald-50 text-emerald-600 border-emerald-100" 
            />
            
            <SummaryCard 
              label="Resultados Búsqueda" 
              value={filtered.length} 
              iconName="search" 
              colorClass="bg-[#fffafa] text-[#d93025] border-[#fdecea]" 
            />
          </div>

          {/* Tabla */}
          <div className="flex-1 overflow-auto px-8 pb-40">
            <div className="bg-white rounded-[2rem] border border-[#dadce0] overflow-hidden shadow-sm">
              <table className="w-full text-left">
                <thead className="bg-[#f8f9fa] border-b border-[#dadce0] sticky top-0 z-10">
                  <tr>
                    <th style={{ fontSize: '20px' }} className="px-6 py-5 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[15%]">
                      SKU / ID
                    </th>
                    <th style={{ fontSize: '20px' }} className="px-6 py-5 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[45%]">
                      Descripción
                    </th>
                    <th style={{ fontSize: '20px' }} className="px-6 py-5 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[15%]">
                      Balance
                    </th>
                    <th style={{ fontSize: '20px' }} className="px-6 py-5 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[25%]">
                      Ubicación
                    </th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[#f1f3f4] bg-white">
                  {filteredData.map((item, idx) => (
                    <tr key={item.idUnico || i} className="group hover:bg-[#fcfcfc] transition-colors">
                      
                      {/* SKU: Alineado a la izquierda con ID en formato Label de alto contraste */}
                      <td className="px-6 py-4 text-left">
                        <div className="flex flex-col items-start gap-1.5">
                            {/* Código con contraste por grosor y tamaño */}
                          <span className="text-[18px] font-black text-[#1c1d1f] leading-none ml-0.5">
                            {item.codigo}
                          </span>

                          {/* ID UNICO como Label/Badge de alto contraste */}
                          <span className="inline-block px-3 py-1 rounded-md bg-[#d93025]/15 border border-[#d93025]/30 text-[#d93025] font-mono text-[20px] font-bold tracking-wider shadow-sm backdrop-blur-sm">
                            {item.idUnico}
                          </span>                    
                        </div>
                      </td>    

                      {/* DESCRIPCIÓN: Alineado a la derecha */}
                      <td className="px-6 py-4 text-center">
                        <span className="text-[20px] font-medium text-[#3c4043] leading-tight block">
                          {item.descripcion}
                        </span>
                      </td>

                      {/* BALANCE: Centrado */}
                      <td className="px-8 py-6 text-center">
                        <div className="inline-flex flex-col items-end">
                          {/* Texto ahora en negro sólido */}
                          <span className="text-[20px] font-black text-[#1c1d1f]">
                            {item.saldo || 0}
                          </span>
                          <span className="text-[15px] font-bold uppercase text-[#9aa0a6] tracking-tighter">
                            Unidades Disp.
                          </span>
                        </div>
                      </td>

                      {/* UBICACIÓN: Centrado con Lógica de Bodega */}
                      <td className="px-6 py-4 text-center">
                        <div className="flex flex-col items-center">
                          {/* Serie con estilo destacado */}
                          <span className="text-[20px] text-[#5f6368] font-medium bg-gray-100 px-3 py-0.5 rounded-lg mb-1">
                            {item.idUnico.split('|') || 'Sin Serie'}
                          </span>

                          {/* Lógica Condicional para el nombre de la Bodega */}
                          <span className="text-[20px] font-bold text-[#1c1d1f]">
                            {(() => {
                              const serie = (item.serie || "").toUpperCase();
                              if (serie.startsWith("B1")) return "Bodega 1";
                              if (serie.startsWith("B2")) return "Bodega 2";
                              if (serie.startsWith("B3")) return "Bodega 3";
                              if (serie.startsWith("BM")) return "Bodega Mostrador";
                              if (serie.startsWith("CB1")) return "Casa Blanca 1";
                              if (serie.startsWith("CB2")) return "Casa Blanca 2";
                              
                              // Si no cumple ninguna, mostrar el valor por defecto
                              return item.bodegaActual || 'Almacén Central';
                            })()}
                          </span>
                        </div>
                      </td>

                    </tr>
                  ))}
                </tbody>
              </table>
              {loading && (
                <div className="p-20 flex flex-col items-center text-[#d93025]">
                  <LocalIcon name="loader-2" size={40} className="animate-spin mb-2" />
                  <span className="text-[10px] font-black uppercase tracking-widest text-[#5f6368]">Sincronizando...</span>
                </div>
              )}
            </div>
          </div>

          {/* 🔘 BOTONES FLOTANTES (UX FITO) */}
          <div className="fixed bottom-10 right-10 flex flex-col items-end gap-4 z-">
            {/* Buscador */}
            <div className="flex items-center gap-3">
              {isSearchExpanded && (
                <input
                  ref={inputRef}
                  type="text"
                  placeholder="Buscar material..."
                  className="w-72 bg-white border-2 border-[#d93025] rounded-2xl px-6 py-4 shadow-2xl outline-none font-bold text-sm animate-slide-left"
                  value={filtro}
                  onChange={(e) => setFiltro(e.target.value)}
                />
              )}
              <button 
                onClick={() => setIsSearchExpanded(!isSearchExpanded)}
                className={`w-16 h-16 rounded-2xl shadow-lg flex items-center justify-center text-white transition-all active:scale-95 ${isSearchExpanded ? 'bg-[#1c1d1f]' : 'bg-[#d93025]'}`}
              >
                <LocalIcon name={isSearchExpanded ? "x" : "search"} size={28} />
              </button>
            </div>

            {/* Actualizar (Sin efecto de giro en el botón completo) */}
            <button 
              onClick={refrescarDatos}
              disabled={loading}
              className="w-16 h-16 bg-white border border-[#dadce0] rounded-2xl shadow-xl flex items-center justify-center text-[#5f6368] hover:text-[#d93025] transition-all active:scale-90"
              title="Actualizar tabla"
            >
              <LocalIcon 
                name="refresh-cw" 
                size={28} 
                className={loading ? "animate-spin text-[#d93025]" : ""} 
              />
            </button>
          </div>
        </div>
      );
    };

    window.cargar_GestorExcedentes = () => {
      const root = ReactDOM.createRoot(document.getElementById('vista-excedentes-root'));
      root.render(<VistaGestorExcedentes />);
    };

    if (document.getElementById('vista-excedentes-root')) window.cargar_GestorExcedentes();
  })();
</script>

<style>
  .animate-slide-left {
    animation: slideL 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes slideL {
    from {
      opacity: 0;
      transform: translateX(20px);
    }

    to {
      opacity: 1;
      transform: translateX(0);
    }
  }
</style>
