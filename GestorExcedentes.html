<div id="vista-excedentes-root" class="h-full w-full bg-[#f8f9fa] overflow-hidden relative"></div>

<script type="text/babel">
  (function() {
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // --- COMPONENTE: ICONOS DE LUCIDE ---
    const LocalIcon = ({ name, size = 20, className = "" }) => {
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [name]);
      return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
    };

    // --- COMPONENTE: TARJETA DE MÉTRICAS ---
    const SummaryCard = ({ label, value, iconName, colorClass }) => (
      <div className="bg-white p-6 rounded-[2rem] border border-[#dadce0] shadow-sm flex items-center gap-5 transition-all hover:shadow-md hover:-translate-y-1">
        <div className={`w-14 h-14 rounded-2xl flex items-center justify-center ${colorClass}`}>
          <LocalIcon name={iconName} size={28} />
        </div>
        <div>
          <p className="text-[10px] font-black uppercase tracking-widest text-[#5f6368] mb-1">{label}</p>
          <h3 className="text-3xl font-black text-[#1c1d1f] leading-none">{value}</h3>
        </div>
      </div>
    );

    const VistaGestorExcedentes = () => {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [filtro, setFiltro] = useState("");
      const [isSearchExpanded, setIsSearchExpanded] = useState(false);
      const inputRef = useRef(null);

      // --- CARGA DE DATOS ---
      const refrescarDatos = useCallback(() => {
        setLoading(true);
        if (typeof google !== 'undefined') {
          google.script.run
            .withSuccessHandler((res) => {
              setData(res || []);
              setLoading(false);
            })
            .withFailureHandler(() => setLoading(false))
            .obtenerTodaLaBaseExcedentes();
        } else {
          // Datos de simulación
          setTimeout(() => {
            setData([
              { codigo: "B-200", descripcion: "BIRLO DE ACERO 5/8", cantidad: 500, serie: "BODEGA 1" },
              { codigo: "T-500", descripcion: "TORNILLO HEXAGONAL 1/2", cantidad: 1200, serie: "BODEGA 2" }
            ]);
            setLoading(false);
          }, 800);
        }
      }, []);

      useEffect(() => { refrescarDatos(); }, [refrescarDatos]);

      useEffect(() => {
        if (isSearchExpanded && inputRef.current) inputRef.current.focus();
      }, [isSearchExpanded]);

      const filtered = useMemo(() => {
        const q = filtro.toLowerCase().trim();
        return q ? data.filter(d => 
          (d.codigo || "").toLowerCase().includes(q) || 
          (d.descripcion || "").toLowerCase().includes(q)
        ) : data;
      }, [data, filtro]);

      return (
        <div className="h-full w-full flex flex-col relative bg-[#f8f9fa]">

          {/* Métricas */}
          <div className="px-8 py-6 grid grid-cols-1 md:grid-cols-3 gap-6">
            <SummaryCard label="SKUs Totales" value={data.length} iconName="package" colorClass="bg-red-50 text-[#d93025]" />
            <SummaryCard label="Stock Total" value={data.reduce((a, b) => a + (Number(b.cantidad) || 0), 0)} iconName="layers" colorClass="bg-emerald-50 text-emerald-600" />
            <SummaryCard label="Filtro Actual" value={filtered.length} iconName="filter" colorClass="bg-blue-50 text-blue-600" />
          </div>

          {/* Tabla */}
          <div className="flex-1 overflow-auto px-8 pb-40">
            <div className="bg-white rounded-[2rem] border border-[#dadce0] overflow-hidden shadow-sm">
              <table className="w-full text-left">
                <thead className="bg-[#f8f9fa] border-b border-[#dadce0] sticky top-0 z-10">
                  <tr>
                    <th className="px-8 py-4 text-[10px] font-black uppercase text-[#5f6368]">SKU</th>
                    <th className="px-8 py-4 text-[10px] font-black uppercase text-[#5f6368]">Descripción</th>
                    <th className="px-8 py-4 text-[10px] font-black uppercase text-[#5f6368] text-right">Cantidad</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[#f1f3f4]">
                  {filtered.map((item, i) => (
                    <tr key={item.idUnico} className="group hover:bg-[#f8f9fa] transition-all border-b border-gray-100">
                      <td className="px-6 py-4">
                        <div className="flex flex-col">
                          <span className="text-[10px] font-mono text-gray-400 uppercase tracking-tighter">ID: {item.idUnico}</span>
                          <span className="text-sm font-bold text-[#1c1d1f] tracking-tight">{item.codigo}</span>
                        </div>
                      </td>
                      
                      <td className="px-6 py-4">
                        <div className="flex flex-col">
                          <span className="text-sm text-gray-700 leading-tight line-clamp-1">{item.descripcion}</span>
                          <span className="text-[9px] font-semibold text-[#d93025]/70 uppercase">Serie: {item.serie || 'N/A'}</span>
                        </div>
                      </td>

                      <td className="px-6 py-4 text-right">
                        <div className="inline-flex items-center justify-end px-3 py-1 rounded-full bg-emerald-50 border border-emerald-100">
                          <span className="text-lg font-black text-emerald-700">{item.balance}</span>
                          <span className="ml-1 text-[10px] font-bold text-emerald-600/50 uppercase">u.</span>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
              {loading && (
                <div className="p-20 flex flex-col items-center text-[#d93025]">
                  <LocalIcon name="loader-2" size={40} className="animate-spin mb-2" />
                  <span className="text-[10px] font-black uppercase tracking-widest text-[#5f6368]">Sincronizando...</span>
                </div>
              )}
            </div>
          </div>

          {/* 🔘 BOTONES FLOTANTES (UX FITO) */}
          <div className="fixed bottom-10 right-10 flex flex-col items-end gap-4 z-">
            {/* Buscador */}
            <div className="flex items-center gap-3">
              {isSearchExpanded && (
                <input
                  ref={inputRef}
                  type="text"
                  placeholder="Buscar material..."
                  className="w-72 bg-white border-2 border-[#d93025] rounded-2xl px-6 py-4 shadow-2xl outline-none font-bold text-sm animate-slide-left"
                  value={filtro}
                  onChange={(e) => setFiltro(e.target.value)}
                />
              )}
              <button 
                onClick={() => setIsSearchExpanded(!isSearchExpanded)}
                className={`w-16 h-16 rounded-2xl shadow-lg flex items-center justify-center text-white transition-all active:scale-95 ${isSearchExpanded ? 'bg-[#1c1d1f]' : 'bg-[#d93025]'}`}
              >
                <LocalIcon name={isSearchExpanded ? "x" : "search"} size={28} />
              </button>
            </div>

            {/* Actualizar (Sin efecto de giro en el botón completo) */}
            <button 
              onClick={refrescarDatos}
              disabled={loading}
              className="w-16 h-16 bg-white border border-[#dadce0] rounded-2xl shadow-xl flex items-center justify-center text-[#5f6368] hover:text-[#d93025] transition-all active:scale-90"
              title="Actualizar tabla"
            >
              <LocalIcon 
                name="refresh-cw" 
                size={28} 
                className={loading ? "animate-spin text-[#d93025]" : ""} 
              />
            </button>
          </div>
        </div>
      );
    };

    window.cargar_GestorExcedentes = () => {
      const root = ReactDOM.createRoot(document.getElementById('vista-excedentes-root'));
      root.render(<VistaGestorExcedentes />);
    };

    if (document.getElementById('vista-excedentes-root')) window.cargar_GestorExcedentes();
  })();
</script>

<style>
  .animate-slide-left {
    animation: slideL 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes slideL {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }
</style>
