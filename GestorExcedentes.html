<div id="vista-excedentes-root" class="h-full w-full bg-[#f8f9fa] overflow-hidden relative"></div>

<script type="text/babel">
  (function() {
    const { useState, useEffect, useMemo, useRef } = React;

    // =========================================================
    // COMPONENTE: ICONOS DE LUCIDE
    // =========================================================
    const LocalIcon = ({ name, size = 20, className = "" }) => {
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [name]);

      return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
    };

    // =========================================================
    // COMPONENTE: TARJETA DE MÉTRICAS
    // =========================================================
    const SummaryCard = ({ label, value, iconName, colorClass }) => (
      <div className={`bg-white p-6 rounded-[1.5rem] border ${colorClass.split(' ') || 'border-gray-100'} shadow-sm flex items-center gap-6 transition-all hover:shadow-lg hover:-translate-y-1`}>
        <div className={`w-16 h-16 rounded-2xl flex items-center justify-center ${colorClass.split(' ').slice(0,2).join(' ')} shadow-inner`}>
          <LocalIcon name={iconName} size={32} />
        </div>
        <div className="flex flex-col">
          <p className="text-[11px] font-black uppercase tracking-[0.1em] text-[#5f6368] mb-1">
            {label}
          </p>
          <h3 className="text-4xl font-black text-[#1c1d1f] tracking-tighter">
            {Number(value || 0).toLocaleString()}
            <span className="text-sm font-bold text-gray-400 ml-2 italic">
              {label.includes("Stock") ? "uds" : "reg"}
            </span>
          </h3>
        </div>
      </div>
    );

    // =========================================================
    // LÓGICA DE BODEGA POR SERIE
    // =========================================================
    const obtenerNombreBodega = (item) => {
      const serie = String(item.eserie || "").toUpperCase();

      if (serie.startsWith("B1")) return "Bodega 1";
      if (serie.startsWith("B2")) return "Bodega 2";
      if (serie.startsWith("B3")) return "Bodega 3";
      if (serie.startsWith("BM")) return "Bodega Mostrador";
      if (serie.startsWith("CB1")) return "Casa Blanca 1";
      if (serie.startsWith("CB2")) return "Casa Blanca 2";

      return item.ebodegaActual || 'Almacén Central';
    };

    // =========================================================
    // COMPONENTE PRINCIPAL
    // =========================================================
    const VistaGestorExcedentes = () => {
      const [data, setDatos] = useState([]);
      const [loading, setLoading] = useState(true);
      const [filtro, setFiltro] = useState("");
      const [bodegaSeleccionada, setBodegaSeleccionada] = useState("Todos");
      const [isSearchExpanded, setIsSearchExpanded] = useState(false);
      const inputRef = useRef(null);

      // ---------------------------------------------------------
      // CARGA INICIAL
      // ---------------------------------------------------------
      useEffect(() => {
        refrescarDatos();
      }, []);

      // ---------------------------------------------------------
      // REFRESH CONTRA CONTROLLER NUEVO
      // ---------------------------------------------------------
      const refrescarDatos = () => {
        setLoading(true);

        google.script.run
          .withSuccessHandler((resultado) => {
            console.log("======================================================");
            console.log("📦 [GestorExcedentes] Datos consolidados recibidos:");
            console.table(resultado || []);
            console.log(`📊 Total registros consolidados: ${(resultado || []).length}`);
            console.log("======================================================");

            setDatos(Array.isArray(resultado) ? resultado : []);
            setLoading(false);
          })
          .withFailureHandler((err) => {
            console.error("❌ Error cargando excedentes consolidados:", err);

            if (typeof window.notificar === "function") {
              window.notificar("No se pudieron recuperar los excedentes consolidados", "error");
            } else if (typeof Swal !== "undefined") {
              Swal.fire("Error", "No se pudieron recuperar los excedentes consolidados", "error");
            }

            setDatos([]);
            setLoading(false);
          })
          .GestorExcedentesController_obtenerExcedentesConsolidados();
      };

      // ---------------------------------------------------------
      // DETECCIÓN DE BODEGAS CON STOCK SEGÚN LA BÚSQUEDA
      // ---------------------------------------------------------
      const bodegasConExistenciaBuscada = useMemo(() => {
        const resultado = new Set();
        const f = filtro.toLowerCase().trim();

        if (!f) return resultado;

        data.forEach(item => {
          const coincide =
            (item.ecodigo && item.ecodigo.toLowerCase().includes(f)) ||
            (item.eidUnico && item.eidUnico.toLowerCase().includes(f)) ||
            (item.edescripcion && item.edescripcion.toLowerCase().includes(f));

          if (coincide && Number(item.esaldo) > 0) {
            resultado.add(obtenerNombreBodega(item));
          }
        });

        return resultado;
      }, [data, filtro]);

      // ---------------------------------------------------------
      // FILTROS EN FRONT
      // ---------------------------------------------------------
      const datosFiltrados = useMemo(() => {
        let filtrados = data;

        // 1) Filtrado por bodega
        if (bodegaSeleccionada !== "Todos") {
          filtrados = filtrados.filter(item => obtenerNombreBodega(item) === bodegaSeleccionada);
        }

        // 2) Filtrado por búsqueda libre
        if (!filtro.trim()) return filtrados;

        const f = filtro.toLowerCase().trim();
        return filtrados.filter(item =>
          (item.ecodigo && item.ecodigo.toLowerCase().includes(f)) ||
          (item.eidUnico && item.eidUnico.toLowerCase().includes(f)) ||
          (item.edescripcion && item.edescripcion.toLowerCase().includes(f))
        );
      }, [data, filtro, bodegaSeleccionada]);

      // Segmentación fija
      const opcionBodegas = [
        "Todos",
        "Bodega 1",
        "Bodega 2",
        "Bodega 3",
        "Bodega Mostrador",
        "Casa Blanca 1",
        "Casa Blanca 2"
      ];

      return (
        <div className="h-full w-full flex flex-col relative bg-[#f8f9fa]">

          {/* MÉTRICAS */}
          <div className="px-8 py-6 grid grid-cols-1 md:grid-cols-3 gap-8">
            <SummaryCard
              label="IDs en Sistema"
              value={data.length}
              iconName="database"
              colorClass="bg-slate-50 text-slate-700 border-slate-100"
            />

            <SummaryCard
              label="Stock Total Excedente"
              value={data.reduce((acc, item) => acc + (Number(item.esaldo) || 0), 0)}
              iconName="package-check"
              colorClass="bg-emerald-50 text-emerald-600 border-emerald-100"
            />

            <SummaryCard
              label="Resultados Búsqueda"
              value={datosFiltrados.length}
              iconName="search"
              colorClass="bg-[#fffafa] text-[#d93025] border-[#fdecea]"
            />
          </div>

          {/* SEGMENTACIÓN POR BODEGA */}
          <div className="px-8 pb-5 flex flex-wrap gap-2 shrink-0">
            {opcionBodegas.map((bodega) => {
              const esActivo = bodegaSeleccionada === bodega;
              const tieneStockBuscado = bodegasConExistenciaBuscada.has(bodega);

              let clasesBordeYFondo = "";
              if (esActivo) {
                clasesBordeYFondo = "bg-[#1c1d1f] text-white border-[#1c1d1f] shadow-md";
              } else if (tieneStockBuscado) {
                clasesBordeYFondo = "bodega-pulso-rojo shadow-md";
              } else {
                clasesBordeYFondo = "bg-white text-[#5f6368] border-[#dadce0] hover:bg-gray-50 hover:text-[#1c1d1f]";
              }

              return (
                <button
                  key={bodega}
                  onClick={() => setBodegaSeleccionada(bodega)}
                  className={`px-5 py-2.5 rounded-xl text-sm font-black tracking-tight border-2 transition-all duration-300 active:scale-95 ${clasesBordeYFondo}`}
                >
                  {bodega}
                </button>
              );
            })}
          </div>

          {/* TABLA */}
          <div className="flex-1 overflow-auto px-8 pb-40">
            <div className="bg-white rounded-[2rem] border border-[#dadce0] overflow-hidden shadow-sm">
              <table className="w-full text-left">
                <thead className="bg-[#f8f9fa] border-b border-[#dadce0] sticky top-0 z-10">
                  <tr>
                    <th style={{ fontSize: '20px' }} className="px-6 py-2 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[15%]">
                      SKU / ID
                    </th>
                    <th style={{ fontSize: '20px' }} className="px-6 py-2 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[45%]">
                      Descripción
                    </th>
                    <th style={{ fontSize: '20px' }} className="px-6 py-2 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[15%]">
                      Balance
                    </th>
                    <th style={{ fontSize: '20px' }} className="px-6 py-2 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[25%]">
                      Ubicación
                    </th>
                  </tr>
                </thead>

                <tbody className="divide-y divide-[#f1f3f4] bg-white">
                  {datosFiltrados.map((item, idx) => (
                    <tr key={item.eidUnico || idx} className="group hover:bg-[#fcfcfc] transition-colors">

                      {/* SKU / ID */}
                      <td className="px-6 py-4 text-left">
                        <div className="flex flex-col items-start gap-1.5">
                          <span className="text-[18px] font-black text-[#1c1d1f] leading-none ml-0.5">
                            {item.ecodigo}
                          </span>

                          <span className="inline-block px-3 py-1 rounded-md bg-[#d93025]/15 border border-[#d93025]/30 text-[#d93025] font-mono text-[20px] font-bold tracking-wider shadow-sm backdrop-blur-sm">
                            {item.eidUnico}
                          </span>
                        </div>
                      </td>

                      {/* DESCRIPCIÓN */}
                      <td className="px-6 py-4 text-center">
                        <span className="text-[20px] font-medium text-[#3c4043] leading-tight block">
                          {item.edescripcion}
                        </span>
                      </td>

                      {/* BALANCE */}
                      <td className="px-8 py-6 text-center">
                        <div className="inline-flex flex-col items-end">
                          <span className="text-[20px] font-black text-[#1c1d1f]">
                            {item.esaldo || 0}
                          </span>
                          <span className="text-[15px] font-bold uppercase text-[#9aa0a6] tracking-tighter">
                            Unidades Disp.
                          </span>
                        </div>
                      </td>

                      {/* UBICACIÓN */}
                      <td className="px-6 py-4 text-center">
                        <div className="flex flex-col items-center">
                          <span className="text-[20px] text-[#5f6368] font-medium bg-gray-100 px-3 py-0.5 rounded-lg mb-1">
                            {item.eserie || 'Sin Serie'}
                          </span>

                          <span className="text-[20px] font-bold text-[#1c1d1f]">
                            {obtenerNombreBodega(item)}
                          </span>
                        </div>
                      </td>

                    </tr>
                  ))}
                </tbody>
              </table>

              {loading && (
                <div className="p-20 flex flex-col items-center text-[#d93025]">
                  <LocalIcon name="loader-2" size={40} className="animate-spin mb-2" />
                  <span className="text-[10px] font-black uppercase tracking-widest text-[#5f6368]">
                    Sincronizando...
                  </span>
                </div>
              )}
            </div>
          </div>

          {/* BOTONES FLOTANTES */}
          <div className="fixed bottom-10 right-10 flex flex-col items-end gap-5 z-50">

            {/* BUSCADOR EXPANDIBLE */}
            <div className="flex items-center gap-3">
              {isSearchExpanded && (
                <input
                  ref={inputRef}
                  autoFocus
                  type="text"
                  placeholder="Escribe un codigo..."
                  className="w-80 bg-white/90 backdrop-blur-md border-2 border-[#d93025] rounded-[1.25rem] px-6 py-4 shadow-[0_20px_50px_rgba(217,48,37,0.15)] outline-none font-bold text-sm text-[#1c1d1f] transition-all duration-300 placeholder-gray-400 focus:ring-4 focus:ring-[#d93025]/20 focus:border-[#d93025] animate-slide-left"
                  value={filtro}
                  onChange={(e) => setFiltro(e.target.value)}
                />
              )}

              <button
                onClick={() => {
                  setIsSearchExpanded(!isSearchExpanded);
                  if (!isSearchExpanded) {
                    setTimeout(() => inputRef.current?.focus(), 120);
                  } else {
                    setFiltro("");
                  }
                }}
                className={`w-16 h-16 rounded-[1.25rem] shadow-lg flex items-center justify-center text-white transition-all duration-500 transform active:scale-95 hover:scale-105 hover:shadow-[0_10px_25px_rgba(217,48,37,0.3)] ${
                  isSearchExpanded
                    ? 'bg-[#1c1d1f] hover:bg-black ring-4 ring-black/10'
                    : 'bg-[#d93025] hover:bg-[#b02218] ring-4 ring-[#d93025]/10'
                }`}
                title={isSearchExpanded ? "Cerrar buscador" : "Buscar material"}
              >
                <LocalIcon name={isSearchExpanded ? "x" : "search"} size={26} />
              </button>
            </div>

            {/* REFRESH */}
            <button
              onClick={refrescarDatos}
              disabled={loading}
              className="w-16 h-16 bg-white/90 backdrop-blur-md border border-[#dadce0] rounded-[1.25rem] shadow-lg flex items-center justify-center text-[#5f6368] hover:text-[#d93025] hover:border-[#d93025]/40 transition-all duration-300 transform active:scale-95 hover:scale-105 hover:shadow-[0_10px_20px_rgba(0,0,0,0.05)] disabled:opacity-50 disabled:pointer-events-none"
              title="Actualizar tabla"
            >
              <LocalIcon
                name="refresh-cw"
                size={26}
                className={loading ? "text-[#d93025]" : ""}
              />
            </button>
          </div>
        </div>
      );
    };

    // =========================================================
    // CONTRATO CON EL SHELL
    // =========================================================
    window.cargar_GestorExcedentes = () => {
      const rootEl = document.getElementById('vista-excedentes-root');
      if (!rootEl) {
        console.warn("⚠️ [GestorExcedentes] No se encontró #vista-excedentes-root");
        return;
      }

      if (window.__GESTOR_EXCEDENTES_ROOT__) {
        try {
          window.__GESTOR_EXCEDENTES_ROOT__.unmount();
        } catch (e) {
          console.warn("⚠️ [GestorExcedentes] No se pudo desmontar root previo:", e);
        }
      }

      window.__GESTOR_EXCEDENTES_ROOT__ = ReactDOM.createRoot(rootEl);
      window.__GESTOR_EXCEDENTES_ROOT__.render(<VistaGestorExcedentes />);
    };

    window.initVista = window.cargar_GestorExcedentes;
    console.log("🧩 [GestorExcedentes] initVista definida:", typeof window.initVista);

  })();
</script>

<style>
  .animate-slide-left {
    animation: slideL 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes slideL {
    from {
      opacity: 0;
      transform: translateX(40px) scale(0.9);
    }
    to {
      opacity: 1;
      transform: translateX(0) scale(1);
    }
  }

  .bodega-pulso-rojo {
    color: #d93025 !important;
    border-color: #d93025 !important;
    --tw-shadow: 0 0 #0000 !important;
    animation: resplandorRojoFuerte 1.2s infinite alternate ease-in-out !important;
  }

  @keyframes resplandorRojoFuerte {
    0% {
      box-shadow: 0 0 0 0 rgba(217, 48, 37, 0.4);
      background-color: #ffffff;
    }
    100% {
      box-shadow: 0 0 16px 4px rgba(217, 48, 37, 0.6);
      background-color: rgba(217, 48, 37, 0.05);
    }
  }
</style>
