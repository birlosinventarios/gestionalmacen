<script>
  /**
   * GestorExcedentes.html
   *
   * Vista consolidada para consultar el estado operativo de los excedentes.
   *
   * Responsabilidades:
   * - Obtener la vista consolidada y su resumen desde el Controller.
   * - Mostrar indicadores de ubicación, pendientes y stock vigente.
   * - Filtrar registros por texto y bodega operativa.
   * - Inferir la bodega visible a partir de la serie o ubicación actual.
   * - Destacar bodegas con existencias coincidentes con la búsqueda.
   * - Exportar reportes XLSX por bodega o por código.
   * - Medir solicitud, respuesta, actualización de estado y pintura de interfaz.
   * - Evitar solicitudes concurrentes y descartar respuestas obsoletas.
   * - Administrar el montaje y desmontaje de la raíz React.
   *
   * Dependencias globales:
   * - React y ReactDOM.
   * - FitoComponents para iconos y bloques KPI.
   * - google.script.run.
   * - window.XLSXExportUtilidades.
   * - window.notificar o window.lanzarNotificacion.
   *
   * Controller consumido:
   * - GestorExcedentesController_obtenerVista().
   *
   * Contratos globales expuestos:
   * - window.cargar_GestorExcedentes().
   * - window.initVista.
   * - window.__GESTOR_EXCEDENTES_ROOT__.
   *
   * Invariantes operativos:
   * - Solo una solicitud de carga puede permanecer activa a la vez.
   * - Las respuestas con secuencia anterior a la ya aplicada se ignoran.
   * - La vista desmontada no debe aplicar resultados tardíos.
   * - La búsqueda no modifica el conjunto original recibido del servidor.
   * - La exportación opera sobre el conjunto consolidado vigente.
   * - Este archivo no contiene scriptlets de plantilla de Apps Script.
   */
</script>

<div id="vista-excedentes-root" class="ge-root"></div>

<script type="text/babel">

  (function() {
    const { useState, useEffect, useMemo, useRef } = React;

    /**
     * Inicia una traza de rendimiento del cliente.
     * @param {string} operation Nombre estable de la operación.
     * @param {Object=} metadata Contexto inicial.
     * @return {Object} Traza mutable.
     */
    const gePerfStart_ = (
      operation,
      metadata = {}
    ) => {
      const now =
        performance.now();

      return {
        operation:
          String(
            operation ||
            "GESTOR_OPERATION"
          ),

        startedAt:
          now,

        lastAt:
          now,

        metadata:
          metadata &&
          typeof metadata ===
            "object"
            ? metadata
            : {},

        marks:
          [],

        ended:
          false
      };
    };

    /**
     * Agrega una marca temporal a una traza activa.
     * @param {Object} trace Traza iniciada previamente.
     * @param {string} stage Etapa registrada.
     * @param {Object=} metadata Contexto adicional.
     * @return {void}
     */
    const gePerfMark_ = (
      trace,
      stage,
      metadata = {}
    ) => {
      if (
        !trace ||
        trace.ended === true
      ) {
        return;
      }

      const now =
        performance.now();

      trace.marks.push({
        etapa:
          String(
            stage || "MARK"
          ),

        segmento_ms:
          Number(
            (
              now -
              trace.lastAt
            ).toFixed(1)
          ),

        acumulado_ms:
          Number(
            (
              now -
              trace.startedAt
            ).toFixed(1)
          ),

        metadata:
          metadata
      });

      trace.lastAt =
        now;
    };

    /**
     * Finaliza y publica una traza de rendimiento.
     * @param {Object} trace Traza activa.
     * @param {string=} status Estado final.
     * @param {Object=} metadata Contexto final.
     * @return {Object|null} Resultado consolidado o null.
     */
    const gePerfEnd_ = (
      trace,
      status = "ok",
      metadata = {}
    ) => {
      if (
        !trace ||
        trace.ended === true
      ) {
        return null;
      }

      trace.ended =
        true;

      const result = {
        operation:
          trace.operation,

        status:
          status,

        totalMs:
          Number(
            (
              performance.now() -
              trace.startedAt
            ).toFixed(1)
          ),

        metadata:
          Object.assign(
            {},
            trace.metadata,
            metadata || {}
          ),

        marks:
          trace.marks.slice()
      };

      console.log(
        "[APPALMACEN]" +
        "[PERF]" +
        "[" +
        result.operation +
        "] " +
        result.totalMs +
        " ms | " +
        result.status
      );

      console.table(
        result.marks
      );

      console.log(
        "Metadatos:",
        result.metadata
      );

      return result;
    };

    /** Ejecuta una acción después de dos ciclos de pintura del navegador. */
    const geAfterPaint_ =
      callback => {
        window.requestAnimationFrame(
          () => {
            window.requestAnimationFrame(
              callback
            );
          }
        );
      };

    // =========================================================
    // HELPERS DE NOTIFICACIÓN
    // =========================================================
    /** Emite una notificación mediante la infraestructura global del shell. */
    const notify_ = (mensaje, tipo = "info", timer = 2500, options = {}) => {
      const fn = window.notificar || window.lanzarNotificacion;
      if (typeof fn === "function") {
        fn(mensaje, tipo, timer, options);
      }
    };

    /** Crea un emisor de notificaciones con enfriamiento por clave. */
    const createNotifyOnce_ = (ref) => (key, mensaje, tipo = "info", timer = 2500, options = {}, cooldown = 8000) => {
      const now = Date.now();
      const last = ref.current[key] || 0;
      if (now - last < cooldown) return;
      ref.current[key] = now;
      notify_(mensaje, tipo, timer, options);
    };

    const notifyStateShellRef = { current: {} };
    const notifyOnceShell_ = createNotifyOnce_(notifyStateShellRef);

    // =========================================================
    // COMPONENTE: ICONOS DE LUCIDE
    // =========================================================
    const LocalIcon =
      window.FitoComponents?.Icon?.LocalIcon ||
      window.FitoComponents?.LocalIcon;

    const KPIBlock =
      window.FitoComponents?.KPI?.Block ||
      window.FitoComponents?.KPIBlock;

    // =========================================================
    // LÓGICA DE BODEGA POR SERIE
    // =========================================================
    /**
     * Resuelve la bodega operativa a partir de la serie o ubicación actual.
     * @param {Object} item Excedente consolidado.
     * @return {string} Nombre visible de la bodega.
     */
    const obtenerNombreBodega = (item) => {
      const serie =
        String(
          item.eserie ||
          item.ubicacionActual ||
          ""
        )
          .trim()
          .toUpperCase();

      if (serie.startsWith("B1")) {
        return "Bodega 1";
      }

      if (serie.startsWith("B2")) {
        return "Bodega 2";
      }

      if (serie.startsWith("B3")) {
        return "Bodega 3";
      }

      if (serie.startsWith("BM")) {
        return "Bodega Mostrador";
      }

      if (serie.startsWith("CB1")) {
        return "Casa Blanca 1";
      }

      if (
        serie.startsWith("CB2") ||
        serie.startsWith("P1-") ||
        serie.startsWith("A1-") ||
        serie.startsWith("A2-") ||
        serie.startsWith("A3-") ||
        serie.startsWith("E1-")
      ) {
        return "Casa Blanca 2";
      }

      if (serie.startsWith("CU")) {
        return "Cuarto Alto Riesgo";
      }

      if (serie.startsWith("MO")) {
        return "Mostrador";
      }

      return (
        item.ebodegaActual ||
        item.bodegaActual ||
        "Pendiente de ubicación"
      );
    };

    // =========================================================
    // HELPERS DE ESTATUS VISUAL
    // =========================================================
    /**
     * Construye el contrato visual del estado de ubicación.
     * @param {Object} item Excedente consolidado.
     * @return {{texto:string,clase:string}} Configuración del distintivo.
     */
    const obtenerBadgeEstatus = (item) => {
      if (item.conUbicacion) {
        return {
          texto: "Con ubicación",
          clase: "bg-emerald-50 text-emerald-700 border border-emerald-200"
        };
      }

      if (item.pendienteUbicacion) {
        return {
          texto: "Pendiente",
          clase: "bg-amber-50 text-amber-700 border border-amber-200"
        };
      }

      return {
        texto: "Sin definir",
        clase: "bg-slate-100 text-slate-700 border border-slate-200"
      };
    };

    /** Presenta números con configuración regional de México. */
    const formatearNumero_ = (valor, decimals = 0) => {
      const numero = Number(valor || 0);

      return numero.toLocaleString("es-MX", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });
    };

    // =========================================================
    // COMPONENTE PRINCIPAL
    // =========================================================
    /**
     * Componente principal del gestor consolidado de excedentes.
     * @return {React.ReactElement}
     */
    const VistaGestorExcedentes = () => {
      const [data, setDatos] = useState([]);

      const [resumen, setResumen] = useState({
        totalIdsRegistrados: 0,
        idsUnicosVigentes: 0,
        idsUnicosPendientes: 0,
        idsUnicosConUbicacion: 0,
        stockTotalVigente: 0
      });

      const [loading, setLoading] = useState(true);
      const [filtro, setFiltro] = useState("");
      const [bodegaSeleccionada, setBodegaSeleccionada] = useState("Todos");
      const [exportMenuOpen, setExportMenuOpen] = useState(false);
      const [exportCodigoFiltro, setExportCodigoFiltro] = useState("");

      const searchInputRef = useRef(null);
      const firstLoadDoneRef = useRef(false);
      const notifyStateRef = useRef({});
      const exportMenuRef = useRef(null);

      const mountedRef =
        useRef(true);

      const requestBusyRef =
        useRef(false);

      const requestSequenceRef =
        useRef(0);

      const lastAppliedSequenceRef =
        useRef(0);

      const notifyOnce_ = createNotifyOnce_(notifyStateRef);

      // ---------------------------------------------------------
      // CARGA INICIAL
      // ---------------------------------------------------------
      useEffect(
        () => {
          mountedRef.current =
            true;

          refrescarDatos(
            "init"
          );

          return () => {
            mountedRef.current =
              false;
          };
        },
        []
      );

      useEffect(() => {
        if (!exportMenuOpen) return;

        const handleClickOutside = (event) => {
          if (
            exportMenuRef.current &&
            !exportMenuRef.current.contains(event.target)
          ) {
            setExportMenuOpen(false);
          }
        };

        const handleKeyDown = (event) => {
          if (event.key === "Escape") {
            setExportMenuOpen(false);
          }
        };

        document.addEventListener("mousedown", handleClickOutside, true);
        document.addEventListener("keydown", handleKeyDown, true);

        return () => {
          document.removeEventListener("mousedown", handleClickOutside, true);
          document.removeEventListener("keydown", handleKeyDown, true);
        };
      }, [exportMenuOpen]);

      // ---------------------------------------------------------
      // REFRESH CONTRA CONTROLLER
      // ---------------------------------------------------------
      /**
       * Solicita la vista consolidada y protege la aplicación de respuestas tardías.
       * @param {"init"|"manual"|string=} contexto Origen de la carga.
       * @return {void}
       */
      const refrescarDatos = (
        contexto = "manual"
      ) => {
        if (
          requestBusyRef.current
        ) {
          console.log(
            "[APPALMACEN]" +
            "[PERF]" +
            "[GESTOR_EXCEDENTES_CARGAR_SKIPPED]",
            {
              contexto:
                contexto,

              reason:
                "REQUEST_ALREADY_IN_FLIGHT"
            }
          );

          return;
        }

        const requestSequence =
          ++requestSequenceRef.current;

        const trace =
          gePerfStart_(
            "GESTOR_EXCEDENTES_CARGAR",
            {
              contexto:
                contexto,

              requestSequence:
                requestSequence
            }
          );

        requestBusyRef.current =
          true;

        setLoading(
          true
        );

        gePerfMark_(
          trace,
          "LOADING_STATE_REQUESTED"
        );

        if (
          contexto === "init"
        ) {
          notify_(
            "Cargando gestor de excedentes...",
            "info",
            1600,
            {
              title:
                "Inicializando gestor",

              sound:
                false
            }
          );
        } else {
          notify_(
            "Actualizando gestor de excedentes...",
            "info",
            1400,
            {
              title:
                "Sincronizando",

              sound:
                false
            }
          );
        }

        gePerfMark_(
          trace,
          "SERVER_REQUEST_STARTING"
        );

        google.script.run
          .withSuccessHandler(
            resultado => {
              const responseReceivedAt =
                performance.now();

              requestBusyRef.current =
                false;

              const dataRecibida =
                Array.isArray(
                  resultado &&
                  resultado.data
                )
                  ? resultado.data
                  : [];

              const resumenRecibido =
                resultado &&
                resultado.resumen
                  ? resultado.resumen
                  : {};

              gePerfMark_(
                trace,
                "SERVER_RESPONSE_RECEIVED",
                {
                  rows:
                    dataRecibida.length
                }
              );

              if (
                !mountedRef.current
              ) {
                gePerfEnd_(
                  trace,
                  "ignored",
                  {
                    reason:
                      "VIEW_UNMOUNTED"
                  }
                );

                return;
              }

              if (
                requestSequence <
                lastAppliedSequenceRef
                  .current
              ) {
                gePerfEnd_(
                  trace,
                  "ignored",
                  {
                    reason:
                      "STALE_RESPONSE"
                  }
                );

                return;
              }

              lastAppliedSequenceRef
                .current =
                requestSequence;

              console.log(
                "[GestorExcedentes] " +
                "Vista recibida",
                {
                  registros:
                    dataRecibida.length,

                  resumen:
                    resumenRecibido
                }
              );

              setDatos(
                dataRecibida
              );

              setResumen({
                totalIdsRegistrados:
                  Number(
                    resumenRecibido
                      .totalIdsRegistrados ||
                    0
                  ),

                idsUnicosVigentes:
                  Number(
                    resumenRecibido
                      .idsUnicosVigentes ||
                    0
                  ),

                idsUnicosPendientes:
                  Number(
                    resumenRecibido
                      .idsUnicosPendientes ||
                    0
                  ),

                idsUnicosConUbicacion:
                  Number(
                    resumenRecibido
                      .idsUnicosConUbicacion ||
                    0
                  ),

                stockTotalVigente:
                  Number(
                    resumenRecibido
                      .stockTotalVigente ||
                    0
                  )
              });

              setLoading(
                false
              );

              gePerfMark_(
                trace,
                "REACT_STATE_REQUESTED",
                {
                  rows:
                    dataRecibida.length
                }
              );

              if (
                dataRecibida.length ===
                0
              ) {
                notify_(
                  contexto === "init"
                    ? "No se encontraron registros de excedentes vigentes."
                    : "No hay registros para mostrar en este momento.",
                  "warning",
                  contexto === "init"
                    ? 2400
                    : 2200,
                  {
                    title:
                      "Sin registros",

                    sound:
                      false
                  }
                );

                firstLoadDoneRef.current =
                  true;
              } else if (
                !firstLoadDoneRef.current
              ) {
                firstLoadDoneRef.current =
                  true;

                notify_(
                  "Se cargaron " +
                  dataRecibida.length +
                  " registros en el gestor de excedentes.",
                  "success",
                  2200,
                  {
                    title:
                      "Gestor actualizado",

                    sound:
                      false
                  }
                );
              } else if (
                contexto !== "init"
              ) {
                notify_(
                  "Datos actualizados correctamente (" +
                  dataRecibida.length +
                  " registros visibles).",
                  "success",
                  1800,
                  {
                    title:
                      "Actualización completada",

                    sound:
                      false
                  }
                );
              }

              geAfterPaint_(
                () => {
                  gePerfMark_(
                    trace,
                    "UI_PAINT_COMPLETED",
                    {
                      rows:
                        dataRecibida.length,

                      responseHandlerMs:
                        Number(
                          (
                            performance.now() -
                            responseReceivedAt
                          ).toFixed(1)
                        )
                    }
                  );

                  gePerfEnd_(
                    trace,
                    "ok",
                    {
                      rows:
                        dataRecibida.length
                    }
                  );
                }
              );
            }
          )
          .withFailureHandler(
            error => {
              requestBusyRef.current =
                false;

              const text =
                error &&
                error.message
                  ? error.message
                  : "No se pudo recuperar la vista consolidada de excedentes.";

              gePerfMark_(
                trace,
                "SERVER_REQUEST_FAILED",
                {
                  message:
                    text
                }
              );

              if (
                !mountedRef.current
              ) {
                gePerfEnd_(
                  trace,
                  "error",
                  {
                    reason:
                      "VIEW_UNMOUNTED",

                    message:
                      text
                  }
                );

                return;
              }

              console.error(
                "[GestorExcedentes] " +
                "Error cargando vista:",
                error
              );

              notify_(
                text,
                "error",
                4200,
                {
                  title:
                    contexto === "init"
                      ? "Error de carga"
                      : "Error de actualización",

                  sound:
                    true
                }
              );

              setDatos(
                []
              );

              setResumen({
                totalIdsRegistrados:
                  0,

                idsUnicosVigentes:
                  0,

                idsUnicosPendientes:
                  0,

                idsUnicosConUbicacion:
                  0,

                stockTotalVigente:
                  0
              });

              setLoading(
                false
              );

              geAfterPaint_(
                () => {
                  gePerfMark_(
                    trace,
                    "ERROR_UI_PAINT_COMPLETED"
                  );

                  gePerfEnd_(
                    trace,
                    "error",
                    {
                      message:
                        text
                    }
                  );
                }
              );
            }
          )
          .GestorExcedentesController_obtenerVista();
      };

      /** Normaliza texto para comparaciones flexibles sin espacios. */
      const normalizarBusqueda_ = (valor) => {
        return String(valor || "")
          .toLowerCase()
          .trim()
          .replace(/\s+/g, "");
      };

      /**
       * Comprueba si un excedente coincide con el texto de búsqueda.
       * @param {Object} item Excedente evaluado.
       * @param {*} filtroTexto Texto capturado.
       * @return {boolean}
       */
      const coincideBusqueda_ = (item, filtroTexto) => {
        const f = normalizarBusqueda_(filtroTexto);

        if (!f) return true;

        const ubicacionActual = item.eserie || item.ubicacionActual || "";
        const bodegaActual = item.ebodegaActual || "";
        const nombreBodega = obtenerNombreBodega(item);

        const campos = [
          item.ecodigo,
          item.eidUnico,
          item.edescripcion,
          ubicacionActual,
          bodegaActual,
          nombreBodega,
          item.estatusRegistro,
          item.estatusLogico,
          item.estadoOperativo
        ];

        return campos.some(campo =>
          normalizarBusqueda_(campo).includes(f)
        );
      };

      // ---------------------------------------------------------
      // DETECCIÓN DE BODEGAS CON EXISTENCIA SEGÚN BÚSQUEDA
      // ---------------------------------------------------------
      const bodegasConExistenciaBuscada = useMemo(() => {
        const resultado = new Set();

        if (!filtro.trim()) return resultado;

        data.forEach(item => {
          const coincide = coincideBusqueda_(item, filtro);

          if (coincide && Number(item.esaldo) > 0) {
            resultado.add(obtenerNombreBodega(item));
          }
        });

        return resultado;
      }, [data, filtro]);

      // ---------------------------------------------------------
      // FILTROS EN FRONT
      // ---------------------------------------------------------
      const datosFiltrados = useMemo(() => {
        let filtrados = data;

        if (bodegaSeleccionada !== "Todos") {
          filtrados = filtrados.filter(item =>
            obtenerNombreBodega(item) === bodegaSeleccionada
          );
        }

        if (!filtro.trim()) return filtrados;

        return filtrados.filter(item =>
          coincideBusqueda_(item, filtro)
        );
      }, [data, filtro, bodegaSeleccionada]);

      const opcionesBusquedaExcedentes = useMemo(() => {
        const origen =
          bodegaSeleccionada === "Todos"
            ? data
            : data.filter(item => obtenerNombreBodega(item) === bodegaSeleccionada);

        const mapaCodigos = new Map();

        origen.forEach(item => {
          const codigo = String(item.ecodigo || "").trim().toUpperCase();
          if (!codigo) return;

          const descripcion = String(item.edescripcion || "")
            .trim()
            .toUpperCase();

          const idUnico = String(item.eidUnico || "").trim();
          const saldo = Number(item.esaldo || 0);

          if (!mapaCodigos.has(codigo)) {
            mapaCodigos.set(codigo, {
              codigo,
              descripcion: descripcion || "SIN DESCRIPCIÓN",
              idsDisponibles: new Set()
            });
          }

          const actual = mapaCodigos.get(codigo);

          if (descripcion && actual.descripcion === "SIN DESCRIPCIÓN") {
            actual.descripcion = descripcion;
          }

          if (idUnico && saldo > 0) {
            actual.idsDisponibles.add(idUnico);
          }

          mapaCodigos.set(codigo, actual);
        });

        return Array.from(mapaCodigos.values())
          .map(item => ({
            codigo: item.codigo,
            descripcion: item.descripcion,
            cajasDisponibles: item.idsDisponibles.size
          }))
          .sort((a, b) =>
            String(a.codigo).localeCompare(String(b.codigo), "es", {
              numeric: true,
              sensitivity: "base"
            })
          );
      }, [data, bodegaSeleccionada]);

      const codigosExportables = useMemo(() => {
        const codigosSet = new Set();

        data.forEach(item => {
          const codigo = String(item.ecodigo || "").trim().toUpperCase();
          const saldo = Number(item.esaldo || 0);

          if (codigo && saldo !== 0) {
            codigosSet.add(codigo);
          }
        });

        return Array.from(codigosSet).sort((a, b) =>
          String(a).localeCompare(String(b), "es", {
            numeric: true,
            sensitivity: "base"
          })
        );
      }, [data]);

      const codigosExportablesVisibles = useMemo(() => {
        const filtro = String(exportCodigoFiltro || "").trim().toUpperCase();

        const base = filtro
          ? codigosExportables.filter(codigo =>
              String(codigo || "").toUpperCase().includes(filtro)
            )
          : codigosExportables;

        return base.slice(0, 80);
      }, [codigosExportables, exportCodigoFiltro]);

      /** Genera un reporte XLSX para una bodega seleccionada. */
      const handleSeleccionExportBodega = (bodega) => {
        try {
          setExportMenuOpen(false);
          setExportCodigoFiltro("");

          if (!window.XLSXExportUtilidades) {
            throw new Error("No se encontró el módulo XLSXExportUtilidades.");
          }

          const resultado = window.XLSXExportUtilidades.exportarGestorExcedentesPorBodega({
            data,
            bodega
          });

          notify_(
            `Reporte generado correctamente (${resultado.registros} registros).`,
            "success",
            2600,
            {
              title: "Excel generado",
              sound: false
            }
          );

        } catch (error) {
          console.error("❌ Error exportando por bodega:", error);

          notify_(
            error && error.message
              ? error.message
              : "No se pudo generar el reporte por bodega.",
            "error",
            4200,
            {
              title: "Error de exportación",
              sound: true
            }
          );
        }
      };

      /** Genera un reporte XLSX para un código seleccionado. */
      const handleSeleccionExportCodigo = (codigo) => {
        try {
          setExportMenuOpen(false);
          setExportCodigoFiltro("");

          if (!window.XLSXExportUtilidades) {
            throw new Error("No se encontró el módulo XLSXExportUtilidades.");
          }

          const resultado = window.XLSXExportUtilidades.exportarGestorExcedentesPorCodigo({
            data,
            codigo
          });

          notify_(
            `Reporte generado correctamente (${resultado.registros} registros).`,
            "success",
            2600,
            {
              title: "Excel generado",
              sound: false
            }
          );

        } catch (error) {
          console.error("❌ Error exportando por código:", error);

          notify_(
            error && error.message
              ? error.message
              : "No se pudo generar el reporte por código.",
            "error",
            4200,
            {
              title: "Error de exportación",
              sound: true
            }
          );
        }
      };

      const porcentajePendientesUbicar = useMemo(() => {
        const vigentes = Number(resumen.idsUnicosVigentes || 0);
        const pendientes = Number(resumen.idsUnicosPendientes || 0);

        if (vigentes <= 0) return 0;

        return (pendientes / vigentes) * 100;
      }, [resumen]);

      // Segmentación fija
      const opcionBodegas = [
        "Todos",
        "Bodega 1",
        "Bodega 2",
        "Bodega 3",
        "Bodega Mostrador",
        "Casa Blanca 1",
        "Casa Blanca 2",
        "Pendiente de ubicación"
      ];

      const opcionesExportacionBodega = [
        "Bodega 1",
        "Bodega 2",
        "Bodega 3",
        "Bodega Mostrador",
        "Casa Blanca 1",
        "Casa Blanca 2",
        "Todas las bodegas"
      ];

      return (
        <div className="ge-view-shell">

          {/* PANEL SUPERIOR: KPIS + CONTROLES */}
            <div className="ge-top-panel px-6 md:px-8 pt-2 pb-2 grid grid-cols-1 lg:grid-cols-[1fr_360px] gap-2 shrink-0 fade-in-up">

              {/* KPIS IZQUIERDA */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <KPIBlock
                  title="IDs con ubicación"
                  value={formatearNumero_(resumen.idsUnicosConUbicacion)}
                  unit="IDs"
                  iconName="map-pinned"
                  indicatorColor="emerald"
                  minHeight="70px"
                  className="p-3"
                  trend={{
                    text: "Ubicados",
                    type: "positive",
                    sub: "Listos para auditoría"
                  }}
                />

                <KPIBlock
                  title="Pendientes por ubicar"
                  value={formatearNumero_(resumen.idsUnicosPendientes)}
                  unit="IDs"
                  iconName="clock-3"
                  indicatorColor="amber"
                  minHeight="70px"
                  className="p-3"
                  trend={{
                    text: "Requieren acomodo",
                    type: "neutral",
                    sub: "Sin ubicación física"
                  }}
                />

                <KPIBlock
                  title="% pendiente de ubicación"
                  value={formatearNumero_(porcentajePendientesUbicar, 2)}
                  unit="%"
                  iconName="percent"
                  indicatorColor="red"
                  minHeight="70px"
                  className="p-3"
                  trend={{
                    text: "Indicador crítico",
                    type: "negative",
                    sub: "Pendientes / vigentes"
                  }}
                />
              </div>

              {/* CONTROLES DERECHA */}
              <div className="bg-white border border-[#dadce0] rounded-[1.25rem] p-3 shadow-sm flex flex-col gap-2 min-h-[70px]">

                {/* Buscador */}
                <div className="relative">
                  <input
                    ref={searchInputRef}
                    type="text"
                    list="lista-busqueda-excedentes"
                    placeholder="Buscar código o descripcion..."
                    className="w-full h-11 rounded-xl border border-[#dadce0] bg-gray-50 pl-10 pr-10 text-[12px] font-bold uppercase tracking-[0.04em] text-[#1c1d1f] outline-none transition-all focus:bg-white focus:border-[#d93025] focus:ring-2 focus:ring-red-100"
                    value={filtro}
                    onChange={(e) => setFiltro(e.target.value.toUpperCase())}
                  />

                  <datalist id="lista-busqueda-excedentes">
                    {opcionesBusquedaExcedentes.map((item, index) => (
                      <option
                        key={`${index}-${item.codigo}`}
                        value={item.codigo}
                        label={`${item.descripcion || "SIN DESCRIPCIÓN"} | ${item.cajasDisponibles} caja(s) disponibles para surtido`}
                      >
                        {item.codigo} | {item.descripcion || "SIN DESCRIPCIÓN"} | {item.cajasDisponibles} caja(s) disponibles para surtido
                      </option>
                    ))}
                  </datalist>

                  <div className="absolute left-3 top-1/2 -translate-y-1/2 text-[#5f6368]">
                    <LocalIcon name="search" size={18} />
                  </div>

                  {filtro && (
                    <button
                      type="button"
                      className="absolute right-3 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-slate-900 flex items-center justify-center transition-all"
                      title="Limpiar búsqueda"
                      onClick={() => setFiltro("")}
                    >
                      <LocalIcon name="x" size={14} />
                    </button>
                  )}
                </div>

                {/* Acciones verticales */}
                <div className="flex flex-col gap-2">

                  {/* Botón Exportar Excel con menú */}
                  <div className="relative" ref={exportMenuRef}>
                    <button
                      type="button"
                      className={`h-10 w-full rounded-xl border transition-all flex items-center justify-center gap-2 text-[10px] font-black uppercase tracking-[0.10em] ${
                        exportMenuOpen
                          ? "border-emerald-400 bg-emerald-100 text-emerald-800 shadow-sm"
                          : "border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100"
                      }`}
                      onClick={(e) => {
                        e.stopPropagation();
                        setExportMenuOpen(prev => !prev);
                      }}
                    >
                      <LocalIcon name="file-spreadsheet" size={17} />
                      Exportar Excel
                      <LocalIcon
                        name={exportMenuOpen ? "chevron-up" : "chevron-down"}
                        size={14}
                      />
                    </button>

                    {exportMenuOpen && (
                      <div className="absolute right-0 top-[calc(100%+8px)] z-50 w-[360px] max-h-[360px] overflow-hidden rounded-2xl border border-[#dadce0] bg-white shadow-2xl fade-in-up">

                        <div className="px-4 py-3 border-b border-slate-100 bg-slate-50">
                          <p className="text-[11px] font-black uppercase tracking-[0.18em] text-slate-500">
                            Exportar reporte de excedentes
                          </p>
                          <p className="text-[11px] font-semibold text-slate-400 mt-1">
                            Selecciona un modo de exportación. La generación del Excel se configurará después.
                          </p>
                        </div>

                        <div className="max-h-[290px] overflow-y-auto">

                          {/* Exportar por bodega */}
                          <div className="p-3 border-b border-slate-100">
                            <div className="flex items-center gap-2 mb-2">
                              <div className="w-8 h-8 rounded-xl bg-blue-50 text-blue-700 border border-blue-100 flex items-center justify-center">
                                <LocalIcon name="warehouse" size={16} />
                              </div>

                              <div className="flex flex-col">
                                <span className="text-[11px] font-black uppercase tracking-[0.15em] text-slate-700">
                                  Por bodega
                                </span>
                                <span className="text-[10px] font-semibold text-slate-400">
                                  Exporta registros según ubicación operativa.
                                </span>
                              </div>
                            </div>

                            <div className="grid grid-cols-1 gap-1.5">
                              {opcionesExportacionBodega.map((bodega) => (
                                <button
                                  key={bodega}
                                  type="button"
                                  className="w-full px-3 py-2 rounded-xl text-left bg-white hover:bg-blue-50 border border-transparent hover:border-blue-100 transition-all flex items-center justify-between gap-2"
                                  onClick={() => handleSeleccionExportBodega(bodega)}
                                >
                                  <span className="text-[11px] font-black uppercase tracking-[0.08em] text-slate-700">
                                    {bodega}
                                  </span>

                                  <LocalIcon name="chevron-right" size={14} className="text-slate-400" />
                                </button>
                              ))}
                            </div>
                          </div>

                          {/* Exportar por código */}
                          <div className="p-3">
                            <div className="flex items-center gap-2 mb-2">
                              <div className="w-8 h-8 rounded-xl bg-red-50 text-red-700 border border-red-100 flex items-center justify-center">
                                <LocalIcon name="barcode" size={16} />
                              </div>

                              <div className="flex flex-col">
                                <span className="text-[11px] font-black uppercase tracking-[0.15em] text-slate-700">
                                  Por código
                                </span>
                                <span className="text-[10px] font-semibold text-slate-400">
                                  Busca un código con excedente.
                                </span>
                              </div>
                            </div>

                            {/* Buscador interno de código */}
                            <div className="relative mb-2">
                              <input
                                type="text"
                                placeholder="Filtrar código..."
                                className="w-full h-9 rounded-xl border border-slate-200 bg-slate-50 pl-9 pr-8 text-[11px] font-black uppercase tracking-[0.06em] text-slate-700 outline-none focus:bg-white focus:border-[#d93025] focus:ring-2 focus:ring-red-100"
                                value={exportCodigoFiltro}
                                onChange={(e) => setExportCodigoFiltro(e.target.value.toUpperCase())}
                                onClick={(e) => e.stopPropagation()}
                              />

                              <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                                <LocalIcon name="search" size={14} />
                              </div>

                              {exportCodigoFiltro && (
                                <button
                                  type="button"
                                  className="absolute right-2 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-white text-slate-400 hover:text-slate-900 border border-slate-200 flex items-center justify-center"
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    setExportCodigoFiltro("");
                                  }}
                                >
                                  <LocalIcon name="x" size={12} />
                                </button>
                              )}
                            </div>

                            {codigosExportables.length === 0 ? (
                              <div className="px-3 py-3 rounded-xl bg-slate-50 border border-slate-100 text-center">
                                <span className="text-[10px] font-black uppercase tracking-[0.12em] text-slate-400">
                                  Sin códigos disponibles
                                </span>
                              </div>
                            ) : codigosExportablesVisibles.length === 0 ? (
                              <div className="px-3 py-3 rounded-xl bg-slate-50 border border-slate-100 text-center">
                                <span className="text-[10px] font-black uppercase tracking-[0.12em] text-slate-400">
                                  Sin coincidencias
                                </span>
                              </div>
                            ) : (
                              <>
                                <div className="grid grid-cols-1 gap-1.5">
                                  {codigosExportablesVisibles.map((codigo) => (
                                    <button
                                      key={codigo}
                                      type="button"
                                      className="w-full px-3 py-2 rounded-xl text-left bg-white hover:bg-red-50 border border-transparent hover:border-red-100 transition-all flex items-center justify-between gap-2"
                                      onClick={() => handleSeleccionExportCodigo(codigo)}
                                    >
                                      <span className="text-[11px] font-black uppercase tracking-[0.08em] text-slate-700 font-mono">
                                        {codigo}
                                      </span>

                                      <LocalIcon name="chevron-right" size={14} className="text-slate-400" />
                                    </button>
                                  ))}
                                </div>

                                {codigosExportables.length > codigosExportablesVisibles.length && (
                                  <div className="mt-2 px-3 py-2 rounded-xl bg-slate-50 border border-slate-100 text-center">
                                    <span className="text-[10px] font-bold uppercase tracking-[0.10em] text-slate-400">
                                      Mostrando {codigosExportablesVisibles.length} de {codigosExportables.length}. Usa el filtro para encontrar más.
                                    </span>
                                  </div>
                                )}
                              </>
                            )}
                          </div>

                        </div>
                      </div>
                    )}
                  </div>

                  {/* Botón Actualizar */}
                  <button
                    type="button"
                    className="h-10 rounded-xl border border-slate-300 bg-[#1c1d1f] text-white hover:bg-black transition-all flex items-center justify-center gap-2 text-[10px] font-black uppercase tracking-[0.10em] disabled:opacity-50 disabled:pointer-events-none"
                    onClick={() => refrescarDatos("manual")}
                    disabled={loading}
                  >
                    <LocalIcon
                      name="refresh-cw"
                      size={17}
                      className={loading ? "animate-spin" : ""}
                    />
                    Actualizar información
                  </button>
                </div>
                </div>
              </div>

          {/* SEGMENTACIÓN POR BODEGA */}
          <div className="px-6 md:px-8 pb-3 flex flex-wrap gap-2 shrink-0">
            {opcionBodegas.map((bodega) => {
              const esActivo = bodegaSeleccionada === bodega;
              const tieneStockBuscado = bodegasConExistenciaBuscada.has(bodega);

              let clasesBordeYFondo = "";

              if (esActivo) {
                clasesBordeYFondo = "bg-[#1c1d1f] text-white border-[#1c1d1f] shadow-md";
              } else if (tieneStockBuscado) {
                clasesBordeYFondo = "bodega-pulso-rojo shadow-md";
              } else {
                clasesBordeYFondo = "bg-white text-[#5f6368] border-[#dadce0] hover:bg-gray-50 hover:text-[#1c1d1f]";
              }

              return (
                <button
                  key={bodega}
                  onClick={() => setBodegaSeleccionada(bodega)}
                  className={`px-4 py-2 rounded-xl text-[12px] font-black uppercase tracking-[0.06em] border transition-all duration-300 active:scale-95 ${clasesBordeYFondo}`}
                >
                  {bodega}
                </button>
              );
            })}
          </div>

          {/* TABLA */}
          <div className="ge-table-zone px-6 md:px-8 pb-4">
            <div className="ge-table-card">

              <div className="ge-table-scroll gestor-tabla-scroll">
                <table className="ge-compact-table w-full text-left min-w-[1100px]">

                <thead className="ge-table-head">
                  <tr>
                    <th style={{ fontSize: '20px' }} className="ge-table-th px-6 py-2 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[18%]">
                      SKU / ID único
                    </th>

                    <th style={{ fontSize: '20px' }} className="ge-table-th px-6 py-2 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[34%]">
                      Descripción
                    </th>

                    <th style={{ fontSize: '20px' }} className="ge-table-th px-6 py-2 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[14%]">
                      Balance
                    </th>

                    <th style={{ fontSize: '20px' }} className="ge-table-th px-6 py-2 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[18%]">
                      Ubicación
                    </th>

                    <th style={{ fontSize: '20px' }} className="ge-table-th px-6 py-2 font-black uppercase tracking-tight text-[#1c1d1f] text-center w-[16%]">
                      Estado
                    </th>
                  </tr>
                </thead>

                <tbody className="divide-y divide-[#f1f3f4] bg-white">
                  {datosFiltrados.map((item, idx) => {
                    const badge = obtenerBadgeEstatus(item);

                    return (
                      <tr key={item.eidUnico || idx} className="group hover:bg-[#fcfcfc] transition-colors">

                        {/* SKU / ID */}
                        <td className="px-6 py-4 text-left">
                          <div className="flex flex-col items-start gap-1.5">
                            <span className="text-[18px] font-black text-[#1c1d1f] leading-none ml-0.5">
                              {item.ecodigo}
                            </span>

                            <span className="inline-block px-3 py-1 rounded-md bg-[#d93025]/15 border border-[#d93025]/30 text-[#d93025] font-mono text-[15px] font-bold tracking-wider shadow-sm backdrop-blur-sm break-all">
                              {item.eidUnico}
                            </span>
                          </div>
                        </td>

                        {/* DESCRIPCIÓN */}
                        <td className="px-6 py-4 text-center">
                          <span className="text-[20px] font-medium text-[#3c4043] leading-tight block uppercase">
                            {item.edescripcion}
                          </span>
                        </td>

                        {/* BALANCE */}
                        <td className="px-8 py-6 text-center">
                          <div className="inline-flex flex-col items-end">
                            <span className="text-[20px] font-black text-[#1c1d1f]">
                              {item.esaldo || 0}
                            </span>
                            <span className="text-[15px] font-bold uppercase text-[#9aa0a6] tracking-tighter">
                              Unidades Disp.
                            </span>
                          </div>
                        </td>

                        {/* UBICACIÓN */}
                        <td className="px-6 py-4 text-center">
                          <div className="flex flex-col items-center">
                            <span className="text-[20px] text-[#5f6368] font-medium bg-gray-100 px-3 py-0.5 rounded-lg mb-1">
                              {item.eserie || "Sin ubicación"}
                            </span>

                            <span className="text-[18px] font-bold text-[#1c1d1f]">
                              {obtenerNombreBodega(item)}
                            </span>
                          </div>
                        </td>

                        {/* ESTADO */}
                        <td className="px-6 py-4 text-center">
                          <div className="flex flex-col items-center gap-2">
                            <span className={`px-3 py-1.5 rounded-lg text-[12px] font-black uppercase tracking-wide ${badge.clase}`}>
                              {badge.texto}
                            </span>

                            <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wide">
                              {item.estatusRegistro || "Sin dato"}
                            </span>
                          </div>
                        </td>

                      </tr>
                    );
                  })}
                </tbody>
              </table>
              </div>

              {!loading && datosFiltrados.length === 0 && (
                <div className="p-20 flex flex-col items-center justify-center text-center">
                  <div className="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 mb-4">
                    <LocalIcon name="search-x" size={28} />
                  </div>

                  <span className="text-[13px] font-black uppercase tracking-widest text-[#5f6368]">
                    Sin resultados para los filtros actuales
                  </span>

                  <span className="text-[11px] mt-2 text-slate-400 font-semibold">
                    Ajusta la búsqueda o cambia la segmentación de bodega.
                  </span>
                </div>
              )}

              {loading && (
                <div className="p-20 flex flex-col items-center text-[#d93025]">
                  <LocalIcon name="loader-2" size={40} className="animate-spin mb-2" />
                  <span className="text-[10px] font-black uppercase tracking-widest text-[#5f6368]">
                    Sincronizando...
                  </span>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // =========================================================
    // CONTRATO CON EL SHELL
    // =========================================================
    /**
     * Monta la vista en el contenedor administrado por el shell.
     * @return {void}
     */
    window.cargar_GestorExcedentes = () => {
      const rootEl = document.getElementById("vista-excedentes-root");

      if (!rootEl) {
        console.warn("⚠️ [GestorExcedentes] No se encontró #vista-excedentes-root");
        notify_("No se encontró el contenedor principal del gestor de excedentes.", "error", 4200, {
          title: "Error de interfaz",
          sound: true
        });
        return;
      }

      if (window.__GESTOR_EXCEDENTES_ROOT__) {
        try {
          window.__GESTOR_EXCEDENTES_ROOT__.unmount();
        } catch (e) {
          console.warn("⚠️ [GestorExcedentes] No se pudo desmontar root previo:", e);
          notifyOnceShell_(
            "gestor-root-previo",
            "Se liberó una instancia previa del gestor.",
            "warning",
            1600,
            {
              title: "Reinicialización",
              sound: false
            },
            10000
          );
        }

        window.__GESTOR_EXCEDENTES_ROOT__ = null;
      }

      try {
        window.__GESTOR_EXCEDENTES_ROOT__ = ReactDOM.createRoot(rootEl);
        window.__GESTOR_EXCEDENTES_ROOT__.render(<VistaGestorExcedentes />);
      } catch (e) {
        console.error("❌ [GestorExcedentes] Error montando React root:", e);
        notify_(
          "Ocurrió un error al montar la vista del gestor de excedentes.",
          "error",
          4200,
          {
            title: "Error de montaje",
            sound: true
          }
        );
      }
    };

    window.initVista = window.cargar_GestorExcedentes;
    console.log("🧩 [GestorExcedentes] initVista definida:", typeof window.initVista);

  })();
</script>
