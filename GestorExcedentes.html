<div id="vista-excedentes-root" class="h-full w-full bg-[#f8f9fa] overflow-hidden"></div>

<script type="text/babel">
  (function() {
    const { useState, useEffect, useMemo, useCallback } = React;

    // --- COMPONENTE: TARJETA DE RESUMEN PREMIUM ---
    const SummaryCard = ({ label, value, iconName, colorClass }) => (
      <div className={`bg-white p-6 rounded-[2rem] border border-[#dadce0] shadow-soft flex items-center gap-5 transition-transform duration-300 hover:-translate-y-1`}>
        <div className={`w-14 h-14 rounded-2xl flex items-center justify-center ${colorClass}`}>
          <LocalIcon name={iconName} size={28} />
        </div>
        <div>
          <p className="text-[11px] font-black uppercase tracking-widest text-[#5f6368] mb-1">{label}</p>
          <h3 className="text-3xl font-black text-[#1c1d1f] leading-none">{value}</h3>
        </div>
      </div>
    );

    // Componente de icono local para asegurar compatibilidad con Lucide
    const LocalIcon = ({ name, size = 20, className = "" }) => {
      useEffect(() => {
        if (window.lucide) lucide.createIcons();
      }, [name]);
      return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
    };

    const VistaGestorExcedentes = () => {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [filtro, setFiltro] = useState("");

      // 1. CARGA INICIAL DE DATOS
      const refrescarDatos = useCallback(() => {
        setLoading(true);
        google.script.run
          .withSuccessHandler((res) => {
            setData(res || []);
            setLoading(false);
          })
          .withFailureHandler(() => setLoading(false))
          .obtenerTodaLaBaseExcedentes();
      }, []);

      useEffect(() => {
        refrescarDatos();
      }, [refrescarDatos]);

      // 2. LÓGICA DE FILTRADO Y CÁLCULOS (useMemo para rendimiento)
      const { itemsFiltrados, totales } = useMemo(() => {
        const filtrados = data.filter(item => {
          const busqueda = filtro.toLowerCase();
          return (
            (item.codigo || "").toLowerCase().includes(busqueda) ||
            (item.descripcion || "").toLowerCase().includes(busqueda) ||
            (item.serie || "").toLowerCase().includes(busqueda)
          );
        });

        const sumaTotal = filtrados.reduce((acc, curr) => acc + (Number(curr.cantidad) || 0), 0);
        const unicos = new Set(filtrados.map(i => i.codigo)).size;

        return { itemsFiltrados: filtrados, totales: { sumaTotal, unicos } };
      }, [data, filtro]);

      return (
        <div className="p-8 h-screen flex flex-col gap-8 fade-in">
          
          {/* CABECERA Y BUSCADOR */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-6">
            <div>
              <h1 className="text-4xl font-black text-[#1c1d1f] tracking-tight">Gestor de <span className="text-[#d93025]">Excedentes</span></h1>
              <p className="text-[#5f6368] font-medium mt-1">Control de inventario virtual y físico en tiempo real</p>
            </div>
            
            <div className="flex items-center gap-4">
              <div className="relative group">
                <div className="absolute inset-y-0 left-4 flex items-center pointer-events-none text-[#5f6368] group-focus-within:text-[#d93025] transition-colors">
                  <LocalIcon name="search" size={20} />
                </div>
                <input
                  type="text"
                  placeholder="Buscar por código, descripción o serie..."
                  className="pl-12 pr-6 py-4 w-80 bg-white border border-[#dadce0] rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-[#d93025]/20 focus:border-[#d93025] transition-all font-medium"
                  value={filtro}
                  onChange={(e) => setFiltro(e.target.value)}
                />
              </div>
              <button 
                onClick={refrescarDatos}
                className={`p-4 bg-white border border-[#dadce0] rounded-2xl hover:bg-gray-50 transition-all ${loading ? 'animate-spin text-[#d93025]' : 'text-[#5f6368]'}`}
              >
                <LocalIcon name="refresh-cw" />
              </button>
            </div>
          </div>

          {/* TARJETAS DE RESUMEN */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <SummaryCard 
              label="SKUs Registrados" 
              value={totales.unicos} 
              iconName="package" 
              colorClass="bg-red-50 text-[#d93025]" 
            />
            <SummaryCard 
              label="Cantidad Total" 
              value={totales.sumaTotal} 
              iconName="hash" 
              colorClass="bg-emerald-50 text-emerald-600" 
            />
            <SummaryCard 
              label="Estado de Red" 
              value={loading ? "Sincronizando" : "En línea"} 
              iconName="database" 
              colorClass="bg-blue-50 text-blue-600" 
            />
          </div>

          {/* CONTENEDOR DE TABLA */}
          <div className="flex-1 bg-white rounded-[2rem] border border-[#dadce0] shadow-soft overflow-hidden flex flex-col">
            <div className="overflow-y-auto custom-scroll-container">
              <table className="w-full text-left border-collapse">
                <thead className="sticky top-0 bg-white z-10">
                  <tr>
                    <th className="px-8 py-5 text-[10px] font-black uppercase tracking-[0.2em] text-[#5f6368] border-bottom border-[#dadce0]">Código / ID</th>
                    <th className="px-8 py-5 text-[10px] font-black uppercase tracking-[0.2em] text-[#5f6368] border-bottom border-[#dadce0]">Descripción</th>
                    <th className="px-8 py-5 text-[10px] font-black uppercase tracking-[0.2em] text-[#5f6368] border-bottom border-[#dadce0]">Serie / Ubicación</th>
                    <th className="px-8 py-5 text-[10px] font-black uppercase tracking-[0.2em] text-[#5f6368] border-bottom border-[#dadce0] text-right">Cantidad</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[#f1f3f4]">
                  {!loading && itemsFiltrados.map((item, idx) => (
                    <tr key={idx} className="hover:bg-[#f8f9fa] transition-colors group">
                      <td className="px-8 py-4">
                        <span className="font-mono text-sm font-bold text-[#d93025] bg-red-50 px-3 py-1 rounded-lg">
                          {item.codigo}
                        </span>
                      </td>
                      <td className="px-8 py-4 text-sm font-medium text-[#1c1d1f] max-w-xs truncate">
                        {item.descripcion}
                      </td>
                      <td className="px-8 py-4">
                        <span className={`text-[10px] font-black uppercase px-3 py-1 rounded-full border ${
                          (item.serie || '').toUpperCase().includes('DISPONIBLE') 
                            ? 'bg-amber-50 text-amber-600 border-amber-200' 
                            : 'bg-emerald-50 text-emerald-600 border-emerald-200'
                        }`}>
                          {item.serie || 'SIN UBICACIÓN'}
                        </span>
                      </td>
                      <td className="px-8 py-4 text-right">
                        <span className="text-lg font-black text-[#1c1d1f]">{item.cantidad}</span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>

              {/* ESTADOS VACÍOS O DE CARGA */}
              {itemsFiltrados.length === 0 && !loading && (
                <div className="p-24 flex flex-col items-center justify-center text-[#5f6368] opacity-50">
                  <LocalIcon name="search-x" size={48} className="mb-4" />
                  <p className="font-bold text-lg italic">No se encontraron registros para tu búsqueda</p>
                </div>
              )}
              
              {loading && (
                <div className="p-24 flex flex-col items-center justify-center text-[#d93025]">
                  <LocalIcon name="loader-2" size={40} className="mb-4 animate-spin" />
                  <p className="font-black uppercase tracking-widest text-xs text-[#5f6368]">Conectando con Google Sheets...</p>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // Renderizado final
    const rootDiv = document.getElementById('vista-excedentes-root');
    if (rootDiv) {
      const root = ReactDOM.createRoot(rootDiv);
      root.render(<VistaGestorExcedentes />);
    }
  })();
</script>
