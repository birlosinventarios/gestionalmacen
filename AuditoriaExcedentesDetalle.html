<script type="text/babel">
  window.cargar_AuditoriaExcedentesDetalle = () => {
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // =========================================================
    // HELPERS DE NOTIFICACIÓN
    // =========================================================
    const notify_ = (mensaje, tipo = "info", timer = 2500, options = {}) => {
      const fn = window.notificar || window.lanzarNotificacion;
      if (typeof fn === "function") {
        fn(mensaje, tipo, timer, options);
      }
    };

    const createNotifyOnce_ = (ref) => (key, mensaje, tipo = "info", timer = 2500, options = {}, cooldown = 8000) => {
      const now = Date.now();
      const last = ref.current[key] || 0;
      if (now - last < cooldown) return;
      ref.current[key] = now;
      notify_(mensaje, tipo, timer, options);
    };

    const shellNotifyStateRef = { current: {} };
    const notifyOnceShell_ = createNotifyOnce_(shellNotifyStateRef);

    // =========================================================
    // UTILIDADES DE FECHA / HORA
    // =========================================================
    function _esDateValida_(d) {
      return d instanceof Date && !isNaN(d.getTime());
    }

    function _parseFechaFlexible_(value) {
      if (!value) return null;

      if (value instanceof Date) {
        return _esDateValida_(value) ? value : null;
      }

      const str = String(value).trim();
      if (!str) return null;

      if (/^\d{2}\/\d{2}\/\d{4}$/.test(str)) {
        const parts = str.split("/");
        const day = Number(parts[0]);
        const month = Number(parts[1]);
        const year = Number(parts[2]);
        const d = new Date(year, month - 1, day, 0, 0, 0, 0);
        return _esDateValida_(d) ? d : null;
      }

      const parsed = new Date(str);
      return _esDateValida_(parsed) ? parsed : null;
    }

    function _parseHoraFlexible_(value) {
      if (!value) return null;

      if (value instanceof Date) {
        return _esDateValida_(value) ? value : null;
      }

      const str = String(value).trim();
      if (!str) return null;

      if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(str)) {
        const parts = str.split(":");
        const hh = Number(parts[0] || 0);
        const mm = Number(parts[1] || 0);
        const ss = Number(parts[2] || 0);
        const d = new Date(2000, 0, 1, hh, mm, ss, 0);
        return _esDateValida_(d) ? d : null;
      }

      const parsed = new Date(str);
      return _esDateValida_(parsed) ? parsed : null;
    }

    function formatearFecha_(value) {
      const d = _parseFechaFlexible_(value);
      if (!d) return "Sin fecha";

      return d.toLocaleDateString("es-MX", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    function formatearHora_(value) {
      const d = _parseHoraFlexible_(value);
      if (!d) return "--";

      return d.toLocaleTimeString("es-MX", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
    }

    function construirResumenFechaHora_(item) {
      return `${formatearFecha_(item.fecha)} • ${formatearHora_(item.horainicio)} - ${formatearHora_(item.horafin)}`;
    }

    // =========================================================
    // HELPERS GENERALES
    // =========================================================
    function toStr_(value) {
      return String(value == null ? "" : value).trim();
    }

    function toUpper_(value) {
      return toStr_(value).toUpperCase();
    }

    function toNum_(value) {
      if (value === "" || value == null) return 0;
      const n = Number(value);
      return isNaN(n) ? 0 : n;
    }

    function getConfiabilidadVisual_(valor) {
      const n = Number(valor || 0);

      if (n < 90) {
        return {
          label: "Crítica",
          className: "aed-chip aed-chip-red",
          tone: "red"
        };
      }

      if (n >= 97) {
        return {
          label: "Controlada",
          className: "aed-chip aed-chip-emerald",
          tone: "emerald"
        };
      }

      return {
        label: "Atención",
        className: "aed-chip aed-chip-amber",
        tone: "amber"
      };
    }

    function getEstadoFilaVisual_(row) {
      const estado = toUpper_(row.estado || "");

      if (estado === "CORRECTO" || row.escorrecto === true) {
        return {
          className: "aed-chip aed-state-correcto",
          text: "Correcto"
        };
      }

      if (estado === "FALTANTE" || row.esfaltante === true) {
        return {
          className: "aed-chip aed-state-faltante",
          text: "Faltante"
        };
      }

      if (estado === "SOBRANTE" || row.essobrante === true) {
        return {
          className: "aed-chip aed-state-sobrante",
          text: "Sobrante"
        };
      }

      return {
        className: "aed-chip aed-state-pendiente",
        text: "Pendiente"
      };
    }

    function normalizarDetalleUbicacionResponse_(resp, fallbackUbicacion = "") {
      if (!resp) {
        return {
          ubicacion: fallbackUbicacion,
          detalle: [],
          resumen: {
            esperados: 0,
            escaneados: 0,
            correctos: 0,
            faltantes: 0,
            sobrantes: 0
          }
        };
      }

      const rawDetalle = Array.isArray(resp)
        ? resp
        : Array.isArray(resp.detalle)
        ? resp.detalle
        : Array.isArray(resp.data)
        ? resp.data
        : Array.isArray(resp.rows)
        ? resp.rows
        : [];

      // Para el popup no mostramos marcadores de ubicación.
      const detalle = rawDetalle.filter((x) => x && x.idunico);

      const resumenBackend = resp.resumen || {};

      const correctos = resumenBackend.correctos != null
        ? toNum_(resumenBackend.correctos)
        : detalle.filter(x => toUpper_(x.estado) === "CORRECTO" || x.escorrecto === true).length;

      const faltantes = resumenBackend.faltantes != null
        ? toNum_(resumenBackend.faltantes)
        : detalle.filter(x => toUpper_(x.estado) === "FALTANTE" || x.esfaltante === true).length;

      const sobrantes = resumenBackend.sobrantes != null
        ? toNum_(resumenBackend.sobrantes)
        : detalle.filter(x => toUpper_(x.estado) === "SOBRANTE" || x.essobrante === true).length;

      const escaneados = resumenBackend.escaneados != null
        ? toNum_(resumenBackend.escaneados)
        : detalle.filter(x =>
            (x.idunico && x.esfaltante !== true) ||
            toUpper_(x.estado) === "CORRECTO" ||
            toUpper_(x.estado) === "SOBRANTE"
          ).length;

      const esperados = resumenBackend.esperados != null
        ? toNum_(resumenBackend.esperados)
        : correctos + faltantes;

      return {

      const mergeFullRefreshConEstadoVivo_ = useCallback((base, fresh) => {
        const prev = base || {};
        const next = fresh || {};

        const prevUbicaciones = Array.isArray(prev.ubicacionesEnVivo)
          ? prev.ubicacionesEnVivo
          : [];

        const freshUbicaciones = Array.isArray(next.ubicacionesEnVivo)
          ? next.ubicacionesEnVivo
          : [];

        const map = {};

        freshUbicaciones.forEach((u) => {
          const key = toUpper_(u.key || u.ubicacion || "");
          if (!key) return;

          map[key] = {
            ...u,
            key,
            ubicacion: toUpper_(u.ubicacion || key),
            __fuenteMerge: "SHEETS"
          };
        });

        prevUbicaciones.forEach((u) => {
          const key = toUpper_(u.key || u.ubicacion || "");
          if (!key) return;

          const freshItem = map[key] || null;

          const prevCorrectos = Number(u.correctos || 0);
          const prevEscaneados = Number(u.escaneados || 0);
          const prevFaltantes = Number(u.faltantes || 0);
          const prevSobrantes = Number(u.sobrantes || 0);

          const freshCorrectos = Number(freshItem?.correctos || 0);
          const freshEscaneados = Number(freshItem?.escaneados || 0);
          const freshFaltantes = Number(freshItem?.faltantes || 0);
          const freshSobrantes = Number(freshItem?.sobrantes || 0);

          const prevTieneMasMovimiento =
            prevCorrectos > freshCorrectos ||
            prevEscaneados > freshEscaneados ||
            prevFaltantes > freshFaltantes ||
            prevSobrantes > freshSobrantes;

          const prevEsUbicacionViva =
            u.abierta === true || u.cerrada === true;

          const freshYaCerro =
            freshItem && freshItem.cerrada === true;

          const prevYaCerro =
            u.cerrada === true;

          /*
            Regla anti-parpadeo:
            1. Si Sheets ya trae la ubicación cerrada, Sheets manda.
            2. Si LiveCache tiene más movimiento que Sheets, conservamos Live.
            3. Si LiveCache trae una ubicación que Sheets todavía no trae, la conservamos.
            4. Si LiveCache ya la cerró pero Sheets todavía no la refleja, la conservamos.
          */
          if (!freshYaCerro && prevEsUbicacionViva && (!freshItem || prevTieneMasMovimiento || prevYaCerro)) {
            map[key] = {
              ...(freshItem || {}),
              ...u,
              key,
              ubicacion: toUpper_(u.ubicacion || key),
              __fuenteMerge: "LIVE_PRESERVADO"
            };
          }
        });

        const ubicacionesEnVivo = Object.values(map).sort((a, b) => {
          const seq = Number(a.secuenciaubicacion || 0) - Number(b.secuenciaubicacion || 0);
          if (seq !== 0) return seq;

          return String(a.ubicacion || "").localeCompare(String(b.ubicacion || ""), "es", {
            numeric: true,
            sensitivity: "base"
          });
        });

        return {
          ...prev,
          ...next,

          auditoria: {
            ...(prev.auditoria || {}),
            ...(next.auditoria || {})
          },

          resumen: {
            ...(prev.resumen || {}),
            ...(next.resumen || {})
          },

          resumenOperativo: next.resumenOperativo || prev.resumenOperativo || {},

          ubicacionesEnVivo,

          generadoEn: next.generadoEn || prev.generadoEn || {},

          source: next.source || prev.source || ""
        };
      }, []);

    
useEffect(() => {

            if (!mountedRef.current) return;

            const safe = resp || {};

            setAuditData((prev) => {
              return mergeFullRefreshConEstadoVivo_(prev, safe);
            });

            if (!silent) {
              setLoading(false);
            }

            if (!firstLoadDoneRef.current) {
              firstLoadDoneRef.current = true;
              notify_("Detalle de auditoría cargado.", "success", 1500, {
                title: "Vista lista",

        const id = toStr_(idauditoria);

        pulseInFlightRef.current = true;

        google.script.run

          .withSuccessHandler((resp) => {
            pulseInFlightRef.current = false;

            if (!mountedRef.current) return;

            const safe = resp || {};

            setAuditData((prev) => {
              const base = prev || {};

              const baseUbicaciones = Array.isArray(base.ubicacionesEnVivo)
                ? base.ubicacionesEnVivo
                : [];

              const liveUbicaciones = Array.isArray(safe.ubicacionesEnVivo)
                ? safe.ubicacionesEnVivo
                : null;

              let nextUbicaciones = baseUbicaciones;

              /**
              * El pulso vivo NO debe borrar ubicaciones cerradas.
              * Solo sobreescribe/actualiza ubicaciones que vienen en LiveCache.
              */
              if (liveUbicaciones && liveUbicaciones.length > 0) {
                const map = {};

                baseUbicaciones.forEach((u) => {
                  const key = toUpper_(u.key || u.ubicacion || "");
                  if (!key) return;
                  map[key] = u;
                });

                liveUbicaciones.forEach((u) => {

                  map[key] = {
                    ...(map[key] || {}),
                    ...u,

                    ubicacion: toUpper_(u.ubicacion || key)
                  };
                });

                nextUbicaciones = Object.values(map).sort((a, b) => {

                  if (seq !== 0) return seq;

                  return String(a.ubicacion || "").localeCompare(String(b.ubicacion || ""), "es", {
                    numeric: true,
                    sensitivity: "base"
                  });
                });
              }

              return {
                ...base,

                /**

                auditoria: safe.auditoria

                  : base.auditoria || {},

                resumen: safe.resumen

                  : base.resumen || {},

                resumenOperativo: safe.resumenOperativo || base.resumenOperativo || {},

                ubicacionesEnVivo: nextUbicaciones,

                generadoEn: safe.generadoEn || base.generadoEn || {},

                source: safe.source || base.source || ""
              };
            });
          })

          .withFailureHandler((err) => {
            pulseInFlightRef.current = false;

            if (!mountedRef.current) return;

            console.warn("⚠️ [AuditoriaExcedentesDetalle] Pulso en vivo falló:", err);
          })

          .AuditoriaExcedentesController_obtenerPulsoAuditoriaEnVivo(id);

                    <th>Inicio / Fin</th>
                    <th>Estado</th>
                    <th>Detalle</th>
                  </tr>
                </thead>

                <tbody>
                  
                {ubicacionesAuditadasResumen.map((u) => {
                  const avance = Math.min(100, Number(u.avancePct || 0));

                  const progressClass = u.estadoRitmo === "DETENIDO" || u.estadoRitmo === "CRITICO"
                    ? "danger"
                    : u.estadoRitmo === "LENTO"
                    ? "warning"
                    : u.tieneDiferencia
                    ? "danger"
                    : avance < 100
                    ? "warning"
                    : "";

                  return (

                      <tr key={u.key} className="aed-row aed-location-row">
                        <td>
                          <div className="aed-location-title">
                            {u.ubicacion}
                          </div>

                          <div className="aed-location-sub">
                            {u.bodega || "SIN BODEGA"} · Secuencia {Number(u.secuenciaubicacion || 0)}
                          </div>
                        </td>

                        <td>
                          <div className="flex flex-col gap-2">
                            <div className="flex items-center gap-2">
                              <div className="aed-progress-track">
                                <div
                                  className={`aed-progress-bar ${progressClass}`}
                                  style={{ width: `${avance}%` }}
                                ></div>
                              </div>

                              <span className="text-[12px] font-black text-[var(--text-main)]">
                                {avance}%
                              </span>
                            </div>

                            <span className="text-[10px] font-bold uppercase tracking-[0.10em] text-[var(--text-secondary)]">
                              {Number(u.escaneados || 0)} de {Number(u.esperados || 0)}
                            </span>
                          </div>
                        </td>

                        <td>
                          <span className="text-[17px] font-black text-[var(--text-main)]">
                            {Number(u.esperados || 0)}
                          </span>
                        </td>

                        <td>
                          <span className="text-[17px] font-black text-[var(--text-main)]">
                            {Number(u.escaneados || 0)}
                          </span>
                        </td>

                        <td>
                          <span className="text-[17px] font-black text-emerald-700">
                            {Number(u.correctos || 0)}
                          </span>
                        </td>

                        <td>
                          <span className="text-[17px] font-black text-amber-700">
                            {Number(u.faltantes || 0)}
                          </span>
                        </td>

                        <td>
                          <span className="text-[17px] font-black text-[var(--primary)]">
                            {Number(u.sobrantes || 0)}
                          </span>
                        </td>

                        <td>
                          <span className="text-[17px] font-black text-[var(--primary)]">
                            {Number(u.pendientes || 0)}
                          </span>
                        </td>

                        <td>
                          <span className="text-[12px] font-black text-[var(--text-main)]">
                            {Number(u.minutosTranscurridos || 0).toFixed(1)} min
                          </span>
                        </td>

                        <td>
                          <span className="text-[12px] font-black text-[var(--text-main)]">
                            {Number(u.escaneosPorMinuto || 0).toFixed(2)} ids/min
                          </span>
                        </td>

                        <td>
                          <span className="text-[12px] font-black text-[var(--text-main)]">
                            {u.cerrada ? "—" : `${Number(u.minutosEstimadosRestantes || 0).toFixed(1)} min`}
                          </span>
                        </td>

                        <td>
                          <div className="flex flex-col gap-1">
                            <span className="text-[12px] font-black text-[var(--text-main)]">
                              Inicio: {formatearHora_(u.horainicioubicacion)}
                            </span>
                            <span className="text-[12px] font-black text-[var(--text-main)]">
                              Fin: {formatearHora_(u.horafinubicacion)}
                            </span>
                          </div>
                        </td>

                        <td>
                          <span
                            className={
                              u.estadoRitmo === "DETENIDO"
                                ? "aed-chip aed-chip-red"
                                : u.estadoRitmo === "CRITICO"
                                ? "aed-chip aed-chip-red"
                                : u.estadoRitmo === "LENTO"
                                ? "aed-chip aed-chip-amber"
                                : u.cerrada && u.tieneDiferencia
                                ? "aed-chip aed-chip-red"
                                : "aed-chip aed-chip-emerald"
                            }
                          >
                            {u.estadoRitmo === "DETENIDO"
                              ? "Detenido"
                              : u.estadoRitmo === "CRITICO"
                              ? "Crítico"
                              : u.estadoRitmo === "LENTO"
                              ? "Lento"
                              : u.cerrada
                              ? u.tieneDiferencia ? "Cerrada con diferencia" : "Cerrada correcta"
                              : "A tiempo"}
                          </span>
                        </td>

                        <td>
                          <button
                            type="button"
                            className="aed-btn-dark !min-h-[40px] !px-4"
                            onClick={() => abrirPopupDetalleUbicacion_(u.ubicacion)}
                          >
                            Ver detalles
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>

              {!loading && ubicacionesAuditadasResumen.length === 0 && (
                <div className="aed-empty-state">
                  <div className="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                    <LocalIcon name="map-pin-off" size={28} />
                  </div>

                  <span className="text-[13px] font-black uppercase tracking-widest text-[var(--text-secondary)]">
                    Sin ubicaciones iniciadas
                  </span>

                  <span className="text-[11px] text-slate-400 font-semibold">
                    Cuando abras una ubicación en captura, aparecerá aquí.
                  </span>
                </div>
              )}

              {loading && (
                <div className="p-24 flex flex-col items-center justify-center gap-4">
                  <div className="w-10 h-10 border-4 border-slate-100 border-t-[var(--primary)] rounded-full animate-spin"></div>
                  <span className="text-[10px] font-black tracking-widest text-slate-400 uppercase">
                    Cargando detalle de auditoría...
                  </span>
                </div>
              )}
            </div>
          </div>

          {/* POPUP DETALLE UBICACIÓN */}
            {modalDetalleOpen && (
              <div
                className="aed-modal-backdrop"
                onMouseDown={cerrarPopupDetalleUbicacion_}
              >
                <div
                  className="aed-modal"
                  onMouseDown={(e) => e.stopPropagation()}
                >
                  <div className="aed-modal-header">
                    <div className="min-w-0">
                      <p className="text-[10px] font-black uppercase tracking-[0.16em] text-[var(--text-secondary)] mb-1">
                        Detalle de ubicación
                      </p>

                      <h3 className="m-0 p-0 bg-transparent border-none text-[var(--text-main)] text-[24px] font-black tracking-tight font-mono-premium">
                        {modalDetalleUbicacion.ubicacion || modalUbicacion || "SIN UBICACIÓN"}
                      </h3>

                      <div className="mt-2 flex flex-wrap items-center gap-2">
                        <span className="aed-chip aed-chip-slate">
                          {Number(modalDetalleUbicacion.resumen?.esperados || 0)} esperados
                        </span>

                        <span className="aed-chip aed-chip-slate">
                          {Number(modalDetalleUbicacion.resumen?.escaneados || 0)} escaneados
                        </span>

                        <span className="aed-chip aed-chip-emerald">
                          {Number(modalDetalleUbicacion.resumen?.correctos || 0)} correctos
                        </span>

                        <span className="aed-chip aed-chip-amber">
                          {Number(modalDetalleUbicacion.resumen?.faltantes || 0)} faltantes
                        </span>

                        <span className="aed-chip aed-chip-red">
                          {Number(modalDetalleUbicacion.resumen?.sobrantes || 0)} sobrantes
                        </span>
                      </div>
                    </div>

                    <button
                      type="button"
                      className="aed-modal-close"
                      onClick={cerrarPopupDetalleUbicacion_}
                      title="Cerrar"
                    >
                      ×
                    </button>
                  </div>

                  <div className="aed-modal-body custom-scroll">
                    <table className="aed-table">
                      <thead>
                        <tr>
                          <th>IdUnico</th>
                          <th>Código</th>
                          <th>Descripción</th>
                          <th>Estado</th>
                          <th>Hora</th>
                          <th>Observaciones</th>
                        </tr>
                      </thead>

                      <tbody>
                        {(modalDetalleUbicacion.detalle || []).map((row, idx) => {
                          const estado = getEstadoFilaVisual_(row);

                          return (
                            <tr key={`${row.idunico || "SIN-ID"}-${idx}`} className="aed-row">
                              <td>
                                <span className="aed-meta-main text-[14px]">
                                  {row.idunico || "—"}
                                </span>
                              </td>

                              <td>
                                <span className="text-[13px] font-black uppercase tracking-[0.08em] text-[var(--text-main)]">
                                  {row.codigo || row.sku || "—"}
                                </span>
                              </td>

                              <td>
                                <span className="text-[12px] font-semibold uppercase text-[var(--text-secondary)] leading-snug">
                                  {row.descripcion || "Sin descripción"}
                                </span>
                              </td>

                              <td>
                                <span className={estado.className}>
                                  {estado.text}
                                </span>
                              </td>

                              <td>
                                <span className="text-[12px] font-black text-[var(--text-main)]">
                                  {formatearHora_(row.horaescaneoidunico || row.hora || row.horaregistro || row.horaescaneo)}
                                </span>
                              </td>

                              <td>
                                <span className="text-[12px] font-semibold text-[var(--text-secondary)]">
                                  {row.observaciones || row.nota || row.mensaje || "—"}
                                </span>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>

                    {!modalLoading && (!modalDetalleUbicacion.detalle || modalDetalleUbicacion.detalle.length === 0) && (
                      <div className="aed-empty-state">
                        <div className="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                          <LocalIcon name="scan-search" size={28} />
                        </div>

                        <span className="text-[13px] font-black uppercase tracking-widest text-[var(--text-secondary)]">
                          Sin registros para esta ubicación
                        </span>
                      </div>
                    )}

                    {modalLoading && (
                      <div className="p-24 flex flex-col items-center justify-center gap-4">
                        <div className="w-10 h-10 border-4 border-slate-100 border-t-[var(--primary)] rounded-full animate-spin"></div>
                        <span className="text-[10px] font-black tracking-widest text-slate-400 uppercase">
                          Cargando detalle...
                        </span>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}
        </div>
      );
    };

    // =========================================================
    // MONTAJE
    // =========================================================
    const targetElement = document.getElementById("render-auditoria-excedentes-detalle");

    if (!targetElement) {
      notify_("No se encontró el contenedor principal del detalle de auditoría.", "error", 4200, {
        title: "Error de interfaz",
        sound: true
      });
      console.warn("⚠️ [AuditoriaExcedentesDetalle] No se encontró #render-auditoria-excedentes-detalle");
      return;
    }

    const yaInicializado = targetElement.dataset.aedMounted === "1";

    if (window.__AUDITORIA_EXCEDENTES_DETALLE_ROOT__) {
      try {
        window.__AUDITORIA_EXCEDENTES_DETALLE_ROOT__.unmount();
      } catch (e) {
        console.warn("⚠️ [AuditoriaExcedentesDetalle] No se pudo desmontar root previo:", e);
        notifyOnceShell_(
          "auditoria-detalle-root-previo",
          "Se liberó una instancia previa del detalle de auditoría.",
          "warning",
          1600,
          {
            title: "Reinicialización",
            sound: false
          },
          10000
        );
      }
      window.__AUDITORIA_EXCEDENTES_DETALLE_ROOT__ = null;
    }

    try {
      targetElement.dataset.aedMounted = "1";
      window.__AUDITORIA_EXCEDENTES_DETALLE_ROOT__ = ReactDOM.createRoot(targetElement);
      window.__AUDITORIA_EXCEDENTES_DETALLE_ROOT__.render(<AuditoriaExcedentesDetalleView />);

      if (!yaInicializado) {
        notifyOnceShell_(
          "auditoria-detalle-vista-montada",
          "Detalle de auditoría listo para operar.",
          "success",
          1500,
          {
            title: "Vista cargada",
            sound: false
          },
          12000
        );
      }
    } catch (e) {
      console.error("❌ [AuditoriaExcedentesDetalle] Error montando root React:", e);
      notify_("Ocurrió un error al montar el detalle de auditoría.", "error", 4200, {
        title: "Error de montaje",
        sound: true
      });
    }
  };

  window.initVista = window.cargar_AuditoriaExcedentesDetalle;
  console.log("🧩 [AuditoriaExcedentesDetalle] Vista inyectable inicializada y registrada.");
</script>
