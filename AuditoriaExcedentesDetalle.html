<div id="render-auditoria-excedentes-detalle"></div>

<script type="text/babel">
  window.cargar_AuditoriaExcedentesDetalle = () => {
    const { useState, useEffect, useMemo, useCallback, useRef } = React;
    const notify = (m, t = "info", timer = 2500, o = {}) => {
      const f = window.notificar || window.lanzarNotificacion;
      if (typeof f === "function") f(m, t, timer, o);
    };
    const str = (v) => String(v == null ? "" : v).trim();
    const up = (v) => str(v).toUpperCase();
    const num = (v) => {
      const n = Number(v);
      return Number.isFinite(n) ? n : 0;
    };
    const fmtDate = (v) =>
      !v
        ? "Sin fecha"
        : v instanceof Date
          ? v.toLocaleDateString("es-MX")
          : str(v);
    const fmtTime = (v) => {
      if (!v) return "--";
      if (v instanceof Date)
        return v.toLocaleTimeString("es-MX", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        });
      const s = str(v);
      return /^\d{1,2}:\d{2}/.test(s) ? s.slice(0, 5) : "--";
    };

    function Icon({ name, size = 17, className = "" }) {
      const r = useRef(null);
      useEffect(() => {
        if (!window.lucide || !r.current) return;
        r.current.innerHTML = "";
        const i = document.createElement("i");
        i.setAttribute("data-lucide", name || "circle");
        i.style.width = `${size}px`;
        i.style.height = `${size}px`;
        i.className = className;
        r.current.appendChild(i);
        window.lucide.createIcons();
      }, [name, size, className]);
      return (
        <span ref={r} className="inline-flex items-center justify-center" />
      );
    }

    const normalizeLocation = (response, fallback, auditId) => {
      const safe = response || {};
      const rows = Array.isArray(safe)
        ? safe
        : Array.isArray(safe.detalle)
          ? safe.detalle
          : Array.isArray(safe.data)
            ? safe.data
            : [];
      const detail = rows.filter((r) => r && r.idunico);
      const s = safe.resumen || {};
      const first = detail[0] || null;
      const unique = (list) => {
        const map = {};
        list.forEach((r) => {
          const k = up(r.idunico);
          if (k && !map[k]) map[k] = r;
        });
        return Object.values(map);
      };
      const c = unique(detail.filter((r) => r.escorrecto === true)).length;
      const f = unique(detail.filter((r) => r.esfaltante === true)).length;
      const so = unique(detail.filter((r) => r.essobrante === true)).length;
      const e = unique(detail.filter((r) => r.esfaltante !== true)).length;
      return {
        idauditoria: safe.idauditoria || auditId || "",
        ubicacion: up(safe.ubicacion || fallback),
        bodega: up(safe.bodega || first?.bodega || ""),
        detalle: detail,
        resumen: {
          esperados: num(s.esperados) || c + f,
          escaneados: num(s.escaneados) || e,
          correctos: num(s.correctos) || c,
          faltantes: num(s.faltantes) || f,
          sobrantes: num(s.sobrantes) || so,
        },
      };
    };

    function Metric({ label, value, ok, bad }) {
      return (
        <div className={`metric ${ok ? "ok" : ""} ${bad ? "bad" : ""}`}>
          <div className="metric-value">{num(value)}</div>
          <div className="metric-label">{label}</div>
        </div>
      );
    }
    function DrawerMetric({ label, value, tone }) {
      return (
        <div className={`aed-drawer-metric tone-${tone}`}>
          <div className="aed-drawer-metric-value">{num(value)}</div>
          <div className="aed-drawer-metric-label">{label}</div>
        </div>
      );
    }

    function LocationRow({ item, onOpen }) {
      const progress = Math.max(0, Math.min(100, num(item.avancePct)));
      const status = item.cerrada
        ? item.tieneDiferencia
          ? "Cerrada con diferencia"
          : "Cerrada correcta"
        : item.estadoRitmo === "DETENIDO"
          ? "Detenido"
          : item.estadoRitmo === "CRITICO"
            ? "Crítico"
            : item.estadoRitmo === "LENTO"
              ? "Lento"
              : "A tiempo";
      const tone =
        item.tieneDiferencia ||
        ["DETENIDO", "CRITICO"].includes(item.estadoRitmo)
          ? "red"
          : item.estadoRitmo === "LENTO"
            ? "amber"
            : "green";
      return (
        <tr>
          <td>
            <div className="location">{item.ubicacion || "SIN UBICACIÓN"}</div>
            <div className="sub">
              {item.bodega || "SIN BODEGA"} · Secuencia{" "}
              {num(item.secuenciaubicacion)}
            </div>
          </td>
          <td>
            <div className="flex items-center gap-2">
              <div className="progress">
                <span
                  style={{
                    width: `${progress}%`,
                    background:
                      tone === "red"
                        ? "var(--c)"
                        : tone === "amber"
                          ? "var(--warn)"
                          : "var(--ok)",
                  }}
                />
              </div>
              <b>{progress}%</b>
            </div>
          </td>
          <td>{num(item.esperados)}</td>
          <td>{num(item.escaneados)}</td>
          <td>
            <b style={{ color: "var(--ok)" }}>{num(item.correctos)}</b>
          </td>
          <td>
            <b style={{ color: "var(--warn)" }}>{num(item.faltantes)}</b>
          </td>
          <td>
            <b style={{ color: "var(--c)" }}>{num(item.sobrantes)}</b>
          </td>
          <td>{num(item.pendientes)}</td>
          <td>{num(item.minutosTranscurridos).toFixed(1)} min</td>
          <td>{num(item.escaneosPorMinuto).toFixed(2)} ids/min</td>
          <td>
            {item.cerrada
              ? "—"
              : `${num(item.minutosEstimadosRestantes).toFixed(1)} min`}
          </td>
          <td>
            {fmtTime(item.horainicioubicacion)} /{" "}
            {fmtTime(item.horafinubicacion)}
          </td>
          <td>
            <span className={`chip ${tone}`}>{status}</span>
          </td>
          <td>
            <button type="button" className="detail-btn" onClick={onOpen}>
              <Icon name="panel-right-open" size={14} />
              Ver detalle
            </button>
          </td>
        </tr>
      );
    }

    function LocationDetailDrawer({ data, loading, close, audit, auditId }) {
      const [query, setQuery] = useState("");
      const [filter, setFilter] = useState("TODOS");
      useEffect(() => {
        const p = document.body.style.overflow;
        document.body.style.overflow = "hidden";
        const k = (e) => e.key === "Escape" && close();
        window.addEventListener("keydown", k);
        return () => {
          document.body.style.overflow = p;
          window.removeEventListener("keydown", k);
        };
      }, [close]);
      const rows = Array.isArray(data?.detalle) ? data.detalle : [];
      const state = (row) =>
        row?.escorrecto === true
          ? {
              key: "CORRECTO",
              label: "Correcto",
              className: "green",
              icon: "circle-check",
            }
          : row?.esfaltante === true
            ? {
                key: "FALTANTE",
                label: "Faltante",
                className: "amber",
                icon: "triangle-alert",
              }
            : row?.essobrante === true
              ? {
                  key: "SOBRANTE",
                  label: "Sobrante",
                  className: "red",
                  icon: "circle-x",
                }
              : {
                  key: "PENDIENTE",
                  label: "Pendiente",
                  className: "slate",
                  icon: "clock-3",
                };
      const filtered = useMemo(() => {
        const q = up(query);
        return rows.filter((row) => {
          const s = state(row);
          if (filter !== "TODOS" && s.key !== filter) return false;
          if (!q) return true;
          return up(
            [
              row?.idunico,
              row?.codigo,
              row?.descripcion,
              row?.observaciones,
              row?.bodega,
              row?.ubicacion,
            ].join(" "),
          ).includes(q);
        });
      }, [rows, query, filter]);
      const r = data?.resumen || {},
        esperados = num(r.esperados),
        escaneados = num(r.escaneados),
        correctos = num(r.correctos),
        faltantes = num(r.faltantes),
        sobrantes = num(r.sobrantes),
        confiabilidad =
          esperados > 0 ? Math.min(100, (correctos / esperados) * 100) : 0;
      const ds =
        faltantes > 0 || sobrantes > 0
          ? { label: "Con diferencias", className: "red" }
          : correctos > 0
            ? { label: "Conciliada", className: "green" }
            : { label: "Sin actividad", className: "slate" };
      const filters = [
        { key: "TODOS", label: "Todos" },
        { key: "CORRECTO", label: "Correctos" },
        { key: "FALTANTE", label: "Faltantes" },
        { key: "SOBRANTE", label: "Sobrantes" },
      ];
      const folio =
          audit?.idauditoria || data?.idauditoria || auditId || "SIN AUDITORÍA",
        bodega = data?.bodega || audit?.bodegaobjetivo || "TODAS LAS BODEGAS";
      return (
        <div className="aed-drawer-layer" role="dialog" aria-modal="true">
          <button
            type="button"
            className="aed-drawer-backdrop"
            onClick={close}
          />
          <aside className="aed-drawer">
            <header className="aed-drawer-header">
              <div className="aed-drawer-header-main">
                <div className="aed-drawer-location-wrap">
                  <div className="aed-drawer-location-icon">
                    <Icon name="warehouse" size={23} />
                  </div>
                  <div className="aed-drawer-heading">
                    <p className="aed-drawer-eyebrow">
                      Detalle operativo de ubicación
                    </p>
                    <h2 className="aed-drawer-title">
                      {data?.ubicacion || "SIN UBICACIÓN"}
                    </h2>
                    <p className="aed-drawer-subtitle">
                      {folio} · {bodega}
                    </p>
                    <div className="toolbar-meta" style={{ marginTop: 11 }}>
                      <span className={`chip ${ds.className}`}>{ds.label}</span>
                      <span className="chip slate">
                        {filtered.length} registros visibles
                      </span>
                    </div>
                  </div>
                </div>
                <button
                  type="button"
                  className="aed-drawer-close"
                  onClick={close}
                >
                  <Icon name="x" size={19} />
                </button>
              </div>
            </header>
            <section className="aed-drawer-metrics">
              <DrawerMetric label="Esperados" value={esperados} tone="slate" />
              <DrawerMetric
                label="Escaneados"
                value={escaneados}
                tone="slate"
              />
              <DrawerMetric label="Correctos" value={correctos} tone="green" />
              <DrawerMetric label="Faltantes" value={faltantes} tone="amber" />
              <DrawerMetric label="Sobrantes" value={sobrantes} tone="red" />
            </section>
            <section className="aed-drawer-control">
              <label className="aed-drawer-search">
                <span className="aed-drawer-search-icon">
                  <Icon name="search" size={16} />
                </span>
                <input
                  type="search"
                  className="aed-drawer-search-input"
                  placeholder="Buscar IdUnico, código, descripción..."
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                />
              </label>
              <div className="aed-drawer-filters">
                {filters.map((x) => (
                  <button
                    key={x.key}
                    type="button"
                    className={`aed-filter-button ${filter === x.key ? "active" : ""}`}
                    onClick={() => setFilter(x.key)}
                  >
                    {x.label}
                  </button>
                ))}
              </div>
            </section>
            <section className="aed-drawer-content">
              {loading ? (
                <div className="aed-drawer-state">
                  <div className="spinner" />
                  <div className="aed-drawer-state-title">
                    Consultando ubicación
                  </div>
                  <div className="aed-drawer-state-description">
                    Cargando los resultados de auditoría
                  </div>
                </div>
              ) : filtered.length ? (
                <table className="aed-detail-table">
                  <thead>
                    <tr>
                      <th>IdUnico</th>
                      <th>Producto</th>
                      <th>Estado</th>
                      <th>Hora</th>
                      <th>Observaciones</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filtered.map((row, i) => {
                      const s = state(row);
                      return (
                        <tr key={`${row?.idunico || "SIN-ID"}-${i}`}>
                          <td>
                            <span className="aed-detail-id">
                              {row?.idunico || "SIN ID"}
                            </span>
                          </td>
                          <td>
                            <div className="aed-detail-id">
                              {row?.codigo || "—"}
                            </div>
                            <span className="aed-detail-description">
                              {row?.descripcion || "Sin descripción"}
                            </span>
                          </td>
                          <td>
                            <span className={`chip ${s.className}`}>
                              <Icon name={s.icon} size={13} />
                              {s.label}
                            </span>
                          </td>
                          <td>
                            <span className="aed-detail-id">
                              {fmtTime(row?.horaescaneoidunico)}
                            </span>
                          </td>
                          <td>
                            <span className="aed-detail-observation">
                              {row?.observaciones || "Sin observaciones"}
                            </span>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              ) : (
                <div className="aed-drawer-state">
                  <Icon
                    name={
                      query || filter !== "TODOS" ? "search-x" : "package-open"
                    }
                    size={32}
                  />
                  <div className="aed-drawer-state-title">
                    {query || filter !== "TODOS"
                      ? "Sin coincidencias"
                      : "Sin registros"}
                  </div>
                </div>
              )}
            </section>
            <footer className="aed-drawer-footer">
              <div>
                <div className="aed-drawer-result-count">
                  {filtered.length} de {rows.length} registros
                </div>
                <div className="track" style={{ width: 180, marginTop: 7 }}>
                  <div
                    className="bar"
                    style={{
                      width: `${confiabilidad}%`,
                      background:
                        confiabilidad >= 97
                          ? "var(--ok)"
                          : confiabilidad >= 90
                            ? "var(--warn)"
                            : "var(--c)",
                    }}
                  />
                </div>
              </div>
            </footer>
          </aside>
        </div>
      );
    }

    function App() {
      const [id, setId] = useState(
        window.__AUDITORIA_EXCEDENTES_DETALLE_ID__ || "",
      );
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [modal, setModal] = useState(null);
      const [modalLoading, setModalLoading] = useState(false);
      const lastFullLoadRef = useRef(0);
      const mounted = useRef(true),
        fullBusy = useRef(false),
        pulseBusy = useRef(false);
      useEffect(
        () => () => {
          mounted.current = false;
        },
        [],
      );

      const merge = useCallback(
        (previous, incoming, options = {}) => {
          const prior = previous || {};
          const next = incoming || {};

          const replaceLocations =
            options.replaceLocations === true;

          const map = {};

          /*
          * El pulso es incremental y conserva ubicaciones previas.
          * La carga completa es autoritativa y reemplaza ubicaciones.
          */
          if (!replaceLocations) {
            (prior.ubicacionesEnVivo || []).forEach((item) => {
              const key = up(
                item?.key ||
                item?.ubicacion
              );

              if (key) {
                map[key] = item;
              }
            });
          }

          (next.ubicacionesEnVivo || []).forEach((item) => {
            const key = up(
              item?.key ||
              item?.ubicacion
            );

            if (!key) {
              return;
            }

            if (replaceLocations) {
              map[key] = {
                ...item,
                key: key,
                ubicacion: up(
                  item.ubicacion || key
                )
              };
              return;
            }

            map[key] = {
              ...(map[key] || {}),
              ...item,
              key: key,
              ubicacion: up(
                item.ubicacion || key
              )
            };
          });

          return {
            ...prior,
            ...next,

            auditoria: {
              ...(prior.auditoria || {}),
              ...(next.auditoria || {})
            },

            resumen: {
              ...(prior.resumen || {}),
              ...(next.resumen || {})
            },

            ubicacionesEnVivo: Object.values(map)
              .sort((a, b) => {
                const sequence =
                  num(a.secuenciaubicacion) -
                  num(b.secuenciaubicacion);

                if (sequence !== 0) {
                  return sequence;
                }

                return String(
                  a.ubicacion || ""
                ).localeCompare(
                  String(b.ubicacion || ""),
                  "es",
                  {
                    numeric: true,
                    sensitivity: "base"
                  }
                );
              })
          };
        },
        []
      );

      const load = useCallback(
        (auditId, silent = false) => {
          const currentId = str(auditId);

          if (!currentId) {
            return;
          }

          if (fullBusy.current) {
            if (!silent) {
              notify(
                "Ya existe una actualización en proceso.",
                "info",
                1800,
                {
                  title: "Actualizando auditoría",
                  sound: false
                }
              );
            }

            return;
          }

          console.log(
            "[AED DETALLE] Carga completa solicitada",
            {
              idauditoria: currentId,
              silent: silent,
              timestamp: Date.now()
            }
          );

          fullBusy.current = true;

          if (!silent) {
            setLoading(true);
            setModal(null);
            setModalLoading(false);
          }

          google.script.run
            .withSuccessHandler((response) => {
              fullBusy.current = false;

              if (!mounted.current) {
                return;
              }

              const safe = response || {};

              console.log(
                "[AED DETALLE] Carga completa recibida",
                {
                  idauditoria: currentId,
                  source: safe.source,
                  ubicaciones:
                    Array.isArray(safe.ubicacionesEnVivo)
                      ? safe.ubicacionesEnVivo.length
                      : 0,
                  detalle:
                    Array.isArray(safe.detalle)
                      ? safe.detalle.length
                      : 0,
                  diagnostico: safe.diagnostico || null
                }
              );

              if (safe.ok === false) {
                setLoading(false);
                notify(
                  safe.mensaje ||
                    "El backend no pudo cargar la auditoría.",
                  "error",
                  4200,
                  {
                    title: "Error de auditoría"
                  }
                );
                return;
              }

              /*
              * La carga completa reemplaza ubicaciones.
              * Si el backend devuelve cero ubicaciones,
              * la tabla debe quedar vacía.
              */
              setData((previous) =>
                merge(
                  previous,
                  safe,
                  {
                    replaceLocations: true
                  }
                )
              );

              setLoading(false);
            })
            .withFailureHandler((error) => {
              fullBusy.current = false;

              console.error(
                "[AED DETALLE] Error en carga completa",
                {
                  idauditoria: currentId,
                  error: error
                }
              );

              if (!mounted.current) {
                return;
              }

              setLoading(false);

              if (!silent) {
                notify(
                  error?.message ||
                    "No se pudo cargar la auditoría.",
                  "error",
                  4200,
                  {
                    title: "Error de auditoría"
                  }
                );
              }
            })
            .AuditoriaExcedentesController_obtenerDetalleAuditoriaEnVivo(
              currentId
            );
        },
        [merge]
      );

      const pulse = useCallback(
        (auditId) => {
          if (!auditId || pulseBusy.current) return;
          pulseBusy.current = true;
          google.script.run
            .withSuccessHandler((res) => {
              pulseBusy.current = false;
              if (mounted.current && res?.ubicacionesEnVivo) {
                setData((previous) =>
                  merge(
                    previous,
                    res,
                    {
                      replaceLocations: false
                    }
                  )
                );
              }
            })
            .withFailureHandler(() => (pulseBusy.current = false))
            .AuditoriaExcedentesController_obtenerPulsoAuditoriaEnVivo(auditId);
        },
        [merge],
      );

      useEffect(() => {
        if (id) {
          load(id);
          return;
        }
        google.script.run
          .withSuccessHandler((list) => {
            const first =
              (Array.isArray(list) ? list : [])[0]?.idauditoria || "";
            if (!first) {
              setLoading(false);
              notify("No hay auditorías disponibles.", "warning");
              return;
            }
            window.__AUDITORIA_EXCEDENTES_DETALLE_ID__ = first;
            setId(first);
          })
          .withFailureHandler((e) => {
            setLoading(false);
            notify(e?.message || "No se pudieron listar auditorías.", "error");
          })
          .AuditoriaExcedentesController_listarAuditorias({});
      }, [id, load]);

      useEffect(() => {
        if (!id || modal) return;

        /*
        * El pulso consulta CacheService y puede ser frecuente.
        * La carga completa consulta Sheets y se reduce a una vez por minuto.
        */
        const pulseTimer = setInterval(() => pulse(id), 2000);
        const fullTimer = setInterval(() => load(id, true), 60000);

        return () => {
          clearInterval(pulseTimer);
          clearInterval(fullTimer);
        };
      }, [id, modal, pulse, load]);

      useEffect(() => {
        if (!id) return;

        const handleVisibility = () => {
          if (document.visibilityState === "visible" && !modal) {
            load(id, true);
          }
        };

        document.addEventListener("visibilitychange", handleVisibility);
        window.addEventListener("focus", handleVisibility);

        return () => {
          document.removeEventListener("visibilitychange", handleVisibility);
          window.removeEventListener("focus", handleVisibility);
        };
      }, [id, modal, load]);


      const audit = data?.auditoria || {},
        r = data?.resumen || {},
        locations = Array.isArray(data?.ubicacionesEnVivo)
          ? data.ubicacionesEnVivo
          : [];

      const summary = useMemo(() => {
        const sum = (k) => locations.reduce((a, x) => a + num(x[k]), 0),
          esperados = num(r.idunicosesperadostotales) || sum("esperados"),
          correctos = num(r.idunicoscorrectostotales) || sum("correctos"),
          faltantes = num(r.idunicosfaltantestotales) || sum("faltantes"),
          sobrantes = num(r.idunicossobrantestotales) || sum("sobrantes");
        return {
          ubicaciones:
            num(r.ubicacionestocadas) ||
            num(r.ubicacionesauditadas) ||
            locations.length,
          diferencias:
            num(r.ubicacionescondiferencia) ||
            locations.filter((x) => x.tieneDiferencia).length,
          esperados,
          correctos,
          incidencias: faltantes + sobrantes,
          confiabilidad:
            num(r.confiabilidadtotal) ||
            (esperados ? (correctos / esperados) * 100 : 0),
        };
      }, [r, locations]);

      const back = () =>
        window.irAVistaShell
          ? window.irAVistaShell("AuditoriaExcedentes", "AuditoriaExcedentes")
          : notify("Navegación no disponible", "error");

      const capture = () => {
        window.__AUDITORIA_EXCEDENTES_CAPTURA_ID__ = id;
        if (window.irAVistaShell)
          window.irAVistaShell(
            "AuditoriaExcedentesCaptura",
            "AuditoriaExcedentesCaptura",
            {
              __AUDITORIA_EXCEDENTES_CAPTURA_ID__: id,
              __AUDITORIA_EXCEDENTES_DETALLE_ID__: id,
            },
          );
      };

      const closeDrawer = useCallback(() => {
        setModal(null);
        setModalLoading(false);
      }, []);

      const openDetail = (ubicacion) => {
        const location = up(ubicacion);
        if (!id || !location) return;
        setModal({
          idauditoria: id,
          ubicacion: location,
          bodega: "",
          detalle: [],
          resumen: {
            esperados: 0,
            escaneados: 0,
            correctos: 0,
            faltantes: 0,
            sobrantes: 0,
          },
        });
        setModalLoading(true);
        google.script.run
          .withSuccessHandler((res) => {
            try {
              setModal(normalizeLocation(res, location, id));
              setModalLoading(false);
            } catch (e) {
              closeDrawer();
              notify(e?.message || "La respuesta no pudo procesarse.", "error");
            }
          })
          .withFailureHandler((e) => {
            closeDrawer();
            notify(e?.message || "No se pudo cargar la ubicación.", "error");
          })
          .AuditoriaExcedentesController_obtenerDetalleUbicacion(id, location);
      };

      const confColor =
        summary.confiabilidad >= 97
          ? "var(--ok)"
          : summary.confiabilidad >= 90
            ? "var(--warn)"
            : "var(--c)";

      return (
        <div className="aed-page">
          <section className="aed-workspace">
            <header className="aed-header">
              <div className="aed-id">
                <button className="aed-back" onClick={back}>
                  <Icon name="arrow-left" />
                </button>
                <div className="aed-copy">
                  <p className="aed-eyebrow">Detalle operativo de auditoría</p>
                  <div className="aed-title-row">
                    <h2 className="aed-title">
                      {audit.idauditoria || id || "SIN AUDITORÍA"}
                    </h2>
                    {audit.estatus && (
                      <span
                        className={`chip ${up(audit.estatus) === "ABIERTA" ? "red" : "green"}`}
                      >
                        {audit.estatus}
                      </span>
                    )}
                    {audit.tipoauditoria && (
                      <span className="chip amber">
                        {up(audit.tipoauditoria) === "POR_BODEGA"
                          ? "Por bodega"
                          : "Global"}
                      </span>
                    )}
                  </div>
                  <p className="aed-description">
                    {audit.auditor || "Sin auditor"} ·{" "}
                    {audit.bodegaobjetivo || "Todas las bodegas"} ·{" "}
                    {fmtDate(audit.fecha)} · {fmtTime(audit.horainicio)} -{" "}
                    {fmtTime(audit.horafin)}
                  </p>
                </div>
              </div>
              <div className="metrics">
                <div className="metric">
                  <div className="metric-value">
                    {summary.confiabilidad.toFixed(2)}
                    <small>%</small>
                  </div>
                  <div className="metric-label">Confiabilidad</div>
                  <div className="track">
                    <div
                      className="bar"
                      style={{
                        width: `${Math.min(100, summary.confiabilidad)}%`,
                        background: confColor,
                      }}
                    />
                  </div>
                </div>
                <Metric label="Ubicaciones" value={summary.ubicaciones} />
                <Metric
                  label="Diferencias"
                  value={summary.diferencias}
                  bad={summary.diferencias > 0}
                />
                <Metric label="Esperadas" value={summary.esperados} />
                <Metric label="Correctas" value={summary.correctos} ok />
                <Metric
                  label="Incidencias"
                  value={summary.incidencias}
                  bad={summary.incidencias > 0}
                />
              </div>
              <div className="actions">
                <button
                  type="button"
                  className="action"
                  onClick={() => {
                    if (!id || loading) {
                      return;
                    }

                    console.log(
                      "[AED DETALLE] Actualización manual solicitada",
                      {
                        idauditoria: id,
                        timestamp: Date.now()
                      }
                    );

                    load(id, false);
                  }}
                  disabled={!id || loading}
                >
                  <Icon
                    name="refresh-cw"
                    className={loading ? "animate-spin" : ""}
                  />

                  <span className="action-label">
                    {loading
                      ? "Actualizando"
                      : "Actualizar"}
                  </span>
                </button>

                {up(audit.estatus) === "ABIERTA" && (
                  <button
                    type="button"
                    className="action primary"
                    onClick={capture}
                    disabled={!id || loading}
                  >
                    <Icon
                      name="play"
                      size={17}
                    />

                    <span className="action-label">
                      Continuar
                    </span>
                  </button>
                )}
              </div>
            </header>
            <div className="toolbar">
              <div className="aed-toolbar-main">
                <div className="aed-toolbar-icon">
                  <Icon
                    name="map-pinned"
                    size={21}
                  />
                </div>

                <div className="aed-toolbar-copy">
                  <span className="aed-toolbar-eyebrow">
                    Control operativo
                  </span>

                  <h3>
                    Ubicaciones auditadas
                  </h3>

                  <p className="aed-toolbar-description">
                    Seguimiento de avance, ritmo e incidencias por ubicación
                  </p>
                </div>
              </div>

              <div className="aed-toolbar-context">
                <span className="aed-toolbar-context-item live">
                  <span className="aed-live-dot" />
                  Auditoría en vivo
                </span>

                <span className="aed-toolbar-context-item">
                  <Icon
                    name="rows-3"
                    size={14}
                  />

                  {locations.length} registros
                </span>
              </div>
            </div>
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    {[
                      "Ubicación",
                      "Avance",
                      "Esperados",
                      "Escaneados",
                      "Correctos",
                      "Faltantes",
                      "Sobrantes",
                      "Pendientes",
                      "Tiempo",
                      "Ritmo",
                      "Restante",
                      "Inicio / Fin",
                      "Estado",
                      "Detalle",
                    ].map((x) => (
                      <th key={x}>{x}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {locations.map((item, i) => (
                    <LocationRow
                      key={item.key || `${item.ubicacion}-${i}`}
                      item={item}
                      onOpen={() => openDetail(item.ubicacion)}
                    />
                  ))}
                </tbody>
              </table>
              {loading && (
                <div className="loading">
                  <div className="spinner" />
                  <b>Cargando detalle de auditoría...</b>
                </div>
              )}
              {!loading && !locations.length && (
                <div className="empty">
                  <Icon name="map-pin-off" size={30} />
                  <b>SIN UBICACIONES REGISTRADAS</b>
                </div>
              )}
            </div>
          </section>
          {modal && (
            <LocationDetailDrawer
              data={modal}
              loading={modalLoading}
              audit={audit}
              auditId={id}
              close={closeDrawer}
            />
          )}
        </div>
      );
    }

    const target = document.getElementById(
      "render-auditoria-excedentes-detalle",
    );
    if (!target) {
      notify("No se encontró el contenedor de detalle.", "error");
      return;
    }
    if (window.__AUDITORIA_EXCEDENTES_DETALLE_ROOT__) {
      try {
        window.__AUDITORIA_EXCEDENTES_DETALLE_ROOT__.unmount();
      } catch (e) {
        console.warn(e);
      }
    }
    window.__AUDITORIA_EXCEDENTES_DETALLE_ROOT__ = ReactDOM.createRoot(target);
    window.__AUDITORIA_EXCEDENTES_DETALLE_ROOT__.render(<App />);
  };
  window.initVista = window.cargar_AuditoriaExcedentesDetalle;
</script>
