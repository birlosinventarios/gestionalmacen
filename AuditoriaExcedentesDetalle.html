<script type="text/babel">
  window.cargar_AuditoriaExcedentesDetalle = () => {
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // =========================================================
    // HELPERS DE NOTIFICACIÓN
    // =========================================================
    const notify_ = (mensaje, tipo = "info", timer = 2500, options = {}) => {
      const fn = window.notificar || window.lanzarNotificacion;
      if (typeof fn === "function") {
        fn(mensaje, tipo, timer, options);
      }
    };

    const createNotifyOnce_ = (ref) => (key, mensaje, tipo = "info", timer = 2500, options = {}, cooldown = 8000) => {
      const now = Date.now();
      const last = ref.current[key] || 0;
      if (now - last < cooldown) return;
      ref.current[key] = now;
      notify_(mensaje, tipo, timer, options);
    };

    const shellNotifyStateRef = { current: {} };
    const notifyOnceShell_ = createNotifyOnce_(shellNotifyStateRef);

    // =========================================================
    // UTILIDADES DE FECHA / HORA
    // =========================================================
    function _esDateValida_(d) {
      return d instanceof Date && !isNaN(d.getTime());
    }

    function _parseFechaFlexible_(value) {
      if (!value) return null;

      if (value instanceof Date) {
        return _esDateValida_(value) ? value : null;
      }

      const str = String(value).trim();
      if (!str) return null;

      if (/^\d{2}\/\d{2}\/\d{4}$/.test(str)) {
        const parts = str.split("/");
        const day = Number(parts[0]);
        const month = Number(parts[1]);
        const year = Number(parts[2]);
        const d = new Date(year, month - 1, day, 0, 0, 0, 0);
        return _esDateValida_(d) ? d : null;
      }

      const parsed = new Date(str);
      return _esDateValida_(parsed) ? parsed : null;
    }

    function _parseHoraFlexible_(value) {
      if (!value) return null;

      if (value instanceof Date) {
        return _esDateValida_(value) ? value : null;
      }

      const str = String(value).trim();
      if (!str) return null;

      if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(str)) {
        const parts = str.split(":");
        const hh = Number(parts[0] || 0);
        const mm = Number(parts[1] || 0);
        const ss = Number(parts[2] || 0);
        const d = new Date(2000, 0, 1, hh, mm, ss, 0);
        return _esDateValida_(d) ? d : null;
      }

      const parsed = new Date(str);
      return _esDateValida_(parsed) ? parsed : null;
    }

    function formatearFecha_(value) {
      const d = _parseFechaFlexible_(value);
      if (!d) return "Sin fecha";
      return d.toLocaleDateString("es-MX", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    function formatearHora_(value) {
      const d = _parseHoraFlexible_(value);
      if (!d) return "--";
      return d.toLocaleTimeString("es-MX", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
    }

    function construirResumenFechaHora_(item) {
      return `${formatearFecha_(item.fecha)} • ${formatearHora_(item.horainicio)} - ${formatearHora_(item.horafin)}`;
    }

    // =========================================================
    // HELPERS GENERALES
    // =========================================================
    function toStr_(value) {
      return String(value == null ? "" : value).trim();
    }

    function toUpper_(value) {
      return toStr_(value).toUpperCase();
    }

    function toNum_(value) {
      if (value === "" || value == null) return 0;
      const n = Number(value);
      return isNaN(n) ? 0 : n;
    }

    function uniqueBy_(arr, mapper) {
      const seen = new Set();
      const out = [];
      (arr || []).forEach((item) => {
        const key = mapper(item);
        if (seen.has(key)) return;
        seen.add(key);
        out.push(item);
      });
      return out;
    }

    function getConfiabilidadVisual_(valor) {
      const n = Number(valor || 0);

      if (n < 90) {
        return {
          label: "Crítica",
          className: "aed-chip aed-chip-red",
          tone: "red"
        };
      }

      if (n >= 97) {
        return {
          label: "Controlada",
          className: "aed-chip aed-chip-emerald",
          tone: "emerald"
        };
      }

      return {
        label: "Atención",
        className: "aed-chip aed-chip-amber",
        tone: "amber"
      };
    }

    function getEstadoFilaVisual_(row) {
      const estado = toUpper_(row.estado || "");

      if (estado === "CORRECTO" || row.escorrecto === true) {
        return {
          className: "aed-chip aed-state-correcto",
          text: "Correcto"
        };
      }

      if (estado === "FALTANTE" || row.esfaltante === true) {
        return {
          className: "aed-chip aed-state-faltante",
          text: "Faltante"
        };
      }

      if (estado === "SOBRANTE" || row.essobrante === true) {
        return {
          className: "aed-chip aed-state-sobrante",
          text: "Sobrante"
        };
      }

      return {
        className: "aed-chip aed-state-pendiente",
        text: "Pendiente"
      };
    }

    function normalizarDetalleUbicacionResponse_(resp, fallbackUbicacion = "") {
      if (!resp) {
        return {
          ubicacion: fallbackUbicacion,
          detalle: [],
          resumen: {
            esperados: 0,
            escaneados: 0,
            correctos: 0,
            faltantes: 0,
            sobrantes: 0
          }
        };
      }

      const detalle = Array.isArray(resp)
        ? resp
        : Array.isArray(resp.detalle)
        ? resp.detalle
        : Array.isArray(resp.rows)
        ? resp.rows
        : [];

      const correctos = detalle.filter(x => toUpper_(x.estado) === "CORRECTO" || x.escorrecto === true).length;
      const faltantes = detalle.filter(x => toUpper_(x.estado) === "FALTANTE" || x.esfaltante === true).length;
      const sobrantes = detalle.filter(x => toUpper_(x.estado) === "SOBRANTE" || x.essobrante === true).length;
      const escaneados = detalle.filter(x =>
        (x.idunico && x.esfaltante !== true) || toUpper_(x.estado) === "CORRECTO" || toUpper_(x.estado) === "SOBRANTE"
      ).length;
      const esperados = detailHasExpectedRows_(detalle)
        ? detalle.filter(x => toUpper_(x.estado) !== "SOBRANTE").length
        : (correctos + faltantes);

      return {
        ubicacion: toUpper_(resp.ubicacion || fallbackUbicacion || (detalle[0] && detalle[0].ubicacion) || ""),
        detalle,
        resumen: {
          esperados,
          escaneados,
          correctos,
          faltantes,
          sobrantes
        }
      };
    }

    function detailHasExpectedRows_(rows) {
      return (rows || []).some(x =>
        toUpper_(x.estado) === "PENDIENTE" ||
        toUpper_(x.estado) === "CORRECTO" ||
        toUpper_(x.estado) === "FALTANTE"
      );
    }

    function normalizarUbicaciones_(auditResp) {
      if (!auditResp) return [];

      if (Array.isArray(auditResp.ubicaciones) && auditResp.ubicaciones.length) {
        return auditResp.ubicaciones.map((u, index) => {
          if (typeof u === "string") {
            return {
              key: `${u}-${index}`,
              ubicacion: toUpper_(u),
              bodega: "",
              estado: "",
              total: 0
            };
          }

          return {
            key: `${u.ubicacion || u.nombre || index}-${index}`,
            ubicacion: toUpper_(u.ubicacion || u.nombre || ""),
            bodega: toUpper_(u.bodega || ""),
            estado: toUpper_(u.estatus || u.estado || ""),
            total: toNum_(u.total || u.cantidad || 0)
          };
        });
      }

      const detalle = Array.isArray(auditResp.detalle) ? auditResp.detalle : [];
      const map = {};

      detalle.forEach((row) => {
        const ubic = toUpper_(row.ubicacion);
        if (!ubic) return;

        if (!map[ubic]) {
          map[ubic] = {
            key: ubic,
            ubicacion: ubic,
            bodega: toUpper_(row.bodega || ""),
            estado: "",
            total: 0
          };
        }

        map[ubic].total += 1;
      });

      return Object.values(map);
    }

    // =========================================================
    // ICONO LOCAL
    // =========================================================
    const LocalIcon = ({ name, size = 18, className = "" }) => {
      const iconRef = useRef(null);

      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = "";
          const i = document.createElement("i");
          i.setAttribute("data-lucide", name.toLowerCase());
          i.style.width = `${size}px`;
          i.style.height = `${size}px`;
          if (className) i.className = className;
          iconRef.current.appendChild(i);
          window.lucide.createIcons();
        }
      }, [name, size, className]);

      return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
    };

    // =========================================================
    // COMPONENTE PRINCIPAL
    // =========================================================
    const AuditoriaExcedentesDetalleView = () => {
      const [loading, setLoading] = useState(true);
      const [loadingLocation, setLoadingLocation] = useState(false);

      const [auditId, setAuditId] = useState(window.__AUDITORIA_EXCEDENTES_DETALLE_ID__ || "");
      const [auditList, setAuditList] = useState([]);
      const [auditData, setAuditData] = useState(null);

      const [ubicaciones, setUbicaciones] = useState([]);
      const [ubicacionActiva, setUbicacionActiva] = useState("");
      const [detalleUbicacion, setDetalleUbicacion] = useState({
        ubicacion: "",
        detalle: [],
        resumen: {
          esperados: 0,
          escaneados: 0,
          correctos: 0,
          faltantes: 0,
          sobrantes: 0
        }
      });

      const [searchDetalle, setSearchDetalle] = useState("");

      const firstLoadDoneRef = useRef(false);

      // -------------------------------------------------------
      // CARGA DE AUDITORÍAS
      // -------------------------------------------------------
      const cargarListadoAuditorias_ = useCallback(() => {
        setLoading(true);

        google.script.run
          .withSuccessHandler((resp) => {
            const lista = Array.isArray(resp) ? resp : [];
            setAuditList(lista);

            let selected = auditId || window.__AUDITORIA_EXCEDENTES_DETALLE_ID__ || "";
            if (!selected && lista.length > 0) {
              selected = lista[0].idauditoria;
            }
            if (selected) {
              setAuditId(selected);
              window.__AUDITORIA_EXCEDENTES_DETALLE_ID__ = selected;
            }

            setLoading(false);

            if (!firstLoadDoneRef.current) {
              firstLoadDoneRef.current = true;
              notify_(
                `Detalle listo. Auditorías disponibles: ${lista.length}.`,
                "success",
                1800,
                {
                  title: "Vista lista",
                  sound: false
                }
              );
            }
          })
          .withFailureHandler((err) => {
            console.error("❌ [AuditoriaExcedentesDetalle] Error listando auditorías:", err);
            setLoading(false);
            notify_(
              err && err.message ? err.message : "No se pudieron cargar las auditorías.",
              "error",
              4200,
              {
                title: "Error de auditorías",
                sound: true
              }
            );
          })
          .AuditoriaExcedentesController_listarAuditorias({});
      }, [auditId]);

      useEffect(() => {
        if (typeof google === "undefined" || !google.script || !google.script.run) {
          notify_("google.script.run no está disponible en este contexto.", "error", 4200, {
            title: "Entorno inválido",
            sound: true
          });
          setLoading(false);
          return;
        }

        notify_("Cargando detalle de auditoría...", "info", 1400, {
          title: "Inicializando detalle",
          sound: false
        });

        cargarListadoAuditorias_();
      }, [cargarListadoAuditorias_]);

      // -------------------------------------------------------
      // CARGA DETALLE AUDITORÍA
      // -------------------------------------------------------
      const cargarDetalleAuditoria_ = useCallback((idauditoria) => {
        if (!idauditoria) {
          setAuditData(null);
          setUbicaciones([]);
          setUbicacionActiva("");
          setDetalleUbicacion({
            ubicacion: "",
            detalle: [],
            resumen: {
              esperados: 0,
              escaneados: 0,
              correctos: 0,
              faltantes: 0,
              sobrantes: 0
            }
          });
          return;
        }

        setLoading(true);

        google.script.run
          .withSuccessHandler((resp) => {
            const safe = resp || {};
            setAuditData(safe);

            const locs = normalizarUbicaciones_(safe);
            setUbicaciones(locs);

            const nextUbic =
              ubicacionActiva && locs.some(x => toUpper_(x.ubicacion) === toUpper_(ubicacionActiva))
                ? ubicacionActiva
                : (locs[0] ? locs[0].ubicacion : "");

            setUbicacionActiva(nextUbic || "");
            setLoading(false);
          })
          .withFailureHandler((err) => {
            console.error("❌ [AuditoriaExcedentesDetalle] Error obteniendo detalle de auditoría:", err);
            setLoading(false);
            notify_(
              err && err.message ? err.message : "No se pudo cargar la auditoría seleccionada.",
              "error",
              4200,
              {
                title: "Error de auditoría",
                sound: true
              }
            );
          })
          .AuditoriaExcedentesController_obtenerDetalleAuditoria(idauditoria);
      }, [ubicacionActiva]);

      useEffect(() => {
        if (auditId) {
          cargarDetalleAuditoria_(auditId);
        }
      }, [auditId, cargarDetalleAuditoria_]);

      // -------------------------------------------------------
      // CARGA DETALLE UBICACIÓN
      // -------------------------------------------------------
      const cargarDetalleUbicacion_ = useCallback((idauditoria, ubicacion) => {
        if (!idauditoria || !ubicacion) {
          setDetalleUbicacion({
            ubicacion: "",
            detalle: [],
            resumen: {
              esperados: 0,
              escaneados: 0,
              correctos: 0,
              faltantes: 0,
              sobrantes: 0
            }
          });
          return;
        }

        setLoadingLocation(true);

        google.script.run
          .withSuccessHandler((resp) => {
            const normalizado = normalizarDetalleUbicacionResponse_(resp, ubicacion);
            setDetalleUbicacion(normalizado);
            setLoadingLocation(false);
          })
          .withFailureHandler((err) => {
            console.error("❌ [AuditoriaExcedentesDetalle] Error obteniendo detalle de ubicación:", err);
            setLoadingLocation(false);
            notify_(
              err && err.message ? err.message : "No se pudo cargar la ubicación seleccionada.",
              "error",
              4200,
              {
                title: "Error de ubicación",
                sound: true
              }
            );
          })
          .AuditoriaExcedentesController_obtenerDetalleUbicacion(idauditoria, ubicacion);
      }, []);

      useEffect(() => {
        if (auditId && ubicacionActiva) {
          cargarDetalleUbicacion_(auditId, ubicacionActiva);
        } else {
          setDetalleUbicacion({
            ubicacion: "",
            detalle: [],
            resumen: {
              esperados: 0,
              escaneados: 0,
              correctos: 0,
              faltantes: 0,
              sobrantes: 0
            }
          });
        }
      }, [auditId, ubicacionActiva, cargarDetalleUbicacion_]);

      // -------------------------------------------------------
      // NAVEGACIÓN
      // -------------------------------------------------------
      const continuarCaptura_ = () => {
        const folio = toStr_(auditId);
        const audit = auditData?.auditoria || auditData || {};

        if (!folio) {
          notify_("No hay auditoría seleccionada.", "warning", 2600, {
            title: "Auditoría requerida",
            sound: true
          });
          return;
        }

        if (toUpper_(audit.estatus) !== "ABIERTA") {
          notify_(
            `La auditoría ${folio} ya está cerrada.`,
            "warning",
            2600,
            {
              title: "Captura no disponible",
              sound: true
            }
          );
          return;
        }

        window.__AUDITORIA_EXCEDENTES_CAPTURA_ID__ = folio;
        window.__AUDITORIA_EXCEDENTES_DETALLE_ID__ = folio;

        if (typeof window.irAVistaShell === "function") {
          window.irAVistaShell(
            "AuditoriaExcedentesCaptura",
            "AuditoriaExcedentesCaptura",
            {
              __AUDITORIA_EXCEDENTES_CAPTURA_ID__: folio,
              __AUDITORIA_EXCEDENTES_DETALLE_ID__: folio
            }
          );
          return;
        }

        notify_(
          `No se pudo abrir la captura para la auditoría ${folio}.`,
          "error",
          3200,
          {
            title: "Navegación no disponible",
            sound: true
          }
        );
      };

      // -------------------------------------------------------
      // DERIVADOS
      // -------------------------------------------------------
      const auditHeader = auditData?.auditoria || auditData || {};
      const auditResumen = auditData?.resumen || {};
      const conf = getConfiabilidadVisual_(auditResumen.confiabilidadtotal || auditHeader.confiabilidadtotal);

      const rowsFiltradas = useMemo(() => {
        const rows = Array.isArray(detalleUbicacion.detalle) ? detalleUbicacion.detalle : [];
        const q = toStr_(searchDetalle).toLowerCase();

        if (!q) return rows;

        return rows.filter((row) =>
          toStr_(row.idunico).toLowerCase().includes(q) ||
          toStr_(row.codigo || row.sku).toLowerCase().includes(q) ||
          toStr_(row.descripcion).toLowerCase().includes(q) ||
          toStr_(row.observaciones).toLowerCase().includes(q)
        );
      }, [detalleUbicacion.detalle, searchDetalle]);

      const totalUbicaciones = ubicaciones.length;

      return (
        <div className="space-y-6 fade-in-up">
          {/* HEADER */}
          <div className="aed-panel p-5">
            <div className="flex flex-col 2xl:flex-row 2xl:items-start 2xl:justify-between gap-5">
              <div className="space-y-2">
                <p className="text-[11px] font-black uppercase tracking-[0.16em] text-[var(--text-secondary)]">
                  Detalle de auditoría de excedentes
                </p>

                <h2 className="m-0 p-0 bg-transparent border-none text-[var(--text-main)] text-[28px] font-black tracking-tight">
                  {auditHeader?.idauditoria || "SIN AUDITORÍA"}
                </h2>

                <div className="flex flex-wrap items-center gap-2">
                  <span className="aed-meta-sub">
                    {auditHeader?.idauditoria
                      ? construirResumenFechaHora_(auditHeader)
                      : "Selecciona una auditoría"}
                  </span>

                  {auditHeader?.estatus && (
                    <span className={`aed-chip ${toUpper_(auditHeader.estatus) === "ABIERTA" ? "aed-chip-open" : "aed-chip-closed"}`}>
                      {auditHeader.estatus}
                    </span>
                  )}

                  {(auditResumen.confiabilidadtotal != null || auditHeader.confiabilidadtotal != null) && (
                    <span className={conf.className}>
                      {Number(auditResumen.confiabilidadtotal || auditHeader.confiabilidadtotal || 0).toFixed(2)}% • {conf.label}
                    </span>
                  )}

                  {auditHeader?.auditor && (
                    <span className="aed-chip aed-chip-slate">
                      {auditHeader.auditor}
                    </span>
                  )}

                  {auditHeader?.tipoauditoria && (
                    <span className="aed-chip aed-chip-amber">
                      {toUpper_(auditHeader.tipoauditoria) === "POR_BODEGA" ? "POR BODEGA" : "GLOBAL"}
                    </span>
                  )}
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-3">
                {toUpper_(auditHeader.estatus) === "ABIERTA" && (
                  <button
                    type="button"
                    className="aed-btn-primary"
                    onClick={continuarCaptura_}
                  >
                    Continuar captura
                  </button>
                )}

                <button
                  type="button"
                  className="aed-btn-soft"
                  onClick={() => cargarDetalleAuditoria_(auditId)}
                  disabled={!auditId}
                >
                  Actualizar
                </button>
              </div>
            </div>
          </div>

          {/* KPIS */}
          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            <div className="aed-kpi">
              <div className="aed-kpi-topbar slate"></div>
              <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">Ubicaciones auditadas</div>
              <div className="text-[28px] font-black text-[var(--text-main)] mt-2">
                {Number(auditResumen.ubicacionesauditadas || 0)}
              </div>
            </div>

            <div className="aed-kpi">
              <div className="aed-kpi-topbar red"></div>
              <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">Ubic. con diferencia</div>
              <div className="text-[28px] font-black text-[var(--text-main)] mt-2">
                {Number(auditResumen.ubicacionescondiferencia || 0)}
              </div>
            </div>

            <div className="aed-kpi">
              <div className="aed-kpi-topbar slate"></div>
              <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">Esperados totales</div>
              <div className="text-[28px] font-black text-[var(--text-main)] mt-2">
                {Number(auditResumen.idunicosesperadostotales || 0)}
              </div>
            </div>

            <div className="aed-kpi">
              <div className="aed-kpi-topbar emerald"></div>
              <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">Correctos totales</div>
              <div className="text-[28px] font-black text-[var(--text-main)] mt-2">
                {Number(auditResumen.idunicoscorrectostotales || 0)}
              </div>
            </div>

            <div className="aed-kpi">
              <div className="aed-kpi-topbar amber"></div>
              <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">Faltantes totales</div>
              <div className="text-[28px] font-black text-[var(--text-main)] mt-2">
                {Number(auditResumen.idunicosfaltantestotales || 0)}
              </div>
            </div>

            <div className="aed-kpi">
              <div className="aed-kpi-topbar red"></div>
              <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">Sobrantes totales</div>
              <div className="text-[28px] font-black text-[var(--text-main)] mt-2">
                {Number(auditResumen.idunicossobrantestotales || 0)}
              </div>
            </div>
          </div>

          {/* LAYOUT */}
          <div className="grid grid-cols-1 2xl:grid-cols-[420px_minmax(0,1fr)] gap-6">
            {/* COLUMNA IZQUIERDA */}
            <div className="space-y-6">
              {/* SELECTOR AUDITORÍA */}
              <div className="aed-panel p-5 space-y-4">
                <div>
                  <label className="aed-label">Selecciona auditoría</label>
                  <select
                    className="aed-select"
                    value={auditId}
                    onChange={(e) => {
                      const id = e.target.value;
                      setAuditId(id);
                      window.__AUDITORIA_EXCEDENTES_DETALLE_ID__ = id;
                      setSearchDetalle("");
                    }}
                  >
                    <option value="">Selecciona una auditoría</option>
                    {auditList.map((item, index) => (
                      <option key={`${item.idauditoria}-${index}`} value={item.idauditoria}>
                        {item.idauditoria}
                      </option>
                    ))}
                  </select>
                </div>

                <div className="grid grid-cols-3 gap-3">
                  <div className="aed-kpi !min-h-[110px]">
                    <div className="aed-kpi-topbar slate"></div>
                    <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">Auditorías</div>
                    <div className="text-[24px] font-black text-[var(--text-main)] mt-2">
                      {auditList.length}
                    </div>
                  </div>

                  <div className="aed-kpi !min-h-[110px]">
                    <div className="aed-kpi-topbar slate"></div>
                    <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">Ubicaciones</div>
                    <div className="text-[24px] font-black text-[var(--text-main)] mt-2">
                      {totalUbicaciones}
                    </div>
                  </div>

                  <div className="aed-kpi !min-h-[110px]">
                    <div className="aed-kpi-topbar red"></div>
                    <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">Diferencias</div>
                    <div className="text-[24px] font-black text-[var(--text-main)] mt-2">
                      {Number(auditResumen.ubicacionescondiferencia || 0)}
                    </div>
                  </div>
                </div>

                {auditHeader?.bodegaobjetivo && (
                  <div className="aed-card p-4">
                    <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)] mb-1">
                      Bodega objetivo
                    </div>
                    <div className="text-[14px] font-black uppercase tracking-[0.10em] text-[var(--text-main)]">
                      {auditHeader.bodegaobjetivo}
                    </div>
                  </div>
                )}
              </div>

              {/* LISTA DE UBICACIONES */}
              <div className="aed-panel p-5">
                <div className="flex items-center justify-between gap-3 mb-4">
                  <div>
                    <div className="text-[11px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">
                      Ubicaciones detectadas
                    </div>
                    <div className="text-[18px] font-black text-[var(--text-main)]">
                      {ubicaciones.length}
                    </div>
                  </div>

                  <span className="aed-chip aed-chip-slate">
                    Navegación lateral
                  </span>
                </div>

                <div className="space-y-3 max-h-[520px] overflow-auto custom-scroll">
                  {ubicaciones.length === 0 && !loading && (
                    <div className="aed-empty-state !min-h-[160px]">
                      <div className="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                        <LocalIcon name="map-pin-off" size={22} />
                      </div>
                      <span className="text-[11px] font-black uppercase tracking-widest text-[var(--text-secondary)]">
                        Sin ubicaciones registradas
                      </span>
                    </div>
                  )}

                  {ubicaciones.map((u) => (
                    <div
                      key={u.key}
                      className={`aed-list-item ${toUpper_(u.ubicacion) === toUpper_(ubicacionActiva) ? "active" : ""}`}
                      onClick={() => {
                        setUbicacionActiva(u.ubicacion);
                        setSearchDetalle("");
                      }}
                    >
                      <div className="flex items-center justify-between gap-3">
                        <div className="min-w-0">
                          <div className="aed-meta-main text-[15px]">
                            {u.ubicacion || "SIN UBICACIÓN"}
                          </div>
                          <div className="aed-meta-sub mt-1">
                            {u.bodega || "SIN BODEGA"}
                          </div>
                        </div>

                        <div className="text-right">
                          <div className="text-[18px] font-black text-[var(--text-main)]">
                            {Number(u.total || 0)}
                          </div>
                          <div className="aed-meta-sub">
                            filas
                          </div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* COLUMNA DERECHA */}
            <div className="space-y-6">
              {/* RESUMEN UBICACIÓN */}
              <div className="aed-panel p-5">
                <div className="flex flex-col xl:flex-row xl:items-start xl:justify-between gap-5">
                  <div>
                    <p className="text-[11px] font-black uppercase tracking-[0.16em] text-[var(--text-secondary)] mb-1">
                      Ubicación seleccionada
                    </p>
                    <h3 className="m-0 p-0 bg-transparent border-none text-[var(--text-main)] text-[24px] font-black tracking-tight font-mono-premium">
                      {detalleUbicacion.ubicacion || ubicacionActiva || "SIN UBICACIÓN"}
                    </h3>
                    <div className="mt-2">
                      <span className="aed-chip aed-chip-slate">
                        Consulta detallada
                      </span>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 md:grid-cols-5 gap-3 w-full xl:w-auto xl:min-w-[680px]">
                    <div className="aed-kpi">
                      <div className="aed-kpi-topbar slate"></div>
                      <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">Esperados</div>
                      <div className="text-[24px] font-black text-[var(--text-main)] mt-2">
                        {Number(detalleUbicacion.resumen?.esperados || 0)}
                      </div>
                    </div>

                    <div className="aed-kpi">
                      <div className="aed-kpi-topbar slate"></div>
                      <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">Escaneados</div>
                      <div className="text-[24px] font-black text-[var(--text-main)] mt-2">
                        {Number(detalleUbicacion.resumen?.escaneados || 0)}
                      </div>
                    </div>

                    <div className="aed-kpi">
                      <div className="aed-kpi-topbar emerald"></div>
                      <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">Correctos</div>
                      <div className="text-[24px] font-black text-[var(--text-main)] mt-2">
                        {Number(detalleUbicacion.resumen?.correctos || 0)}
                      </div>
                    </div>

                    <div className="aed-kpi">
                      <div className="aed-kpi-topbar amber"></div>
                      <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">Faltantes</div>
                      <div className="text-[24px] font-black text-[var(--text-main)] mt-2">
                        {Number(detalleUbicacion.resumen?.faltantes || 0)}
                      </div>
                    </div>

                    <div className="aed-kpi">
                      <div className="aed-kpi-topbar red"></div>
                      <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">Sobrantes</div>
                      <div className="text-[24px] font-black text-[var(--text-main)] mt-2">
                        {Number(detalleUbicacion.resumen?.sobrantes || 0)}
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              {/* BUSCADOR DETALLE */}
              <div className="aed-panel p-5 space-y-4">
                <div className="grid grid-cols-1 xl:grid-cols-[1fr_auto] gap-3 items-end">
                  <div>
                    <label className="aed-label">Buscar dentro de la ubicación</label>
                    <input
                      type="text"
                      className="aed-input font-mono-premium"
                      placeholder="Busca por IdUnico, código o descripción..."
                      value={searchDetalle}
                      onChange={(e) => setSearchDetalle(e.target.value)}
                    />
                  </div>

                  <button
                    type="button"
                    className="aed-btn-soft"
                    onClick={() => setSearchDetalle("")}
                  >
                    Limpiar búsqueda
                  </button>
                </div>
              </div>

              {/* TABLA DETALLE */}
              <div className="aed-panel overflow-hidden">
                <div className="px-5 pt-5 pb-3 flex items-center justify-between gap-3 flex-wrap">
                  <div>
                    <p className="text-[11px] font-black uppercase tracking-[0.16em] text-[var(--text-secondary)] mb-1">
                      Detalle de ubicación
                    </p>
                    <h3 className="m-0 p-0 bg-transparent border-none text-[var(--text-main)] text-[22px] font-black tracking-tight">
                      Esperados, faltantes y sobrantes
                    </h3>
                  </div>

                  <span className="aed-chip aed-chip-slate">
                    {rowsFiltradas.length} filas
                  </span>
                </div>

                <div className="aed-table-wrap custom-scroll">
                  <table className="aed-table">
                    <thead>
                      <tr>
                        <th>IdUnico</th>
                        <th>Código</th>
                        <th>Descripción</th>
                        <th>Estado</th>
                        <th>Hora</th>
                        <th>Observaciones</th>
                      </tr>
                    </thead>

                    <tbody>
                      {rowsFiltradas.map((row, idx) => {
                        const estado = getEstadoFilaVisual_(row);

                        return (
                          <tr key={`${row.idunico || "SIN-ID"}-${idx}`} className="aed-row">
                            <td>
                              <span className="aed-meta-main text-[14px]">
                                {row.idunico || "—"}
                              </span>
                            </td>

                            <td>
                              <span className="text-[13px] font-black uppercase tracking-[0.08em] text-[var(--text-main)]">
                                {row.codigo || row.sku || "—"}
                              </span>
                            </td>

                            <td>
                              <span className="text-[12px] font-semibold uppercase text-[var(--text-secondary)] leading-snug">
                                {row.descripcion || "Sin descripción"}
                              </span>
                            </td>

                            <td>
                              <span className={estado.className}>
                                {estado.text}
                              </span>
                            </td>

                            <td>
                              <span className="text-[12px] font-black text-[var(--text-main)]">
                                {formatearHora_(row.hora || row.horaregistro || row.horaescaneo)}
                              </span>
                            </td>

                            <td>
                              <span className="text-[12px] font-semibold text-[var(--text-secondary)]">
                                {row.observaciones || row.nota || row.mensaje || "—"}
                              </span>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>

                  {!loadingLocation && rowsFiltradas.length === 0 && (
                    <div className="aed-empty-state">
                      <div className="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                        <LocalIcon name="scan-search" size={28} />
                      </div>

                      <span className="text-[13px] font-black uppercase tracking-widest text-[var(--text-secondary)]">
                        Sin detalle disponible
                      </span>

                      <span className="text-[11px] text-slate-400 font-semibold">
                        Selecciona una ubicación o ajusta la búsqueda.
                      </span>
                    </div>
                  )}

                  {loadingLocation && (
                    <div className="p-24 flex flex-col items-center justify-center gap-4">
                      <div className="w-10 h-10 border-4 border-slate-100 border-t-[var(--primary)] rounded-full animate-spin"></div>
                      <span className="text-[10px] font-black tracking-widest text-slate-400 uppercase">
                        Cargando ubicación...
                      </span>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // =========================================================
    // MONTAJE
    // =========================================================
    const targetElement = document.getElementById("render-auditoria-excedentes-detalle");

    if (!targetElement) {
      notify_(
        "No se encontró el contenedor principal del detalle de auditoría.",
        "error",
        4200,
        {
          title: "Error de interfaz",
          sound: true
        }
      );
      console.warn("⚠️ [AuditoriaExcedentesDetalle] No se encontró #render-auditoria-excedentes-detalle");
      return;
    }

    const yaInicializado = targetElement.dataset.aedMounted === "1";

    if (window.__AUDITORIA_EXCEDENTES_DETALLE_ROOT__) {
      try {
        window.__AUDITORIA_EXCEDENTES_DETALLE_ROOT__.unmount();
      } catch (e) {
        console.warn("⚠️ [AuditoriaExcedentesDetalle] No se pudo desmontar root previo:", e);
        notifyOnceShell_(
          "auditoria-detalle-root-previo",
          "Se liberó una instancia previa del detalle de auditoría.",
          "warning",
          1600,
          {
            title: "Reinicialización",
            sound: false
          },
          10000
        );
      }
      window.__AUDITORIA_EXCEDENTES_DETALLE_ROOT__ = null;
    }

    try {
      targetElement.dataset.aedMounted = "1";
      window.__AUDITORIA_EXCEDENTES_DETALLE_ROOT__ = ReactDOM.createRoot(targetElement);
      window.__AUDITORIA_EXCEDENTES_DETALLE_ROOT__.render(<AuditoriaExcedentesDetalleView />);

      if (!yaInicializado) {
        notifyOnceShell_(
          "auditoria-detalle-vista-montada",
          "Detalle de auditoría listo para operar.",
          "success",
          1500,
          {
            title: "Vista cargada",
            sound: false
          },
          12000
        );
      }
    } catch (e) {
      console.error("❌ [AuditoriaExcedentesDetalle] Error montando root React:", e);
      notify_(
        "Ocurrió un error al montar el detalle de auditoría.",
        "error",
        4200,
        {
          title: "Error de montaje",
          sound: true
        }
      );
    }
  };

  window.initVista = window.cargar_AuditoriaExcedentesDetalle;
  console.log("🧩 [AuditoriaExcedentesDetalle] Vista inyectable inicializada y registrada.");
</script>
