<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bibliotecas Compatibles con Navegador (Versiones UMD) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Framer Motion para Navegador -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    
    <!-- SweetAlert2 (Funciona nativamente) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                primary: '#d93025',
                dark: '#a50e0e',
                light: 'rgba(217, 48, 37, 0.08)',
                gray: '#696160',
                grayDark: '#1c1d1f',
                text: '#1c1d1f',
                textSec: '#5f6368'
              }
            },
            boxShadow: {
              'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
              'brand-red': '0 8px 20px -4px rgba(217, 48, 37, 0.3)',
            }
          }
        }
      }
    </script>

    <style>
      :root {
        --primary: #d93025;
        --bg-color: #f3f4f6;
      }
      body { margin: 0; padding: 0; height: 100vh; background-color: var(--bg-color); font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
      .custom-scroll::-webkit-scrollbar { width: 4px; }
      .custom-scroll::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
      .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
      
      /* Estilo simple para notificaciones tipo Toast manuales si Sonner falla */
      .toast-container {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
      }

      
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      const e = React.createElement;
      const { useState, useEffect, useMemo, useCallback } = React;
      
      // Acceso seguro a Framer Motion en ventana
      const motion = window.Motion ? window.Motion.motion : (props) => e('div', props);
      const AnimatePresence = window.Motion ? window.Motion.AnimatePresence : React.Fragment;

      // Componente de Notificación Simple (Reemplazo de Sonner para máxima compatibilidad en GAS)
      const CustomToast = ({ message, type, onClose }) => {
        useEffect(() => {
          const timer = setTimeout(onClose, 3000);
          return () => clearTimeout(timer);
        }, [onClose]);

        return e(motion.div, {
          initial: { opacity: 0, y: -20 },
          animate: { opacity: 1, y: 0 },
          exit: { opacity: 0 },
          className: `px-6 py-3 rounded-full shadow-lg text-white font-bold text-sm mb-2 ${type === 'success' ? 'bg-emerald-500' : 'bg-red-500'}`
        }, message);
      };

      const SummaryCard = ({ label, value, iconName, color, desc }) => {
        const colorClasses = {
          indigo: 'bg-blue-50 text-blue-600',
          amber: 'bg-orange-50 text-orange-600',
          emerald: 'bg-emerald-50 text-emerald-600',
        };

        useEffect(() => { if(window.lucide) window.lucide.createIcons(); }, [value]);

        return e(motion.div, { 
          initial: { opacity: 0, y: 20 },
          animate: { opacity: 1, y: 0 },
          whileHover: { y: -4 },
          className: "bg-white p-6 rounded-[1.5rem] border border-slate-100 shadow-soft flex items-center gap-5" 
        },
          e('div', { className: `p-4 rounded-2xl ${colorClasses[color]}` }, 
            e('i', { 'data-lucide': iconName.toLowerCase(), style: { width: '24px', height: '24px' } })
          ),
          e('div', null,
            e('p', { className: "text-[20px] font-bold text-brand-textSec uppercase tracking-widest mb-1" }, label),
            e('div', { className: "flex items-baseline gap-2" },
              e('h4', { className: "text-3xl font-black text-brand-text" }, value),
              e('span', { className: "text-[20px] font-medium text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded" }, desc)
            )
          )
        );
      };

function App() {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  const [lastUpdate, setLastUpdate] = useState(null);
  const [bodegaActiva, setBodegaActiva] = useState('ALL');
  const [busqueda, setBusqueda] = useState('');
  const [toasts, setToasts] = useState([]);

const showToast = (message, type = 'success') => {
    const id = Date.now();
    setToasts(prev => [...prev, { id, message, type }]);
  };

const BODEGAS = [
    { id: 'B1', nombre: 'BODEGA 1', prefix: 'B1', icon: 'warehouse' },
    { id: 'B2', nombre: 'BODEGA 2', prefix: 'B2', icon: 'warehouse' },
    { id: 'B3', nombre: 'BODEGA 3', prefix: 'B3', icon: 'warehouse' },
    { id: 'BM', nombre: 'MOSTRADOR', prefix: 'BM', icon: 'shopping-cart' },
    { id: 'CB1', nombre: 'CASA BLANCA 1', prefix: 'CB1', icon: 'home' },
    { id: 'CB2', nombre: 'CASA BLANCA 2', prefix: 'CB2', icon: 'home' },
  ];

const cargarDatos = useCallback((silencioso = false) => {
    if (!silencioso) setLoading(true);
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler((res) => {
          setData(res || []);
          setLoading(false);
          setLastUpdate(new Date().toLocaleTimeString());
          if(!silencioso) showToast('Inventario actualizado');
        })
.withFailureHandler(() => {
          setLoading(false);
          Swal.fire('Error', 'No se pudo conectar con la base de datos', 'error');
        })
        .obtenerTodaLaBaseExcedentes();
    } else {
// Mock para desarrollo local
      setTimeout(() => {
        setData([
          { CODIGO: 'EX-001', DESCRIPCION: 'VALVULA DE BOLA 2"', CANTIDAD: 12, UBICACION: 'B1-ESTANTE-A', IDUNICO: 'ID-001' },
          { CODIGO: 'EX-002', DESCRIPCION: 'CODO PVC 90 GRAD', CANTIDAD: 45, UBICACION: 'DISPONIBLE', IDUNICO: 'ID-002' },
        ]);
        setLoading(false);
        setLastUpdate(new Date().toLocaleTimeString());
      }, 1000);
    }
  }, []);

useEffect(() => { cargarDatos(); }, [cargarDatos]);

  // Re-procesar iconos de Lucide cuando cambian los items mostrados
  useEffect(() => {
    if (window.lucide) window.lucide.createIcons();
  }, [data, bodegaActiva, busqueda]);

  const stats = useMemo(() => {
    const inbox = data.filter(i => (i.UBICACION || '').toUpperCase().includes('DISPONIBLE')).length;
    return { total: data.length, inbox, ubicado: data.length - inbox };
  }, [data]);

// 1. Todo lo que coincide con el texto buscado
const resultadosBusqueda = useMemo(() => {
  const busquedaLower = busqueda.toLowerCase();
  return data.filter(item => 
    !busqueda || 
    (item.CODIGO || '').toLowerCase().includes(busquedaLower) || 
    (item.DESCRIPCION || '').toLowerCase().includes(busquedaLower)
  );
}, [data, busqueda]);

// 2. Lo que se ve en la tabla (Filtrado por la pestaña de bodega actual)
const itemsVisiblesEnTabla = useMemo(() => {
  return resultadosBusqueda.filter(item => {
    if (bodegaActiva === 'ALL') return true;
    const prefix = BODEGAS.find(b => b.id === bodegaActiva)?.prefix || '';
    return (item.UBICACION || '').toUpperCase().startsWith(prefix.toUpperCase());
  });
}, [resultadosBusqueda, bodegaActiva]);

const codigosSugeridos = useMemo(() => {
  // 1. Extraemos los códigos únicos
  const unicos = [...new Set(data.map(i => i.CODIGO || ''))];
  
  // 2. Filtramos valores vacíos y ordenamos de A a Z
  return unicos
    .filter(codigo => codigo.trim() !== '')
    .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
}, [data]);


return e('div', { className: "flex h-screen overflow-hidden text-slate-900" },
e('div', { className: "toast-container" },
   e(AnimatePresence, null,
     toasts.map(t => e(CustomToast, { 
      key: t.id, 
      message: t.message, 
      type: t.type, 
      onClose: () => setToasts(prev => prev.filter(p => p.id !== t.id)) }))
    )
  ),
          
          // --- SIDEBAR ---
e(motion.aside, { 
  initial: { x: -300 }, animate: { x: 0 },
  className: "hidden md:flex w-80 bg-white border-r border-slate-200 flex-col shrink-0 shadow-xl z-20" 
},

          // icono de aplicacion y header
e('div', { className: "p-8 flex items-center gap-4" },
  e('img', { 
    src: "https://lirp.cdn-website.com/32df9ef3/dms3rep/multi/opt/logo_408868407-1920w.png",
    className: "w-12 h-auto object-contain", 
    alt: "Logo"
    }),
  e('div', null,
    e('h1', { className: "font-black text-xl leading-none tracking-tight" }, "E X C E D E N T E S"),
    )
),
            
            e('nav', { className: "flex-1 p-6 space-y-2 overflow-y-auto custom-scroll" },
 
              e('button', { 
                onClick: () => setBodegaActiva('ALL'),
                className: `w-full flex items-center justify-between p-4 rounded-2xl transition-all ${bodegaActiva === 'ALL' ? 'bg-brand-primary text-white shadow-brand-red font-bold' : 'hover:bg-slate-50 text-slate-600'}`
              }, 
                e('div', { className: "flex items-center gap-3 text-[20px] font-bold" }, e('i', { 'data-lucide': 'layout-grid', className: "w-5 h-5 " }), "Vista Global"),
e('span', { className: "text-[20px] font-bold px-2 py-0.5 rounded-lg bg-white/20" }, resultadosBusqueda.length)
              ),

              e('div', { className: "py-4" }, e('hr', { className: "border-slate-100" })),
              e('p', { className: "text-[20px] font-black text-slate-400 uppercase tracking-[0.2em] px-4 mb-4" }, "Bodegas"),

BODEGAS.map(b => {
  const count = resultadosBusqueda.filter(i => 
    (i.UBICACION || '').toUpperCase().startsWith(b.prefix.toUpperCase())
  ).length;
  
  const active = bodegaActiva === b.id;
  // Determinamos si debe resaltar: tiene stock Y hay una búsqueda activa
  const debeResaltar = busqueda.length > 0 && count > 0 && !active;

  return e(motion.button, {
    key: b.id,
    whileTap: { scale: 0.98 },
    onClick: () => setBodegaActiva(b.id),
    // Configuración de la animación intermitente
    animate: debeResaltar ? {
      backgroundColor: ["#ffffff", "#fecaca", "#ffffff"], // Blanco -> Rojo claro -> Blanco
      transition: { 
        duration: 2, 
        repeat: Infinity, 
        ease: "easeInOut" 
      }
    } : { backgroundColor: active ? "#1c1d1f" : "#ffffff" },
    className: `w-full flex items-center justify-between p-4 rounded-2xl transition-all mb-1 ${
      active ? 'text-white shadow-lg' : 'hover:bg-slate-50 text-slate-500'
    }`
  }, 
    e('div', { className: "flex items-center gap-3" }, 
      e('i', { 'data-lucide': b.icon, className: "w-4 h-4" }), 
      e('span', { className: "font-bold text-[20px]" }, b.nombre)
    ),
    e('span', { 
      className: `text-[20px] font-black px-2 py-0.5 rounded-lg ${
        active ? 'bg-white/10' : (count > 0 && busqueda ? 'bg-red-500 text-white' : 'bg-slate-100')
      }` 
    }, count)
                );
              })
            )
          ),

// --- CONTENIDO PRINCIPAL ---
e('main', { className: "flex-1 flex flex-col min-w-0 bg-slate-50" },
  
  // Header con Buscador
  e('header', { className: "h-24 bg-white border-b border-slate-200 px-10 flex items-center justify-between shrink-0" },
    e('div', { className: "relative w-full max-w-xl" },
      // Icono de Lupa (Siempre a la izquierda)
      e('i', { 'data-lucide': 'search', className: "absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5" }),
      
      e('input', { 
        type: "text", 
        list: "lista-codigos", 
        placeholder: "Escribe o selecciona un código", 
        className: "w-full bg-slate-100 border-2 border-transparent focus:border-brand-primary/20 focus:bg-white rounded-2xl py-3.5 pl-14 pr-5 text-[20px] font-medium outline-none transition-all",
        value: busqueda,
        onChange: (ev) => setBusqueda(ev.target.value)
      }),

      e('datalist', { id: "lista-codigos" },
        codigosSugeridos.map(codigo => 
          e('option', { key: codigo, value: codigo })
        )
      )
    ), // Fin del div del buscador

    e('div', { className: "flex items-center gap-4" },
      lastUpdate && e('div', { className: "text-right hidden lg:block" },
        e('p', { className: "text-[10px] font-black text-slate-400 uppercase" }, "Última sincronización"),
        e('p', { className: "text-xs font-black text-slate-900" }, lastUpdate)
      ),
      e(motion.button, { 
        whileHover: { scale: 1.02 }, whileTap: { scale: 0.98 },
        onClick: () => cargarDatos(), 
        className: "flex items-center gap-2 px-6 py-3 bg-slate-900 text-white text-sm font-bold rounded-2xl shadow-lg"
      }, 
        e('i', { 'data-lucide': 'refresh-cw', className: `w-4 h-4 ${loading ? 'animate-spin' : ''}` }),
        loading ? "Cargando..." : "Actualizar"
      )
    )
  ), // Fin Header

  e('div', { className: "flex-1 overflow-y-auto p-10 custom-scroll " },
    e('div', { className: "grid grid-cols-3 gap-8 mb-10 w-full" },
      e(SummaryCard, { label: "Catalogo General", value: stats.total, iconName: "database", color: "indigo", desc: "Items" }),
      e(SummaryCard, { label: "Sin Ubicar", value: stats.inbox, iconName: "package-plus", color: "amber", desc: "Pendientes" }),
      e(SummaryCard, { label: "Excedentes Ubicados", value: stats.ubicado, iconName: "check-circle", color: "emerald", desc: "Asignados" })
    ),

    e(motion.div, { 
      initial: { opacity: 0 }, animate: { opacity: 1 },
      className: "bg-white border border-slate-100 rounded-[2rem] shadow-soft overflow-hidden" 
    },
      e('div', { className: "overflow-x-auto" },
        e('table', { className: "w-full text-left border-collapse" },
e('thead', { className: "bg-slate-50/50" },
  e('tr', null,
    e('th', { className: "px-10 py-5 w-[20%] text-[20px] font-black text-slate-400 uppercase tracking-[0.15em]" }, 'Codigo'),
    e('th', { className: "px-1 py-5 w-[50%] text-[20px] font-black text-slate-400 uppercase tracking-[0.15em]" }, 'Descripcion'),
    e('th', { className: "px-1 py-5 w-[15%] text-[20px] font-black text-slate-400 uppercase tracking-[0.15em] text-center" }, 'Existencia'),
    e('th', { className: "px-10 py-5 w-[15%] text-[20px] font-black text-slate-400 uppercase tracking-[0.15em] text-center" }, 'Ubicación')
  )
),
          e('tbody', { className: "divide-y divide-slate-50" },
            itemsVisiblesEnTabla.length === 0 && !loading ? 
              e('tr', null, 
                e('td', { colSpan: 4, className: "py-20 text-center text-slate-400 font-medium" }, "No se encontraron resultados.")
              ) :
              itemsVisiblesEnTabla.map((item, idx) => (
                e(motion.tr, { 
                  key: item.IDUNICO || idx,
                  initial: { opacity: 0 }, animate: { opacity: 1 },
                  className: "hover:bg-slate-50/80 transition-colors group" 
                },
// COLUMNA CÓDIGO (20%)
    e('td', { className: "px-10 py-6 w-[20%]" }, 
      e('div', { className: "flex flex-col" },
        e('span', { className: "font-black text-brand-primary text-[25px]" }, item.CODIGO),
        e('span', { className: "text-[20px] text-slate-400 font-bold" }, item.IDUNICO)
      )
    ),
    
    // COLUMNA DESCRIPCIÓN (50%)
    e('td', { className: "px-1 py-6 w-[50%] text-[20px] font-bold text-slate-700 leading-tight" }, 
      item.DESCRIPCION
    ),
    
    // COLUMNA EXISTENCIA (15%)
    e('td', { className: "px-1 py-6 w-[15%] font-black text-[20px] text-center" }, 
      item.CANTIDAD
    ),
    
    // COLUMNA UBICACIÓN (15%)
    e('td', { className: "px-10 py-6 w-[15%] text-center text-[20px]"},
      e('span', { 
        className: `inline-flex items-center justify-center gap-1.5 text-[15px] font-black px-4 py-1.5 rounded-full border w-full ${(item.UBICACION || '').toUpperCase().includes('DISPONIBLE') ? 'bg-orange-50 text-orange-600 border-orange-100' : 'bg-emerald-50 text-emerald-600 border-emerald-100'}` 
      }, item.UBICACION || 'N/A')
                  )
                )
              ))
          )
        )
      ),
      loading && e('div', { className: "p-32 flex flex-col items-center justify-center gap-4" },
        e('div', { className: "w-10 h-10 border-4 border-brand-primary/10 border-t-brand-primary rounded-full animate-spin" }),
        e('p', { className: "text-xs font-black text-slate-400 uppercase tracking-widest" }, "Sincronizando...")
      )
    )
  )
) // Cierre del MAIN
); // Cierre del DIV ROOT del return principal
} // Cierre de la función App

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(e(App));
      window.onload = () => setTimeout(() => window.lucide && window.lucide.createIcons(), 500);
    </script>
  </body>
</html>
