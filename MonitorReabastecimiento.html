<script>/** MonitorReabastecimiento.html */</script>

<div id="render-monitor-reabastecimiento" class="h-full w-full flex flex-col bg-[#f8f9fa] overflow-y-auto p-4 md:p-8"></div>

<script type="text/babel">
  window.cargar_MonitorReabastecimiento = () => {
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    const PAGE_SIZE = 100;

    // =========================================================
    // HELPERS DE NOTIFICACIÓN
    // =========================================================
    const notify_ = (mensaje, tipo = "info", timer = 2500, options = {}) => {
      const fn = window.notificar || window.lanzarNotificacion;
      if (typeof fn === "function") {
        fn(mensaje, tipo, timer, options);
      }
    };

    const createNotifyOnce_ = (ref) => (key, mensaje, tipo = "info", timer = 2500, options = {}, cooldown = 8000) => {
      const now = Date.now();
      const last = ref.current[key] || 0;
      if (now - last < cooldown) return;
      ref.current[key] = now;
      notify_(mensaje, tipo, timer, options);
    };

    const shellNotifyStateRef = { current: {} };
    const notifyOnceShell_ = createNotifyOnce_(shellNotifyStateRef);

    const LocalIcon = ({ name, size = 18, className = "" }) => {
      const iconRef = useRef(null);

      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name.toLowerCase());
          i.style.width = `${size}px`;
          i.style.height = `${size}px`;
          if (className) i.className = className;
          iconRef.current.appendChild(i);
          window.lucide.createIcons();
        }
      }, [name, size, className]);

      return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
    };

    const KPIBlock = ({ title, value, unit, iconName, indicatorColor = 'slate', trend }) => {
      const iconStyles = {
        green: 'bg-emerald-50 text-emerald-600 border border-emerald-100',
        amber: 'bg-amber-50 text-amber-600 border border-amber-100',
        red: 'bg-red-50 text-red-600 border border-red-100',
        blue: 'bg-blue-50 text-blue-600 border border-blue-100',
        slate: 'bg-slate-100 text-slate-900 border border-slate-300'
      };

      const topBarColor =
        indicatorColor === 'green'
          ? 'bg-emerald-500'
          : indicatorColor === 'amber'
          ? 'bg-amber-500'
          : indicatorColor === 'red'
          ? 'bg-red-500'
          : indicatorColor === 'blue'
          ? 'bg-blue-500'
          : 'bg-slate-900';

      const trendColor =
        trend?.type === 'green'
          ? 'bg-emerald-50 text-emerald-700'
          : trend?.type === 'amber'
          ? 'bg-amber-50 text-amber-700'
          : trend?.type === 'red'
          ? 'bg-red-50 text-red-700'
          : trend?.type === 'blue'
          ? 'bg-blue-50 text-blue-700'
          : 'bg-slate-100 text-slate-900 border border-slate-300';

      return (
        <div className="bg-white border border-[#dadce0] rounded-[1.25rem] p-4 shadow-sm hover:shadow-md transition-all duration-300 relative overflow-hidden group min-h-[112px]">
          <div className={`absolute top-0 left-0 right-0 h-1.5 ${topBarColor}`}></div>

          <div className="h-full flex flex-col pt-1">
            <div className="grid grid-cols-[1fr_auto] items-center gap-3 h-full">
              <div className="min-w-0">
                <p className="text-[12px] font-black uppercase tracking-[0.12em] text-[#5f6368] leading-tight mb-2">
                  {title}
                </p>

                <div className="flex items-end gap-2 flex-wrap">
                  <h3 className="m-0 p-0 bg-transparent border-none text-[34px] font-black tracking-tight text-[#1c1d1f] leading-none">
                    {value}
                  </h3>

                  {unit && (
                    <span className="text-[13px] font-black text-[#5f6368] uppercase leading-none pb-1">
                      {unit}
                    </span>
                  )}
                </div>

                {trend && (
                  <div className="mt-2 flex items-center gap-2 flex-wrap">
                    <span className={`px-2.5 py-1 rounded-full text-[10px] font-black uppercase ${trendColor}`}>
                      {trend.text}
                    </span>

                    {trend.sub && (
                      <span className="text-[11px] font-semibold text-[#5f6368]">
                        {trend.sub}
                      </span>
                    )}
                  </div>
                )}
              </div>

              <div className="justify-self-end">
                <div className={`w-11 h-11 rounded-xl flex items-center justify-center ${iconStyles[indicatorColor]}`}>
                  <LocalIcon name={iconName} size={28} />
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const StatusBadge = ({ status }) => {
      const map = {
        VERDE: {
          cls: 'bg-emerald-50 text-emerald-700 border border-emerald-200',
          dot: 'bg-emerald-500',
          label: 'Verde'
        },
        AMBAR: {
          cls: 'bg-amber-50 text-amber-700 border border-amber-200',
          dot: 'bg-amber-500',
          label: 'Ámbar'
        },
        ROJO: {
          cls: 'bg-red-50 text-red-700 border border-red-200',
          dot: 'bg-red-500',
          label: 'Rojo'
        },
        SIN_PARAMETRIZACION: {
          cls: 'bg-slate-100 text-slate-700 border border-slate-300',
          dot: 'bg-slate-500',
          label: 'Sin Param.'
        }
      };

      const current = map[status] || map.SIN_PARAMETRIZACION;

      return (
        <span className={`inline-flex items-center gap-2 px-3 py-2 rounded-xl text-[12px] font-black uppercase tracking-[0.08em] ${current.cls}`}>
          <span className={`w-2 h-2 rounded-full ${current.dot}`}></span>
          {current.label}
        </span>
      );
    };

    const ActionBadge = ({ action }) => {
      const map = {
        'SIN ACCION': 'bg-emerald-50 text-emerald-700 border border-emerald-200',
        'RELLENO PREVENTIVO': 'bg-amber-50 text-amber-700 border border-amber-200',
        'MONITOREAR / SIN RESPALDO': 'bg-slate-100 text-slate-700 border border-slate-300',
        'RELLENO URGENTE': 'bg-red-50 text-red-700 border border-red-200',
        'REPORTAR A COMPRAS': 'bg-slate-900 text-white border border-slate-900',
        'REVISAR PARAMETRIZACION': 'bg-blue-50 text-blue-700 border border-blue-200'
      };

      return (
        <span className={`inline-flex items-center justify-center px-3 py-2 rounded-xl text-[11px] font-black uppercase tracking-[0.08em] ${map[action] || 'bg-slate-100 text-slate-700 border border-slate-300'}`}>
          {action}
        </span>
      );
    };

    const MonitorReabastecimientoDashboard = () => {
      const [registros, setRegistros] = useState([]);
      const [resumen, setResumen] = useState({});
      const [loading, setLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState("");
      const [filterStatus, setFilterStatus] = useState("ALL");
      const [filterBodega, setFilterBodega] = useState("TODAS");
      const [sortBy, setSortBy] = useState("PRIORIDAD");
      const [activeRow, setActiveRow] = useState(null);
      const [currentPage, setCurrentPage] = useState(1);
      const [modoBalance, setModoBalance] = useState("EXISTENCIAS");

      const [hoverMenu, setHoverMenu] = useState(null);

      const [isSearchExpanded, setIsSearchExpanded] = useState(false);
      const [isFabMenuOpen, setIsFabMenuOpen] = useState(false);
      const [isFabMenuMounted, setIsFabMenuMounted] = useState(false);
      const [isFabClosing, setIsFabClosing] = useState(false);
      const [isSearchClosing, setIsSearchClosing] = useState(false);

      const closeMenuTimeout = useRef(null);
      const searchInputRef = useRef(null);
      const fabContainerRef = useRef(null);

      const firstLoadDoneRef = useRef(false);
      const syncNotifyStateRef = useRef({});
      const notifyOnce_ = createNotifyOnce_(syncNotifyStateRef);

      const abrirFabMenu_ = () => {
        setIsFabMenuMounted(true);
        setIsFabClosing(false);
        setIsFabMenuOpen(true);
      };

      const cerrarFabMenu_ = () => {
        setIsFabClosing(true);
        setIsSearchClosing(true);

        setTimeout(() => {
          setIsFabMenuOpen(false);
          setIsFabMenuMounted(false);
          setIsFabClosing(false);
          setIsSearchExpanded(false);
          setIsSearchClosing(false);
          setSearchQuery("");
        }, 190);
      };

      const toggleFabMenu_ = () => {
        if (isFabMenuOpen) {
          cerrarFabMenu_();
        } else {
          abrirFabMenu_();
        }
      };

      const abrirBuscador_ = () => {
        setIsSearchClosing(false);
        setIsSearchExpanded(true);
        setTimeout(() => searchInputRef.current?.focus(), 120);
      };

      const cerrarBuscador_ = () => {
        setIsSearchClosing(true);

        setTimeout(() => {
          setIsSearchExpanded(false);
          setIsSearchClosing(false);
          setSearchQuery("");
        }, 180);
      };

      const toggleBuscador_ = () => {
        if (isSearchExpanded) {
          cerrarBuscador_();
        } else {
          abrirBuscador_();
        }
      };

      useEffect(() => {
        if (!isFabMenuOpen) return;

        const handleKeyDown = (event) => {
          if (event.key === "Escape") {
            cerrarFabMenu_();
          }
        };

        document.addEventListener("keydown", handleKeyDown, true);

        return () => {
          document.removeEventListener("keydown", handleKeyDown, true);
        };
      }, [isFabMenuOpen]);

      const fetchDatabase = useCallback((contexto = "init") => {
        const USAR_MOCK = false;
        setLoading(true);

        if (contexto === "init") {
          notify_("Cargando monitor de reabastecimiento...", "info", 1600, {
            title: "Inicializando vista",
            sound: false
          });
        } else {
          notify_("Actualizando monitor de reabastecimiento...", "info", 1400, {
            title: "Sincronizando",
            sound: false
          });
        }

        if (!USAR_MOCK && typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((resultado) => {
              const registrosCargados = resultado?.registros || [];
              const resumenCargado = resultado?.resumen || {};

              setRegistros(registrosCargados);
              setResumen(resumenCargado);
              setLoading(false);

              console.log("======================================================");
              console.log("📦 [MonitorReabastecimiento] RESPUESTA RECIBIDA DEL BACKEND");
              console.log("======================================================");
              console.log("📊 Total registros:", registrosCargados.length);
              console.log("📌 Resumen:", resumenCargado);
              console.log("======================================================");

              const total = Array.isArray(registrosCargados) ? registrosCargados.length : 0;

              if (total === 0) {
                if (contexto === "init") {
                  notify_("No se encontraron registros operativos para reabastecimiento.", "success", 2200, {
                    title: "Sin pendientes",
                    sound: false
                  });
                } else {
                  notify_("La actualización terminó sin registros operativos.", "success", 1800, {
                    title: "Actualización completada",
                    sound: false
                  });
                }
                firstLoadDoneRef.current = true;
                return;
              }

              if (!firstLoadDoneRef.current) {
                firstLoadDoneRef.current = true;
                notify_(
                  `Se cargaron ${total} registros en el monitor de reabastecimiento.`,
                  "success",
                  2200,
                  {
                    title: "Sincronización completada",
                    sound: false
                  }
                );
              } else if (contexto !== "init") {
                notify_(
                  `Monitor actualizado correctamente (${total} registros).`,
                  "success",
                  1800,
                  {
                    title: "Actualización completada",
                    sound: false
                  }
                );
              } else {
                notifyOnce_(
                  "monitor-reab-interno",
                  "La vista de reabastecimiento quedó actualizada.",
                  "success",
                  1500,
                  {
                    title: "Vista lista",
                    sound: false
                  },
                  12000
                );
              }
            })
            .withFailureHandler((err) => {
              console.error("❌ [MonitorReabastecimiento] Error consultando controller:", err);
              setRegistros([]);
              setResumen({});
              setLoading(false);

              notify_(
                (err && err.message) ? err.message : 'No se pudo consultar MonitorReabastecimientoController.',
                "error",
                4200,
                {
                  title: contexto === "init" ? "Error de carga" : "Error de sincronización",
                  sound: true
                }
              );
            })
            .MonitorReabastecimientoController_getVista();

        } else {
          setTimeout(() => {
            const mock = [
              {
                idproducto: 158,
                codigo: "T5S-1/4X31/2",
                descripcion: "TORNILLO GRADO 5 ESTANDAR DE 1/4 X 3 1/2",
                ubicacionsurtido: "B1-P05-A2",
                bodegakey: "B1",
                bodegalabel: "Bodega 1",
                existenciaactual: 8,
                minimo: 10,
                maximo: 30,
                excedentebodega: 25,
                excedentecasablanca: 0,
                excedentetotal: 25,
                statussemaforo: "ROJO",
                substatusambar: "",
                accionoperativa: "RELLENO URGENTE",
                prioridadorden: 2,
                prioridadetiqueta: "URGENTE",
                cantidadobjetivorelleno: 22,
                rellenoposibleconexcedente: 22,
                rellenocompleto: true,
                observacion: "Atender con relleno urgente desde excedente",
                sobreobjetivo: false,
                sinubicacion: false,
                sinmaxmin: false
              }
            ];

            setRegistros(mock);
            setResumen({
              totalRegistros: 1,
              verdes: 0,
              rellenosPreventivos: 0,
              rellenosUrgentes: 1,
              casosCompras: 0,
              bodega1: 1,
              bodega2: 0,
              bodega3: 0,
              cuartoAltoRiesgo: 0,
              mostrador: 0,
              sinUbicacionSegmento: 0,
              otroSegmento: 0
            });
            setLoading(false);

            notify_("Vista cargada con datos simulados.", "info", 1800, {
              title: "Modo mock activo",
              sound: false
            });
          }, 800);
        }
      }, []);

      useEffect(() => {
        fetchDatabase("init");
      }, [fetchDatabase]);
      
      useEffect(() => {
        setCurrentPage(1);
        setActiveRow(null);
      }, [searchQuery, filterStatus, sortBy, filterBodega, modoBalance]);

      const registrosConBalanceActivo = useMemo(() => {
        return (registros || []).map(item => {
          const usandoIdUnico = modoBalance === "IDUNICO";

          const excedenteBodegaActivo = usandoIdUnico
            ? Number(item.excedentebodegaIdUnico || 0)
            : Number(item.excedentebodega || 0);

          const excedenteCasaBlancaActivo = usandoIdUnico
            ? Number(item.excedentecasablancaIdUnico || 0)
            : Number(item.excedentecasablanca || 0);

          const excedenteTotalActivo =
            excedenteBodegaActivo + excedenteCasaBlancaActivo;

          const objetivoRellenoActivo = Number(item.cantidadobjetivorelleno || 0);

          const rellenoPosibleConExcedenteActivo =
            Math.min(objetivoRellenoActivo, excedenteTotalActivo);

          const rellenoCompletoActivo =
            objetivoRellenoActivo > 0 &&
            rellenoPosibleConExcedenteActivo >= objetivoRellenoActivo;

          let accionOperativaActiva = String(item.accionoperativa || "SIN ACCION").toUpperCase();

          if (
            accionOperativaActiva !== "SIN ACCION" &&
            accionOperativaActiva !== "REVISAR PARAMETRIZACION"
          ) {
            if (excedenteTotalActivo <= 0) {
              accionOperativaActiva = "REPORTAR A COMPRAS";
            } else if (String(item.statussemaforo || "").toUpperCase() === "ROJO") {
              accionOperativaActiva = "RELLENO URGENTE";
            } else if (String(item.statussemaforo || "").toUpperCase() === "AMBAR") {
              accionOperativaActiva = "RELLENO PREVENTIVO";
            }
          }

          let prioridadOrdenActiva = Number(item.prioridadorden || 999);
          let prioridadEtiquetaActiva = item.prioridadetiqueta || "SIN CLASIFICAR";

          if (accionOperativaActiva === "REPORTAR A COMPRAS") {
            prioridadOrdenActiva = 1;
            prioridadEtiquetaActiva = "CRITICO SIN RESPALDO";
          } else if (accionOperativaActiva === "RELLENO URGENTE") {
            prioridadOrdenActiva = 2;
            prioridadEtiquetaActiva = "URGENTE";
          } else if (accionOperativaActiva === "RELLENO PREVENTIVO") {
            prioridadOrdenActiva = 3;
            prioridadEtiquetaActiva = "PREVENTIVO";
          } else if (accionOperativaActiva === "SIN ACCION") {
            prioridadOrdenActiva = 5;
            prioridadEtiquetaActiva = "SIN ACCION";
          } else if (accionOperativaActiva === "REVISAR PARAMETRIZACION") {
            prioridadOrdenActiva = 6;
            prioridadEtiquetaActiva = "EXCEPCION";
          }

          const observacionActiva =
            modoBalance === "IDUNICO"
              ? `Balance por ID único. Excedente disponible: ${excedenteTotalActivo} pzas.`
              : (item.observacion || "");

          return {
            ...item,

            modoBalanceActivo: modoBalance,

            excedenteBodegaActivo,
            excedenteCasaBlancaActivo,
            excedenteTotalActivo,

            rellenoPosibleConExcedenteActivo,
            rellenoCompletoActivo,

            accionOperativaActiva,
            observacionActiva,

            prioridadOrdenActiva,
            prioridadEtiquetaActiva
          };
        });
      }, [registros, modoBalance]);

      const metrics = useMemo(() => {
        const rows = registrosConBalanceActivo || [];

        return {
          totalRegistros: rows.length,

          verdes: rows.filter(x =>
            String(x.statussemaforo || "").toUpperCase() === "VERDE"
          ).length,

          rellenosPreventivos: rows.filter(x =>
            String(x.accionOperativaActiva || x.accionoperativa || "").toUpperCase() === "RELLENO PREVENTIVO"
          ).length,

          rellenosUrgentes: rows.filter(x =>
            String(x.accionOperativaActiva || x.accionoperativa || "").toUpperCase() === "RELLENO URGENTE"
          ).length,

          casosCompras: rows.filter(x =>
            String(x.accionOperativaActiva || x.accionoperativa || "").toUpperCase() === "REPORTAR A COMPRAS"
          ).length,

          bodega1: rows.filter(x => String(x.bodegakey || "").toUpperCase() === "B1").length,
          bodega2: rows.filter(x => String(x.bodegakey || "").toUpperCase() === "B2").length,
          bodega3: rows.filter(x => String(x.bodegakey || "").toUpperCase() === "B3").length
        };
      }, [registrosConBalanceActivo]);

      const getBodegaLabel = (key) => {
        const map = {
          TODAS: "Todas",
          B1: "Bodega 1",
          B2: "Bodega 2",
          B3: "Bodega 3",
          CU: "Cuarto Alto Riesgo",
          MO: "Mostrador",
          SIN_UBICACION: "Sin ubicación",
          OTRO: "Otro"
        };

        return map[key] || "Todas";
      };

      const recordsFiltered = useMemo(() => {
        return (registrosConBalanceActivo || []).filter(item => {
          const codigo = String(item.codigo || "").toLowerCase();
          const descripcion = String(item.descripcion || "").toLowerCase();
          const ubicacion = String(item.ubicacionsurtido || "").toLowerCase();

          const accion = String(
            item.accionOperativaActiva ||
            item.accionoperativa ||
            ""
          ).toUpperCase();

          const status = String(item.statussemaforo || "").toUpperCase();
          const bodegaKey = String(item.bodegakey || "").toUpperCase();

          const q = searchQuery.toLowerCase().trim();

          const matchText =
            !q ||
            codigo.includes(q) ||
            descripcion.includes(q) ||
            ubicacion.includes(q);

          if (!matchText) return false;

          if (filterBodega !== "TODAS" && bodegaKey !== filterBodega) {
            return false;
          }
          
          if (filterStatus === "ALL") {
            return true;
          }

          if (filterStatus === "VERDE") {
            return status === "VERDE";
          }

          if (filterStatus === "PREVENTIVO") {
            return accion === "RELLENO PREVENTIVO";
          }

          if (filterStatus === "URGENTE") {
            return accion === "RELLENO URGENTE";
          }

          if (filterStatus === "COMPRAS") {
            return accion === "REPORTAR A COMPRAS";
          }

          return true;
        });

      }, [
        registrosConBalanceActivo,
        searchQuery,
        filterStatus,
        filterBodega

            if (pA !== pB) return pA - pB;
            return String(a.codigo || "").localeCompare(String(b.codigo || ""), "es", {
              sensitivity: "base",
              numeric: true

        }

const escapeHtml_ = (value) => {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
};

const compareEsLocal_ = (a, b) => {
  return String(a || "").localeCompare(String(b || ""), "es", {
    sensitivity: "base",
    numeric: true
  });
};

const buildDetalleIdUnicoHtml_ = (item) => {
  const detalles = Array.isArray(item.detalleIdUnicoExcedentes)
    ? [...item.detalleIdUnicoExcedentes]
    : [];

  detalles.sort((a, b) => {
    const cmpBodega = compareEsLocal_(a.bodega, b.bodega);
    if (cmpBodega !== 0) return cmpBodega;

    const cmpUbicacion = compareEsLocal_(a.ubicacion, b.ubicacion);
    if (cmpUbicacion !== 0) return cmpUbicacion;

    const cmpSku = compareEsLocal_(a.sku, b.sku);
    if (cmpSku !== 0) return cmpSku;

    return compareEsLocal_(a.idUnico || a.idunico, b.idUnico || b.idunico);
  });

  if (detalles.length === 0) {
    return `
      <div style="margin-top:12px; padding:14px; border:1px dashed #cbd5e1; border-radius:18px; background:#f8fafc; text-align:center;">

                    type="button"
                    className={`app-fab-action ${isSearchExpanded ? "dark" : ""}`}
                    title={isSearchExpanded ? "Cerrar buscador" : "Buscar material"}
                    onClick={toggleBuscador_}
                  >
                    <LocalIcon name={isSearchExpanded ? "x" : "search"} size={24} />
                  </button>

                  <button
                    type="button"
                    className="app-fab-action"
                    title="Actualizar monitor"
                    onClick={() => fetchDatabase("manual")}
                    disabled={loading}
                  >
                    <LocalIcon
                      name="refresh-cw"
                      size={24}
                      className={loading ? "text-[#d93025] animate-spin" : ""}
                    />
                  </button>

                  <button
                    type="button"
                    className="app-fab-action primary"
                    title="Exportar Excel"
                    onClick={exportarExcelCompleto}
                    disabled={loading || recordsFinal.length === 0}
                  >
                    <LocalIcon name="file-spreadsheet" size={24} />
                  </button>

                </div>
              )}

              
              <button
                type="button"
                className={`app-fab-main ${isFabMenuOpen ? "open" : ""}`}
                title={
                  isFabMenuOpen
                    ? "Cerrar acciones"
                    : `Abrir acciones • Balance: ${modoBalance === "IDUNICO" ? "ID único" : "Existencias"}`
                }
                onClick={(e) => {
                  e.stopPropagation();
                  toggleFabMenu_();
                }}
              >
                <LocalIcon name={isFabMenuOpen ? "x" : "ellipsis-vertical"} size={26} />
              </button>

            </div>
        </div>
      );
    };

    // =========================================================
    // CONTRATO CON EL SHELL
    // =========================================================
    const targetElement = document.getElementById('render-monitor-reabastecimiento');

    if (!targetElement) {
      notify_(
        "No se encontró el contenedor principal del monitor de reabastecimiento.",
        "error",
        4200,
        {
          title: "Error de interfaz",
          sound: true
        }
      );
      console.warn("⚠️ [MonitorReabastecimiento] No se encontró #render-monitor-reabastecimiento");
      return;
    }

    const yaInicializado = targetElement.dataset.mrMounted === "1";

    if (window.__MONITOR_REABASTECIMIENTO_ROOT__) {
      try {
        window.__MONITOR_REABASTECIMIENTO_ROOT__.unmount();
      } catch (e) {
        console.warn("⚠️ Instancia previa retenida en memoria, liberando recursos:", e);
        notifyOnceShell_(
          "monitor-reab-root-previo",
          "Se liberó una instancia previa del monitor de reabastecimiento.",
          "warning",
          1600,
          {
            title: "Reinicialización",
            sound: false
          },
          10000
        );
      }
      window.__MONITOR_REABASTECIMIENTO_ROOT__ = null;
    }

    try {
      targetElement.dataset.mrMounted = "1";
      window.__MONITOR_REABASTECIMIENTO_ROOT__ = ReactDOM.createRoot(targetElement);
      window.__MONITOR_REABASTECIMIENTO_ROOT__.render(<MonitorReabastecimientoDashboard />);

      if (!yaInicializado) {
        notifyOnceShell_(
          "monitor-reab-vista-montada",
          "Vista de reabastecimiento lista para operar.",
          "success",
          1500,
          {
            title: "Vista cargada",
            sound: false
          },
          12000
        );
      }
    } catch (e) {
      console.error("❌ [MonitorReabastecimiento] Error montando root React:", e);
      notify_(
        "Ocurrió un error al montar la vista de reabastecimiento.",
        "error",
        4200,
        {
          title: "Error de montaje",
          sound: true
        }
      );
    }
  };

  window.initVista = window.cargar_MonitorReabastecimiento;
  console.log("🧩 [MonitorReabastecimiento] Vista inyectable inicializada y registrada.");
</script>
