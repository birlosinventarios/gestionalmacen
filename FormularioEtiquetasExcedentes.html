<script>
  let colaDeImpresion = [];
  let listaCodigosGlobal = [];
  window.datosGlobales = [];   
  const MEDIDAS_FIJAS = { alto: 8, ancho: 12.5 }; igos

  /**
   * FUNCIÓN DE ENTRADA OBLIGATORIA PARA EL SISTEMA SPA
   * Esta función es llamada automáticamente por el cargador de vistas.
   */
  window.cargar_FormularioEtiquetasExcedentes = function() {
    console.log("🚀 Ejecutando inicialización de FormularioEtiquetasExcedentes...");
    lanzarNotificacion("Cargando catálogo...", "info");
    
    google.script.run
      .withSuccessHandler(function(datos) {
        console.log("📦 Datos recibidos del servidor:", datos); // Revisa esto en tu consola (F12)

        const dl = document.getElementById('listaCodigos');
        if (!dl) return;
        
        // Verificamos la estructura del objeto devuelto
        if (datos && datos.catalogo && Array.isArray(datos.catalogo)) {
          window.datosGlobales = datos.catalogo;
          listaCodigosGlobal = datos.catalogo.map(p => p.codigo);

          // Renderizado del datalist
          dl.innerHTML = datos.catalogo
            .map(c => `<option value="${c.codigo}">${c.desc}</option>`)
            .join('');

          console.log("✅ Catálogo cargado con " + datos.catalogo.length + " items.");
          lanzarNotificacion("Sistema Listo", "success");
        } else {
          console.error("❌ El servidor no envió la propiedad 'catalogo' o no es un array.");
          lanzarNotificacion("Error: Catálogo vacío o malformado", "error");
        }
      })
      .withFailureHandler(function(err) {
        console.error("❌ Error crítico al llamar a obtenerMegaDataInicial:", err);
        lanzarNotificacion("Error de conexión", "error");
      })
      .obtenerMegaDataInicial(); 
  };

  // Intentar ejecutar de inmediato por si se carga fuera del SPA o el evento ya pasó
  (function() {
    if (typeof window.cargar_FormularioEtiquetasExcedentes === "function") {
       // Esperamos un momento para que el DOM se asiente
       setTimeout(window.cargar_FormularioEtiquetasExcedentes, 100);
    }
  })();

  function buscarPorCodigo() {
    const codInput = document.getElementById('codigoInput');
    const cod = codInput.value.trim().toUpperCase();
    if (!cod) return;

    // Validación rápida local
    if (!listaCodigosGlobal.includes(cod)) {
      lanzarNotificacion(`⚠️ El código "${cod}" no existe en el catálogo`, "error");
      limpiarCampos();
      return;
    }

    const producto = window.datosGlobales.find(p => p.codigo.toUpperCase() === cod);

    if (producto) {
      document.getElementById('descripcionInput').value = producto.desc || "Sin descripción";
      document.getElementById('idInput').value = producto.id || "N/A"; 
      codInput.value = cod; 
    }
  }

  function agregarALista() {
    const cod = document.getElementById('codigoInput').value.trim().toUpperCase();
    const desc = document.getElementById('descripcionInput').value;
    const cant = document.getElementById('cantidadInput').value;
    const idProducto = document.getElementById('idInput').value;
    const numCajas = parseInt(document.getElementById('cajasInput').value) || 1;

    if (!listaCodigosGlobal.includes(cod)) {
      lanzarNotificacion("⚠️ Código no válido", "error");
      return;
    }

    if (!idProducto || idProducto === "Buscando..." || !cant || cant <= 0) {
      lanzarNotificacion("⚠️ Verifica ID y Cantidad", "error");
      return;
    }

    const ahora = new Date();
    const pad = (n) => n.toString().padStart(2, '0');
    const marcaBase = ahora.getFullYear() + pad(ahora.getMonth() + 1) + pad(ahora.getDate()) + 
                      pad(ahora.getHours()) + pad(ahora.getMinutes()) + pad(ahora.getSeconds());

    for (let i = 1; i <= numCajas; i++) {
      colaDeImpresion.push({ 
        codigo: cod, 
        descripcion: desc, 
        cantidad: cant,
        id: idProducto,
        idUnico: `${marcaBase}${idProducto}${i}`,
        cajaNo: i,
        totalCajas: numCajas,
        fecha: ahora.toLocaleDateString(),
        ...MEDIDAS_FIJAS 
      });
    }

    actualizarVista();
    resetearFormularioCompleto();
    lanzarNotificacion(`✅ ${numCajas} etiquetas en fila`);
  }

  function actualizarVista() {
    const listaUI = document.getElementById('listaEtiquetas');
    const btnPrint = document.getElementById('btnImprimirTodo');
    const txtBtn = document.getElementById('textoBoton'); 
    const badge = document.getElementById('contador'); 
    const plantilla = document.getElementById('plantillaExcedente').innerHTML;
    
    const total = colaDeImpresion.length;
    if (badge) badge.innerText = total;

    listaUI.innerHTML = "";
    colaDeImpresion.forEach((item, index) => {
      let html = plantilla
        .replace(/{{INDEX}}/g, index)
        .replace("{{CODIGO}}", item.codigo)
        .replace("{{DESCRIPCION}}", item.descripcion)
        .replace("{{FOLIO}}", item.idUnico)
        .replace("{{CANTIDAD}}", item.cantidad)
        .replace("{{CAJA_NO}}", item.cajaNo)
        .replace("{{TOTAL_CAJAS}}", item.totalCajas);
      listaUI.insertAdjacentHTML('beforeend', html);
    });

    btnPrint.style.display = total > 0 ? "flex" : "none";
    if (total > 0) txtBtn.innerText = `Imprimir Lote (${total})`;
  }

  function quitar(index) {
    colaDeImpresion.splice(index, 1);
    actualizarVista();
  }

  function limpiarCampos() {
    document.getElementById('codigoInput').value = "";
    document.getElementById('descripcionInput').value = "";
    document.getElementById('idInput').value = "";
  }

  function resetearFormularioCompleto() {
    limpiarCampos();
    document.getElementById('cantidadInput').value = "";
    document.getElementById('cajasInput').value = "1";
    document.getElementById('codigoInput').focus();
  }

  function lanzarNotificacion(msg, tipo = 'success') {
    const x = document.getElementById("snackbar");
    if(!x) return;
    x.innerText = msg;
    x.className = "show " + tipo;
    setTimeout(() => { x.className = x.className.replace("show", ""); }, 2500);
  }

  function generar() {
    if (colaDeImpresion.length === 0) return;

    const btn = document.getElementById('btnImprimirTodo');
    const txt = document.getElementById('textoBoton');
    btn.disabled = true;
    txt.innerText = "⏳ Generando...";

    const win = window.open("", "_blank");
    if (!win) {
      alert("Permite los pop-ups para imprimir.");
      btn.disabled = false;
      return;
    }

    google.script.run
      .withSuccessHandler(function(html) {
        win.document.open();
        win.document.write(html);
        win.document.close();
        colaDeImpresion = [];
        actualizarVista();
        btn.disabled = false;
        txt.innerText = "Imprimir";
      })
      .withFailureHandler(function(err) {
        win.close();
        alert("Error: " + err);
        btn.disabled = false;
      })
      .procesarLoteEtiquetasExcedentes(colaDeImpresion);
  }
</script>
