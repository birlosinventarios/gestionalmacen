<script>
(function () {
  // =========================================================
  // ESTADO SEGURO DE LA VISTA
  // =========================================================
  window.FormularioEtiquetasExcedentesState = window.FormularioEtiquetasExcedentesState || {
    listaCodigos: [],
    mapaCatalogo: {},
    snackbarTimeout: null,
    medidasFijas: { alto: 8, ancho: 12.5 }
  };

  window.colaDeImpresionExcedentes = window.colaDeImpresionExcedentes || [];

  const state = window.FormularioEtiquetasExcedentesState;

  // =========================================================
  // HELPERS INTERNOS
  // =========================================================
  function normalizarTexto(valor) {
    return String(valor || "").trim().toUpperCase();
  }

  function lanzarNotificacionLocal(msg, tipo = 'success') {
    if (typeof window.notificar === 'function') {
      window.notificar(msg, tipo);
      return;
    }

    const x = document.getElementById("snackbar");
    if (!x) return;

    if (state.snackbarTimeout) {
      clearTimeout(state.snackbarTimeout);
    }

    x.innerText = msg;
    x.className = "show " + tipo;
    x.style.visibility = "visible";
    x.style.opacity = "1";

    const cerrar = function () {
      x.style.opacity = "0";
      setTimeout(() => {
        x.className = "";
        x.style.visibility = "hidden";
      }, 300);
    };

    state.snackbarTimeout = setTimeout(cerrar, 2000);
    x.onclick = cerrar;
  }

  function bindOnce(el, key, eventName, handler) {
    if (!el) return;
    const flag = `bound_${key}`;
    if (el.dataset[flag]) return;

    el.addEventListener(eventName, handler);
    el.dataset[flag] = "1";
  }

  function limpiarCamposInterno() {
    const codigoInput = document.getElementById('codigoInput');
    const descripcionInput = document.getElementById('descripcionInput');
    const idInput = document.getElementById('idInput');

    if (codigoInput) codigoInput.value = "";
    if (descripcionInput) descripcionInput.value = "";
    if (idInput) idInput.value = "";
    if (codigoInput) codigoInput.focus();
  }

  function resetearFormularioCompletoInterno() {
    limpiarCamposInterno();

    const cajasInput = document.getElementById('cajasInput');
    const cantidadInput = document.getElementById('cantidadInput');

    if (cajasInput) cajasInput.value = "1";
    if (cantidadInput) cantidadInput.value = "";
  }

  function poblarDatalistExcedentes_() {
    console.log("🧾 [Excedentes] poblarDatalistExcedentes_()");
    console.log("🧾 [Excedentes] listaCodigos total:", state.listaCodigos.length);

    const dlCodigos = document.getElementById('listaCodigos');
    if (!dlCodigos) {
      console.warn("⚠️ [Excedentes] No se encontró el datalist #listaCodigos");
      return;
    }

    dlCodigos.innerHTML = state.listaCodigos
      .map(c => `<option value="${c}">`)
      .join('');

    console.log("✅ [Excedentes] Datalist de códigos poblado correctamente");

    if (window.colaDeImpresionExcedentes && window.colaDeImpresionExcedentes.length > 0) {
      actualizarVista();
    }
  }

  function hidratarDesdeCache_(cache) {
    state.listaCodigos = cache.codigos || [];
    state.mapaCatalogo = cache.mapaCatalogo || cache.mapaProductos || {};
  }

  function guardarEnCacheGlobal_() {
    window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || {};
    window.DATA_ALMACEN_CACHE.codigos = state.listaCodigos || [];
    window.DATA_ALMACEN_CACHE.mapaCatalogo = state.mapaCatalogo || {};
  }

  function validarCodigoEstrictoInterno() {
    const input = document.getElementById('codigoInput');
    if (!input) return false;

    const valor = normalizarTexto(input.value);
    if (valor === "") return false;

    const existe = state.listaCodigos.some(item => normalizarTexto(item) === valor);

    if (!existe) {
      lanzarNotificacionLocal(`⚠️ El código "${valor}" no es válido.`, "error");
      limpiarCamposInterno();
      return false;
    }

    return true;
  }

  function bloquearScrollNumericoInterno(idInput) {
    const input = document.getElementById(idInput);
    if (!input) return;

    bindOnce(input, `wheel_${idInput}`, 'wheel', function (e) {
      e.preventDefault();
    });
  }

  function vincularEventosDOMExcedentes_() {
    const codigoInput = document.getElementById('codigoInput');
    const cajasInput = document.getElementById('cajasInput');
    const cantidadInput = document.getElementById('cantidadInput');

    bindOnce(codigoInput, 'validarCodigoChange', 'change', function () {
      validarCodigoEstrictoInterno();
    });

    bindOnce(cantidadInput, 'enterCantidad', 'keypress', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        agregarALista();
      }
    });

    bloquearScrollNumericoInterno('cajasInput');
    bloquearScrollNumericoInterno('cantidadInput');

    bindOnce(cajasInput, 'blurCajas', 'blur', function () {
      const n = parseInt(this.value, 10);
      if (!n || n < 1) this.value = "1";
    });
  }

  // =========================================================
  // INIT DE VISTA
  // =========================================================
  window.inicializarVistaEtiquetasExcedentes = function () {
    console.log("📦 [Excedentes] Inicializando vista...");
    console.log("📦 [Excedentes] DATA_ALMACEN_CACHE:", window.DATA_ALMACEN_CACHE);

    vincularEventosDOMExcedentes_();

    const cache = window.DATA_ALMACEN_CACHE || {};
    const cacheCompleta =
      Array.isArray(cache.codigos) &&
      cache.codigos.length > 0 &&
      (
        (cache.mapaCatalogo && Object.keys(cache.mapaCatalogo).length > 0) ||
        (cache.mapaProductos && Object.keys(cache.mapaProductos).length > 0)
      );

    // 1) Cache global completa
    if (cacheCompleta) {
      console.log("⚡ [Excedentes] Cargando datos desde DATA_ALMACEN_CACHE...");
      hidratarDesdeCache_(cache);
      poblarDatalistExcedentes_();
      lanzarNotificacionLocal("Sistema listo", "success");
      return;
    }

    // 2) Memoria local
    if (state.listaCodigos.length > 0 && Object.keys(state.mapaCatalogo).length > 0) {
      console.log("⚡ [Excedentes] Reutilizando datos ya cargados en memoria local...");
      poblarDatalistExcedentes_();
      lanzarNotificacionLocal("Sistema listo", "success");
      return;
    }

    // 3) Fallback al nuevo controller
    console.warn("⚠️ [Excedentes] La cache no tiene datos suficientes. Solicitando bootstrap específico...");

    google.script.run
      .withSuccessHandler(function (data) {
        console.log("✅ [Excedentes] Bootstrap recibido:", data);

        state.listaCodigos = data.codigos || [];
        state.mapaCatalogo = data.mapaCatalogo || {};

        guardarEnCacheGlobal_();
        poblarDatalistExcedentes_();

        lanzarNotificacionLocal("✅ Datos de excedentes cargados", "success");
      })
      .withFailureHandler(function (err) {
        console.error("❌ [Excedentes] Error cargando bootstrap:", err);
        lanzarNotificacionLocal("❌ No se pudo cargar la información inicial de excedentes", "error");
      })
      .FormularioEtiquetasExcedentesController_getBootstrap();
  };

  window.initVista = window.inicializarVistaEtiquetasExcedentes;
  console.log("🧩 [Excedentes] initVista definida:", typeof window.initVista);

  // =========================================================
  // FUNCIONES PÚBLICAS PARA HTML INLINE
  // =========================================================
  window.buscarPorCodigo = function () {
    const cod = normalizarTexto(document.getElementById('codigoInput')?.value);
    if (!cod) return;

    if (!state.listaCodigos.includes(cod)) {
      return;
    }

    const descripcionInput = document.getElementById('descripcionInput');
    const idInput = document.getElementById('idInput');

    if (descripcionInput) descripcionInput.value = "Buscando...";
    if (idInput) idInput.value = "Buscando...";

    // Primero intenta local
    const productoLocal = state.mapaCatalogo[cod];
    if (productoLocal) {
      if (descripcionInput) descripcionInput.value = productoLocal.descripcion || "";
      if (idInput) idInput.value = productoLocal.idproducto || "N/A";
      const codigoInput = document.getElementById('codigoInput');
      if (codigoInput) codigoInput.value = cod;
      return;
    }

    // Fallback al controller nuevo
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.encontrado) {
          if (descripcionInput) descripcionInput.value = res.descripcion || "";
          if (idInput) idInput.value = res.idproducto || res.id || "N/A";
          const codigoInput = document.getElementById('codigoInput');
          if (codigoInput) codigoInput.value = cod;
        } else {
          lanzarNotificacionLocal("❌ Error interno: Código no encontrado en detalles", "error");
          limpiarCamposInterno();
        }
      })
      .withFailureHandler(function (err) {
        console.error("❌ Error buscando producto de excedentes:", err);
        lanzarNotificacionLocal("❌ Error al buscar el producto", "error");
        limpiarCamposInterno();
      })
      .FormularioEtiquetasExcedentesController_buscarProductoPorCodigo(cod);
  };

  window.agregarALista = function () {
    const codigoInput = document.getElementById('codigoInput');
    const descripcionInput = document.getElementById('descripcionInput');
    const cantidadInput = document.getElementById('cantidadInput');
    const idInput = document.getElementById('idInput');
    const cajasInput = document.getElementById('cajasInput');

    const cod = normalizarTexto(codigoInput?.value);
    const desc = descripcionInput?.value || "";
    const cant = cantidadInput?.value;
    const idProducto = idInput?.value || "";
    const numCajas = parseInt(cajasInput?.value, 10) || 1;

    if (!state.listaCodigos.includes(cod)) {
      lanzarNotificacionLocal("⚠️ El código no es válido o no ha sido seleccionado de la lista", "error");
      if (codigoInput) codigoInput.focus();
      return;
    }

    if (!idProducto || idProducto === "Buscando..." || !desc || desc === "Buscando...") {
      lanzarNotificacionLocal("⏳ Por favor, espera a que carguen los datos del producto", "error");
      return;
    }

    if (!cant || Number(cant) <= 0) {
      lanzarNotificacionLocal("⚠️ Ingresa una cantidad de piezas válida", "error");
      if (cantidadInput) cantidadInput.focus();
      return;
    }

    if (numCajas <= 0) {
      lanzarNotificacionLocal("⚠️ El número de cajas debe ser mayor a cero", "error");
      if (cajasInput) cajasInput.focus();
      return;
    }

    const ahora = new Date();
    const pad = (n) => n.toString().padStart(2, '0');
    const marcaTiempoBase =
      ahora.getFullYear() +
      pad(ahora.getMonth() + 1) +
      pad(ahora.getDate()) +
      pad(ahora.getHours()) +
      pad(ahora.getMinutes()) +
      pad(ahora.getSeconds());

    for (let i = 1; i <= numCajas; i++) {
      const folioGenerado = `${marcaTiempoBase}${idProducto}${i}`;

      window.colaDeImpresionExcedentes.push({
        codigo: cod,
        descripcion: desc,
        cantidad: cant,
        id: idProducto,
        idUnico: folioGenerado,
        cajaNo: i,
        totalCajas: numCajas,
        fecha: ahora.toLocaleDateString(),
        ...state.medidasFijas
      });
    }

    actualizarVista();
    resetearFormularioCompletoInterno();
    lanzarNotificacionLocal(`✅ ${numCajas} etiquetas listas en la fila`, "success");
  };

  window.actualizarVista = function () {
    const listaUI = document.getElementById('listaEtiquetas');
    const btnPrint = document.getElementById('btnImprimirTodo');
    const textoBoton = document.getElementById('textoBoton');
    const contadorBadge = document.getElementById('contador');
    const plantillaEl = document.getElementById('plantillaExcedente');

    if (!listaUI || !btnPrint || !textoBoton || !contadorBadge || !plantillaEl) return;

    const plantilla = plantillaEl.innerHTML;
    const cantidadItems = window.colaDeImpresionExcedentes.length;

    contadorBadge.innerText = cantidadItems;
    contadorBadge.style.background = cantidadItems > 0 ? "var(--primary)" : "#ccc";

    listaUI.innerHTML = "";

    window.colaDeImpresionExcedentes.forEach((item, index) => {
      const htmlFila = plantilla
        .replace(/{{INDEX}}/g, index)
        .replace("{{CODIGO}}", item.codigo)
        .replace("{{DESCRIPCION}}", item.descripcion)
        .replace("{{FOLIO}}", item.idUnico)
        .replace("{{CANTIDAD}}", item.cantidad)
        .replace("{{CAJA_NO}}", item.cajaNo)
        .replace("{{TOTAL_CAJAS}}", item.totalCajas);

      listaUI.insertAdjacentHTML('beforeend', htmlFila);
    });

    if (cantidadItems > 0) {
      btnPrint.classList.add('visible');
      textoBoton.innerText = `Imprimir Lote (${cantidadItems})`;
    } else {
      btnPrint.classList.remove('visible');
      textoBoton.innerText = "Imprimir";
    }
  };

  window.quitar = function (index) {
    window.colaDeImpresionExcedentes.splice(index, 1);
    actualizarVista();
  };

  window.limpiarCampos = function () {
    limpiarCamposInterno();
  };

  window.resetearFormularioCompleto = function () {
    resetearFormularioCompletoInterno();
  };

  window.generar = function () {
    if (window.colaDeImpresionExcedentes.length === 0) {
      lanzarNotificacionLocal("⚠️ La fila está vacía", "error");
      return;
    }

    const btn = document.getElementById('btnImprimirTodo');
    const textoBoton = document.getElementById('textoBoton');

    if (!btn || !textoBoton) return;

    btn.disabled = true;
    textoBoton.innerText = "⏳ Generando...";

    const win = window.open("", "_blank");
    if (!win) {
      lanzarNotificacionLocal("⚠️ Ventana bloqueada. Permite los pop-ups.", "warning");
      btn.disabled = false;
      textoBoton.innerText = "Imprimir";
      return;
    }

    win.document.write(`
      <html>
        <head>
          <title>Generando Etiquetas...</title>
          <style>
            body { 
              font-family: sans-serif; 
              display: flex; 
              flex-direction: column; 
              align-items: center; 
              justify-content: center; 
              height: 100vh; 
              margin: 0; 
              color: #5f6368; 
              background-color: #f8f9fa; 
            }
            .spinner { 
              width: 50px; 
              height: 50px; 
              border: 5px solid #f3f3f3; 
              border-top: 5px solid #d93025; 
              border-radius: 50%; 
              animation: spin 1s linear infinite; 
              margin-bottom: 20px; 
            }
            @keyframes spin { 
              0% { transform: rotate(0deg); } 
              100% { transform: rotate(360deg); } 
            }
            h3 { font-weight: 400; }
          </style>
        </head>
        <body>
          <div class="spinner"></div>
          <h3>Preparando etiquetas de excedentes...</h3>
          <p>Guardando en base de datos y generando vista.</p>
        </body>
      </html>
    `);
    win.document.close();

    google.script.run
      .withSuccessHandler(function (htmlGenerado) {
        win.document.open();
        win.document.write(htmlGenerado);
        win.document.close();

        window.colaDeImpresionExcedentes = [];
        actualizarVista();
        resetearFormularioCompletoInterno();

        btn.disabled = false;
        textoBoton.innerText = "Imprimir";

        lanzarNotificacionLocal("✅ Etiquetas generadas con éxito", "success");
      })
      .withFailureHandler(function (err) {
        win.close();
        console.error("❌ Error en el servidor al generar excedentes:", err);

        btn.disabled = false;
        textoBoton.innerText = "Imprimir";

        lanzarNotificacionLocal("❌ Error al generar etiquetas de excedentes", "error");
      })
      .FormularioEtiquetasExcedentesController_procesarLote(window.colaDeImpresionExcedentes);
  };

  window.validarCodigoEstricto = function () {
    return validarCodigoEstrictoInterno();
  };

  // Compatibilidad si el shell la busca
  window.lanzarNotificacion = window.lanzarNotificacion || lanzarNotificacionLocal;

  // =========================================================
  // FALLBACK SI LA VISTA SE ABRE SOLA
  // =========================================================
  if (!window.DATA_ALMACEN_CACHE) {
    setTimeout(() => {
      if (typeof window.inicializarVistaEtiquetasExcedentes === 'function') {
        window.inicializarVistaEtiquetasExcedentes();
      }
    }, 100);
  }
})();
</script>
