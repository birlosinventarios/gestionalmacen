<script>
(function () {
  // =========================================================
  // ESTADO SEGURO DE LA VISTA
  // =========================================================
  window.FormularioEtiquetasExcedentesState = window.FormularioEtiquetasExcedentesState || {
    listaCodigos: [],
    mapaCatalogo: {},
    snackbarTimeout: null,
    medidasFijas: { alto: 8, ancho: 12.5 },
    lastNotifyAt: {}
  };

  window.colaDeImpresionExcedentes = window.colaDeImpresionExcedentes || [];

  const state = window.FormularioEtiquetasExcedentesState;

  // =========================================================
  // HELPERS DE NOTIFICACIÓN
  // =========================================================
  function notify_(mensaje, tipo = 'info', timer = 2500, options = {}) {
    const fn = window.notificar || window.lanzarNotificacion;

    if (typeof fn === 'function') {
      fn(mensaje, tipo, timer, options);
      return;
    }

    // Fallback local solo si la vista vive fuera del shell
    const x = document.getElementById("snackbar");
    if (!x) return;

    if (state.snackbarTimeout) {
      clearTimeout(state.snackbarTimeout);
    }

    x.innerText = mensaje;
    x.className = "show " + tipo;
    x.style.visibility = "visible";
    x.style.opacity = "1";

    const cerrar = function () {
      x.style.opacity = "0";
      setTimeout(() => {
        x.className = "";
        x.style.visibility = "hidden";
      }, 300);
    };

    state.snackbarTimeout = setTimeout(cerrar, Math.min(timer, 1800));
    x.onclick = cerrar;
  }

  function notifyOnce_(key, mensaje, tipo = 'info', timer = 2500, options = {}, cooldown = 8000) {
    const now = Date.now();
    const last = state.lastNotifyAt[key] || 0;
    if (now - last < cooldown) return;
    state.lastNotifyAt[key] = now;
    notify_(mensaje, tipo, timer, options);
  }

  // =========================================================
  // HELPERS INTERNOS
  // =========================================================
  function normalizarTexto(valor) {
    return String(valor || "").trim().toUpperCase();
  }

  function getViewRoot_() {
    return document.querySelector('.container');
  }

  function existeCodigo_(codigoNormalizado) {
    return (state.listaCodigos || []).some(item => normalizarTexto(item) === codigoNormalizado);
  }

  function obtenerProductoLocal_(codigoNormalizado) {
    if (state.mapaCatalogo[codigoNormalizado]) return state.mapaCatalogo[codigoNormalizado];

    const claveReal = Object.keys(state.mapaCatalogo || {}).find(
      key => normalizarTexto(key) === codigoNormalizado
    );

    return claveReal ? state.mapaCatalogo[claveReal] : null;
  }

  function bindOnce(el, key, eventName, handler) {
    if (!el) return;
    const flag = `bound_${key}`;
    if (el.dataset[flag]) return;

    el.addEventListener(eventName, handler);
    el.dataset[flag] = "1";
  }

  function limpiarCamposInterno() {
    const codigoInput = document.getElementById('codigoInput');
    const descripcionInput = document.getElementById('descripcionInput');
    const idInput = document.getElementById('idInput');

    if (codigoInput) codigoInput.value = "";
    if (descripcionInput) descripcionInput.value = "";
    if (idInput) idInput.value = "";
    if (codigoInput) codigoInput.focus();
  }

  function resetearFormularioCompletoInterno() {
    limpiarCamposInterno();

    const cajasInput = document.getElementById('cajasInput');
    const cantidadInput = document.getElementById('cantidadInput');

    if (cajasInput) cajasInput.value = "1";
    if (cantidadInput) cantidadInput.value = "";
  }

  function poblarDatalistExcedentes_() {
    console.log("🧾 [Excedentes] poblarDatalistExcedentes_()");
    console.log("🧾 [Excedentes] listaCodigos total:", state.listaCodigos.length);

    const dlCodigos = document.getElementById('listaCodigos');
    if (!dlCodigos) {
      console.warn("⚠️ [Excedentes] No se encontró el datalist #listaCodigos");
      return;
    }

    dlCodigos.innerHTML = state.listaCodigos
      .map(c => `<option value="${c}">`)
      .join('');

    console.log("✅ [Excedentes] Datalist de códigos poblado correctamente");

    if (window.colaDeImpresionExcedentes && window.colaDeImpresionExcedentes.length > 0) {
      actualizarVista();
    }
  }

  function hidratarDesdeCache_(cache) {
    state.listaCodigos = cache.codigos || [];
    state.mapaCatalogo = cache.mapaCatalogo || cache.mapaProductos || {};
  }

  function guardarEnCacheGlobal_() {
    window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || {};
    window.DATA_ALMACEN_CACHE.codigos = state.listaCodigos || [];
    window.DATA_ALMACEN_CACHE.mapaCatalogo = state.mapaCatalogo || {};
  }

  function validarCodigoEstrictoInterno() {
    const input = document.getElementById('codigoInput');
    if (!input) return false;

    const valor = normalizarTexto(input.value);
    if (valor === "") return false;

    const existe = existeCodigo_(valor);

    if (!existe) {
      notify_(
        `El código "${valor}" no es válido.`,
        "error",
        3200,
        {
          title: "Código no permitido",
          sound: true
        }
      );
      limpiarCamposInterno();
      return false;
    }

    return true;
  }

  function bloquearScrollNumericoInterno(idInput) {
    const input = document.getElementById(idInput);
    if (!input) return;

    bindOnce(input, `wheel_${idInput}`, 'wheel', function (e) {
      e.preventDefault();
    });
  }

  function vincularEventosDOMExcedentes_() {
    const codigoInput = document.getElementById('codigoInput');
    const cajasInput = document.getElementById('cajasInput');
    const cantidadInput = document.getElementById('cantidadInput');

    bindOnce(codigoInput, 'validarCodigoChange', 'change', function () {
      validarCodigoEstrictoInterno();
    });

    bindOnce(cantidadInput, 'enterCantidad', 'keypress', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        agregarALista();
      }
    });

    bloquearScrollNumericoInterno('cajasInput');
    bloquearScrollNumericoInterno('cantidadInput');

    bindOnce(cajasInput, 'blurCajas', 'blur', function () {
      const n = parseInt(this.value, 10);
      if (!n || n < 1) this.value = "1";
    });
  }

  // =========================================================
  // INIT DE VISTA
  // =========================================================
  window.inicializarVistaEtiquetasExcedentes = function () {
    const root = getViewRoot_();

    if (root && root.dataset.feeInit === "1") {
      console.log("⏭️ [Excedentes] Inicialización omitida: esta instancia ya fue montada.");
      return;
    }

    if (root) {
      root.dataset.feeInit = "1";
    }

    console.log("📦 [Excedentes] Inicializando vista...");
    console.log("📦 [Excedentes] DATA_ALMACEN_CACHE:", window.DATA_ALMACEN_CACHE);

    notify_("Inicializando vista de etiquetas de excedentes...", "info", 1600, {
      title: "Cargando vista",
      sound: false
    });

    vincularEventosDOMExcedentes_();

    const cache = window.DATA_ALMACEN_CACHE || {};
    const cacheCompleta =
      Array.isArray(cache.codigos) &&
      cache.codigos.length > 0 &&
      (
        (cache.mapaCatalogo && Object.keys(cache.mapaCatalogo).length > 0) ||
        (cache.mapaProductos && Object.keys(cache.mapaProductos).length > 0)
      );

    // 1) Cache global completa
    if (cacheCompleta) {
      console.log("⚡ [Excedentes] Cargando datos desde DATA_ALMACEN_CACHE...");
      hidratarDesdeCache_(cache);
      poblarDatalistExcedentes_();

      notify_("Datos de excedentes cargados desde memoria local.", "success", 1800, {
        title: "Sistema listo",
        sound: false
      });
      return;
    }

    // 2) Memoria local
    if (state.listaCodigos.length > 0 && Object.keys(state.mapaCatalogo).length > 0) {
      console.log("⚡ [Excedentes] Reutilizando datos ya cargados en memoria local...");
      poblarDatalistExcedentes_();

      notify_("Datos reutilizados desde memoria local.", "success", 1800, {
        title: "Sistema listo",
        sound: false
      });
      return;
    }

    // 3) Fallback al controller nuevo
    console.warn("⚠️ [Excedentes] La cache no tiene datos suficientes. Solicitando bootstrap específico...");

    notify_("Solicitando catálogo de excedentes...", "info", 1800, {
      title: "Sincronización requerida",
      sound: false
    });

    google.script.run
      .withSuccessHandler(function (data) {
        console.log("✅ [Excedentes] Bootstrap recibido:", data);

        state.listaCodigos = data.codigos || [];
        state.mapaCatalogo = data.mapaCatalogo || {};

        guardarEnCacheGlobal_();
        poblarDatalistExcedentes_();

        notify_("Datos de excedentes cargados correctamente.", "success", 2200, {
          title: "Sistema listo",
          sound: false
        });
      })
      .withFailureHandler(function (err) {
        console.error("❌ [Excedentes] Error cargando bootstrap:", err);

        notify_(
          "No se pudo cargar la información inicial de excedentes.",
          "error",
          4200,
          {
            title: "Error de carga",
            sound: true
          }
        );
      })
      .FormularioEtiquetasExcedentesController_getBootstrap();
  };

  window.initVista = window.inicializarVistaEtiquetasExcedentes;
  console.log("🧩 [Excedentes] initVista definida:", typeof window.initVista);

  // =========================================================
  // FUNCIONES PÚBLICAS PARA HTML INLINE
  // =========================================================
  window.buscarPorCodigo = function () {
    const cod = normalizarTexto(document.getElementById('codigoInput')?.value);
    if (!cod) return;

    if (!existeCodigo_(cod)) {
      notify_(
        `El código "${cod}" no existe en el catálogo.`,
        "error",
        3200,
        {
          title: "Código inválido",
          sound: true
        }
      );
      limpiarCamposInterno();
      return;
    }

    const descripcionInput = document.getElementById('descripcionInput');
    const idInput = document.getElementById('idInput');

    if (descripcionInput) descripcionInput.value = "Buscando...";
    if (idInput) idInput.value = "Buscando...";

    // Primero intenta local
    const productoLocal = obtenerProductoLocal_(cod);
    if (productoLocal) {
      if (descripcionInput) descripcionInput.value = productoLocal.descripcion || "";
      if (idInput) idInput.value = productoLocal.idproducto || "N/A";

      notifyOnce_(
        "producto-excedente-local",
        "Producto localizado correctamente.",
        "success",
        1300,
        {
          title: "Código encontrado",
          sound: false
        },
        1200
      );
      return;
    }

    notify_("Consultando producto en el servidor...", "info", 1400, {
      title: "Buscando producto",
      sound: false
    });

    // Fallback al controller nuevo
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.encontrado) {
          if (descripcionInput) descripcionInput.value = res.descripcion || "";
          if (idInput) idInput.value = res.idproducto || res.id || "N/A";

          notify_("Producto localizado correctamente.", "success", 1400, {
            title: "Código encontrado",
            sound: false
          });
        } else {
          notify_(
            `El código "${cod}" no fue encontrado en los detalles del producto.`,
            "error",
            3200,
            {
              title: "Sin resultados",
              sound: true
            }
          );
          limpiarCamposInterno();
        }
      })
      .withFailureHandler(function (err) {
        console.error("❌ Error buscando producto de excedentes:", err);

        notify_(
          "Ocurrió un error al buscar el producto.",
          "error",
          4200,
          {
            title: "Error de búsqueda",
            sound: true
          }
        );
        limpiarCamposInterno();
      })
      .FormularioEtiquetasExcedentesController_buscarProductoPorCodigo(cod);
  };

  window.agregarALista = function () {
    const codigoInput = document.getElementById('codigoInput');
    const descripcionInput = document.getElementById('descripcionInput');
    const cantidadInput = document.getElementById('cantidadInput');
    const idInput = document.getElementById('idInput');
    const cajasInput = document.getElementById('cajasInput');

    const cod = normalizarTexto(codigoInput?.value);
    const desc = descripcionInput?.value || "";
    const cant = cantidadInput?.value;
    const idProducto = idInput?.value || "";
    const numCajas = parseInt(cajasInput?.value, 10) || 1;

    if (!existeCodigo_(cod)) {
      notify_(
        "El código no es válido o no fue seleccionado correctamente de la lista.",
        "error",
        3200,
        {
          title: "Código inválido",
          sound: true
        }
      );
      if (codigoInput) codigoInput.focus();
      return;
    }

    if (!idProducto || idProducto === "Buscando..." || !desc || desc === "Buscando...") {
      notify_(
        "Espera a que se carguen los datos completos del producto.",
        "warning",
        3000,
        {
          title: "Producto en carga",
          sound: true
        }
      );
      return;
    }

    if (!cant || Number(cant) <= 0) {
      notify_(
        "Ingresa una cantidad de piezas válida.",
        "error",
        3000,
        {
          title: "Cantidad inválida",
          sound: true
        }
      );
      if (cantidadInput) cantidadInput.focus();
      return;
    }

    if (numCajas <= 0) {
      notify_(
        "El número de cajas debe ser mayor a cero.",
        "error",
        3000,
        {
          title: "Número de cajas inválido",
          sound: true
        }
      );
      if (cajasInput) cajasInput.focus();
      return;
    }

    const ahora = new Date();
    const pad = (n) => n.toString().padStart(2, '0');
    const marcaTiempoBase =
      ahora.getFullYear() +
      pad(ahora.getMonth() + 1) +
      pad(ahora.getDate()) +
      pad(ahora.getHours()) +
      pad(ahora.getMinutes()) +
      pad(ahora.getSeconds());

    for (let i = 1; i <= numCajas; i++) {
      const folioGenerado = `${marcaTiempoBase}${idProducto}${i}`;

      window.colaDeImpresionExcedentes.push({
        codigo: cod,
        descripcion: desc,
        cantidad: cant,
        id: idProducto,
        idUnico: folioGenerado,
        cajaNo: i,
        totalCajas: numCajas,
        fecha: ahora.toLocaleDateString(),
        ...state.medidasFijas
      });
    }

    actualizarVista();
    resetearFormularioCompletoInterno();

    notify_(
      `${numCajas} etiqueta(s) de excedente se añadieron correctamente a la fila.`,
      "success",
      1800,
      {
        title: "Añadido a la fila",
        sound: false
      }
    );
  };

  window.actualizarVista = function () {
    const listaUI = document.getElementById('listaEtiquetas');
    const btnPrint = document.getElementById('btnImprimirTodo');
    const textoBoton = document.getElementById('textoBoton');
    const contadorBadge = document.getElementById('contador');
    const plantillaEl = document.getElementById('plantillaExcedente');

    if (!listaUI || !btnPrint || !textoBoton || !contadorBadge || !plantillaEl) return;

    const plantilla = plantillaEl.innerHTML;
    const cantidadItems = window.colaDeImpresionExcedentes.length;

    contadorBadge.innerText = cantidadItems;
    contadorBadge.style.background = cantidadItems > 0 ? "var(--primary)" : "#ccc";

    listaUI.innerHTML = "";

    window.colaDeImpresionExcedentes.forEach((item, index) => {
      const htmlFila = plantilla
        .replace(/{{INDEX}}/g, index)
        .replace("{{CODIGO}}", item.codigo)
        .replace("{{DESCRIPCION}}", item.descripcion)
        .replace("{{FOLIO}}", item.idUnico)
        .replace("{{CANTIDAD}}", item.cantidad)
        .replace("{{CAJA_NO}}", item.cajaNo)
        .replace("{{TOTAL_CAJAS}}", item.totalCajas);

      listaUI.insertAdjacentHTML('beforeend', htmlFila);
    });

    if (cantidadItems > 0) {
      btnPrint.classList.add('visible');
      textoBoton.innerText = `Imprimir Lote (${cantidadItems})`;
    } else {
      btnPrint.classList.remove('visible');
      textoBoton.innerText = "Imprimir";
    }
  };

  window.quitar = function (index) {
    window.colaDeImpresionExcedentes.splice(index, 1);
    actualizarVista();

    notify_("Etiqueta de excedente eliminada de la fila.", "warning", 1400, {
      title: "Elemento removido",
      sound: false
    });
  };

  window.limpiarCampos = function () {
    limpiarCamposInterno();

    notify_("Campos limpiados.", "info", 1200, {
      title: "Formulario limpio",
      sound: false
    });
  };

  window.resetearFormularioCompleto = function () {
    resetearFormularioCompletoInterno();

    notify_("Formulario restablecido.", "info", 1200, {
      title: "Formulario limpio",
      sound: false
    });
  };

  window.generar = function () {
    if (window.colaDeImpresionExcedentes.length === 0) {
      notify_(
        "La fila está vacía. Agrega etiquetas antes de imprimir.",
        "warning",
        3200,
        {
          title: "Fila vacía",
          sound: true
        }
      );
      return;
    }

    const btn = document.getElementById("btnImprimirTodo");
    const textoBoton = document.getElementById("textoBoton");

    if (!btn || !textoBoton) {
      notify_(
        "No se encontró el control de impresión en la vista.",
        "error",
        4200,
        {
          title: "Error de interfaz",
          sound: true
        }
      );
      return;
    }

    const modoImpresion =
      window.ImpresionModoUtilidades &&
      typeof window.ImpresionModoUtilidades.getMode === "function"
        ? window.ImpresionModoUtilidades.getMode()
        : "LOCAL";

    btn.disabled = true;
    textoBoton.innerText = "⏳ Generando...";

    notify_(
      modoImpresion === "ONLINE"
        ? "Preparando lote de excedentes para impresión ONLINE..."
        : "Preparando lote de excedentes para impresión LOCAL...",
      "info",
      1600,
      {
        title: "Generando etiquetas",
        sound: false
      }
    );

    let win = null;

    if (modoImpresion === "LOCAL") {
      win = window.open("", "_blank");

      if (!win) {
        notify_(
          "La ventana fue bloqueada. Permite los pop-ups para continuar.",
          "warning",
          4200,
          {
            title: "Pop-up bloqueado",
            sound: true
          }
        );

        btn.disabled = false;
        textoBoton.innerText = "Imprimir";
        return;
      }

      win.document.write(`
        <html>
          <head>
            <title>Generando etiquetas...</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                margin: 0;
                color: #5f6368;
                background-color: #f8f9fa;
              }

              .spinner {
                width: 50px;
                height: 50px;
                border: 5px solid #f3f3f3;
                border-top: 5px solid #d93025;
                border-radius: 50%;
                animation: spin 1s linear infinite;
                margin-bottom: 20px;
              }

              @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
              }

              .loader {
                text-align: center;
                max-width: 420px;
                padding: 0 24px;
              }

              .loader h3 {
                margin: 0 0 8px 0;
                font-size: 22px;
                font-weight: 700;
                color: #1c1d1f;
                letter-spacing: 0.04em;
              }

              .loader p {
                margin: 0;
                font-size: 14px;
                color: #5f6368;
                line-height: 1.5;
              }
            </style>
          </head>
          <body>
            <div class="spinner"></div>
            <div class="loader">
              <h3>Preparando etiquetas...</h3>
              <p>Espera un momento mientras se genera la impresión del excedente.</p>
            </div>
          </body>
        </html>
      `);

      win.document.close();
    }

    google.script.run
      .withSuccessHandler(function (resultado) {
        const res = typeof resultado === "string"
          ? {
              ok: true,
              htmlImpresion: resultado,
              printJob: null,
              legacy: true
            }
          : resultado;

        if (!res || !res.htmlImpresion) {
          if (win && !win.closed) {
            win.close();
          }

          btn.disabled = false;
          textoBoton.innerText = "Imprimir";

          notify_(
            "No se recibió una impresión válida desde el servidor.",
            "error",
            4200,
            {
              title: "Respuesta inválida",
              sound: true
            }
          );

          return;
        }

        if (modoImpresion === "ONLINE") {
          if (!res.printJob) {
            btn.disabled = false;
            textoBoton.innerText = "Imprimir";

            notify_(
              "No se recibió paquete ONLINE para imprimir.",
              "error",
              4200,
              {
                title: "Impresión ONLINE no disponible",
                sound: true
              }
            );

            return;
          }

          notify_("Enviando etiquetas de excedentes al PrintServer...", "info", 2200, {
            title: "Impresión ONLINE",
            sound: false
          });

          google.script.run
            .withSuccessHandler(function (respuestaOnline) {
              if (respuestaOnline && respuestaOnline.ok) {
                window.colaDeImpresionExcedentes = [];
                actualizarVista();
                resetearFormularioCompletoInterno();

                btn.disabled = false;
                textoBoton.innerText = "Imprimir";

                notify_("Etiquetas de excedentes enviadas correctamente por ONLINE.", "success", 3000, {
                  title: "Impresión ONLINE",
                  sound: true
                });

                return;
              }

              btn.disabled = false;
              textoBoton.innerText = "Imprimir";

              notify_(
                "El PrintServer respondió, pero no confirmó la impresión.",
                "warning",
                4200,
                {
                  title: "Impresión no confirmada",
                  sound: true
                }
              );
            })
            .withFailureHandler(function (errOnline) {
              console.error("❌ Error impresión ONLINE excedentes:", errOnline);

              btn.disabled = false;
              textoBoton.innerText = "Imprimir";

              notify_(
                errOnline && errOnline.message
                  ? errOnline.message
                  : "No se pudieron imprimir las etiquetas de excedentes por ONLINE.",
                "error",
                5200,
                {
                  title: "Error ONLINE",
                  sound: true
                }
              );
            })
            .ImpresionPuenteController_imprimir(res.printJob);

          return;
        }

        if (win && !win.closed) {
          win.document.open();
          win.document.write(res.htmlImpresion);
          win.document.close();
        }

        window.colaDeImpresionExcedentes = [];
        actualizarVista();
        resetearFormularioCompletoInterno();

        btn.disabled = false;
        textoBoton.innerText = "Imprimir";

        notify_("Etiquetas de excedentes generadas correctamente.", "success", 2400, {
          title: "Impresión LOCAL lista",
          sound: true
        });
      })
      .withFailureHandler(function (err) {
        if (win && !win.closed) {
          win.close();
        }

        console.error("❌ Error en el servidor al generar excedentes:", err);

        btn.disabled = false;
        textoBoton.innerText = "Imprimir";

        notify_(
          err && err.message
            ? err.message
            : "No se pudieron generar las etiquetas de excedentes.",
          "error",
          4200,
          {
            title: "Error de impresión",
            sound: true
          }
        );
      })
      .FormularioEtiquetasExcedentesController_procesarLote(window.colaDeImpresionExcedentes);
  };

  window.validarCodigoEstricto = function () {
    return validarCodigoEstrictoInterno();
  };

  // Compatibilidad si alguna parte vieja lo usa
  window.lanzarNotificacion = window.notificar || window.lanzarNotificacion || notify_;

  // No auto-init aquí.
  // El shell es quien llama window.initVista().
})();
</script>
