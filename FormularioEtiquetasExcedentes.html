<script type="text/babel">
  window.cargar_FormularioEtiquetasExcedentes = () => {
    const { useState, useEffect, useMemo, useRef } = React;

    const TIPO_ETIQUETA_FIJO = "EXCEDENTES";
    const ALTO_FIJO = 8;
    const ANCHO_FIJO = 12.5;

    const notify_ = (mensaje, tipo = "info", timer = 2500, options = {}) => {
      const fn = window.notificar || window.lanzarNotificacion;
      if (typeof fn === "function") {
        fn(mensaje, tipo, timer, options);
      }
    };

    const createNotifyOnce_ = (ref) => (key, mensaje, tipo = "info", timer = 2500, options = {}, cooldown = 8000) => {
      const now = Date.now();
      const last = ref.current[key] || 0;
      if (now - last < cooldown) return;
      ref.current[key] = now;
      notify_(mensaje, tipo, timer, options);
    };

    const shellNotifyStateRef = { current: {} };
    const notifyOnceShell_ = createNotifyOnce_(shellNotifyStateRef);

    const LocalIcon = ({ name, size = 18, className = "" }) => {
      const iconRef = useRef(null);

      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = "";
          const i = document.createElement("i");
          i.setAttribute("data-lucide", name.toLowerCase());
          i.style.width = `${size}px`;
          i.style.height = `${size}px`;
          if (className) i.className = className;
          iconRef.current.appendChild(i);
          window.lucide.createIcons();
        }
      }, [name, size, className]);

      return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
    };

    const VistaEtiquetasExcedentes = () => {
      const [cola, setCola] = useState([]);
      const [procesando, setProcesando] = useState(false);
      const [cargando, setCargando] = useState(true);

      const [mapaCatalogo, setMapaCatalogo] = useState({});
      const [codigos, setCodigos] = useState([]);

      const [form, setForm] = useState({
        codigo: "",
        descripcion: "",
        id: "",
        producto: null,
        cajas: "1",
        cantidad: ""
      });

      const codigoInputRef = useRef(null);
      const cantidadInputRef = useRef(null);
      const localNotifyRef = useRef({});
      const notifyOnce_ = createNotifyOnce_(localNotifyRef);

      const normalizarTexto = (valor) => String(valor || "").trim().toUpperCase();

      const enfocarCodigo = () => {
        setTimeout(() => {
          codigoInputRef.current?.focus();
          codigoInputRef.current?.select?.();
        }, 0);
      };

      const enfocarCantidad = () => {
        setTimeout(() => {
          cantidadInputRef.current?.focus();
          cantidadInputRef.current?.select?.();
        }, 0);
      };

      const limpiarCamposProducto = () => {
        setForm(prev => ({
          ...prev,
          codigo: "",
          descripcion: "",
          id: "",
          producto: null,
          cajas: "1",
          cantidad: ""
        }));

        enfocarCodigo();
      };

      const leerCacheExcedentes = () => {
        const cache = window.DATA_ALMACEN_CACHE || {};
        return {
          mapaCatalogo: cache.mapaCatalogo || cache.mapaProductos || {},
          codigos: cache.codigos || []
        };
      };

      const guardarBootstrapEnCache = (bootstrap) => {
        window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || {};

        if (bootstrap.codigos) {
          window.DATA_ALMACEN_CACHE.codigos = bootstrap.codigos;
        }

        if (bootstrap.mapaCatalogo) {
          window.DATA_ALMACEN_CACHE.mapaCatalogo = bootstrap.mapaCatalogo;
        }
      };

      const codigosSet = useMemo(() => {
        return new Set(codigos.map(x => normalizarTexto(x)).filter(Boolean));
      }, [codigos]);

      const codigosDisponibles = useMemo(() => {
        return codigos
          .map(c => normalizarTexto(c))
          .filter(Boolean);
      }, [codigos]);

      const resumenCola = useMemo(() => {
        return {
          total: cola.length,
          cajas: cola.length
        };
      }, [cola]);


      useEffect(() => {
        const cargarBootstrap = () => {
          try {
            notify_("Inicializando vista de etiquetas de excedentes...", "info", 1600, {
              title: "Cargando vista",
              sound: false
            });

            const cache = leerCacheExcedentes();

            if (
              Object.keys(cache.mapaCatalogo).length > 0 &&
              Array.isArray(cache.codigos) &&
              cache.codigos.length > 0
            ) {
              setMapaCatalogo(cache.mapaCatalogo);
              setCodigos(cache.codigos.map(x => normalizarTexto(x)));
              setCargando(false);

              notify_("Datos de excedentes cargados desde memoria local.", "success", 1800, {
                title: "Sistema listo",
                sound: false
              });

              return;
            }

            google.script.run
              .withSuccessHandler((data) => {
                const mapa = data?.mapaCatalogo || {};
                const listaCodigos = (data?.codigos || []).map(x => normalizarTexto(x));

                setMapaCatalogo(mapa);
                setCodigos(listaCodigos);

                guardarBootstrapEnCache({
                  mapaCatalogo: mapa,
                  codigos: listaCodigos
                });

                setCargando(false);

                notify_("Datos de excedentes cargados correctamente.", "success", 2200, {
                  title: "Sistema listo",
                  sound: false
                });
              })
              .withFailureHandler((err) => {
                console.error("❌ [Excedentes] Error cargando bootstrap:", err);
                setCargando(false);

                notify_(
                  "No se pudo cargar la información inicial de excedentes.",
                  "error",
                  4200,
                  {
                    title: "Error de carga",
                    sound: true
                  }
                );
              })
              .FormularioEtiquetasExcedentesController_getBootstrap();

          } catch (err) {
            console.error("❌ [Excedentes] Error inesperado:", err);
            setCargando(false);

            notify_(
              "No se pudo inicializar la vista de excedentes.",
              "error",
              4200,
              {
                title: "Error inesperado",
                sound: true
              }
            );
          }
        };

        cargarBootstrap();
      }, []);

      useEffect(() => {
        if (!cargando && !procesando) {
          enfocarCodigo();
        }
      }, [cargando, procesando]);

      useEffect(() => {
        const root = document.getElementById("render-etiquetas-excedentes");
        if (!root) return;

        const parent = root.parentElement;
        if (!parent) return;

        const previousOverflow = parent.style.overflow;
        const previousMinHeight = parent.style.minHeight;
        const previousHeight = parent.style.height;

        parent.style.overflow = "hidden";
        parent.style.minHeight = "0";

        if (!parent.style.height) {
          parent.style.height = "100%";
        }

        return () => {
          parent.style.overflow = previousOverflow;
          parent.style.minHeight = previousMinHeight;
          parent.style.height = previousHeight;
        };
      }, []);

      const resolverCodigo = (codigoParam) => {
        const codigo = normalizarTexto(codigoParam);

        if (!codigo) {
          setForm(prev => ({
            ...prev,
            codigo: "",
            descripcion: "",
            id: "",
            producto: null
          }));
          return;
        }

        if (!codigosSet.has(codigo)) {
          notify_(
            `El código "${codigo}" no existe en el catálogo.`,
            "error",
            3200,
            {
              title: "Código inválido",
              sound: true
            }
          );

          setForm(prev => ({
            ...prev,
            codigo,
            descripcion: "",
            id: "",
            producto: null
          }));

          return;
        }

        const producto = mapaCatalogo[codigo];

        if (producto) {
          setForm(prev => ({
            ...prev,
            codigo,
            descripcion: producto.descripcion || "",
            id: producto.idproducto || producto.id || "",
            producto
          }));

          notifyOnce_(
            `producto-excedente-${codigo}`,
            "Producto localizado correctamente.",
            "success",
            1300,
            {
              title: "Código encontrado",
              sound: false
            },
            1200
          );

          enfocarCantidad();
          return;
        }

        notify_("Consultando producto en el servidor...", "info", 1400, {
          title: "Buscando producto",
          sound: false
        });

        google.script.run
          .withSuccessHandler((res) => {
            if (!res || !res.encontrado) {
              notify_(
                `El código "${codigo}" no fue encontrado.`,
                "error",
                3200,
                {
                  title: "Sin resultados",
                  sound: true
                }
              );

              setForm(prev => ({
                ...prev,
                descripcion: "",
                id: "",
                producto: null
              }));

              return;
            }

            const productoFallback = {
              idproducto: res.idproducto || res.id || "",
              codigo,
              descripcion: res.descripcion || "",
              status: res.status || ""
            };

            setMapaCatalogo(prev => ({
              ...prev,
              productoFallback
            }));

            setForm(prev => ({
              ...prev,
              codigo,
              descripcion: productoFallback.descripcion,
              id: productoFallback.idproducto,
              producto: productoFallback
            }));

            notify_("Producto localizado correctamente.", "success", 1400, {
              title: "Código encontrado",
              sound: false
            });

            enfocarCantidad();
          })
          .withFailureHandler((err) => {
            console.error("❌ Error buscando producto de excedentes:", err);

            notify_(
              "Ocurrió un error al buscar el producto.",
              "error",
              4200,
              {
                title: "Error de búsqueda",
                sound: true
              }
            );
          })
          .FormularioEtiquetasExcedentesController_buscarProductoPorCodigo(codigo);
      };

      const handleCodigoChange = (e) => {
        const valor = normalizarTexto(e.target.value);

        setForm(prev => ({
          ...prev,
          codigo: valor,
          descripcion: "",
          id: "",
          producto: null
        }));

        const producto = mapaCatalogo[valor];

        if (producto) {
          setForm(prev => ({
            ...prev,
            codigo: valor,
            descripcion: producto.descripcion || "",
            id: producto.idproducto || producto.id || "",
            producto
          }));
        }
      };

      const handleCajasChange = (valor) => {
        const limpio = String(valor || "").replace(/[^\d]/g, "");
        setForm(prev => ({
          ...prev,
          cajas: limpio
        }));
      };

      const handleCantidadChange = (valor) => {
        setForm(prev => ({
          ...prev,
          cantidad: valor
        }));
      };

      const generarMarcaTiempo = () => {
        const ahora = new Date();
        const pad = (n) => String(n).padStart(2, "0");

        return (
          ahora.getFullYear() +
          pad(ahora.getMonth() + 1) +
          pad(ahora.getDate()) +
          pad(ahora.getHours()) +
          pad(ahora.getMinutes()) +
          pad(ahora.getSeconds()) +
          String(ahora.getMilliseconds()).padStart(3, "0")
        );
      };

      const handleAdd = (e) => {
        if (e && typeof e.preventDefault === "function") {
          e.preventDefault();
        }

        const codigo = normalizarTexto(form.codigo);
        const cantidad = Number(form.cantidad || 0);
        const numCajas = parseInt(form.cajas, 10) || 1;

        if (!codigo) {
          notify_(
            "Captura o selecciona un código antes de continuar.",
            "warning",
            2800,
            {
              title: "Código requerido",
              sound: true
            }
          );
          return;
        }

        if (!codigosSet.has(codigo)) {
          notify_(
            "El código no es válido o no fue seleccionado correctamente de la lista.",
            "error",
            3200,
            {
              title: "Código inválido",
              sound: true
            }
          );
          enfocarCodigo();
          return;
        }

        if (!form.id || !form.descripcion) {
          notify_(
            "El código todavía no se encontró correctamente.",
            "warning",
            3000,
            {
              title: "Producto en carga",
              sound: true
            }
          );
          return;
        }

        if (!cantidad || cantidad <= 0) {
          notify_(
            "Ingresa una cantidad de piezas válida.",
            "error",
            3000,
            {
              title: "Cantidad inválida",
              sound: true
            }
          );
          cantidadInputRef.current?.focus();
          return;
        }

        if (!numCajas || numCajas <= 0) {
          notify_(
            "El número de cajas debe ser mayor a cero.",
            "error",
            3000,
            {
              title: "Número de cajas inválido",
              sound: true
            }
          );
          return;
        }

        const marcaTiempoBase = generarMarcaTiempo();
        const nuevasEtiquetas = [];

        for (let i = 1; i <= numCajas; i++) {
          const folioGenerado = `${marcaTiempoBase}${form.id}${i}`;

          nuevasEtiquetas.push({
            tipo: TIPO_ETIQUETA_FIJO,
            codigo,
            descripcion: form.descripcion,
            cantidad: cantidad,
            id: form.id,
            idUnico: folioGenerado,
            cajaNo: i,
            totalCajas: numCajas,
            alto: ALTO_FIJO,
            ancho: ANCHO_FIJO,
            rowId: `${folioGenerado}-${i}`
          });
        }

        setCola(prev => [...nuevasEtiquetas, ...prev]);

        notify_(
          `${numCajas} etiqueta(s) de excedente se añadieron correctamente a la fila.`,
          "success",
          1800,
          {
            title: "Añadido a fila",
            sound: false
          }
        );

        limpiarCamposProducto();
      };

      const generar = () => {
        if (cola.length === 0) {
          notify_(
            "La fila está vacía. Agrega etiquetas antes de imprimir.",
            "warning",
            3200,
            {
              title: "Fila vacía",
              sound: true
            }
          );
          return;
        }

        if (
          !window.ImpresionModoUtilidades ||
          typeof window.ImpresionModoUtilidades.getMode !== "function" ||
          typeof window.ImpresionModoUtilidades.imprimirResultado !== "function"
        ) {
          notify_(
            "No se encontró el módulo global de impresión.",
            "error",
            4200,
            {
              title: "Impresión no disponible",
              sound: true
            }
          );
          return;
        }

        setProcesando(true);

        const modoImpresion = window.ImpresionModoUtilidades.getMode();

        let ventanaLocal = null;

        if (modoImpresion === "LOCAL") {
          ventanaLocal = window.open("", "_blank", "width=900,height=700");

          if (!ventanaLocal) {
            setProcesando(false);

            notify_(
              "La ventana fue bloqueada. Permite los pop-ups para continuar.",
              "warning",
              4200,
              {
                title: "Pop-up bloqueado",
                sound: true
              }
            );

            return;
          }

          ventanaLocal.document.open();
          ventanaLocal.document.write(`
            <html>
              <head>
                <title>Generando etiquetas...</title>
                <style>
                  body {
                    font-family: Arial, sans-serif;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    height: 100vh;
                    margin: 0;
                    color: #5f6368;
                    background-color: #f8f9fa;
                  }

                  .spinner {
                    width: 50px;
                    height: 50px;
                    border: 5px solid #f3f3f3;
                    border-top: 5px solid #d93025;
                    border-radius: 50%;
                    animation: spin 1s linear infinite;
                    margin-bottom: 20px;
                  }

                  @keyframes spin {
                    0% { transform: rotate(0deg); }
                    100% { transform: rotate(360deg); }
                  }

                  .loader {
                    text-align: center;
                    max-width: 420px;
                    padding: 0 24px;
                  }

                  .loader h3 {
                    margin: 0 0 8px 0;
                    font-size: 22px;
                    font-weight: 700;
                    color: #1c1d1f;
                    letter-spacing: 0.04em;
                  }

                  .loader p {
                    margin: 0;
                    font-size: 14px;
                    color: #5f6368;
                    line-height: 1.5;
                  }
                </style>
              </head>
              <body>
                <div class="spinner"></div>
                <div class="loader">
                  <h3>Preparando etiquetas...</h3>
                  <p>Espera un momento mientras se genera la impresión del excedente.</p>
                </div>
              </body>
            </html>
          `);
          ventanaLocal.document.close();
        }

        notify_(
          modoImpresion === "ONLINE"
            ? "Preparando lote de excedentes para impresión ONLINE..."
            : "Preparando lote de excedentes para impresión LOCAL...",
          "info",
          1600,
          {
            title: "Generando etiquetas",
            sound: false
          }
        );

        google.script.run
          .withSuccessHandler((resultado) => {
            const res = typeof resultado === "string"
              ? {
                  ok: true,
                  htmlImpresion: resultado,
                  printJob: null,
                  legacy: true
                }
              : resultado;

            if (!res || !res.htmlImpresion) {
              setProcesando(false);

              notify_(
                "No se recibió una impresión válida desde el servidor.",
                "error",
                4200,
                {
                  title: "Respuesta inválida",
                  sound: true
                }
              );

              return;
            }

            const modoActual = window.ImpresionModoUtilidades.getMode();

            if (modoActual === "ONLINE" && !res.printJob) {
              setProcesando(false);

              notify_(
                "La vista generó HTML, pero no generó paquete ONLINE.",
                "error",
                5200,
                {
                  title: "Impresión ONLINE no disponible",
                  sound: true
                }
              );

              return;
            }

            try {
              window.ImpresionModoUtilidades.imprimirResultado(res, {
                titulo: "Etiquetas de excedentes",
                fallbackLocal: false,
                ventanaLocal: ventanaLocal
              });

              setCola([]);
              limpiarCamposProducto();
              setProcesando(false);

              notify_(
                modoActual === "ONLINE"
                  ? "Etiquetas de excedentes enviadas por ONLINE."
                  : "Etiquetas de excedentes listas para impresión LOCAL.",
                "success",
                2800,
                {
                  title: modoActual === "ONLINE"
                    ? "Impresión ONLINE"
                    : "Impresión LOCAL",
                  sound: true
                }
              );

            } catch (errorImpresion) {
              console.error("❌ Error ejecutando impresión:", errorImpresion);
              setProcesando(false);

              notify_(
                errorImpresion && errorImpresion.message
                  ? errorImpresion.message
                  : "No se pudo ejecutar la impresión.",
                "error",
                5200,
                {
                  title: "Error de impresión",
                  sound: true
                }
              );
            }
          })
          
          .withFailureHandler((err) => {
            if (ventanaLocal && !ventanaLocal.closed) {
              ventanaLocal.close();
            }

            console.error("❌ Error en el servidor al generar excedentes:", err);
            setProcesando(false);

            notify_(
              err && err.message
                ? err.message
                : "No se pudieron generar las etiquetas de excedentes.",
              "error",
              4200,
              {
                title: "Error de impresión",
                sound: true
              }
            );
          })

          .FormularioEtiquetasExcedentesController_procesarLote(cola);
      };

      return (
        <div className="ex-app-shell flex flex-col h-full w-full relative">
          <div className="ex-main-layout">

            <div className="ex-left-panel border-r border-[#dadce0] bg-white px-6 pt-4 pb-6 shrink-0 z-10">
              <form onSubmit={handleAdd} className="h-full flex flex-col">

                <div className="ex-form-grid">

                  <div className="ex-grid-codigo ex-field-block">
                    <label className="ex-label ml-1">
                      Código
                    </label>

                    <div className="relative group">
                      <input
                        ref={codigoInputRef}
                        list="lista-codigos-excedentes"
                        disabled={cargando || procesando}
                        className={`w-full border rounded-xl px-4 ex-input ex-form-input-unificado uppercase outline-none transition-all ${
                          cargando || procesando
                            ? "bg-gray-200 cursor-not-allowed text-gray-500"
                            : "bg-gray-50 border-[#dadce0] focus:border-[#d93025] focus:bg-white"
                        }`}
                        placeholder={cargando ? "Cargando catálogo..." : "Selecciona un código"}
                        value={form.codigo}
                        onChange={handleCodigoChange}
                        onBlur={() => resolverCodigo(form.codigo)}
                        onKeyDown={(e) => {
                          if (e.key !== "Enter") return;
                          e.preventDefault();

                          const codigo = normalizarTexto(e.currentTarget.value);

                          if (!codigo) {
                            notify_(
                              "Captura un código válido antes de continuar.",
                              "warning",
                              2200,
                              {
                                title: "Código vacío",
                                sound: true
                              }
                            );
                            return;
                          }

                          resolverCodigo(codigo);
                        }}
                      />

                      <datalist id="lista-codigos-excedentes">
                        {codigosDisponibles.map((codigo, index) => (
                          <option key={`${index}-${codigo}`} value={codigo} />
                        ))}
                      </datalist>

                      {form.id && (
                        <div className="absolute right-3 top-3 text-green-500 animate-pulse">
                          <LocalIcon name="check-circle" size={16} />
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="ex-grid-id ex-field-block">
                    <label className="ex-label ml-1">
                      ID producto
                    </label>

                    <input
                      type="text"
                      readOnly
                      className="w-full border rounded-xl px-4 ex-input ex-form-input-unificado uppercase outline-none transition-all bg-gray-200 text-gray-600 cursor-not-allowed border-gray-300 ex-mono"
                      placeholder="ID automático"
                      value={form.id}
                    />
                  </div>

                  <div className="ex-grid-producto">
                    {form.codigo ? (
                      <div className="ex-id-card bg-[#1c1d1f] space-y-3 border border-gray-800 fade-in shadow-xl">
                        <div className="flex items-start gap-2.5">
                          <div className="p-1.5 bg-gray-800 rounded-lg">
                            <LocalIcon name="tag" size={15} className="text-red-500" />
                          </div>

                          <div className="flex flex-col min-w-0">
                            <span className="text-[12px] font-black text-gray-500 uppercase tracking-[0.18em]">
                              Código vinculado
                            </span>
                            <span className="text-white ex-mono text-[17px] font-black mt-1 break-all">
                              {form.codigo || "Sin código"}
                            </span>
                          </div>
                        </div>

                        <div className="flex items-start gap-2.5 border-t border-gray-800 pt-2.5">
                          <div className="p-1.5 bg-gray-800 rounded-lg">
                            <LocalIcon name="file-text" size={15} className="text-red-500" />
                          </div>

                          <div className="flex flex-col min-w-0">
                            <span className="text-[12px] font-black text-gray-500 uppercase tracking-[0.18em]">
                              Descripción
                            </span>
                            <span className="text-gray-300 text-[15px] font-bold leading-snug uppercase italic mt-1 break-words">
                              {form.descripcion || "No se encontró registro en la base de datos"}
                            </span>
                          </div>
                        </div>
                      </div>
                    ) : (
                      <div className="ex-product-placeholder">
                        <div>
                          <div className="ex-product-placeholder-title">
                            Esperando código
                          </div>
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="ex-grid-cajas ex-field-block">
                    <label className="ex-label ml-1">
                      Número de cajas
                    </label>

                    <input
                      type="number"
                      min="1"
                      disabled={cargando || procesando}
                      className="w-full border rounded-xl px-4 ex-input ex-form-input-unificado uppercase outline-none transition-all bg-gray-50 border-[#dadce0] focus:border-[#d93025] focus:bg-white"
                      placeholder="Ej: 5"
                      value={form.cajas}
                      onChange={(e) => handleCajasChange(e.target.value)}
                      onBlur={() => {
                        const n = parseInt(form.cajas, 10);
                        if (!n || n < 1) {
                          setForm(prev => ({
                            ...prev,
                            cajas: "1"
                          }));
                        }
                      }}
                    />
                  </div>

                  <div className="ex-grid-cantidad ex-field-block">
                    <label className="ex-label ml-1">
                      Cantidad de pzas
                    </label>

                    <input
                      ref={cantidadInputRef}
                      type="number"
                      min="1"
                      disabled={cargando || procesando}
                      className="w-full border rounded-xl px-4 ex-input ex-form-input-unificado uppercase outline-none transition-all bg-gray-50 border-[#dadce0] focus:border-[#d93025] focus:bg-white"
                      placeholder="Ej: 1800"
                      value={form.cantidad}
                      onChange={(e) => handleCantidadChange(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === "Enter") {
                          e.preventDefault();
                          handleAdd(e);
                        }
                      }}
                    />
                  </div>

                  <div className="ex-grid-accion">
                    <button
                      type="submit"
                      disabled={cargando || procesando}
                      className="ex-action-btn w-full bg-[#d93025] hover:bg-[#a50e0e] text-white py-4 rounded-xl font-black uppercase text-[16px] tracking-[0.18em] shadow-lg shadow-red-100 transition-all flex items-center justify-center gap-3 disabled:opacity-50 disabled:pointer-events-none"
                    >
                      <LocalIcon name="plus" size={25} />
                      Añadir a fila
                    </button>
                  </div>

                </div>
              </form>
            </div>

            <div className="ex-right-panel min-w-0 ex-results-shell">

              <div className="ex-results-toolbar bg-white border-b border-gray-200 px-4 py-4 flex items-center justify-start gap-4">
                <div className="flex items-center gap-3">
                  <div className="w-11 h-11 rounded-2xl bg-[#1c1d1f] text-white flex items-center justify-center shadow-md">
                    <LocalIcon name="list-checks" size={22} />
                  </div>

                  <div className="flex flex-col">
                    <span className="text-[11px] font-black uppercase tracking-[0.22em] text-gray-400">
                      Fila de excedentes
                    </span>
                    <span className="text-[15px] font-black uppercase tracking-[0.08em] text-gray-900">
                      {resumenCola.total} {resumenCola.total === 1 ? "etiqueta añadida" : "etiquetas añadidas"}
                    </span>
                  </div>
                </div>
              </div>


              <div className="ex-table-scroll custom-scroll-container">

                <table className="ex-results-table">
                  <thead className="ex-results-head">
                    <tr>
                      <th className="text-center">
                        Código / Descripción
                      </th>
                      <th className="text-center">
                        Caja
                      </th>
                      <th className="text-center">
                        Cantidad
                      </th>
                      <th className="text-center">
                        Folio
                      </th>
                      <th className="text-center">
                        Acción
                      </th>
                    </tr>
                  </thead>

                  <tbody>
                    {cola.map(item => (
                      <tr key={item.rowId} className="ex-results-row fade-in">
                        <td>
                          <div className="flex flex-col">
                            <span className="ex-code-main">{item.codigo}</span>
                            <span className="ex-desc">
                              {item.descripcion || "SIN DESCRIPCIÓN"}
                            </span>
                          </div>
                        </td>

                        <td className="text-center">
                          <span className="ex-box-chip">
                            Caja {item.cajaNo} / {item.totalCajas}
                          </span>
                        </td>

                        <td className="text-center">
                          <span className="ex-qty-pill">
                            {item.cantidad}
                          </span>
                        </td>

                        <td className="text-center">
                          <span className="ex-folio-pill" title={item.idUnico}>
                            {item.idUnico}
                          </span>
                        </td>

                        <td className="text-center">
                          <button
                            type="button"
                            onClick={() => {
                              setCola(prev => prev.filter(c => c.rowId !== item.rowId));
                              notify_("Etiqueta de excedente eliminada de la fila.", "warning", 1400, {
                                title: "Elemento removido",
                                sound: false
                              });
                              enfocarCodigo();
                            }}
                            className="ex-delete-btn"
                            title="Quitar de la fila"
                          >
                            <LocalIcon name="trash-2" size={16} />
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>

                {cola.length === 0 && (
                  <div className="ex-empty-state">
                    <LocalIcon name="package" size={52} />
                    <p className="ex-empty-title">
                      Esperando excedentes
                    </p>
                    <p className="ex-empty-sub">
                      Las etiquetas añadidas aparecerán aquí
                    </p>
                  </div>
                )}

              </div>
            </div>
          </div>

          {cola.length > 0 && (
            <div className="absolute bottom-6 right-6 z-30">
              <button
                type="button"
                onClick={generar}
                disabled={procesando}
                className="bg-[#1c1d1f] hover:bg-black text-white px-6 py-4 rounded-2xl shadow-xl font-black uppercase tracking-[0.15em] flex items-center gap-3 disabled:opacity-50 disabled:pointer-events-none"
              >
                <LocalIcon
                  name={procesando ? "loader-2" : "printer"}
                  size={20}
                  className={procesando ? "animate-spin" : ""}
                />
                {procesando
                  ? "Procesando..."
                  : `Imprimir ${resumenCola.total} ${resumenCola.total === 1 ? "etiqueta" : "etiquetas"}`
                }
              </button>
            </div>
          )}
        </div>
      );
    };

    const rootDiv = document.getElementById("render-etiquetas-excedentes");

    if (!rootDiv) {
      notify_(
        "No se encontró el contenedor principal de etiquetas de excedentes.",
        "error",
        4200,
        {
          title: "Error de interfaz",
          sound: true
        }
      );
      console.warn("⚠️ [Excedentes] No se encontró #render-etiquetas-excedentes");
      return;
    }

    const yaInicializado = rootDiv.dataset.exMounted === "1";

    if (window.__FORMULARIO_ETIQUETAS_EXCEDENTES_ROOT__) {
      try {
        window.__FORMULARIO_ETIQUETAS_EXCEDENTES_ROOT__.unmount();
      } catch (e) {
        console.warn("⚠️ [Excedentes] No se pudo desmontar root previo:", e);
        notifyOnceShell_(
          "excedentes-root-previo",
          "Se liberó una instancia previa de etiquetas de excedentes.",
          "warning",
          1600,
          {
            title: "Reinicialización",
            sound: false
          },
          10000
        );
      }
      window.__FORMULARIO_ETIQUETAS_EXCEDENTES_ROOT__ = null;
    }

    try {
      rootDiv.dataset.exMounted = "1";
      window.__FORMULARIO_ETIQUETAS_EXCEDENTES_ROOT__ = ReactDOM.createRoot(rootDiv);
      window.__FORMULARIO_ETIQUETAS_EXCEDENTES_ROOT__.render(<VistaEtiquetasExcedentes />);

      if (!yaInicializado) {
        notifyOnceShell_(
          "excedentes-vista-montada",
          "Vista de etiquetas de excedentes lista para operar.",
          "success",
          1500,
          {
            title: "Vista cargada",
            sound: false
          },
          12000
        );
      }
    } catch (e) {
      console.error("❌ [Excedentes] Error montando root React:", e);
      notify_(
        "Ocurrió un error al montar la vista de etiquetas de excedentes.",
        "error",
        4200,
        {
          title: "Error de montaje",
          sound: true
        }
      );
    }
  };

  window.initVista = window.cargar_FormularioEtiquetasExcedentes;
  console.log("🧩 [FormularioEtiquetasExcedentes] initVista definida:", typeof window.initVista);
</script>
