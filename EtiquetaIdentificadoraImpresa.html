<script>
  /**
   * EtiquetaIdentificadoraImpresa.html
   *
   * Plantilla para imprimir etiquetas identificadoras de excedentes.
   *
   * Responsabilidades:
   * - Renderizar una página física de 150 × 100 mm por cada elemento del lote.
   * - Mostrar código, descripción, fecha y un QR asociado al identificador.
   * - Generar el QR mediante un proveedor principal y un proveedor alternativo.
   * - Esperar documento, fuentes, imágenes, QR y ciclos de pintura antes de
   *   declarar que la salida está lista para impresión.
   * - Exponer window.__APP_PRINT_READY para los canales LOCAL y ONLINE.
   *
   * Datos esperados desde HtmlService:
   * - lote: arreglo de elementos con codigo, descripcion e id.
   * - fechaHora: fecha y hora visibles en la cabecera.
   * - modoImpresion: canal LOCAL u ONLINE.
   *
   * Dependencias externas:
   * - QuickChart como proveedor QR principal.
   * - QRServer como proveedor QR alternativo.
   * - Recurso gráfico remoto utilizado como marca de agua y centro del QR.
   *
   * Invariantes:
   * - Cada elemento del lote genera exactamente una página de 150 × 100 mm.
   * - El nivel de corrección del código QR permanece en H.
   * - Los fallos de recursos remotos no deben bloquear indefinidamente la impresión.
   * - Los scriptlets reales no deben reproducirse como ejemplos dentro de comentarios.
   */
</script>

<?
  /** URL del logotipo utilizado como marca de agua y centro del QR. */
  var LOGO_QR_URL = 'https://lirp.cdn-website.com/32df9ef3/dms3rep/multi/opt/logo_408868407-1920w.png';

  /** Configuración del proveedor QR principal. */
  var QR_CONFIG = {
    size: 800,
    margin: 3,
    ecLevel: 'H',
    dark: '000000',
    light: 'FFFFFF',
    dotStyle: 'dot',
    finderStyle: 'rounded',
    finderDotStyle: 'rounded',
    finderColor: '000000',
    centerImageSizeRatio: 0.28
  };

  /**
   * Construye la URL del QR principal.
   * @param {*} texto Contenido por codificar.
   * @return {string} URL de QuickChart.
   */
  function construirQr_(texto) {
    var params = [
      'text=' + encodeURIComponent(String(texto || '')),
      'size=' + QR_CONFIG.size,
      'margin=' + QR_CONFIG.margin,
      'ecLevel=' + QR_CONFIG.ecLevel,
      'dark=' + QR_CONFIG.dark,
      'light=' + QR_CONFIG.light,
      'dotStyle=' + QR_CONFIG.dotStyle,
      'finderStyle=' + QR_CONFIG.finderStyle,
      'finderDotStyle=' + QR_CONFIG.finderDotStyle,
      'finderColor=' + QR_CONFIG.finderColor,
      'centerImageUrl=' + encodeURIComponent(LOGO_QR_URL),
      'centerImageSizeRatio=' + QR_CONFIG.centerImageSizeRatio
    ];

    return 'https://quickchart.io/qr?' + params.join('&');
  }

  /**
   * Construye la URL del QR alternativo.
   * @param {*} texto Contenido por codificar.
   * @return {string} URL de QRServer.
   */
  function construirQrFallback_(texto) {
    return 'https://api.qrserver.com/v1/create-qr-code/?'
      + 'size=800x800'
      + '&data=' + encodeURIComponent(String(texto || ''))
      + '&ecc=H'
      + '&margin=3'
      + '&color=000000'
      + '&bgcolor=FFFFFF';
  }

  /** Canal de impresión solicitado por el consumidor. */
  var MODO_IMPRESION = (typeof modoImpresion !== "undefined" && modoImpresion)
    ? String(modoImpresion).toUpperCase()
    : "LOCAL";

  /** Indicador derivado para integraciones de impresión ONLINE. */
  var ES_ONLINE = MODO_IMPRESION === "ONLINE";
  /** Dos imágenes por etiqueta: marca de agua y código QR. */
  var TOTAL_IMAGENES_ESPERADAS = (lote && lote.length) ? lote.length * 2 : 0;

?>

<script>
  (function () {
    var imagenesCargadas = 0;
    var totalImagenesEsperadas = (Number("<?= lote.length ?>") || 0) * 2;

    /** Registra de forma diagnóstica la carga o fallo de una imagen. */
    window.registrarImagenLista = function () {
      imagenesCargadas++;

      console.log(
        "[EtiquetaIdentificadoraImpresa] Imagen registrada:",
        imagenesCargadas,
        "/",
        totalImagenesEsperadas
      );
    };

    /**
     * Crea una pausa asíncrona no bloqueante.
     * @param {number} ms Duración en milisegundos.
     * @return {Promise<void>}
     */
    function esperar(ms) {
      return new Promise(function (resolve) {
        setTimeout(resolve, ms);
      });
    }

    /** Espera el evento load con un límite defensivo. */
    function esperarLoadDocumento() {
      if (document.readyState === "complete") {
        return Promise.resolve();
      }

      return new Promise(function (resolve) {
        window.addEventListener("load", resolve, { once: true });
        setTimeout(resolve, 3500);
      });
    }

    /** Espera la disponibilidad de fuentes con un límite de tiempo. */
    function esperarFuentes() {
      try {
        if (document.fonts && document.fonts.ready) {
          return Promise.race([
            document.fonts.ready,
            esperar(3000)
          ]);
        }
      } catch (error) {
        console.warn("[EtiquetaIdentificadoraImpresa] No se pudo esperar fuentes:", error);
      }

      return Promise.resolve();
    }

    /**
     * Espera la carga y decodificación de una imagen sin bloquear indefinidamente.
     * @param {HTMLImageElement} img Imagen por observar.
     * @return {Promise<void>}
     */
    function esperarImagen(img) {
      return new Promise(function (resolve) {
        if (img.complete && img.naturalWidth > 0) {
          if (typeof img.decode === "function") {
            img.decode().then(resolve).catch(resolve);
            return;
          }

          resolve();
          return;
        }

        img.addEventListener("load", function () {
          if (typeof img.decode === "function") {
            img.decode().then(resolve).catch(resolve);
            return;
          }

          resolve();
        }, { once: true });

        img.addEventListener("error", function () {
          console.warn("[EtiquetaIdentificadoraImpresa] Imagen no cargó:", img.src);
          resolve();
        }, { once: true });

        setTimeout(resolve, 4500);
      });
    }

    /** Espera todas las imágenes declaradas en el documento. */
    function esperarImagenes() {
      var imagenes = Array.from(document.images || []);

      if (!imagenes.length) {
        return Promise.resolve();
      }

      return Promise.all(imagenes.map(esperarImagen));
    }

    /** Comprueba que los QR tengan contenido y dimensiones visibles. */
    function esperarQRVisual() {
      var intentos = 0;
      var maxIntentos = 45;

      return new Promise(function (resolve) {
        function revisar() {
          intentos++;

          var qrs = Array.from(document.querySelectorAll(".qr-container img"));

          var todosListos = qrs.every(function (img) {
            var rect = img.getBoundingClientRect();

            return (
              img.complete &&
              img.naturalWidth > 0 &&
              rect &&
              rect.width > 0 &&
              rect.height > 0
            );
          });

          if (todosListos || intentos >= maxIntentos) {
            resolve();
            return;
          }

          setTimeout(revisar, 100);
        }

        revisar();
      });
    }

    /** Espera varios ciclos de pintura antes de habilitar la impresión. */
    function esperarFrames(cantidad) {
      cantidad = cantidad || 4;

      return new Promise(function (resolve) {
        var count = 0;

        function step() {
          count++;

          if (count >= cantidad) {
            resolve();
            return;
          }

          requestAnimationFrame(step);
        }

        requestAnimationFrame(step);
      });
    }

    /**
     * Promesa pública resuelta cuando el documento está visualmente listo.
     * @type {Promise<boolean>}
     */
    window.__APP_PRINT_READY = (async function () {
      await esperarLoadDocumento();
      await esperarFuentes();
      await esperarImagenes();
      await esperarQRVisual();
      await esperarFrames(4);
      await esperar(300);

      document.documentElement.setAttribute("data-print-ready", "1");

      console.log("[EtiquetaIdentificadoraImpresa] Documento listo para impresión.");

      return true;
    })();
  })();
</script>
