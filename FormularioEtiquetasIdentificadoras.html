<script>
(function () {
  // =========================================================
  // ESTADO SEGURO DE LA VISTA (evita redeclaraciones al recargar)
  // =========================================================
  window.EtiquetasIdentificadorasState = window.EtiquetasIdentificadorasState || {
    mapaCatalogo: {},
    mapaMedidas: {},
    listaNombresEtiquetas: [],
    listaCodigos: [],
    snackbarTimeout: null
  };

  window.colaDeImpresionEtiquetas = window.colaDeImpresionEtiquetas || [];

  const state = window.EtiquetasIdentificadorasState;

  // =========================================================
  // UTILIDADES INTERNAS
  // =========================================================
  function normalizarTexto(valor) {
    return String(valor || "").trim().toUpperCase();
  }

  function lanzarNotificacionLocal(mensaje, tipo = 'success') {
    const x = document.getElementById("snackbar");

    // Si no existe snackbar local, usa el notificador global del shell
    if (!x) {
      if (typeof window.notificar === "function") {
        window.notificar(mensaje, tipo);
      }
      return;
    }

    if (state.snackbarTimeout) {
      clearTimeout(state.snackbarTimeout);
    }

    x.innerText = mensaje;
    x.className = "show " + tipo;
    x.style.visibility = "visible";
    x.style.opacity = "1";

    const cerrar = function () {
      x.style.opacity = "0";
      setTimeout(function () {
        x.className = "";
        x.style.visibility = "hidden";
      }, 400);
    };

    state.snackbarTimeout = setTimeout(cerrar, 1500);
    x.onclick = cerrar;
  }

  function limpiarCamposInterno() {
    const idInput = document.getElementById('idInput');
    const descripcionInput = document.getElementById('descripcionInput');
    const codigoInput = document.getElementById('codigoInput');

    if (idInput) idInput.value = '';
    if (descripcionInput) descripcionInput.value = '';
    if (codigoInput) {
      codigoInput.value = '';
      codigoInput.focus();
    }
  }

  function poblarDatalistsEtiquetas_() {
    console.log("🧾 [Etiquetas] poblarDatalistsEtiquetas_()");
    console.log("🧾 [Etiquetas] listaCodigos total:", state.listaCodigos.length);
    console.log("🧾 [Etiquetas] listaNombresEtiquetas total:", state.listaNombresEtiquetas.length);

    const dlCodigos = document.getElementById('listaCodigos');
    if (dlCodigos) {
      dlCodigos.innerHTML = state.listaCodigos
        .map(c => `<option value="${c}">`)
        .join('');
    }

    const dlTipos = document.getElementById('listaTipos');
    if (dlTipos) {
      dlTipos.innerHTML = state.listaNombresEtiquetas
        .map(n => `<option value="${n}">`)
        .join('');
    }
  }

  function validarValorEnListaInterno(idInput, listaPermitida, nombreCampo) {
    const input = document.getElementById(idInput);
    if (!input) return false;

    const valor = normalizarTexto(input.value);
    if (valor === "") return false;

    const existe = (listaPermitida || []).some(item => normalizarTexto(item) === valor);

    if (!existe) {
      lanzarNotificacionLocal(`⚠️ El ${nombreCampo} "${valor}" no es válido.`, "error");
      input.value = "";
      if (idInput === 'codigoInput') {
        limpiarCamposInterno();
      }
      input.focus();
      return false;
    }

    return true;
  }

  function bindOnce(el, key, eventName, handler) {
    if (!el) return;
    const flag = `bound_${key}`;
    if (el.dataset[flag]) return;

    el.addEventListener(eventName, handler);
    el.dataset[flag] = "1";
  }

  function vincularEventosDOMEtiquetas_() {
    const tipoInput = document.getElementById('tipoetiquetaInput');
    const codigoInput = document.getElementById('codigoInput');

    bindOnce(tipoInput, 'validarTipoEtiqueta', 'change', function () {
      validarValorEnListaInterno('tipoetiquetaInput', state.listaNombresEtiquetas, "tipo de etiqueta");
    });

    bindOnce(codigoInput, 'validarCodigoEtiqueta', 'change', function () {
      validarValorEnListaInterno('codigoInput', state.listaCodigos, "código");
    });
  }

  // =========================================================
  // INIT DE VISTA
  // =========================================================
  console.log("🏷️ [Etiquetas] Script de la vista ejecutado");
  console.log("📦 [Etiquetas] DATA_ALMACEN_CACHE visible en vista:", window.DATA_ALMACEN_CACHE);

  window.inicializarVistaEtiquetas = function () {
    console.log("🏷️ [Etiquetas] inicializarVistaEtiquetas() ejecutada");
    console.log("📦 [Etiquetas] Cache completo:", window.DATA_ALMACEN_CACHE);

    vincularEventosDOMEtiquetas_();

    const cache = window.DATA_ALMACEN_CACHE || {};

    const mapaCatalogoCache = cache.mapaCatalogo || cache.mapaProductos || {};
    const mapaMedidasCache = cache.mapaMedidas || {};
    const codigosCache = cache.codigos || [];
    const nombresEtiquetasCache = cache.nombresEtiquetas || [];

    const cacheCompletaEtiquetas =
      Object.keys(mapaCatalogoCache).length > 0 &&
      Object.keys(mapaMedidasCache).length > 0 &&
      codigosCache.length > 0 &&
      nombresEtiquetasCache.length > 0;

    // 1) Si la cache global ya trae todos los datos que esta vista necesita
    if (cacheCompletaEtiquetas) {
      console.log("⚡ [Etiquetas] Cargando datos completos desde DATA_ALMACEN_CACHE...");

      state.mapaCatalogo = mapaCatalogoCache;
      state.mapaMedidas = mapaMedidasCache;
      state.listaCodigos = codigosCache;
      state.listaNombresEtiquetas = nombresEtiquetasCache;

      poblarDatalistsEtiquetas_();
      lanzarNotificacionLocal("Sistema listo", "success");
      return;
    }

    // 2) Si ya estaban cargados en memoria local
    if (
      Object.keys(state.mapaCatalogo).length > 0 ||
      Object.keys(state.mapaMedidas).length > 0 ||
      state.listaCodigos.length > 0 ||
      state.listaNombresEtiquetas.length > 0
    ) {
      console.log("⚡ [Etiquetas] Reutilizando datos ya cargados en memoria local...");
      poblarDatalistsEtiquetas_();
      lanzarNotificacionLocal("Sistema listo", "success");
      return;
    }

    // 3) Fallback al controller nuevo
    console.warn("⚠️ [Etiquetas] La cache no tiene datos suficientes. Solicitando bootstrap específico...");

    google.script.run
      .withSuccessHandler(function (data) {
        console.log("✅ [Etiquetas] Bootstrap recibido:", data);

        state.mapaCatalogo = data.mapaCatalogo || {};
        state.mapaMedidas = data.mapaMedidas || {};
        state.listaCodigos = data.codigos || [];
        state.listaNombresEtiquetas = data.nombresEtiquetas || [];

        // Mezclar en cache global
        window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || {};
        window.DATA_ALMACEN_CACHE.codigos = state.listaCodigos;
        window.DATA_ALMACEN_CACHE.mapaCatalogo = state.mapaCatalogo;
        window.DATA_ALMACEN_CACHE.mapaMedidas = state.mapaMedidas;
        window.DATA_ALMACEN_CACHE.nombresEtiquetas = state.listaNombresEtiquetas;

        poblarDatalistsEtiquetas_();
        lanzarNotificacionLocal("✅ Datos de etiquetas cargados", "success");
      })
      .withFailureHandler(function (err) {
        console.error("❌ [Etiquetas] Error cargando bootstrap:", err);
        lanzarNotificacionLocal("❌ No se pudo cargar la información inicial de etiquetas", "error");
      })
      .FormularioEtiquetasIdentificadorasController_getBootstrap();
  };

  // Alias esperado por tu shell
  window.initVista = window.inicializarVistaEtiquetas;

  // =========================================================
  // FUNCIONES PÚBLICAS (para onclick / onchange inline)
  // =========================================================
  window.buscarPorCodigo = function () {
    const input = document.getElementById('codigoInput');
    const codigo = normalizarTexto(input ? input.value : "");

    if (codigo === "") return;

    if (!state.listaCodigos.includes(codigo)) {
      lanzarNotificacionLocal(`❌ El código "${codigo}" no existe.`, "error");
      limpiarCamposInterno();
      return;
    }

    const producto = state.mapaCatalogo[codigo];
    if (producto) {
      document.getElementById('idInput').value = producto.idproducto || "";
      document.getElementById('descripcionInput').value = producto.descripcion || "";
      return;
    }

    // Fallback al backend
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.encontrado) {
          lanzarNotificacionLocal(`❌ El código "${codigo}" no fue encontrado.`, "error");
          limpiarCamposInterno();
          return;
        }

        document.getElementById('idInput').value = res.idproducto || "";
        document.getElementById('descripcionInput').value = res.descripcion || "";
      })
      .withFailureHandler(function (err) {
        console.error("❌ Error buscando producto:", err);
        lanzarNotificacionLocal("❌ Error al buscar el producto", "error");
      })
      .FormularioEtiquetasIdentificadorasController_buscarProductoPorCodigo(codigo);
  };

  window.limpiarCampos = function () {
    limpiarCamposInterno();
  };

  window.agregarALista = function () {
    const tipo = normalizarTexto(document.getElementById('tipoetiquetaInput')?.value);
    const cod = normalizarTexto(document.getElementById('codigoInput')?.value);
    const desc = document.getElementById('descripcionInput')?.value || "";
    const id = document.getElementById('idInput')?.value || "";

    if (!state.listaNombresEtiquetas.includes(tipo)) {
      lanzarNotificacionLocal("❌ Selecciona un tipo de etiqueta de la lista", "error");
      return;
    }

    if (!state.listaCodigos.includes(cod) || !id) {
      lanzarNotificacionLocal("❌ Código no válido o no encontrado", "error");
      return;
    }

    const medidas = state.mapaMedidas[tipo];
    if (!medidas) {
      lanzarNotificacionLocal("❌ No se encontraron las medidas de la etiqueta seleccionada", "error");
      return;
    }

    window.colaDeImpresionEtiquetas.push({
      tipo: tipo,
      codigo: cod,
      descripcion: desc,
      id: id,
      alto: medidas.alto,
      ancho: medidas.ancho
    });

    window.actualizarVistaLista();
    limpiarCamposInterno();
    lanzarNotificacionLocal("Añadido a la fila", "success");
  };

  window.actualizarVistaLista = function () {
    const listaUL = document.getElementById('listaEtiquetas');
    const btnPrint = document.getElementById('btnImprimirTodo');
    const contador = document.getElementById('contador');
    const textoBoton = document.getElementById('textoBoton');

    const plantillaEl = document.getElementById('plantillaEtiqueta');
    if (!listaUL || !btnPrint || !contador || !textoBoton || !plantillaEl) return;

    const plantilla = plantillaEl.innerHTML;

    window.colaDeImpresionEtiquetas.sort((a, b) => {
      let comparacionTipo = a.tipo.localeCompare(b.tipo);
      if (comparacionTipo === 0) return a.codigo.localeCompare(b.codigo);
      return comparacionTipo;
    });

    listaUL.innerHTML = "";
    contador.innerText = window.colaDeImpresionEtiquetas.length;

    window.colaDeImpresionEtiquetas.forEach((item, index) => {
      let htmlFila = plantilla
        .replace(/{{INDEX}}/g, index)
        .replace("{{TIPO}}", item.tipo)
        .replace("{{CODIGO}}", item.codigo)
        .replace("{{DESCRIPCION}}", item.descripcion)
        .replace("{{ALTO}}", item.alto)
        .replace("{{ANCHO}}", item.ancho);

      listaUL.insertAdjacentHTML('beforeend', htmlFila);
    });

    if (window.colaDeImpresionEtiquetas.length > 0) {
      btnPrint.classList.add('visible');
      textoBoton.innerText = `Imprimir Lote (${window.colaDeImpresionEtiquetas.length})`;
    } else {
      btnPrint.classList.remove('visible');
      textoBoton.innerText = "Imprimir";
    }
  };

  window.quitarDeLista = function (index) {
    window.colaDeImpresionEtiquetas.splice(index, 1);
    window.actualizarVistaLista();
  };

  window.generar = function () {
    if (window.colaDeImpresionEtiquetas.length === 0) {
      lanzarNotificacionLocal("⚠️ Agrega etiquetas a la lista primero.", "error");
      return;
    }

    window.colaDeImpresionEtiquetas.sort((a, b) => {
      if (a.tipo < b.tipo) return -1;
      if (a.tipo > b.tipo) return 1;
      return 0;
    });

    const btn = document.getElementById('btnImprimirTodo');
    const textoBoton = document.getElementById('textoBoton');

    if (!btn || !textoBoton) {
      console.error("❌ No se encontró el botón de impresión o el span textoBoton");
      return;
    }

    textoBoton.innerText = "⏳ Generando...";
    btn.disabled = true;

    const win = window.open("", "_blank");

    if (!win) {
      lanzarNotificacionLocal("⚠️ Ventana bloqueada. Por favor permite los pop-ups en la barra de direcciones.", "warning");
      btn.disabled = false;
      textoBoton.innerText = "Imprimir";
      return;
    }

    win.document.write(`
      <html>
        <head>
          <title>Generando Etiquetas...</title>
          <style>
            body { 
              font-family: 'Google Sans', Roboto, Arial, sans-serif; 
              display: flex; 
              flex-direction: column; 
              align-items: center; 
              justify-content: center; 
              height: 100vh; 
              margin: 0; 
              color: #5f6368; 
              background-color: #f8f9fa;
            }
            .spinner {
              width: 50px;
              height: 50px;
              border: 5px solid #f3f3f3;
              border-top: 5px solid #d93025;
              border-radius: 50%;
              animation: spin 1s linear infinite;
              margin-bottom: 20px;
            }
            @keyframes spin {
              0% { transform: rotate(0deg); }
              100% { transform: rotate(360deg); }
            }
            h3 { font-weight: 400; }
          </style>
        </head>
        <body>
          <div class="spinner"></div>
          <h3>Preparando tus etiquetas...</h3>
          <p>Esto tomará solo unos segundos.</p>
        </body>
      </html>
    `);
    win.document.close();

    google.script.run
      .withSuccessHandler(function (htmlGenerado) {
        win.document.open();
        win.document.write(htmlGenerado);
        win.document.close();

        window.colaDeImpresionEtiquetas = [];
        window.actualizarVistaLista();

        btn.disabled = false;
        textoBoton.innerText = "Imprimir";

        lanzarNotificacionLocal("✅ Etiquetas generadas con éxito", "success");
      })
      .withFailureHandler(function (err) {
        win.close();
        console.error("❌ Error al generar etiquetas:", err);

        btn.disabled = false;
        textoBoton.innerText = "Imprimir";

        lanzarNotificacionLocal("❌ Error al generar etiquetas", "error");
      })
      .FormularioEtiquetasIdentificadorasController_procesarLote(window.colaDeImpresionEtiquetas);
  };

  window.solicitarAccesoMantenimiento = function () {
    const pass = prompt("Introduzca la contraseña para acceder a Mantenimiento:");
    if (pass === "1234") {
      lanzarNotificacionLocal("Acceso concedido", "success");
    } else if (pass !== null) {
      lanzarNotificacionLocal("❌ Contraseña incorrecta", "error");
    }
  };

  // Exponemos también esta por si otra parte la llama
  window.validarValorEnLista = function (idInput, listaPermitida, nombreCampo) {
    return validarValorEnListaInterno(idInput, listaPermitida, nombreCampo);
  };

})();
</script>
