            function lanzarNotificacion(mensaje, tipo = 'success') {
                const x = document.getElementById("snackbar");
                
                if (snackbarTimeout) clearTimeout(snackbarTimeout);

                x.innerText = mensaje;
                x.className = "show " + tipo;
                x.style.visibility = "visible";
                x.style.opacity = "1";

                // Función para cerrar la notificación
                const cerrar = function() {
                  x.style.opacity = "0";
                  setTimeout(function() {
                    x.className = ""; 
                    x.style.visibility = "hidden";
                  }, 400); // Tiempo de la transición de salida
                };

                // Cerrar automáticamente en 1.5 segundos (antes eran 3s)
                snackbarTimeout = setTimeout(cerrar, 1500);

                // NUEVO: Si haces clic en la notificación, se cierra inmediatamente
                x.onclick = cerrar;
            }

function buscarPorCodigo() {
  const input = document.getElementById('codigoInput');
  const codigo = input.value.trim().toUpperCase();
  
  if (codigo === "") return;

  // Validación estricta
  if (!listaCodigosGlobal.includes(codigo)) {
    lanzarNotificacion(`❌ El código "${codigo}" no existe.`, "error");
    limpiarCampos();
    return;
  }

  const producto = mapaCatalogoGlobal[codigo];
  if (producto) {
    document.getElementById('idInput').value = producto.idproducto;
    document.getElementById('descripcionInput').value = producto.descripcion;
  }
}
        


        function limpiarCampos () {
            document.getElementById('idInput').value = '';
            document.getElementById('descripcionInput').value = '';

          }



        function agregarALista() {
const tipo = document.getElementById('tipoetiquetaInput').value;
  const cod = document.getElementById('codigoInput').value.trim().toUpperCase();
  const desc = document.getElementById('descripcionInput').value; // Aseguramos capturar el valor del input
  const id = document.getElementById('idInput').value;

  // VALIDACIÓN FINAL ANTES DE AÑADIR
  if (!listaNombresEtiquetasGlobal.includes(tipo)) {
    return lanzarNotificacion("❌ Selecciona un tipo de etiqueta de la lista", "error");
  }
  if (!listaCodigosGlobal.includes(cod) || !id) {
    return lanzarNotificacion("❌ Código no válido o no encontrado", "error");
  }

  const medidas = mapaMedidasGlobal[tipo];

  // Añadimos a la cola SIN esperar al servidor
  window.colaDeImpresionEtiquetas.push({ 
    tipo: tipo, 
    codigo: cod, 
    descripcion: desc, 
    id: id,
    alto: medidas.alto,
    ancho: medidas.ancho
  });

  actualizarVistaLista();
  limpiarCampos();
  lanzarNotificacion("Añadido a la fila", "success");
}          



        function actualizarVistaLista() {
            const listaUL = document.getElementById('listaEtiquetas');
            const btnPrint = document.getElementById('btnImprimirTodo');
            const contador = document.getElementById('contador');
            const textoBoton = document.getElementById('textoBoton');
            
            // Obtenemos el molde del archivo FilaEtiquetasIdentificadoras.html
            const plantilla = document.getElementById('plantillaEtiqueta').innerHTML;

            // Ordenar la cola por tipo y luego por código
            window.colaDeImpresionEtiquetas.sort((a, b) => {
                let comparacionTipo = a.tipo.localeCompare(b.tipo);
                if (comparacionTipo === 0) return a.codigo.localeCompare(b.codigo);
                return comparacionTipo;
            });

            listaUL.innerHTML = ""; 
            contador.innerText = window.colaDeImpresionEtiquetas.length;

            window.colaDeImpresionEtiquetas.forEach((item, index) => {
                // Reemplazamos los marcadores {{...}} por los datos del objeto
                let htmlFila = plantilla
                    .replace(/{{INDEX}}/g, index)
                    .replace("{{TIPO}}", item.tipo)
                    .replace("{{CODIGO}}", item.codigo)
                    .replace("{{DESCRIPCION}}", item.descripcion)
                    .replace("{{ALTO}}", item.alto)
                    .replace("{{ANCHO}}", item.ancho);

                listaUL.insertAdjacentHTML('beforeend', htmlFila);
            });

            if (window.colaDeImpresionEtiquetas.length > 0) {
                btnPrint.classList.add('visible');
                textoBoton.innerText = `Imprimir Lote (${window.colaDeImpresionEtiquetas.length})`;
            } else {
                btnPrint.classList.remove('visible');
            }
        }

              window.colaDeImpresionEtiquetas.splice(index, 1);
              actualizarVistaLista();

/**
 * Valida si un valor existe en una lista. 
 */
function validarValorEnLista(idInput, listaPermitida, nombreCampo) {
  const input = document.getElementById(idInput);
  const valor = input.value.trim().toUpperCase();

  if (valor === "") return false;

  const existe = listaPermitida.some(item => item.toUpperCase() === valor);

  if (!existe) {
    lanzarNotificacion(`⚠️ El ${nombreCampo} "${valor}" no es válido.`, "error");
    input.value = "";
    if(idInput === 'codigoInput') limpiarCampos(); // Limpia ID y Desc si es código
    input.focus();
    return false;
  }
  return true;
}
