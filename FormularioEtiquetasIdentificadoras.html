<script type="text/babel">
  window.cargar_FormularioEtiquetasIdentificadoras = () => {
    const { useState, useEffect, useMemo, useRef } = React;

    // =========================================================
    // CONSTANTES
    // =========================================================
    const TIPO_ETIQUETA_FIJO = "IDENTIFICADORA";
    const ALTO_FIJO = 100;
    const ANCHO_FIJO = 150;

    // =========================================================
    // HELPERS DE NOTIFICACIÓN
    // =========================================================
    const notify_ = (mensaje, tipo = "info", timer = 2500, options = {}) => {
      const fn = window.notificar || window.lanzarNotificacion;
      if (typeof fn === "function") {
        fn(mensaje, tipo, timer, options);
      }
    };

    const createNotifyOnce_ = (ref) => (key, mensaje, tipo = "info", timer = 2500, options = {}, cooldown = 8000) => {
      const now = Date.now();
      const last = ref.current[key] || 0;
      if (now - last < cooldown) return;
      ref.current[key] = now;
      notify_(mensaje, tipo, timer, options);
    };

    const shellNotifyStateRef = { current: {} };
    const notifyOnceShell_ = createNotifyOnce_(shellNotifyStateRef);

    // =========================================================
    // ICONO LOCAL
    // =========================================================
    const LocalIcon = ({ name, size = 18, className = "" }) => {
      const iconRef = useRef(null);

      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name.toLowerCase());
          i.style.width = `${size}px`;
          i.style.height = `${size}px`;
          if (className) i.className = className;
          iconRef.current.appendChild(i);
          window.lucide.createIcons();
        }
      }, [name, size, className]);

      return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
    };

    // =========================================================
    // COMPONENTE PRINCIPAL
    // =========================================================
    const VistaEtiquetasIdentificadoras = () => {
      const [cola, setCola] = useState([]);
      const [procesando, setProcesando] = useState(false);
      const [cargando, setCargando] = useState(true);

      const [mapaCatalogo, setMapaCatalogo] = useState({});
      const [codigos, setCodigos] = useState([]);

      const [form, setForm] = useState({
        codigo: '',
        descripcion: '',
        id: '',
        producto: null
      });

      const codigoInputRef = useRef(null);
      const localNotifyRef = useRef({});
      const notifyOnce_ = createNotifyOnce_(localNotifyRef);

      // =========================================================
      // HELPERS
      // =========================================================
      const normalizarTexto = (valor) => String(valor || "").trim().toUpperCase();

      const enfocarCodigo = () => {
        setTimeout(() => {
          codigoInputRef.current?.focus();
          codigoInputRef.current?.select?.();
        }, 0);
      };

      const limpiarCampos = () => {
        setForm({
          codigo: '',
          descripcion: '',
          id: '',
          producto: null
        });

        enfocarCodigo();
      };

      const guardarBootstrapEnCache = (bootstrap) => {
        window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || {};

        if (bootstrap.codigos) {
          window.DATA_ALMACEN_CACHE.codigos = bootstrap.codigos;
        }

        if (bootstrap.mapaCatalogo) {
          window.DATA_ALMACEN_CACHE.mapaCatalogo = bootstrap.mapaCatalogo;
        }
      };

      const leerCacheEtiquetas = () => {
        const cache = window.DATA_ALMACEN_CACHE || {};
        return {
          mapaCatalogo: cache.mapaCatalogo || cache.mapaProductos || {},
          codigos: cache.codigos || []
        };
      };

      const codigosDisponibles = useMemo(() => {
        const idsEnCola = new Set(
          cola.map(item => normalizarTexto(item.codigo)).filter(Boolean)
        );

        return codigos
          .map(c => normalizarTexto(c))
          .filter(Boolean)
          .filter(c => !idsEnCola.has(c));
      }, [codigos, cola]);

      const resumenCola = useMemo(() => {
        return {
          total: cola.length
        };
      }, [cola]);

      const existeCodigoEnCola = (codigo) => {
        const c = normalizarTexto(codigo);
        if (!c) return false;

        return cola.some(item => normalizarTexto(item.codigo) === c);
      };

      // =========================================================
      // CARGA INICIAL
      // =========================================================
      useEffect(() => {
        const cargarBootstrap = () => {
          try {
            notify_("Inicializando vista de etiquetas identificadoras...", "info", 1600, {
              title: "Cargando vista",
              sound: false
            });

            const cache = leerCacheEtiquetas();

            if (
              Object.keys(cache.mapaCatalogo).length > 0 &&
              Array.isArray(cache.codigos) &&
              cache.codigos.length > 0
            ) {
              setMapaCatalogo(cache.mapaCatalogo);
              setCodigos(cache.codigos.map(x => normalizarTexto(x)));
              setCargando(false);

              notify_("Datos de etiquetas cargados desde memoria local.", "success", 1800, {
                title: "Sistema listo",
                sound: false
              });

              return;
            }

            google.script.run
              .withSuccessHandler((data) => {
                const mapa = data?.mapaCatalogo || {};
                const listaCodigos = (data?.codigos || []).map(x => normalizarTexto(x));

                setMapaCatalogo(mapa);
                setCodigos(listaCodigos);

                guardarBootstrapEnCache({
                  mapaCatalogo: mapa,
                  codigos: listaCodigos
                });

                setCargando(false);

                notify_("Datos de etiquetas cargados correctamente.", "success", 2200, {
                  title: "Sistema listo",
                  sound: false
                });
              })
              .withFailureHandler((err) => {
                console.error("❌ [Etiquetas] Error cargando bootstrap:", err);
                setCargando(false);

                notify_(
                  "No se pudo cargar la información inicial de etiquetas.",
                  "error",
                  4200,
                  {
                    title: "Error de carga",
                    sound: true
                  }
                );
              })
              .FormularioEtiquetasIdentificadorasController_getBootstrap();

          } catch (err) {
            console.error("❌ [Etiquetas] Error inesperado:", err);
            setCargando(false);

            notify_(
              "No se pudo inicializar la vista de etiquetas.",
              "error",
              4200,
              {
                title: "Error inesperado",
                sound: true
              }
            );
          }
        };

        cargarBootstrap();
      }, []);

      useEffect(() => {
        if (!cargando && !procesando) {
          enfocarCodigo();
        }
      }, [cargando, procesando]);

      useEffect(() => {
        const root = document.getElementById("render-etiquetas-identificadoras");
        if (!root) return;

        const parent = root.parentElement;
        if (!parent) return;

        const previousOverflow = parent.style.overflow;
        const previousMinHeight = parent.style.minHeight;
        const previousHeight = parent.style.height;

        parent.style.overflow = "hidden";
        parent.style.minHeight = "0";

        if (!parent.style.height) {
          parent.style.height = "100%";
        }

        return () => {
          parent.style.overflow = previousOverflow;
          parent.style.minHeight = previousMinHeight;
          parent.style.height = previousHeight;
        };
      }, []);

      // =========================================================
      // BUSCAR PRODUCTO
      // =========================================================
      const resolverCodigo = (codigoParam) => {
        const codigo = normalizarTexto(codigoParam);

        if (!codigo) {
          setForm(prev => ({
            ...prev,
            codigo: '',
            descripcion: '',
            id: '',
            producto: null
          }));
          return;
        }

        if (!codigos.map(x => normalizarTexto(x)).includes(codigo)) {
          notify_(
            `El código "${codigo}" no existe.`,
            "error",
            3200,
            {
              title: "Código no válido",
              sound: true
            }
          );

          setForm(prev => ({
            ...prev,
            codigo,
            descripcion: '',
            id: '',
            producto: null
          }));

          return;
        }

        const producto = mapaCatalogo[codigo];

        if (producto) {
          setForm(prev => ({
            ...prev,
            codigo,
            descripcion: producto.descripcion || "",
            id: producto.idproducto || "",
            producto
          }));

          notifyOnce_(
            `codigo-resuelto-${codigo}`,
            "Producto localizado correctamente.",
            "success",
            1300,
            {
              title: "Código encontrado",
              sound: false
            },
            1200
          );

          return;
        }

        notify_("Consultando producto en el servidor...", "info", 1400, {
          title: "Buscando producto",
          sound: false
        });

        google.script.run
          .withSuccessHandler((res) => {
            if (!res || !res.encontrado) {
              notify_(
                `El código "${codigo}" no fue encontrado.`,
                "error",
                3200,
                {
                  title: "Sin resultados",
                  sound: true
                }
              );

              setForm(prev => ({
                ...prev,
                descripcion: '',
                id: '',
                producto: null
              }));

              return;
            }

            const productoFallback = {
              idproducto: res.idproducto || "",
              codigo,
              descripcion: res.descripcion || ""
            };

            setMapaCatalogo(prev => ({
              ...prev,
              productoFallback
            }));

            setForm(prev => ({
              ...prev,
              codigo,
              descripcion: productoFallback.descripcion,
              id: productoFallback.idproducto,
              producto: productoFallback
            }));

            notify_("Producto localizado correctamente.", "success", 1400, {
              title: "Código encontrado",
              sound: false
            });
          })
          .withFailureHandler((err) => {
            console.error("❌ Error buscando producto:", err);

            notify_(
              "Ocurrió un error al buscar el producto.",
              "error",
              4200,
              {
                title: "Error de búsqueda",
                sound: true
              }
            );
          })
          .FormularioEtiquetasIdentificadorasController_buscarProductoPorCodigo(codigo);
      };

      const handleCodigoChange = (e) => {
        const valor = normalizarTexto(e.target.value);

        setForm(prev => ({
          ...prev,
          codigo: valor,
          descripcion: '',
          id: '',
          producto: null
        }));

        const producto = mapaCatalogo[valor];

        if (producto) {
          setForm(prev => ({
            ...prev,
            codigo: valor,
            descripcion: producto.descripcion || "",
            id: producto.idproducto || "",
            producto
          }));
        }
      };

      // =========================================================
      // AGREGAR A COLA
      // =========================================================
      const handleAdd = (e) => {
        if (e && typeof e.preventDefault === 'function') {
          e.preventDefault();
        }

        const codigo = normalizarTexto(form.codigo);

        if (!codigo) {
          notify_(
            "Captura o selecciona un código antes de continuar.",
            "warning",
            2800,
            {
              title: "Código requerido",
              sound: true
            }
          );
          return;
        }

        if (!form.id || !form.descripcion) {
          notify_(
            "El código todavía no se encontró correctamente.",
            "error",
            3200,
            {
              title: "Código inválido",
              sound: true
            }
          );
          return;
        }

        if (existeCodigoEnCola(codigo)) {
          notify_(
            `El código ${codigo} ya está agregado en la fila.`,
            "warning",
            3000,
            {
              title: "Código duplicado",
              sound: true
            }
          );
          return;
        }

        const nuevoItem = {
          tipo: TIPO_ETIQUETA_FIJO,
          codigo,
          descripcion: form.descripcion,
          id: form.id,

          // Metadatos fijos para compatibilidad con el service.
          // La plantilla impresa ya controla el tamaño físico.
          alto: ALTO_FIJO,
          ancho: ANCHO_FIJO,

          rowId: `${Date.now()}&${codigo}&#ETIQ`
        };

        setCola(prev => [nuevoItem, ...prev]);

        notify_("Etiqueta añadida correctamente a la fila.", "success", 1500, {
          title: "Añadido a fila",
          sound: false
        });

        limpiarCampos();
      };

      // =========================================================
      // GENERAR / IMPRIMIR
      // =========================================================
      const generar = () => {
        if (cola.length === 0) {
          notify_(
            "Agrega etiquetas a la lista antes de imprimir.",
            "warning",
            3200,
            {
              title: "Fila vacía",
              sound: true
            }
          );
          return;
        }

        if (
          !window.ImpresionModoUtilidades ||
          typeof window.ImpresionModoUtilidades.getMode !== "function" ||
          typeof window.ImpresionModoUtilidades.imprimirResultado !== "function"
        ) {
          notify_(
            "No se encontró el módulo global de impresión.",
            "error",
            4200,
            {
              title: "Impresión no disponible",
              sound: true
            }
          );
          return;
        }

        setProcesando(true);

        const modoImpresion = window.ImpresionModoUtilidades.getMode();

        let ventanaLocal = null;

        if (modoImpresion === "LOCAL") {
          ventanaLocal = window.open("", "_blank", "width=900,height=700");

          if (!ventanaLocal) {
            setProcesando(false);

            notify_(
              "La ventana fue bloqueada. Permite los pop-ups para continuar.",
              "warning",
              4200,
              {
                title: "Pop-up bloqueado",
                sound: true
              }
            );

            return;
          }

          ventanaLocal.document.open();
          ventanaLocal.document.write(`
            <html>
              <head>
                <title>Generando etiquetas...</title>
                <style>
                  body {
                    font-family: Arial, sans-serif;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    height: 100vh;
                    margin: 0;
                    color: #5f6368;
                    background-color: #f8f9fa;
                  }

                  .spinner {
                    width: 50px;
                    height: 50px;
                    border: 5px solid #f3f3f3;
                    border-top: 5px solid #d93025;
                    border-radius: 50%;
                    animation: spin 1s linear infinite;
                    margin-bottom: 20px;
                  }

                  @keyframes spin {
                    0% { transform: rotate(0deg); }
                    100% { transform: rotate(360deg); }
                  }

                  .loader {
                    text-align: center;
                    max-width: 420px;
                    padding: 0 24px;
                  }

                  .loader h3 {
                    margin: 0 0 8px 0;
                    font-size: 22px;
                    font-weight: 700;
                    color: #1c1d1f;
                    letter-spacing: 0.04em;
                  }

                  .loader p {
                    margin: 0;
                    font-size: 14px;
                    color: #5f6368;
                    line-height: 1.5;
                  }
                </style>
              </head>
              <body>
                <div class="spinner"></div>
                <div class="loader">
                  <h3>Preparando etiquetas...</h3>
                  <p>Espera un momento mientras se genera la impresión de etiquetas identificadoras.</p>
                </div>
              </body>
            </html>
          `);
          ventanaLocal.document.close();
        }

        notify_(
          modoImpresion === "ONLINE"
            ? "Preparando etiquetas identificadoras para impresión ONLINE..."
            : "Preparando etiquetas identificadoras para impresión LOCAL...",
          "info",
          1800,
          {
            title: "Generando etiquetas",
            sound: false
          }
        );

        google.script.run
          .withSuccessHandler((resultado) => {
            const res = typeof resultado === "string"
              ? {
                  ok: true,
                  htmlImpresion: resultado,
                  printJob: null,
                  legacy: true
                }
              : resultado;

            if (!res || !res.htmlImpresion) {
              if (ventanaLocal && !ventanaLocal.closed) {
                ventanaLocal.close();
              }

              setProcesando(false);

              notify_(
                "No se recibió una impresión válida desde el servidor.",
                "error",
                4200,
                {
                  title: "Respuesta inválida",
                  sound: true
                }
              );

              return;
            }

            const modoActual = window.ImpresionModoUtilidades.getMode();

            if (modoActual === "ONLINE" && !res.printJob) {
              if (ventanaLocal && !ventanaLocal.closed) {
                ventanaLocal.close();
              }

              setProcesando(false);

              notify_(
                "La vista generó HTML, pero no generó paquete ONLINE.",
                "error",
                5200,
                {
                  title: "Impresión ONLINE no disponible",
                  sound: true
                }
              );

              return;
            }

            try {
              window.ImpresionModoUtilidades.imprimirResultado(res, {
                titulo: "Etiquetas identificadoras",
                fallbackLocal: false,
                ventanaLocal: ventanaLocal
              });

              setCola([]);
              limpiarCampos();
              setProcesando(false);

              notify_(
                modoActual === "ONLINE"
                  ? "Etiquetas identificadoras enviadas por ONLINE."
                  : "Etiquetas identificadoras listas para impresión LOCAL.",
                "success",
                2800,
                {
                  title: modoActual === "ONLINE"
                    ? "Impresión ONLINE"
                    : "Impresión LOCAL",
                  sound: true
                }
              );

            } catch (errorImpresion) {
              console.error("❌ Error ejecutando impresión:", errorImpresion);

              if (ventanaLocal && !ventanaLocal.closed) {
                ventanaLocal.close();
              }

              setProcesando(false);

              notify_(
                errorImpresion && errorImpresion.message
                  ? errorImpresion.message
                  : "No se pudo ejecutar la impresión.",
                "error",
                5200,
                {
                  title: "Error de impresión",
                  sound: true
                }
              );
            }
          })
          .withFailureHandler((err) => {
            if (ventanaLocal && !ventanaLocal.closed) {
              ventanaLocal.close();
            }

            console.error("❌ Error al generar etiquetas:", err);
            setProcesando(false);

            notify_(
              err && err.message
                ? err.message
                : "No se pudieron generar las etiquetas.",
              "error",
              4200,
              {
                title: "Error de impresión",
                sound: true
              }
            );
          })
          .FormularioEtiquetasIdentificadorasController_procesarLote(cola);
      };

      // =========================================================
      // UI
      // =========================================================
      return (
        <div className="ei-app-shell flex flex-col h-full w-full relative">
          <div className="ei-main-layout">

            {/* PANEL LATERAL */}
            <div className="ei-left-panel border-r border-[#dadce0] bg-white px-6 pt-4 pb-6 shrink-0 z-10">
              <form onSubmit={handleAdd} className="h-full flex flex-col">

                <div className="ei-form-grid">

                  {/* CÓDIGO */}
                  <div className="ei-grid-codigo ei-field-block">
                    <label className="ei-label ml-1">
                      Código
                    </label>

                    <div className="relative group">
                      <input
                        ref={codigoInputRef}
                        list="lista-codigos-identificadoras"
                        disabled={cargando || procesando}
                        className={`w-full border rounded-xl px-4 ei-input ei-form-input-unificado uppercase outline-none transition-all ${
                          cargando || procesando
                            ? 'bg-gray-200 cursor-not-allowed text-gray-500'
                            : 'bg-gray-50 border-[#dadce0] focus:border-[#d93025] focus:bg-white'
                        }`}
                        placeholder={cargando ? "Cargando catálogo..." : "Selecciona un código"}
                        value={form.codigo}
                        onChange={handleCodigoChange}
                        onBlur={() => resolverCodigo(form.codigo)}
                        onKeyDown={(e) => {
                          if (e.key !== "Enter") return;
                          e.preventDefault();

                          const codigo = normalizarTexto(e.currentTarget.value);

                          if (!codigo) {
                            notify_(
                              "Captura un código válido antes de continuar.",
                              "warning",
                              2200,
                              {
                                title: "Código vacío",
                                sound: true
                              }
                            );
                            return;
                          }

                          resolverCodigo(codigo);

                          setTimeout(() => {
                            handleAdd({
                              preventDefault: () => {}
                            });
                          }, 80);
                        }}
                      />

                      <datalist id="lista-codigos-identificadoras">
                        {codigosDisponibles.map((codigo, index) => (
                          <option key={`${index}-${codigo}`} value={codigo} />
                        ))}
                      </datalist>

                      {form.id && (
                        <div className="absolute right-3 top-3 text-green-500 animate-pulse">
                          <LocalIcon name="check-circle" size={16} />
                        </div>
                      )}
                    </div>
                  </div>

                  {/* ID PRODUCTO */}
                  <div className="ei-grid-id ei-field-block">
                    <label className="ei-label ml-1">
                      ID producto
                    </label>

                    <input
                      type="text"
                      readOnly
                      className="w-full border rounded-xl px-4 ei-input ei-form-input-unificado uppercase outline-none transition-all bg-gray-200 text-gray-600 cursor-not-allowed border-gray-300 ei-mono"
                      placeholder="ID automático"
                      value={form.id}
                    />
                  </div>

                  {/* TARJETA PRODUCTO */}
                  <div className="ei-grid-producto">
                    {form.codigo ? (
                      <div className="ei-id-card bg-[#1c1d1f] space-y-3 border border-gray-800 fade-in shadow-xl">
                        <div className="flex items-start gap-2.5">
                          <div className="p-1.5 bg-gray-800 rounded-lg">
                            <LocalIcon name="tag" size={15} className="text-red-500" />
                          </div>

                          <div className="flex flex-col min-w-0">
                            <span className="text-[12px] font-black text-gray-500 uppercase tracking-[0.18em]">
                              Código vinculado
                            </span>
                            <span className="text-white ei-mono text-[17px] font-black mt-1 break-all">
                              {form.codigo || "Sin código"}
                            </span>
                          </div>
                        </div>

                        <div className="flex items-start gap-2.5 border-t border-gray-800 pt-2.5">
                          <div className="p-1.5 bg-gray-800 rounded-lg">
                            <LocalIcon name="file-text" size={15} className="text-red-500" />
                          </div>

                          <div className="flex flex-col min-w-0">
                            <span className="text-[12px] font-black text-gray-500 uppercase tracking-[0.18em]">
                              Descripción
                            </span>
                            <span className="text-gray-300 text-[15px] font-bold leading-snug uppercase italic mt-1 break-words">
                              {form.descripcion || "No se encontró registro en la base de datos"}
                            </span>
                          </div>
                        </div>
                      </div>
                    ) : (
                      <div className="ei-product-placeholder">
                        <div>
                          <div className="ei-product-placeholder-title">
                            Esperando código
                          </div>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* TAMAÑO FIJO */}
                  <div className="ei-grid-tamano">
                    <div className="ei-size-card px-3 pt-1.5 pb-3 rounded-xl bg-slate-100 border border-slate-200">
                      <span className="text-[10px] font-black uppercase tracking-widest text-slate-600">
                        Tamaño fijo
                      </span>
                      <p className="text-[12px] font-semibold text-slate-700 mt-1 leading-snug">
                        Todas las etiquetas identificadoras se imprimen sobre las etiquetas de 150 mm x 100 mm.
                      </p>
                    </div>
                  </div>

                  {/* BOTÓN */}
                  <div className="ei-grid-accion">
                    <button
                      type="submit"
                      disabled={cargando || procesando}
                      className="ei-action-btn w-full bg-[#d93025] hover:bg-[#a50e0e] text-white py-4 rounded-xl font-black uppercase text-[16px] tracking-[0.18em] shadow-lg shadow-red-100 transition-all flex items-center justify-center gap-3 disabled:opacity-50 disabled:pointer-events-none"
                    >
                      <LocalIcon name="plus" size={25} />
                      Añadir a fila
                    </button>
                  </div>

                </div>
              </form>
            </div>

            {/* TABLA DE RESULTADOS */}
            <div className="ei-right-panel min-w-0 ei-results-shell">

              <div className="ei-results-toolbar bg-white border-b border-gray-200 px-4 py-4 flex items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <div className="w-11 h-11 rounded-2xl bg-[#1c1d1f] text-white flex items-center justify-center shadow-md">
                    <LocalIcon name="list-checks" size={22} />
                  </div>

                  <div className="flex flex-col">
                    <span className="text-[11px] font-black uppercase tracking-[0.22em] text-gray-400">
                      Fila de impresión
                    </span>
                    <span className="text-[15px] font-black uppercase tracking-[0.08em] text-gray-900">
                      {resumenCola.total} {resumenCola.total === 1 ? 'etiqueta añadida' : 'etiquetas añadidas'}
                    </span>
                  </div>
                </div>

              </div>

              <div className="ei-table-scroll custom-scroll-container">

                <table className="ei-results-table">
                  <thead className="ei-results-head">
                    <tr>
                      <th className="text-center">
                        Código / Descripción
                      </th>
                      <th className="text-center">
                        Tipo
                      </th>
                      <th className="text-center">
                        ID
                      </th>
                      <th className="text-center">
                        Acción
                      </th>
                    </tr>
                  </thead>

                  <tbody>
                    {cola.map(item => (
                      <tr key={item.rowId} className="ei-results-row fade-in">
                        <td>
                          <div className="flex flex-col">
                            <span className="ei-code-main">{item.codigo}</span>
                            <span className="ei-desc">
                              {item.descripcion || 'SIN DESCRIPCIÓN'}
                            </span>
                          </div>
                        </td>

                        <td className="text-center">
                          <span className="ei-type-chip">
                            {item.tipo}
                          </span>
                        </td>

                        <td className="text-center">
                          <span className="ei-id-pill">
                            {item.id}
                          </span>
                        </td>

                        <td className="text-center">
                          <button
                            type="button"
                            onClick={() => {
                              setCola(prev => prev.filter(c => c.rowId !== item.rowId));
                              notify_("Etiqueta removida de la fila.", "warning", 1400, {
                                title: "Elemento removido",
                                sound: false
                              });
                              enfocarCodigo();
                            }}
                            className="ei-delete-btn"
                            title="Quitar de la fila"
                          >
                            <LocalIcon name="trash-2" size={16} />
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>

                {cola.length === 0 && (
                  <div className="ei-empty-state">
                    <LocalIcon name="package" size={52} />
                    <p className="ei-empty-title">
                      Esperando etiquetas
                    </p>
                    <p className="ei-empty-sub">
                      Las etiquetas añadidas aparecerán aquí
                    </p>
                  </div>
                )}

              </div>
            </div>
          </div>

          {/* BOTÓN FINAL */}
          {cola.length > 0 && (
            <div className="absolute bottom-6 right-6 z-30">
              <button
                type="button"
                onClick={generar}
                disabled={procesando}
                className="bg-[#1c1d1f] hover:bg-black text-white px-6 py-4 rounded-2xl shadow-xl font-black uppercase tracking-[0.15em] flex items-center gap-3 disabled:opacity-50 disabled:pointer-events-none"
              >
                <LocalIcon
                  name={procesando ? "loader-2" : "printer"}
                  size={20}
                  className={procesando ? "animate-spin" : ""}
                />
                {procesando
                  ? "Procesando..."
                  : `Imprimir ${resumenCola.total} ${resumenCola.total === 1 ? "etiqueta" : "etiquetas"}`
                }
              </button>
            </div>
          )}
        </div>
      );
    };


    // =========================================================
    // RENDER EN CONTENEDOR
    // =========================================================
    const rootDiv = document.getElementById('render-etiquetas-identificadoras');

    if (!rootDiv) {
      notify_(
        "No se encontró el contenedor principal de etiquetas identificadoras.",
        "error",
        4200,
        {
          title: "Error de interfaz",
          sound: true
        }
      );
      console.warn("⚠️ [Etiquetas] No se encontró #render-etiquetas-identificadoras");
      return;
    }

    const yaInicializado = rootDiv.dataset.eiMounted === "1";

    if (window.__FORMULARIO_ETIQUETAS_IDENTIFICADORAS_ROOT__) {
      try {
        window.__FORMULARIO_ETIQUETAS_IDENTIFICADORAS_ROOT__.unmount();
      } catch (e) {
        console.warn("⚠️ [Etiquetas] No se pudo desmontar root previo:", e);
        notifyOnceShell_(
          "etiquetas-root-previo",
          "Se liberó una instancia previa de etiquetas identificadoras.",
          "warning",
          1600,
          {
            title: "Reinicialización",
            sound: false
          },
          10000
        );
      }
      window.__FORMULARIO_ETIQUETAS_IDENTIFICADORAS_ROOT__ = null;
    }

    try {
      rootDiv.dataset.eiMounted = "1";
      window.__FORMULARIO_ETIQUETAS_IDENTIFICADORAS_ROOT__ = ReactDOM.createRoot(rootDiv);
      window.__FORMULARIO_ETIQUETAS_IDENTIFICADORAS_ROOT__.render(<VistaEtiquetasIdentificadoras />);

      if (!yaInicializado) {
        notifyOnceShell_(
          "etiquetas-vista-montada",
          "Vista de etiquetas identificadoras lista para operar.",
          "success",
          1500,
          {
            title: "Vista cargada",
            sound: false
          },
          12000
        );
      }
    } catch (e) {
      console.error("❌ [Etiquetas] Error montando root React:", e);
      notify_(
        "Ocurrió un error al montar la vista de etiquetas identificadoras.",
        "error",
        4200,
        {
          title: "Error de montaje",
          sound: true
        }
      );
    }
  };

  window.initVista = window.cargar_FormularioEtiquetasIdentificadoras;
  console.log("🏷️ [FormularioEtiquetasIdentificadoras] initVista definida:", typeof window.initVista);
</script>
