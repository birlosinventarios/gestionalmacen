<script>
  /**
   * Reabastecimiento.html
   *
   * Vista principal del módulo de solicitudes de Reabastecimiento.
   *
   * RESPONSABILIDADES
   * - Consultar el listado ligero de solicitudes.
   * - Filtrar por estado, bodega, texto y orden cronológico.
   * - Mostrar indicadores operativos derivados del listado cargado.
   * - Navegar a la creación o atención mediante el Shell APPALMACEN.
   * - Exportar el conjunto visible a XLSX cuando el exportador esté disponible.
   * - Administrar el montaje y desmontaje de su raíz React.
   *
   * RESPONSABILIDADES EXCLUIDAS
   * - No consulta candidatos de reabastecimiento.
   * - No crea solicitudes ni registra IDUNICO.
   * - No calcula estados, fechas, folios o cantidades autoritativas.
   *
   * DEPENDENCIAS GLOBALES
   * - React y ReactDOM.
   * - FitoComponents.Icon.LocalIcon o FitoComponents.LocalIcon.
   * - google.script.run.
   * - window.irAVistaShell().
   * - window.notificar o window.lanzarNotificacion.
   * - ExcelExportUtils.exportarAXLSX(), opcional.
   *
   * - window.REAB (z0-ReabastecimientoCliente.html): tracker de rendimiento,
   *   RPC medido, usuario recordado y sincronización en tiempo real.
   *
   * CONTROLADORES CONSUMIDOS
   * - ReabastecimientoController_getSolicitudes({}).
   * - ReabastecimientoController_tomarSolicitud({idSolicitud, usuario}).
   * - ReabastecimientoController_getRevision(ids)           (vía REAB.sync).
   * - ReabastecimientoController_registrarRendimiento(lote) (vía REAB.perf).
   *
   * CONTRATOS GLOBALES EXPUESTOS
   * - window.cargar_Reabastecimiento().
   * - window.initVista.
   * - window.__REABASTECIMIENTO_ROOT__.
   *
   * CONSIDERACIONES DE MANTENIMIENTO
   * - Las respuestas obsoletas se descartan mediante un número de secuencia.
   * - El watchdog de la consulta se activa a los 30 segundos.
   * - Tiempo real: REAB.sync revisa cada pocos segundos un contador de cambios
   *   (sin leer hojas) y recarga el listado solo cuando otro usuario modificó
   *   datos. Recarga completa de seguridad cada 5 minutos con pestaña visible.
   * - initVista devuelve una función de limpieza compatible con APPALMACEN.html.
   * - El servidor permanece como autoridad de los datos operativos.
   *
   * @author Sigifredo de la Cruz Ramos
   * @version REABASTECIMIENTO-VIEW-2026-11-20-01
   */
</script>

<script type="text/babel">
  /* ==========================================================================
   * Reabastecimiento · Listado / cola de trabajo (React + Babel en navegador)
   * ==========================================================================
   *
   * PROPÓSITO (proceso REABASTECIMIENTO-v1, sección 2, puntos 1 a 4)
   * - Mostrar las solicitudes vigentes ordenadas por fecha, hora, bodega, área
   *   y solicitante, con su avance en tiempo real.
   * - ATENDER / CONTINUAR registra al auxiliar (y el inicio en la primera toma)
   *   antes de abrir el detalle operativo.
   *
   * MEDICIÓN DE RENDIMIENTO (REAB.perf → hoja APPALMACEN_RENDIMIENTO)
   *   LISTADO_VISTA_MONTADA   initVista → primera tabla pintada
   *   LISTADO_CARGAR          consulta de solicitudes (motivo en meta.reason:
   *                           init, manual, sync, confirmation, seguridad)
   *   LISTADO_ATENDER         clic ATENDER/CONTINUAR → navegación al detalle
   *   LISTADO_FILTRAR         cambio de filtro, búsqueda u orden (re-render)
   *   LISTADO_EXPORTAR        exportación a Excel
   *
   * TIEMPO REAL
   * - REAB.sync avisa cuando cambia la revisión global (otro usuario creó,
   *   tomó, surtió o cerró). El listado se recarga en segundo plano y muestra
   *   "Información actualizada". Una recarga de seguridad corre cada 5 minutos.
   * ======================================================================== */
  window.cargar_Reabastecimiento = () => {
    const { useState, useEffect, useMemo, useCallback, useRef } = React;
    const LocalIcon = window.FitoComponents?.Icon?.LocalIcon || window.FitoComponents?.LocalIcon;
    const REAB = window.REAB;

    if (!LocalIcon) {
      throw new Error("No se encontró FitoComponents.Icon.LocalIcon.");
    }
    if (!REAB) {
      throw new Error("No se encontró la biblioteca z0-ReabastecimientoCliente (window.REAB).");
    }

    /** Nombre de la vista en la bitácora de rendimiento. */
    const VIEW_ = "Reabastecimiento";

    /** Traza de montaje: se cierra con la primera tabla pintada. */
    const mountTrace_ = REAB.perf.begin("LISTADO_VISTA_MONTADA", { view: VIEW_, type: "CARGA" });

    /** Emite una notificación mediante la infraestructura global del Shell. */
    const notify_ = (message, type = "info", timer = 2500, options = {}) => {
      const handler = window.notificar || window.lanzarNotificacion;
      if (typeof handler === "function") handler(message, type, timer, options);
    };

    /** Normaliza valores de texto para búsqueda y comparación. */
    const normalize_ = (value) => String(value ?? "").trim().toUpperCase();

    /** Convierte una fecha dd/MM/yyyy o ISO a milisegundos para ordenar. */
    const dateValue_ = (value) => {
      const text = String(value || "").trim();
      const match = text.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (match) return new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1])).getTime();
      const parsed = new Date(text);
      return Number.isNaN(parsed.getTime()) ? 0 : parsed.getTime();
    };

    /** Estados derivados por el servidor (proceso REABASTECIMIENTO-v1, 7.1). */
    const OPEN_STATES_ = ["CREADA", "ABIERTA", "ASIGNADA", "EN_ATENCION", "PARCIALMENTE_ATENDIDA", "ATENDIDA"];
    const WORKING_STATES_ = ["ASIGNADA", "EN_ATENCION", "PARCIALMENTE_ATENDIDA", "ATENDIDA"];

    /** Devuelve la clase visual asociada al estado derivado. */
    const statusClass_ = (status) => ({
      CREADA: "rb-chip rb-status-open",
      ABIERTA: "rb-chip rb-status-open",
      ASIGNADA: "rb-chip rb-status-attention",
      EN_ATENCION: "rb-chip rb-status-attention",
      PARCIALMENTE_ATENDIDA: "rb-chip rb-status-attention",
      ATENDIDA: "rb-chip rb-status-done",
      CERRADA: "rb-chip rb-status-closed",
      CERRADA_CON_PENDIENTES: "rb-chip rb-status-inconsistent",
      INCONSISTENTE: "rb-chip rb-status-inconsistent",
    }[normalize_(status)] || "rb-chip rb-status-inconsistent");

    /** Devuelve la etiqueta legible del estado. */
    const statusLabel_ = (status) => ({
      CREADA: "CREADA",
      ABIERTA: "CREADA",
      ASIGNADA: "ASIGNADA",
      EN_ATENCION: "EN ATENCIÓN",
      PARCIALMENTE_ATENDIDA: "PARCIALMENTE ATENDIDA",
      ATENDIDA: "ATENDIDA · POR CERRAR",
      CERRADA: "CERRADA",
      CERRADA_CON_PENDIENTES: "CERRADA CON PENDIENTES",
      INCONSISTENTE: "DATOS INCONSISTENTES",
    }[normalize_(status)] || normalize_(status).replaceAll("_", " ") || "SIN ESTADO");

    /**
     * Botón de acción según el proceso (2, punto 3):
     * ATENDER, CONTINUAR, INCONSISTENTE (cerrada con pendientes) o VER DETALLES.
     */
    const actionFor_ = (status) => {
      const value = normalize_(status);
      if (value === "CREADA" || value === "ABIERTA") return { label: "Atender", icon: "play", className: "primary", take: true };
      if (WORKING_STATES_.includes(value)) return { label: "Continuar", icon: "play", className: "primary", take: true };
      if (value === "CERRADA_CON_PENDIENTES") return { label: "Inconsistente", icon: "triangle-alert", className: "warning", take: false };
      if (value === "INCONSISTENTE") return { label: "Revisar", icon: "triangle-alert", className: "warning", take: false };
      return { label: "Ver detalles", icon: "arrow-up-right", className: "", take: false };
    };

    /**
     * Indicador de sincronización en tiempo real ("En vivo · hh:mm:ss").
     * Escucha REAB.sync.onStatus(); el punto verde pulsa mientras hay conexión.
     */
    const SyncBadge_ = () => {
      const [status, setStatus] = useState({ state: "idle", lastCheckAt: null });
      useEffect(() => REAB.sync.onStatus(setStatus), []);
      const label = status.state === "error"
        ? "Sin conexión"
        : status.lastCheckAt
          ? `En vivo · ${REAB.util.clock(status.lastCheckAt)}`
          : "Conectando...";
      return <span className={`rb-sync ${status.state}`} title="Sincronización en tiempo real"><i />{label}</span>;
    };

    /** Valor ordenable de fecha + hora de creación. */
    const dateTimeValue_ = (item) => {
      const base = dateValue_(item?.fechaCreacion);
      const match = String(item?.horaCreacion || "").match(/^(\d{1,2}):(\d{2})/);
      return base + (match ? (Number(match[1]) * 60 + Number(match[2])) * 60000 : 0);
    };

    /** Componente principal del listado de Reabastecimiento. */
    const Dashboard = () => {
      const [requests, setRequests] = useState([]);
      const [loading, setLoading] = useState(true);
      const [statusFilter, setStatusFilter] = useState("VIGENTES");
      /** Usuario que atiende en este equipo (prototipo: lista + recordado). */
      const users = useMemo(() => REAB.user.catalog(), []);
      const [currentUser, setCurrentUser] = useState(() => REAB.user.get());
      const [takingId, setTakingId] = useState("");
      const [warehouseFilter, setWarehouseFilter] = useState("TODAS");
      const [sortBy, setSortBy] = useState("FECHA_DESC");
      const [searchQuery, setSearchQuery] = useState("");
      const [searchExpanded, setSearchExpanded] = useState(false);
      const [searchClosing, setSearchClosing] = useState(false);
      const [activeRow, setActiveRow] = useState(null);
      const [recentRequestId, setRecentRequestId] = useState("");
      const [syncState, setSyncState] = useState({
        status: "idle",
        message: "",
        lastSuccessAt: 0,
      });
      const recentRequestRef = useRef(
        String(
          window.REABASTECIMIENTO_ULTIMA_SOLICITUD ||
          window.DATA_ALMACEN_CACHE?.reabastecimientoUltimaSolicitud ||
          ""
        ).trim()
      );
      const searchRef = useRef(null);
      const inFlightRef = useRef(false);
      const pendingRefreshRef = useRef(null);
      const sequenceRef = useRef(0);
      const watchdogRef = useRef(null);
      const retryTimersRef = useRef(new Set());
      const mountedRef = useRef(true);
      const perfTraceRef = useRef(null);

      /**
       * Consulta solicitudes y descarta respuestas obsoletas.
       * @param {"init"|"manual"|"auto"} context Origen de la actualización.
       */
      /**
       * Identifica la forma de una respuesta sin registrar datos operativos.
       * @param {*} response Respuesta recibida de google.script.run.
       * @return {!Object} Metadatos estructurales no sensibles.
       */
      const describeResponse_ = (response) => ({
        type: response === null ? "null" : Array.isArray(response) ? "array" : typeof response,
        keys: response && typeof response === "object"
          ? Object.keys(response).slice(0, 20)
          : [],
        ok: response?.ok,
        operation: response?.operation || "",
        hasData: Boolean(response?.data),
        dataKeys: response?.data && typeof response.data === "object"
          ? Object.keys(response.data).slice(0, 20)
          : [],
        contractVersion:
          response?.metadata?.contractVersion ||
          response?.data?.contractVersion ||
          "legacy",
      });

      /**
       * Adapta contratos compatibles sin convertir silenciosamente errores en [].
       *
       * Contratos admitidos:
       * - Actual: {ok:true,data:{solicitudes,total}}.
       * - Legado: {solicitudes,total}.
       * - Legado mínimo: Array<Solicitud>.
       * - JSON textual de cualquiera de los anteriores.
       */
      const parseResponse_ = (rawResponse) => {
        let response = rawResponse;
        if (typeof response === "string") {
          try {
            response = JSON.parse(response);
          } catch (_) {
            throw new Error("El Controller devolvió texto que no contiene JSON válido.");
          }
        }

        if (response?.ok === false) {
          throw new Error(
            response?.message || response?.error?.message ||
            "El Controller reportó una operación no exitosa."
          );
        }

        let payload = null;
        let contractMode = "unknown";
        if (response?.ok === true && response?.data) {
          payload = response.data;
          contractMode = "envelope-v2";
        } else if (response && Array.isArray(response.solicitudes)) {
          payload = response;
          contractMode = "legacy-object";
        } else if (Array.isArray(response)) {
          payload = { solicitudes: response, total: response.length };
          contractMode = "legacy-array";
        }

        if (!payload || !Array.isArray(payload.solicitudes)) {
          const shape = describeResponse_(response);
          throw new Error(
            "Contrato incompatible de Reabastecimiento. " +
            `Tipo=${shape.type}; claves=${shape.keys.join(",") || "ninguna"}.`
          );
        }

        const total = payload.total;
        if (
          total !== undefined &&
          total !== null &&
          Number.isFinite(Number(total)) &&
          Number(total) !== payload.solicitudes.length
        ) {
          throw new Error("Contrato inválido: total no coincide con solicitudes.");
        }

        return {
          records: payload.solicitudes,
          contractMode,
          responseShape: describeResponse_(response),
        };
      };

      /** Programa una confirmación del folio sin borrar prematuramente la señal. */
      const scheduleConfirmationRetry_ = useCallback((attempt) => {
        const delays = [400, 1200, 3000];
        if (!mountedRef.current || attempt >= delays.length) return;
        const timer = setTimeout(() => {
          retryTimersRef.current.delete(timer);
          refresh("confirmation", attempt + 1);
        }, delays[attempt]);
        retryTimersRef.current.add(timer);
      }, []);

      /**
       * Máquina de actualización resistente a solapamientos y respuestas obsoletas.
       * Mantiene la señal de navegación hasta confirmar el folio recién creado.
       */
      const refresh = useCallback((context = "init", confirmationAttempt = 0) => {
        if (typeof google === "undefined" || !google.script?.run) {
          setLoading(false);
          setSyncState({ status: "error", message: "google.script.run no está disponible.", lastSuccessAt: 0 });
          return;
        }
        if (inFlightRef.current) {
          pendingRefreshRef.current = { context, confirmationAttempt };
          return;
        }

        const sequence = ++sequenceRef.current;
        /*
         * Traza LISTADO_CARGAR: RPC_SENT → RPC_RESPONSE → PARSED → RENDERED.
         * Los contextos silenciosos ("auto", "sync", "seguridad") no muestran
         * el indicador de carga para no interrumpir la lectura de la tabla.
         */
        const trace = REAB.perf.begin("LISTADO_CARGAR", {
          view: VIEW_,
          type: context === "sync" ? "SINCRONIZACION" : "CONSULTA",
          meta: { reason: context, confirmationAttempt, expectedRequest: Boolean(recentRequestRef.current) },
        });
        perfTraceRef.current = trace;
        const silent = ["auto", "sync", "seguridad"].includes(context);
        inFlightRef.current = true;
        setSyncState((previous) => ({ ...previous, status: "loading", message: "" }));
        if (!silent) setLoading(true);
        clearTimeout(watchdogRef.current);
        watchdogRef.current = setTimeout(() => {
          if (!mountedRef.current || sequenceRef.current !== sequence) return;
          sequenceRef.current += 1;
          inFlightRef.current = false;
          setLoading(false);
          setSyncState({ status: "timeout", message: "La consulta excedió 30 segundos.", lastSuccessAt: 0 });
          trace.mark("WATCHDOG");
          trace.end("timeout", { meta: { watchdogMs: 30000 } });
          const pending = pendingRefreshRef.current;
          pendingRefreshRef.current = null;
          if (pending) refresh(pending.context, pending.confirmationAttempt);
        }, 30000);

        const sentAt = REAB.util.now();
        trace.mark("RPC_SENT", { method: "ReabastecimientoController_getSolicitudes" });
        google.script.run
          .withSuccessHandler((response) => {
            if (!mountedRef.current || sequenceRef.current !== sequence) {
              trace.end("cancelled", { meta: { stale: true } });
              return;
            }
            clearTimeout(watchdogRef.current);
            trace.mark("RPC_RESPONSE");
            trace.attachServer(response?.metadata?.perf || { serverMs: response?.metadata?.elapsedMs }, REAB.util.now() - sentAt, REAB.util.bytes(response));
            if (Number.isFinite(Number(response?.metadata?.revision))) REAB.sync.noteRevision(Number(response.metadata.revision));
            try {
              const parsed = parseResponse_(response);
              const records = parsed.records;
              trace.mark("PARSED", { rows: records.length });
              trace.set({ rows: records.length, contractMode: parsed.contractMode });
              setRequests(records);
              trace.endAfterPaint("ok");
              if (!mountTrace_.ended) mountTrace_.endAfterPaint("ok", { meta: { rows: records.length } });
              const recentId = recentRequestRef.current;
              const foundRecent = Boolean(
                recentId && records.some((item) => item.idSolicitud === recentId)
              );

              if (foundRecent) {
                setRecentRequestId(recentId);
                const timer = setTimeout(() => {
                  retryTimersRef.current.delete(timer);
                  if (mountedRef.current) setRecentRequestId("");
                }, 8000);
                retryTimersRef.current.add(timer);
              }

              if (!recentId || foundRecent) {
                delete window.REABASTECIMIENTO_REFRESH_REQUIRED;
                delete window.REABASTECIMIENTO_ULTIMA_SOLICITUD;
                if (window.DATA_ALMACEN_CACHE) {
                  delete window.DATA_ALMACEN_CACHE.reabastecimientoRefreshRequired;
                  delete window.DATA_ALMACEN_CACHE.reabastecimientoUltimaSolicitud;
                }
                recentRequestRef.current = "";
              } else if (confirmationAttempt < 3) {
                setSyncState({
                  status: "confirming",
                  message: "La solicitud fue creada y se está confirmando en el listado.",
                  lastSuccessAt: Date.now(),
                });
                scheduleConfirmationRetry_(confirmationAttempt);
              } else {
                setSyncState({
                  status: "warning",
                  message: "El listado respondió, pero todavía no contiene la solicitud recién creada. Usa Actualizar antes de reintentar la creación.",
                  lastSuccessAt: Date.now(),
                });
              }

              if (!recentId || foundRecent) {
                setSyncState({ status: "ready", message: "", lastSuccessAt: Date.now() });
              }
              trace.set({ expectedFound: foundRecent });
              if (context === "manual") {
                notify_("Solicitudes actualizadas correctamente.", "success", 1800, {
                  title: "Actualización completada",
                  sound: false,
                });
              }
            } catch (contractError) {
              setSyncState({ status: "error", message: contractError.message, lastSuccessAt: 0 });
              trace.end("error", { error: contractError, meta: { stage: "contract" } });
              notify_(contractError.message, "error", 5200, { title: "Respuesta incompatible", sound: true });
            } finally {
              inFlightRef.current = false;
              setLoading(false);
              const pending = pendingRefreshRef.current;
              pendingRefreshRef.current = null;
              if (pending) refresh(pending.context, pending.confirmationAttempt);
            }
          })
          .withFailureHandler((error) => {
            if (!mountedRef.current || sequenceRef.current !== sequence) {
              trace.end("cancelled", { meta: { stale: true } });
              return;
            }
            clearTimeout(watchdogRef.current);
            inFlightRef.current = false;
            setLoading(false);
            trace.mark("RPC_FAILURE");
            trace.end("error", { error, meta: { stage: "server" } });
            const message = REAB.util.publicError(error) || "No se pudieron cargar las solicitudes.";
            setSyncState({ status: "error", message, lastSuccessAt: 0 });
            notify_(message, "error", 5200, { title: "Error de Reabastecimiento", sound: true });
            const pending = pendingRefreshRef.current;
            pendingRefreshRef.current = null;
            if (pending) refresh(pending.context, pending.confirmationAttempt);
          })
          .ReabastecimientoController_getSolicitudes({});
      }, [scheduleConfirmationRetry_]);
      useEffect(() => {
        const forceRefresh =
          window.REABASTECIMIENTO_REFRESH_REQUIRED === true ||
          window.DATA_ALMACEN_CACHE?.reabastecimientoRefreshRequired === true;
        refresh(forceRefresh ? "creation_return" : "init");
      }, [refresh]);

      /**
       * Tiempo real y recarga de seguridad.
       *
       * - REAB.sync consulta solo la revisión de cambios (sin leer hojas) cada
       *   pocos segundos. Cuando otro usuario modifica cualquier solicitud, el
       *   listado se recarga en segundo plano y avisa "Información actualizada".
       * - Además, cada 5 minutos se hace una recarga completa de seguridad.
       * - Sustituye al refresco fijo de 60 s, que releía las hojas aunque no
       *   hubiera cambios.
       */
      useEffect(() => {
        mountedRef.current = true;
        const unsubscribe = REAB.sync.subscribe(VIEW_, {
          ids: () => [],
          onChange: () => {
            refresh("sync");
            notify_("Información actualizada.", "info", 1600, { title: "En vivo", sound: false });
          },
        });
        const safetyTimer = setInterval(() => {
          if (document.visibilityState === "visible") refresh("seguridad");
        }, REAB.sync.SAFETY_REFRESH_MS);
        return () => {
          mountedRef.current = false;
          unsubscribe();
          clearInterval(safetyTimer);
          clearTimeout(watchdogRef.current);
          retryTimersRef.current.forEach(clearTimeout);
          retryTimersRef.current.clear();
          pendingRefreshRef.current = null;
          sequenceRef.current += 1;
          inFlightRef.current = false;
          if (perfTraceRef.current && !perfTraceRef.current.ended) {
            perfTraceRef.current.end("cancelled", { meta: { reason: "view_unmounted" } });
          }
          if (!mountTrace_.ended) mountTrace_.end("cancelled", { meta: { reason: "view_unmounted" } });
        };
      }, [refresh]);

      /** Abre o cierra el buscador con una transición breve. */
      const toggleSearch = () => {
        if (!searchExpanded) {
          setSearchClosing(false);
          setSearchExpanded(true);
          setTimeout(() => searchRef.current?.focus(), 80);
          return;
        }
        setSearchClosing(true);
        setTimeout(() => {
          setSearchExpanded(false);
          setSearchClosing(false);
          setSearchQuery("");
        }, 180);
      };

      /** Abre la vista independiente de creación de solicitudes. */
      const openNewRequest = () => {
        if (typeof window.irAVistaShell !== "function") {
          notify_("La navegación del Shell no está disponible.", "error", 3200, {
            title: "Navegación no disponible",
            sound: true,
          });
          return;
        }
        window.irAVistaShell(
          "ReabastecimientoSolicitud",
          "ReabastecimientoSolicitud",
          {},
        );
      };

      /** Navega a la vista operativa de la solicitud. */
      const navigateToDetail_ = (idSolicitud) => {
        window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || {};
        window.DATA_ALMACEN_CACHE.reabastecimientoNavigation = { idSolicitud };
        if (currentUser) window.DATA_ALMACEN_CACHE.reabastecimientoUsuario = currentUser;
        window.irAVistaShell(
          "ReabastecimientoDetalles",
          "ReabastecimientoDetalles",
          { REABASTECIMIENTO_ID_SOLICITUD: idSolicitud },
        );
      };

      /**
       * ATENDER / CONTINUAR registra al auxiliar (y el inicio en la primera
       * toma) antes de abrir el detalle. Las demás acciones solo consultan.
       */
      const openRequest = (item) => {
        const idSolicitud = String(item?.idSolicitud || "").trim();
        if (!idSolicitud || typeof window.irAVistaShell !== "function") {
          notify_("No se pudo abrir la solicitud.", "error", 3200, {
            title: "Navegación no disponible",
            sound: true,
          });
          return;
        }
        const action = actionFor_(item.estado);
        if (!action.take) {
          navigateToDetail_(idSolicitud);
          return;
        }
        if (!currentUser) {
          notify_("Selecciona tu usuario en la barra superior antes de atender.", "warning", 3600, {
            title: "Usuario requerido",
            sound: true,
          });
          return;
        }
        if (takingId) return;
        setTakingId(idSolicitud);
        /* LISTADO_ATENDER: clic → auxiliar registrado → navegación al detalle. */
        REAB.rpc("ReabastecimientoController_tomarSolicitud", { idSolicitud, usuario: currentUser }, {
          operation: "LISTADO_ATENDER",
          view: VIEW_,
          type: "ACCION",
          idSolicitud,
          required: ["idSolicitud"],
          meta: { accion: action.label },
        })
          .then(({ data }) => {
            if (!mountedRef.current) return;
            setTakingId("");
            if (!data?.yaTomada) {
              notify_(`Atención iniciada por ${currentUser}.`, "success", 2200, { title: idSolicitud });
            }
            /*
             * El servidor devuelve el detalle junto con la toma. Se entrega a la
             * vista de detalle para que no repita la consulta al abrir (~3 s).
             */
            if (data?.detalle) {
              window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || {};
              window.DATA_ALMACEN_CACHE.reabastecimientoDetallePrecargado = { idSolicitud, detalle: data.detalle, at: Date.now() };
            }
            navigateToDetail_(idSolicitud);
          })
          .catch((error) => {
            if (!mountedRef.current) return;
            setTakingId("");
            notify_(REAB.util.publicError(error), "error", 4800, { title: "Atención no registrada", sound: true });
            refresh("manual");
          });
      };

      /**
       * Mide un cambio de interfaz (filtro u orden) hasta que la tabla se
       * vuelve a pintar. Evento LISTADO_FILTRAR con el control en meta.control.
       */
      const trackUi_ = (control, value, apply) => {
        const trace = REAB.perf.begin("LISTADO_FILTRAR", { view: VIEW_, type: "UI", meta: { control, value, rows: requests.length } });
        apply();
        trace.endAfterPaint("ok");
      };

      /** Cambia y recuerda el usuario que atiende en este equipo. */
      const changeUser = (value) => {
        setCurrentUser(REAB.user.set(value));
      };

      const warehouses = useMemo(() => [
        ...new Set(requests.map((item) => normalize_(item.bodega)).filter(Boolean)),
      ].sort(), [requests]);

      const counts = useMemo(() => requests.reduce((result, item) => {
        const status = normalize_(item.estado);
        result[status] = (result[status] || 0) + 1;
        return result;
      }, Object.create(null)), [requests]);

      /** Colección derivada tras aplicar filtros, búsqueda y orden. */
      const filtered = useMemo(() => {
        let result = [...requests];
        if (statusFilter === "VIGENTES") {
          result = result.filter((item) => OPEN_STATES_.includes(normalize_(item.estado)));
        } else if (statusFilter === "EN_ATENCION") {
          result = result.filter((item) => WORKING_STATES_.includes(normalize_(item.estado)));
        } else if (statusFilter === "CREADA") {
          result = result.filter((item) => ["CREADA", "ABIERTA"].includes(normalize_(item.estado)));
        } else if (statusFilter === "CERRADA_CON_PENDIENTES") {
          result = result.filter((item) => ["CERRADA_CON_PENDIENTES", "INCONSISTENTE"].includes(normalize_(item.estado)));
        } else if (statusFilter !== "TODAS") {
          result = result.filter((item) => normalize_(item.estado) === statusFilter);
        }
        if (warehouseFilter !== "TODAS") {
          result = result.filter((item) => normalize_(item.bodega) === warehouseFilter);
        }
        const query = searchQuery.trim().toLowerCase();
        if (query) {
          result = result.filter((item) => [
            item.idSolicitud,
            item.solicitante,
            item.bodega,
            item.areaSuministro,
            item.estado,
            item.fechaCreacion,
            (item.auxiliares || []).join(" "),
          ].some((value) => String(value || "").toLowerCase().includes(query)));
        }
        /* Orden del proceso: fecha, hora, bodega, área y solicitante. */
        result.sort((left, right) => {
          const difference = dateTimeValue_(left) - dateTimeValue_(right);
          const byDate = sortBy === "FECHA_ASC" ? difference : -difference;
          return byDate ||
            normalize_(left.bodega).localeCompare(normalize_(right.bodega), "es-MX", { numeric: true }) ||
            normalize_(left.areaSuministro).localeCompare(normalize_(right.areaSuministro), "es-MX", { numeric: true }) ||
            normalize_(left.solicitante).localeCompare(normalize_(right.solicitante), "es-MX");
        });
        return result;
      }, [requests, statusFilter, warehouseFilter, searchQuery, sortBy]);

      /** Exporta el conjunto visible mediante la utilidad global compartida. */
      const exportExcel = () => {
        if (!window.ExcelExportUtils?.exportarAXLSX) {
          notify_("No se detectó el exportador XLSX.", "error", 4000, {
            title: "Exportador no disponible",
            sound: true,
          });
          return;
        }
        if (!filtered.length) {
          notify_("No existen solicitudes para exportar.", "warning", 3000, {
            title: "Sin datos",
            sound: true,
          });
          return;
        }
        const exportTrace = REAB.perf.begin("LISTADO_EXPORTAR", { view: VIEW_, type: "UI", meta: { rows: filtered.length } });
        window.setTimeout(() => exportTrace.end("ok"), 0);
        window.ExcelExportUtils.exportarAXLSX({
          fileName: `Reabastecimiento_${new Date().toISOString().slice(0, 10)}.xlsx`,
          sheetName: "Solicitudes",
          rows: filtered.map((item) => ({
            ...item,
            auxiliaresTexto: (item.auxiliares || []).join(", "),
            avance: Number(item.seguimiento?.porcentajeAvance || 0),
            cajasSurtidas: Number(item.seguimiento?.cajasSurtidas || 0),
          })),
          columns: [
            { key: "idSolicitud", label: "Solicitud" },
            { key: "fechaCreacion", label: "Fecha creación" },
            { key: "horaCreacion", label: "Hora creación" },
            { key: "solicitante", label: "Solicitante" },
            { key: "bodega", label: "Bodega" },
            { key: "areaSuministro", label: "Área de suministro" },
            { key: "skusSolicitados", label: "SKU solicitados" },
            { key: "auxiliaresTexto", label: "Auxiliares" },
            { key: "fechaInicioAtencion", label: "Fecha inicio" },
            { key: "horaInicioAtencion", label: "Hora inicio" },
            { key: "avance", label: "Avance %" },
            { key: "cajasSurtidas", label: "Cajas surtidas" },
            { key: "estado", label: "Estado" },
            { key: "fechaCierreAtencion", label: "Fecha cierre" },
            { key: "horaCierreAtencion", label: "Hora cierre" },
            { key: "usuarioCierre", label: "Cerró" },
            { key: "motivoCierre", label: "Motivo de cierre" },
          ],
        });
      };

      return (
        <div className="space-y-4 rb-fade-in relative">
          {["error", "timeout", "warning", "confirming"].includes(syncState.status) && (
            <section className={`rb-sync-banner ${["warning", "confirming"].includes(syncState.status) ? "warning" : ""}`}>
              <div>
                <div className="rb-sync-title">
                  {syncState.status === "confirming" ? "Confirmando solicitud" : "Estado de actualización"}
                </div>
                <div className="rb-sync-copy">{syncState.message}</div>
              </div>
              <button type="button" className="rb-toolbar-action" onClick={() => refresh("manual")} disabled={loading}>
                <LocalIcon name="refresh-cw" size={16} className={loading ? "animate-spin" : ""}/>
                Reintentar
              </button>
            </section>
          )}
          <section className="rb-kpi-grid">
            {[
              ["En cola", (counts.CREADA || 0) + (counts.ABIERTA || 0), "rb-kpi-open", "circle-dot"],
              ["En atención", WORKING_STATES_.reduce((sum, key) => sum + (counts[key] || 0), 0), "rb-kpi-attention", "loader-circle"],
              ["Cerradas", counts.CERRADA || 0, "rb-kpi-closed", "circle-check"],
              ["Con pendientes", (counts.CERRADA_CON_PENDIENTES || 0) + (counts.INCONSISTENTE || 0), "rb-kpi-inconsistent", "triangle-alert"],
            ].map(([label, value, colorClass, icon]) => (
              <article key={label} className={`rb-card rb-kpi ${colorClass}`}>
                <div className="flex items-center justify-between gap-3">
                  <div>
                    <div className="rb-kpi-label">{label}</div>
                    <div className="rb-kpi-value">{value}</div>
                  </div>
                  <LocalIcon name={icon} size={25} />
                </div>
              </article>
            ))}
          </section>

          <section className="rb-card p-4">
            <div className="flex flex-col gap-4">
              <div className="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-3">
                <div className="flex flex-wrap items-center gap-2">
                  {[
                    ["VIGENTES", "Vigentes"],
                    ["CREADA", "En cola"],
                    ["EN_ATENCION", "En atención"],
                    ["CERRADA", "Cerradas"],
                    ["CERRADA_CON_PENDIENTES", "Con pendientes"],
                    ["TODAS", "Todas"],
                  ].map(([id, label]) => (
                    <button
                      key={id}
                      type="button"
                      onClick={() => trackUi_("estado", id, () => setStatusFilter(id))}
                      className={`rb-filter-btn ${statusFilter === id ? "active-primary" : "idle"}`}
                    >
                      {label}
                    </button>
                  ))}
                </div>

                <div className="flex flex-wrap items-center gap-2 xl:justify-end">
                  <SyncBadge_ />
                  <select
                    className="rb-select"
                    value={currentUser}
                    onChange={(event) => changeUser(event.target.value)}
                    aria-label="Usuario que atiende"
                    title="Usuario que atiende en este equipo"
                  >
                    <option value="">Mi usuario...</option>
                    {users.map((name) => (
                      <option key={name} value={name}>{name}</option>
                    ))}
                  </select>
                  <select
                    className="rb-select"
                    value={warehouseFilter}
                    onChange={(event) => { const value = event.target.value; trackUi_("bodega", value, () => setWarehouseFilter(value)); }}
                    aria-label="Filtrar por bodega"
                  >
                    <option value="TODAS">Todas las bodegas</option>
                    {warehouses.map((warehouse) => (
                      <option key={warehouse} value={warehouse}>{warehouse}</option>
                    ))}
                  </select>
                  <select
                    className="rb-select"
                    value={sortBy}
                    onChange={(event) => { const value = event.target.value; trackUi_("orden", value, () => setSortBy(value)); }}
                    aria-label="Ordenar solicitudes"
                  >
                    <option value="FECHA_DESC">Más recientes</option>
                    <option value="FECHA_ASC">Más antiguas</option>
                  </select>
                  <button type="button" onClick={toggleSearch} className={`rb-toolbar-action ${searchExpanded ? "active-dark" : ""}`} title="Buscar solicitudes">
                    <LocalIcon name={searchExpanded ? "x" : "search"} size={17} />
                    <span className="rb-toolbar-label">{searchExpanded ? "Cerrar" : "Buscar"}</span>
                  </button>
                  <button type="button" onClick={() => refresh("manual")} disabled={loading} className="rb-toolbar-action" title="Actualizar">
                    <LocalIcon name="refresh-cw" size={17} className={loading ? "animate-spin" : ""} />
                    <span className="rb-toolbar-label">Actualizar</span>
                  </button>
                  <button type="button" onClick={openNewRequest} className="rb-toolbar-action primary" title="Nueva solicitud">
                    <LocalIcon name="clipboard-plus" size={17} />
                    <span className="rb-toolbar-label">Nueva</span>
                  </button>
                  <button type="button" onClick={exportExcel} disabled={loading || !filtered.length} className="rb-toolbar-action success" title="Exportar a Excel">
                    <LocalIcon name="file-spreadsheet" size={17} />
                    <span className="rb-toolbar-label">Excel</span>
                  </button>
                </div>
              </div>

              {searchExpanded && (
                <div className={`rb-search-wrap ${searchClosing ? "closing" : ""}`}>
                  <LocalIcon name="search" size={18} />
                  <input
                    ref={searchRef}
                    autoFocus
                    type="text"
                    className="rb-search-input"
                    placeholder="Busca por folio, solicitante, bodega, estado o fecha..."
                    value={searchQuery}
                    onChange={(event) => setSearchQuery(event.target.value)}
                  />
                  {searchQuery && (
                    <button type="button" className="rb-search-clear" onClick={() => setSearchQuery("")} title="Limpiar búsqueda">
                      <LocalIcon name="x" size={16} />
                    </button>
                  )}
                </div>
              )}
            </div>
          </section>

          <section className="rb-card overflow-hidden">
            <div className="rb-table-wrap rb-scroll">
              <table className="rb-table">
                <thead>
                  <tr>
                    <th>Solicitud / creación</th>
                    <th>Solicitante</th>
                    <th>Bodega / área</th>
                    <th>SKU</th>
                    <th>Avance</th>
                    <th>Cajas</th>
                    <th>Estado</th>
                    <th>Acción</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((item, index) => {
                    const status = normalize_(item.estado);
                    const action = actionFor_(status);
                    const tracking = item.seguimiento || {};
                    const progress = Math.max(0, Math.min(100, Number(tracking.porcentajeAvance || 0)));
                    const boxes = Number(tracking.cajasSurtidas ?? item.cajasInvolucradas ?? 0);
                    return (
                      <tr
                        key={item.idSolicitud || index}
                        className={`rb-row ${activeRow === index ? "active" : ""} ${item.idSolicitud === recentRequestId ? "recent" : ""}`}
                        onClick={() => setActiveRow(activeRow === index ? null : index)}
                      >
                        <td>
                          <span className="rb-folio">{item.idSolicitud || "SIN FOLIO"}</span>
                          <span className="rb-folio-sub">{item.fechaCreacion || "SIN FECHA"} · {item.horaCreacion || "--"}</span>
                        </td>
                        <td>
                          <span className="rb-cell-strong">{item.solicitante || "SIN SOLICITANTE"}</span>
                          {(item.auxiliares || []).length > 0 && (
                            <span className="rb-aux">Atiende: {item.auxiliares.join(", ")}</span>
                          )}
                        </td>
                        <td>
                          <span className="rb-cell-strong">{item.bodega || "SIN BODEGA"}</span>
                          <span className="rb-aux">{item.areaSuministro || "SIN ÁREA"}</span>
                        </td>
                        <td><span className="rb-count">{Number(item.skusSolicitados || 0)}</span></td>
                        <td>
                          <div className="rb-progress" title={`${Number(tracking.concluidos || 0)} de ${Number(tracking.totalSkus || 0)} SKU concluidos`}>
                            <div className="rb-progress-bar"><div className="rb-progress-fill" style={{ width: `${progress}%` }}></div></div>
                            <span className="rb-progress-text">{progress}%</span>
                          </div>
                        </td>
                        <td><span className="rb-count">{boxes}</span></td>
                        <td><span className={statusClass_(status)}>{statusLabel_(status)}</span></td>
                        <td>
                          <button
                            type="button"
                            className={`rb-action ${action.className}`}
                            disabled={Boolean(takingId)}
                            onClick={(event) => {
                              event.stopPropagation();
                              openRequest(item);
                            }}
                          >
                            <LocalIcon name={takingId === item.idSolicitud ? "loader-circle" : action.icon} size={14} className={takingId === item.idSolicitud ? "animate-spin" : ""} />
                            {takingId === item.idSolicitud ? "Abriendo..." : action.label}
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>

              {!loading && !filtered.length && (
                <div className="rb-empty">
                  <div className="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                    <LocalIcon name="search-x" size={28} />
                  </div>
                  <span className="text-[13px] font-black uppercase tracking-widest">Sin solicitudes coincidentes</span>
                  <span className="text-[11px] font-semibold">Ajusta la búsqueda o los filtros operativos.</span>
                </div>
              )}

              {loading && (
                <div className="p-28 flex flex-col items-center justify-center gap-4">
                  <div className="w-10 h-10 border-4 border-slate-100 border-t-[var(--primary)] rounded-full animate-spin"></div>
                  <span className="text-[10px] font-black tracking-widest text-slate-400 uppercase">Cargando solicitudes...</span>
                </div>
              )}
            </div>
          </section>
        </div>
      );
    };

    const target = document.getElementById("render-reabastecimiento");
    if (!target) {
      notify_("No se encontró el contenedor principal.", "error", 4200, {
        title: "Error de interfaz",
        sound: true,
      });
      return () => {};
    }

    if (window.__REABASTECIMIENTO_ROOT__) {
      try {
        window.__REABASTECIMIENTO_ROOT__.unmount();
      } catch (_) {}
      window.__REABASTECIMIENTO_ROOT__ = null;
    }

    window.__REABASTECIMIENTO_ROOT__ = ReactDOM.createRoot(target);
    window.__REABASTECIMIENTO_ROOT__.render(<Dashboard />);

    return () => {
      if (window.__REABASTECIMIENTO_ROOT__) {
        try {
          window.__REABASTECIMIENTO_ROOT__.unmount();
        } catch (_) {}
        window.__REABASTECIMIENTO_ROOT__ = null;
      }
    };
  };

  window.initVista = window.cargar_Reabastecimiento;
</script>
