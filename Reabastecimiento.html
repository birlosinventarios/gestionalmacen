<script>
  /**
   * Reabastecimiento.html
   *
   * Vista principal del módulo de solicitudes de Reabastecimiento.
   *
   * RESPONSABILIDADES
   * - Consultar el listado ligero de solicitudes.
   * - Filtrar por estado, bodega, texto y orden cronológico.
   * - Mostrar indicadores operativos derivados del listado cargado.
   * - Navegar a la creación o atención mediante el Shell APPALMACEN.
   * - Exportar el conjunto visible a XLSX cuando el exportador esté disponible.
   * - Administrar el montaje y desmontaje de su raíz React.
   *
   * RESPONSABILIDADES EXCLUIDAS
   * - No consulta candidatos de reabastecimiento.
   * - No crea solicitudes ni registra IDUNICO.
   * - No calcula estados, fechas, folios o cantidades autoritativas.
   *
   * DEPENDENCIAS GLOBALES
   * - React y ReactDOM.
   * - FitoComponents.Icon.LocalIcon o FitoComponents.LocalIcon.
   * - google.script.run.
   * - window.irAVistaShell().
   * - window.notificar o window.lanzarNotificacion.
   * - ExcelExportUtils.exportarAXLSX(), opcional.
   *
   * CONTROLADOR CONSUMIDO
   * - ReabastecimientoController_getSolicitudes({}).
   *
   * CONTRATOS GLOBALES EXPUESTOS
   * - window.cargar_Reabastecimiento().
   * - window.initVista.
   * - window.__REABASTECIMIENTO_ROOT__.
   *
   * CONSIDERACIONES DE MANTENIMIENTO
   * - Las respuestas obsoletas se descartan mediante un número de secuencia.
   * - El watchdog visual se activa a los 20 segundos.
   * - La actualización automática ocurre cada 60 segundos solo con la pestaña visible.
   * - initVista devuelve una función de limpieza compatible con APPALMACEN.html.
   * - El servidor permanece como autoridad de los datos operativos.
   *
   * @author Sigifredo de la Cruz Ramos
   * @version REABASTECIMIENTO-VIEW-2026-11-14-06
   */
</script>

<script type="text/babel">
  window.cargar_Reabastecimiento = () => {
    const { useState, useEffect, useMemo, useCallback, useRef } = React;
    const LocalIcon = window.FitoComponents?.Icon?.LocalIcon || window.FitoComponents?.LocalIcon;

    if (!LocalIcon) {
      throw new Error("No se encontró FitoComponents.Icon.LocalIcon.");
    }

    /** Emite una notificación mediante la infraestructura global del Shell. */
    const notify_ = (message, type = "info", timer = 2500, options = {}) => {
      const handler = window.notificar || window.lanzarNotificacion;
      if (typeof handler === "function") handler(message, type, timer, options);
    };

    /** Normaliza valores de texto para búsqueda y comparación. */
    const normalize_ = (value) => String(value ?? "").trim().toUpperCase();

    /** Convierte una fecha dd/MM/yyyy o ISO a milisegundos para ordenar. */
    const dateValue_ = (value) => {
      const text = String(value || "").trim();
      const match = text.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (match) return new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1])).getTime();
      const parsed = new Date(text);
      return Number.isNaN(parsed.getTime()) ? 0 : parsed.getTime();
    };

    /** Devuelve la clase visual asociada al estado derivado. */
    const statusClass_ = (status) => ({
      ABIERTA: "rb-chip rb-status-open",
      EN_ATENCION: "rb-chip rb-status-attention",
      CERRADA: "rb-chip rb-status-closed",
      INCONSISTENTE: "rb-chip rb-status-inconsistent",
    }[normalize_(status)] || "rb-chip rb-status-inconsistent");

    /** Devuelve la etiqueta legible del estado. */
    const statusLabel_ = (status) => normalize_(status).replaceAll("_", " ") || "SIN ESTADO";

    /** Componente principal del listado de Reabastecimiento. */
    const Dashboard = () => {
      const [requests, setRequests] = useState([]);
      const [loading, setLoading] = useState(true);
      const [statusFilter, setStatusFilter] = useState("TODAS");
      const [warehouseFilter, setWarehouseFilter] = useState("TODAS");
      const [sortBy, setSortBy] = useState("FECHA_DESC");
      const [searchQuery, setSearchQuery] = useState("");
      const [searchExpanded, setSearchExpanded] = useState(false);
      const [searchClosing, setSearchClosing] = useState(false);
      const [activeRow, setActiveRow] = useState(null);
      const [recentRequestId, setRecentRequestId] = useState("");
      const [syncState, setSyncState] = useState({
        status: "idle",
        message: "",
        lastSuccessAt: 0,
      });
      const recentRequestRef = useRef(
        String(
          window.REABASTECIMIENTO_ULTIMA_SOLICITUD ||
          window.DATA_ALMACEN_CACHE?.reabastecimientoUltimaSolicitud ||
          ""
        ).trim()
      );
      const searchRef = useRef(null);
      const inFlightRef = useRef(false);
      const pendingRefreshRef = useRef(null);
      const sequenceRef = useRef(0);
      const watchdogRef = useRef(null);
      const retryTimersRef = useRef(new Set());
      const mountedRef = useRef(true);
      const perfTraceRef = useRef(null);

      /**
       * Consulta solicitudes y descarta respuestas obsoletas.
       * @param {"init"|"manual"|"auto"} context Origen de la actualización.
       */
      /**
       * Identifica la forma de una respuesta sin registrar datos operativos.
       * @param {*} response Respuesta recibida de google.script.run.
       * @return {!Object} Metadatos estructurales no sensibles.
       */
      const describeResponse_ = (response) => ({
        type: response === null ? "null" : Array.isArray(response) ? "array" : typeof response,
        keys: response && typeof response === "object"
          ? Object.keys(response).slice(0, 20)
          : [],
        ok: response?.ok,
        operation: response?.operation || "",
        hasData: Boolean(response?.data),
        dataKeys: response?.data && typeof response.data === "object"
          ? Object.keys(response.data).slice(0, 20)
          : [],
        contractVersion:
          response?.metadata?.contractVersion ||
          response?.data?.contractVersion ||
          "legacy",
      });

      /**
       * Adapta contratos compatibles sin convertir silenciosamente errores en [].
       *
       * Contratos admitidos:
       * - Actual: {ok:true,data:{solicitudes,total}}.
       * - Legado: {solicitudes,total}.
       * - Legado mínimo: Array<Solicitud>.
       * - JSON textual de cualquiera de los anteriores.
       */
      const parseResponse_ = (rawResponse) => {
        let response = rawResponse;
        if (typeof response === "string") {
          try {
            response = JSON.parse(response);
          } catch (_) {
            throw new Error("El Controller devolvió texto que no contiene JSON válido.");
          }
        }

        if (response?.ok === false) {
          throw new Error(
            response?.message || response?.error?.message ||
            "El Controller reportó una operación no exitosa."
          );
        }

        let payload = null;
        let contractMode = "unknown";
        if (response?.ok === true && response?.data) {
          payload = response.data;
          contractMode = "envelope-v2";
        } else if (response && Array.isArray(response.solicitudes)) {
          payload = response;
          contractMode = "legacy-object";
        } else if (Array.isArray(response)) {
          payload = { solicitudes: response, total: response.length };
          contractMode = "legacy-array";
        }

        if (!payload || !Array.isArray(payload.solicitudes)) {
          const shape = describeResponse_(response);
          throw new Error(
            "Contrato incompatible de Reabastecimiento. " +
            `Tipo=${shape.type}; claves=${shape.keys.join(",") || "ninguna"}.`
          );
        }

        const total = payload.total;
        if (
          total !== undefined &&
          total !== null &&
          Number.isFinite(Number(total)) &&
          Number(total) !== payload.solicitudes.length
        ) {
          throw new Error("Contrato inválido: total no coincide con solicitudes.");
        }

        return {
          records: payload.solicitudes,
          contractMode,
          responseShape: describeResponse_(response),
        };
      };

      /** Programa una confirmación del folio sin borrar prematuramente la señal. */
      const scheduleConfirmationRetry_ = useCallback((attempt) => {
        const delays = [400, 1200, 3000];
        if (!mountedRef.current || attempt >= delays.length) return;
        const timer = setTimeout(() => {
          retryTimersRef.current.delete(timer);
          refresh("confirmation", attempt + 1);
        }, delays[attempt]);
        retryTimersRef.current.add(timer);
      }, []);

      /**
       * Máquina de actualización resistente a solapamientos y respuestas obsoletas.
       * Mantiene la señal de navegación hasta confirmar el folio recién creado.
       */
      const refresh = useCallback((context = "init", confirmationAttempt = 0) => {
        if (typeof google === "undefined" || !google.script?.run) {
          setLoading(false);
          setSyncState({ status: "error", message: "google.script.run no está disponible.", lastSuccessAt: 0 });
          return;
        }
        if (inFlightRef.current) {
          pendingRefreshRef.current = { context, confirmationAttempt };
          return;
        }

        const sequence = ++sequenceRef.current;
        const traceId = window.APPALMACEN_PERF?.start?.("REABASTECIMIENTO_LIST_REFRESH", {
          viewId: "Reabastecimiento",
          source: context,
          confirmationAttempt,
          expectedRequest: Boolean(recentRequestRef.current),
        }) || null;
        perfTraceRef.current = traceId;
        inFlightRef.current = true;
        setSyncState((previous) => ({ ...previous, status: "loading", message: "" }));
        if (context !== "auto") setLoading(true);
        clearTimeout(watchdogRef.current);
        watchdogRef.current = setTimeout(() => {
          if (!mountedRef.current || sequenceRef.current !== sequence) return;
          sequenceRef.current += 1;
          inFlightRef.current = false;
          setLoading(false);
          setSyncState({ status: "timeout", message: "La consulta excedió 30 segundos.", lastSuccessAt: 0 });
          window.APPALMACEN_PERF?.end?.(traceId, "timeout", { watchdogMs: 30000 });
          const pending = pendingRefreshRef.current;
          pendingRefreshRef.current = null;
          if (pending) refresh(pending.context, pending.confirmationAttempt);
        }, 30000);

        const startedAt = performance.now();
        google.script.run
          .withSuccessHandler((response) => {
            if (!mountedRef.current || sequenceRef.current !== sequence) return;
            clearTimeout(watchdogRef.current);
            try {
              const parsed = parseResponse_(response);
              const records = parsed.records;
              window.APPALMACEN_PERF?.mark?.(traceId, "LIST_CONTRACT_VALIDATED", {
                rows: records.length,
                contractMode: parsed.contractMode,
                contractVersion: parsed.responseShape.contractVersion,
                responseType: parsed.responseShape.type,
                responseKeys: parsed.responseShape.keys,
                serverMs: Number(response?.metadata?.elapsedMs || 0),
                responseChars: Number(response?.metadata?.responseChars || 0),
              });
              setRequests(records);
              const recentId = recentRequestRef.current;
              const foundRecent = Boolean(
                recentId && records.some((item) => item.idSolicitud === recentId)
              );

              if (foundRecent) {
                setRecentRequestId(recentId);
                const timer = setTimeout(() => {
                  retryTimersRef.current.delete(timer);
                  if (mountedRef.current) setRecentRequestId("");
                }, 8000);
                retryTimersRef.current.add(timer);
              }

              if (!recentId || foundRecent) {
                delete window.REABASTECIMIENTO_REFRESH_REQUIRED;
                delete window.REABASTECIMIENTO_ULTIMA_SOLICITUD;
                if (window.DATA_ALMACEN_CACHE) {
                  delete window.DATA_ALMACEN_CACHE.reabastecimientoRefreshRequired;
                  delete window.DATA_ALMACEN_CACHE.reabastecimientoUltimaSolicitud;
                }
                recentRequestRef.current = "";
              } else if (confirmationAttempt < 3) {
                setSyncState({
                  status: "confirming",
                  message: "La solicitud fue creada y se está confirmando en el listado.",
                  lastSuccessAt: Date.now(),
                });
                scheduleConfirmationRetry_(confirmationAttempt);
              } else {
                setSyncState({
                  status: "warning",
                  message: "El listado respondió, pero todavía no contiene la solicitud recién creada. Usa Actualizar antes de reintentar la creación.",
                  lastSuccessAt: Date.now(),
                });
              }

              if (!recentId || foundRecent) {
                setSyncState({ status: "ready", message: "", lastSuccessAt: Date.now() });
              }
              window.APPALMACEN_PERF?.end?.(traceId, "ok", {
                rows: records.length,
                expectedFound: foundRecent,
                clientMs: Math.round((performance.now() - startedAt) * 100) / 100,
              });
              if (context === "manual") {
                notify_("Solicitudes actualizadas correctamente.", "success", 1800, {
                  title: "Actualización completada",
                  sound: false,
                });
              }
            } catch (contractError) {
              setSyncState({ status: "error", message: contractError.message, lastSuccessAt: 0 });
              window.APPALMACEN_PERF?.end?.(traceId, "error", {
                stage: "contract",
                message: contractError.message,
                responseShape: describeResponse_(response),
              });
              notify_(contractError.message, "error", 5200, { title: "Respuesta incompatible", sound: true });
            } finally {
              inFlightRef.current = false;
              setLoading(false);
              const pending = pendingRefreshRef.current;
              pendingRefreshRef.current = null;
              if (pending) refresh(pending.context, pending.confirmationAttempt);
            }
          })
          .withFailureHandler((error) => {
            if (!mountedRef.current || sequenceRef.current !== sequence) return;
            clearTimeout(watchdogRef.current);
            inFlightRef.current = false;
            setLoading(false);
            const message = error?.message || "No se pudieron cargar las solicitudes.";
            setSyncState({ status: "error", message, lastSuccessAt: 0 });
            window.APPALMACEN_PERF?.end?.(traceId, "error", { stage: "server", message });
            notify_(message, "error", 5200, { title: "Error de Reabastecimiento", sound: true });
            const pending = pendingRefreshRef.current;
            pendingRefreshRef.current = null;
            if (pending) refresh(pending.context, pending.confirmationAttempt);
          })
          .ReabastecimientoController_getSolicitudes({});
      }, [scheduleConfirmationRetry_]);
      useEffect(() => {
        const forceRefresh =
          window.REABASTECIMIENTO_REFRESH_REQUIRED === true ||
          window.DATA_ALMACEN_CACHE?.reabastecimientoRefreshRequired === true;
        refresh(forceRefresh ? "creation_return" : "init");
      }, [refresh]);

      useEffect(() => {
        mountedRef.current = true;
        const timer = setInterval(() => {
          if (document.visibilityState === "visible") refresh("auto");
        }, 60000);
        return () => {
          mountedRef.current = false;
          clearInterval(timer);
          clearTimeout(watchdogRef.current);
          retryTimersRef.current.forEach(clearTimeout);
          retryTimersRef.current.clear();
          pendingRefreshRef.current = null;
          sequenceRef.current += 1;
          inFlightRef.current = false;
          if (perfTraceRef.current) {
            window.APPALMACEN_PERF?.cancel?.(perfTraceRef.current, { reason: "view_unmounted" });
          }
        };
      }, [refresh]);

      /** Abre o cierra el buscador con una transición breve. */
      const toggleSearch = () => {
        if (!searchExpanded) {
          setSearchClosing(false);
          setSearchExpanded(true);
          setTimeout(() => searchRef.current?.focus(), 80);
          return;
        }
        setSearchClosing(true);
        setTimeout(() => {
          setSearchExpanded(false);
          setSearchClosing(false);
          setSearchQuery("");
        }, 180);
      };

      /** Abre la vista independiente de creación de solicitudes. */
      const openNewRequest = () => {
        if (typeof window.irAVistaShell !== "function") {
          notify_("La navegación del Shell no está disponible.", "error", 3200, {
            title: "Navegación no disponible",
            sound: true,
          });
          return;
        }
        window.irAVistaShell(
          "ReabastecimientoSolicitud",
          "ReabastecimientoSolicitud",
          {},
        );
      };

      /** Abre la solicitud seleccionada en la vista operativa. */
      const openRequest = (item) => {
        const idSolicitud = String(item?.idSolicitud || "").trim();
        if (!idSolicitud || typeof window.irAVistaShell !== "function") {
          notify_("No se pudo abrir la solicitud.", "error", 3200, {
            title: "Navegación no disponible",
            sound: true,
          });
          return;
        }
        window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || {};
        window.DATA_ALMACEN_CACHE.reabastecimientoNavigation = { idSolicitud };
        window.irAVistaShell(
          "ReabastecimientoDetalles",
          "ReabastecimientoDetalles",
          { REABASTECIMIENTO_ID_SOLICITUD: idSolicitud },
        );
      };

      const warehouses = useMemo(() => [
        ...new Set(requests.map((item) => normalize_(item.bodega)).filter(Boolean)),
      ].sort(), [requests]);

      const counts = useMemo(() => requests.reduce((result, item) => {
        const status = normalize_(item.estado);
        result[status] = (result[status] || 0) + 1;
        return result;
      }, Object.create(null)), [requests]);

      /** Colección derivada tras aplicar filtros, búsqueda y orden. */
      const filtered = useMemo(() => {
        let result = [...requests];
        if (statusFilter !== "TODAS") {
          result = result.filter((item) => normalize_(item.estado) === statusFilter);
        }
        if (warehouseFilter !== "TODAS") {
          result = result.filter((item) => normalize_(item.bodega) === warehouseFilter);
        }
        const query = searchQuery.trim().toLowerCase();
        if (query) {
          result = result.filter((item) => [
            item.idSolicitud,
            item.solicitante,
            item.bodega,
            item.estado,
            item.fechaCreacion,
          ].some((value) => String(value || "").toLowerCase().includes(query)));
        }
        result.sort((left, right) => {
          const difference = dateValue_(left.fechaCreacion) - dateValue_(right.fechaCreacion);
          return sortBy === "FECHA_ASC" ? difference : -difference;
        });
        return result;
      }, [requests, statusFilter, warehouseFilter, searchQuery, sortBy]);

      /** Exporta el conjunto visible mediante la utilidad global compartida. */
      const exportExcel = () => {
        if (!window.ExcelExportUtils?.exportarAXLSX) {
          notify_("No se detectó el exportador XLSX.", "error", 4000, {
            title: "Exportador no disponible",
            sound: true,
          });
          return;
        }
        if (!filtered.length) {
          notify_("No existen solicitudes para exportar.", "warning", 3000, {
            title: "Sin datos",
            sound: true,
          });
          return;
        }
        window.ExcelExportUtils.exportarAXLSX({
          fileName: `Reabastecimiento_${new Date().toISOString().slice(0, 10)}.xlsx`,
          sheetName: "Solicitudes",
          rows: filtered,
          columns: [
            { key: "idSolicitud", label: "Solicitud" },
            { key: "fechaCreacion", label: "Fecha creación" },
            { key: "horaCreacion", label: "Hora creación" },
            { key: "solicitante", label: "Solicitante" },
            { key: "bodega", label: "Bodega" },
            { key: "skusSolicitados", label: "SKU solicitados" },
            { key: "cajasInvolucradas", label: "Cajas involucradas" },
            { key: "estado", label: "Estado" },
          ],
        });
      };

      return (
        <div className="space-y-4 rb-fade-in relative">
          {["error", "timeout", "warning", "confirming"].includes(syncState.status) && (
            <section className={`rb-sync-banner ${["warning", "confirming"].includes(syncState.status) ? "warning" : ""}`}>
              <div>
                <div className="rb-sync-title">
                  {syncState.status === "confirming" ? "Confirmando solicitud" : "Estado de actualización"}
                </div>
                <div className="rb-sync-copy">{syncState.message}</div>
              </div>
              <button type="button" className="rb-toolbar-action" onClick={() => refresh("manual")} disabled={loading}>
                <LocalIcon name="refresh-cw" size={16} className={loading ? "animate-spin" : ""}/>
                Reintentar
              </button>
            </section>
          )}
          <section className="rb-kpi-grid">
            {[
              ["Abiertas", counts.ABIERTA || 0, "rb-kpi-open", "circle-dot"],
              ["En atención", counts.EN_ATENCION || 0, "rb-kpi-attention", "loader-circle"],
              ["Cerradas", counts.CERRADA || 0, "rb-kpi-closed", "circle-check"],
              ["Inconsistentes", counts.INCONSISTENTE || 0, "rb-kpi-inconsistent", "triangle-alert"],
            ].map(([label, value, colorClass, icon]) => (
              <article key={label} className={`rb-card rb-kpi ${colorClass}`}>
                <div className="flex items-center justify-between gap-3">
                  <div>
                    <div className="rb-kpi-label">{label}</div>
                    <div className="rb-kpi-value">{value}</div>
                  </div>
                  <LocalIcon name={icon} size={25} />
                </div>
              </article>
            ))}
          </section>

          <section className="rb-card p-4">
            <div className="flex flex-col gap-4">
              <div className="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-3">
                <div className="flex flex-wrap items-center gap-2">
                  {[
                    ["TODAS", "Todas"],
                    ["ABIERTA", "Abiertas"],
                    ["EN_ATENCION", "En atención"],
                    ["CERRADA", "Cerradas"],
                    ["INCONSISTENTE", "Inconsistentes"],
                  ].map(([id, label]) => (
                    <button
                      key={id}
                      type="button"
                      onClick={() => setStatusFilter(id)}
                      className={`rb-filter-btn ${statusFilter === id ? "active-primary" : "idle"}`}
                    >
                      {label}
                    </button>
                  ))}
                </div>

                <div className="flex flex-wrap items-center gap-2 xl:justify-end">
                  <select
                    className="rb-select"
                    value={warehouseFilter}
                    onChange={(event) => setWarehouseFilter(event.target.value)}
                    aria-label="Filtrar por bodega"
                  >
                    <option value="TODAS">Todas las bodegas</option>
                    {warehouses.map((warehouse) => (
                      <option key={warehouse} value={warehouse}>{warehouse}</option>
                    ))}
                  </select>
                  <select
                    className="rb-select"
                    value={sortBy}
                    onChange={(event) => setSortBy(event.target.value)}
                    aria-label="Ordenar solicitudes"
                  >
                    <option value="FECHA_DESC">Más recientes</option>
                    <option value="FECHA_ASC">Más antiguas</option>
                  </select>
                  <button type="button" onClick={toggleSearch} className={`rb-toolbar-action ${searchExpanded ? "active-dark" : ""}`} title="Buscar solicitudes">
                    <LocalIcon name={searchExpanded ? "x" : "search"} size={17} />
                    <span className="rb-toolbar-label">{searchExpanded ? "Cerrar" : "Buscar"}</span>
                  </button>
                  <button type="button" onClick={() => refresh("manual")} disabled={loading} className="rb-toolbar-action" title="Actualizar">
                    <LocalIcon name="refresh-cw" size={17} className={loading ? "animate-spin" : ""} />
                    <span className="rb-toolbar-label">Actualizar</span>
                  </button>
                  <button type="button" onClick={openNewRequest} className="rb-toolbar-action primary" title="Nueva solicitud">
                    <LocalIcon name="clipboard-plus" size={17} />
                    <span className="rb-toolbar-label">Nueva</span>
                  </button>
                  <button type="button" onClick={exportExcel} disabled={loading || !filtered.length} className="rb-toolbar-action success" title="Exportar a Excel">
                    <LocalIcon name="file-spreadsheet" size={17} />
                    <span className="rb-toolbar-label">Excel</span>
                  </button>
                </div>
              </div>

              {searchExpanded && (
                <div className={`rb-search-wrap ${searchClosing ? "closing" : ""}`}>
                  <LocalIcon name="search" size={18} />
                  <input
                    ref={searchRef}
                    autoFocus
                    type="text"
                    className="rb-search-input"
                    placeholder="Busca por folio, solicitante, bodega, estado o fecha..."
                    value={searchQuery}
                    onChange={(event) => setSearchQuery(event.target.value)}
                  />
                  {searchQuery && (
                    <button type="button" className="rb-search-clear" onClick={() => setSearchQuery("")} title="Limpiar búsqueda">
                      <LocalIcon name="x" size={16} />
                    </button>
                  )}
                </div>
              )}
            </div>
          </section>

          <section className="rb-card overflow-hidden">
            <div className="rb-table-wrap rb-scroll">
              <table className="rb-table">
                <thead>
                  <tr>
                    <th>Solicitud / creación</th>
                    <th>Solicitante</th>
                    <th>Bodega</th>
                    <th>SKU</th>
                    <th>Cajas</th>
                    <th>Estado</th>
                    <th>Acción</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((item, index) => {
                    const status = normalize_(item.estado);
                    const actionable = status === "ABIERTA" || status === "EN_ATENCION";
                    return (
                      <tr
                        key={item.idSolicitud || index}
                        className={`rb-row ${activeRow === index ? "active" : ""} ${item.idSolicitud === recentRequestId ? "recent" : ""}`}
                        onClick={() => setActiveRow(activeRow === index ? null : index)}
                      >
                        <td>
                          <span className="rb-folio">{item.idSolicitud || "SIN FOLIO"}</span>
                          <span className="rb-folio-sub">{item.fechaCreacion || "SIN FECHA"} · {item.horaCreacion || "--"}</span>
                        </td>
                        <td><span className="rb-cell-strong">{item.solicitante || "SIN SOLICITANTE"}</span></td>
                        <td><span className="rb-cell-strong">{item.bodega || "SIN BODEGA"}</span></td>
                        <td><span className="rb-count">{Number(item.skusSolicitados || 0)}</span></td>
                        <td><span className="rb-count">{Number(item.cajasInvolucradas || 0)}</span></td>
                        <td><span className={statusClass_(status)}>{statusLabel_(status)}</span></td>
                        <td>
                          <button
                            type="button"
                            className={`rb-action ${actionable ? "primary" : ""}`}
                            onClick={(event) => {
                              event.stopPropagation();
                              openRequest(item);
                            }}
                          >
                            <LocalIcon name={actionable ? "play" : "arrow-up-right"} size={14} />
                            {status === "ABIERTA" ? "Atender" : status === "EN_ATENCION" ? "Continuar" : status === "INCONSISTENTE" ? "Revisar" : "Ver resumen"}
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>

              {!loading && !filtered.length && (
                <div className="rb-empty">
                  <div className="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                    <LocalIcon name="search-x" size={28} />
                  </div>
                  <span className="text-[13px] font-black uppercase tracking-widest">Sin solicitudes coincidentes</span>
                  <span className="text-[11px] font-semibold">Ajusta la búsqueda o los filtros operativos.</span>
                </div>
              )}

              {loading && (
                <div className="p-28 flex flex-col items-center justify-center gap-4">
                  <div className="w-10 h-10 border-4 border-slate-100 border-t-[var(--primary)] rounded-full animate-spin"></div>
                  <span className="text-[10px] font-black tracking-widest text-slate-400 uppercase">Cargando solicitudes...</span>
                </div>
              )}
            </div>
          </section>
        </div>
      );
    };

    const target = document.getElementById("render-reabastecimiento");
    if (!target) {
      notify_("No se encontró el contenedor principal.", "error", 4200, {
        title: "Error de interfaz",
        sound: true,
      });
      return () => {};
    }

    if (window.__REABASTECIMIENTO_ROOT__) {
      try {
        window.__REABASTECIMIENTO_ROOT__.unmount();
      } catch (_) {}
      window.__REABASTECIMIENTO_ROOT__ = null;
    }

    window.__REABASTECIMIENTO_ROOT__ = ReactDOM.createRoot(target);
    window.__REABASTECIMIENTO_ROOT__.render(<Dashboard />);

    return () => {
      if (window.__REABASTECIMIENTO_ROOT__) {
        try {
          window.__REABASTECIMIENTO_ROOT__.unmount();
        } catch (_) {}
        window.__REABASTECIMIENTO_ROOT__ = null;
      }
    };
  };

  window.initVista = window.cargar_Reabastecimiento;
</script>
