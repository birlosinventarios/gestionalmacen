<script type="text/babel">
  window.cargar_AuditoriaExcedentesCaptura = () => {
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // =========================================================
    // CONFIGURACIÓN DE HEURÍSTICA DE ESCÁNER
    // =========================================================
    const SCAN_RULES = {
      location: {
        minLength: 3,
        maxTotalMs: 1200,
        maxAvgMs: 120,
        requireEnterSuffix: true
      },
      id: {
        minLength: 8,
        maxTotalMs: 1800,
        maxAvgMs: 120,
        requireEnterSuffix: true
      }
    };

    // =========================================================
    // HELPERS GLOBALES
    // =========================================================
    const notify_ = (mensaje, tipo = "info", timer = 2500, options = {}) => {
      const fn = window.notificar || window.lanzarNotificacion;
      if (typeof fn === "function") {
        fn(mensaje, tipo, timer, options);
      }
    };

    const createNotifyOnce_ = (ref) => (key, mensaje, tipo = "info", timer = 2500, options = {}, cooldown = 7000) => {
      const now = Date.now();
      const last = ref.current[key] || 0;
      if (now - last < cooldown) return;
      ref.current[key] = now;
      notify_(mensaje, tipo, timer, options);
    };

    const shellNotifyStateRef = { current: {} };
    const notifyOnceShell_ = createNotifyOnce_(shellNotifyStateRef);

    function toStr_(value) {
      return String(value == null ? "" : value).trim();
    }

    function toUpper_(value) {
      return toStr_(value).toUpperCase();
    }

    function toNum_(value) {
      if (value === "" || value == null) return 0;
      const n = Number(value);
      return isNaN(n) ? 0 : n;
    }

    function _esDateValida_(d) {
      return d instanceof Date && !isNaN(d.getTime());
    }

    function _parseFechaFlexible_(value) {
      if (!value) return null;

      if (value instanceof Date) {
        return _esDateValida_(value) ? value : null;
      }

      const str = String(value).trim();
      if (!str) return null;

      if (/^\d{2}\/\d{2}\/\d{4}$/.test(str)) {
        const parts = str.split("/");
        const day = Number(parts[0]);
        const month = Number(parts[1]);
        const year = Number(parts[2]);
        const d = new Date(year, month - 1, day, 0, 0, 0, 0);
        return _esDateValida_(d) ? d : null;
      }

      const parsed = new Date(str);
      return _esDateValida_(parsed) ? parsed : null;
    }

    function _parseHoraFlexible_(value) {
      if (!value) return null;

      if (value instanceof Date) {
        return _esDateValida_(value) ? value : null;
      }

      const str = String(value).trim();
      if (!str) return null;

      if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(str)) {
        const parts = str.split(":");
        const hh = Number(parts[0] || 0);
        const mm = Number(parts[1] || 0);
        const ss = Number(parts[2] || 0);
        const d = new Date(2000, 0, 1, hh, mm, ss, 0);
        return _esDateValida_(d) ? d : null;
      }

      const parsed = new Date(str);
      return _esDateValida_(parsed) ? parsed : null;
    }

    function formatearFecha_(value) {
      const d = _parseFechaFlexible_(value);
      if (!d) return "Sin fecha";
      return d.toLocaleDateString("es-MX", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    function formatearHora_(value) {
      const d = _parseHoraFlexible_(value);
      if (!d) return "--";
      return d.toLocaleTimeString("es-MX", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
    }

    function construirResumenFechaHora_(item) {
      return `${formatearFecha_(item.fecha)} • ${formatearHora_(item.horainicio)} - ${formatearHora_(item.horafin)}`;
    }

    function getConfiabilidadVisual_(valor) {
      const n = Number(valor || 0);

      if (n < 90) {
        return {
          label: "Crítica",
          className: "aec-chip aec-chip-red",
          tone: "red"
        };
      }

      if (n >= 97) {
        return {
          label: "Controlada",
          className: "aec-chip aec-chip-emerald",
          tone: "emerald"
        };
      }

      return {
        label: "Atención",
        className: "aec-chip aec-chip-amber",
        tone: "amber"
      };
    }

    function getEstadoFilaVisual_(row) {
      const estado = toUpper_(row.estado);

      if (estado === "CORRECTO") {
        return {
          className: "aec-chip aec-chip-emerald",
          rowClass: "row-correcto",
          text: "Correcto"
        };
      }

      if (estado === "FALTANTE") {
        return {
          className: "aec-chip aec-chip-amber",
          rowClass: "row-faltante",
          text: "Faltante"
        };
      }

      if (estado === "SOBRANTE") {
        return {
          className: "aec-chip aec-chip-red",
          rowClass: "row-sobrante",
          text: "Sobrante"
        };
      }

      return {
        className: "aec-chip aec-chip-slate",
        rowClass: "",
        text: "Pendiente"
      };
    }

    function filaEsEsperada_(row) {
      return toUpper_(row.estado) !== "SOBRANTE";
    }

    // =========================================================
    // ICONO LOCAL
    // =========================================================
    const LocalIcon = ({ name, size = 18, className = "" }) => {
      const iconRef = useRef(null);

      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = "";
          const i = document.createElement("i");
          i.setAttribute("data-lucide", name.toLowerCase());
          i.style.width = `${size}px`;
          i.style.height = `${size}px`;
          if (className) i.className = className;
          iconRef.current.appendChild(i);
          window.lucide.createIcons();
        }
      }, [name, size, className]);

      return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
    };

    // =========================================================
    // COMPONENTE PRINCIPAL
    // =========================================================
    const AuditoriaExcedentesCapturaView = () => {
      const [loading, setLoading] = useState(true);
      const [busyRefresh, setBusyRefresh] = useState(false);

      const [bootstrapData, setBootstrapData] = useState({
        usuarios: [],
        bodegas: [],
        auditoriasAbiertas: []
      });

      const [auditId, setAuditId] = useState(
        window.__AUDITORIA_EXCEDENTES_CAPTURA_ID__ ||
        window.__AUDITORIA_EXCEDENTES_DETALLE_ID__ ||
        ""
      );

      const [auditHeader, setAuditHeader] = useState(null);
      const [auditResumen, setAuditResumen] = useState({});
      const [locationState, setLocationState] = useState({
        ubicacion: "",
        abierta: false,
        detalle: [],
        resumen: {
          esperados: 0,
          escaneados: 0,
          correctos: 0,
          faltantes: 0,
          sobrantes: 0
        }
      });

      const [locationInput, setLocationInput] = useState("");
      const [idInput, setIdInput] = useState("");
      const [lastResult, setLastResult] = useState(null);
      const [highlightId, setHighlightId] = useState("");

      const [processingLocation, setProcessingLocation] = useState(false);
      const [processingId, setProcessingId] = useState(false);
      const [processingCloseLocation, setProcessingCloseLocation] = useState(false);
      const [processingCloseAudit, setProcessingCloseAudit] = useState(false);
      const [auditCloseNotes, setAuditCloseNotes] = useState("");

      const [strictScannerMode] = useState(true);

      const firstLoadDoneRef = useRef(false);
      const locationInputRef = useRef(null);
      const idInputRef = useRef(null);


      const scanMetaRef = useRef({
        location: {
          startedAt: 0,
          lastAt: 0,
          count: 0,
          endedByEnter: false
        },
        id: {
          startedAt: 0,
          lastAt: 0,
          count: 0,
          endedByEnter: false,
          firstInputAt: 0,
          lastInputAt: 0,
          lastValueLength: 0,
          bulkInjected: false
        }
      });



      // -------------------------------------------------------
      // HEURÍSTICA DE ESCÁNER
      // -------------------------------------------------------

      function resetScanMeta_(kind) {
        if (kind === "id") {
          scanMetaRef.current[kind] = {
            startedAt: 0,
            lastAt: 0,
            count: 0,
            endedByEnter: false,
            firstInputAt: 0,
            lastInputAt: 0,
            lastValueLength: 0,
            bulkInjected: false
          };
          return;
        }

        scanMetaRef.current[kind] = {
          startedAt: 0,
          lastAt: 0,
          count: 0,
          endedByEnter: false
        };
      }


      function trackScanKey_(kind, event) {
        if (!strictScannerMode) return;

        const key = event.key || "";
        const now = Date.now();
        const meta = scanMetaRef.current[kind];

        if (key === "Enter") {
          if (!meta.startedAt) {
            meta.startedAt = now;
          }
          meta.lastAt = now;
          meta.endedByEnter = true;
          return;
        }

        const printable =
          key.length === 1 &&
          !event.ctrlKey &&
          !event.metaKey &&
          !event.altKey;

        if (!printable) return;

        if (!meta.startedAt) {
          meta.startedAt = now;
        }

        meta.lastAt = now;
        meta.count += 1;
      }

      function trackScanInput_(kind, value) {
        if (!strictScannerMode) return;
        if (kind !== "id") return;

        const meta = scanMetaRef.current[kind];
        const now = Date.now();
        const len = toStr_(value).length;
        const prevLen = Number(meta.lastValueLength || 0);
        const delta = len - prevLen;

        if (len > 0 && !meta.firstInputAt) {
          meta.firstInputAt = now;
        }

        if (len > 0) {
          meta.lastInputAt = now;
        }

        // Si el valor "saltó" varios caracteres de golpe, fue inyección rápida del scanner
        if (delta >= 3) {
          meta.bulkInjected = true;
        }

        meta.lastValueLength = len;
      }

      function validateScannerLikeInput_(kind, value) {
        if (!strictScannerMode) return true;

        const rule = SCAN_RULES[kind];
        const val = toStr_(value);
        const meta = scanMetaRef.current[kind];

        if (!rule) return true;
        if (!val) return false;
        if (val.length < rule.minLength) return false;

        // UBICACIÓN: mantiene la validación actual con Enter
        if (kind === "location") {
          if (!meta.startedAt || !meta.lastAt) return false;
          if (rule.requireEnterSuffix && !meta.endedByEnter) return false;

          const totalMs = meta.lastAt - meta.startedAt;
          const avgMs = meta.count > 1
            ? totalMs / Math.max(meta.count - 1, 1)
            : totalMs;

          return totalMs <= rule.maxTotalMs && avgMs <= rule.maxAvgMs;
        }

        // IDUNICO:
        // Caso 1: scanner normal por teclas + Enter
        if (meta.startedAt && meta.lastAt && meta.endedByEnter) {
          const totalMs = meta.lastAt - meta.startedAt;
          const avgMs = meta.count > 1
            ? totalMs / Math.max(meta.count - 1, 1)
            : totalMs;

          if (totalMs <= rule.maxTotalMs && avgMs <= rule.maxAvgMs) {
            return true;
          }
        }

        // Caso 2: scanner por text injection / input rápido
        if (meta.bulkInjected && meta.firstInputAt && meta.lastInputAt) {
          const burstMs = meta.lastInputAt - meta.firstInputAt;
          if (burstMs <= 250) {
            return true;
          }
        }

        // Caso 3: todo el valor cayó de golpe en una sola actualización
        if (!meta.endedByEnter && meta.count === 0 && meta.firstInputAt && meta.lastInputAt) {
          const burstMs = meta.lastInputAt - meta.firstInputAt;
          if (burstMs <= 120) {
            return true;
          }
        }

        return false;
      }

      function rejectIfManual_(kind, value, friendlyLabel) {
        const ok = validateScannerLikeInput_(kind, value);
        resetScanMeta_(kind);

        if (!ok) {

            `Se detectó captura manual en ${friendlyLabel}. Debes usar el escáner.`,
            "warning",
            3200,
            {
              title: "Escaneo obligatorio",
              sound: true

          );
          return true;
        }

        return false;
      }

      function applyLocationDelta_(prev, safe) {
        const uiDelta = safe && safe.uiDelta ? safe.uiDelta : {};
        const loc = uiDelta.location || {};
        const row = loc.row || null;
        const op = loc.operacion || "NOOP";

        let detalle = Array.isArray(prev.detalle) ? [...prev.detalle] : [];

        if ((op === "UPDATE_ROW" || op === "UPSERT_ROW") && row && row.idunico) {
          const idx = detalle.findIndex(
            (x) => toUpper_(x.idunico) === toUpper_(row.idunico)

          if (idx >= 0) {
            detalle[idx] = {
              ...detalle[idx],
              ...row
            };
          } else {
            detalle.unshift(row);
          }
        }

        const delta = uiDelta.locationResumenDelta || {};

        return {
          ...prev,
          detalle,
          resumen: {
            ...prev.resumen,
            escaneados: Number(prev.resumen?.escaneados || 0) + Number(delta.escaneados || 0),
            correctos: Number(prev.resumen?.correctos || 0) + Number(delta.correctos || 0),
            faltantes: Number(prev.resumen?.faltantes || 0) + Number(delta.faltantes || 0),
            sobrantes: Number(prev.resumen?.sobrantes || 0) + Number(delta.sobrantes || 0)
          }
        };
      }

                <div className="aec-kpi">
                  <div className="aec-kpi-topbar emerald"></div>
                  <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">
                    Correctos audit.
                  </div>
                  <div className="text-[26px] font-black text-[var(--text-main)] mt-2">
                    {Number(auditResumen.idunicoscorrectostotales || 0)}
                  </div>
                </div>

                <div className="aec-kpi">
                  <div className="aec-kpi-topbar amber"></div>
                  <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">
                    Faltantes audit.
                  </div>
                  <div className="text-[26px] font-black text-[var(--text-main)] mt-2">
                    {Number(auditResumen.idunicosfaltantestotales || 0)}
                  </div>
                </div>

                <div className="aec-kpi">
                  <div className="aec-kpi-topbar red"></div>
                  <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">
                    Sobrantes audit.
                  </div>
                  <div className="text-[26px] font-black text-[var(--text-main)] mt-2">
                    {Number(auditResumen.idunicossobrantestotales || 0)}
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* TOOLBAR PRINCIPAL */}
          <div className="grid grid-cols-1 2xl:grid-cols-[430px_minmax(0,1fr)] gap-6">
            {/* COLUMNA IZQUIERDA */}
            <div className="space-y-6">

              {/* ESCANEO UBICACIÓN */}
              <div className="aec-panel p-5 space-y-4">
                <div className="flex items-center justify-between gap-3 flex-wrap">
                  <div>
                    <div className="text-[11px] font-black uppercase tracking-[0.16em] text-[var(--text-secondary)]">
                      Paso 1 · Escanea la ubicación
                    </div>
                    <div className="text-[18px] font-black text-[var(--text-main)] mt-1">
                      Apertura obligatoria por escáner
                    </div>
                  </div>

                  <span className="aec-chip aec-chip-red">
                    Modo estricto
                  </span>
                </div>

                <div>
                  <label className="aec-label">Escáner de ubicación</label>
                  <input
                    ref={locationInputRef}
                    type="text"
                    inputMode="none"
                    autoComplete="off"
                    spellCheck="false"
                    placeholder="Escanea el identificador de ubicación"
                    className={`aec-input scanner font-mono-premium ${processingLocation ? "locked" : ""}`}
                    value={locationInput}
                    onChange={(e) => setLocationInput(e.target.value.toUpperCase())}
                    onKeyDown={(e) => {
                      if (e.key === "Tab") return;
                      if (e.ctrlKey || e.metaKey || e.altKey) {
                        e.preventDefault();
                        return;
                      }
                      if (e.key === "Enter") {
                        e.preventDefault();
                        trackScanKey_("location", e);
                        procesarEscaneoUbicacion_();
                        return;
                      }
                      trackScanKey_("location", e);
                    }}
                    onPaste={(e) => e.preventDefault()}
                    disabled={!auditId || processingLocation}
                  />
                </div>

                <button
                  type="button"
                  className="aec-btn-primary w-full"
                  onClick={procesarEscaneoUbicacion_}
                  disabled={!auditId || !locationInput || processingLocation}
                >
                  {processingLocation ? "Abriendo ubicación..." : "Procesar ubicación escaneada"}
                </button>

                <div className="aec-card p-4">
                  <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)] mb-2">
                    Ubicación activa
                  </div>

                  <div className="flex items-center justify-between gap-3">
                    <div className="min-w-0">
                      <div className="aec-id text-[18px]">
                        {locationState.ubicacion || "SIN UBICACIÓN ABIERTA"}
                      </div>
                      <div className="aec-subtle mt-1">
                        {locationState.abierta
                          ? "Lista para escanear IdUnicos"
                          : "Escanea una ubicación para comenzar"}
                      </div>
                    </div>

                    <span className={`aec-chip ${locationState.abierta ? "aec-chip-red" : "aec-chip-slate"}`}>
                      {locationState.abierta ? "Operando" : "Inactiva"}
                    </span>
                  </div>
                </div>
              </div>

              {/* ESCANEO IDUNICO */}
              <div className="aec-panel p-5 space-y-4">
                <div className="flex items-center justify-between gap-3 flex-wrap">
                  <div>
                    <div className="text-[11px] font-black uppercase tracking-[0.16em] text-[var(--text-secondary)]">
                      Paso 2 · Escanea IdUnicos
                    </div>
                    <div className="text-[18px] font-black text-[var(--text-main)] mt-1">
                      Captura operativa de material
                    </div>
                  </div>

                  {canScanIds ? (
                    <span className="aec-chip aec-chip-emerald">
                      Escaneo habilitado
                    </span>
                  ) : (
                    <span className="aec-chip aec-chip-slate">
                      Esperando ubicación
                    </span>
                  )}
                </div>

                <div>
                  <label className="aec-label">Escáner de IdUnico</label>
                    <input
                      ref={idInputRef}
                      type="text"
                      inputMode="none"
                      autoComplete="off"
                      spellCheck="false"
                      placeholder={canScanIds ? "Escanea el IdUnico" : "Primero escanea una ubicación"}
                      className={`aec-input scanner font-mono-premium ${!canScanIds || processingId ? "locked" : ""}`}
                      value={idInput}
                      onChange={(e) => {
                        const next = e.target.value.toUpperCase();
                        setIdInput(next);
                        trackScanInput_("id", next);
                      }}
                      onKeyDown={(e) => {
                        if (e.key === "Tab") return;
                        if (e.ctrlKey || e.metaKey || e.altKey) {
                          e.preventDefault();
                          return;
                        }
                        if (e.key === "Enter") {
                          e.preventDefault();
                          trackScanKey_("id", e);
                          procesarEscaneoId_();
                          return;
                        }
                        trackScanKey_("id", e);
                      }}
                      onPaste={(e) => e.preventDefault()}
                      disabled={!canScanIds || processingId}
                    />
                </div>

                <button
                  type="button"
                  className="aec-btn-dark w-full"
                  onClick={procesarEscaneoId_}
                  disabled={!canScanIds || !idInput || processingId}
                >
                  {processingId ? "Procesando escaneo..." : "Procesar IdUnico escaneado"}
                </button>

                <div className={statusLastResultClass}>
                  <div className="text-[10px] font-black uppercase tracking-[0.14em] mb-1">
                    Último resultado
                  </div>

                  {!lastResult ? (
                    <div className="text-[13px] font-semibold">
                      Sin eventos registrados todavía.
                    </div>
                  ) : (
                    <div className="space-y-1">
                      <div className="text-[13px] font-black uppercase tracking-[0.06em]">
                        {lastResult.tipoResultado || "RESULTADO"}
                      </div>

                      <div className="text-[13px] font-semibold leading-relaxed">
                        {lastResult.mensaje || "Sin mensaje."}
                      </div>

                      {lastResult.detalle?.idunico && (
                        <div className="text-[12px] font-mono-premium font-bold">
                          {lastResult.detalle.idunico}
                        </div>
                      )}

                      {lastResult.detalle?.ubicacion && (
                        <div className="text-[11px] font-black uppercase tracking-[0.12em]">
                          Ubicación: {lastResult.detalle.ubicacion}
                        </div>
                      )}
                    </div>
                  )}
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <button
                    type="button"
                    className="aec-btn-danger"
                    onClick={cerrarUbicacion_}
                    disabled={!canCloseLocation || processingCloseLocation}
                  >
                    {processingCloseLocation ? "Cerrando ubicación..." : "Cerrar ubicación"}
                  </button>

                  <button
                    type="button"
                    className="aec-btn-soft"
                    onClick={() => {
                      setIdInput("");
                      resetScanMeta_("id");
                      setTimeout(() => idInputRef.current?.focus(), 50);
                    }}
                    disabled={!canScanIds}
                  >
                    Limpiar escaneo
                  </button>
                </div>
              </div>

              {/* CIERRE DE AUDITORÍA */}
              <div className="aec-panel p-5 space-y-4">
                <div>
                  <label className="aec-label">Observaciones de cierre</label>
                  <textarea
                    className="aec-textarea"
                    placeholder="Notas finales de auditoría..."
                    value={auditCloseNotes}
                    onChange={(e) => setAuditCloseNotes(e.target.value)}
                  />
                </div>

                <button
                  type="button"
                  className="aec-btn-primary w-full"
                  onClick={cerrarAuditoria_}
                  disabled={!auditId || processingCloseAudit}
                >
                  {processingCloseAudit ? "Cerrando auditoría..." : "Cerrar auditoría"}
                </button>
              </div>
            </div>

            {/* COLUMNA DERECHA */}
            <div className="space-y-6">
              {/* RESUMEN DE UBICACIÓN */}
              <div className="aec-panel p-5">
                <div className="flex flex-col xl:flex-row xl:items-start xl:justify-between gap-5">
                  <div>
                    <p className="text-[11px] font-black uppercase tracking-[0.16em] text-[var(--text-secondary)] mb-1">
                      Ubicación en operación
                    </p>
                    <h3 className="m-0 p-0 bg-transparent border-none text-[var(--text-main)] text-[24px] font-black tracking-tight font-mono-premium">
                      {locationState.ubicacion || "SIN UBICACIÓN"}
                    </h3>
                    <div className="mt-2">
                      <span className={`aec-chip ${locationState.abierta ? "aec-chip-red" : "aec-chip-slate"}`}>
                        {locationState.abierta ? "Abierta / capturando" : "Sin apertura activa"}
                      </span>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 md:grid-cols-5 gap-3 w-full xl:w-auto xl:min-w-[680px]">
                    <div className="aec-kpi">
                      <div className="aec-kpi-topbar slate"></div>
                      <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">Esperados</div>
                      <div className="text-[24px] font-black text-[var(--text-main)] mt-2">
                        {Number(locationState.resumen?.esperados || 0)}
                      </div>
                    </div>

                    <div className="aec-kpi">
                      <div className="aec-kpi-topbar slate"></div>
                      <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">Escaneados</div>
                      <div className="text-[24px] font-black text-[var(--text-main)] mt-2">
                        {Number(locationState.resumen?.escaneados || 0)}
                      </div>
                    </div>

                    <div className="aec-kpi">
                      <div className="aec-kpi-topbar emerald"></div>
                      <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">Correctos</div>
                      <div className="text-[24px] font-black text-[var(--text-main)] mt-2">
                        {Number(locationState.resumen?.correctos || 0)}
                      </div>
                    </div>

                    <div className="aec-kpi">
                      <div className="aec-kpi-topbar amber"></div>
                      <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">Faltantes</div>
                      <div className="text-[24px] font-black text-[var(--text-main)] mt-2">
                        {Number(locationState.resumen?.faltantes || 0)}
                      </div>
                    </div>

                    <div className="aec-kpi">
                      <div className="aec-kpi-topbar red"></div>
                      <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">Sobrantes</div>
                      <div className="text-[24px] font-black text-[var(--text-main)] mt-2">
                        {Number(locationState.resumen?.sobrantes || 0)}
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              {/* TABLA OPERATIVA */}
              <div className="aec-panel overflow-hidden">
                <div className="aec-sticky-focus px-5 pt-5 pb-3 flex items-center justify-between gap-3 flex-wrap">
                  <div>
                    <p className="text-[11px] font-black uppercase tracking-[0.16em] text-[var(--text-secondary)] mb-1">
                      Material esperado y conciliación
                    </p>
                    <h3 className="m-0 p-0 bg-transparent border-none text-[var(--text-main)] text-[22px] font-black tracking-tight">
                      Ubicación auditada
                    </h3>
                  </div>

                  <div className="flex flex-wrap items-center gap-2">
                    <span className="aec-chip aec-chip-slate">
                      {expectedRows.length} esperados
                    </span>
                    <span className="aec-chip aec-chip-red">
                      {sobranteRows.length} sobrantes
                    </span>
                  </div>
                </div>

                <div className="aec-table-wrap custom-scroll">
                  <table className="aec-table">
                    <thead>
                      <tr>
                        <th>IdUnico</th>
                        <th>Código</th>
                        <th>Descripción</th>
                        <th>Estado</th>
                        <th>Hora</th>
                        <th>Observaciones</th>
                      </tr>
                    </thead>

                    <tbody>
                      {currentRows.map((row, idx) => {
                        const estadoVisual = getEstadoFilaVisual_(row);
                        const rowId = toUpper_(row.idunico);
                        const highlight = rowId && highlightId && rowId === highlightId;

                        return (
                          <tr
                            key={`${row.idunico || "SIN-ID"}-${idx}`}
                            className={`aec-row ${estadoVisual.rowClass} ${highlight ? "row-highlight flash-row" : ""}`}
                          >
                            <td>
                              <span className="aec-id text-[14px]">
                                {row.idunico || "—"}
                              </span>
                            </td>

                            <td>
                              <span className="aec-code text-[13px]">
                                {row.codigo || "—"}
                              </span>
                            </td>

                            <td>
                              <span className="text-[12px] font-semibold uppercase text-[var(--text-secondary)] leading-snug">
                                {row.descripcion || "Sin descripción"}
                              </span>
                            </td>

                            <td>
                              <span className={estadoVisual.className}>
                                {estadoVisual.text}
                              </span>
                            </td>

                            <td>
                              <span className="aec-code text-[12px]">
                                {formatearHora_(row.hora)}
                              </span>
                            </td>

                            <td>
                              <span className="text-[12px] font-semibold text-[var(--text-secondary)]">
                                {row.observaciones || "—"}
                              </span>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>

                  {!loading && currentRows.length === 0 && (
                    <div className="aec-empty-state">
                      <div className="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                        <LocalIcon name="scan-line" size={28} />
                      </div>

                      <span className="text-[13px] font-black uppercase tracking-widest text-[var(--text-secondary)]">
                        Sin ubicación cargada
                      </span>

                      <span className="text-[11px] text-slate-400 font-semibold">
                        Escanea la ubicación para cargar el universo esperado.
                      </span>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // =========================================================
    // MONTAJE
    // =========================================================
    const targetElement = document.getElementById("render-auditoria-excedentes-captura");

    if (!targetElement) {
      notify_(
        "No se encontró el contenedor principal de captura.",
        "error",
        4200,
        {
          title: "Error de interfaz",
          sound: true
        }
      );
      console.warn("⚠️ [AuditoriaExcedentesCaptura] No se encontró #render-auditoria-excedentes-captura");
      return;
    }

    const yaInicializado = targetElement.dataset.aecMounted === "1";

    if (window.__AUDITORIA_EXCEDENTES_CAPTURA_ROOT__) {
      try {
        window.__AUDITORIA_EXCEDENTES_CAPTURA_ROOT__.unmount();
      } catch (e) {
        console.warn("⚠️ [AuditoriaExcedentesCaptura] No se pudo desmontar root previo:", e);
        notifyOnceShell_(
          "auditoria-captura-root-previo",
          "Se liberó una instancia previa de captura.",
          "warning",
          1600,
          {
            title: "Reinicialización",
            sound: false
          },
          10000
        );
      }
      window.__AUDITORIA_EXCEDENTES_CAPTURA_ROOT__ = null;
    }

    try {
      targetElement.dataset.aecMounted = "1";
      window.__AUDITORIA_EXCEDENTES_CAPTURA_ROOT__ = ReactDOM.createRoot(targetElement);
      window.__AUDITORIA_EXCEDENTES_CAPTURA_ROOT__.render(<AuditoriaExcedentesCapturaView />);

      if (!yaInicializado) {
        notifyOnceShell_(
          "auditoria-captura-vista-montada",
          "Vista de captura lista para operar.",
          "success",
          1500,
          {
            title: "Vista cargada",
            sound: false
          },
          12000
        );
      }
    } catch (e) {
      console.error("❌ [AuditoriaExcedentesCaptura] Error montando root React:", e);
      notify_(
        "Ocurrió un error al montar la vista de captura.",
        "error",
        4200,
        {
          title: "Error de montaje",
          sound: true
        }
      );
    }
  };

  window.initVista = window.cargar_AuditoriaExcedentesCaptura;
  console.log("🧩 [AuditoriaExcedentesCaptura] Vista inyectable inicializada y registrada.");
</script>
