        return <div className="aec-page"><section className="aec-workspace">
      <header className="aec-header">
        <div className="aec-id-block"><div className="aec-icon-box"><LocalIcon name="clipboard-check" size={23}/></div><div><p className="aec-eyebrow">Captura operativa de auditoría</p><h2 className="aec-title">{auditHeader?.idauditoria || auditId || "SIN AUDITORÍA"}</h2><p className="aec-subtitle">{auditHeader?.auditor || "SIN AUDITOR"} · {toUpper_(auditHeader?.tipoauditoria) === "POR_BODEGA" ? "POR BODEGA" : "GLOBAL"} · {auditHeader?.bodegaobjetivo || "TODAS LAS BODEGAS"}</p><div className="aec-chips"><span className={toUpper_(auditHeader?.estatus) === "ABIERTA" ? "aec-chip aec-chip-red" : "aec-chip aec-chip-green"}>{auditHeader?.estatus || "SIN ESTADO"}</span></div></div></div>
        <div className="aec-metrics">{[["Esperados", auditResumen.idunicosesperadostotales || auditResumen.esperados || 0, ""], ["Correctos", auditResumen.idunicoscorrectostotales || auditResumen.correctos || 0, "green"], ["Faltantes", auditResumen.idunicosfaltantestotales || auditResumen.faltantes || 0, "amber"], ["Sobrantes", auditResumen.idunicossobrantestotales || auditResumen.sobrantes || 0, "red"]].map(([l, v, t]) => <div key={l} className={`aec-metric ${t}`}><div className="aec-metric-value">{Number(v)}</div><div className="aec-metric-label">{l}</div></div>)}</div>
        <div className="aec-actions">
          <button
            type="button"
            className="aec-action"
            onClick={() => {
              /*
              * Primero sincroniza cualquier escaneo pendiente.
              * Solo recarga el paquete si la sincronización terminó
              * correctamente.
              */
              flush_((sincronizacionCorrecta) => {
                if (!sincronizacionCorrecta) {
                  notify_(
                    "No se puede actualizar porque existen escaneos sin sincronizar.",
                    "warning",
                    3600,
                    {
                      title: "Sincronización pendiente",
                      sound: true
                    }
                  );

                  return;
                }

                cargarPaquete_(auditIdRef.current);
              });
            }}
            disabled={
              busyLocation ||
              busyCloseLocation ||
              busyCloseAudit
            }
          >
            <LocalIcon
              name="refresh-cw"
              size={16}
            />

            {syncing || pendingCount > 0
              ? "Sincronizando..."
              : "Actualizar"}
          </button>

          <button
            type="button"
            className="aec-action danger"
            onClick={cerrarAuditoria_}
            disabled={
              busyCloseAudit ||
              busyCloseLocation ||
              busyLocation ||
              syncing ||
              pendingCount > 0
            }
          >
            <LocalIcon
              name="lock-keyhole"
              size={16}
            />

            {busyCloseAudit
              ? "Cerrando..."
              : syncing || pendingCount > 0
                ? "Sincronizando..."
                : "Cerrar auditoría"}
          </button>
        </div>
      </header>
      <div className="aec-toolbar">
  <div className="aec-toolbar-main">
    <div className="aec-toolbar-icon">
      <LocalIcon
        name="warehouse"
        size={17}
      />
    </div>

    <div className="aec-toolbar-copy">
      <span className="aec-toolbar-eyebrow">
        Conciliación
      </span>

      <span className="aec-toolbar-separator" />

      <div className="aec-toolbar-location">
        <h3
          className="aec-toolbar-title"
          title={
            locationState.ubicacion ||
            "Sin ubicación activa"
          }
        >
          {locationState.ubicacion ||
            "SIN UBICACIÓN ACTIVA"}
        </h3>

        {locationState.abierta && (
          <span
            className="aec-toolbar-bodega"
            title={
              locationState.bodega ||
              "Sin bodega"
            }
          >
            {locationState.bodega ||
              "SIN BODEGA"}
          </span>
        )}
      </div>
    </div>
  </div>

  <div className="aec-toolbar-context">
    {lastResult && (
      <span
        className={
          toUpper_(
            lastResult.tipoResultado
          ) === "CORRECTO"
            ? "aec-chip aec-chip-green"
            : toUpper_(
                lastResult.tipoResultado
              ) === "SOBRANTE"
              ? "aec-chip aec-chip-red"
              : "aec-chip aec-chip-amber"
        }
      >
        {lastResult.tipoResultado}
      </span>
    )}

    <span
      className={`aec-live ${
        syncing || pendingCount > 0
          ? "warning"
          : canScan
            ? "ready"
            : ""
      }`}
    >
      <span className="aec-dot" />

      {syncing
        ? "Sincronizando"
        : pendingCount > 0
          ? `${pendingCount} pendientes`
          : canScan
            ? "Escáner activo"
            : "Sin captura"}
    </span>

    <span
      className="aec-live"
      title={`${rows.length} registros visibles`}
    >
      <LocalIcon
        name="rows-3"
        size={13}
      />

      {rows.length}
    </span>
  </div>
</div>
      
      <div className="aec-content"><div className="aec-table-wrap custom-scroll"><table className="aec-table"><thead><tr><th>IdUnico</th><th>Código</th><th>Descripción</th><th>Estado</th><th>Hora</th><th>Observaciones</th></tr></thead><tbody>{rows.map((row, idx) => { const v = estadoVisual_(row.estado), high = toUpper_(row.idunico) === highlightId; return <tr key={`${row.idunico}-${idx}`} className={`aec-row ${v.row} ${high ? "row-highlight flash-row" : ""}`}><td><span className="aec-id">{row.idunico || "—"}</span></td><td><span className="aec-code">{row.codigo || "—"}</span></td><td>{row.descripcion || "Sin descripción"}</td><td><span className={v.chip}>{v.text}</span></td><td className="aec-code">{fmtTime_(row.hora)}</td><td>{row.observaciones || "—"}</td></tr>; })}</tbody></table>{!rows.length && <div className="aec-empty"><LocalIcon name="scan-line" size={30}/><b>{locationState.abierta ? "SIN REGISTROS EN ESTA UBICACIÓN" : "SIN UBICACIÓN CARGADA"}</b></div>}</div></div>
    </section>
    <div className="fab-captura-contextual">
      {panelCaptura === "ABRIR_UBICACION" && <div className="aec-floating-panel animate-fab-in"><div className="flex justify-between items-start mb-4"><div><div className="aec-eyebrow !text-slate-500">Paso 1</div><h3 className="text-xl font-black">Escanea ubicación</h3></div><button className="aec-btn soft" onClick={() => setPanelCaptura("")}>Cerrar</button></div><input ref={locationRef} className="aec-input" value={locationInput} onChange={e => setLocationInput(e.target.value.toUpperCase())} onKeyDown={(event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          event.stopPropagation();
          abrirUbicacion_();
        }
      }} 
      placeholder="Escanea ubicación"/><button className="aec-btn primary w-full mt-3" onClick={abrirUbicacion_} disabled={busyLocation}>{busyLocation ? "Abriendo..." : "Procesar ubicación"}</button></div>}
      {panelCaptura === "CERRAR_UBICACION" && <div className="aec-floating-panel animate-fab-in"><div className="flex justify-between items-start mb-4"><div><div className="aec-eyebrow !text-slate-500">Paso 3</div><h3 className="text-xl font-black">Cierre de ubicación</h3><div className="aec-id">{locationState.ubicacion}</div></div><button className="aec-btn soft" onClick={() => setPanelCaptura("")}>Cancelar</button></div><textarea ref={closeNotesRef} className="aec-textarea" value={locationCloseNotes} onChange={e => setLocationCloseNotes(e.target.value)} placeholder="Observaciones de cierre..."/><button className="aec-btn danger w-full mt-3" onClick={cerrarUbicacion_} disabled={busyCloseLocation}>{busyCloseLocation ? "Cerrando..." : "Confirmar cierre"}</button></div>}
      <button className={`aec-btn ${locationState.abierta ? "danger" : "primary"}`} onClick={() => { if (locationState.abierta) {
            setPanelCaptura("CERRAR_UBICACION");
            focus_(closeNotesRef, 120);
        }
        else {
            setPanelCaptura("ABRIR_UBICACION");
            focus_(locationRef, 120);
        } }}><LocalIcon name={locationState.abierta ? "lock" : "plus"} size={18}/>{locationState.abierta ? "Cerrar ubicación" : "Auditar ubicación"}</button>
    </div>
    </div>;
    };
    const target = document.getElementById("render-auditoria-excedentes-captura");
    if (!target) {
        notify_("No se encontró el contenedor.", "error");
        return;
    }
    if (window.__AUDITORIA_EXCEDENTES_CAPTURA_ROOT__) {
        try {
            window.__AUDITORIA_EXCEDENTES_CAPTURA_ROOT__.unmount();
        }
        catch (e) {
            console.warn(e);
        }
    }
    window.__AUDITORIA_EXCEDENTES_CAPTURA_ROOT__ = ReactDOM.createRoot(target);
    window.__AUDITORIA_EXCEDENTES_CAPTURA_ROOT__.render(<View />);
};
window.initVista = window.cargar_AuditoriaExcedentesCaptura;
</script>
