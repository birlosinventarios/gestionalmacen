<script type="text/babel">
window.cargar_AuditoriaExcedentesCaptura = () => {
  const { useState, useEffect, useCallback, useRef } = React;

  const FLUSH_CADA = 2;
  const FLUSH_MS = 350;

  const notify_ = (msg, type = "info", timer = 2200, options = {}) => {
    const fn = window.notificar || window.lanzarNotificacion;
    if (typeof fn === "function") fn(msg, type, timer, options);
  };

  const toStr_ = (v) => String(v == null ? "" : v).trim();
  const toUpper_ = (v) => toStr_(v).toUpperCase();
  const toNum_ = (v) => {
    const n = Number(v || 0);
    return isNaN(n) ? 0 : n;
  };

  const nowTime_ = () => new Date().toLocaleTimeString("es-MX", { hour12: false });

  const fmtTime_ = (v) => {
    if (!v) return "--";
    if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(String(v))) return String(v).slice(0, 5);
    const d = v instanceof Date ? v : new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", hour12: false });
  };

  const estadoVisual_ = (estado) => {
    const e = toUpper_(estado);
    if (e === "CORRECTO") return { chip: "aec-chip aec-chip-emerald", row: "row-correcto", text: "Correcto" };
    if (e === "FALTANTE") return { chip: "aec-chip aec-chip-amber", row: "row-faltante", text: "Faltante" };
    if (e === "SOBRANTE") return { chip: "aec-chip aec-chip-red", row: "row-sobrante", text: "Sobrante" };
    return { chip: "aec-chip aec-chip-slate", row: "", text: "Pendiente" };
  };

  const confiabilidad_ = (valor) => {
    const n = Number(valor || 0);
    if (n < 90) return { label: "Crítica", className: "aec-chip aec-chip-red" };
    if (n >= 97) return { label: "Controlada", className: "aec-chip aec-chip-emerald" };
    return { label: "Atención", className: "aec-chip aec-chip-amber" };
  };

  const LocalIcon = ({ name, size = 18 }) => {
    const ref = useRef(null);

    useEffect(() => {
      if (!window.lucide || !ref.current) return;
      ref.current.innerHTML = "";
      const i = document.createElement("i");
      i.setAttribute("data-lucide", String(name || "").toLowerCase());
      i.style.width = `${size}px`;
      i.style.height = `${size}px`;
      ref.current.appendChild(i);
      window.lucide.createIcons();
    }, [name, size]);

    return <span ref={ref} className="inline-flex items-center justify-center"></span>;
  };

  const View = () => {
    const [loading, setLoading] = useState(true);
    const [syncing, setSyncing] = useState(false);
    const [bootstrap, setBootstrap] = useState({ auditoriasAbiertas: [] });

    const [auditId, setAuditId] = useState(
      window.__AUDITORIA_EXCEDENTES_CAPTURA_ID__ ||
      window.__AUDITORIA_EXCEDENTES_DETALLE_ID__ ||
      ""
    );

    const [auditHeader, setAuditHeader] = useState(null);
    const [auditResumen, setAuditResumen] = useState({});
    const [locationInput, setLocationInput] = useState("");
    const [idInput, setIdInput] = useState("");

    const [locationState, setLocationState] = useState({
      ubicacion: "",
      bodega: "",
      abierta: false,
      detalle: [],
      resumen: { esperados: 0, escaneados: 0, correctos: 0, faltantes: 0, sobrantes: 0 }
    });

    const [lastResult, setLastResult] = useState(null);
    const [highlightId, setHighlightId] = useState("");
    const [busyLocation, setBusyLocation] = useState(false);
    const [busyCloseLocation, setBusyCloseLocation] = useState(false);
    const [busyCloseAudit, setBusyCloseAudit] = useState(false);
    const [auditCloseNotes, setAuditCloseNotes] = useState("");
    const [locationCloseNotes, setLocationCloseNotes] = useState("");
    const [panelCaptura, setPanelCaptura] = useState("");
    const [pendingCount, setPendingCount] = useState(0);

    const cacheRef = useRef({
      expectedById: {},
      expectedByLocation: {},
      scannedById: {},
      pendingSync: [],
      syncing: false,
      flushTimer: null
    });

    
    const esCodigoUbicacionLocal_ = (valor) => {
      const raw = toUpper_(valor);
      if (!raw) return false;

      // Si coincide con ubicación canónica cargada en el paquete
      if (cacheRef.current.expectedByLocation && cacheRef.current.expectedByLocation[raw]) {
        return true;
      }

      // Patrones de identificadores de ubicación comunes
      const patronesUbicacion = [
        /^B\d[A-Z0-9_-]*$/i,
        /^CB\d[A-Z0-9_-]*$/i,
        /^BM[A-Z0-9_-]*$/i,
        /^MO[A-Z0-9_-]*$/i,
        /^CU[A-Z0-9_-]*$/i
      ];

      return patronesUbicacion.some((rx) => rx.test(raw));
    };


    const enrichRef = useRef({
      queue: [],
      running: false,
      timer: null,
      known: {}
    });

    const locationRef = useRef(null);
    const idRef = useRef(null);
    const closeNotesRef = useRef(null);

    const focusSinScroll_ = (ref, delay = 80) => {
      setTimeout(() => {
        const el = ref?.current;
        if (!el) return;

        const contenedor = document.getElementById("render-auditoria-excedentes-captura");

        const scrollTopContenedor = contenedor ? contenedor.scrollTop : 0;
        const scrollLeftContenedor = contenedor ? contenedor.scrollLeft : 0;

        const scrollXVentana = window.scrollX || window.pageXOffset || 0;
        const scrollYVentana = window.scrollY || window.pageYOffset || 0;

        try {
          el.focus({ preventScroll: true });
        } catch (e) {
          el.focus();
        }

        if (contenedor) {
          contenedor.scrollTop = scrollTopContenedor;
          contenedor.scrollLeft = scrollLeftContenedor;
        }

        window.scrollTo(scrollXVentana, scrollYVentana);
      }, delay);
    };

    const resumenRows_ = (rows) => ({
          esperados: rows.filter((x) => toUpper_(x.estado) !== "SOBRANTE").length,
          escaneados: rows.filter((x) => ["CORRECTO", "SOBRANTE"].includes(toUpper_(x.estado))).length,
          correctos: rows.filter((x) => toUpper_(x.estado) === "CORRECTO").length,
          faltantes: rows.filter((x) => toUpper_(x.estado) === "FALTANTE").length,
          sobrantes: rows.filter((x) => toUpper_(x.estado) === "SOBRANTE").length
        });

        const mapDetallePersistido_ = (rows) => {
          return (Array.isArray(rows) ? rows : [])
            .filter((row) => row && row.idunico)
            .map((row) => {
              let estado = "PENDIENTE";

              if (row.escorrecto === true) {
                estado = "CORRECTO";
              } else if (row.esfaltante === true) {
                estado = "FALTANTE";
              } else if (row.essobrante === true) {
                estado = "SOBRANTE";
              }

              return {
                idunico: toUpper_(row.idunico),
                codigo: toUpper_(row.codigo || ""),
                descripcion: toUpper_(row.descripcion || ""),
                bodega: toUpper_(row.bodega || ""),
                ubicacion: toUpper_(row.ubicacion || ""),
                estado: estado,
                hora: row.horaescaneoidunico || row.hora || "",
                observaciones: row.observaciones || ""
              };
            });
        };

        const buildRowsForLocation_ = useCallback((ubicacion) => {
          const ubi = toUpper_(ubicacion);
          const expected = cacheRef.current.expectedByLocation[ubi] || [];
          const scanned = cacheRef.current.scannedById || {};
          const rows = [];

          expected.forEach((item) => {
            const id = toUpper_(item.idunico);
            const s = scanned[id];
            const perteneceMismaUbicacion = s && toUpper_(s.ubicacion) === ubi;

            rows.push({
              idunico: id,
              codigo: item.codigo || "",
              descripcion: item.descripcion || "",
              bodega: item.bodegaActual || item.bodega || "",
              ubicacion: ubi,
              estado: perteneceMismaUbicacion ? s.estado : "PENDIENTE",
              hora: perteneceMismaUbicacion ? s.hora : "",
              observaciones: perteneceMismaUbicacion ? s.observaciones : "",
              ubicacionSistema: perteneceMismaUbicacion ? s.ubicacionSistema || "" : "",
              bodegaSistema: perteneceMismaUbicacion ? s.bodegaSistema || "" : ""
            });
          });

          Object.keys(scanned).forEach((id) => {
            const s = scanned[id];

            if (toUpper_(s.ubicacion) !== ubi) return;
            if (toUpper_(s.estado) !== "SOBRANTE") return;
            if (rows.some((r) => toUpper_(r.idunico) === id)) return;

            rows.unshift({
              idunico: id,
              codigo: s.codigo || "",
              descripcion: s.descripcion || "",
              bodega: s.bodega || "",
              ubicacion: ubi,
              estado: "SOBRANTE",
              hora: s.hora || "",
              observaciones: s.observaciones || "",
              ubicacionSistema: s.ubicacionSistema || "",
              bodegaSistema: s.bodegaSistema || ""
            });
          });

          return rows.sort((a, b) => {
            return String(a.idunico).localeCompare(String(b.idunico), "es", {
              numeric: true,
              sensitivity: "base"
            });
          });
        }, []);

        const setLocationFromRows_ = useCallback((ubicacion, bodega, abierta) => {
          const rows = buildRowsForLocation_(ubicacion);

          setLocationState({
            ubicacion: toUpper_(ubicacion),
            bodega: toUpper_(bodega),
            abierta: !!abierta,
            detalle: rows,
            resumen: resumenRows_(rows)
          });
        }, [buildRowsForLocation_]);

        const ejecutarEnriquecimientoSobrantes_ = useCallback(() => {
          const state = enrichRef.current;

          if (state.running) return;
          if (!state.queue.length) return;

          const ids = state.queue.splice(0, 25);
          state.running = true;

          google.script.run
            .withSuccessHandler((resp) => {
              state.running = false;

              const data = resp && resp.data ? resp.data : {};

              const actualizacionesObservaciones = [];

              Object.keys(data).forEach((id) => {
                const info = data[id] || {};
                const current = cacheRef.current.scannedById[id];

                if (!current) return;
                if (toUpper_(current.estado) !== "SOBRANTE") return;

                const observacionEnriquecida = info.encontrado
                  ? "Excedente ubicado en " + (info.ubicacionActual || "SIN UBICACIÓN")
                  : info.observaciones || current.observaciones || "IDUNICO NO EXISTE EN UNIVERSO DE AUDITORÍA";

                const actualizado = {
                  ...current,
                  codigo: info.codigo || current.codigo || "",
                  descripcion: info.descripcion || current.descripcion || "",
                  bodegaSistema: info.bodegaActual || "",
                  ubicacionSistema: info.ubicacionActual || "",
                  observaciones: observacionEnriquecida
                };

                cacheRef.current.scannedById[id] = actualizado;

                
                cacheRef.current.pendingSync = cacheRef.current.pendingSync.map((scan) => {
                  if (toUpper_(scan.idunico) !== id) return scan;

                  return {
                    ...scan,
                    codigo: actualizado.codigo || scan.codigo || "",
                    descripcion: actualizado.descripcion || scan.descripcion || "",
                    observaciones: actualizado.observaciones || scan.observaciones || ""
                  };
                });


                actualizacionesObservaciones.push({
                  idunico: id,
                  codigo: actualizado.codigo || "",
                  descripcion: actualizado.descripcion || "",
                  bodegaSistema: actualizado.bodegaSistema || "",
                  ubicacionSistema: actualizado.ubicacionSistema || "",
                  observaciones: actualizado.observaciones || ""
                });
              });

              if (locationState.ubicacion) {
                const rows = buildRowsForLocation_(locationState.ubicacion);

                setLocationState((prev) => ({
                  ...prev,
                  detalle: rows,
                  resumen: resumenRows_(rows)
                }));
              }

              if (actualizacionesObservaciones.length && locationState.ubicacion) {
                google.script.run
                  .withSuccessHandler(() => {
                    console.log(
                      "✅ Observaciones enriquecidas persistidas:",
                      actualizacionesObservaciones.length
                    );
                  })
                  .withFailureHandler((err) => {
                    console.warn(
                      "⚠️ No se pudieron persistir observaciones enriquecidas:",
                      err
                    );
                  })
                  .AuditoriaExcedentesCapturaController_actualizarObservacionesSobrantes({
                    idauditoria: auditId,
                    ubicacionAuditada: locationState.ubicacion,
                    actualizaciones: actualizacionesObservaciones
                  });
              }



              if (state.queue.length) {
                setTimeout(() => ejecutarEnriquecimientoSobrantes_(), 500);
              }
            })
            .withFailureHandler((err) => {
              state.running = false;

              console.warn("No se pudo enriquecer sobrantes:", err);

              if (state.queue.length) {
                setTimeout(() => ejecutarEnriquecimientoSobrantes_(), 1500);
              }
            })
            .AuditoriaExcedentesCapturaController_enriquecerSobrantesLote({
              ids: ids
            });
        }, [buildRowsForLocation_, locationState.ubicacion, auditId]);

        const programarEnriquecimientoSobrante_ = useCallback((idunico) => {
          const id = toUpper_(idunico);

          if (!id) return;
          if (enrichRef.current.known[id]) return;

          enrichRef.current.known[id] = true;
          enrichRef.current.queue.push(id);

          if (enrichRef.current.timer) {
            clearTimeout(enrichRef.current.timer);
          }

          enrichRef.current.timer = setTimeout(() => {
            ejecutarEnriquecimientoSobrantes_();
          }, 700);
        }, [ejecutarEnriquecimientoSobrantes_]);





    const cargarPaquete_ = useCallback((idauditoria) => {
      if (!idauditoria) return;

      setLoading(true);

      google.script.run
        .withSuccessHandler((resp) => {
          const safe = resp || {};
          const expectedByLocation = safe.esperadosPorUbicacion || {};
          const expectedById = safe.esperadoIndex || {};
          const scannedById = safe.escaneadosPrevios || {};

          cacheRef.current.expectedByLocation = expectedByLocation;
          cacheRef.current.expectedById = expectedById;
          cacheRef.current.scannedById = scannedById;
          cacheRef.current.pendingSync = [];
          setPendingCount(0);
          setPanelCaptura("");
          setLocationCloseNotes("");


          setAuditHeader(safe.auditoria || null);
          setAuditResumen({
            ...(safe.auditoria || {}),
            ...(safe.resumen || {})
          });

          const abierta = (safe.ubicaciones || []).find((u) => u.abierta);

          if (abierta) {
            setLocationInput(toUpper_(abierta.ubicacion));
            setLocationFromRows_(abierta.ubicacion, abierta.bodega, true);
          } else {
            setLocationInput("");
            setLocationState({
              ubicacion: "",
              bodega: "",
              abierta: false,
              detalle: [],
              resumen: { esperados: 0, escaneados: 0, correctos: 0, faltantes: 0, sobrantes: 0 }
            });
          }


          setLoading(false);
          notify_("Auditoría cargada en memoria.", "success", 1500, { title: "Captura lista", sound: false });

          if (abierta) {
            focusSinScroll_(idRef, 80);
          } else {
            focusSinScroll_(locationRef, 80);
          }


        })
        .withFailureHandler((err) => {
          console.error("Error paquete captura:", err);
          setLoading(false);
          notify_(err?.message || "No se pudo cargar el paquete de captura.", "error", 4200, { title: "Error", sound: true });
        })
        .AuditoriaExcedentesCapturaController_obtenerPaqueteCaptura(idauditoria);
    }, [setLocationFromRows_]);

    const cargarBootstrap_ = useCallback(() => {
      setLoading(true);

      google.script.run
        .withSuccessHandler((resp) => {
          const safe = resp || {};
          const abiertas = Array.isArray(safe.auditoriasAbiertas) ? safe.auditoriasAbiertas : [];
          setBootstrap({ ...safe, auditoriasAbiertas: abiertas });

          let id = auditId;
          if (!id && abiertas.length) id = abiertas[0].idauditoria;

          if (id) {
            setAuditId(id);
            window.__AUDITORIA_EXCEDENTES_CAPTURA_ID__ = id;
            cargarPaquete_(id);
          } else {
            setLoading(false);
          }
        })
        .withFailureHandler((err) => {
          console.error("Error bootstrap captura:", err);
          setLoading(false);
          notify_(err?.message || "No se pudo cargar captura.", "error", 4200, { title: "Error", sound: true });
        })
        .AuditoriaExcedentesCapturaController_obtenerBootstrapCaptura();
    }, [auditId, cargarPaquete_]);

    useEffect(() => {
      if (typeof google === "undefined" || !google.script || !google.script.run) {
        setLoading(false);
        notify_("google.script.run no está disponible.", "error", 4200, { title: "Entorno inválido", sound: true });
        return;
      }

      cargarBootstrap_();

      return () => {
        if (cacheRef.current.flushTimer) clearTimeout(cacheRef.current.flushTimer);
      };
    }, [cargarBootstrap_]);

    const flushPendientes_ = useCallback((callback) => {
      const cache = cacheRef.current;

      if (cache.syncing) {
        if (callback) {
          setTimeout(() => flushPendientes_(callback), 350);
        }
        return;
      }

      if (!cache.pendingSync.length) {
        if (callback) callback(true);
        return;
      }

      const lote = cache.pendingSync.splice(0, 50);
      setPendingCount(cache.pendingSync.length);
      cache.syncing = true;
      setSyncing(true);

      const ubicacionActual = toUpper_(locationState.ubicacion);
      const esperadosUbicacion = (
        cacheRef.current.expectedByLocation[ubicacionActual] || []
      ).length;

      google.script.run
        .withSuccessHandler((resp) => {
          cache.syncing = false;
          setSyncing(false);

          if (resp?.auditSnapshot) {
            setAuditResumen((prev) => ({ ...prev, ...resp.auditSnapshot }));
            setAuditHeader((prev) => ({ ...(prev || {}), ...resp.auditSnapshot }));
          }

          if (cache.pendingSync.length) {
            setTimeout(() => flushPendientes_(), 250);
          }

          if (callback) callback(true);
        })
        .withFailureHandler((err) => {
          cache.syncing = false;
          setSyncing(false);
          cache.pendingSync.unshift(...lote);
          setPendingCount(cache.pendingSync.length);

          console.error("Error sincronizando lote:", err);
          notify_("No se pudo sincronizar el lote. Se conservará pendiente.", "warning", 3200, {
            title: "Sync pendiente",
            sound: true
          });

          if (callback) callback(false);
        })
        .AuditoriaExcedentesCapturaController_registrarEscaneosLote({
          idauditoria: auditId,
          ubicacion: ubicacionActual,
          esperadosUbicacion: esperadosUbicacion,
          escaneos: lote
        });
    }, [auditId, locationState.ubicacion]);


    const programarFlush_ = useCallback(() => {
      const cache = cacheRef.current;
      setPendingCount(cache.pendingSync.length);

      if (cache.pendingSync.length >= FLUSH_CADA) {
        flushPendientes_();
        return;
      }

      if (cache.flushTimer) clearTimeout(cache.flushTimer);
      cache.flushTimer = setTimeout(() => flushPendientes_(), FLUSH_MS);
    }, [flushPendientes_]);

    const abrirUbicacion_ = () => {
      const identificador = toUpper_(locationInput);

      if (!auditId) {
        notify_("Selecciona una auditoría abierta.", "warning", 2500, {
          title: "Auditoría requerida",
          sound: true
        });
        return;
      }

      if (!identificador) {
        notify_("Escanea una ubicación válida.", "warning", 2500, {
          title: "Ubicación requerida",
          sound: true
        });
        return;
      }

      if (locationState.abierta && locationState.ubicacion) {
        notify_("Cierra la ubicación actual antes de abrir otra.", "warning", 3200, {
          title: "Ubicación activa",
          sound: true
        });
        setPanelCaptura("");
        focusSinScroll_(idRef, 80);
        return;
      }

      setBusyLocation(true);

      google.script.run
        .withSuccessHandler((resp) => {
          const safe = resp || {};
          const ubicacion = toUpper_(safe.ubicacion || identificador);
          const bodega = toUpper_(safe.bodega || "");

          setBusyLocation(false);
          setLocationInput(ubicacion);
          setIdInput("");

          setLastResult({
            tipoResultado: "UBICACION_ABIERTA",
            mensaje: safe.mensaje || "Ubicación abierta correctamente.",
            detalle: { ubicacion }
          });

          setLocationFromRows_(ubicacion, bodega, true);
          setPanelCaptura("");
          setLocationCloseNotes("");

          notify_(safe.mensaje || `Ubicación ${ubicacion} abierta.`, "success", 1400, {
            title: "Ubicación activa",
            sound: false
          });

          focusSinScroll_(idRef, 80);
        })
        .withFailureHandler((err) => {
          console.error("Error abriendo ubicación:", err);

          setBusyLocation(false);
          setLocationInput("");

          notify_(err?.message || "No se pudo abrir la ubicación.", "error", 4200, {
            title: "Error",
            sound: true
          });

          focusSinScroll_(locationRef, 80);
        })
        .AuditoriaExcedentesCapturaController_abrirUbicacionPorEscaneo({
          idauditoria: auditId,
          identificadorUbicacion: identificador
        });
    };

    const evaluarEscaneoLocal_ = (idunico) => {
      const id = toUpper_(idunico);
      const ubicacion = toUpper_(locationState.ubicacion);

    if (!id) {
      return {
        ok: false,
        tipoResultado: "VACIO",
        mensaje: "IdUnico vacío."
      };
    }

    if (!ubicacion) {
      return {
        ok: false,
        tipoResultado: "SIN_UBICACION",
        mensaje: "Primero abre una ubicación."
      };
    }

    // =========================================================
    // BLOQUEO: NO PERMITIR UBICACIÓN COMO IDUNICO
    // =========================================================
    if (esCodigoUbicacionLocal_(id)) {
      return {
        ok: false,
        tipoResultado: "QR_UBICACION_EN_CAMPO_ID",
        mensaje: `El código ${id} corresponde a una ubicación, no a una etiqueta IdUnico.`
      };
    }

    const scanned = cacheRef.current.scannedById[id];

      if (scanned) {
        return {
          ok: true,
          persistir: false,
          tipoResultado: "DUPLICADO",
          mensaje: "Esta etiqueta ya fue escaneada.",
          idunico: id,
          detalle: scanned
        };
      }

      const esperado = cacheRef.current.expectedById[id];

      if (!esperado) {
        return {
          ok: true,
          persistir: true,
          tipoResultado: "SOBRANTE",
          mensaje: "IdUnico no esperado en esta auditoría.",
          idunico: id,
          codigo: "",
          descripcion: "",
          bodega: locationState.bodega,
          observaciones: "IDUNICO NO EXISTE EN UNIVERSO DE AUDITORÍA"
        };
      }

      if (toUpper_(esperado.ubicacionActual) !== ubicacion) {
        return {
          ok: true,
          persistir: true,
          tipoResultado: "SOBRANTE",
          mensaje: `Sobrante. Esperado en ${esperado.ubicacionActual}.`,
          idunico: id,
          codigo: esperado.codigo,
          descripcion: esperado.descripcion,
          bodega: locationState.bodega || esperado.bodegaActual,
          observaciones: `ESPERADO EN ${esperado.ubicacionActual}`
        };
      }

      return {
        ok: true,
        persistir: true,
        tipoResultado: "CORRECTO",
        mensaje: "Escaneo correcto.",
        idunico: id,
        codigo: esperado.codigo,
        descripcion: esperado.descripcion,
        bodega: esperado.bodegaActual || locationState.bodega,
        observaciones: ""
      };
    };

    const procesarIdLocal_ = () => {
      const id = toUpper_(idInput);

      if (!locationState.abierta) {
        notify_("Primero abre una ubicación.", "warning", 2500, { title: "Ubicación requerida", sound: true });
        setIdInput("");
        return;
      }

      const res = evaluarEscaneoLocal_(id);
      setIdInput("");

      if (!res.ok) {
        notify_(res.mensaje, "warning", 2500, { title: "Escaneo inválido", sound: true });
        focusSinScroll_(idRef, 50);
        return;
      }

      if (res.tipoResultado === "DUPLICADO") {
        setLastResult(res);
        setHighlightId(res.idunico);
        setTimeout(() => setHighlightId(""), 1800);
        notify_(res.mensaje, "warning", 1600, { title: "Duplicado", sound: true });
        focusSinScroll_(idRef, 50);
        return;
      }

      const hora = nowTime_();

      const row = {
        idunico: res.idunico,
        tipoResultado: res.tipoResultado,
        codigo: res.codigo || "",
        descripcion: res.descripcion || "",
        bodega: res.bodega || "",
        horaLocal: hora,
        observaciones: res.observaciones || ""
      };

      cacheRef.current.scannedById[res.idunico] = {
        idunico: res.idunico,
        ubicacion: locationState.ubicacion,
        bodega: row.bodega,
        codigo: row.codigo,
        descripcion: row.descripcion,
        estado: res.tipoResultado,
        hora,
        observaciones: row.observaciones
      };

      cacheRef.current.pendingSync.push(row);
      setPendingCount(cacheRef.current.pendingSync.length);

      if (
        res.tipoResultado === "SOBRANTE" &&
        (!res.codigo || !res.descripcion)
      ) {
        programarEnriquecimientoSobrante_(res.idunico);
      }

      const rows = buildRowsForLocation_(locationState.ubicacion);
      setLocationState((prev) => ({
        ...prev,
        detalle: rows,
        resumen: resumenRows_(rows)
      }));

      setLastResult({
        tipoResultado: res.tipoResultado,
        mensaje: res.mensaje,
        detalle: { idunico: res.idunico, ubicacion: locationState.ubicacion }
      });

      setHighlightId(res.idunico);
      setTimeout(() => setHighlightId(""), 1800);

      notify_(
        res.mensaje,
        res.tipoResultado === "CORRECTO" ? "success" : "warning",
        res.tipoResultado === "CORRECTO" ? 900 : 1700,
        { title: res.tipoResultado === "CORRECTO" ? "Correcto" : "Sobrante", sound: res.tipoResultado !== "CORRECTO" }
      );

      programarFlush_();
      focusSinScroll_(idRef, 30);
    };

    const calcularFaltantes_ = () => {
      const ubicacion = toUpper_(locationState.ubicacion);
      const expected = cacheRef.current.expectedByLocation[ubicacion] || [];
      const scanned = cacheRef.current.scannedById || {};

      return expected.filter((item) => {
        const id = toUpper_(item.idunico);
        const s = scanned[id];

        return !(
          s &&
          toUpper_(s.ubicacion) === ubicacion &&
          toUpper_(s.estado) === "CORRECTO"
        );
      });
    };

    const cerrarUbicacion_ = (sinConfirmar = false) => {
      const ubicacion = toUpper_(locationState.ubicacion);

      if (!auditId || !ubicacion) {
        notify_("No hay ubicación activa.", "warning", 2500, { title: "Ubicación requerida", sound: true });
        return;
      }

      const ejecutar = () => {
        setBusyCloseLocation(true);

        flushPendientes_((ok) => {
          if (!ok) {
            setBusyCloseLocation(false);
            notify_("No se puede cerrar con sincronización pendiente.", "error", 3500, { title: "Cierre bloqueado", sound: true });
            return;
          }

          const faltantes = calcularFaltantes_();

          google.script.run
            .withSuccessHandler((resp) => {
              const safe = resp || {};
              setBusyCloseLocation(false);

              if (safe.auditSnapshot) {
                setAuditResumen((prev) => ({ ...prev, ...safe.auditSnapshot }));
                setAuditHeader((prev) => ({ ...(prev || {}), ...safe.auditSnapshot }));
              }

              setLocationState({
                ubicacion: "",
                bodega: "",
                abierta: false,
                detalle: [],
                resumen: {
                  esperados: 0,
                  escaneados: 0,
                  correctos: 0,
                  faltantes: 0,
                  sobrantes: 0
                }
              });

              setLocationInput("");
              setIdInput("");
              setHighlightId("");
              setPanelCaptura("");
              setLocationCloseNotes("");

              setLastResult({
                tipoResultado: "UBICACION_CERRADA",
                mensaje: safe.mensaje || "Ubicación cerrada correctamente.",
                detalle: { ubicacion }
              });

              notify_(safe.mensaje || `Ubicación ${ubicacion} cerrada.`, "success", 1800, {
                title: "Ubicación cerrada",
                sound: true
              });

              focusSinScroll_(locationRef, 80);
            })
            .withFailureHandler((err) => {
              console.error("Error cerrando ubicación:", err);
              setBusyCloseLocation(false);
              notify_(err?.message || "No se pudo cerrar la ubicación.", "error", 4200, { title: "Error", sound: true });
            })
            .AuditoriaExcedentesCapturaController_cerrarUbicacion({
              idauditoria: auditId,
              ubicacion,
              faltantes,
              observaciones: locationCloseNotes || ""
            });
        });
      };

      if (!sinConfirmar && typeof window.confirmarSistema === "function") {
        window.confirmarSistema({
          tipo: "warning",
          title: "Cerrar ubicación",
          text: `¿Cerrar ubicación ${ubicacion}? Los pendientes serán faltantes.`,
          confirmText: "Cerrar ubicación",
          cancelText: "Cancelar"
        }).then((r) => {
          if (r.isConfirmed) ejecutar();
        });
      } else {
        ejecutar();
      }
    };

    const cerrarAuditoria_ = () => {
      if (!auditId) {
        notify_("No hay auditoría activa.", "warning", 2500, { title: "Auditoría requerida", sound: true });
        return;
      }

      const ejecutar = () => {
        setBusyCloseAudit(true);

        flushPendientes_((ok) => {
          if (!ok) {
            setBusyCloseAudit(false);
            notify_("No se puede cerrar con sincronización pendiente.", "error", 3500, { title: "Cierre bloqueado", sound: true });
            return;
          }

          google.script.run
            .withSuccessHandler(() => {
              setBusyCloseAudit(false);
              notify_(`Auditoría ${auditId} cerrada.`, "success", 2200, { title: "Auditoría cerrada", sound: true });

              setAuditId("");
              setAuditHeader(null);
              setAuditResumen({});
              setLocationInput("");
              setIdInput("");
              setLastResult(null);
              setPendingCount(0);

              setLocationState({
                ubicacion: "",
                bodega: "",
                abierta: false,
                detalle: [],
                resumen: { esperados: 0, escaneados: 0, correctos: 0, faltantes: 0, sobrantes: 0 }
              });

              window.__AUDITORIA_EXCEDENTES_CAPTURA_ID__ = "";
              cargarBootstrap_();
            })
            .withFailureHandler((err) => {
              console.error("Error cerrando auditoría:", err);
              setBusyCloseAudit(false);
              notify_(err?.message || "No se pudo cerrar la auditoría.", "error", 4200, { title: "Error", sound: true });
            })
            .AuditoriaExcedentesCapturaController_cerrarAuditoria({
              idauditoria: auditId,
              observaciones: auditCloseNotes || ""
            });
        });
      };

      if (typeof window.confirmarSistema === "function") {
        window.confirmarSistema({
          tipo: "warning",
          title: "Cerrar auditoría",
          text: `¿Cerrar auditoría ${auditId}?`,
          confirmText: "Cerrar auditoría",
          cancelText: "Cancelar"
        }).then((r) => {
          if (r.isConfirmed) ejecutar();
        });
      } else {
        ejecutar();
      }
    };

    const conf = confiabilidad_(auditResumen.confiabilidadtotal || auditHeader?.confiabilidadtotal || 0);
    const rows = Array.isArray(locationState.detalle) ? locationState.detalle : [];
    const expectedRows = rows.filter((r) => toUpper_(r.estado) !== "SOBRANTE");
    const sobrantes = rows.filter((r) => toUpper_(r.estado) === "SOBRANTE");
    const canScan = !!auditId && !!locationState.ubicacion && locationState.abierta && !busyLocation;
    const canCloseLocation = !!auditId && !!locationState.ubicacion && locationState.abierta;

    const debeMantenerFocusEscaner_ = useCallback(() => {
      if (!auditId) return false;
      if (!locationState.ubicacion) return false;
      if (!locationState.abierta) return false;
      if (busyLocation || busyCloseLocation || busyCloseAudit) return false;
      if (panelCaptura === "ABRIR_UBICACION") return false;
      if (panelCaptura === "CERRAR_UBICACION") return false;

      // Si hay modal normal SweetAlert abierto, no robar foco.
      try {
        if (
          typeof Swal !== "undefined" &&
          Swal.isVisible &&
          Swal.isVisible()
        ) {
          const popup = Swal.getPopup ? Swal.getPopup() : document.querySelector(".swal2-popup");
          const esToast = popup && popup.classList.contains("swal2-toast");

          if (!esToast) return false;
        }
      } catch (e) {}

      return true;
    }, [
      auditId,
      locationState.ubicacion,
      locationState.abierta,
      busyLocation,
      busyCloseLocation,
      busyCloseAudit,
      panelCaptura
    ]);

    const reenfocarEscaner_ = useCallback((delay = 80) => {
      if (!debeMantenerFocusEscaner_()) return;
      focusSinScroll_(idRef, delay);
    }, [debeMantenerFocusEscaner_]);

    useEffect(() => {
      const onWindowFocus = () => {
        reenfocarEscaner_(120);
      };

      const onVisibilityChange = () => {
        if (document.visibilityState === "visible") {
          reenfocarEscaner_(120);
        }
      };

      const onPointerUp = (e) => {
        const tag = String(e.target?.tagName || "").toUpperCase();

        // No robar foco si está escribiendo en textarea/select/input visible.
        if (tag === "TEXTAREA" || tag === "SELECT") return;

        // Si está en panel de abrir/cerrar ubicación, no reenfocar al escáner oculto.
        if (panelCaptura === "ABRIR_UBICACION" || panelCaptura === "CERRAR_UBICACION") return;

        reenfocarEscaner_(80);
      };

      window.addEventListener("focus", onWindowFocus);
      document.addEventListener("visibilitychange", onVisibilityChange);
      document.addEventListener("pointerup", onPointerUp, true);

      return () => {
        window.removeEventListener("focus", onWindowFocus);
        document.removeEventListener("visibilitychange", onVisibilityChange);
        document.removeEventListener("pointerup", onPointerUp, true);
      };
    }, [reenfocarEscaner_, panelCaptura]);


    if (loading) {
      return (
        <div className="p-28 flex flex-col items-center justify-center gap-4 fade-in-up">
          <div className="w-10 h-10 border-4 border-slate-100 border-t-[var(--primary)] rounded-full animate-spin"></div>

          <span className="text-[10px] font-black tracking-widest text-slate-400 uppercase">
            Cargando captura de auditoría...
          </span>
        </div>
      );
    }
    return (
      <div className="space-y-3 fade-in-up">
        <div className="aec-panel p-4">
          <div className="grid grid-cols-1 2xl:grid-cols-[minmax(280px,0.9fr)_minmax(280px,0.85fr)_minmax(620px,1.55fr)] gap-4 items-stretch">
            
            <div className="aec-card p-4 flex flex-col justify-center min-h-[118px]">
              <p className="text-[10px] font-black uppercase tracking-[0.16em] text-[var(--text-secondary)] mb-1">
                Captura operativa
              </p>

              <h2 className="m-0 p-0 bg-transparent border-none text-[24px] font-black text-[var(--text-main)] leading-tight">
                {auditHeader?.idauditoria || auditId || "SIN AUDITORÍA"}
              </h2>

              <div className="flex flex-wrap items-center gap-2 mt-2">
                {auditHeader?.estatus && (
                  <span className={`aec-chip ${toUpper_(auditHeader.estatus) === "ABIERTA" ? "aec-chip-open" : "aec-chip-closed"}`}>
                    {auditHeader.estatus}
                  </span>
                )}

                <span className={conf.className}>
                  {Number(auditHeader?.confiabilidadtotal || auditResumen.confiabilidadtotal || 0).toFixed(2)}% · {conf.label}
                </span>

                {syncing && (
                  <span className="aec-chip aec-chip-amber">
                    Sincronizando
                  </span>
                )}

                {pendingCount > 0 && (
                  <span className="aec-chip aec-chip-slate">
                    Pendientes: {pendingCount}
                  </span>
                )}
              </div>
            </div>

            <div className="aec-card p-4 flex flex-col justify-center min-h-[118px]">
              <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)] mb-1 text-center">
                Auditor / Tipo
              </div>

              <div className="text-[17px] font-black uppercase tracking-[0.08em] text-[var(--text-main)] text-center leading-tight">
                {auditHeader?.auditor || "SIN AUDITOR"}
              </div>

              <div className="mt-2 flex justify-center gap-2 flex-wrap">
                {auditHeader?.tipoauditoria && (
                  <span className="aec-chip aec-chip-amber">
                    {toUpper_(auditHeader.tipoauditoria) === "POR_BODEGA" ? "POR BODEGA" : "GLOBAL"}
                  </span>
                )}

                {auditHeader?.bodegaobjetivo && (
                  <span className="aec-chip aec-chip-slate">
                    {auditHeader.bodegaobjetivo}
                  </span>
                )}
              </div>
            </div>

            <div className="aec-card p-3 min-h-[118px]">
              <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)] mb-2">
                Métricos de auditoría
              </div>

              <div className="grid grid-cols-4 gap-2">
                <div className="aec-kpi !min-h-[78px] !p-3">
                  <div className="aec-kpi-topbar slate"></div>
                  <div className="text-[9px] font-black uppercase tracking-[0.12em] text-[var(--text-secondary)]">
                    Esperados
                  </div>
                  <div className="text-[22px] font-black text-[var(--text-main)] mt-2 leading-none">
                    {Number(auditResumen.idunicosesperadostotales || auditResumen.esperados || 0)}
                  </div>
                </div>

                <div className="aec-kpi !min-h-[78px] !p-3">
                  <div className="aec-kpi-topbar emerald"></div>
                  <div className="text-[9px] font-black uppercase tracking-[0.12em] text-[var(--text-secondary)]">
                    Correctos
                  </div>
                  <div className="text-[22px] font-black text-[var(--text-main)] mt-2 leading-none">
                    {Number(auditResumen.idunicoscorrectostotales || auditResumen.correctos || 0)}
                  </div>
                </div>

                <div className="aec-kpi !min-h-[78px] !p-3">
                  <div className="aec-kpi-topbar amber"></div>
                  <div className="text-[9px] font-black uppercase tracking-[0.12em] text-[var(--text-secondary)]">
                    Faltantes
                  </div>
                  <div className="text-[22px] font-black text-[var(--text-main)] mt-2 leading-none">
                    {Number(auditResumen.idunicosfaltantestotales || auditResumen.faltantes || 0)}
                  </div>
                </div>

                <div className="aec-kpi !min-h-[78px] !p-3">
                  <div className="aec-kpi-topbar red"></div>
                  <div className="text-[9px] font-black uppercase tracking-[0.12em] text-[var(--text-secondary)]">
                    Sobrantes
                  </div>
                  <div className="text-[22px] font-black text-[var(--text-main)] mt-2 leading-none">
                    {Number(auditResumen.idunicossobrantestotales || auditResumen.sobrantes || 0)}
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>

        <input
          ref={idRef}
          type="text"
          inputMode="none"
          autoComplete="off"
          className="fixed opacity-0 pointer-events-none w-px h-px left-0 bottom-0"
          value={idInput}
          onChange={(e) => setIdInput(e.target.value.toUpperCase())}
          onKeyDown={(e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              procesarIdLocal_();
            }
          }}
          onBlur={() => {
            reenfocarEscaner_(100);
          }}
          onPaste={(e) => e.preventDefault()}
          disabled={!canScan || panelCaptura === "CERRAR_UBICACION"}
        />

        <div className="space-y-3">
          <div className="aec-panel p-4">
            <div className="grid grid-cols-1 2xl:grid-cols-[minmax(260px,0.55fr)_minmax(720px,1.45fr)] gap-4 items-stretch">
              
              <div className="aec-card p-4 flex flex-col justify-center min-h-[108px]">
                <p className="text-[10px] font-black uppercase tracking-[0.16em] text-[var(--text-secondary)] mb-1">
                  Ubicación activa
                </p>

                <h3 className="m-0 p-0 bg-transparent border-none text-[22px] font-black font-mono-premium text-[var(--text-main)] leading-tight">
                  {locationState.ubicacion || "SIN UBICACIÓN"}
                </h3>

                <div className="mt-2 flex flex-wrap items-center gap-2">
                  <span className={`aec-chip ${locationState.abierta ? "aec-chip-red" : "aec-chip-slate"}`}>
                    {locationState.abierta ? "Abierta" : "Inactiva"}
                  </span>

                  {canScan && (
                    <span className="aec-chip aec-chip-emerald">
                      Escáner activo
                    </span>
                  )}
                </div>
              </div>

              <div className="aec-card p-3 min-h-[108px]">
                <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)] mb-2">
                  Métricos de ubicación
                </div>

                <div className="grid grid-cols-5 gap-2">
                  {[
                    ["Esperados", locationState.resumen.esperados, "slate"],
                    ["Escaneados", locationState.resumen.escaneados, "slate"],
                    ["Correctos", locationState.resumen.correctos, "emerald"],
                    ["Faltantes", locationState.resumen.faltantes, "amber"],
                    ["Sobrantes", locationState.resumen.sobrantes, "red"]
                  ].map(([label, value, tone]) => (
                    <div className="aec-kpi !min-h-[78px] !p-3" key={label}>
                      <div className={`aec-kpi-topbar ${tone}`}></div>

                      <div className="text-[9px] font-black uppercase tracking-[0.12em] text-[var(--text-secondary)] leading-tight">
                        {label}
                      </div>

                      <div className="text-[22px] font-black text-[var(--text-main)] mt-2 leading-none">
                        {Number(value || 0)}
                      </div>
                    </div>
                  ))}
                </div>
              </div>

            </div>
          </div>

          <div className="aec-panel overflow-hidden">
            <div className="aec-conciliacion-header">
              <div className="aec-conciliacion-title-wrap">
                <div className="aec-conciliacion-marker"></div>

                <div className="aec-conciliacion-title-block">
                  <span className="aec-conciliacion-eyebrow">
                    Conciliación operativa
                  </span>

                  <span className="aec-conciliacion-title">
                    Material esperado
                  </span>
                </div>
              </div>

              <div className="aec-conciliacion-statusbar">
                {lastResult && (
                  <span
                    className={
                      toUpper_(lastResult.tipoResultado) === "CORRECTO"
                        ? "aec-chip aec-chip-emerald aec-chip-compact"
                        : toUpper_(lastResult.tipoResultado) === "SOBRANTE"
                        ? "aec-chip aec-chip-red aec-chip-compact"
                        : "aec-chip aec-chip-amber aec-chip-compact"
                    }
                  >
                    {lastResult.tipoResultado}
                  </span>
                )}

                {syncing && (
                  <span className="aec-conciliacion-subtle">
                    <span className="aec-sync-dot warning"></span>
                    Sincronizando
                  </span>
                )}

                {!syncing && pendingCount === 0 && (
                  <span className="aec-conciliacion-subtle">
                    <span className="aec-sync-dot"></span>
                    Listo para escaneo
                  </span>
                )}

                {pendingCount > 0 && (
                  <span className="aec-conciliacion-subtle">
                    <span className="aec-sync-dot pending"></span>
                    Pendientes: {pendingCount}
                  </span>
                )}
              </div>
            </div>

            <div className="aec-table-wrap custom-scroll">
              <table className="aec-table">
                <thead>
                  <tr>
                    <th>IdUnico</th>
                    <th>Código</th>
                    <th>Descripción</th>
                    <th>Estado</th>
                    <th>Hora</th>
                    <th>Observaciones</th>
                  </tr>
                </thead>

                <tbody>
                  {rows.map((row, idx) => {
                    const visual = estadoVisual_(row.estado);
                    const rowId = toUpper_(row.idunico);
                    const high = rowId && highlightId && rowId === highlightId;

                    return (
                      <tr
                        key={`${row.idunico || "SIN-ID"}-${idx}`}
                        className={`aec-row ${visual.row} ${high ? "row-highlight flash-row" : ""}`}
                      >
                        <td>
                          <span className="aec-id text-[14px]">
                            {row.idunico || "—"}
                          </span>
                        </td>

                        <td>
                          <span className="aec-code text-[13px]">
                            {row.codigo || "—"}
                          </span>
                        </td>

                        <td>
                          <span className="text-[12px] font-semibold uppercase text-[var(--text-secondary)]">
                            {row.descripcion || "Sin descripción"}
                          </span>
                        </td>

                        <td>
                          <span className={visual.chip}>
                            {visual.text}
                          </span>
                        </td>

                        <td>
                          <span className="aec-code text-[12px]">
                            {fmtTime_(row.hora)}
                          </span>
                        </td>

                        <td>
                          <span className="text-[12px] font-semibold text-[var(--text-secondary)]">
                            {row.observaciones || "—"}
                          </span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>

              {!rows.length && (
                <div className="aec-empty-state">
                  <div className="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                    <LocalIcon name="scan-line" size={28} />
                  </div>

                  <span className="text-[13px] font-black uppercase tracking-widest text-[var(--text-secondary)]">
                    Sin ubicación cargada
                  </span>

                  <span className="text-[11px] text-slate-400 font-semibold">
                    Presiona “Auditar ubicación” para iniciar.
                  </span>
                </div>
              )}
            </div>
          </div>
        </div>

        <div className="fab-captura-contextual flex flex-col items-end gap-3">

          {panelCaptura === "ABRIR_UBICACION" && (
            <div className="aec-card p-5 aec-floating-panel aec-floating-panel-open animate-fab-in">
              <div className="flex items-start justify-between gap-3 mb-4">
                <div>
                  <div className="text-[11px] font-black uppercase tracking-[0.16em] text-[var(--text-secondary)]">
                    Paso 1
                  </div>
                  <div className="text-[20px] font-black text-[var(--text-main)]">
                    Escanea ubicación
                  </div>
                </div>

                <button
                  type="button"
                  className="aec-btn-soft !min-h-[36px] !px-3"
                  onClick={() => {
                    setPanelCaptura("");
                    if (locationState.abierta) {
                      focusSinScroll_(idRef, 80);
                    }
                  }}
                >
                  Cerrar
                </button>
              </div>

              <input
                ref={locationRef}
                type="text"
                inputMode="none"
                autoComplete="off"
                className={`aec-input scanner font-mono-premium ${busyLocation ? "locked" : ""}`}
                placeholder="Escanea ubicación"
                value={locationInput}
                onChange={(e) => setLocationInput(e.target.value.toUpperCase())}
                onKeyDown={(e) => {
                  if (e.key === "Enter") {
                    e.preventDefault();
                    abrirUbicacion_();
                  }
                }}
                onPaste={(e) => e.preventDefault()}
                disabled={!auditId || busyLocation}
              />

              <button
                className="aec-btn-primary w-full mt-3"
                onClick={abrirUbicacion_}
                disabled={!auditId || !locationInput || busyLocation}
              >
                {busyLocation ? "Abriendo..." : "Procesar ubicación"}
              </button>
            </div>
          )}

          
          {panelCaptura === "CERRAR_UBICACION" && (
            <div className="aec-card p-5 aec-floating-panel aec-floating-panel-close animate-fab-in">
              <div className="flex items-start justify-between gap-3 mb-4">
                <div>
                  <div className="text-[11px] font-black uppercase tracking-[0.16em] text-[var(--text-secondary)]">
                    Paso 3
                  </div>
                  <div className="text-[20px] font-black text-[var(--text-main)]">
                    Cierre de ubicación
                  </div>
                  <div className="aec-id text-[14px] mt-1">
                    {locationState.ubicacion || "SIN UBICACIÓN"}
                  </div>
                </div>

                <button
                  type="button"
                  className="aec-btn-soft !min-h-[36px] !px-3"
                  onClick={() => {
                    setPanelCaptura("");
                    focusSinScroll_(idRef, 80);
                  }}
                  disabled={busyCloseLocation}
                >
                  Cancelar
                </button>
              </div>

              <textarea
                ref={closeNotesRef}
                className="aec-textarea"
                placeholder="Observaciones de cierre de ubicación..."
                value={locationCloseNotes}
                onChange={(e) => setLocationCloseNotes(e.target.value)}
                disabled={busyCloseLocation}
              />

              <button
                className="aec-btn-danger w-full mt-3"
                onClick={() => cerrarUbicacion_(true)}
                disabled={!canCloseLocation || busyCloseLocation}
              >
                {busyCloseLocation ? "Cerrando..." : "Confirmar cierre de ubicación"}
              </button>
            </div>
          )}

          <button
            type="button"
            className={`min-h-[58px] rounded-2xl px-5 shadow-xl flex items-center gap-3 font-black uppercase tracking-[0.12em] text-[12px] transition-all ${
              locationState.abierta
                ? "bg-[#fee2e2] text-[#991b1b] border border-[#fecaca]"
                : "bg-[var(--primary)] text-white"
            }`}

            onClick={() => {
              if (locationState.abierta) {
                setPanelCaptura("CERRAR_UBICACION");
                focusSinScroll_(closeNotesRef, 120);
              } else {
                setPanelCaptura("ABRIR_UBICACION");
                focusSinScroll_(locationRef, 120);
              }
            }}

            disabled={!auditId || busyLocation || busyCloseLocation}
          >
            <span className="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-white/20">
              <LocalIcon name={locationState.abierta ? "lock" : "plus"} size={20} />
            </span>

            {locationState.abierta ? "Cerrar ubicación" : "Auditar ubicación"}
          </button>
        </div>
      </div>
    );
  };

  const target = document.getElementById("render-auditoria-excedentes-captura");

  if (!target) {
    notify_("No se encontró el contenedor de captura.", "error", 4200, { title: "Error", sound: true });
    return;
  }

  if (window.__AUDITORIA_EXCEDENTES_CAPTURA_ROOT__) {
    try {
      window.__AUDITORIA_EXCEDENTES_CAPTURA_ROOT__.unmount();
    } catch (e) {
      console.warn("No se pudo desmontar root previo:", e);
    }
  }

  window.__AUDITORIA_EXCEDENTES_CAPTURA_ROOT__ = ReactDOM.createRoot(target);
  window.__AUDITORIA_EXCEDENTES_CAPTURA_ROOT__.render(<View />);
};

window.initVista = window.cargar_AuditoriaExcedentesCaptura;
</script>
