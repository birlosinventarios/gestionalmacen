<script type="text/babel">
  window.cargar_AuditoriaExcedentes = () => {
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // =========================================================
    // HELPERS DE NOTIFICACIÓN
    // =========================================================
    const notify_ = (mensaje, tipo = "info", timer = 2500, options = {}) => {
      const fn = window.notificar || window.lanzarNotificacion;
      if (typeof fn === "function") {
        fn(mensaje, tipo, timer, options);
      }
    };

    const createNotifyOnce_ = (ref) => (key, mensaje, tipo = "info", timer = 2500, options = {}, cooldown = 8000) => {
      const now = Date.now();
      const last = ref.current[key] || 0;
      if (now - last < cooldown) return;
      ref.current[key] = now;
      notify_(mensaje, tipo, timer, options);
    };

    const shellNotifyStateRef = { current: {} };
    const notifyOnceShell_ = createNotifyOnce_(shellNotifyStateRef);

    // =========================================================
    // UTILIDADES DE FECHA / HORA
    // =========================================================
    function _esDateValida_(d) {
      return d instanceof Date && !isNaN(d.getTime());
    }

    function _parseFechaFlexible_(value) {
      if (!value) return null;

      if (value instanceof Date) {
        return _esDateValida_(value) ? value : null;
      }

      const str = String(value).trim();
      if (!str) return null;

      if (/^\d{2}\/\d{2}\/\d{4}$/.test(str)) {
        const parts = str.split("/");
        const day = Number(parts[0]);
        const month = Number(parts[1]);
        const year = Number(parts[2]);
        const d = new Date(year, month - 1, day, 0, 0, 0, 0);
        return _esDateValida_(d) ? d : null;
      }

      const parsed = new Date(str);
      return _esDateValida_(parsed) ? parsed : null;
    }

    function _parseHoraFlexible_(value) {
      if (!value) return null;

      if (value instanceof Date) {
        return _esDateValida_(value) ? value : null;
      }

      const str = String(value).trim();
      if (!str) return null;

      if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(str)) {
        const parts = str.split(":");
        const hh = Number(parts[0] || 0);
        const mm = Number(parts[1] || 0);
        const ss = Number(parts[2] || 0);
        const d = new Date(2000, 0, 1, hh, mm, ss, 0);
        return _esDateValida_(d) ? d : null;
      }

      const parsed = new Date(str);
      return _esDateValida_(parsed) ? parsed : null;
    }

    function formatearFecha_(value) {
      const d = _parseFechaFlexible_(value);
      if (!d) return "Sin fecha";

      return d.toLocaleDateString("es-MX", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    function formatearHora_(value) {
      const d = _parseHoraFlexible_(value);
      if (!d) return "--";

      return d.toLocaleTimeString("es-MX", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
    }

    function construirResumenFechaHora_(item) {
      return `${formatearFecha_(item.fecha)} • ${formatearHora_(item.horainicio)} - ${formatearHora_(item.horafin)}`;
    }

    // =========================================================
    // ICONO LOCAL
    // =========================================================
    const LocalIcon = ({ name, size = 18, className = "" }) => {
      const iconRef = useRef(null);

      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = "";
          const i = document.createElement("i");
          i.setAttribute("data-lucide", name.toLowerCase());
          i.style.width = `${size}px`;
          i.style.height = `${size}px`;
          if (className) i.className = className;
          iconRef.current.appendChild(i);
          window.lucide.createIcons();
        }
      }, [name, size, className]);

      return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
    };

    // =========================================================
    // HELPERS VISUALES
    // =========================================================
    const getConfiabilidadVisual = (valor) => {
      const n = Number(valor || 0);

      if (n < 90) {
        return {
          level: "RED",
          label: "Crítica",
          className: "ae-chip ae-chip-red",
          tone: "red"
        };
      }

      if (n >= 97) {
        return {
          level: "EMERALD",
          label: "Controlada",
          className: "ae-chip ae-chip-emerald",
          tone: "emerald"
        };
      }

      return {
        level: "AMBER",
        label: "Atención",
        className: "ae-chip ae-chip-amber",
        tone: "amber"
      };
    };

    const getStatusChipClass = (estatus) => {
      const e = String(estatus || "").toUpperCase();
      return e === "ABIERTA" ? "ae-chip ae-status-open" : "ae-chip ae-status-closed";
    };

    const getTipoChipClass = (tipo) => {
      const t = String(tipo || "").toUpperCase();
      return t === "POR_BODEGA" ? "ae-chip ae-chip-amber" : "ae-chip ae-chip-slate";
    };

    const getKpiTopBarClass = (tone) => {
      if (tone === "red") return "ae-topbar-red";
      if (tone === "amber") return "ae-topbar-amber";
      if (tone === "emerald") return "ae-topbar-emerald";
      return "ae-topbar-slate";
    };

    const getKpiIconClass = (tone) => {
      if (tone === "red") return "bg-red-50 text-red-600 border border-red-100";
      if (tone === "amber") return "bg-amber-50 text-amber-600 border border-amber-100";
      if (tone === "emerald") return "bg-emerald-50 text-emerald-600 border border-emerald-100";
      return "bg-slate-100 text-slate-900 border border-slate-200";
    };

    function obtenerNombreUsuario_(u) {
      if (!u) return "";
      if (typeof u === "string") return u.toUpperCase();
      return String(u.nombre || u.name || u.usuario || "").toUpperCase();
    }

    // =========================================================
    // KPI
    // =========================================================
    const KPIBlock = ({ title, value, unit, iconName, tone = "slate", trend }) => (
      <div className="ae-kpi-card">
        <div className={`ae-kpi-topbar ${getKpiTopBarClass(tone)}`}></div>

        <div className="h-full flex flex-col pt-2">
          <div className="mb-1">
            <p className="text-[17px] font-extrabold uppercase tracking-[0.14em] text-[var(--text-secondary)] leading-tight">
              {title}
            </p>
          </div>

          <div className="grid grid-cols-[1fr_auto] items-end h-full gap-4">
            <div className="flex flex-col justify-between h-full min-w-0">
              <div className="flex items-end gap-2 flex-wrap">
                <h3 className="text-5xl font-black tracking-tight text-[var(--text-main)] leading-none m-0 p-0 bg-transparent border-none">
                  {typeof value === "number" ? value.toLocaleString() : value}
                </h3>

                {unit && (
                  <span className="text-[16px] font-bold text-[var(--text-secondary)] uppercase leading-none pb-1">
                    {unit}
                  </span>
                )}
              </div>

              {trend && (
                <div className="mt-4 flex items-center gap-2 flex-wrap">
                  <span className={trend.className || "ae-chip ae-chip-slate"}>
                    {trend.text}
                  </span>

                  {trend.sub && (
                    <span className="text-xs font-semibold text-[var(--text-secondary)]">
                      {trend.sub}
                    </span>
                  )}
                </div>
              )}
            </div>

            <div className="self-end justify-self-end">
              <div className={`w-14 h-14 rounded-2xl flex items-center justify-center ${getKpiIconClass(tone)}`}>
                <LocalIcon name={iconName} size={34} />
              </div>
            </div>
          </div>
        </div>
      </div>
    );

    // =========================================================
    // DASHBOARD
    // =========================================================
    const AuditoriaExcedentesDashboard = () => {
      const [bootstrapData, setBootstrapData] = useState({
        usuarios: [],
        bodegas: [],
        auditoriasAbiertas: [],
        auditoriasCerradas: []
      });

      const [dashboard, setDashboard] = useState({
        fechaCorte: {},
        resumenGlobal: {},
        destacados: {},
        porBodega: []
      });

      const [auditorias, setAuditorias] = useState([]);
      const [loading, setLoading] = useState(true);

      const [searchQuery, setSearchQuery] = useState("");
      const [filterStatus, setFilterStatus] = useState("TODAS");
      const [filterTipo, setFilterTipo] = useState("TODOS");
      const [filterBodega, setFilterBodega] = useState("TODAS");
      const [sortBy, setSortBy] = useState("FECHA_DESC");
      const [activeRow, setActiveRow] = useState(null);

      const [isSearchExpanded, setIsSearchExpanded] = useState(false);
      const [isFabMenuOpen, setIsFabMenuOpen] = useState(false);

      const [formNuevaAuditoria, setFormNuevaAuditoria] = useState({
        auditor: "",
        tipoauditoria: "GLOBAL",
        bodegaobjetivo: "TODAS",
        observaciones: ""
      });

      const firstLoadDoneRef = useRef(false);
      const searchInputRef = useRef(null);

      // ---------------------------------------------------------
      // CARGA
      // ---------------------------------------------------------
      const refrescarDatos = useCallback((contexto = "init") => {
        setLoading(true);

        if (typeof google === "undefined" || !google.script || !google.script.run) {
          notify_("google.script.run no está disponible en este contexto.", "error", 4200, {
            title: "Entorno inválido",
            sound: true
          });
          setLoading(false);
          return;
        }

        if (contexto === "init") {
          notify_("Cargando auditorías de excedentes...", "info", 1600, {
            title: "Inicializando módulo",
            sound: false
          });
        } else {
          notify_("Actualizando auditorías de excedentes...", "info", 1400, {
            title: "Sincronizando",
            sound: false
          });
        }

        google.script.run
          .withSuccessHandler((bootstrapResp) => {
            const bootstrapSafe = bootstrapResp || {};
            setBootstrapData({
              usuarios: Array.isArray(bootstrapSafe.usuarios) ? bootstrapSafe.usuarios : [],
              bodegas: Array.isArray(bootstrapSafe.bodegas) ? bootstrapSafe.bodegas : [],
              auditoriasAbiertas: Array.isArray(bootstrapSafe.auditoriasAbiertas) ? bootstrapSafe.auditoriasAbiertas : [],
              auditoriasCerradas: Array.isArray(bootstrapSafe.auditoriasCerradas) ? bootstrapSafe.auditoriasCerradas : []
            });

            google.script.run
              .withSuccessHandler((dashboardResp) => {
                const dash = dashboardResp || {};
                setDashboard({
                  fechaCorte: dash.fechaCorte || {},
                  resumenGlobal: dash.resumenGlobal || {},
                  destacados: dash.destacados || {},
                  porBodega: Array.isArray(dash.porBodega) ? dash.porBodega : []
                });

                google.script.run
                  .withSuccessHandler((auditoriasResp) => {
                    const lista = Array.isArray(auditoriasResp) ? auditoriasResp : [];
                    setAuditorias(lista);
                    setLoading(false);

                    if (!firstLoadDoneRef.current) {
                      firstLoadDoneRef.current = true;
                      notify_(
                        `Se cargaron ${lista.length} auditorías.`,
                        "success",
                        2200,
                        {
                          title: "Dashboard listo",
                          sound: false
                        }
                      );
                    } else if (contexto !== "init") {
                      notify_(
                        `Datos actualizados correctamente (${lista.length} auditorías).`,
                        "success",
                        1800,
                        {
                          title: "Actualización completada",
                          sound: false
                        }
                      );
                    }
                  })
                  .withFailureHandler((err) => {
                    console.error("❌ [AuditoriaExcedentes] Error listando auditorías:", err);
                    setLoading(false);
                    notify_(
                      err && err.message ? err.message : "No se pudo listar auditorías.",
                      "error",
                      4200,
                      {
                        title: "Error de auditorías",
                        sound: true
                      }
                    );
                  })
                  .AuditoriaExcedentesController_listarAuditorias({});
              })
              .withFailureHandler((err) => {
                console.error("❌ [AuditoriaExcedentes] Error en obtenerDashboardMetricos:", err);
                setLoading(false);
                notify_(
                  err && err.message ? err.message : "No se pudo obtener el dashboard de auditoría.",
                  "error",
                  4200,
                  {
                    title: "Error de métricos",
                    sound: true
                  }
                );
              })
              .AuditoriaExcedentesController_obtenerDashboardMetricos();
          })
          .withFailureHandler((err) => {
            console.error("❌ [AuditoriaExcedentes] Error en obtenerBootstrap:", err);
            setLoading(false);
            notify_(
              err && err.message ? err.message : "No se pudo cargar el módulo de auditoría.",
              "error",
              4200,
              {
                title: "Error de carga",
                sound: true
              }
            );
          })
          .AuditoriaExcedentesController_obtenerBootstrap();
      }, []);

      useEffect(() => {
        refrescarDatos("init");
      }, [refrescarDatos]);

      // ---------------------------------------------------------
      // NUEVA AUDITORÍA
      // ---------------------------------------------------------
      const abrirPanelNuevaAuditoria = () => {
        const panel = document.getElementById("panelNuevaAuditoriaExcedentes");
        if (!panel) {
          notify_("No se encontró el panel de nueva auditoría.", "error", 3200, {
            title: "Panel no disponible",
            sound: true
          });
          return;
        }

        if (typeof bootstrap === "undefined" || !bootstrap.Offcanvas) {
          notify_("Bootstrap Offcanvas no está disponible.", "error", 3200, {
            title: "Bootstrap no disponible",
            sound: true
          });
          return;
        }

        const instancia = bootstrap.Offcanvas.getOrCreateInstance(panel);
        instancia.show();
      };

      const submitNuevaAuditoria = () => {
        const payload = {
          auditor: String(formNuevaAuditoria.auditor || "").toUpperCase().trim(),
          tipoauditoria: String(formNuevaAuditoria.tipoauditoria || "GLOBAL").toUpperCase().trim(),
          bodegaobjetivo:
            String(formNuevaAuditoria.tipoauditoria || "GLOBAL").toUpperCase().trim() === "POR_BODEGA"
              ? String(formNuevaAuditoria.bodegaobjetivo || "").toUpperCase().trim()
              : "TODAS",
          observaciones: String(formNuevaAuditoria.observaciones || "").trim()
        };

        if (!payload.auditor) {
          notify_("Debes seleccionar un auditor válido.", "warning", 2800, {
            title: "Auditor requerido",
            sound: true
          });
          return;
        }

        if (payload.tipoauditoria === "POR_BODEGA" && !payload.bodegaobjetivo) {
          notify_("Debes seleccionar una bodega objetivo.", "warning", 2800, {
            title: "Bodega requerida",
            sound: true
          });
          return;
        }

        notify_("Abriendo auditoría...", "info", 1400, {
          title: "Procesando",
          sound: false
        });

        google.script.run
          .withSuccessHandler((resp) => {
            const id = resp?.auditoria?.idauditoria || "NUEVA AUDITORÍA";

            notify_(
              `Auditoría creada correctamente: ${id}`,
              "success",
              2400,
              {
                title: "Auditoría abierta",
                sound: true
              }
            );

            const panel = document.getElementById("panelNuevaAuditoriaExcedentes");
            if (panel && typeof bootstrap !== "undefined" && bootstrap.Offcanvas) {
              const instancia = bootstrap.Offcanvas.getOrCreateInstance(panel);
              instancia.hide();
            }

            setFormNuevaAuditoria({
              auditor: "",
              tipoauditoria: "GLOBAL",
              bodegaobjetivo: "TODAS",
              observaciones: ""
            });

            refrescarDatos("manual");
          })
          .withFailureHandler((err) => {
            console.error("❌ [AuditoriaExcedentes] Error abriendo auditoría:", err);
            notify_(
              err && err.message ? err.message : "No se pudo abrir la auditoría.",
              "error",
              4200,
              {
                title: "Error al abrir auditoría",
                sound: true
              }
            );
          })
          .AuditoriaExcedentesController_abrirAuditoria(payload);
      };

      // ---------------------------------------------------------
      // NAVEGACIÓN
      // ---------------------------------------------------------
      const abrirDetalleAuditoria = (item) => {
        const folio = item && item.idauditoria ? String(item.idauditoria).trim() : "";

        if (!folio) {
          notify_(
            "No se pudo identificar el folio de la auditoría seleccionada.",
            "warning",
            2600,
            {
              title: "Folio inválido",
              sound: true
            }
          );
          return;
        }

        window.__AUDITORIA_EXCEDENTES_DETALLE_ID__ = folio;

        if (typeof window.irAVistaShell === "function") {
          window.irAVistaShell(
            "AuditoriaExcedentesDetalle",
            "AuditoriaExcedentesDetalle",
            {
              __AUDITORIA_EXCEDENTES_DETALLE_ID__: folio
            }
          );
          return;
        }

        notify_(
          `No se pudo abrir el detalle de la auditoría ${folio}.`,
          "error",
          3200,
          {
            title: "Navegación no disponible",
            sound: true
          }
        );
      };

      const continuarAuditoria = (item) => {
        const folio = item && item.idauditoria ? String(item.idauditoria).trim() : "";
        const estatus = String(item && item.estatus ? item.estatus : "").toUpperCase();

        if (!folio) {
          notify_(
            "No se pudo identificar el folio de la auditoría.",
            "warning",
            2600,
            {
              title: "Folio inválido",
              sound: true
            }
          );
          return;
        }

        if (estatus !== "ABIERTA") {
          notify_(
            `La auditoría ${folio} ya no está abierta.`,
            "warning",
            2600,
            {
              title: "Auditoría no disponible",
              sound: true
            }
          );
          return;
        }

        window.__AUDITORIA_EXCEDENTES_CAPTURA_ID__ = folio;
        window.__AUDITORIA_EXCEDENTES_DETALLE_ID__ = folio;

        if (typeof window.irAVistaShell === "function") {
          window.irAVistaShell(
            "AuditoriaExcedentesCaptura",
            "AuditoriaExcedentesCaptura",
            {
              __AUDITORIA_EXCEDENTES_CAPTURA_ID__: folio,
              __AUDITORIA_EXCEDENTES_DETALLE_ID__: folio
            }
          );
          return;
        }

        notify_(
          `No se pudo abrir la captura para la auditoría ${folio}.`,
          "error",
          3200,
          {
            title: "Navegación no disponible",
            sound: true
          }
        );
      };

      // ---------------------------------------------------------
      // DERIVADOS
      // ---------------------------------------------------------
      const resumenGlobal = dashboard.resumenGlobal || {};
      const destacados = dashboard.destacados || {};
      const porBodega = Array.isArray(dashboard.porBodega) ? dashboard.porBodega : [];

      const auditoriasFiltradas = useMemo(() => {
        let salida = [...auditorias];

        if (filterStatus !== "TODAS") {
          salida = salida.filter(item => String(item.estatus || "").toUpperCase() === filterStatus);
        }

        if (filterTipo !== "TODOS") {
          salida = salida.filter(item => String(item.tipoauditoria || "").toUpperCase() === filterTipo);
        }

        if (filterBodega !== "TODAS") {
          salida = salida.filter(item => String(item.bodegaobjetivo || "").toUpperCase() === filterBodega);
        }

        const q = String(searchQuery || "").trim().toLowerCase();
        if (q) {
          salida = salida.filter(item =>
            String(item.idauditoria || "").toLowerCase().includes(q) ||
            String(item.auditor || "").toLowerCase().includes(q) ||
            String(item.tipoauditoria || "").toLowerCase().includes(q) ||
            String(item.bodegaobjetivo || "").toLowerCase().includes(q)
          );
        }

        if (sortBy === "FECHA_ASC") {
          salida.sort((a, b) => String(a.fecha || "").localeCompare(String(b.fecha || ""), "es", { sensitivity: "base", numeric: true }));
        }

        if (sortBy === "FECHA_DESC") {
          salida.sort((a, b) => String(b.fecha || "").localeCompare(String(a.fecha || ""), "es", { sensitivity: "base", numeric: true }));
        }

        if (sortBy === "CONFIABILIDAD_DESC") {
          salida.sort((a, b) => Number(b.confiabilidadtotal || 0) - Number(a.confiabilidadtotal || 0));
        }

        if (sortBy === "CONFIABILIDAD_ASC") {
          salida.sort((a, b) => Number(a.confiabilidadtotal || 0) - Number(b.confiabilidadtotal || 0));
        }

        return salida;
      }, [auditorias, filterStatus, filterTipo, filterBodega, searchQuery, sortBy]);

      const confSemanalGlobal = getConfiabilidadVisual(resumenGlobal.confiabilidadSemanalActualEjercicio);
      const confMensualGlobal = getConfiabilidadVisual(resumenGlobal.confiabilidadMensualActualEjercicio);

      const criticaSemana = destacados.bodegaMasCriticaSemana || null;
      const mejorSemana = destacados.bodegaMejorSemana || null;

      return (
        <div className="space-y-6 fade-in-up relative">
          {/* KPI */}
          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            <KPIBlock
              title="Auditorías abiertas"
              value={Number(resumenGlobal.auditoriasAbiertas || 0)}
              unit="eventos"
              iconName="folder-open"
              tone="red"
              trend={{
                text: "Operación viva",
                className: "ae-chip ae-chip-red"
              }}
            />

            <KPIBlock
              title="Ubicaciones abiertas"
              value={Number(resumenGlobal.ubicacionesAbiertas || 0)}
              unit="ubic."
              iconName="map"
              tone="amber"
              trend={{
                text: "Pendientes por cerrar",
                className: "ae-chip ae-chip-amber"
              }}
            />

            <KPIBlock
              title="Confiabilidad semanal"
              value={Number(resumenGlobal.confiabilidadSemanalActualEjercicio || 0).toFixed(2)}
              unit="%"
              iconName="shield-check"
              tone={confSemanalGlobal.tone}
              trend={{
                text: confSemanalGlobal.label,
                className: confSemanalGlobal.className
              }}
            />

            <KPIBlock
              title="Faltantes semana actual"
              value={Number(resumenGlobal.faltantesSemanaActual || 0)}
              unit="ids"
              iconName="triangle-alert"
              tone="red"
              trend={{
                text: "Diferencia física",
                className: "ae-chip ae-chip-red"
              }}
            />

            <KPIBlock
              title="Sobrantes semana actual"
              value={Number(resumenGlobal.sobrantesSemanaActual || 0)}
              unit="ids"
              iconName="plus-circle"
              tone="amber"
              trend={{
                text: "Fuera de ubicación",
                className: "ae-chip ae-chip-amber"
              }}
            />

            <KPIBlock
              title="Confiabilidad mensual"
              value={Number(resumenGlobal.confiabilidadMensualActualEjercicio || 0).toFixed(2)}
              unit="%"
              iconName="gauge"
              tone={confMensualGlobal.tone}
              trend={{
                text: confMensualGlobal.label,
                className: confMensualGlobal.className
              }}
            />
          </div>

          {/* Destacados */}
          <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
            <div className="ae-card p-5">
              <div className="flex items-center justify-between gap-4 mb-4">
                <div>
                  <p className="text-[11px] font-black uppercase tracking-[0.16em] text-[var(--text-secondary)] mb-1">
                    Bodega más crítica / semana
                  </p>
                  <h3 className="m-0 p-0 bg-transparent border-none text-[var(--text-main)] text-[22px] font-black tracking-tight">
                    {criticaSemana?.bodega || "Sin datos"}
                  </h3>
                </div>

                <div className={getConfiabilidadVisual(criticaSemana?.semanalActual?.confiabilidad).className}>
                  {Number(criticaSemana?.semanalActual?.confiabilidad || 0).toFixed(2)}%
                </div>
              </div>

              <div className="grid grid-cols-3 gap-3">
                <div className="ae-mini-card">
                  <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">
                    Faltantes
                  </div>
                  <div className="text-[24px] font-black text-[var(--text-main)] mt-1">
                    {Number(criticaSemana?.semanalActual?.faltantes || 0)}
                  </div>
                </div>

                <div className="ae-mini-card">
                  <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">
                    Sobrantes
                  </div>
                  <div className="text-[24px] font-black text-[var(--text-main)] mt-1">
                    {Number(criticaSemana?.semanalActual?.sobrantes || 0)}
                  </div>
                </div>

                <div className="ae-mini-card">
                  <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">
                    Dif. ubi
                  </div>
                  <div className="text-[24px] font-black text-[var(--text-main)] mt-1">
                    {Number(criticaSemana?.semanalActual?.ubicacionesConDiferencia || 0)}
                  </div>
                </div>
              </div>
            </div>

            <div className="ae-card p-5">
              <div className="flex items-center justify-between gap-4 mb-4">
                <div>
                  <p className="text-[11px] font-black uppercase tracking-[0.16em] text-[var(--text-secondary)] mb-1">
                    Mejor bodega / semana
                  </p>
                  <h3 className="m-0 p-0 bg-transparent border-none text-[var(--text-main)] text-[22px] font-black tracking-tight">
                    {mejorSemana?.bodega || "Sin datos"}
                  </h3>
                </div>

                <div className={getConfiabilidadVisual(mejorSemana?.semanalActual?.confiabilidad).className}>
                  {Number(mejorSemana?.semanalActual?.confiabilidad || 0).toFixed(2)}%
                </div>
              </div>

              <div className="grid grid-cols-3 gap-3">
                <div className="ae-mini-card">
                  <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">
                    Correctos
                  </div>
                  <div className="text-[24px] font-black text-[var(--text-main)] mt-1">
                    {Number(mejorSemana?.semanalActual?.correctos || 0)}
                  </div>
                </div>

                <div className="ae-mini-card">
                  <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">
                    Esperados
                  </div>
                  <div className="text-[24px] font-black text-[var(--text-main)] mt-1">
                    {Number(mejorSemana?.semanalActual?.esperados || 0)}
                  </div>
                </div>

                <div className="ae-mini-card">
                  <div className="text-[10px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)]">
                    Dif. ubi
                  </div>
                  <div className="text-[24px] font-black text-[var(--text-main)] mt-1">
                    {Number(mejorSemana?.semanalActual?.ubicacionesConDiferencia || 0)}
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* Filtros */}
          <div className="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-3">
            <div className="flex flex-wrap items-center gap-2">
              {[
                { id: "TODAS", label: "Todas" },
                { id: "ABIERTA", label: "Abiertas" },
                { id: "CERRADA", label: "Cerradas" }
              ].map(btn => (
                <button
                  key={btn.id}
                  onClick={() => setFilterStatus(btn.id)}
                  className={`ae-filter-btn ${filterStatus === btn.id ? "active-primary" : "idle"}`}
                >
                  {btn.label}
                </button>
              ))}

              {[
                { id: "TODOS", label: "Todos los tipos" },
                { id: "GLOBAL", label: "Global" },
                { id: "POR_BODEGA", label: "Por bodega" }
              ].map(btn => (
                <button
                  key={btn.id}
                  onClick={() => setFilterTipo(btn.id)}
                  className={`ae-filter-btn ${filterTipo === btn.id ? "active-dark" : "idle"}`}
                >
                  {btn.label}
                </button>
              ))}
            </div>

            <div className="flex flex-wrap items-center gap-2 xl:justify-end">
              <select
                className="ae-form-select !min-h-[44px] !text-[12px] !font-black !uppercase !tracking-[0.12em] !bg-white"
                value={filterBodega}
                onChange={(e) => setFilterBodega(e.target.value)}
                style={{ width: "220px" }}
              >
                <option value="TODAS">Todas las bodegas</option>
                {(bootstrapData.bodegas || []).map((bodega, index) => (
                  <option key={`${bodega}-${index}`} value={String(bodega || "").toUpperCase()}>
                    {bodega}
                  </option>
                ))}
              </select>

              <select
                className="ae-form-select !min-h-[44px] !text-[12px] !font-black !uppercase !tracking-[0.12em] !bg-white"
                value={sortBy}
                onChange={(e) => setSortBy(e.target.value)}
                style={{ width: "220px" }}
              >
                <option value="FECHA_DESC">Fecha descendente</option>
                <option value="FECHA_ASC">Fecha ascendente</option>
                <option value="CONFIABILIDAD_DESC">Confiabilidad mayor</option>
                <option value="CONFIABILIDAD_ASC">Confiabilidad menor</option>
              </select>
            </div>
          </div>

          {/* Tabla principal */}
          <div className="ae-card overflow-hidden">
            <div className="ae-table-wrap custom-scroll">
              <table className="ae-table">
                <thead>
                  <tr>
                    <th>Evento / Identificador</th>
                    <th>Tipo</th>
                    <th>Auditor</th>
                    <th>Bodega objetivo</th>
                    <th>Estado</th>
                    <th>Confiabilidad</th>
                    <th>Ubicaciones</th>
                    <th>Diferencias</th>
                    <th>Acción</th>
                  </tr>
                </thead>

                <tbody>
                  {auditoriasFiltradas.map((item, idx) => {
                    const conf = getConfiabilidadVisual(item.confiabilidadtotal);

                    return (
                      <tr
                        key={item.idauditoria || idx}
                        className={`ae-row ${activeRow === idx ? "active" : ""}`}
                        onClick={() => setActiveRow(activeRow === idx ? null : idx)}
                      >
                        <td>
                          <div className="flex flex-col">
                            <span className="ae-folio-main">{item.idauditoria}</span>

                            <span className="ae-folio-sub">
                              {construirResumenFechaHora_(item)}
                            </span>

                            <span className="ae-folio-desc">
                              {item.observaciones || "Sin observaciones registradas"}
                            </span>
                          </div>
                        </td>

                        <td>
                          <span className={getTipoChipClass(item.tipoauditoria)}>
                            {item.tipoauditoria === "POR_BODEGA" ? "POR BODEGA" : "GLOBAL"}
                          </span>
                        </td>

                        <td>
                          <span className="text-[13px] font-black uppercase tracking-[0.10em] text-[var(--text-main)]">
                            {item.auditor || "SIN AUDITOR"}
                          </span>
                        </td>

                        <td>
                          <span className="text-[13px] font-black uppercase tracking-[0.10em] text-[var(--text-main)]">
                            {item.bodegaobjetivo || "TODAS"}
                          </span>
                        </td>

                        <td>
                          <span className={getStatusChipClass(item.estatus)}>
                            {item.estatus || "SIN ESTATUS"}
                          </span>
                        </td>

                        <td>
                          <span className={`${conf.className} ${conf.level === "RED" ? "pulse-critical" : ""}`}>
                            {Number(item.confiabilidadtotal || 0).toFixed(2)}% • {conf.label}
                          </span>
                        </td>

                        <td>
                          <div className="flex flex-col gap-1">
                            <span className="text-[18px] font-black text-[var(--text-main)]">
                              {Number(item.ubicacionesauditadas || 0)}
                            </span>
                            <span className="text-[11px] font-bold uppercase tracking-[0.12em] text-[var(--text-secondary)]">
                              auditadas
                            </span>
                          </div>
                        </td>

                        <td>
                          <div className="flex flex-col gap-1">
                            <span className="text-[18px] font-black text-[var(--primary)]">
                              {Number(item.ubicacionescondiferencia || 0)}
                            </span>
                            <span className="text-[11px] font-bold uppercase tracking-[0.12em] text-[var(--text-secondary)]">
                              con diferencia
                            </span>
                          </div>
                        </td>

                        <td>
                          <div className="flex flex-wrap items-center gap-2">
                            {String(item.estatus || "").toUpperCase() === "ABIERTA" && (
                              <button
                                type="button"
                                onClick={(e) => {
                                  e.stopPropagation();
                                  continuarAuditoria(item);
                                }}
                                className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-[var(--primary)] hover:bg-[var(--primary-dark)] text-white text-[12px] font-black uppercase tracking-[0.10em] transition-all duration-200"
                              >
                                <LocalIcon name="play" size={14} />
                                Continuar
                              </button>
                            )}

                            <button
                              type="button"
                              onClick={(e) => {
                                e.stopPropagation();
                                abrirDetalleAuditoria(item);
                              }}
                              className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-[#1c1d1f] hover:bg-black text-white text-[12px] font-black uppercase tracking-[0.10em] transition-all duration-200"
                            >
                              <LocalIcon name="arrow-up-right" size={14} />
                              Ver detalle
                            </button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>

              {auditoriasFiltradas.length === 0 && !loading && (
                <div className="ae-empty-state">
                  <div className="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                    <LocalIcon name="search-x" size={28} />
                  </div>

                  <span className="text-[13px] font-black uppercase tracking-widest text-[var(--text-secondary)]">
                    Sin auditorías coincidentes
                  </span>

                  <span className="text-[11px] text-slate-400 font-semibold">
                    Ajusta la búsqueda o los filtros operativos.
                  </span>
                </div>
              )}

              {loading && (
                <div className="p-28 flex flex-col items-center justify-center gap-4">
                  <div className="w-10 h-10 border-4 border-slate-100 border-t-[var(--primary)] rounded-full animate-spin"></div>
                  <span className="text-[10px] font-black tracking-widest text-slate-400 uppercase">
                    Cargando auditorías de excedentes...
                  </span>
                </div>
              )}
            </div>
          </div>

          {/* Resumen por bodega */}
          <div className="ae-card p-5">
            <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
              <div>
                <p className="text-[11px] font-black uppercase tracking-[0.16em] text-[var(--text-secondary)] mb-1">
                  Confiabilidad actual por bodega
                </p>
                <h3 className="m-0 p-0 bg-transparent border-none text-[var(--text-main)] text-[22px] font-black tracking-tight">
                  Semana y mes actual
                </h3>
              </div>

              <span className="ae-chip ae-chip-slate">
                {Array.isArray(porBodega) ? porBodega.length : 0} bodegas
              </span>
            </div>

            <div className="overflow-auto custom-scroll">
              <table className="ae-table">
                <thead>
                  <tr>
                    <th>Bodega</th>
                    <th>Semanal</th>
                    <th>Mensual</th>
                    <th>Faltantes sem.</th>
                    <th>Sobrantes sem.</th>
                    <th>Dif. ubic sem.</th>
                  </tr>
                </thead>

                <tbody>
                  {porBodega.map((item, idx) => {
                    const semanalVis = getConfiabilidadVisual(item?.semanalActual?.confiabilidad);
                    const mensualVis = getConfiabilidadVisual(item?.mensualActual?.confiabilidad);

                    return (
                      <tr key={`${item.bodega}-${idx}`} className="ae-row">
                        <td>
                          <span className="text-[14px] font-black uppercase tracking-[0.10em] text-[var(--text-main)]">
                            {item.bodega}
                          </span>
                        </td>

                        <td>
                          <span className={semanalVis.className}>
                            {Number(item?.semanalActual?.confiabilidad || 0).toFixed(2)}%
                          </span>
                        </td>

                        <td>
                          <span className={mensualVis.className}>
                            {Number(item?.mensualActual?.confiabilidad || 0).toFixed(2)}%
                          </span>
                        </td>

                        <td>
                          <span className="text-[16px] font-black text-[var(--primary)]">
                            {Number(item?.semanalActual?.faltantes || 0)}
                          </span>
                        </td>

                        <td>
                          <span className="text-[16px] font-black text-amber-700">
                            {Number(item?.semanalActual?.sobrantes || 0)}
                          </span>
                        </td>

                        <td>
                          <span className="text-[16px] font-black text-[var(--text-main)]">
                            {Number(item?.semanalActual?.ubicacionesConDiferencia || 0)}
                          </span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>

              {!loading && porBodega.length === 0 && (
                <div className="ae-empty-state !min-h-[200px]">
                  <div className="w-14 h-14 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                    <LocalIcon name="warehouse" size={24} />
                  </div>
                  <span className="text-[12px] font-black uppercase tracking-widest text-[var(--text-secondary)]">
                    Sin métricos por bodega
                  </span>
                </div>
              )}
            </div>
          </div>

          {/* FAB */}
          <div className="fixed bottom-10 right-10 z-[999] flex flex-col items-end gap-3">
            {isFabMenuOpen && isSearchExpanded && (
              <div className="flex items-center gap-3 animate-slide-left">
                <input
                  ref={searchInputRef}
                  autoFocus
                  type="text"
                  placeholder="Busca por ID, auditor, tipo o bodega..."
                  className="ae-search-input"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                />
              </div>
            )}

            {isFabMenuOpen && (
              <div className="flex flex-col items-end gap-3 animate-fab-in">
                <button
                  onClick={() => {
                    const nuevoEstado = !isSearchExpanded;
                    setIsSearchExpanded(nuevoEstado);

                    if (nuevoEstado) {
                      setTimeout(() => searchInputRef.current?.focus(), 120);
                    } else {
                      setSearchQuery("");
                    }
                  }}
                  className="ae-fab-action"
                  title={isSearchExpanded ? "Cerrar buscador" : "Buscar auditoría"}
                >
                  <LocalIcon name={isSearchExpanded ? "x" : "search"} size={24} />
                </button>

                <button
                  onClick={() => refrescarDatos("manual")}
                  disabled={loading}
                  className="ae-fab-action"
                  title="Actualizar tablero"
                >
                  <LocalIcon
                    name="refresh-cw"
                    size={24}
                    className={loading ? "animate-spin text-[var(--primary)]" : ""}
                  />
                </button>

                <button
                  onClick={abrirPanelNuevaAuditoria}
                  className="ae-fab-action primary"
                  title="Nueva auditoría"
                >
                  <LocalIcon name="folder-plus" size={24} />
                </button>
              </div>
            )}

            <button
              onClick={() => {
                const nuevoEstado = !isFabMenuOpen;
                setIsFabMenuOpen(nuevoEstado);

                if (!nuevoEstado) {
                  setIsSearchExpanded(false);
                  setSearchQuery("");
                }
              }}
              className={`ae-fab-main ${isFabMenuOpen ? "open" : ""}`}
              title={isFabMenuOpen ? "Cerrar acciones" : "Abrir acciones"}
            >
              <LocalIcon name={isFabMenuOpen ? "x" : "ellipsis-vertical"} size={26} />
            </button>
          </div>

          {/* OFFCANVAS NUEVA AUDITORÍA */}
          <div
            className="offcanvas offcanvas-end ae-offcanvas"
            tabIndex="-1"
            id="panelNuevaAuditoriaExcedentes"
            aria-labelledby="panelNuevaAuditoriaExcedentesLabel"
          >
            <div className="offcanvas-header">
              <div>
                <h5
                  id="panelNuevaAuditoriaExcedentesLabel"
                  className="mb-1 fw-bold"
                  style={{ color: "var(--text-main)" }}
                >
                  Nueva Auditoría de Excedentes
                </h5>
                <p className="mb-0 text-muted" style={{ fontSize: "13px" }}>
                  Configura y abre un nuevo evento de auditoría.
                </p>
              </div>

              <button
                type="button"
                className="btn-close text-reset"
                data-bs-dismiss="offcanvas"
                aria-label="Cerrar"
              ></button>
            </div>

            <div className="offcanvas-body d-flex flex-column gap-4">
              <div>
                <label className="ae-form-label">Auditor responsable</label>
                <input
                  list="lista-usuarios-auditoria-excedentes"
                  className="ae-form-input"
                  placeholder="Escribe o selecciona auditor"
                  value={formNuevaAuditoria.auditor}
                  onChange={(e) =>
                    setFormNuevaAuditoria(prev => ({
                      ...prev,
                      auditor: e.target.value.toUpperCase()
                    }))
                  }
                />
                <datalist id="lista-usuarios-auditoria-excedentes">
                  {(bootstrapData.usuarios || []).map((u, index) => (
                    <option key={index} value={obtenerNombreUsuario_(u)} />
                  ))}
                </datalist>
              </div>

              <div>
                <label className="ae-form-label">Tipo de auditoría</label>
                <select
                  className="ae-form-select"
                  value={formNuevaAuditoria.tipoauditoria}
                  onChange={(e) =>
                    setFormNuevaAuditoria(prev => ({
                      ...prev,
                      tipoauditoria: e.target.value,
                      bodegaobjetivo: e.target.value === "POR_BODEGA" ? "" : "TODAS"
                    }))
                  }
                >
                  <option value="GLOBAL">GLOBAL</option>
                  <option value="POR_BODEGA">POR_BODEGA</option>
                </select>
              </div>

              {String(formNuevaAuditoria.tipoauditoria || "").toUpperCase() === "POR_BODEGA" && (
                <div>
                  <label className="ae-form-label">Bodega objetivo</label>
                  <select
                    className="ae-form-select"
                    value={formNuevaAuditoria.bodegaobjetivo}
                    onChange={(e) =>
                      setFormNuevaAuditoria(prev => ({
                        ...prev,
                        bodegaobjetivo: e.target.value.toUpperCase()
                      }))
                    }
                  >
                    <option value="">Selecciona una bodega</option>
                    {(bootstrapData.bodegas || []).map((bodega, index) => (
                      <option key={`${bodega}-${index}`} value={String(bodega || "").toUpperCase()}>
                        {bodega}
                      </option>
                    ))}
                  </select>
                </div>
              )}

              <div>
                <label className="ae-form-label">Observaciones</label>
                <textarea
                  className="ae-form-textarea"
                  placeholder="Notas iniciales de la auditoría..."
                  value={formNuevaAuditoria.observaciones}
                  onChange={(e) =>
                    setFormNuevaAuditoria(prev => ({
                      ...prev,
                      observaciones: e.target.value
                    }))
                  }
                />
              </div>

              <div className="ae-mini-card">
                <div className="text-[11px] font-black uppercase tracking-[0.14em] text-[var(--text-secondary)] mb-2">
                  Alcance esperado
                </div>

                <div className="text-[13px] font-semibold text-[var(--text-main)] leading-relaxed">
                  {String(formNuevaAuditoria.tipoauditoria || "").toUpperCase() === "POR_BODEGA"
                    ? `La auditoría se abrirá solo para la bodega ${formNuevaAuditoria.bodegaobjetivo || "SIN DEFINIR"}.`
                    : "La auditoría se abrirá a nivel ejercicio, considerando todas las bodegas auditables."}
                </div>
              </div>

              <button
                type="button"
                className="ae-btn-primary mt-auto"
                onClick={submitNuevaAuditoria}
              >
                Abrir auditoría
              </button>
            </div>
          </div>
        </div>
      );
    };

    // =========================================================
    // MONTAJE
    // =========================================================
    const targetElement = document.getElementById("render-auditoria-excedentes");

    if (!targetElement) {
      notify_(
        "No se encontró el contenedor principal de la vista de auditorías.",
        "error",
        4200,
        {
          title: "Error de interfaz",
          sound: true
        }
      );
      console.warn("⚠️ [AuditoriaExcedentes] No se encontró #render-auditoria-excedentes");
      return;
    }

    const yaInicializado = targetElement.dataset.aeMounted === "1";

    if (window.__AUDITORIA_EXCEDENTES_ROOT__) {
      try {
        window.__AUDITORIA_EXCEDENTES_ROOT__.unmount();
      } catch (e) {
        console.warn("⚠️ [AuditoriaExcedentes] No se pudo desmontar root previo:", e);
        notifyOnceShell_(
          "auditoria-root-previo",
          "Se liberó una instancia previa de la vista de auditorías.",
          "warning",
          1600,
          {
            title: "Reinicialización",
            sound: false
          },
          10000
        );
      }
      window.__AUDITORIA_EXCEDENTES_ROOT__ = null;
    }

    try {
      targetElement.dataset.aeMounted = "1";
      window.__AUDITORIA_EXCEDENTES_ROOT__ = ReactDOM.createRoot(targetElement);
      window.__AUDITORIA_EXCEDENTES_ROOT__.render(<AuditoriaExcedentesDashboard />);

      if (!yaInicializado) {
        notifyOnceShell_(
          "auditoria-vista-montada",
          "Vista de auditorías lista para operar.",
          "success",
          1500,
          {
            title: "Vista cargada",
            sound: false
          },
          12000
        );
      }
    } catch (e) {
      console.error("❌ [AuditoriaExcedentes] Error montando root React:", e);
      notify_(
        "Ocurrió un error al montar la vista de auditorías.",
        "error",
        4200,
        {
          title: "Error de montaje",
          sound: true
        }
      );
    }
  };

  window.initVista = window.cargar_AuditoriaExcedentes;
  console.log("🧩 [AuditoriaExcedentes] Vista inyectable inicializada y registrada.");
</script>
