<script>
  /**
   * AuditoriaExcedentes.html
   *
   * Vista principal para consultar, filtrar, exportar y abrir eventos de
   * auditoría de excedentes.
   *
   * Responsabilidades:
   * - Obtener el catálogo inicial de usuarios y bodegas.
   * - Consultar periódicamente las auditorías registradas.
   * - Aplicar filtros por estado, tipo, bodega, búsqueda y fecha.
   * - Crear auditorías GLOBAL o POR_BODEGA.
   * - Navegar hacia captura o detalle mediante el shell APPALMACEN.
   * - Exportar el conjunto filtrado a un archivo XLSX.
   * - Administrar el montaje y desmontaje de su raíz React.
   *
   * Dependencias globales:
   * - React y ReactDOM.
   * - FitoComponents.Icon.LocalIcon o FitoComponents.LocalIcon.
   * - google.script.run.
   * - Bootstrap Offcanvas.
   * - ExcelExportUtils.exportarAXLSX().
   * - window.notificar o window.lanzarNotificacion.
   * - window.irAVistaShell().
   *
   * Controladores consumidos:
   * - AuditoriaExcedentesController_obtenerBootstrap().
   * - AuditoriaExcedentesController_listarAuditorias(filtros).
   * - AuditoriaExcedentesController_abrirAuditoria(payload).
   *
   * Contratos globales expuestos:
   * - window.cargar_AuditoriaExcedentes().
   * - window.initVista.
   * - window.__AUDITORIA_EXCEDENTES_ROOT__.
   *
   * Consideraciones de mantenimiento:
   * - La secuencia de solicitud evita aplicar respuestas obsoletas.
   * - El watchdog libera la interfaz si la carga excede 25 segundos.
   * - La actualización automática ocurre cada 30 segundos.
   * - Antes de montar la vista se desmonta cualquier raíz React previa.
   * - Este archivo no contiene scriptlets de plantilla de Apps Script.
   */
</script>

<script type="text/babel">
  window.cargar_AuditoriaExcedentes = () => {
    const { useState, useEffect, useMemo, useCallback, useRef } = React;
    const LocalIcon = window.FitoComponents?.Icon?.LocalIcon || window.FitoComponents?.LocalIcon;
    if (!LocalIcon) throw new Error("No se encontró FitoComponents.Icon.LocalIcon.");

    /**
     * Emite una notificación mediante la infraestructura global del shell.
     *
     * @param {string} message Mensaje visible para el usuario.
     * @param {string=} type Tipo de notificación.
     * @param {number=} timer Duración en milisegundos.
     * @param {Object=} options Opciones complementarias.
     * @return {void}
     */
    const notify_ = (message, type = "info", timer = 2500, options = {}) => {
      const fn = window.notificar || window.lanzarNotificacion;
      if (typeof fn === "function") fn(message, type, timer, options);
    };

    /**
     * Convierte fechas Date, dd/MM/yyyy o formatos reconocidos por el navegador.
     *
     * @param {*} value Valor recibido.
     * @return {Date|null} Fecha válida o null.
     */
    const parseDate_ = (value) => {
      if (!value) return null;
      if (value instanceof Date) return Number.isNaN(value.getTime()) ? null : value;
      const text = String(value).trim();
      const match = text.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (match) {
        const date = new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1]));
        return Number.isNaN(date.getTime()) ? null : date;
      }
      const date = new Date(text);
      return Number.isNaN(date.getTime()) ? null : date;
    };

    /**
     * Convierte horas Date, HH:mm o HH:mm:ss a una instancia Date auxiliar.
     *
     * @param {*} value Valor recibido.
     * @return {Date|null} Hora válida o null.
     */
    const parseTime_ = (value) => {
      if (!value) return null;
      if (value instanceof Date) return Number.isNaN(value.getTime()) ? null : value;
      const text = String(value).trim();
      if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(text)) {
        const [h, m, s = 0] = text.split(":").map(Number);
        return new Date(2000, 0, 1, h, m, s);
      }
      const date = new Date(text);
      return Number.isNaN(date.getTime()) ? null : date;
    };

    /**
     * Presenta una fecha con configuración regional de México.
     *
     * @param {*} value Fecha recibida.
     * @return {string}
     */
    const formatDate_ = (value) => {
      const date = parseDate_(value);
      return date
        ? date.toLocaleDateString("es-MX", { day: "2-digit", month: "2-digit", year: "numeric" })
        : "Sin fecha";
    };

    /**
     * Presenta una hora en formato de 24 horas.
     *
     * @param {*} value Hora recibida.
     * @return {string}
     */
    const formatTime_ = (value) => {
      const date = parseTime_(value);
      return date
        ? date.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", hour12: false })
        : "--";
    };

    const summary_ = (item) =>
      `${formatDate_(item.fecha)} • ${formatTime_(item.horainicio)} - ${formatTime_(item.horafin)}`;
    const statusClass_ = (status) =>
      String(status || "").toUpperCase() === "ABIERTA"
        ? "ae-chip ae-status-open"
        : "ae-chip ae-status-closed";
    const typeClass_ = (type) =>
      String(type || "").toUpperCase() === "POR_BODEGA"
        ? "ae-chip ae-chip-amber"
        : "ae-chip ae-chip-slate";
    /**
     * Obtiene el nombre visible de un usuario admitiendo contratos históricos.
     *
     * @param {Object|string} user Usuario recibido desde bootstrap.
     * @return {string} Nombre normalizado en mayúsculas.
     */
    const userName_ = (user) =>
      typeof user === "string"
        ? user.toUpperCase()
        : String(user?.nombre || user?.name || user?.usuario || "").toUpperCase();

    /**
     * Componente principal de la vista de auditorías.
     *
     * @return {React.ReactElement}
     */
    const Dashboard = () => {
      const [bootstrapData, setBootstrapData] = useState({ usuarios: [], bodegas: [] });
      const [auditorias, setAuditorias] = useState([]);
      const [loading, setLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState("");
      const [filterStatus, setFilterStatus] = useState("TODAS");
      const [filterTipo, setFilterTipo] = useState("TODOS");
      const [filterBodega, setFilterBodega] = useState("TODAS");
      const [sortBy, setSortBy] = useState("FECHA_DESC");
      const [activeRow, setActiveRow] = useState(null);
      const [isSearchExpanded, setIsSearchExpanded] = useState(false);
      const [isSearchClosing, setIsSearchClosing] = useState(false);
      const [form, setForm] = useState({
        auditor: "",
        tipoauditoria: "GLOBAL",
        bodegaobjetivo: "TODAS",
        observaciones: "",
      });
      const searchRef = useRef(null);
      const inFlightRef = useRef(false);
      const sequenceRef = useRef(0);

      /**
       * Actualiza bootstrap y auditorías mediante solicitudes secuenciales.
       *
       * @param {"init"|"manual"|"auto"} context Origen de la actualización.
       * @return {void}
       */
      const refresh = useCallback((context = "init") => {
        if (inFlightRef.current) return;
        if (typeof google === "undefined" || !google.script?.run) {
          setLoading(false);
          notify_("google.script.run no está disponible.", "error", 4200, {
            title: "Entorno inválido",
            sound: true,
          });
          return;
        }

        const sequence = Date.now();
        sequenceRef.current = sequence;
        inFlightRef.current = true;
        if (context !== "auto") setLoading(true);

        const finishError = (title, error) => {
          if (sequenceRef.current !== sequence) return;
          inFlightRef.current = false;
          setLoading(false);
          notify_(error?.message || "No se pudo cargar la información.", "error", 4200, {
            title,
            sound: true,
          });
        };

        const watchdog = setTimeout(() => {
          if (sequenceRef.current !== sequence || !inFlightRef.current) return;
          inFlightRef.current = false;
          setLoading(false);
          notify_("La carga tardó demasiado. Intenta actualizar nuevamente.", "warning", 5200, {
            title: "Carga detenida",
            sound: true,
          });
        }, 25000);

        google.script.run
          .withSuccessHandler((data) => {
            if (sequenceRef.current !== sequence) return;
            setBootstrapData({
              usuarios: Array.isArray(data?.usuarios) ? data.usuarios : [],
              bodegas: Array.isArray(data?.bodegas) ? data.bodegas : [],
            });

            google.script.run
              .withSuccessHandler((list) => {
                if (sequenceRef.current !== sequence) return;
                clearTimeout(watchdog);
                setAuditorias(Array.isArray(list) ? list : []);
                inFlightRef.current = false;
                setLoading(false);
                if (context === "manual")
                  notify_("Datos actualizados correctamente.", "success", 1800, {
                    title: "Actualización completada",
                    sound: false,
                  });
              })
              .withFailureHandler((error) => {
                clearTimeout(watchdog);
                finishError("Error de auditorías", error);
              })
              .AuditoriaExcedentesController_listarAuditorias({});
          })
          .withFailureHandler((error) => {
            clearTimeout(watchdog);
            finishError("Error de carga", error);
          })
          .AuditoriaExcedentesController_obtenerBootstrap();
      }, []);

      useEffect(() => {
        refresh("init");
      }, [refresh]);
      useEffect(() => {
        const timer = setInterval(() => refresh("auto"), 30000);
        return () => clearInterval(timer);
      }, [refresh]);

      /** Abre el buscador y posiciona el foco en su campo. */
      const openSearch = () => {
        setIsSearchClosing(false);
        setIsSearchExpanded(true);
        setTimeout(() => searchRef.current?.focus(), 80);
      };

      /** Cierra el buscador respetando la animación de salida. */
      const closeSearch = () => {
        setIsSearchClosing(true);
        setTimeout(() => {
          setIsSearchExpanded(false);
          setIsSearchClosing(false);
          setSearchQuery("");
        }, 180);
      };

      const toggleSearch = () => (isSearchExpanded ? closeSearch() : openSearch());

      /** Abre el panel lateral para crear una auditoría. */
      const openNew = () => {
        const panel = document.getElementById("panelNuevaAuditoriaExcedentes");
        if (!panel || typeof bootstrap === "undefined" || !bootstrap.Offcanvas) {
          notify_("No se pudo abrir el panel de nueva auditoría.", "error", 3200, {
            title: "Panel no disponible",
            sound: true,
          });
          return;
        }
        bootstrap.Offcanvas.getOrCreateInstance(panel).show();
      };

      /**
       * Valida el formulario y solicita la creación de una nueva auditoría.
       *
       * @return {void}
       */
      const submitNew = () => {
        const type = String(form.tipoauditoria || "GLOBAL").toUpperCase();
        const payload = {
          auditor: String(form.auditor || "")
            .toUpperCase()
            .trim(),
          tipoauditoria: type,
          bodegaobjetivo:
            type === "POR_BODEGA"
              ? String(form.bodegaobjetivo || "")
                  .toUpperCase()
                  .trim()
              : "TODAS",
          observaciones: String(form.observaciones || "").trim(),
        };
        if (!payload.auditor)
          return notify_("Debes seleccionar un auditor válido.", "warning", 2800, {
            title: "Auditor requerido",
            sound: true,
          });
        if (type === "POR_BODEGA" && !payload.bodegaobjetivo)
          return notify_("Debes seleccionar una bodega objetivo.", "warning", 2800, {
            title: "Bodega requerida",
            sound: true,
          });

        google.script.run
          .withSuccessHandler((response) => {
            notify_(
              `Auditoría creada correctamente: ${response?.auditoria?.idauditoria || "NUEVA AUDITORÍA"}`,
              "success",
              2400,
              { title: "Auditoría abierta", sound: true },
            );
            const panel = document.getElementById("panelNuevaAuditoriaExcedentes");
            if (panel && typeof bootstrap !== "undefined")
              bootstrap.Offcanvas.getOrCreateInstance(panel).hide();
            setForm({
              auditor: "",
              tipoauditoria: "GLOBAL",
              bodegaobjetivo: "TODAS",
              observaciones: "",
            });
            refresh("manual");
          })
          .withFailureHandler((error) =>
            notify_(error?.message || "No se pudo abrir la auditoría.", "error", 4200, {
              title: "Error al abrir auditoría",
              sound: true,
            }),
          )
          .AuditoriaExcedentesController_abrirAuditoria(payload);
      };

      /**
       * Navega al detalle o a la captura de una auditoría.
       *
       * @param {Object} item Auditoría seleccionada.
       * @param {boolean=} capture true para captura; false para detalle.
       * @return {void}
       */
      const navigate = (item, capture = false) => {
        const folio = String(item?.idauditoria || "").trim();
        if (!folio || typeof window.irAVistaShell !== "function")
          return notify_("No se pudo abrir la auditoría.", "error", 3200, {
            title: "Navegación no disponible",
            sound: true,
          });
        if (capture && String(item.estatus || "").toUpperCase() !== "ABIERTA")
          return notify_(`La auditoría ${folio} ya no está abierta.`, "warning", 2600, {
            title: "Auditoría no disponible",
            sound: true,
          });
        const globals = capture
          ? {
              __AUDITORIA_EXCEDENTES_CAPTURA_ID__: folio,
              __AUDITORIA_EXCEDENTES_DETALLE_ID__: folio,
            }
          : { __AUDITORIA_EXCEDENTES_DETALLE_ID__: folio };
        window.irAVistaShell(
          capture ? "AuditoriaExcedentesCaptura" : "AuditoriaExcedentesDetalle",
          capture ? "AuditoriaExcedentesCaptura" : "AuditoriaExcedentesDetalle",
          globals,
        );
      };

      /**
       * Colección derivada tras aplicar filtros, búsqueda y orden cronológico.
       */
      const filtered = useMemo(() => {
        let result = [...auditorias];
        if (filterStatus !== "TODAS")
          result = result.filter((x) => String(x.estatus || "").toUpperCase() === filterStatus);
        if (filterTipo !== "TODOS")
          result = result.filter((x) => String(x.tipoauditoria || "").toUpperCase() === filterTipo);
        if (filterBodega !== "TODAS")
          result = result.filter(
            (x) => String(x.bodegaobjetivo || "").toUpperCase() === filterBodega,
          );
        const query = searchQuery.trim().toLowerCase();
        if (query)
          result = result.filter((x) =>
            [
              x.idauditoria,
              x.auditor,
              x.tipoauditoria,
              x.bodegaobjetivo,
              x.estatus,
              x.observaciones,
            ].some((v) =>
              String(v || "")
                .toLowerCase()
                .includes(query),
            ),
          );
        result.sort((a, b) => {
          const left = parseDate_(a.fecha)?.getTime() || 0;
          const right = parseDate_(b.fecha)?.getTime() || 0;
          return sortBy === "FECHA_ASC" ? left - right : right - left;
        });
        return result;
      }, [auditorias, filterStatus, filterTipo, filterBodega, searchQuery, sortBy]);

      /**
       * Exporta a XLSX la colección actualmente visible.
       *
       * @return {void}
       */
      const exportExcel = () => {
        if (!window.ExcelExportUtils?.exportarAXLSX)
          return notify_("No se detectó el exportador XLSX.", "error", 4200, {
            title: "Exportador no disponible",
            sound: true,
          });
        if (!filtered.length)
          return notify_("No existen auditorías para exportar.", "warning", 3200, {
            title: "Sin datos para exportar",
            sound: true,
          });
        window.ExcelExportUtils.exportarAXLSX({
          fileName: `Auditorias_Excedentes_${new Date().toISOString().slice(0, 10)}.xlsx`,
          sheetName: "Auditorias",
          rows: filtered,
          columns: [
            { key: "idauditoria", label: "Auditoría" },
            { key: "fecha", label: "Fecha" },
            { key: "horainicio", label: "Hora inicio" },
            { key: "horafin", label: "Hora fin" },
            { key: "tipoauditoria", label: "Tipo de auditoría" },
            { key: "auditor", label: "Auditor" },
            { key: "bodegaobjetivo", label: "Bodega objetivo" },
            { key: "estatus", label: "Estatus" },
            { key: "observaciones", label: "Observaciones" },
          ],
        });
        notify_(`Se inició la exportación de ${filtered.length} auditorías.`, "success", 2200, {
          title: "Exportación iniciada",
          sound: true,
        });
      };

      return (
        <div className="space-y-4 fade-in-up relative">
          <section className="ae-card p-4">
            <div className="flex flex-col gap-4">
              <div className="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-3">
                <div className="flex flex-wrap items-center gap-2">
                  {[
                    { id: "TODAS", label: "Todas" },
                    { id: "ABIERTA", label: "Abiertas" },
                    { id: "CERRADA", label: "Cerradas" },
                  ].map((button) => (
                    <button
                      key={button.id}
                      type="button"
                      onClick={() => setFilterStatus(button.id)}
                      className={`ae-filter-btn ${filterStatus === button.id ? "active-primary" : "idle"}`}
                    >
                      {button.label}
                    </button>
                  ))}
                  <div className="hidden md:block w-px h-8 bg-slate-200 mx-1"></div>
                  {[
                    { id: "TODOS", label: "Todos los tipos" },
                    { id: "GLOBAL", label: "Global" },
                    { id: "POR_BODEGA", label: "Por bodega" },
                  ].map((button) => (
                    <button
                      key={button.id}
                      type="button"
                      onClick={() => setFilterTipo(button.id)}
                      className={`ae-filter-btn ${filterTipo === button.id ? "active-dark" : "idle"}`}
                    >
                      {button.label}
                    </button>
                  ))}
                </div>

                <div className="flex flex-wrap items-center gap-2 xl:justify-end">
                  <select
                    className="ae-form-select !min-h-[44px] !text-[12px] !font-black !uppercase !tracking-[0.08em] !bg-white"
                    value={filterBodega}
                    onChange={(event) => setFilterBodega(event.target.value)}
                    style={{ width: "210px" }}
                    aria-label="Filtrar por bodega"
                  >
                    <option value="TODAS">Todas las bodegas</option>
                    {(bootstrapData.bodegas || []).map((warehouse, index) => (
                      <option
                        key={`${warehouse}-${index}`}
                        value={String(warehouse || "").toUpperCase()}
                      >
                        {warehouse}
                      </option>
                    ))}
                  </select>
                  <select
                    className="ae-form-select !min-h-[44px] !text-[12px] !font-black !uppercase !tracking-[0.08em] !bg-white"
                    value={sortBy}
                    onChange={(event) => setSortBy(event.target.value)}
                    style={{ width: "190px" }}
                    aria-label="Ordenar auditorías"
                  >
                    <option value="FECHA_DESC">Más recientes</option>
                    <option value="FECHA_ASC">Más antiguas</option>
                  </select>
                  <div className="hidden xl:block w-px h-9 bg-slate-200 mx-1"></div>
                  <button
                    type="button"
                    onClick={toggleSearch}
                    className={`ae-toolbar-action ${isSearchExpanded ? "active-dark" : ""}`}
                    title={isSearchExpanded ? "Cerrar búsqueda" : "Buscar auditoría"}
                  >
                    <LocalIcon name={isSearchExpanded ? "x" : "search"} size={17} />
                    <span className="ae-toolbar-label">
                      {isSearchExpanded ? "Cerrar" : "Buscar"}
                    </span>
                  </button>
                  <button
                    type="button"
                    onClick={() => refresh("manual")}
                    disabled={loading}
                    className="ae-toolbar-action"
                    title="Actualizar información"
                  >
                    <LocalIcon
                      name="refresh-cw"
                      size={17}
                      className={loading ? "animate-spin" : ""}
                    />
                    <span className="ae-toolbar-label">Actualizar</span>
                  </button>
                  <button
                    type="button"
                    onClick={openNew}
                    className="ae-toolbar-action primary"
                    title="Nueva auditoría"
                  >
                    <LocalIcon name="folder-plus" size={17} />
                    <span className="ae-toolbar-label">Nueva</span>
                  </button>
                  <button
                    type="button"
                    onClick={exportExcel}
                    disabled={loading || !filtered.length}
                    className="ae-toolbar-action success"
                    title="Exportar auditorías a Excel"
                  >
                    <LocalIcon name="file-spreadsheet" size={17} />
                    <span className="ae-toolbar-label">Excel</span>
                  </button>
                </div>
              </div>

              {isSearchExpanded && (
                <div className={`ae-inline-search-wrap ${isSearchClosing ? "closing" : ""}`}>
                  <LocalIcon name="search" size={18} />
                  <input
                    ref={searchRef}
                    autoFocus
                    type="text"
                    placeholder="Busca por ID, auditor, tipo, bodega, estado u observaciones..."
                    className="ae-inline-search-input"
                    value={searchQuery}
                    onChange={(event) => setSearchQuery(event.target.value)}
                  />
                  {searchQuery && (
                    <button
                      type="button"
                      className="ae-inline-search-clear"
                      onClick={() => {
                        setSearchQuery("");
                        searchRef.current?.focus();
                      }}
                      title="Limpiar búsqueda"
                    >
                      <LocalIcon name="x" size={16} />
                    </button>
                  )}
                </div>
              )}
            </div>
          </section>

          <section className="ae-card overflow-hidden">
            <div className="ae-table-wrap custom-scroll">
              <table className="ae-table">
                <thead>
                  <tr>
                    <th>Evento / Identificador</th>
                    <th>Tipo</th>
                    <th>Auditor</th>
                    <th>Bodega objetivo</th>
                    <th>Estado</th>
                    <th>Acción</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((item, index) => (
                    <tr
                      key={item.idauditoria || index}
                      className={`ae-row ${activeRow === index ? "active" : ""}`}
                      onClick={() => setActiveRow(activeRow === index ? null : index)}
                    >
                      <td>
                        <div className="flex flex-col">
                          <span className="ae-folio-main">{item.idauditoria || "SIN FOLIO"}</span>
                          <span className="ae-folio-sub">{summary_(item)}</span>
                          <span className="ae-folio-desc">
                            {item.observaciones || "Sin observaciones registradas"}
                          </span>
                        </div>
                      </td>
                      <td>
                        <span className={typeClass_(item.tipoauditoria)}>
                          {item.tipoauditoria === "POR_BODEGA" ? "POR BODEGA" : "GLOBAL"}
                        </span>
                      </td>
                      <td>
                        <span className="text-[13px] font-black uppercase tracking-[.08em] text-[var(--text-main)]">
                          {item.auditor || "SIN AUDITOR"}
                        </span>
                      </td>
                      <td>
                        <span className="text-[13px] font-black uppercase tracking-[.08em] text-[var(--text-main)]">
                          {item.bodegaobjetivo || "TODAS"}
                        </span>
                      </td>
                      <td>
                        <span className={statusClass_(item.estatus)}>
                          {item.estatus || "SIN ESTATUS"}
                        </span>
                      </td>
                      <td>
                        <div className="flex flex-wrap items-center gap-2">
                          {String(item.estatus || "").toUpperCase() === "ABIERTA" && (
                            <button
                              type="button"
                              onClick={(event) => {
                                event.stopPropagation();
                                navigate(item, true);
                              }}
                              className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-[var(--primary)] hover:bg-[var(--primary-dark)] text-white text-[12px] font-black uppercase tracking-[.08em]"
                            >
                              <LocalIcon name="play" size={14} />
                              Continuar
                            </button>
                          )}
                          <button
                            type="button"
                            onClick={(event) => {
                              event.stopPropagation();
                              navigate(item, false);
                            }}
                            className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-[#1c1d1f] hover:bg-black text-white text-[12px] font-black uppercase tracking-[.08em]"
                          >
                            <LocalIcon name="arrow-up-right" size={14} />
                            Ver resumen
                          </button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>

              {!loading && !filtered.length && (
                <div className="ae-empty-state">
                  <div className="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                    <LocalIcon name="search-x" size={28} />
                  </div>
                  <span className="text-[13px] font-black uppercase tracking-widest">
                    Sin auditorías coincidentes
                  </span>
                  <span className="text-[11px] font-semibold">
                    Ajusta la búsqueda o los filtros operativos.
                  </span>
                </div>
              )}
              {loading && (
                <div className="p-28 flex flex-col items-center justify-center gap-4">
                  <div className="w-10 h-10 border-4 border-slate-100 border-t-[var(--primary)] rounded-full animate-spin"></div>
                  <span className="text-[10px] font-black tracking-widest text-slate-400 uppercase">
                    Cargando auditorías...
                  </span>
                </div>
              )}
            </div>
          </section>

          <div
            className="offcanvas offcanvas-end ae-offcanvas"
            tabIndex="-1"
            id="panelNuevaAuditoriaExcedentes"
            aria-labelledby="panelNuevaAuditoriaExcedentesLabel"
          >
            <div className="offcanvas-header">
              <div>
                <h5 id="panelNuevaAuditoriaExcedentesLabel" className="mb-1 fw-bold">
                  Nueva Auditoría de Excedentes
                </h5>
                <p className="mb-0 text-muted" style={{ fontSize: "13px" }}>
                  Configura y abre un nuevo evento de auditoría.
                </p>
              </div>
              <button
                type="button"
                className="btn-close text-reset"
                data-bs-dismiss="offcanvas"
                aria-label="Cerrar"
              ></button>
            </div>
            <div className="offcanvas-body d-flex flex-column gap-4">
              <div>
                <label className="ae-form-label">Auditor responsable</label>
                <input
                  list="lista-usuarios-auditoria-excedentes"
                  className="ae-form-input"
                  placeholder="Escribe o selecciona auditor"
                  value={form.auditor}
                  onChange={(event) =>
                    setForm((previous) => ({
                      ...previous,
                      auditor: event.target.value.toUpperCase(),
                    }))
                  }
                />
                <datalist id="lista-usuarios-auditoria-excedentes">
                  {(bootstrapData.usuarios || []).map((user, index) => (
                    <option key={index} value={userName_(user)} />
                  ))}
                </datalist>
              </div>
              <div>
                <label className="ae-form-label">Tipo de auditoría</label>
                <select
                  className="ae-form-select"
                  value={form.tipoauditoria}
                  onChange={(event) =>
                    setForm((previous) => ({
                      ...previous,
                      tipoauditoria: event.target.value,
                      bodegaobjetivo: event.target.value === "POR_BODEGA" ? "" : "TODAS",
                    }))
                  }
                >
                  <option value="GLOBAL">GLOBAL</option>
                  <option value="POR_BODEGA">POR_BODEGA</option>
                </select>
              </div>
              {form.tipoauditoria === "POR_BODEGA" && (
                <div>
                  <label className="ae-form-label">Bodega objetivo</label>
                  <select
                    className="ae-form-select"
                    value={form.bodegaobjetivo}
                    onChange={(event) =>
                      setForm((previous) => ({
                        ...previous,
                        bodegaobjetivo: event.target.value.toUpperCase(),
                      }))
                    }
                  >
                    <option value="">Selecciona una bodega</option>
                    {(bootstrapData.bodegas || []).map((warehouse, index) => (
                      <option
                        key={`${warehouse}-${index}`}
                        value={String(warehouse || "").toUpperCase()}
                      >
                        {warehouse}
                      </option>
                    ))}
                  </select>
                </div>
              )}
              <div>
                <label className="ae-form-label">Observaciones</label>
                <textarea
                  className="ae-form-textarea"
                  placeholder="Notas iniciales de la auditoría..."
                  value={form.observaciones}
                  onChange={(event) =>
                    setForm((previous) => ({ ...previous, observaciones: event.target.value }))
                  }
                />
              </div>
              <div className="ae-mini-card">
                <div className="text-[11px] font-black uppercase tracking-[.14em] text-[var(--text-secondary)] mb-2">
                  Alcance esperado
                </div>
                <div className="text-[13px] font-semibold text-[var(--text-main)] leading-relaxed">
                  {form.tipoauditoria === "POR_BODEGA"
                    ? `La auditoría se abrirá solo para la bodega ${form.bodegaobjetivo || "SIN DEFINIR"}.`
                    : "La auditoría se abrirá considerando todas las bodegas auditables."}
                </div>
              </div>
              <button type="button" className="ae-btn-primary mt-auto" onClick={submitNew}>
                Abrir auditoría
              </button>
            </div>
          </div>
        </div>
      );
    };

    const target = document.getElementById("render-auditoria-excedentes");
    if (!target)
      return notify_("No se encontró el contenedor principal.", "error", 4200, {
        title: "Error de interfaz",
        sound: true,
      });
    if (window.__AUDITORIA_EXCEDENTES_ROOT__) {
      try {
        window.__AUDITORIA_EXCEDENTES_ROOT__.unmount();
      } catch (error) {
        console.warn(error);
      }
      window.__AUDITORIA_EXCEDENTES_ROOT__ = null;
    }
    target.dataset.aeMounted = "1";
    window.__AUDITORIA_EXCEDENTES_ROOT__ = ReactDOM.createRoot(target);
    window.__AUDITORIA_EXCEDENTES_ROOT__.render(<Dashboard />);
  };

  window.initVista = window.cargar_AuditoriaExcedentes;
  console.log("[AuditoriaExcedentes] Vista con acciones integradas en filtros registrada.");
</script>
