<script>
  /**
   * z0-ImpresionModoUtilidades.html
   *
   * Utilidades compartidas para seleccionar y ejecutar el canal de impresión
   * de APPALMACEN.
   *
   * Responsabilidades:
   * - Persistir el modo LOCAL u ONLINE en localStorage.
   * - Notificar cambios de modo mediante un evento global.
   * - Preparar una ventana de impresión LOCAL.
   * - Esperar documento, fuentes, imágenes, QR y readiness personalizado.
   * - Normalizar respuestas actuales y contratos legacy.
   * - Enviar paquetes ONLINE mediante el Controller del puente.
   * - Aplicar fallback LOCAL cuando la impresión ONLINE no puede confirmarse.
   *
   * Dependencias globales:
   * - window, localStorage, CustomEvent y requestAnimationFrame.
   * - google.script.run.
   * - window.notificar, opcional.
   * - window.__APP_PRINT_READY, opcional dentro del documento impreso.
   *
   * API global expuesta:
   * - ImpresionModoUtilidades.MODES.
   * - ImpresionModoUtilidades.getMode().
   * - ImpresionModoUtilidades.setMode(mode).
   * - ImpresionModoUtilidades.toggleMode().
   * - ImpresionModoUtilidades.imprimirResultado(resultado, options).
   * - ImpresionModoUtilidades.abrirHtmlLocal(html, titulo, ventanaExistente).
   *
   * Invariantes:
   * - Cualquier modo desconocido se normaliza a LOCAL.
   * - La ausencia de printJob en ONLINE puede activar fallback LOCAL.
   * - Los fallos de fuentes, imágenes o QR no bloquean indefinidamente.
   * - La ventana LOCAL debe abrirse desde una acción permitida por el navegador.
   * - Este archivo no contiene scriptlets de plantilla de Apps Script.
   */
</script>

<script>
  (function () {
    // =========================================================
    // INICIALIZACIÓN, CONFIGURACIÓN Y PERSISTENCIA
    // =========================================================
    if (!window.ImpresionModoUtilidades) {
      // =========================================================
    // API GLOBAL
    // =========================================================
    window.ImpresionModoUtilidades = {};
    }

    /** Clave persistente del modo de impresión seleccionado. */
    const STORAGE_KEY = "APP_ALMACEN_PRINT_MODE";

    /** Modos públicos admitidos por la infraestructura de impresión. */
    const MODES = {
      LOCAL: "LOCAL",
      ONLINE: "ONLINE"
    };

    /**
     * Obtiene el modo persistido y normaliza valores desconocidos a LOCAL.
     * @return {"LOCAL"|"ONLINE"}
     */
    function getMode() {
      const value = localStorage.getItem(STORAGE_KEY);
      return value === MODES.ONLINE ? MODES.ONLINE : MODES.LOCAL;
    }

    /**
     * Persiste el modo y emite el evento app-print-mode-change.
     * @param {*} mode Modo solicitado.
     * @return {"LOCAL"|"ONLINE"} Modo normalizado.
     */
    function setMode(mode) {
      const finalMode = mode === MODES.ONLINE ? MODES.ONLINE : MODES.LOCAL;

      localStorage.setItem(STORAGE_KEY, finalMode);

      window.dispatchEvent(new CustomEvent("app-print-mode-change", {
        detail: {
          mode: finalMode
        }
      }));

      return finalMode;
    }

    /**
     * Alterna entre LOCAL y ONLINE.
     * @return {"LOCAL"|"ONLINE"} Nuevo modo activo.
     */
    function toggleMode() {
      return setMode(getMode() === MODES.ONLINE ? MODES.LOCAL : MODES.ONLINE);
    }

    /**
     * Escribe un documento HTML en una ventana y solicita su impresión.
     *
     * @param {string} html Documento completo o fragmento imprimible.
     * @param {string=} titulo Título lógico de la operación.
     * @param {Window|null=} ventanaExistente Ventana abierta por el usuario.
     * @return {boolean} true si el documento pudo prepararse.
     */
    // =========================================================
    // IMPRESIÓN LOCAL Y ESPERA DE RECURSOS
    // =========================================================
    function abrirHtmlLocal(html, titulo = "Impresión", ventanaExistente = null) {
      const win = ventanaExistente || window.open("", "_blank", "width=900,height=700");

      if (!win) {
        if (window.notificar) {
          window.notificar("El navegador bloqueó la ventana de impresión.", "warning");
        }
        return false;
      }

      /** Crea una pausa asíncrona no bloqueante. */
      const esperar = (ms) => new Promise(resolve => setTimeout(resolve, ms));

      /**
       * Espera varios ciclos de pintura en la ventana de impresión.
       * @param {Window} w Ventana objetivo.
       * @param {number=} frames Número de cuadros.
       * @return {Promise<void>}
       */
      const esperarFrames = (w, frames = 2) => {
        return new Promise(resolve => {
          let count = 0;

          const step = () => {
            count++;

            if (count >= frames) {
              resolve();
              return;
            }

            w.requestAnimationFrame(step);
          };

          w.requestAnimationFrame(step);
        });
      };

      /** Espera load o un límite defensivo de 2.5 segundos. */
      const esperarDocumentoListo = async (w) => {
        try {
          if (w.document.readyState === "complete") return;

          await new Promise(resolve => {
            const done = () => resolve();

            w.addEventListener("load", done, { once: true });

            setTimeout(done, 2500);
          });
        } catch (err) {
          console.warn("No se pudo esperar load de documento:", err);
        }
      };

      /** Espera document.fonts.ready sin bloquear indefinidamente. */
      const esperarFuentes = async (w) => {
        try {
          if (w.document.fonts && typeof w.document.fonts.ready?.then === "function") {
            await Promise.race([
              w.document.fonts.ready,
              esperar(2500)
            ]);
          }
        } catch (err) {
          console.warn("No se pudo esperar document.fonts.ready:", err);
        }
      };

      /** Espera la carga o fallo controlado de todas las imágenes. */
      const esperarImagenes = async (w) => {
        try {
          const imagenes = Array.from(w.document.images || []);

          await Promise.all(
            imagenes.map(img => {
              if (img.complete && img.naturalWidth > 0) return Promise.resolve();

              if (typeof img.decode === "function") {
                return img.decode().catch(() => {});
              }

              return new Promise(resolve => {
                img.onload = resolve;
                img.onerror = resolve;
                setTimeout(resolve, 2500);
              });
            })
          );
        } catch (err) {
          console.warn("No se pudo esperar carga de imágenes:", err);
        }
      };

      /**
       * Comprueba la existencia de un QR visual con dimensiones válidas.
       * @param {Window} w Ventana objetivo.
       * @return {Promise<boolean>}
       */
      const esperarQRVisual = async (w) => {
        const maxIntentos = 30;
        const delay = 150;

        for (let i = 0; i < maxIntentos; i++) {
          try {
            const posiblesQR = Array.from(
              w.document.querySelectorAll(
                "canvas, svg, img, .qr, .qrcode, [data-qr], [data-qrcode]"
              )
            );

            const hayQRVisible = posiblesQR.some(el => {
              const rect = el.getBoundingClientRect();

              if (!rect || rect.width <= 0 || rect.height <= 0) {
                return false;
              }

              if (el.tagName === "IMG") {
                return el.complete && el.naturalWidth > 0;
              }

              if (el.tagName === "CANVAS") {
                return el.width > 0 && el.height > 0;
              }

              return true;
            });

            if (hayQRVisible) {
              await esperarFrames(w, 2);
              return true;
            }
          } catch (err) {
            console.warn("No se pudo validar QR visual:", err);
          }

          await esperar(delay);
        }

        return false;
      };

      /** Espera el contrato opcional __APP_PRINT_READY. */
      const esperarReadyPersonalizado = async (w) => {
        try {
          if (w.__APP_PRINT_READY && typeof w.__APP_PRINT_READY.then === "function") {
            await Promise.race([
              w.__APP_PRINT_READY,
              esperar(3500)
            ]);
          }
        } catch (err) {
          console.warn("No se pudo esperar __APP_PRINT_READY:", err);
        }
      };

      try {
        win.document.open();
        win.document.write(html || "");
        win.document.close();

        setTimeout(async function () {
          try {
            await esperarDocumentoListo(win);
            await esperarFuentes(win);
            await esperarImagenes(win);
            await esperarReadyPersonalizado(win);
            await esperarQRVisual(win);
            await esperarFrames(win, 3);
            await esperar(250);

            win.focus();
            win.print();

          } catch (err) {
            console.warn("No se pudo abrir impresión local automáticamente:", err);

            try {
              win.focus();
              win.print();
            } catch (fallbackErr) {
              console.warn("Fallback de impresión local falló:", fallbackErr);
            }
          }
        }, 100);

        return true;

      } catch (err) {
        console.error("No se pudo escribir la impresión local:", err);

        if (window.notificar) {
          window.notificar("No se pudo preparar la impresión local.", "error");
        }

        return false;
      }
    }

    /**
     * Normaliza respuestas actuales y contratos legacy basados en HTML directo.
     * @param {*} resultado Respuesta del servidor.
     * @return {{ok:boolean,htmlImpresion:string,printJob:Object|null,legacy:boolean=}}
     */
    // =========================================================
    // NORMALIZACIÓN Y ORQUESTACIÓN LOCAL / ONLINE
    // =========================================================
    function normalizarResultado(resultado) {
      if (typeof resultado === "string") {
        return {
          ok: true,
          htmlImpresion: resultado,
          printJob: null,
          legacy: true
        };
      }

      return resultado || {
        ok: false,
        htmlImpresion: "",
        printJob: null
      };
    }

    /**
     * Ejecuta la impresión en el modo activo y aplica fallback cuando procede.
     * @param {*} resultado Respuesta de generación de impresión.
     * @param {{titulo:string=,fallbackLocal:boolean=,ventanaLocal:Window|null=}=} options Opciones.
     * @return {void}
     */
    function imprimirResultado(resultado, options = {}) {
      const res = normalizarResultado(resultado);
      const mode = getMode();

      const titulo = options.titulo || "Impresión";
      const fallbackLocal = options.fallbackLocal !== false;
      const ventanaLocal = options.ventanaLocal || null;

      console.log("[IMPRESION] Modo actual:", mode);
      console.log("[IMPRESION] Resultado normalizado:", res);

      if (mode === MODES.LOCAL) {
        abrirHtmlLocal(res.htmlImpresion || "", titulo, ventanaLocal);
        return;
      }

      if (!res.printJob) {
        if (window.notificar) {
          window.notificar(
            "No hay paquete ONLINE para esta impresión. Se usará modo LOCAL.",
            "warning"
          );
        }

        if (fallbackLocal) {
          abrirHtmlLocal(res.htmlImpresion || "", titulo, ventanaLocal);
        }

        return;
      }

      if (window.notificar) {
        window.notificar("Enviando impresión ONLINE...", "info");
      }

      google.script.run
        .withSuccessHandler(function (respuesta) {
          if (respuesta && respuesta.ok) {
            if (window.notificar) {
              window.notificar("Impresión ONLINE enviada correctamente.", "success");
            }

            return;
          }

          if (window.notificar) {
            window.notificar(
              "No se confirmó la impresión ONLINE. Se abrirá modo LOCAL.",
              "warning"
            );
          }

          if (fallbackLocal) {
            abrirHtmlLocal(res.htmlImpresion || "", titulo, ventanaLocal);
          }
        })
        .withFailureHandler(function (err) {
          console.error("❌ Error impresión ONLINE:", err);

          if (window.notificar) {
            window.notificar(
              "Falló la impresión ONLINE. Se abrirá modo LOCAL.",
              "warning"
            );
          }

          if (fallbackLocal) {
            abrirHtmlLocal(res.htmlImpresion || "", titulo, ventanaLocal);
          }
        })
        .ImpresionPuenteController_imprimir(res.printJob);
    }

    window.ImpresionModoUtilidades = {
      MODES,
      getMode,
      setMode,
      toggleMode,
      imprimirResultado,
      abrirHtmlLocal
    };
  })();
</script>
