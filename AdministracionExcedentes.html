<script>
/**
 * AdministracionExcedentes.html
 *
 * Vista de administración de estados de excedentes (IDUNICO). Permite revisar
 * el historial completo de una etiqueta y corregir su estado (por ejemplo,
 * regresar un SURTIDO a ACOMODADO o la etiqueta a DISPONIBLE) deshaciendo
 * movimientos con todo lo que escribieron. El estilo visual replica
 * ReabastecimientoDetalles: workspace de altura completa, encabezado oscuro con
 * métricas, tablas operativas, drawer lateral y modales.
 *
 * FLUJO
 * 1. ACCESO: la vista no muestra nada hasta capturar la contraseña de
 *    administración. El servidor la valida (nunca el navegador) y entrega un
 *    token de sesión que solo vive en memoria de esta vista: al salir de la
 *    vista o recargar la página se vuelve a pedir.
 * 2. CONSULTA: se escanea o captura el IDUNICO. Se muestran STATUS en
 *    BD-EXCEDENTES, STATUS esperado según el historial, saldo, ubicación,
 *    movimientos, sincronización con EXISTENCIAS y detalles de
 *    Reabastecimiento ligados.
 * 3. PLAN: cada acción muestra primero QUÉ se revertirá y CÓMO quedará la
 *    etiqueta, con advertencias (por ejemplo, movimientos sin sincronización).
 * 4. CONFIRMACIÓN: responsable + motivo + contraseña otra vez. El servidor
 *    aplica todo bajo candado, sube la revisión de inventario (las demás
 *    vistas ven el cambio de inmediato) y registra el respaldo en la hoja
 *    ADMIN_EXCEDENTES_BITACORA.
 * 5. INCONSISTENCIAS: lista de etiquetas cuyo STATUS no coincide con su
 *    historial (desfase por ediciones manuales), con acceso directo a cada una.
 *
 * ACCIONES
 * - DESHACER_ULTIMO      Revierte solo el último movimiento.
 * - VOLVER_ACOMODADO     Revierte los SURTIDO posteriores al último ACOMODO.
 * - VOLVER_DISPONIBLE    Revierte todos los movimientos.
 * - SINCRONIZAR_STATUS   Corrige STATUS para que coincida con el historial.
 *
 * DEPENDENCIAS DEL SHELL
 * - REAB (z0-ReabastecimientoCliente.html): REAB.rpc (llamadas medidas y
 *   sobre {ok, data}), REAB.perf (bitácora de rendimiento), REAB.user
 *   (catálogo de usuarios y usuario recordado), REAB.util (formato, íconos y
 *   notificaciones). Se reutiliza para conservar un único cliente RPC.
 *
 * ENDPOINTS (z4-AdminExcedentesController.gs)
 * - AdminExcedentesController_iniciarSesion({password})
 * - AdminExcedentesController_cerrarSesion({token})
 * - AdminExcedentesController_consultar({token, idUnico})
 * - AdminExcedentesController_planificar({token, idUnico, accion})
 * - AdminExcedentesController_aplicar({token, idUnico, accion, firma, password, responsable, motivo})
 * - AdminExcedentesController_listarInconsistencias({token})
 *
 * SEGURIDAD
 * - La contraseña nunca se guarda en el navegador: los campos se limpian al
 *   enviarse y el token se descarta al desmontar la vista.
 * - El navegador no es autoridad: todo se revalida en el servidor bajo candado
 *   (firma del plan, identidad de cada fila, contraseña y token).
 *
 * @author Sigifredo de la Cruz Ramos
 * @version ADMINISTRACION-EXCEDENTES-VIEW-2026-11-20-01
 */
</script>

<script type="text/babel">
/* ============================================================================
 * AdministracionExcedentes · Lógica de la vista (React + Babel en navegador)
 * ============================================================================
 *
 * ESTRUCTURA
 * 1. Dependencias y textos ............. REAB, etiquetas de acciones y estados.
 * 2. Componentes de presentación ....... Icon, StatusChip, Metric.
 * 3. PasswordGate ...................... acceso a la vista.
 * 4. PlanModal ......................... plan + confirmación con contraseña.
 * 5. InconsistenciesDrawer ............. etiquetas con desfase de STATUS.
 * 6. App ............................... consulta, acciones y sesión.
 * 7. Montaje ........................... initVista / cleanup del Shell.
 *
 * MEDICIÓN
 * Cada llamada usa REAB.rpc con una traza ADMINEXC_* (view =
 * "AdministracionExcedentes"); se registra en APPALMACEN_RENDIMIENTO si el
 * switch de rendimiento está encendido. Ninguna traza incluye la contraseña.
 * ========================================================================== */
window.cargar_AdministracionExcedentes = () => {
  const { useState, useEffect, useMemo, useCallback, useRef } = React;

  // ==========================================================================
  // 1. DEPENDENCIAS Y TEXTOS
  // ==========================================================================

  const REAB = window.REAB;
  if (!REAB) {
    (window.notificar || console.error)("Falta la biblioteca z0-ReabastecimientoCliente.", "error");
    return () => {};
  }
  const { str, up, num, fmt, notify, publicError, errorCode } = REAB.util;

  /** Nombre de la vista en la bitácora de rendimiento. */
  const VIEW = "AdministracionExcedentes";

  /** Textos y orden de presentación de las acciones del servidor. */
  const ACTIONS = Object.freeze({
    DESHACER_ULTIMO: {
      title: "Deshacer último movimiento",
      icon: "undo-2",
      text: "Revierte solo el movimiento más reciente (ACOMODO o SURTIDO) con su efecto en existencias."
    },
    VOLVER_ACOMODADO: {
      title: "Volver a ACOMODADO",
      icon: "package-check",
      text: "Revierte los SURTIDO posteriores al último ACOMODO: la caja recupera su saldo en su ubicación."
    },
    VOLVER_DISPONIBLE: {
      title: "Volver a DISPONIBLE",
      icon: "rotate-ccw",
      text: "Revierte todos los movimientos: la etiqueta queda impresa y sin acomodar, con su cantidad inicial."
    },
    SINCRONIZAR_STATUS: {
      title: "Sincronizar STATUS",
      icon: "refresh-cw",
      text: "No toca movimientos: corrige STATUS en BD-EXCEDENTES para que coincida con el historial."
    }
  });

  /** Tono visual de cada STATUS. */
  const STATUS_TONE = Object.freeze({ DISPONIBLE: "blue", ACOMODADO: "green", PARCIAL: "amber", SURTIDO: "red" });

  // ==========================================================================
  // 2. COMPONENTES DE PRESENTACIÓN
  // ==========================================================================

  /** Ícono Lucide dibujado solo en su nodo (REAB.util.renderIcon). */
  function Icon({ name, size = 16 }) {
    const ref = useRef(null);
    useEffect(() => { REAB.util.renderIcon(ref.current, name, size); }, [name, size]);
    return <span ref={ref} className="inline-flex items-center justify-center" />;
  }

  /** Chip de STATUS con su tono. */
  function StatusChip({ value }) {
    const status = up(value) || "SIN STATUS";
    return <span className={`adx-chip ${STATUS_TONE[status] || "slate"}`}>{status}</span>;
  }

  /** Métrica de la franja superior. */
  function Metric({ label, value, tone }) {
    return (
      <div className={`adx-metric ${tone || ""}`}>
        <strong title={typeof value === "string" ? value : undefined}>{value}</strong>
        <span>{label}</span>
      </div>
    );
  }

  // ==========================================================================
  // 3. ACCESO CON CONTRASEÑA
  // ==========================================================================

  /**
   * Pantalla de acceso. Envía la contraseña al servidor y entrega el token a
   * la vista; el campo se limpia después de cada intento.
   *
   * @param {{onToken:function(string):void}} props
   */
  function PasswordGate({ onToken }) {
    const [password, setPassword] = useState("");
    const [busy, setBusy] = useState(false);
    const [error, setError] = useState("");
    const inputRef = useRef(null);
    useEffect(() => { setTimeout(() => inputRef.current?.focus(), 120); }, []);

    const submit = async (event) => {
      event.preventDefault();
      if (!password || busy) return;
      setBusy(true);
      setError("");
      const attempt = password;
      setPassword("");
      try {
        const { data } = await REAB.rpc("AdminExcedentesController_iniciarSesion", { password: attempt }, {
          operation: "ADMINEXC_ACCESO", view: VIEW, type: "ACCION", required: ["token"]
        });
        onToken(str(data.token));
      } catch (failure) {
        setError(publicError(failure));
        setTimeout(() => inputRef.current?.focus(), 60);
      } finally {
        setBusy(false);
      }
    };

    return (
      <div className="adx-gate">
        <form className="adx-gate-card" onSubmit={submit}>
          <div className="adx-gate-head">
            <p className="adx-eyebrow">Acceso restringido</p>
            <h1 className="adx-title">Administración de excedentes</h1>
            <p className="adx-description">Corrección de estados de IDUNICO</p>
          </div>
          <div className="adx-gate-body">
            <p>Esta herramienta revierte movimientos de inventario. Escribe la contraseña de administración para continuar.</p>
            <div className="adx-field">
              <label htmlFor="adx-gate-password">Contraseña</label>
              <input
                id="adx-gate-password"
                ref={inputRef}
                className="adx-input"
                type="password"
                autoComplete="off"
                value={password}
                onChange={(event) => setPassword(event.target.value)}
                disabled={busy}
              />
            </div>
            <div className={`adx-feedback ${error ? "error" : ""}`}>{error}</div>
            <button className="adx-btn primary" type="submit" disabled={busy || !password} style={{ width: "100%", marginTop: 8 }}>
              <Icon name="lock-open" size={15} />{busy ? "Verificando..." : "Entrar"}
            </button>
          </div>
        </form>
      </div>
    );
  }

  // ==========================================================================
  // 4. PLAN Y CONFIRMACIÓN
  // ==========================================================================

  /**
   * Modal que muestra el plan de una acción y la confirma con responsable,
   * motivo y contraseña.
   *
   * @param {{plan:!Object, busy:boolean, onCancel:function(), onConfirm:function(!Object)}} props
   */
  function PlanModal({ plan, busy, onCancel, onConfirm }) {
    const users = useMemo(() => REAB.user.catalog(), []);
    const [responsable, setResponsable] = useState(REAB.user.get());
    const [motivo, setMotivo] = useState("");
    const [password, setPassword] = useState("");
    const meta = ACTIONS[plan.accion] || { title: plan.accion };
    const ready = Boolean(responsable) && str(motivo).length >= 10 && Boolean(password) && !busy;

    useEffect(() => {
      const onKey = (event) => { if (event.key === "Escape" && !busy) onCancel(); };
      window.addEventListener("keydown", onKey);
      return () => window.removeEventListener("keydown", onKey);
    }, [busy, onCancel]);

    const confirm = () => {
      if (!ready) return;
      const secret = password;
      setPassword("");
      REAB.user.set(responsable);
      onConfirm({ responsable, motivo: str(motivo), password: secret });
    };

    return (
      <div className="adx-modal-layer" role="dialog" aria-modal="true">
        <div className="adx-modal">
          <div className="adx-modal-head">
            <p className="adx-eyebrow">Plan de cambio · {plan.idUnico}</p>
            <h2 className="adx-title" style={{ fontSize: 18 }}>{meta.title}</h2>
          </div>
          <div className="adx-modal-scroll">
            <div className="adx-transition">
              <span className="adx-count">STATUS</span>
              <StatusChip value={plan.statusAnterior} />
              <Icon name="arrow-right" size={14} />
              <StatusChip value={plan.cambiaStatus ? plan.statusNuevo : plan.statusAnterior} />
              <span className="adx-count" style={{ marginLeft: "auto" }}>Saldo {fmt(plan.saldoAnterior)} → {fmt(plan.saldoNuevo)}</span>
            </div>

            {plan.pasos.length === 0 && (
              <div className="adx-step"><b>Solo se corrige STATUS en BD-EXCEDENTES.</b><ul><li>No se revierte ningún movimiento ni se tocan existencias.</li></ul></div>
            )}
            {plan.pasos.map((step) => (
              <div key={step.fila} className="adx-step">
                <b>Revertir {step.tipo} · {step.fecha} {step.hora} · {fmt(Math.abs(num(step.cantidad)))} pzas</b>
                <ul>
                  <li>Bitacora-TRASPASOS: se vacía la fila {step.fila}{step.ubicacion ? ` (${step.ubicacion})` : ""}.</li>
                  {step.existencias
                    ? <li>EXISTENCIAS: devuelve {fmt(step.existencias.cantidad)} a {step.existencias.devolverA} y retira de {step.existencias.retirarDe}; la sincronización (fila {step.existencias.filaSincronizacion}) queda REVERTIDO.</li>
                    : <li><b>Sin sincronización:</b> EXISTENCIAS no se ajusta automáticamente.</li>}
                  {step.reabDetalle && <li>Reabastecimiento: se elimina el detalle del folio {step.reabDetalle.idSolicitud}.</li>}
                </ul>
              </div>
            ))}
            {plan.advertencias.length > 0 && (
              <div className="adx-warning">
                {plan.advertencias.map((warning, index) => <div key={index}>• {warning}</div>)}
              </div>
            )}

            <div className="adx-field">
              <label>Responsable</label>
              <select className="adx-select" value={responsable} onChange={(event) => setResponsable(up(event.target.value))} disabled={busy}>
                <option value="">Selecciona tu usuario...</option>
                {users.map((name) => <option key={name} value={name}>{name}</option>)}
              </select>
            </div>
            <div className="adx-field">
              <label>Motivo del cambio (mínimo 10 caracteres)</label>
              <textarea className="adx-textarea" value={motivo} maxLength={500} onChange={(event) => setMotivo(event.target.value)} disabled={busy} placeholder="Ej. Surtido registrado por error en la caja equivocada" />
            </div>
            <div className="adx-field">
              <label>Contraseña de administración</label>
              <input className="adx-input" type="password" autoComplete="off" value={password} onChange={(event) => setPassword(event.target.value)} disabled={busy} onKeyDown={(event) => { if (event.key === "Enter") confirm(); }} />
            </div>
          </div>
          <div className="adx-modal-foot">
            <button className="adx-btn ghost" onClick={onCancel} disabled={busy}>Cancelar</button>
            <button className="adx-btn primary" onClick={confirm} disabled={!ready}>
              <Icon name="shield-check" size={15} />{busy ? "Aplicando..." : "Aplicar cambio"}
            </button>
          </div>
        </div>
      </div>
    );
  }

  // ==========================================================================
  // 5. INCONSISTENCIAS
  // ==========================================================================

  /**
   * Drawer con las etiquetas cuyo STATUS no coincide con su historial.
   *
   * @param {{token:string, onOpen:function(string):void, onClose:function(), onSessionError:function(*):boolean}} props
   */
  function InconsistenciesDrawer({ token, onOpen, onClose, onSessionError }) {
    const [state, setState] = useState({ loading: true, data: null, error: "" });

    useEffect(() => {
      let active = true;
      const trace = REAB.perf.begin("ADMINEXC_INCONSISTENCIAS", { view: VIEW, type: "CONSULTA" });
      REAB.rpc("AdminExcedentesController_listarInconsistencias", { token }, { trace, keepOpen: true, required: ["items"], timeoutMs: 120000 })
        .then(({ data }) => {
          if (!active) return;
          setState({ loading: false, data, error: "" });
          trace.endAfterPaint("ok", { meta: { total: data.total } });
        })
        .catch((error) => {
          if (!trace.ended) trace.end("error", { error });
          if (!active || onSessionError(error)) return;
          setState({ loading: false, data: null, error: publicError(error) });
        });
      const onKey = (event) => { if (event.key === "Escape") onClose(); };
      window.addEventListener("keydown", onKey);
      return () => { active = false; window.removeEventListener("keydown", onKey); };
    }, [token]);

    const items = state.data?.items || [];
    return (
      <div className="adx-layer">
        <button className="adx-backdrop" aria-label="Cerrar" onClick={onClose} />
        <aside className="adx-drawer">
          <div className="adx-drawer-head">
            <div>
              <p className="adx-eyebrow">Revisión del almacén</p>
              <h2 className="adx-title">STATUS con desfase</h2>
              <p className="adx-description">{state.loading ? "Consolidando el estado de todas las etiquetas..." : `${fmt(state.data?.total || 0)} etiqueta(s) con STATUS distinto al de su historial`}</p>
            </div>
            <button className="adx-close" onClick={onClose} aria-label="Cerrar"><Icon name="x" size={18} /></button>
          </div>
          <div className="adx-drawer-content">
            {state.loading && <div className="adx-loading"><div className="adx-spinner" />Revisando BD-EXCEDENTES y Bitacora-TRASPASOS...</div>}
            {!state.loading && state.error && <div className="adx-empty"><Icon name="triangle-alert" size={28} />{state.error}</div>}
            {!state.loading && !state.error && !items.length && <div className="adx-empty"><Icon name="circle-check" size={28} />No hay etiquetas con desfase de STATUS.</div>}
            {!state.loading && items.length > 0 && (
              <div className="adx-table-card">
                <table className="adx-table">
                  <thead><tr><th>IDUNICO</th><th>Código</th><th>STATUS BD</th><th>Esperado</th><th>Saldo</th><th>Último movimiento</th><th></th></tr></thead>
                  <tbody>
                    {items.map((item) => (
                      <tr key={item.idUnico}>
                        <td className="adx-mono">{item.idUnico}</td>
                        <td><b>{item.codigo}</b><div className="adx-sub">{item.descripcion}</div></td>
                        <td><StatusChip value={item.statusBD} /></td>
                        <td><StatusChip value={item.statusEsperado} /></td>
                        <td className="adx-mono">{fmt(item.saldoActual)}</td>
                        <td>{item.ultimoMovimiento || "SIN MOVIMIENTOS"}<div className="adx-sub">{item.ultimaFecha}</div></td>
                        <td><button className="adx-btn" onClick={() => onOpen(item.idUnico)}><Icon name="search" size={14} />Abrir</button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
            {state.data && state.data.total > state.data.mostradas && (
              <p className="adx-count" style={{ marginTop: 10 }}>Se muestran {state.data.mostradas} de {state.data.total}. Corrige estas y vuelve a revisar.</p>
            )}
          </div>
        </aside>
      </div>
    );
  }

  // ==========================================================================
  // 6. APP
  // ==========================================================================

  function App() {
    /** Token de sesión: solo en memoria de esta vista. */
    const [token, setToken] = useState("");
    const [query, setQuery] = useState("");
    const [detail, setDetail] = useState(null);
    const [loading, setLoading] = useState(false);
    const [plan, setPlan] = useState(null);
    const [planBusy, setPlanBusy] = useState(false);
    const [applying, setApplying] = useState(false);
    const [showInconsistencies, setShowInconsistencies] = useState(false);
    const [lastResult, setLastResult] = useState(null);
    const tokenRef = useRef("");
    const scanRef = useRef(null);
    useEffect(() => { tokenRef.current = token; }, [token]);

    /** Al desmontar la vista se cierra la sesión del servidor. */
    useEffect(() => () => {
      if (tokenRef.current && window.google?.script?.run) {
        google.script.run.withFailureHandler(() => {}).AdminExcedentesController_cerrarSesion({ token: tokenRef.current });
      }
    }, []);

    /**
     * Si el error es de sesión, vuelve a la pantalla de acceso.
     * @return {boolean} true si el error se atendió aquí.
     */
    const handleSessionError = useCallback((error) => {
      if (errorCode(error) !== "ADMEXC_SESION_INVALIDA") return false;
      setToken("");
      setDetail(null);
      setPlan(null);
      notify(publicError(error), "warning", 4500, { title: "Sesión terminada" });
      return true;
    }, []);

    /** Consulta un IDUNICO y muestra su detalle. */
    const loadDetail = useCallback(async (value) => {
      const idUnico = str(value ?? query);
      if (!idUnico) { notify("Escanea o captura el IDUNICO.", "warning"); return; }
      const trace = REAB.perf.begin("ADMINEXC_CONSULTAR", { view: VIEW, type: "CONSULTA", meta: { idUnico } });
      setLoading(true);
      setLastResult(null);
      try {
        const { data } = await REAB.rpc("AdminExcedentesController_consultar", { token: tokenRef.current, idUnico }, { trace, keepOpen: true, required: ["idUnico", "movimientos", "acciones"] });
        setDetail(data);
        setQuery(data.idUnico);
        trace.endAfterPaint("ok", { meta: { movimientos: data.movimientos.length } });
      } catch (error) {
        if (!trace.ended) trace.end("error", { error });
        if (!handleSessionError(error)) {
          setDetail(null);
          notify(publicError(error), "error", 5000, { title: "No se pudo consultar" });
        }
      } finally {
        setLoading(false);
        setTimeout(() => scanRef.current?.select(), 60);
      }
    }, [query, handleSessionError]);

    /** Pide al servidor el plan de una acción. */
    const openPlan = async (accion) => {
      if (!detail) return;
      const trace = REAB.perf.begin("ADMINEXC_PLANIFICAR", { view: VIEW, type: "CONSULTA", meta: { accion } });
      setPlanBusy(true);
      try {
        const { data } = await REAB.rpc("AdminExcedentesController_planificar", { token: tokenRef.current, idUnico: detail.idUnico, accion }, { trace, keepOpen: true, required: ["pasos", "firma"] });
        setPlan(data);
        trace.endAfterPaint("ok", { meta: { pasos: data.pasos.length } });
      } catch (error) {
        if (!trace.ended) trace.end("error", { error });
        if (!handleSessionError(error)) notify(publicError(error), "warning", 5000, { title: "Acción no disponible" });
      } finally {
        setPlanBusy(false);
      }
    };

    /** Aplica el plan confirmado. */
    const applyPlan = async ({ responsable, motivo, password }) => {
      if (!plan) return;
      const trace = REAB.perf.begin("ADMINEXC_APLICAR", { view: VIEW, type: "ACCION", meta: { accion: plan.accion, pasos: plan.pasos.length } });
      setApplying(true);
      try {
        const { data } = await REAB.rpc("AdminExcedentesController_aplicar", {
          token: tokenRef.current,
          idUnico: plan.idUnico,
          accion: plan.accion,
          firma: plan.firma,
          responsable,
          motivo,
          password
        }, { trace, keepOpen: true, required: ["statusNuevo", "detalle"], timeoutMs: 120000 });
        setPlan(null);
        setDetail(data.detalle);
        setLastResult(data);
        notify(`${data.idUnico}: ${data.statusAnterior} → ${data.statusNuevo}. Cambio aplicado y visible en todas las vistas.`, "success", 5000, { title: "Estado corregido" });
        trace.endAfterPaint("ok", { meta: { movimientos: data.movimientosRevertidos } });
      } catch (error) {
        if (!trace.ended) trace.end("error", { error });
        if (handleSessionError(error)) return;
        const code = errorCode(error);
        notify(publicError(error), "error", 6000, { title: code === "ADMEXC_PLAN_CAMBIO" ? "La etiqueta cambió" : "No se aplicó el cambio", sound: true });
        if (code === "ADMEXC_PLAN_CAMBIO") {
          setPlan(null);
          loadDetail(plan.idUnico);
        }
      } finally {
        setApplying(false);
      }
    };

    /** Cierra la sesión manualmente. */
    const logout = () => {
      if (tokenRef.current && window.google?.script?.run) {
        google.script.run.withFailureHandler(() => {}).AdminExcedentesController_cerrarSesion({ token: tokenRef.current });
      }
      setToken("");
      setDetail(null);
      setPlan(null);
    };

    if (!token) {
      return (
        <div className="adx-page">
          <PasswordGate onToken={(value) => { setToken(value); setTimeout(() => scanRef.current?.focus(), 150); }} />
        </div>
      );
    }

    const estado = detail?.estado;
    const desfase = Boolean(detail?.desfase);

    return (
      <div className="adx-page">
        <div className="adx-workspace">
          {/* Encabezado: identidad, búsqueda y acciones de sesión */}
          <header className="adx-header">
            <div className="adx-id">
              <div className="adx-badge"><Icon name="shield-check" size={22} /></div>
              <div>
                <p className="adx-eyebrow">Administración · sesión activa</p>
                <h1 className="adx-title">Estados de excedentes</h1>
                <p className="adx-description">Revierte movimientos con su efecto completo</p>
              </div>
            </div>
            <form className="adx-search" onSubmit={(event) => { event.preventDefault(); loadDetail(); }}>
              <input
                ref={scanRef}
                className="adx-input"
                value={query}
                onChange={(event) => setQuery(event.target.value)}
                placeholder="Escanea o captura el IDUNICO"
                disabled={loading || applying}
              />
              <button className="adx-action primary" type="submit" disabled={loading || applying || !str(query)}>
                <Icon name="search" size={15} />{loading ? "Consultando..." : "Consultar"}
              </button>
            </form>
            <div className="adx-actions">
              <button className="adx-action" onClick={() => setShowInconsistencies(true)} disabled={applying}><Icon name="list-checks" size={15} />Inconsistencias</button>
              <button className="adx-action" onClick={logout} disabled={applying}><Icon name="log-out" size={15} />Salir</button>
            </div>
          </header>

          {/* Métricas de la etiqueta */}
          {detail && (
            <div className="adx-metrics">
              <Metric label="IDUNICO" value={detail.idUnico} />
              <Metric label="STATUS en BD" value={<StatusChip value={detail.statusBD} />} tone={desfase ? "bad" : "ok"} />
              <Metric label="STATUS por historial" value={<StatusChip value={detail.statusEsperado} />} tone={desfase ? "warn" : "ok"} />
              <Metric label={`Saldo de ${fmt(detail.cantidadInicial)}`} value={fmt(estado ? estado.saldoActual : detail.saldoHistorial)} />
              <Metric label={estado?.bodegaActual || "Ubicación"} value={estado?.ubicacionActual || "SIN UBICACIÓN"} />
              <Metric label="Movimientos" value={fmt(detail.movimientos.length)} />
            </div>
          )}

          {detail && desfase && (
            <div className="adx-banner">
              <Icon name="triangle-alert" size={16} />
              <span>El STATUS en BD-EXCEDENTES ({detail.statusBD || "vacío"}) no coincide con el historial ({detail.statusEsperado}). Usa “Sincronizar STATUS” o revierte el movimiento que corresponda.</span>
            </div>
          )}
          {lastResult && (
            <div className="adx-banner ok">
              <Icon name="circle-check" size={16} />
              <span>
                Cambio aplicado: {lastResult.movimientosRevertidos} movimiento(s) revertido(s), {lastResult.existenciasAjustadas} ajuste(s) de existencias
                {lastResult.reabDetallesEliminados ? `, ${lastResult.reabDetallesEliminados} detalle(s) de Reabastecimiento eliminado(s)` : ""}. Registrado en ADMIN_EXCEDENTES_BITACORA.
              </span>
            </div>
          )}

          <div className="adx-body">
            {!detail && !loading && (
              <div className="adx-empty">
                <Icon name="scan-line" size={34} />
                Escanea un IDUNICO para revisar su historial y corregir su estado.
                <button className="adx-btn ghost" onClick={() => setShowInconsistencies(true)}><Icon name="list-checks" size={14} />Ver etiquetas con desfase</button>
              </div>
            )}
            {loading && <div className="adx-loading"><div className="adx-spinner" />Leyendo BD-EXCEDENTES, Bitacora-TRASPASOS y sincronización...</div>}

            {detail && !loading && (
              <>
                {/* Acciones disponibles */}
                <section className="adx-section">
                  <div className="adx-section-head">
                    <div className="adx-section-title">
                      <div className="adx-section-icon"><Icon name="wrench" size={15} /></div>
                      <div><span className="adx-kicker">Corrección</span><span className="adx-heading">Acciones sobre {detail.codigo || detail.idUnico}</span></div>
                    </div>
                    <span className="adx-count">{detail.descripcion}</span>
                  </div>
                  <div className="adx-cards">
                    {detail.acciones.map((action) => {
                      const meta = ACTIONS[action.accion] || { title: action.accion, icon: "circle", text: "" };
                      return (
                        <div key={action.accion} className={`adx-card ${action.disponible ? "available" : "disabled"}`}>
                          <h3><Icon name={meta.icon} size={14} /> {meta.title}</h3>
                          <p>{action.disponible ? meta.text : action.motivo}</p>
                          <div className="adx-card-foot">
                            {action.disponible ? <StatusChip value={action.statusNuevo} /> : <span className="adx-chip slate">No aplica</span>}
                            <button className="adx-btn" disabled={!action.disponible || planBusy || applying} onClick={() => openPlan(action.accion)}>
                              <Icon name="list-ordered" size={14} />Revisar plan
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </section>

                {/* Historial de movimientos */}
                <section className="adx-section">
                  <div className="adx-section-head">
                    <div className="adx-section-title">
                      <div className="adx-section-icon"><Icon name="history" size={15} /></div>
                      <div><span className="adx-kicker">Bitacora-TRASPASOS</span><span className="adx-heading">Historial de movimientos</span></div>
                    </div>
                    <span className="adx-count">Del más antiguo al más reciente</span>
                  </div>
                  <div className="adx-table-card">
                    <table className="adx-table">
                      <thead><tr><th>Fecha</th><th>Tipo</th><th>Cantidad</th><th>Origen</th><th>Destino</th><th>Solicitante</th><th>Existencias</th><th>Reabastecimiento</th></tr></thead>
                      <tbody>
                        {detail.movimientos.length === 0 && <tr><td colSpan={8} className="adx-sub" style={{ textAlign: "center", padding: 22 }}>Sin movimientos registrados: la etiqueta solo existe en BD-EXCEDENTES.</td></tr>}
                        {detail.movimientos.map((movement, index) => (
                          <tr key={movement.fila} className={index === detail.movimientos.length - 1 ? "adx-last" : ""}>
                            <td className="adx-mono">{movement.fecha}<div className="adx-sub">{movement.hora} · fila {movement.fila}</div></td>
                            <td><span className={`adx-chip ${movement.tipo === "SURTIDO" ? "red" : "green"}`}>{movement.tipo}</span></td>
                            <td className="adx-mono">{fmt(Math.abs(num(movement.cantidad)))}</td>
                            <td>{movement.ubicacionSalida}<div className="adx-sub">{movement.bodegaSalida}</div></td>
                            <td>{movement.ubicacionEntrada}<div className="adx-sub">{movement.bodegaEntrada}</div></td>
                            <td>{movement.solicitante}</td>
                            <td>{movement.sincronizado ? <span className="adx-chip green">Sincronizado</span> : <span className="adx-chip amber">Sin sincronización</span>}</td>
                            <td>{movement.reabDetalle ? <span className="adx-chip blue">{movement.reabDetalle.idSolicitud}</span> : <span className="adx-sub">—</span>}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </section>

                {/* Filas en BD-EXCEDENTES */}
                <section className="adx-section">
                  <div className="adx-section-head">
                    <div className="adx-section-title">
                      <div className="adx-section-icon"><Icon name="database" size={15} /></div>
                      <div><span className="adx-kicker">BD-EXCEDENTES</span><span className="adx-heading">Registro de la etiqueta</span></div>
                    </div>
                    <span className="adx-count">La fila activa es la que se actualiza</span>
                  </div>
                  <div className="adx-table-card">
                    <table className="adx-table">
                      <thead><tr><th>Fila</th><th>Fecha</th><th>Código</th><th>Cantidad inicial</th><th>STATUS</th><th>Impresión</th><th></th></tr></thead>
                      <tbody>
                        {detail.base.length === 0 && <tr><td colSpan={7} className="adx-sub" style={{ textAlign: "center", padding: 22 }}>La etiqueta no existe en BD-EXCEDENTES.</td></tr>}
                        {detail.base.map((row) => (
                          <tr key={row.rowNumber}>
                            <td className="adx-mono">{row.rowNumber}</td>
                            <td className="adx-mono">{row.fecha}<div className="adx-sub">{row.hora}</div></td>
                            <td><b>{row.codigo}</b><div className="adx-sub">{row.descripcion}</div></td>
                            <td className="adx-mono">{fmt(row.cantidad)}</td>
                            <td><StatusChip value={row.status} /></td>
                            <td>{row.responsableImpresion || "—"}</td>
                            <td>{row.activa ? <span className="adx-chip slate">Activa</span> : null}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </section>

                {/* Detalles de Reabastecimiento */}
                {detail.reabDetalles.length > 0 && (
                  <section className="adx-section">
                    <div className="adx-section-head">
                      <div className="adx-section-title">
                        <div className="adx-section-icon"><Icon name="package-open" size={15} /></div>
                        <div><span className="adx-kicker">Reabastecimiento</span><span className="adx-heading">Surtidos ligados a la etiqueta</span></div>
                      </div>
                    </div>
                    <div className="adx-table-card">
                      <table className="adx-table">
                        <thead><tr><th>Folio</th><th>Fila</th><th>Cantidad</th><th>Tipo</th><th>Operación</th></tr></thead>
                        <tbody>
                          {detail.reabDetalles.map((item) => (
                            <tr key={item.numFila}>
                              <td className="adx-mono">{item.idSolicitud}</td>
                              <td className="adx-mono">{item.numFila}</td>
                              <td className="adx-mono">{fmt(item.cantidad)}</td>
                              <td>{item.tipoSurtido || "—"}</td>
                              <td className="adx-sub">{item.idOperacion || "—"}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </section>
                )}
              </>
            )}
          </div>
        </div>

        {plan && <PlanModal plan={plan} busy={applying} onCancel={() => !applying && setPlan(null)} onConfirm={applyPlan} />}
        {showInconsistencies && (
          <InconsistenciesDrawer
            token={token}
            onClose={() => setShowInconsistencies(false)}
            onSessionError={handleSessionError}
            onOpen={(idUnico) => { setShowInconsistencies(false); setQuery(idUnico); loadDetail(idUnico); }}
          />
        )}
      </div>
    );
  }

  // ==========================================================================
  // 7. MONTAJE EN EL SHELL
  // ==========================================================================

  const target = document.getElementById("render-administracion-excedentes");
  if (!target) {
    notify("No se encontró el contenedor de la administración de excedentes.", "error");
    return () => {};
  }
  if (window.__ADMINISTRACION_EXCEDENTES_ROOT__) {
    try { window.__ADMINISTRACION_EXCEDENTES_ROOT__.unmount(); } catch (_) { /* raíz previa ya desmontada */ }
  }
  window.__ADMINISTRACION_EXCEDENTES_ROOT__ = ReactDOM.createRoot(target);
  window.__ADMINISTRACION_EXCEDENTES_ROOT__.render(<App />);

  /** Limpieza que el Shell ejecuta al salir de la vista (cierra la sesión). */
  return () => {
    if (window.__ADMINISTRACION_EXCEDENTES_ROOT__) {
      try { window.__ADMINISTRACION_EXCEDENTES_ROOT__.unmount(); } catch (_) { /* sin acción */ }
      window.__ADMINISTRACION_EXCEDENTES_ROOT__ = null;
    }
  };
};
window.initVista = window.cargar_AdministracionExcedentes;
</script>
