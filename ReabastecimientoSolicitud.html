<script>
/**
 * ReabastecimientoSolicitud.html
 *
 * Vista React para crear solicitudes manuales de reabastecimiento.
 * Consolida las filas individuales del endpoint por CODIGO + UBICACION_SURTIDO.
 *
 * ORDEN DE COLUMNAS
 * 1. SKU / descripción.
 * 2. Ubicación de piso de venta.
 * 3. Ubicación del excedente, resumida por bodega física.
 * 4. Cantidad por caja, con total y desglose por IDUNICO.
 *
 * REGLAS
 * - Cada IDUNICO equivale a una caja.
 * - Un IDUNICO se contabiliza una sola vez dentro de cada grupo.
 * - Se muestra el conjunto completo, sin límite artificial de filas.
 * - Solo se permite una ubicación de surtido seleccionada por SKU.
 * - El navegador envía únicamente solicitante, bodega, código y ubicación.
 * - El Service conserva la autoridad y revalida antes de persistir.
 *
 * @author Sigifredo de la Cruz Ramos
 * @version REABASTECIMIENTO-SOLICITUD-VIEW-2026-11-12-07
 */
</script>

.rs-field{display:grid;gap:6px;min-width:0}.rs-label{color:var(--rs-muted);font-size:8px;font-weight:950;letter-spacing:.14em;text-transform:uppercase}.rs-input,.rs-select{width:100%;min-height:44px;padding:0 13px;border:1px solid var(--rs-border);border-radius:12px;outline:none;background:#fff;color:var(--rs-text);font-size:12px;font-weight:850}.rs-input:focus,.rs-select:focus{border-color:var(--rs-primary);box-shadow:0 0 0 4px rgba(217,48,37,.09)}

.rs-content{flex:1 1 auto;min-height:0;overflow:hidden}.rs-table-wrap{height:100%;overflow:auto}.rs-table{width:100%;min-width:1100px;table-layout:fixed;border-collapse:separate;border-spacing:0}

.rs-table th:nth-child(1){width:27%}.rs-table th:nth-child(2){width:22%}.rs-table th:nth-child(3){width:25%}.rs-table th:nth-child(4){width:26%}

.rs-total{display:block;font-size:24px;font-weight:950;line-height:1;color:var(--rs-text)}.rs-box-summary{display:block;margin-top:7px;font-size:12px;font-weight:900;line-height:1.45;color:#3c4043}.rs-box-breakdown{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.rs-box-pill{padding:5px 8px;border:1px solid #dfe3e8;border-radius:999px;background:#f8f9fa;color:#3c4043;font:850 10px/1.1 "JetBrains Mono",monospace;white-space:nowrap}

<div id="render-reabastecimiento-solicitud"></div>

<script type="text/babel">
window.cargar_ReabastecimientoSolicitud=()=>{
  const{useState,useEffect,useMemo,useCallback,useRef}=React;
  const LocalIcon=window.FitoComponents?.Icon?.LocalIcon||window.FitoComponents?.LocalIcon;
  const text=(v)=>String(v??"").trim(),upper=(v)=>text(v).toUpperCase();
  const natural=(a,b)=>upper(a).localeCompare(upper(b),"es-MX",{numeric:true,sensitivity:"base"});
  const publicError=(e)=>text(e?.message||e).replace(/^\[[A-Z0-9_]+\]\s*/,"")||"No fue posible completar la operación.";
  const notify=(m,t="info",d=2800,o={})=>{const fn=window.notificar||window.lanzarNotificacion;if(typeof fn==="function")fn(m,t,d,o)};
  const formatNumber=(value)=>new Intl.NumberFormat("es-MX",{maximumFractionDigits:2}).format(Number(value||0));

  /**
   * Consolida registros individuales sin perder la cantidad de cada caja.
   * @param {!Array<!Object>} source Filas del endpoint manual.
   * @return {!Array<!Object>} Filas agrupadas por SKU y ubicación de surtido.
   */
  function consolidateRows(source){
    const groups=new Map();
    (Array.isArray(source)?source:[]).forEach((row)=>{
      const code=upper(row?.codigo),supply=upper(row?.ubicacionSurtido),id=upper(row?.idUnico);
      if(!code||!supply||!id)return;
      const key=`${code}|${supply}`;
      if(!groups.has(key))groups.set(key,{codigo:code,descripcion:upper(row.descripcion),ubicacionSurtido:supply,bodegaSurtido:upper(row.bodegaSurtido),boxes:new Map(),warehouses:new Map()});
      const group=groups.get(key);if(group.boxes.has(id))return;
      const quantity=Number(row.cantidadIdUnico||0),physicalWarehouse=upper(row.bodegaExcedente)||"SIN BODEGA";
      group.boxes.set(id,{idUnico:id,cantidad:quantity,bodega:physicalWarehouse});
      if(!group.warehouses.has(physicalWarehouse))group.warehouses.set(physicalWarehouse,{bodega:physicalWarehouse,cajas:0,piezas:0});
      const warehouseSummary=group.warehouses.get(physicalWarehouse);warehouseSummary.cajas+=1;warehouseSummary.piezas+=quantity;
    });
    return[...groups.values()].map((group)=>{
      const boxes=[...group.boxes.values()].sort((a,b)=>b.cantidad-a.cantidad||natural(a.idUnico,b.idUnico));
      return{codigo:group.codigo,descripcion:group.descripcion,ubicacionSurtido:group.ubicacionSurtido,bodegaSurtido:group.bodegaSurtido,cajas:boxes,totalCajas:boxes.length,cantidadTotal:boxes.reduce((sum,box)=>sum+box.cantidad,0),resumenBodegas:[...group.warehouses.values()].sort((a,b)=>natural(a.bodega,b.bodega))};
    });
  }

  /** Construye la frase: una caja con 1000 y otra con 1000. */
  function buildBoxSentence(boxes){
    if(!boxes.length)return"Sin cajas";
    const labels=boxes.map((box,index)=>`${index===0?"una":"otra"} caja con ${formatNumber(box.cantidad)}`);
    if(labels.length===1)return labels[0];
    return`${labels.slice(0,-1).join(", ")} y ${labels.at(-1)}`;
  }

  const View=()=>{
    const users=useMemo(()=>(Array.isArray(window.usuariosGlobal)?window.usuariosGlobal:[]).map((u)=>({id:Number(u.idusuario||0),nombre:upper(u.nombre)})).filter((u)=>u.nombre).sort((a,b)=>natural(a.nombre,b.nombre)),[]);
    const[warehouses,setWarehouses]=useState([]),[user,setUser]=useState(""),[warehouse,setWarehouse]=useState("");
    const[rows,setRows]=useState([]),[selected,setSelected]=useState(new Map()),[sortDirection,setSortDirection]=useState("ASC");
    const[loadingBootstrap,setLoadingBootstrap]=useState(true),[loading,setLoading]=useState(false),[creating,setCreating]=useState(false);
    const sequence=useRef(0),mounted=useRef(true),watchdog=useRef(null);
    const callServer=useCallback((method,...args)=>new Promise((resolve,reject)=>{if(!window.google?.script?.run)return reject(new Error("google.script.run no está disponible."));const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);if(typeof runner[method]!=="function")return reject(new Error(`Endpoint no disponible: ${method}`));runner[method](...args)}),[]);
    const loadWarehouses=useCallback(async()=>{setLoadingBootstrap(true);try{const response=await callServer("ReabastecimientoController_getExcedentesSolicitudManual","");if(!mounted.current)return;const list=(Array.isArray(response?.data?.bodegasPisoVenta)?response.data.bodegasPisoVenta:[]).map((item)=>({id:upper(item.id),label:text(item.label)||upper(item.id)})).filter((item)=>["B1","B2","B3","MO","CU"].includes(item.id));setWarehouses(list);if(!list.length)notify("No existen bodegas de piso configuradas.","warning",4500,{title:"Sin bodegas",sound:true})}catch(error){if(mounted.current){setWarehouses([]);notify(publicError(error),"error",5000,{title:"No se cargaron las bodegas",sound:true})}}finally{if(mounted.current)setLoadingBootstrap(false)}},[callServer]);
    useEffect(()=>{mounted.current=true;loadWarehouses();return()=>{mounted.current=false;sequence.current+=1;clearTimeout(watchdog.current)}},[loadWarehouses]);
    const invalidate=()=>{sequence.current+=1;clearTimeout(watchdog.current);setRows([]);setSelected(new Map())};
    const loadRows=async()=>{if(!users.some((u)=>u.nombre===upper(user)))return notify("Selecciona un solicitante registrado.","warning");if(!warehouse)return notify("Selecciona una bodega de piso.","warning");const current=++sequence.current;setLoading(true);setSelected(new Map());watchdog.current=setTimeout(()=>{if(mounted.current&&sequence.current===current){sequence.current+=1;setLoading(false);notify("La consulta tardó demasiado.","warning",4500,{title:"Tiempo agotado",sound:true})}},25000);try{const response=await callServer("ReabastecimientoController_getExcedentesSolicitudManual",warehouse);if(!mounted.current||sequence.current!==current)return;clearTimeout(watchdog.current);const consolidated=consolidateRows(response?.data?.registros);setRows(consolidated);notify(`${consolidated.length} SKU/ubicación consolidados.`,"success",1800,{title:"Excedentes cargados"})}catch(error){if(mounted.current&&sequence.current===current)notify(publicError(error),"error",5000,{title:"Error de consulta",sound:true})}finally{if(mounted.current&&sequence.current===current)setLoading(false)}};
    const ordered=useMemo(()=>[...rows].sort((a,b)=>{const order=natural(a.ubicacionSurtido,b.ubicacionSurtido);return(sortDirection==="ASC"?order:-order)||natural(a.codigo,b.codigo)}),[rows,sortDirection]);
    const totalSkus=useMemo(()=>new Set(rows.map((r)=>r.codigo)).size,[rows]);
    const toggle=(item)=>setSelected((previous)=>{const next=new Map(previous),current=next.get(item.codigo);if(current?.ubicacionSurtido===item.ubicacionSurtido)next.delete(item.codigo);else next.set(item.codigo,{codigo:item.codigo,ubicacionSurtido:item.ubicacionSurtido});return next});
    /** Navega al listado y solicita una recarga autoritativa. */
    const navigateToList = (idSolicitud = "") => {
      window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || {};
      window.DATA_ALMACEN_CACHE.reabastecimientoRefreshRequired = true;
      window.DATA_ALMACEN_CACHE.reabastecimientoUltimaSolicitud = idSolicitud;
      if (typeof window.irAVistaShell === "function") {
        window.irAVistaShell(
          "Reabastecimiento",
          "Reabastecimiento",
          {
            REABASTECIMIENTO_REFRESH_REQUIRED: true,
            REABASTECIMIENTO_ULTIMA_SOLICITUD: idSolicitud,
          }
        );
      }
    };

    /** Crea con watchdog. Un timeout no dispara reintento automático. */
    const create = async () => {
      if (creating || !selected.size) return;
      setCreating(true);
      let creationTimer = null;
      try {
        const payload = {
          solicitante: upper(user),
          bodega: warehouse,
          partidas: [...selected.values()].map((item) => ({
            codigo: item.codigo,
            ubicacion: item.ubicacionSurtido,
          })),
        };
        const timeoutPromise = new Promise((_, reject) => {
          creationTimer = setTimeout(() => {
            const error = new Error(
              "La creación superó 45 segundos. La operación pudo concluir en el servidor."
            );
            error.code = "REAB_CREATE_TIMEOUT";
            reject(error);
          }, 45000);
        });
        const response = await Promise.race([
          callServer("ReabastecimientoController_crearSolicitud", payload),
          timeoutPromise,
        ]);
        clearTimeout(creationTimer);
        const idSolicitud = text(response?.data?.idSolicitud);
        notify(
          `Solicitud ${idSolicitud} creada correctamente.`,
          "success",
          2600,
          { title: "Solicitud creada", sound: true }
        );
        navigateToList(idSolicitud);
      } catch (error) {
        clearTimeout(creationTimer);
        if (error?.code === "REAB_CREATE_TIMEOUT") {
          notify(
            "La respuesta tardó demasiado. Regresaremos al listado para verificar antes de permitir otro intento.",
            "warning",
            6500,
            { title: "Resultado por confirmar", sound: true }
          );
          navigateToList("");
        } else {
          notify(publicError(error), "error", 5000, {
            title: "No se creó la solicitud",
            sound: true,
          });
        }
      } finally {
        if (mounted.current) setCreating(false);
      }
    };
    return <div className="rs-page"><section className="rs-workspace">
      <header className="rs-header"><div className="rs-identity"><div className="rs-icon"><LocalIcon name="clipboard-plus" size={23}/></div><div><p className="rs-eyebrow">Solicitud manual</p><h2 className="rs-title">NUEVO REABASTECIMIENTO</h2><p className="rs-subtitle">Excedentes consolidados por SKU, surtido, bodega y caja.</p></div></div>
      <div className="rs-metrics"><div className="rs-metric"><div className="rs-metric-value">{totalSkus}</div><div className="rs-metric-label">SKU rellenables</div></div><div className="rs-metric green"><div className="rs-metric-value">{selected.size}</div><div className="rs-metric-label">Seleccionados</div></div><div className="rs-metric amber"><div className="rs-metric-value">{Math.max(0,totalSkus-selected.size)}</div><div className="rs-metric-label">Omitidos</div></div><div className="rs-metric red"><button className="rs-clear" onClick={()=>setSelected(new Map())} disabled={!selected.size||creating}><LocalIcon name="eraser" size={15}/>Limpiar selección</button></div></div>
      <div className="rs-actions"><button className="rs-header-btn" onClick={()=>!creating&&window.irAVistaShell?.("Reabastecimiento","Reabastecimiento")}><LocalIcon name="arrow-left" size={15}/>Volver</button><button className="rs-header-btn primary" onClick={create} disabled={creating||!selected.size}><LocalIcon name="send" size={15}/>{creating?"Creando...":"Crear solicitud"}</button></div></header>
      <div className="rs-controls"><label className="rs-field"><span className="rs-label">Solicitante</span><input className="rs-input" list="rs-users" value={user} onChange={(e)=>{setUser(e.target.value.toUpperCase());invalidate()}} placeholder="Selecciona un solicitante" disabled={creating}/><datalist id="rs-users">{users.map((u)=><option key={`${u.id}-${u.nombre}`} value={u.nombre}/>)}</datalist></label><label className="rs-field"><span className="rs-label">Bodega de piso de venta</span><select className="rs-select" value={warehouse} onChange={(e)=>{setWarehouse(e.target.value);invalidate()}} disabled={loadingBootstrap||creating||!warehouses.length}><option value="">{loadingBootstrap?"Cargando bodegas...":warehouses.length?"Selecciona una bodega":"Sin bodegas disponibles"}</option>{warehouses.map((w)=><option key={w.id} value={w.id}>{w.label}</option>)}</select>{!loadingBootstrap&&!warehouses.length&&<button className="rs-btn" onClick={loadWarehouses}>Reintentar bodegas</button>}</label><button className="rs-btn primary" onClick={loadRows} disabled={loading||creating||!user||!warehouse}><LocalIcon name="database" size={16}/>{loading?"Consultando...":"Cargar excedentes"}</button></div>
      <div className="rs-content"><div className="rs-table-wrap rs-scroll"><table className="rs-table"><thead><tr><th>SKU / descripción</th><th><button className="rs-sort" onClick={()=>setSortDirection((v)=>v==="ASC"?"DESC":"ASC")}><span>Ubicación piso de venta</span><span>{sortDirection==="ASC"?"A-Z ↑":"Z-A ↓"}</span></button></th><th>Ubicación excedente</th><th>Cantidad por caja</th></tr></thead><tbody>
      {ordered.map((item,index)=>{const current=selected.get(item.codigo),isSelected=current?.ubicacionSurtido===item.ubicacionSurtido;return <tr key={`${item.codigo}|${item.ubicacionSurtido}|${index}`} className={`rs-row ${isSelected?"selected":""}`} onClick={()=>toggle(item)}><td><div className="rs-product"><input className="rs-check" type="checkbox" checked={Boolean(isSelected)} onChange={()=>toggle(item)} onClick={(e)=>e.stopPropagation()} disabled={creating}/><div><span className="rs-code">{item.codigo}</span><span className="rs-description">{item.descripcion||"SIN DESCRIPCIÓN"}</span></div></div></td><td><span className="rs-location">{item.ubicacionSurtido}</span><span className="rs-secondary">{warehouses.find((w)=>w.id===item.bodegaSurtido)?.label||item.bodegaSurtido}</span></td><td><div className="rs-warehouse-list">{item.resumenBodegas.map((summary)=><div key={summary.bodega} className="rs-warehouse"><span>{summary.bodega}</span><strong>{summary.cajas} {summary.cajas===1?"CAJA":"CAJAS"}</strong></div>)}</div></td><td><span className="rs-total">{formatNumber(item.cantidadTotal)}</span><span className="rs-box-summary">{formatNumber(item.cantidadTotal)} piezas en {item.totalCajas} {item.totalCajas===1?"caja":"cajas"}, {buildBoxSentence(item.cajas)}</span><div className="rs-box-breakdown">{item.cajas.map((box,index)=><span key={box.idUnico} className="rs-box-pill">Caja {index+1}: {formatNumber(box.cantidad)}</span>)}</div></td></tr>})}

    </section></div>;
