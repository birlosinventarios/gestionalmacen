<script>
/**
 * ReabastecimientoSolicitud.html
 *
 * Vista React para crear solicitudes manuales de reabastecimiento.
 * Consolida las filas individuales del endpoint por CODIGO + UBICACION_SURTIDO.
 *
 * ORDEN DE COLUMNAS
 * 1. SKU / descripción.
 * 2. Ubicación de piso de venta.
 * 3. Ubicación del excedente, resumida por bodega física.
 * 4. Cantidad por caja, con total y desglose por IDUNICO.
 *
 * REGLAS
 * - Cada IDUNICO equivale a una caja.
 * - Un IDUNICO se contabiliza una sola vez dentro de cada grupo.
 * - Se muestra el conjunto completo, sin límite artificial de filas.
 * - Solo se permite una ubicación de surtido seleccionada por SKU.
 * - Proceso REABASTECIMIENTO-v1 (rondín): la solicitud pertenece a una bodega
 *   de piso (ZONA) y a un área de suministro (PASILLO). Solo se listan SKU del
 *   área elegida con excedentes acomodados y disponibles.
 * - El usuario elegido se recuerda en este equipo para cargarlo automáticamente.
 * - Depende de REAB (z0-ReabastecimientoCliente.html): RPC medido, tracker de
 *   rendimiento y aviso de cambios en tiempo real. La lista de operaciones medidas
 *   está documentada al inicio del script de la vista.
 * - El navegador envía únicamente solicitante, bodega, área, código y ubicación.
 * - El Service conserva la autoridad y revalida antes de persistir.
 *
 * @author Sigifredo de la Cruz Ramos
 * @version REABASTECIMIENTO-SOLICITUD-VIEW-2026-11-20-01
 */
</script>

<script type="text/babel">
/* ============================================================================
 * ReabastecimientoSolicitud · Lógica de la vista (React + Babel en navegador)
 * ============================================================================
 *
 * PROPÓSITO (proceso REABASTECIMIENTO-v1, sección 1 · "Rondín")
 * ───────────────────────────────────────────────────────────────
 * 1. El encargado elige su usuario, la bodega de piso y el área de suministro.
 * 2. Se cargan los SKU del área con excedentes ACOMODADOS y con ubicación.
 * 3. Durante el recorrido marca los SKU que requieren reabastecimiento.
 * 4. CREAR SOLICITUD registra el ticket en la cola de los auxiliares.
 *
 * ESTRUCTURA DEL CÓDIGO
 * ─────────────────────
 * 1. Dependencias y constantes.
 * 2. Transformaciones puras: consolidateRows(), buildBoxSentence().
 * 3. Componente View: carga de bodegas, carga de excedentes, selección,
 *    creación y aviso de cambios en tiempo real.
 * 4. Montaje en el Shell.
 *
 * MEDICIÓN DE RENDIMIENTO (REAB.perf → hoja APPALMACEN_RENDIMIENTO)
 * ───────────────────────────────────────────────────────────────────────
 *   SOLICITUD_VISTA_MONTADA       initVista → selector de bodegas visible
 *   SOLICITUD_CARGAR_BODEGAS      consulta de bodegas y áreas
 *   SOLICITUD_CARGAR_EXCEDENTES   clic → tabla de SKU pintada (consulta +
 *                                 consolidación + render)
 *   SOLICITUD_ORDENAR             cambio de orden de la tabla
 *   SOLICITUD_LIMPIAR_SELECCION   borrado masivo de la selección
 *   SOLICITUD_CREAR               clic CREAR → solicitud confirmada
 *
 * TIEMPO REAL
 * ───────────
 * La vista no recarga sola la tabla para no perder la selección del rondín.
 * Si otro usuario surte o crea solicitudes mientras hay datos cargados, se
 * muestra un aviso con el botón "Actualizar excedentes".
 * ========================================================================== */
window.cargar_ReabastecimientoSolicitud = () => {
  const { useState, useEffect, useMemo, useCallback, useRef } = React;

  // ==========================================================================
  // 1. DEPENDENCIAS Y CONSTANTES
  // ==========================================================================

  const REAB = window.REAB;
  const LocalIcon = window.FitoComponents?.Icon?.LocalIcon || window.FitoComponents?.LocalIcon;
  if (!REAB || !LocalIcon) {
    (window.notificar || console.error)("Faltan dependencias de la vista (REAB o FitoComponents).", "error");
    return () => {};
  }
  const { str, up, fmt, notify, publicError } = REAB.util;

  /** Nombre de la vista en la bitácora de rendimiento. */
  const VIEW = "ReabastecimientoSolicitud";

  /** Traza de montaje: se cierra cuando las bodegas ya están disponibles. */
  const mountTrace = REAB.perf.begin("SOLICITUD_VISTA_MONTADA", { view: VIEW, type: "CARGA" });

  /** Bodegas de piso admitidas (ZONA 1..5 de UBICACIONES_SURTIDO). */
  const SALES_FLOOR_IDS = ["B1", "B2", "B3", "MO", "CU"];

  /** Tiempo máximo de espera de la creación antes de regresar al listado. */
  const CREATE_TIMEOUT_MS = 45000;

  /** Tiempo máximo de la consulta de excedentes. */
  const LOAD_TIMEOUT_MS = 25000;

  /** Orden natural (B1-2 antes que B1-10). */
  const natural = (a, b) => up(a).localeCompare(up(b), "es-MX", { numeric: true, sensitivity: "base" });

  // ==========================================================================
  // 2. TRANSFORMACIONES PURAS
  // ==========================================================================

  /**
   * Consolida las filas del servidor (una por SKU + ubicación de consumo +
   * IDUNICO) en una fila por SKU + ubicación de consumo, conservando la
   * cantidad de cada caja y el resumen por bodega física de excedente.
   *
   * @param {!Array<!Object>} source Registros de getExcedentesSolicitudManual.
   * @return {!Array<!Object>} Filas listas para la tabla del rondín.
   */
  function consolidateRows(source) {
    const groups = new Map();
    (Array.isArray(source) ? source : []).forEach((row) => {
      const code = up(row?.codigo);
      const supply = up(row?.ubicacionSurtido);
      const id = up(row?.idUnico);
      if (!code || !supply || !id) return;

      const key = `${code}|${supply}`;
      if (!groups.has(key)) {
        groups.set(key, {
          codigo: code,
          descripcion: up(row.descripcion),
          ubicacionSurtido: supply,
          bodegaSurtido: up(row.bodegaSurtido),
          areaSuministro: up(row.areaSuministro),
          boxes: new Map(),
          warehouses: new Map()
        });
      }
      const group = groups.get(key);
      if (group.boxes.has(id)) return; // Un IDUNICO cuenta una sola vez.

      const quantity = Number(row.cantidadIdUnico || 0);
      const physicalWarehouse = up(row.bodegaExcedente) || "SIN BODEGA";
      group.boxes.set(id, { idUnico: id, cantidad: quantity, bodega: physicalWarehouse });

      if (!group.warehouses.has(physicalWarehouse)) {
        group.warehouses.set(physicalWarehouse, { bodega: physicalWarehouse, cajas: 0, piezas: 0 });
      }
      const summary = group.warehouses.get(physicalWarehouse);
      summary.cajas += 1;
      summary.piezas += quantity;
    });

    return [...groups.values()].map((group) => {
      const boxes = [...group.boxes.values()].sort((a, b) => b.cantidad - a.cantidad || natural(a.idUnico, b.idUnico));
      return {
        codigo: group.codigo,
        descripcion: group.descripcion,
        ubicacionSurtido: group.ubicacionSurtido,
        bodegaSurtido: group.bodegaSurtido,
        areaSuministro: group.areaSuministro,
        cajas: boxes,
        totalCajas: boxes.length,
        cantidadTotal: boxes.reduce((sum, box) => sum + box.cantidad, 0),
        resumenBodegas: [...group.warehouses.values()].sort((a, b) => natural(a.bodega, b.bodega))
      };
    });
  }

  /** Frase descriptiva: "una caja con 1,000 y otra caja con 500". */
  function buildBoxSentence(boxes) {
    if (!boxes.length) return "Sin cajas";
    const labels = boxes.map((box, index) => `${index === 0 ? "una" : "otra"} caja con ${fmt(box.cantidad)}`);
    if (labels.length === 1) return labels[0];
    return `${labels.slice(0, -1).join(", ")} y ${labels.at(-1)}`;
  }

  // ==========================================================================
  // 3. COMPONENTE PRINCIPAL
  // ==========================================================================

  function View() {
    /** Catálogo de usuarios del bootstrap del Shell. */
    const users = useMemo(() => REAB.user.catalog(), []);

    // ── Estado ──────────────────────────────────────────────────────────────
    const [warehouses, setWarehouses] = useState([]);
    const [user, setUser] = useState(() => REAB.user.get());
    const [warehouse, setWarehouse] = useState("");
    const [area, setArea] = useState("");
    const [rows, setRows] = useState([]);
    /** Selección: Map código → {codigo, ubicacionSurtido} (un SKU por solicitud). */
    const [selected, setSelected] = useState(new Map());
    const [sortDirection, setSortDirection] = useState("ASC");
    const [loadingBootstrap, setLoadingBootstrap] = useState(true);
    const [loading, setLoading] = useState(false);
    const [creating, setCreating] = useState(false);
    /** true cuando otro usuario cambió datos después de cargar la tabla. */
    const [stale, setStale] = useState(false);
    /**
     * Fecha (ISO) de lectura de UBICACIONES_SURTIDO y CATALOGO que respalda la
     * vista. El servidor los guarda en caché ~2 minutos; "Actualizar catálogos"
     * los relee al instante (útil tras cargar layouts nuevos).
     */
    const [catalogsAt, setCatalogsAt] = useState("");
    const [refreshingCatalogs, setRefreshingCatalogs] = useState(false);

    const sequence = useRef(0);
    const mounted = useRef(true);
    const rowsLoaded = useRef(false);
    useEffect(() => { rowsLoaded.current = rows.length > 0; }, [rows]);

    /** Áreas de suministro de la bodega elegida. */
    const areaOptions = useMemo(() => (warehouses.find((item) => item.id === warehouse)?.areas) || [], [warehouses, warehouse]);

    // ── Carga de bodegas y áreas ────────────────────────────────────────────
    /**
     * Consulta las bodegas de piso y sus áreas (bootstrap del rondín).
     * @param {boolean=} forceRefresh true = relee catálogos sin caché. Se compara
     *     estrictamente porque onClick entrega el evento como argumento.
     */
    const loadWarehouses = useCallback(async (forceRefresh) => {
      const force = forceRefresh === true;
      const trace = REAB.perf.begin("SOLICITUD_CARGAR_BODEGAS", { view: VIEW, type: "CONSULTA", meta: { forceRefresh: force } });
      setLoadingBootstrap(true);
      try {
        const payload = force ? { bodega: "", forceRefresh: true } : "";
        const { data } = await REAB.rpc("ReabastecimientoController_getExcedentesSolicitudManual", payload, { trace, keepOpen: true });
        if (!mounted.current) return;
        const list = (Array.isArray(data?.bodegasPisoVenta) ? data.bodegasPisoVenta : [])
          .map((item) => ({
            id: up(item.id),
            label: str(item.label) || up(item.id),
            areas: (Array.isArray(item.areas) ? item.areas : []).map(up).filter(Boolean)
          }))
          .filter((item) => SALES_FLOOR_IDS.includes(item.id));
        setWarehouses(list);
        setCatalogsAt(str(data?.catalogosAl));
        trace.set({ bodegas: list.length, catalogosEnCache: Boolean(data?.catalogosEnCache) });
        trace.endAfterPaint("ok");
        mountTrace.endAfterPaint("ok");
        if (!list.length) notify("No existen bodegas de piso configuradas.", "warning", 4500, { title: "Sin bodegas", sound: true });
        return true;
      } catch (error) {
        trace.end("error", { error });
        if (!mountTrace.ended) mountTrace.end("error", { error });
        if (mounted.current) {
          setWarehouses([]);
          notify(publicError(error), "error", 5000, { title: "No se cargaron las bodegas", sound: true });
        }
      } finally {
        if (mounted.current) setLoadingBootstrap(false);
      }
      return false;
    }, []);

    // ── Montaje y tiempo real ───────────────────────────────────────────────
    useEffect(() => {
      mounted.current = true;
      loadWarehouses();

      /* Aviso de cambios: solo si ya hay excedentes cargados en la tabla. */
      const unsubscribe = REAB.sync.subscribe(VIEW, {
        ids: () => [],
        onChange: () => { if (rowsLoaded.current) setStale(true); }
      });

      return () => {
        mounted.current = false;
        sequence.current += 1;
        unsubscribe();
        if (!mountTrace.ended) mountTrace.end("cancelled", { meta: { reason: "view_unmounted" } });
      };
    }, [loadWarehouses]);

    /** Descarta la tabla y la selección al cambiar usuario, bodega o área. */
    const invalidate = () => {
      sequence.current += 1;
      setRows([]);
      setSelected(new Map());
      setStale(false);
    };

    // ── Carga de excedentes del área ────────────────────────────────────────
    /**
     * Consulta los excedentes de la bodega y filtra el área elegida.
     * La traza cubre consulta, consolidación y render de la tabla.
     */
    const loadRows = async (forceRefresh) => {
      const force = forceRefresh === true;
      if (!users.includes(up(user))) { notify("Selecciona un solicitante registrado.", "warning"); return; }
      if (!warehouse) { notify("Selecciona una bodega de piso.", "warning"); return; }
      if (!area) { notify("Selecciona el área de suministro que vas a revisar.", "warning"); return; }

      REAB.user.set(user);
      const current = ++sequence.current;
      const trace = REAB.perf.begin("SOLICITUD_CARGAR_EXCEDENTES", { view: VIEW, type: "CONSULTA", meta: { bodega: warehouse, area, forceRefresh: force } });
      setLoading(true);
      setSelected(new Map());
      setStale(false);
      try {
        const payload = force ? { bodega: warehouse, forceRefresh: true } : warehouse;
        const { data } = await REAB.rpc("ReabastecimientoController_getExcedentesSolicitudManual", payload, { trace, keepOpen: true, timeoutMs: LOAD_TIMEOUT_MS });
        if (!mounted.current || sequence.current !== current) {
          trace.end("cancelled", { meta: { stale: true } });
          return;
        }
        const areaRows = (Array.isArray(data?.registros) ? data.registros : []).filter((row) => up(row?.areaSuministro) === area);
        const consolidated = consolidateRows(areaRows);
        trace.mark("CONSOLIDATED", { registros: areaRows.length, filas: consolidated.length });
        setRows(consolidated);
        if (data?.catalogosAl) setCatalogsAt(str(data.catalogosAl));
        trace.set({ filas: consolidated.length, registros: areaRows.length, catalogosEnCache: Boolean(data?.catalogosEnCache) });
        trace.endAfterPaint("ok");
        notify(
          consolidated.length ? `${consolidated.length} SKU con excedentes en ${area}.` : `No hay SKU con excedentes disponibles en ${area}.`,
          consolidated.length ? "success" : "warning",
          2200,
          { title: "Excedentes cargados" }
        );
      } catch (error) {
        if (!trace.ended) trace.end("error", { error });
        if (mounted.current && sequence.current === current) notify(publicError(error), "error", 5000, { title: "Error de consulta", sound: true });
      } finally {
        if (mounted.current && sequence.current === current) setLoading(false);
      }
    };

    /**
     * Relee UBICACIONES_SURTIDO y CATALOGO sin caché. Se usa después de cargar
     * layouts o ubicaciones nuevas. Si ya hay una tabla cargada, la vuelve a
     * consultar (la caché recién reconstruida sirve esa segunda lectura).
     */
    const refreshCatalogs = async () => {
      if (refreshingCatalogs || creating) return;
      setRefreshingCatalogs(true);
      try {
        const ok = await loadWarehouses(true);
        if (!ok || !mounted.current) return;
        notify("Bodegas, áreas y catálogo releídos.", "success", 2000, { title: "Catálogos actualizados" });
        if (rowsLoaded.current && warehouse && area) await loadRows();
      } finally {
        if (mounted.current) setRefreshingCatalogs(false);
      }
    };

    /** Hora local corta de la lectura de catálogos ("" si no se conoce). */
    const catalogsClock = useMemo(() => {
      const date = catalogsAt ? new Date(catalogsAt) : null;
      return date && !isNaN(date.getTime())
        ? date.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" })
        : "";
    }, [catalogsAt]);

    // ── Selección y orden ───────────────────────────────────────────────────
    /** Filas ordenadas por ubicación de consumo y código. */
    const ordered = useMemo(() => [...rows].sort((a, b) => {
      const order = natural(a.ubicacionSurtido, b.ubicacionSurtido);
      return (sortDirection === "ASC" ? order : -order) || natural(a.codigo, b.codigo);
    }), [rows, sortDirection]);

    const totalSkus = useMemo(() => new Set(rows.map((row) => row.codigo)).size, [rows]);

    /** Marca o desmarca un SKU (una sola ubicación de consumo por SKU). */
    const toggle = (item) => setSelected((previous) => {
      const next = new Map(previous);
      const current = next.get(item.codigo);
      if (current?.ubicacionSurtido === item.ubicacionSurtido) next.delete(item.codigo);
      else next.set(item.codigo, { codigo: item.codigo, ubicacionSurtido: item.ubicacionSurtido });
      return next;
    });

    /** Borrado masivo de la selección (proceso 1, punto 9.1). */
    const clearSelection = () => {
      const trace = REAB.perf.begin("SOLICITUD_LIMPIAR_SELECCION", { view: VIEW, type: "UI", meta: { seleccionados: selected.size } });
      setSelected(new Map());
      trace.endAfterPaint("ok");
    };

    /** Cambia el orden de la tabla y mide el re-render. */
    const toggleSort = () => {
      const trace = REAB.perf.begin("SOLICITUD_ORDENAR", { view: VIEW, type: "UI", meta: { filas: rows.length } });
      setSortDirection((value) => (value === "ASC" ? "DESC" : "ASC"));
      trace.endAfterPaint("ok");
    };

    // ── Creación ────────────────────────────────────────────────────────────
    /** Navega al listado y solicita una recarga autoritativa. */
    const navigateToList = (idSolicitud = "") => {
      window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || {};
      window.DATA_ALMACEN_CACHE.reabastecimientoRefreshRequired = true;
      window.DATA_ALMACEN_CACHE.reabastecimientoUltimaSolicitud = idSolicitud;
      if (typeof window.irAVistaShell === "function") {
        window.irAVistaShell("Reabastecimiento", "Reabastecimiento", {
          REABASTECIMIENTO_REFRESH_REQUIRED: true,
          REABASTECIMIENTO_ULTIMA_SOLICITUD: idSolicitud
        });
      }
    };

    /**
     * CREAR SOLICITUD. Si el servidor tarda más de CREATE_TIMEOUT_MS se regresa
     * al listado para verificar, sin reintentar automáticamente (evita folios
     * duplicados).
     */
    const create = async () => {
      if (creating || !selected.size) return;
      const trace = REAB.perf.begin("SOLICITUD_CREAR", { view: VIEW, type: "ACCION", meta: { skus: selected.size, bodega: warehouse, area } });
      setCreating(true);
      try {
        const payload = {
          solicitante: up(user),
          bodega: warehouse,
          areaSuministro: area,
          partidas: [...selected.values()].map((item) => ({ codigo: item.codigo, ubicacion: item.ubicacionSurtido }))
        };
        const { data } = await REAB.rpc("ReabastecimientoController_crearSolicitud", payload, { trace, keepOpen: true, timeoutMs: CREATE_TIMEOUT_MS });
        const idSolicitud = str(data?.idSolicitud);
        trace.idSolicitud = idSolicitud;
        trace.end("ok");
        notify(`Solicitud ${idSolicitud} creada correctamente.`, "success", 2600, { title: "Solicitud creada", sound: true });
        navigateToList(idSolicitud);
      } catch (error) {
        if (error?.code === "REAB_CLIENT_TIMEOUT") {
          notify("La respuesta tardó demasiado. Regresaremos al listado para verificar antes de permitir otro intento.", "warning", 6500, { title: "Resultado por confirmar", sound: true });
          navigateToList("");
        } else {
          notify(publicError(error), "error", 5000, { title: "No se creó la solicitud", sound: true });
        }
      } finally {
        if (mounted.current) setCreating(false);
      }
    };

    // ── Render ──────────────────────────────────────────────────────────────
    return (
      <div className="rs-page">
        <section className="rs-workspace">

          {/* Encabezado: identidad, métricas del rondín y acciones */}
          <header className="rs-header">
            <div className="rs-identity">
              <div className="rs-icon"><LocalIcon name="clipboard-plus" size={23} /></div>
              <div>
                <p className="rs-eyebrow">Rondín de reabastecimiento</p>
                <h2 className="rs-title">NUEVA SOLICITUD</h2>
                <p className="rs-subtitle">SKU del área con excedentes disponibles, por bodega y caja.</p>
              </div>
            </div>
            <div className="rs-metrics">
              <div className="rs-metric"><div className="rs-metric-value">{totalSkus}</div><div className="rs-metric-label">SKU rellenables</div></div>
              <div className="rs-metric green"><div className="rs-metric-value">{selected.size}</div><div className="rs-metric-label">Seleccionados</div></div>
              <div className="rs-metric amber"><div className="rs-metric-value">{Math.max(0, totalSkus - selected.size)}</div><div className="rs-metric-label">Omitidos</div></div>
              <div className="rs-metric red">
                <button className="rs-clear" onClick={clearSelection} disabled={!selected.size || creating}><LocalIcon name="eraser" size={15} />Limpiar selección</button>
              </div>
            </div>
            <div className="rs-actions">
              <button className="rs-header-btn" onClick={() => !creating && window.irAVistaShell?.("Reabastecimiento", "Reabastecimiento")}><LocalIcon name="arrow-left" size={15} />Volver</button>
              <button className="rs-header-btn primary" onClick={create} disabled={creating || !selected.size}><LocalIcon name="send" size={15} />{creating ? "Creando..." : "Crear solicitud"}</button>
            </div>
          </header>

          {/* Controles: solicitante, bodega, área y carga */}
          <div className="rs-controls">
            <label className="rs-field">
              <span className="rs-label">Solicitante</span>
              <input
                className="rs-input"
                list="rs-users"
                value={user}
                onChange={(event) => { setUser(event.target.value.toUpperCase()); invalidate(); }}
                placeholder="Selecciona un solicitante"
                disabled={creating}
              />
              <datalist id="rs-users">{users.map((name) => <option key={name} value={name} />)}</datalist>
            </label>
            <label className="rs-field">
              <span className="rs-label">Bodega de piso de venta</span>
              <select className="rs-select" value={warehouse} onChange={(event) => { setWarehouse(event.target.value); setArea(""); invalidate(); }} disabled={loadingBootstrap || creating || !warehouses.length}>
                <option value="">{loadingBootstrap ? "Cargando bodegas..." : warehouses.length ? "Selecciona una bodega" : "Sin bodegas disponibles"}</option>
                {warehouses.map((item) => <option key={item.id} value={item.id}>{item.label}</option>)}
              </select>
              {!loadingBootstrap && !warehouses.length && <button className="rs-btn" onClick={loadWarehouses}>Reintentar bodegas</button>}
            </label>
            <label className="rs-field">
              <span className="rs-label">Área de suministro</span>
              <select className="rs-select" value={area} onChange={(event) => { setArea(event.target.value); invalidate(); }} disabled={!warehouse || creating || !areaOptions.length}>
                <option value="">{!warehouse ? "Primero elige la bodega" : areaOptions.length ? "Selecciona un área" : "Sin áreas registradas"}</option>
                {areaOptions.map((item) => <option key={item} value={item}>{item}</option>)}
              </select>
            </label>
            <button className="rs-btn primary" onClick={loadRows} disabled={loading || creating || !user || !warehouse || !area}>
              <LocalIcon name="database" size={16} />{loading ? "Consultando..." : "Cargar excedentes"}
            </button>
            <div className="rs-catalogs">
              <button
                className="rs-btn"
                onClick={refreshCatalogs}
                disabled={refreshingCatalogs || loadingBootstrap || loading || creating}
                title="Relee UBICACIONES_SURTIDO y CATALOGO sin usar la caché de 2 minutos"
              >
                <LocalIcon name="refresh-cw" size={15} />{refreshingCatalogs ? "Actualizando..." : "Actualizar catálogos"}
              </button>
              <small>{catalogsClock ? `Catálogos al ${catalogsClock}` : "Catálogos sin leer"}</small>
            </div>
          </div>

          {/* Aviso de cambios en tiempo real */}
          {stale && (
            <div className="rs-stale">
              <LocalIcon name="bell-ring" size={16} />
              <span>Otro usuario modificó excedentes o solicitudes. Actualiza para ver las cantidades vigentes (se reiniciará tu selección).</span>
              <button className="rs-btn" onClick={loadRows} disabled={loading || creating}>Actualizar excedentes</button>
            </div>
          )}

          {/* Tabla del rondín */}
          <div className="rs-content">
            <div className="rs-table-wrap rs-scroll">
              <table className="rs-table">
                <thead>
                  <tr>
                    <th>SKU / descripción</th>
                    <th><button className="rs-sort" onClick={toggleSort}><span>Ubicación de consumo</span><span>{sortDirection === "ASC" ? "A-Z ↑" : "Z-A ↓"}</span></button></th>
                    <th>Excedentes por bodega</th>
                    <th>Cantidad por caja</th>
                  </tr>
                </thead>
                <tbody>
                  {ordered.map((item, index) => {
                    const isSelected = selected.get(item.codigo)?.ubicacionSurtido === item.ubicacionSurtido;
                    return (
                      <tr key={`${item.codigo}|${item.ubicacionSurtido}|${index}`} className={`rs-row ${isSelected ? "selected" : ""}`} onClick={() => toggle(item)}>
                        <td>
                          <div className="rs-product">
                            <input className="rs-check" type="checkbox" checked={Boolean(isSelected)} onChange={() => toggle(item)} onClick={(event) => event.stopPropagation()} disabled={creating} />
                            <div>
                              <span className="rs-code">{item.codigo}</span>
                              <span className="rs-description">{item.descripcion || "SIN DESCRIPCIÓN"}</span>
                            </div>
                          </div>
                        </td>
                        <td>
                          <span className="rs-location">{item.ubicacionSurtido}</span>
                          <span className="rs-secondary">
                            {warehouses.find((w) => w.id === item.bodegaSurtido)?.label || item.bodegaSurtido}
                            {item.areaSuministro ? ` · ${item.areaSuministro}` : ""}
                          </span>
                        </td>
                        <td>
                          <div className="rs-warehouse-list">
                            {item.resumenBodegas.map((summary) => (
                              <div key={summary.bodega} className="rs-warehouse">
                                <span>{summary.bodega}</span>
                                <strong>{summary.cajas} {summary.cajas === 1 ? "CAJA" : "CAJAS"}</strong>
                              </div>
                            ))}
                          </div>
                        </td>
                        <td>
                          <span className="rs-total">{fmt(item.cantidadTotal)}</span>
                          <span className="rs-box-summary">{fmt(item.cantidadTotal)} piezas en {item.totalCajas} {item.totalCajas === 1 ? "caja" : "cajas"}, {buildBoxSentence(item.cajas)}</span>
                          <div className="rs-box-breakdown">
                            {item.cajas.map((box, boxIndex) => <span key={box.idUnico} className="rs-box-pill">Caja {boxIndex + 1}: {fmt(box.cantidad)}</span>)}
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              {loading && (
                <div className="rs-empty"><div className="w-10 h-10 border-4 border-slate-100 border-t-red-600 rounded-full animate-spin"></div><b>CONSOLIDANDO EXCEDENTES...</b></div>
              )}
              {!loading && !rows.length && (
                <div className="rs-empty"><LocalIcon name="package-search" size={32} /><b>SELECCIONA SOLICITANTE, BODEGA Y ÁREA</b><span>Carga los excedentes del área para iniciar el rondín.</span></div>
              )}
            </div>
          </div>
        </section>
      </div>
    );
  }

  // ==========================================================================
  // 4. MONTAJE EN EL SHELL
  // ==========================================================================

  const target = document.getElementById("render-reabastecimiento-solicitud");
  if (!target) {
    notify("No se encontró el contenedor de la vista.", "error");
    mountTrace.end("error", { error: "Contenedor no encontrado" });
    return () => {};
  }
  if (window.__REABASTECIMIENTO_SOLICITUD_ROOT__) {
    try { window.__REABASTECIMIENTO_SOLICITUD_ROOT__.unmount(); } catch (_) { /* raíz previa ya desmontada */ }
  }
  window.__REABASTECIMIENTO_SOLICITUD_ROOT__ = ReactDOM.createRoot(target);
  window.__REABASTECIMIENTO_SOLICITUD_ROOT__.render(<View />);

  /** Limpieza que el Shell ejecuta al salir de la vista. */
  return () => {
    if (window.__REABASTECIMIENTO_SOLICITUD_ROOT__) {
      try { window.__REABASTECIMIENTO_SOLICITUD_ROOT__.unmount(); } catch (_) { /* sin acción */ }
      window.__REABASTECIMIENTO_SOLICITUD_ROOT__ = null;
    }
  };
};
window.initVista = window.cargar_ReabastecimientoSolicitud;
</script>
