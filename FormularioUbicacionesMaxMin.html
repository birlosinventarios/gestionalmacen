<script>
  /**
   * FormularioUbicacionesMaxMin.html
   *
   * Vista operativa para completar la parametrización física de productos en
   * UBICACIONES_MAXMIN.
   *
   * FLUJO
   * 1. El usuario selecciona a la persona responsable, sin filtrar por rol.
   * 2. Selecciona un código pendiente desde un datalist.
   * 3. El sistema carga la descripción y el contexto de ubicación.
   * 4. Captura EXISTENCIA y PORCENTAJE de ocupación.
   * 5. Si PORCENTAJE es 100, MAXIMO se habilita; si queda vacío, adopta EXISTENCIA.
   * 6. Si PORCENTAJE es menor a 100, MAXIMO se calcula como:
   *      (EXISTENCIA / PORCENTAJE) * 100
   *    y se redondea a la decena más cercana.
   * 7. El servidor registra FECHA, HORA y el USUARIO seleccionado.
   *
   * CONTRATO DE BOOTSTRAP ESPERADO
   * {
   *   usuarios: [{ idUsuarios, nombre, rol }],
   *   registrosPendientes: [{
   *     numFila, codigo, descripcion, bodega, ubicacion, existencia, porcentaje,
   *     maximo, minimo, zonaBodega, zonaAbastecimiento, zonaNivel
   *   }]
   * }
   *
   * CONTROLADORES
   * - FormularioUbicacionesMaxMinController_getBootstrap().
   * - FormularioUbicacionesMaxMinController_guardar(payload).
   *
   * CONTRATOS GLOBALES
   * - window.cargar_FormularioUbicacionesMaxMin().
   * - window.initVista.
   * - window.__FORMULARIO_UBICACIONES_MAXMIN_ROOT__.
   *
   * @author Sigifredo de la Cruz Ramos
   * @version FORMULARIO-UBICACIONES-MAXMIN-2026-11-06-01
   */
</script>

<div id="render-ubicaciones-maxmin"></div>

<script type="text/babel">
  window.cargar_FormularioUbicacionesMaxMin = () => {
    const { useEffect, useMemo, useRef, useState } = React;

    const notify = (message, type = "info", timer = 2600, options = {}) => {
      const fn = window.notificar || window.lanzarNotificacion;
      if (typeof fn === "function") fn(message, type, timer, options);
    };

    const textUpper = value => String(value ?? "").trim().toUpperCase();
    const integerText = value => String(value ?? "").replace(/[^0-9]/g, "");
    const numberOrZero = value => {
      const number = Number(value);
      return Number.isFinite(number) ? number : 0;
    };
    const roundToTen = value => Math.round(Number(value || 0) / 10) * 10;

    const initialForm = Object.freeze({
      usuario: "",
      codigo: "",
      existencia: "",
      porcentaje: "",
      maximo: ""
    });

    const FormularioUbicacionesMaxMin = () => {
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [users, setUsers] = useState([]);
      const [pendingRecords, setPendingRecords] = useState([]);
      const [form, setForm] = useState({ ...initialForm });
      const codeInputRef = useRef(null);

      const recordMap = useMemo(() => {
        return pendingRecords.reduce((map, item) => {
          const code = textUpper(item.codigo);
          if (code && !map[code]) map[code] = item;
          return map;
        }, {});
      }, [pendingRecords]);

      const selectedRecord = useMemo(
        () => recordMap[textUpper(form.codigo)] || null,
        [recordMap, form.codigo]
      );

      const percentage = numberOrZero(form.porcentaje);
      const existence = numberOrZero(form.existencia);
      const maximumEditable = percentage === 100;

      const calculatedMaximum = useMemo(() => {
        if (!existence || !percentage) return 0;
        if (percentage === 100) {
          return form.maximo === "" ? existence : numberOrZero(form.maximo);
        }
        if (percentage > 0 && percentage < 100) {
          return roundToTen((existence / percentage) * 100);
        }
        return 0;
      }, [existence, percentage, form.maximo]);

      useEffect(() => {
        setLoading(true);
        google.script.run
          .withSuccessHandler(data => {
            const source = data || {};
            setUsers(Array.isArray(source.usuarios) ? source.usuarios : []);
            setPendingRecords(
              Array.isArray(source.registrosPendientes)
                ? source.registrosPendientes
                : []
            );
            setLoading(false);
            setTimeout(() => codeInputRef.current?.focus(), 0);
          })
          .withFailureHandler(error => {
            console.error("Error inicializando FormularioUbicacionesMaxMin:", error);
            setLoading(false);
            notify(
              error?.message || "No se pudo cargar el formulario.",
              "error",
              4800,
              { title: "Error de carga", sound: true }
            );
          })
          .FormularioUbicacionesMaxMinController_getBootstrap();
      }, []);

      const handleCode = value => {
        const code = textUpper(value);
        setForm(previous => ({
          ...previous,
          codigo: code,
          existencia: "",
          porcentaje: "",
          maximo: ""
        }));
      };

      const handlePercentage = value => {
        const clean = integerText(value).slice(0, 3);
        const limited = clean === "" ? "" : String(Math.min(100, Number(clean)));
        setForm(previous => ({
          ...previous,
          porcentaje: limited,
          maximo: Number(limited) === 100 ? previous.maximo : ""
        }));
      };

      const validate = () => {
        if (!form.usuario) return "Selecciona un usuario responsable.";
        if (!selectedRecord) return "Selecciona un código pendiente válido.";
        if (form.existencia === "") return "Captura la existencia actual.";
        if (existence < 0) return "La existencia no puede ser negativa.";
        if (!percentage || percentage < 1 || percentage > 100) {
          return "El porcentaje debe estar entre 1 y 100.";
        }
        if (!calculatedMaximum || calculatedMaximum < existence) {
          return "El máximo calculado debe ser mayor o igual a la existencia.";
        }
        return "";
      };

      const save = event => {
        event.preventDefault();
        const validation = validate();
        if (validation) {
          notify(validation, "warning", 3600, {
            title: "Validación pendiente",
            sound: true
          });
          return;
        }

        const payload = {
          numFila: selectedRecord.numFila,
          usuario: form.usuario,
          codigo: selectedRecord.codigo,
          descripcion: selectedRecord.descripcion,
          bodega: selectedRecord.bodega,
          ubicacion: selectedRecord.ubicacion,
          existencia: existence,
          porcentaje: percentage,
          maximo: calculatedMaximum,
          minimo: numberOrZero(selectedRecord.minimo),
          zonaBodega: selectedRecord.zonaBodega || "",
          zonaAbastecimiento: selectedRecord.zonaAbastecimiento || "",
          zonaNivel: selectedRecord.zonaNivel || ""
        };

        setSaving(true);
        google.script.run
          .withSuccessHandler(() => {
            setSaving(false);
            setPendingRecords(previous =>
              previous.filter(item => item.numFila !== selectedRecord.numFila)
            );
            setForm(previous => ({ ...initialForm, usuario: previous.usuario }));
            notify("Ubicación parametrizada correctamente.", "success", 2800, {
              title: "Registro guardado",
              sound: true
            });
            setTimeout(() => codeInputRef.current?.focus(), 0);
          })
          .withFailureHandler(error => {
            console.error("Error guardando ubicación MaxMin:", error);
            setSaving(false);
            notify(
              error?.message || "No se pudo guardar el registro.",
              "error",
              5200,
              { title: "Error al guardar", sound: true }
            );
          })
          .FormularioUbicacionesMaxMinController_actualizar(
            selectedRecord.numFila,
            payload
          );
      };

      return (
        <div className="umm-shell">
          <section className="umm-form-panel">
            <header>
              <div className="umm-title">Ubicaciones MaxMin</div>
              <div className="umm-subtitle">
                Captura de existencia y capacidad física del contenedor
              </div>
            </header>

            <form className="umm-grid" onSubmit={save}>
              <div className="umm-field umm-span-2">
                <label className="umm-label">Usuario responsable</label>
                <select
                  className="umm-select"
                  disabled={loading || saving}
                  value={form.usuario}
                  onChange={event =>
                    setForm(previous => ({
                      ...previous,
                      usuario: event.target.value
                    }))
                  }
                >
                  <option value="">Selecciona un usuario</option>
                  {users.map((user, index) => {
                    const name = user.nombre || user.NOMBRE || "";
                    const id = user.idUsuarios || user.idusuarios || user.IDUSUARIOS || "";
                    const role = user.rol || user.ROL || "";
                    return (
                      <option key={`${id}-${index}`} value={name}>
                        {name}{role ? ` · ${role}` : ""}
                      </option>
                    );
                  })}
                </select>
                <span className="umm-helper">
                  Se muestran todos los usuarios, independientemente de su rol.
                </span>
              </div>

              <div className="umm-field umm-span-2">
                <label className="umm-label">
                  Código pendiente ({pendingRecords.length})
                </label>
                <input
                  ref={codeInputRef}
                  className="umm-input umm-mono"
                  list="umm-codigos-pendientes"
                  disabled={loading || saving}
                  value={form.codigo}
                  placeholder={loading ? "Cargando códigos..." : "Selecciona un código"}
                  onChange={event => handleCode(event.target.value)}
                />
                <datalist id="umm-codigos-pendientes">
                  {pendingRecords.map(item => (
                    <option
                      key={`${item.numFila}-${item.codigo}`}
                      value={item.codigo}
                    >
                      {item.descripcion || "SIN DESCRIPCIÓN"}
                    </option>
                  ))}
                </datalist>
                <span className="umm-helper">
                  Solo aparecen registros que no tienen completos FECHA, HORA y USUARIO.
                </span>
              </div>

              <div className="umm-field">
                <label className="umm-label">Existencia actual</label>
                <input
                  className="umm-input umm-mono"
                  inputMode="numeric"
                  disabled={!selectedRecord || saving}
                  value={form.existencia}
                  placeholder="Ej. 250"
                  onChange={event =>
                    setForm(previous => ({
                      ...previous,
                      existencia: integerText(event.target.value),
                      maximo:
                        numberOrZero(previous.porcentaje) === 100
                          ? previous.maximo
                          : ""
                    }))
                  }
                />
              </div>

              <div className="umm-field">
                <label className="umm-label">Capacidad ocupada estimada</label>
                <div className="umm-percent-wrap">
                  <input
                    className="umm-input umm-mono"
                    inputMode="numeric"
                    disabled={!selectedRecord || saving}
                    value={form.porcentaje}
                    placeholder="1 a 100"
                    onChange={event => handlePercentage(event.target.value)}
                  />
                  <span className="umm-percent-sign">%</span>
                </div>
              </div>

              <div className="umm-field umm-span-2">
                <label className="umm-label">Máximo estimado</label>
                <input
                  className="umm-input umm-mono"
                  inputMode="numeric"
                  disabled={!selectedRecord || saving || !maximumEditable}
                  readOnly={!maximumEditable}
                  value={
                    maximumEditable
                      ? form.maximo
                      : calculatedMaximum || ""
                  }
                  placeholder={
                    maximumEditable
                      ? "Opcional: vacío toma la existencia"
                      : "Calculado automáticamente"
                  }
                  onChange={event =>
                    setForm(previous => ({
                      ...previous,
                      maximo: integerText(event.target.value)
                    }))
                  }
                />
                <span className="umm-helper">
                  {maximumEditable
                    ? "Con 100%, puedes capturar el máximo. Si queda vacío se usará la existencia."
                    : "Con menos de 100%, el máximo se calcula y redondea a la decena más cercana."}
                </span>
              </div>

              <div className="umm-span-2">
                <button className="umm-btn" disabled={loading || saving || !selectedRecord}>
                  {saving ? "Guardando..." : "Guardar parametrización"}
                </button>
              </div>
            </form>
          </section>

          <aside className="umm-context-panel">
            {!selectedRecord ? (
              <div className="umm-empty">
                <strong>Selecciona un código pendiente</strong>
                <p>Se mostrarán la ubicación y los parámetros físicos actuales.</p>
              </div>
            ) : (
              <div className="umm-card">
                <div className="umm-card-head">
                  <div className="umm-code umm-mono">{selectedRecord.codigo}</div>
                  <div className="umm-description">
                    {selectedRecord.descripcion || "SIN DESCRIPCIÓN"}
                  </div>
                </div>
                <div className="umm-card-body">
                  {[
                    ["Bodega", selectedRecord.bodega],
                    ["Ubicación", selectedRecord.ubicacion],
                    ["Zona bodega", selectedRecord.zonaBodega],
                    ["Zona abastecimiento", selectedRecord.zonaAbastecimiento],
                    ["Zona nivel", selectedRecord.zonaNivel],
                    ["Mínimo actual", selectedRecord.minimo]
                  ].map(([label, value]) => (
                    <div className="umm-stat" key={label}>
                      <div className="umm-stat-label">{label}</div>
                      <div className="umm-stat-value">{value || "SIN DATO"}</div>
                    </div>
                  ))}
                </div>
                <div className="umm-metric" style={{ padding: "0 22px 22px" }}>
                  <div style={{ background: "#eff6ff", color: "#1d4ed8" }}>
                    <span>Existencia</span><b>{existence || 0}</b>
                  </div>
                  <div style={{ background: "#fff7ed", color: "#c2410c" }}>
                    <span>Ocupación</span><b>{percentage || 0}%</b>
                  </div>
                  <div style={{ background: "#ecfdf5", color: "#047857" }}>
                    <span>Máximo</span><b>{calculatedMaximum || 0}</b>
                  </div>
                </div>
              </div>
            )}
          </aside>
        </div>
      );
    };

    const rootElement = document.getElementById("render-ubicaciones-maxmin");
    if (!rootElement) {
      console.error("No se encontró #render-ubicaciones-maxmin.");
      return;
    }

    if (window.__FORMULARIO_UBICACIONES_MAXMIN_ROOT__) {
      try {
        window.__FORMULARIO_UBICACIONES_MAXMIN_ROOT__.unmount();
      } catch (error) {
        console.warn("No se pudo desmontar la raíz anterior:", error);
      }
    }

    window.__FORMULARIO_UBICACIONES_MAXMIN_ROOT__ = ReactDOM.createRoot(rootElement);
    window.__FORMULARIO_UBICACIONES_MAXMIN_ROOT__.render(
      <FormularioUbicacionesMaxMin />
    );
  };

  window.initVista = window.cargar_FormularioUbicacionesMaxMin;
  console.log(
    "[FormularioUbicacionesMaxMin] initVista definida:",
    typeof window.initVista
  );
</script>
