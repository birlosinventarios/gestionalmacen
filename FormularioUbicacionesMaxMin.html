<script>
  /**
   * FormularioUbicacionesMaxMin.html
   *
   * @fileoverview Vista de captura de existencia y capacidad física para los
   * registros pendientes de UBICACIONES_MAXMIN.
   *
   * La composición visual, jerarquía, distribución, estados vacíos, tarjetas,
   * tipografía, controles, montaje React y comportamiento responsivo siguen el
   * patrón de FormularioDetallesProducto para conservar una experiencia uniforme
   * dentro de APPALMACEN.
   *
   * RESPONSABILIDADES
   * - Cargar usuarios y registros pendientes desde el Controller.
   * - Permitir seleccionar cualquier usuario, sin filtrar por rol.
   * - Mostrar códigos ACTIVO con FECHA, HORA y USUARIO registrados.
   * - Mostrar el código como valor principal y la descripción como texto auxiliar.
   * - Capturar EXISTENCIA y PORCENTAJE de ocupación.
   * - Calcular MAXIMO cuando PORCENTAJE es menor que 100.
   * - Habilitar MAXIMO cuando PORCENTAJE es igual a 100.
   * - Actualizar la fila física seleccionada mediante el Controller.
   * - Retirar de la lista local el registro guardado correctamente.
   * - Administrar el montaje y desmontaje seguro de la raíz React.
   *
   * REGLAS FUNCIONALES
   * - PORCENTAJE admite enteros entre 1 y 100.
   * - Si PORCENTAJE = 100 y MAXIMO no fue editado, MAXIMO = EXISTENCIA.
   * - Durante la edición manual, MAXIMO puede permanecer vacío temporalmente.
   * - Si PORCENTAJE = 100, el usuario puede capturar un MAXIMO menor que
   *   EXISTENCIA para representar material excedente.
   * - Si PORCENTAJE < 100:
   *     MAXIMO = redondearADecena((EXISTENCIA / PORCENTAJE) * 100).
   * - El signo de porcentaje es visual y no puede borrarse.
   * - FECHA y HORA se generan en el servidor.
   * - USUARIO se selecciona en la vista y se valida en el servidor.
   * - La lista desplegable muestra únicamente CODIGO y DESCRIPCION.
   * - Si un código tiene varias filas elegibles, se selecciona de forma
   *   determinista la fila física menor; el guardado continúa usando numFila.
   *
   * DEPENDENCIAS GLOBALES
   * - React y ReactDOM.
   * - Lucide.
   * - google.script.run.
   * - window.DATA_ALMACEN_CACHE.
   * - window.notificar o window.lanzarNotificacion.
   *
   * CONTROLADORES CONSUMIDOS
   * - FormularioUbicacionesMaxMinController_getBootstrap().
   * - FormularioUbicacionesMaxMinController_actualizar(numFila, payload).
   *
   * CONTRATOS GLOBALES EXPUESTOS
   * - window.cargar_FormularioUbicacionesMaxMin().
   * - window.initVista.
   * - window.__FORMULARIO_UBICACIONES_MAXMIN_ROOT__.
   *
   * @author Sigifredo de la Cruz Ramos
   * @version FORMULARIO-UBICACIONES-MAXMIN-2026-11-07-02
   */
</script>

<script type="text/babel">
  window.cargar_FormularioUbicacionesMaxMin = () => {
    const { useEffect, useMemo, useRef, useState } = React;

    const notify_ = (message, type = "info", timer = 2500, options = {}) => {
      const fn = window.notificar || window.lanzarNotificacion;
      if (typeof fn === "function") fn(message, type, timer, options);
    };

    const LocalIcon = ({ name, size = 18, className = "" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (!window.lucide || !iconRef.current) return;
        iconRef.current.innerHTML = "";
        const icon = document.createElement("i");
        icon.setAttribute("data-lucide", String(name || "circle").toLowerCase());
        icon.style.width = `${size}px`;
        icon.style.height = `${size}px`;
        if (className) icon.className = className;
        iconRef.current.appendChild(icon);
        window.lucide.createIcons();
      }, [name, size, className]);
      return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
    };

    const normalizarTexto_ = value => String(value ?? "").trim().toUpperCase();
    const limpiarEntero_ = value => String(value ?? "").replace(/[^0-9]/g, "");
    const toNumberSafe_ = value => {
      const number = Number(value);
      return Number.isFinite(number) ? number : 0;
    };
    const redondearADecena_ = value => Math.round(toNumberSafe_(value) / 10) * 10;

    const FORM_INICIAL = Object.freeze({
      usuario: "",
      codigo: "",
      existencia: "",
      porcentaje: "",
      maximo: ""
    });

    const VistaUbicacionesMaxMin = () => {
      const [cargando, setCargando] = useState(true);
      const [guardando, setGuardando] = useState(false);
      const [usuarios, setUsuarios] = useState([]);
      const [registrosPendientes, setRegistrosPendientes] = useState([]);
      const [form, setForm] = useState({ ...FORM_INICIAL });
      const [maximoEditadoManualmente, setMaximoEditadoManualmente] =
        useState(false);
      const codigoInputRef = useRef(null);

      /**
       * Ordena y deduplica los códigos pendientes para construir un datalist
       * equivalente al utilizado por FormularioEtiquetasIdentificadoras.
       *
       * El valor visible de cada opción es CODIGO y el contenido auxiliar es
       * DESCRIPCION. Cuando existen varias filas para el mismo código se conserva
       * la fila física menor, manteniendo numFila para la actualización.
       */
      const codigosDisponibles = useMemo(() => {
        const porCodigo = registrosPendientes
          .slice()
          .sort((a, b) => {
            const comparacionCodigo = normalizarTexto_(a?.codigo).localeCompare(
              normalizarTexto_(b?.codigo),
              "es",
              { numeric: true, sensitivity: "base" }
            );

            if (comparacionCodigo !== 0) return comparacionCodigo;
            return Number(a?.numFila || 0) - Number(b?.numFila || 0);
          })
          .reduce((mapa, registro) => {
            const codigo = normalizarTexto_(registro?.codigo);
            if (codigo && !mapa[codigo]) {
              mapa[codigo] = registro;
            }
            return mapa;
          }, {});

        return Object.values(porCodigo);
      }, [registrosPendientes]);

      /** Mapa de acceso O(1) por código normalizado. */
      const mapaRegistros = useMemo(() => {
        return codigosDisponibles.reduce((mapa, registro) => {
          const codigo = normalizarTexto_(registro?.codigo);
          if (codigo) mapa[codigo] = registro;
          return mapa;
        }, {});
      }, [codigosDisponibles]);

      const registroSeleccionado = useMemo(() => {
        return mapaRegistros[normalizarTexto_(form.codigo)] || null;
      }, [mapaRegistros, form.codigo]);
      const existencia = toNumberSafe_(form.existencia);
      const porcentaje = toNumberSafe_(form.porcentaje);
      const maximoEditable = porcentaje === 100;

      const maximoCalculado = useMemo(() => {
        if (form.existencia === "" || form.porcentaje === "") return 0;
        if (porcentaje === 100) {
          if (!maximoEditadoManualmente) {
            return existencia;
          }

          /*
           * Un campo vacío durante la edición no debe restaurar EXISTENCIA.
           * El Service aplicará el fallback MAXIMO = EXISTENCIA si se guarda vacío.
           */
          return form.maximo === ""
            ? 0
            : toNumberSafe_(form.maximo);
        }
        if (porcentaje > 0 && porcentaje < 100) {
          return redondearADecena_((existencia / porcentaje) * 100);
        }
        return 0;
      }, [
        existencia,
        porcentaje,
        form.existencia,
        form.porcentaje,
        form.maximo,
        maximoEditadoManualmente
      ]);

      const resumen = useMemo(() => ({
        pendientes: registrosPendientes.length,
        usuarios: usuarios.length,
        maximo: maximoCalculado
      }), [registrosPendientes.length, usuarios.length, maximoCalculado]);

      const enfocarCodigo_ = () => {
        setTimeout(() => {
          codigoInputRef.current?.focus();
          codigoInputRef.current?.select?.();
        }, 0);
      };

      const hidratarBootstrap_ = data => {
        const listaUsuarios = Array.isArray(data?.usuarios) ? data.usuarios : [];
        const listaPendientes = Array.isArray(data?.registrosPendientes)
          ? data.registrosPendientes.filter(
              item => Number(item?.numFila || 0) >= 2
            )
          : [];
        setUsuarios(listaUsuarios);
        setRegistrosPendientes(listaPendientes);
        window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || {};
        window.DATA_ALMACEN_CACHE.ubicacionesMaxMinBootstrapV2 = {
          usuarios: listaUsuarios,
          registrosPendientes: listaPendientes
        };
      };

      useEffect(() => {
        try {
          notify_("Inicializando ubicaciones MaxMin...", "info", 1600, {
            title: "Cargando vista",
            sound: false
          });

          const cache = window.DATA_ALMACEN_CACHE?.ubicacionesMaxMinBootstrapV2 || null;
          if (cache) {
            hidratarBootstrap_(cache);
            setCargando(false);
            enfocarCodigo_();
            return;
          }

          google.script.run
            .withSuccessHandler(data => {
              hidratarBootstrap_(data || {});
              setCargando(false);
              notify_("Ubicaciones MaxMin cargadas correctamente.", "success", 1800, {
                title: "Sistema listo",
                sound: false
              });
              enfocarCodigo_();
            })
            .withFailureHandler(error => {
              console.error("Error cargando FormularioUbicacionesMaxMin:", error);
              setCargando(false);
              notify_(
                error?.message || "No se pudo cargar la base de ubicaciones MaxMin.",
                "error",
                4600,
                { title: "Error de carga", sound: true }
              );
            })
            .FormularioUbicacionesMaxMinController_getBootstrap();
        } catch (error) {
          console.error("Error inesperado inicializando Ubicaciones MaxMin:", error);
          setCargando(false);
          notify_("No se pudo inicializar la vista.", "error", 4200, {
            title: "Error inesperado",
            sound: true
          });
        }
      }, []);

      useEffect(() => {
        const root = document.getElementById("render-ubicaciones-maxmin");
        const parent = root?.parentElement;
        if (!parent) return;
        const previous = {
          overflow: parent.style.overflow,
          minHeight: parent.style.minHeight,
          height: parent.style.height
        };
        parent.style.overflow = "hidden";
        parent.style.minHeight = "0";
        if (!parent.style.height) parent.style.height = "100%";
        return () => {
          parent.style.overflow = previous.overflow;
          parent.style.minHeight = previous.minHeight;
          parent.style.height = previous.height;
        };
      }, []);

      const actualizarCodigo_ = value => {
        setMaximoEditadoManualmente(false);
        setForm(previous => ({
          ...previous,
          codigo: normalizarTexto_(value),
          existencia: "",
          porcentaje: "",
          maximo: ""
        }));
      };

      /**
       * Actualiza el porcentaje y prepara MAXIMO para el caso de 100%.
       *
       * Al llegar a 100%, el valor propuesto es EXISTENCIA. El campo permanece
       * editable para permitir un máximo menor cuando existe material excedente.
       */
      const actualizarPorcentaje_ = value => {
        const limpio = limpiarEntero_(value).slice(0, 3);
        const limitado = limpio === ""
          ? ""
          : String(Math.min(100, Number(limpio)));
        const esCien = Number(limitado) === 100;

        setMaximoEditadoManualmente(false);
        setForm(previous => ({
          ...previous,
          porcentaje: limitado,
          maximo: esCien ? previous.existencia : ""
        }));
      };

      /**
       * Actualiza EXISTENCIA y sincroniza MAXIMO mientras el valor al 100% no
       * haya sido reemplazado manualmente.
       */
      const actualizarExistencia_ = value => {
        const existenciaLimpia = limpiarEntero_(value);
        setForm(previous => ({
          ...previous,
          existencia: existenciaLimpia,
          maximo:
            Number(previous.porcentaje) === 100 &&
            !maximoEditadoManualmente
              ? existenciaLimpia
              : previous.maximo
        }));
      };

      /**
       * Registra una captura manual de MAXIMO para el caso de 100%.
       *
       * El vacío se conserva en el estado para que el usuario pueda borrar el valor
       * propuesto y escribir otro sin que React restaure EXISTENCIA inmediatamente.
       */
      const actualizarMaximoManual_ = value => {
        setMaximoEditadoManualmente(true);
        setForm(previous => ({
          ...previous,
          maximo: limpiarEntero_(value)
        }));
      };

      const validarForm_ = () => {
        if (!form.usuario) return "Selecciona un usuario responsable.";
        if (!registroSeleccionado) {
          return "Selecciona un código pendiente válido de la lista.";
        }
        if (form.existencia === "") return "Captura la existencia actual.";
        if (existencia < 0) return "La existencia no puede ser negativa.";
        if (!porcentaje || porcentaje < 1 || porcentaje > 100) {
          return "El porcentaje debe estar entre 1 y 100.";
        }
        if (porcentaje < 100 && maximoCalculado < existencia) {
          return "Con un porcentaje menor a 100, el máximo no puede ser menor que la existencia.";
        }
        return "";
      };

      const guardar_ = event => {
        event.preventDefault();
        const error = validarForm_();
        if (error) {
          notify_(error, "warning", 3600, {
            title: "Validación pendiente",
            sound: true
          });
          return;
        }

        const payload = {
          numFila: Number(registroSeleccionado.numFila),
          usuario: form.usuario,
          codigo: registroSeleccionado.codigo,
          existencia,
          porcentaje,
          maximo:
            porcentaje === 100
              ? form.maximo
              : maximoCalculado
        };

        setGuardando(true);
        notify_("Guardando parametrización...", "info", 1500, {
          title: "Procesando",
          sound: false
        });

        google.script.run
          .withSuccessHandler(() => {
            setGuardando(false);
            const restantes = registrosPendientes.filter(
              item => item.numFila !== registroSeleccionado.numFila
            );
            setRegistrosPendientes(restantes);
            window.DATA_ALMACEN_CACHE = window.DATA_ALMACEN_CACHE || {};
            window.DATA_ALMACEN_CACHE.ubicacionesMaxMinBootstrapV2 = {
              usuarios,
              registrosPendientes: restantes
            };
            window.DATA_ALMACEN_CACHE.registrosPendientesUbicacionesMaxMin = restantes;
            window.DATA_ALMACEN_CACHE.codigosPendientesUbicacionesMaxMin = [
              ...new Set(
                restantes
                  .map(item => normalizarTexto_(item.codigo))
                  .filter(Boolean)
              )
            ];
            setMaximoEditadoManualmente(false);
            setForm(previous => ({
              ...FORM_INICIAL,
              usuario: previous.usuario
            }));
            notify_("Ubicación parametrizada correctamente.", "success", 2400, {
              title: "Registro actualizado",
              sound: true
            });
            enfocarCodigo_();
          })
          .withFailureHandler(error => {
            console.error("Error guardando Ubicaciones MaxMin:", error);
            setGuardando(false);
            notify_(
              error?.message || "No se pudo guardar el registro.",
              "error",
              5200,
              { title: "Error al guardar", sound: true }
            );
          })
          .FormularioUbicacionesMaxMinController_actualizar(
            registroSeleccionado.numFila,
            payload
          );
      };

      return (
        <div className="umm-app-shell flex flex-col h-full w-full relative">
          <div className="umm-main-layout">
            <div className="umm-left-panel border-r border-[#dadce0] bg-white px-6 pt-4 pb-6 shrink-0 z-10">
              <div className="umm-left-panel-inner">
                <form onSubmit={guardar_} className="min-h-full flex flex-col">
                  <div className="umm-form-grid">
                    <div className="umm-grid-usuario umm-field-block">
                      <label className="umm-label ml-1">Usuario responsable</label>
                      <select
                        className="umm-form-input uppercase"
                        disabled={cargando || guardando}
                        value={form.usuario}
                        onChange={event => setForm(previous => ({
                          ...previous,
                          usuario: event.target.value
                        }))}
                      >
                        <option value="">Selecciona un usuario</option>
                        {usuarios.map((usuario, index) => {
                          const nombre = usuario.nombre || usuario.NOMBRE || "";
                          const id = usuario.idusuario || index;
                          return (
                            <option key={`${id}-${index}`} value={nombre}>
                              {nombre}
                            </option>
                          );
                        })}
                      </select>
                    </div>

                    <div className="umm-grid-codigo umm-field-block">
                      <label className="umm-label ml-1">
                        Código disponible ({codigosDisponibles.length})
                      </label>
                      <div className="relative group">
                        <input
                          ref={codigoInputRef}
                          list="lista-codigos-ubicaciones-maxmin"
                          className="umm-form-input umm-mono uppercase"
                          disabled={cargando || guardando}
                          placeholder={cargando ? "Cargando códigos..." : "Selecciona un código"}
                          value={form.codigo}
                          onChange={event => actualizarCodigo_(event.target.value)}
                          autoComplete="off"
                          aria-describedby="umm-ayuda-codigo"
                        />
                        <datalist id="lista-codigos-ubicaciones-maxmin">
                          {codigosDisponibles.map((registro, index) => (
                            <option
                              key={`${registro.codigo}-${registro.numFila}-${index}`}
                              value={registro.codigo}
                            >
                              {registro.descripcion || "SIN DESCRIPCIÓN"}
                            </option>
                          ))}
                        </datalist>
                        {registroSeleccionado && (
                          <div className="absolute right-3 top-3 text-green-500 animate-pulse">
                            <LocalIcon name="check-circle" size={16} />
                          </div>
                        )}
                      </div>
                      <span id="umm-ayuda-codigo" className="umm-helper">
                        La lista muestra el código y su descripción. Solo aparecen
                        códigos ACTIVO con FECHA, HORA y USUARIO registrados.
                      </span>
                    </div>

                    <div className="umm-grid-producto">
                      {registroSeleccionado ? (
                        <div className="umm-product-card fade-in space-y-3">
                          <div className="flex items-start gap-2.5">
                            <div className="p-1.5 bg-gray-800 rounded-lg">
                              <LocalIcon name="tag" size={15} className="text-red-500" />
                            </div>
                            <div className="flex flex-col min-w-0">
                              <span className="text-[12px] font-black text-gray-500 uppercase tracking-[0.18em]">
                                Producto vinculado
                              </span>
                              <span className="text-white umm-mono text-[17px] font-black mt-1 break-all">
                                {registroSeleccionado.codigo}
                              </span>
                            </div>
                          </div>
                          <div className="flex items-start gap-2.5 border-t border-gray-800 pt-2.5">
                            <div className="p-1.5 bg-gray-800 rounded-lg">
                              <LocalIcon name="file-text" size={15} className="text-red-500" />
                            </div>
                            <div className="flex flex-col min-w-0">
                              <span className="text-[12px] font-black text-gray-500 uppercase tracking-[0.18em]">
                                Descripción
                              </span>
                              <span className="text-gray-300 text-[15px] font-bold leading-snug uppercase italic mt-1 break-words">
                                {registroSeleccionado.descripcion || "SIN DESCRIPCIÓN"}
                              </span>
                            </div>
                          </div>
                        </div>
                      ) : (
                        <div className="umm-product-placeholder">
                          <div className="text-[11px] font-black uppercase tracking-[0.18em]">
                            Esperando producto
                          </div>
                        </div>
                      )}
                    </div>

                    <div className="umm-grid-existencia umm-field-block">
                      <label className="umm-label ml-1">Existencia actual</label>
                      <input
                        type="text"
                        inputMode="numeric"
                        className="umm-form-input umm-mono"
                        disabled={!registroSeleccionado || guardando}
                        placeholder="Ej: 250"
                        value={form.existencia}
                        onChange={event =>
                          actualizarExistencia_(event.target.value)
                        }
                      />
                    </div>

                    <div className="umm-grid-porcentaje umm-field-block">
                      <label className="umm-label ml-1">Capacidad ocupada</label>
                      <div className="umm-percent-wrap">
                        <input
                          type="text"
                          inputMode="numeric"
                          className="umm-form-input umm-mono"
                          disabled={!registroSeleccionado || guardando}
                          placeholder="1 a 100"
                          value={form.porcentaje}
                          onChange={event => actualizarPorcentaje_(event.target.value)}
                        />
                        <span className="umm-percent-sign">%</span>
                      </div>
                    </div>

                    <div className="umm-grid-maximo umm-field-block">
                      <label className="umm-label ml-1">Máximo estimado</label>
                      <input
                        type="text"
                        inputMode="numeric"
                        className="umm-form-input umm-mono"
                        disabled={!registroSeleccionado || guardando || !maximoEditable}
                        readOnly={!maximoEditable}
                        placeholder={
                          maximoEditable
                            ? "Vacío toma la existencia"
                            : "Calculado automáticamente"
                        }
                        value={
                          maximoEditable
                            ? form.maximo
                            : (maximoCalculado || "")
                        }
                        onChange={event =>
                          actualizarMaximoManual_(event.target.value)
                        }
                      />
                      <span className="umm-helper">
                        {maximoEditable
                          ? "Con 100%, se propone la existencia. Puedes borrar el valor y capturar una capacidad menor si existe material excedente."
                          : "Con menos de 100%, el máximo se calcula y redondea a la decena más cercana."}
                      </span>
                    </div>

                    <div className="umm-grid-resumen">
                      <div className="umm-summary-card">
                        <div className="flex items-center justify-between mb-3">
                          <span className="inline-flex rounded-full px-3 py-1 text-[10px] font-black tracking-[0.14em] uppercase bg-white/10 border border-white/10">
                            Cálculo automático
                          </span>
                          <LocalIcon name="calculator" size={18} />
                        </div>
                        <div className="umm-summary-grid">
                          <div>
                            <span className="umm-summary-label">Existencia</span>
                            <span className="umm-summary-value">{existencia || 0}</span>
                          </div>
                          <div>
                            <span className="umm-summary-label">Ocupación</span>
                            <span className="umm-summary-value">{porcentaje || 0}%</span>
                          </div>
                          <div>
                            <span className="umm-summary-label">Máximo</span>
                            <span className="umm-summary-value">{maximoCalculado || 0}</span>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="umm-grid-accion">
                      <button
                        type="submit"
                        className="umm-action-btn"
                        disabled={cargando || guardando || !registroSeleccionado}
                      >
                        <LocalIcon
                          name={guardando ? "loader-2" : "save"}
                          size={25}
                          className={guardando ? "animate-spin" : ""}
                        />
                        {guardando ? "Guardando..." : "Guardar parametrización"}
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>

            <div className="umm-right-panel min-w-0">
              <div className="umm-toolbar">
                <div className="flex items-center gap-3 min-w-0">
                  <div className="w-11 h-11 rounded-2xl bg-[#1c1d1f] text-white flex items-center justify-center shadow-md shrink-0">
                    <LocalIcon name="warehouse" size={22} />
                  </div>
                  <div className="flex flex-col min-w-0">
                    <span className="text-[11px] font-black uppercase tracking-[0.22em] text-gray-400">
                      Ubicación del producto seleccionado
                    </span>
                    <span className="text-[15px] font-black uppercase tracking-[0.08em] text-gray-900 truncate">
                      {registroSeleccionado?.codigo || "Sin producto seleccionado"}
                    </span>
                  </div>
                </div>

                <div className="flex items-center gap-2 shrink-0">
                  <div className="px-3 py-2 rounded-xl bg-red-50 border border-red-100 text-red-700">
                    <span className="block text-[10px] font-black uppercase tracking-[0.16em]">Pendientes</span>
                    <span className="block text-[18px] font-black font-mono leading-none">{resumen.pendientes}</span>
                  </div>
                  <div className="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-slate-700">
                    <span className="block text-[10px] font-black uppercase tracking-[0.16em]">Usuarios</span>
                    <span className="block text-[18px] font-black font-mono leading-none">{resumen.usuarios}</span>
                  </div>
                </div>
              </div>

              <div className="umm-right-scroll">
                {!registroSeleccionado ? (
                  <div className="umm-empty-state">
                    <LocalIcon name="mouse-pointer-click" size={52} />
                    <p className="text-[13px] font-black uppercase tracking-[0.32em] text-gray-400">
                      Selecciona un producto
                    </p>
                    <p className="text-[12px] font-bold uppercase tracking-[0.08em] text-gray-300">
                      El panel mostrará la ubicación y parámetros del código seleccionado
                    </p>
                  </div>
                ) : (
                  <div className="p-6 fade-in">
                    <div className="umm-detail-card">
                      <div className="bg-[#1c1d1f] px-6 py-5 text-white">
                        <div className="text-[11px] font-black uppercase tracking-[0.22em] text-gray-400 mb-2">
                          Registro elegible
                        </div>
                        <div className="umm-mono text-[26px] font-black leading-none break-all">
                          {registroSeleccionado.codigo}
                        </div>
                        <div className="mt-3 text-[14px] font-bold uppercase text-gray-300 leading-snug">
                          {registroSeleccionado.descripcion || "SIN DESCRIPCIÓN"}
                        </div>
                      </div>

                      <div className="umm-detail-grid">
                        {[
                          ["Bodega", registroSeleccionado.bodega],
                          ["Ubicación", registroSeleccionado.ubicacion],
                          ["Zona bodega", registroSeleccionado.zonaBodega],
                          ["Zona abastecimiento", registroSeleccionado.zonaAbastecimiento],
                          ["Zona nivel", registroSeleccionado.zonaNivel],
                          ["Mínimo configurado", registroSeleccionado.minimo],
                          ["Fila física", registroSeleccionado.numFila]
                        ].map(([label, value]) => (
                          <div className="umm-detail-item" key={label}>
                            <div className="umm-detail-label">{label}</div>
                            <div className="umm-detail-value">{value || "SIN DATO"}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    const rootDiv = document.getElementById("render-ubicaciones-maxmin");
    if (!rootDiv) {
      notify_("No se encontró el contenedor de Ubicaciones MaxMin.", "error", 4200, {
        title: "Error de interfaz",
        sound: true
      });
      return;
    }

    if (window.__FORMULARIO_UBICACIONES_MAXMIN_ROOT__) {
      try {
        window.__FORMULARIO_UBICACIONES_MAXMIN_ROOT__.unmount();
      } catch (error) {
        console.warn("No se pudo desmontar la raíz previa de Ubicaciones MaxMin:", error);
      }
      window.__FORMULARIO_UBICACIONES_MAXMIN_ROOT__ = null;
    }

    try {
      window.__FORMULARIO_UBICACIONES_MAXMIN_ROOT__ = ReactDOM.createRoot(rootDiv);
      window.__FORMULARIO_UBICACIONES_MAXMIN_ROOT__.render(
        <VistaUbicacionesMaxMin />
      );
    } catch (error) {
      console.error("Error montando FormularioUbicacionesMaxMin:", error);
      notify_("Ocurrió un error al montar la vista.", "error", 4200, {
        title: "Error de montaje",
        sound: true
      });
    }
  };

  window.initVista = window.cargar_FormularioUbicacionesMaxMin;
  console.log(
    "[FormularioUbicacionesMaxMin] initVista definida:",
    typeof window.initVista
  );
</script>
