<script type="text/babel">
  window.cargar_VerificacionEntrada = () => {
    const { useState, useEffect, useMemo, useCallback, useRef } = React;
    const BATCH_SIZE = 4;
    const notify_ = (m, t = "info", d = 2800, o = {}) => {
      const f = window.notificar || window.lanzarNotificacion;
      if (typeof f === "function") f(m, t, d, o);
    };
    const str_ = (v) => String(v == null ? "" : v).trim(),
      upper_ = (v) => str_(v).toUpperCase(),
      num_ = (v) => (Number.isFinite(Number(v)) ? Number(v) : 0),
      fmt_ = (v) => num_(v).toLocaleString("es-MX", { maximumFractionDigits: 2 });
    const perf_ = {
      items: new Map(),
      start(name, meta = {}) {
        const id = `${name}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
        this.items.set(id, { name, meta, at: performance.now() });
        return id;
      },
      end(id, status = "ok", meta = {}) {
        const x = this.items.get(id);
        if (!x) return;
        this.items.delete(id);
        console.log(`[VE_CLIENT_PERF][${x.name}]`, {
          elapsedMs: +(performance.now() - x.at).toFixed(1),
          status,
          ...x.meta,
          ...meta,
        });
      },
    };
    function Icon({ name, size = 18, className = "" }) {
      const ref = useRef(null);
      useEffect(() => {
        if (!window.lucide || !ref.current) return;
        ref.current.innerHTML = "";
        const n = document.createElement("i");
        n.setAttribute("data-lucide", name || "circle");
        n.style.width = `${size}px`;
        n.style.height = `${size}px`;
        n.className = className;
        ref.current.appendChild(n);
        window.lucide.createIcons({ nodes: [n] });
      }, [name, size, className]);
      return <span ref={ref} />;
    }
    const MemoIcon = React.memo(Icon);
    function Metric({ label, value, tone = "" }) {
      return (
        <div className={`ve-metric ${tone}`}>
          <div className="ve-metric-value">{fmt_(value)}</div>
          <div className="ve-metric-label">{label}</div>
        </div>
      );
    }
    const statusVisual_ = (s) => {
      const v = upper_(s);
      if (["COMPLETO", "COMPLETA", "CERRADA_COMPLETA"].includes(v))
        return { chip: "ve-chip green", text: v };
      if (["PARCIAL", "PENDIENTE", "EN_CAPTURA", "PAUSADA"].includes(v))
        return { chip: "ve-chip amber", text: v || "PENDIENTE" };
      if (["SOBRANTE", "REQUIERE_REVISION", "CON_DIFERENCIAS"].includes(v))
        return { chip: "ve-chip red", text: v };
      return { chip: "ve-chip slate", text: v || "SIN ESTADO" };
    };
    async function sha256_(text) {
      const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return Array.from(new Uint8Array(b))
        .map((x) => x.toString(16).padStart(2, "0"))
        .join("")
        .toUpperCase();
    }
    function attr_(n, k) {
      if (!n) return "";
      const d = n.getAttribute(k);
      if (d != null) return d;
      const a = Array.from(n.attributes || []).find(
        (x) => x.localName === k || x.name.split(":").pop() === k,
      );
      return a ? a.value : "";
    }
    function first_(r, n) {
      return Array.from(r.getElementsByTagName("*")).find((x) => x.localName === n) || null;
    }
    function all_(r, n) {
      return Array.from(r.getElementsByTagName("*")).filter((x) => x.localName === n);
    }
    async function parseCfdiFile_(file) {
      if (!/\.xml$/i.test(file.name)) throw new Error("Selecciona un archivo XML.");
      if (file.size > 2097152) throw new Error("El XML excede 2 MB.");
      const text = await file.text();

                      </h3>
                      <p className="ve-upload-copy">
                        Selecciona el XML original para identificar proveedor, UUID, conceptos y
                        cantidades esperadas.
                      </p>
                      <input
                        ref={fileRef}
                        type="file"
                        accept=".xml,text/xml,application/xml"
                        hidden
                        onChange={(e) => processFile_(e.target.files?.[0])}
                      />
                      <button
                        className="ve-button primary ve-upload-button"
                        onClick={() => fileRef.current?.click()}
                        disabled={busy}
                      >
                        <MemoIcon name={busy ? "loader-2" : "upload-cloud"} />
                        {busy
                          ? "Analizando XML..."
                          : parsed
                            ? "Cambiar archivo XML"
                            : "Seleccionar archivo XML"}
                      </button>
                      <div className="ve-file-note">
                        Solo XML · Máximo 2 MB · CFDI 4.0 de ingreso
                      </div>
                    </div>
                    <aside className="ve-preview">
                      <h3 className="ve-preview-title">
                        {parsed ? "Resumen del documento" : "Antes de capturar"}
                      </h3>
                      {parsed ? (
                        <>
                          <div className="ve-preview-list">
                            {[
                              ["Proveedor", parsed.documento.nombreEmisor || "SIN NOMBRE"],
                              ["RFC emisor", parsed.documento.rfcEmisor],
                              ["UUID", parsed.documento.uuidCfdi],
                              ["Conceptos", parsed.conceptos.length],
                              ["Perfil", bootstrap?.proveedor?.nombre || "NO CONFIGURADO"],
                              ["Equivalencias", bootstrap?.equivalencias?.length || 0],
                            ].map(([l, v]) => (
                              <div className="ve-preview-row" key={l}>
                                <div className="ve-preview-label">{l}</div>
                                <div className="ve-preview-value">{v || "—"}</div>
                              </div>
                            ))}
                          </div>
                          <button
                            className="ve-button success w-full mt-4"
                            onClick={createSession_}
                            disabled={
                              busy ||
                              !bootstrap?.proveedor ||
                              !(bootstrap?.equivalencias?.length > 0)
                            }
                          >
                            <MemoIcon name="play-circle" />
                            Iniciar verificación
                          </button>
                        </>
                      ) : (
                        <div className="ve-empty-text">Carga el XML original para comenzar.</div>
                      )}
                    </aside>
                  </div>
                </div>
              ) : (
                <div className="ve-table-wrap ve-scroll">
                  <table className="ve-table">
                    <thead>
                      <tr>
                        <th style={{ width: 160 }}>Código</th>
                        <th style={{ width: 330 }}>Descripción</th>
                        <th style={{ width: 125 }}>Esperado</th>
                        <th style={{ width: 125 }}>Capturado</th>
                        <th style={{ width: 110 }}>Cajas</th>
                        <th style={{ width: 145 }}>Estado</th>
                        <th>Avance</th>
                      </tr>
                    </thead>
                    <tbody>
                      {detail.map((item) => (
                        <DetailRow
                          key={item.idDetalle}
                          item={item}
                          highlighted={highlightId === item.idDetalle}
                        />
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </main>
            {sessionOpen && (
              <div className="ve-close-bar">
                <div className={`ve-validation-state ${validationVisual.className}`}>
                  <div className="ve-validation-icon">
                    <MemoIcon
                      name={validationVisual.icon}
                      size={23}
                      className={validationState.status === "VALIDATING" ? "animate-spin" : ""}
                    />
                  </div>
                  <div>
                    <div className="ve-validation-eyebrow">{validationVisual.eyebrow}</div>
                    <div className="ve-validation-title">{validationState.title}</div>
                    <div className="ve-validation-detail">{validationState.detail}</div>
                  </div>
                </div>
                <button
                  className="ve-button danger"
                  onClick={() => setClosePanel(true)}
                  disabled={busy || queueBusy || scanQueue.length}
                >
                  <MemoIcon name="lock-keyhole" />
                  Cerrar recepción
                </button>
              </div>
            )}
          </section>
          {closePanel && (
            <div className="ve-modal-backdrop">
              <div className="ve-panel ve-enter">
                <div className="ve-panel-head">
                  <h3>Cerrar recepción</h3>
                  <button className="ve-button soft" onClick={() => setClosePanel(false)}>
                    Cancelar
                  </button>
                </div>
                <textarea
                  className="ve-textarea"
                  value={closeNote}
                  onChange={(e) => setCloseNote(e.target.value)}
                  placeholder="Observación obligatoria si existen diferencias..."
                />
                <p className="ve-help">
                  Faltante: {fmt_(summary.cantidadFaltante)} · Sobrante:{" "}
                  {fmt_(summary.cantidadSobrante)}
                </p>
                <button
                  className="ve-button danger w-full mt-3"
                  onClick={close_}
                  disabled={busy || queueBusy || scanQueue.length}
                >
                  <MemoIcon name="lock-keyhole" />
                  {busy ? "Cerrando..." : "Confirmar cierre"}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }
    const target = document.getElementById("render-verificacion-entrada");
    if (!target) {
      notify_("No se encontró el contenedor.", "error");
      return;
    }
    if (window.__VERIFICACION_ENTRADA_ROOT__) {
      try {
        window.__VERIFICACION_ENTRADA_ROOT__.unmount();
      } catch (e) {
        console.warn(e);
      }
    }
    window.__VERIFICACION_ENTRADA_ROOT__ = ReactDOM.createRoot(target);
    window.__VERIFICACION_ENTRADA_ROOT__.render(<View />);
  };
  window.initVista = window.cargar_VerificacionEntrada;
</script>
<!-- El servidor valida sesión, equivalencias, cantidad, unidad, duplicados e idempotencia. -->
