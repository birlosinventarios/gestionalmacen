<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                primary: '#d93025',
                dark: '#a50e0e',
                light: 'rgba(217, 48, 37, 0.20)',
                gray: '#696160',
                grayDark: '#454040',
                text: '#1c1d1f',
                textSec: '#5f6368'
              }
            },
            boxShadow: {
              'soft': '0 10px 25px rgba(0,0,0,0.1), 0 4px 10px rgba(0,0,0,0.05)',
              'brand-red': '0 4px 10px rgba(217, 48, 37, 0.1)',
            }
          }
        }
      }
    </script>

    <style>
      :root {
        --primary: #d93025;
        --primary-dark: #a50e0e;
        --bg-color: #f8f9fa;
        --text-main: #1c1d1f;
        --border-color: #dadce0;
      }
      body { margin: 0; padding: 0; height: 100vh; background-color: var(--bg-color); font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--text-main); overflow: hidden; }
      #root { height: 100%; }
      .animate-spin-slow { animation: spin 3s linear infinite; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .custom-scroll::-webkit-scrollbar { width: 6px; }
      .custom-scroll::-webkit-scrollbar-track { background: transparent; }
      .custom-scroll::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      const e = React.createElement;
      const { useState, useEffect, useMemo, useCallback } = React;

      const SummaryCard = ({ label, value, iconName, color, desc }) => {
        const colorClasses = {
          indigo: 'bg-brand-light text-brand-primary',
          amber: 'bg-orange-50 text-orange-600',
          emerald: 'bg-emerald-50 text-emerald-600',
        };

        useEffect(() => { 
          if(window.lucide) window.lucide.createIcons(); 
        }, [value]);

        return e('div', { className: "bg-white p-6 rounded-[1.5rem] border border-slate-200 shadow-soft flex items-start gap-5" },
          e('div', { className: `p-4 rounded-2xl ${colorClasses[color]}` }, 
            e('i', { 'data-lucide': iconName.toLowerCase(), style: { width: '24px', height: '24px' } })
          ),
          e('div', null,
            e('p', { className: "text-[10px] font-bold text-brand-textSec uppercase tracking-widest mb-1" }, label),
            e('div', { className: "flex items-baseline gap-2" },
              e('h4', { className: "text-3xl font-black text-brand-text" }, value),
              e('span', { className: "text-[10px] font-semibold text-brand-textSec" }, desc)
            )
          )
        );
      };

      function App() {
        const [data, setData] = useState([]);
        const [loading, setLoading] = useState(true);
        const [lastUpdate, setLastUpdate] = useState(null);
        const [bodegaActiva, setBodegaActiva] = useState('ALL');
        const [busqueda, setBusqueda] = useState('');

        const BODEGAS = [
          { id: 'B1', nombre: 'BODEGA 1', prefix: 'B1', icon: 'warehouse' },
          { id: 'B2', nombre: 'BODEGA 2', prefix: 'B2', icon: 'warehouse' },
          { id: 'B3', nombre: 'BODEGA 3', prefix: 'B3', icon: 'warehouse' },
          { id: 'BM', nombre: 'MOSTRADOR', prefix: 'BM', icon: 'shopping-cart' },
          { id: 'CB1', nombre: 'CASA BLANCA 1', prefix: 'CB1', icon: 'home' },
          { id: 'CB2', nombre: 'CASA BLANCA 2', prefix: 'CB2', icon: 'home' },
        ];

        const cargarDatos = useCallback((silencioso = false) => {
          if (!silencioso) setLoading(true);
          
          if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
              .withSuccessHandler((res) => {
                setData(res || []);
                setLoading(false);
                setLastUpdate(new Date().toLocaleTimeString());
                setTimeout(() => window.lucide.createIcons(), 100);
              })
              .withFailureHandler(() => setLoading(false))
              .obtenerTodaLaBaseExcedentes();
          } else {
            setTimeout(() => {
              setData([
                { CODIGO: 'EX-001', DESCRIPCION: 'VALVULA DE BOLA 2"', CANTIDAD: 12, UBICACION: 'B1-ESTANTE-A' },
                { CODIGO: 'EX-002', DESCRIPCION: 'CODO PVC 90 GRAD', CANTIDAD: 45, UBICACION: 'DISPONIBLE' },
                { CODIGO: 'EX-003', DESCRIPCION: 'TUBO ACERO 1/2', CANTIDAD: 8, UBICACION: 'CB1-PASILLO-2' }
              ]);
              setLoading(false);
              setLastUpdate(new Date().toLocaleTimeString());
            }, 800);
          }
        }, []);

        useEffect(() => {
          cargarDatos();
          const interval = setInterval(() => cargarDatos(true), 100000);
          return () => clearInterval(interval);
        }, [cargarDatos]);

        const stats = useMemo(() => {
          const inbox = data.filter(i => (i.UBICACION || '').toUpperCase().includes('DISPONIBLE')).length;
          return { total: data.length, inbox, ubicado: data.length - inbox };
        }, [data]);

        // Esta lista solo filtra por lo que escribes, ignorando la bodega activa
const dataFiltradaPorBusqueda = useMemo(() => {
  return data.filter(i => {
    const texto = `${i.CODIGO} ${i.DESCRIPCION}`.toLowerCase();
    return texto.includes(busqueda.toLowerCase());
  });
}, [data, busqueda]);

        const itemsFiltrados = useMemo(() => {
          return data
            .filter(i => {
              const ubi = (i.UBICACION || '').toUpperCase();
              const texto = `${i.CODIGO} ${i.DESCRIPCION}`.toLowerCase();
              const matchBusqueda = texto.includes(busqueda.toLowerCase());

              if (bodegaActiva === 'ALL') {
                return matchBusqueda;
              }

              // Buscamos el objeto de la bodega seleccionada para obtener su prefijo
              const bObj = BODEGAS.find(b => b.id === bodegaActiva);
              
              // CAMBIO CLAVE: Comparamos si la ubicación EMPIEZA con el prefijo (B1, BM, CB1, etc.)
              const matchBodega = ubi.startsWith(bObj.prefix.toUpperCase());

              return matchBodega && matchBusqueda;
            })
            .sort((a, b) => {
              const ubiA = (a.UBICACION || "").toLowerCase();
              const ubiB = (b.UBICACION || "").toLowerCase();
              const compUbicacion = ubiA.localeCompare(ubiB);
              if (compUbicacion !== 0) return compUbicacion;
              
              const codA = (a.CODIGO || "").toLowerCase();
              const codB = (b.CODIGO || "").toLowerCase();
              return codA.localeCompare(codB);
            });
        }, [data, bodegaActiva, busqueda]);

return e('div', { className: "flex h-screen overflow-hidden" },
  // --- ASIDE (SIDEBAR) ---
  e('aside', { className: "hidden md:flex w-72 bg-white border-r border-slate-200 flex-col shrink-0" },
    e('div', { className: "p-8 border-b border-slate-100 flex items-center gap-3" },
      e('div', { className: "bg-brand-primary p-2.5 rounded-xl text-white shadow-brand-red" }, e('i', { 'data-lucide': 'package' })),
      e('h1', { className: "font-black text-brand-text tracking-tight text-lg" }, "Excedentes")
    ),
    e('nav', { className: "flex-1 p-4 space-y-1 overflow-y-auto custom-scroll" },
      e('p', { className: "text-[10px] font-black text-brand-textSec uppercase tracking-widest px-4 mb-2 mt-2" }, "Navegación"),
e('button', { 
  onClick: () => setBodegaActiva('ALL'),
  className: `w-full flex items-center justify-between p-3.5 rounded-2xl transition-all ${bodegaActiva === 'ALL' ? 'bg-brand-primary text-white shadow-brand-red font-bold' : 'text-brand-textSec hover:bg-slate-50'}`
}, 
  e('div', { className: "flex items-center gap-3" }, e('i', { 'data-lucide': 'layout-dashboard', className: "w-5 h-5" }), "Vista General"),
  // Usamos dataFiltradaPorBusqueda para que el total general también reaccione al buscador
  e('span', { className: `text-[10px] px-2 py-0.5 rounded-full ${bodegaActiva === 'ALL' ? 'bg-brand-dark text-white' : 'bg-slate-100 text-brand-textSec'}` }, dataFiltradaPorBusqueda.length) 
),
      e('div', { className: "h-px bg-slate-100 my-4 mx-4" }),
      e('p', { className: "text-[10px] font-black text-brand-textSec uppercase tracking-widest px-4 mb-2" }, "Bodegas"),
BODEGAS.map(b => {
  const count = dataFiltradaPorBusqueda.filter(i => 
    (i.UBICACION || '').toUpperCase().startsWith(b.prefix.toUpperCase())
  ).length;

  // NUEVA LÓGICA DE RESALTADO:
  // Si hay algo escrito en la búsqueda Y hay stock en esta bodega...
  const tieneStockBuscado = busqueda.length > 0 && count > 0;
  
  // Determinamos el color de fondo:
  // 1. Si está activa -> Gris Oscuro
  // 2. Si tiene stock buscado -> Rojo muy suave (brand-light)
  // 3. Por defecto -> Transparente/Hover gris
  let bgColorClass = 'text-brand-textSec hover:bg-slate-50';
  if (bodegaActiva === b.id) {
    bgColorClass = 'bg-brand-grayDark text-white shadow-lg';
  } else if (tieneStockBuscado) {
    bgColorClass = 'bg-red-50 text-brand-primary border border-red-100 animate-pulse'; 
    // Añadí 'animate-pulse' para un efecto visual sutil de "encontrado"
  }

  return e('button', {
    key: b.id,
    onClick: () => setBodegaActiva(b.id),
    className: `w-full flex items-center justify-between p-3.5 rounded-2xl transition-all mb-1 ${bgColorClass}`
  }, 
    e('div', { className: "flex items-center gap-3" }, 
      e('i', { 'data-lucide': b.icon, className: "w-4 h-4" }), 
      b.nombre
    ),
    e('span', { 
      className: `text-[10px] px-2 py-0.5 rounded-full ${
        bodegaActiva === b.id ? 'bg-brand-gray text-white' : 
        tieneStockBuscado ? 'bg-brand-primary text-white' : 'bg-slate-100 text-brand-textSec'
      }` 
    }, count)
  );
})
    )
  ),

  // --- MAIN CONTENT ---
  e('main', { className: "flex-1 flex flex-col min-w-0 h-full" },
    // HEADER CON BUSCADOR INTELIGENTE
    e('header', { className: "h-20 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0" },
      e('div', { className: "relative w-full max-w-md" },
        e('i', { 'data-lucide': 'search', className: "absolute left-4 top-1/2 -translate-y-1/2 text-brand-textSec w-4 h-4" }),
        e('input', { 
          type: "text", 
          list: "listado-sugerencias", // Vinculamos al datalist
          placeholder: "Buscar por código o descripción...", 
          className: "w-full bg-slate-100 border-none rounded-2xl py-2.5 pl-11 pr-4 text-sm outline-none focus:ring-2 focus:ring-brand-primary transition-all",
          value: busqueda,
          onChange: (ev) => setBusqueda(ev.target.value)
        }),

busqueda && e('button', {
    onClick: () => setBusqueda(''),
    className: "absolute right-3 top-1/2 -translate-y-1/2 p-1.5 hover:bg-slate-200 rounded-xl text-brand-textSec transition-colors",
    title: "Limpiar búsqueda"
  }, e('i', { 'data-lucide': 'x', className: "w-4 h-4" })),
// DATALIST PARA SUGERENCIAS (Ordenado de A-Z)
e('datalist', { id: "listado-sugerencias" },
  [...new Set(data.map(i => i.CODIGO))]
    .sort((a, b) => a.localeCompare(b)) // <--- ESTO ORDENA LAS SUGERENCIAS
    .slice(0, 20) // Aumenté a 20 para darte más opciones visibles
    .map(cod => 
      e('option', { key: cod, value: cod })
    )
)
      ),
      e('div', { className: "flex items-center gap-6" },
        lastUpdate && e('div', { className: "text-right hidden sm:block" },
          e('p', { className: "text-[10px] font-bold text-brand-textSec uppercase" }, "Sincronizado"),
          e('p', { className: "text-xs font-black text-brand-text" }, lastUpdate)
        ),
        e('button', { 
          onClick: () => cargarDatos(), 
          className: `flex items-center gap-2 px-5 py-2.5 bg-white border border-slate-200 text-sm font-bold text-brand-text hover:bg-slate-50 rounded-2xl transition-all shadow-sm ${loading ? 'opacity-50 cursor-not-allowed' : ''}`
        }, 
          e('i', { 'data-lucide': 'refresh-cw', className: `w-4 h-4 ${loading ? 'animate-spin' : ''}` }),
          "Actualizar"
        )
      )
    ),

    // CUERPO DEL DASHBOARD
    e('div', { className: "flex-1 overflow-y-auto p-8 custom-scroll" },
      e('div', { className: "grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8" },
        e(SummaryCard, { label: "Total", value: stats.total, iconName: "Database", color: "indigo", desc: "Items" }),
        e(SummaryCard, { label: "Inbox", value: stats.inbox, iconName: "Clock", color: "amber", desc: "Pendientes" }),
        e(SummaryCard, { label: "Ubicados", value: stats.ubicado, iconName: "Package", color: "emerald", desc: "Asignados" })
      ),

      e('div', { className: "bg-white border border-slate-200 rounded-[1.5rem] shadow-soft overflow-hidden" },
        e('div', { className: "overflow-x-auto" },
          e('table', { className: "w-full text-left" },
            e('thead', { className: "bg-white border-b border-slate-100" },
              e('tr', null,
                ['Código', 'Descripción', 'Cant.', 'Ubicación'].map(h => e('th', { key: h, className: "px-8 py-4 text-[10px] font-black text-brand-textSec uppercase tracking-widest" }, h))
              )
            ),
            e('tbody', { className: "divide-y divide-slate-100" },
              itemsFiltrados.map((item, idx) => e('tr', { key: item.IDUNICO || idx, className: "hover:bg-slate-50 transition-colors" },
                e('td', { className: "px-8 py-4 font-bold text-brand-primary text-xs" }, item.CODIGO),
                e('td', { className: "px-8 py-4 text-sm font-semibold text-brand-text" }, item.DESCRIPCION),
                e('td', { className: "px-8 py-4 text-center font-black text-brand-text" }, item.CANTIDAD),
                e('td', { className: "px-8 py-4" }, 
                  e('span', { className: `text-[10px] font-bold px-3 py-1 rounded-full uppercase border ${item.UBICACION.toUpperCase().includes('DISPONIBLE') ? 'bg-orange-50 text-orange-600 border-orange-100' : 'bg-brand-light text-brand-primary border-brand-primary/10'}` }, 
                    item.UBICACION
                  )
                )
              ))
            )
          )
        ),
        itemsFiltrados.length === 0 && !loading && e('div', { className: "p-20 text-center text-brand-textSec font-bold" }, "Sin registros."),
        loading && e('div', { className: "p-20 text-center text-brand-textSec font-bold flex flex-col items-center gap-3" }, 
          e('div', { className: "w-6 h-6 border-2 border-brand-primary border-t-transparent rounded-full animate-spin" }),
          "Sincronizando..."
        )
      )
    )
  )
);
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(e(App));
      window.onload = () => setTimeout(() => window.lucide.createIcons(), 500);
    </script>
  </body>
</html>
