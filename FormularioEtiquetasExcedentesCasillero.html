    <script>
      let colaDeImpresion = [];
      const MEDIDAS_FIJAS = { alto: 8, ancho: 12.5 }; // Definidas aquí directamente

      window.onload = function() {
        google.script.run.withSuccessHandler(res => {
          const dl = document.getElementById('listaCodigos');
          res.forEach(c => { 
            let o = document.createElement('option'); 
            o.value = c.toString().toUpperCase(); 
            dl.appendChild(o); 
          });
        }).obtenerTodosLosCodigos();
      };

      function buscarPorCodigo() {
        const cod = document.getElementById('codigoInput').value.trim().toUpperCase();
        if (!cod) return;

        // Feedback visual
        document.getElementById('descripcionInput').value = "Buscando...";
        document.getElementById('idInput').value = "Buscando...";

        google.script.run.withSuccessHandler(res => {
          if (res.encontrado) {
            document.getElementById('descripcionInput').value = res.descripcion;
            document.getElementById('idInput').value = res.id || "N/A"; 
            // Actualizamos el input para que el usuario vea el código limpio
            document.getElementById('codigoInput').value = cod; 
          } else {
            lanzarNotificacion("❌ Producto no encontrado", "error");
            limpiarCampos();
          }
        }).buscarProductoPorCodigo(cod);
        }

      function agregarALista() {
          const cod = document.getElementById('codigoInput').value.trim().toUpperCase();
          const desc = document.getElementById('descripcionInput').value;
          const cant = document.getElementById('cantidadInput').value;
          const idProducto = document.getElementById('idInput').value;
          const numCajas = parseInt(document.getElementById('cajasInput').value) || 1;

          if (!cod || !cant || numCajas <= 0 || desc === "Buscando...") {
            lanzarNotificacion("⚠️ Revisa los datos o espera al producto", "error");
            return;
          }

          const ahora = new Date();
          const pad = (n) => n.toString().padStart(2, '0');
          const marcaTiempoBase = ahora.getFullYear() + pad(ahora.getMonth() + 1) + pad(ahora.getDate()) + 
                                  pad(ahora.getHours()) + pad(ahora.getMinutes()) + pad(ahora.getSeconds());

          for (let i = 1; i <= numCajas; i++) {
            // FORMATO: marcatiempobase&idcodigo&#cajacorrespondiente
            const folioGenerado = `${marcaTiempoBase}${idProducto}${i}`;

            colaDeImpresion.push({ 
              codigo: cod, 
              descripcion: desc, 
              cantidad: cant,
              id: idProducto,
              idUnico: folioGenerado,
              cajaNo: i,
              totalCajas: numCajas,
              fecha: ahora.toLocaleDateString(),
              ...MEDIDAS_FIJAS 
            });
          }

          actualizarVista();
          limpiarCampos(); // Usamos la que ya tenías definida
          lanzarNotificacion(`✅ ${numCajas} etiquetas listas`);
      }
      

      function actualizarVista() {
          const listaUI = document.getElementById('listaEtiquetas');
          const btnPrint = document.getElementById('btnImprimirTodo');
          const textoBoton = document.getElementById('textoBoton'); 
          const contadorBadge = document.getElementById('contador'); 
          const plantilla = document.getElementById('plantillaExcedente').innerHTML;
          
          const cantidadItems = colaDeImpresion.length;

          // Actualizar contador
          if (contadorBadge) {
            contadorBadge.innerText = cantidadItems;
            contadorBadge.style.background = cantidadItems > 0 ? "var(--primary)" : "#ccc";
          }

          // Limpiar y renderizar
          listaUI.innerHTML = "";
          
          colaDeImpresion.forEach((item, index) => {
            let htmlFila = plantilla
              .replace(/{{INDEX}}/g, index)
              .replace("{{CODIGO}}", item.codigo)
              .replace("{{DESCRIPCION}}", item.descripcion)
              .replace("{{FOLIO}}", item.idUnico)
              .replace("{{CANTIDAD}}", item.cantidad)
              .replace("{{CAJA_NO}}", item.cajaNo)
              .replace("{{TOTAL_CAJAS}}", item.totalCajas);

            listaUI.insertAdjacentHTML('beforeend', htmlFila);
          });

          // Control del botón de impresión
          if (cantidadItems > 0) {
            btnPrint.classList.add('visible');
            textoBoton.innerText = `Imprimir Lote (${cantidadItems})`;
          } else {
            btnPrint.classList.remove('visible');
            textoBoton.innerText = "Imprimir";
          }
        }

      function quitar(index) {
        colaDeImpresion.splice(index, 1);
        actualizarVista();
      }

      function limpiarCampos() {
        document.getElementById('codigoInput').value = "";
        document.getElementById('descripcionInput').value = "";
        document.getElementById('idInput').value = "";
        document.getElementById('codigoInput').focus();
      }

      // ESTA ES LA QUE NECESITAS PARA BORRAR TODO EL FORMULARIO
      function resetearFormularioCompleto() {
        limpiarCampos(); // Borra código, desc e ID
        document.getElementById('cajasInput').value = "1";
        document.getElementById('cantidadInput').value = "";
      }

      function lanzarNotificacion(msg, tipo = 'success') {
        const x = document.getElementById("snackbar");
        x.innerText = msg;
        x.className = "show " + tipo;
        setTimeout(() => { x.className = x.className.replace("show", ""); }, 2000);
      }

      function generar() {
  if (colaDeImpresion.length === 0) {
    lanzarNotificacion("⚠️ La fila está vacía", "error");
    return;
  }

  const btn = document.getElementById('btnImprimirTodo');
  const textoBoton = document.getElementById('textoBoton');
  
  btn.disabled = true;
  textoBoton.innerText = "⏳ Generando...";

  // --- PASO 1: Abrir ventana vacía con el Spinner ---
  var win = window.open("", "_blank");
  if (!win) {
    lanzarNotificacion("⚠️ Ventana bloqueada. Permite los pop-ups.");
    btn.disabled = false;
    textoBoton.innerText = "Imprimir";
    return;
  }

  // Escribimos el cargador visual (el que te gustó)
  win.document.write(`
    <html>
      <head>
        <title>Generando Etiquetas...</title>
        <style>
          body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; color: #5f6368; background-color: #f8f9fa; }
          .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #d93025; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
          @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
          h3 { font-weight: 400; }
        </style>
      </head>
      <body>
        <div class="spinner"></div>
        <h3>Preparando etiquetas de excedentes...</h3>
        <p>Guardando en base de datos y generando vista.</p>
      </body>
    </html>
  `);
  win.document.close();

  // --- PASO 2: Mandar datos al servidor ---
  google.script.run
    .withSuccessHandler(function(htmlGenerado) {
      // PASO 3: Inyectar el HTML real que nos devuelve el servidor
      win.document.open();
      win.document.write(htmlGenerado);
      win.document.close();

      // Reset de la interfaz local
      colaDeImpresion = [];
      actualizarVista();
      resetearFormularioCompleto();
      btn.disabled = false;
      textoBoton.innerText = "Imprimir";
      lanzarNotificacion("✅ Etiquetas generadas con éxito");
    })
    .withFailureHandler(function(err) {
      win.close();
      alert("Error en el servidor: " + err);
      btn.disabled = false;
      textoBoton.innerText = "Imprimir";
    })
    .procesarLoteEtiquetasExcedentes(colaDeImpresion);
}
                     


    </script>
